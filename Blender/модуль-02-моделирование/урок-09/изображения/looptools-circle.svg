<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="880" height="400" fill="#16161f"/>
  <text x="440" y="40" fill="#e8e8f0" font-size="24" font-weight="700" text-anchor="middle">Loop Tools → Circle: кривой край → идеальный круг</text>

  <!-- ДО: рваный эллипс -->
  <g>
    <text x="200" y="90" fill="#ef6b6b" font-size="18" font-weight="700" text-anchor="middle">ДО — после Boolean</text>
    <rect x="90" y="110" width="220" height="200" fill="#20202c" stroke="#44465a" stroke-width="2"/>
    <!-- рваная петля вершин -->
    <polygon points="140,210 165,165 210,150 258,172 272,210 255,255 205,268 158,250"
             fill="#0e0e15" stroke="#ff7a1a" stroke-width="3"/>
    <circle cx="140" cy="210" r="5" fill="#ff7a1a"/><circle cx="165" cy="165" r="5" fill="#ff7a1a"/>
    <circle cx="210" cy="150" r="5" fill="#ff7a1a"/><circle cx="258" cy="172" r="5" fill="#ff7a1a"/>
    <circle cx="272" cy="210" r="5" fill="#ff7a1a"/><circle cx="255" cy="255" r="5" fill="#ff7a1a"/>
    <circle cx="205" cy="268" r="5" fill="#ff7a1a"/><circle cx="158" cy="250" r="5" fill="#ff7a1a"/>
    <text x="200" y="345" fill="#9a9ab0" font-size="14" text-anchor="middle">рваный эллипс, вершины «едут»</text>
  </g>

  <!-- стрелка -->
  <g>
    <line x1="350" y1="210" x2="470" y2="210" stroke="#5be38f" stroke-width="4"/>
    <polygon points="470,200 492,210 470,220" fill="#5be38f"/>
    <text x="421" y="193" fill="#5be38f" font-size="13" font-weight="700" text-anchor="middle">LoopTools</text>
    <text x="421" y="235" fill="#5be38f" font-size="13" font-weight="700" text-anchor="middle">Circle</text>
  </g>

  <!-- ПОСЛЕ: идеальный круг -->
  <g>
    <text x="680" y="90" fill="#5be38f" font-size="18" font-weight="700" text-anchor="middle">ПОСЛЕ — Circle</text>
    <rect x="570" y="110" width="220" height="200" fill="#20202c" stroke="#44465a" stroke-width="2"/>
    <circle cx="680" cy="210" r="62" fill="#0e0e15" stroke="#5be38f" stroke-width="3"/>
    <!-- 8 ровных вершин -->
    <circle cx="680" cy="148" r="5" fill="#5be38f"/><circle cx="724" cy="166" r="5" fill="#5be38f"/>
    <circle cx="742" cy="210" r="5" fill="#5be38f"/><circle cx="724" cy="254" r="5" fill="#5be38f"/>
    <circle cx="680" cy="272" r="5" fill="#5be38f"/><circle cx="636" cy="254" r="5" fill="#5be38f"/>
    <circle cx="618" cy="210" r="5" fill="#5be38f"/><circle cx="636" cy="166" r="5" fill="#5be38f"/>
    <text x="680" y="345" fill="#9a9ab0" font-size="14" text-anchor="middle">идеальный круг за один клик</text>
  </g>

  <text x="440" y="384" fill="#c7c7d6" font-size="15" text-anchor="middle">Выдели петлю края (Alt+ЛКМ) → ПКМ → LoopTools → Circle. В F9 есть Flatten и радиус.</text>
</svg>
