<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="'Segoe UI',Arial,sans-serif">
  <rect width="880" height="400" fill="#16161f"/>
  <text x="440" y="40" fill="#e8e8f0" font-size="24" font-weight="700" text-anchor="middle">Топология: из каких полигонов собрана модель</text>

  <!-- QUAD -->
  <g>
    <rect x="60" y="80" width="140" height="140" fill="#2e7d4f" fill-opacity="0.35" stroke="#5be38f" stroke-width="3"/>
    <circle cx="60" cy="80" r="5" fill="#5be38f"/><circle cx="200" cy="80" r="5" fill="#5be38f"/>
    <circle cx="200" cy="220" r="5" fill="#5be38f"/><circle cx="60" cy="220" r="5" fill="#5be38f"/>
    <text x="130" y="158" fill="#e8e8f0" font-size="20" font-weight="700" text-anchor="middle">Квад</text>
    <text x="130" y="258" fill="#5be38f" font-size="17" font-weight="700" text-anchor="middle">4 угла 👍</text>
    <text x="130" y="282" fill="#9a9ab0" font-size="13" text-anchor="middle">ровно делится,</text>
    <text x="130" y="300" fill="#9a9ab0" font-size="13" text-anchor="middle">дружит со сглаживанием</text>
  </g>

  <!-- TRI -->
  <g>
    <polygon points="300,220 370,80 440,220" fill="#c9a227" fill-opacity="0.30" stroke="#f2cf4a" stroke-width="3"/>
    <circle cx="300" cy="220" r="5" fill="#f2cf4a"/><circle cx="370" cy="80" r="5" fill="#f2cf4a"/><circle cx="440" cy="220" r="5" fill="#f2cf4a"/>
    <text x="370" y="175" fill="#e8e8f0" font-size="20" font-weight="700" text-anchor="middle">Тригон</text>
    <text x="370" y="258" fill="#f2cf4a" font-size="17" font-weight="700" text-anchor="middle">3 угла 🟡</text>
    <text x="370" y="282" fill="#9a9ab0" font-size="13" text-anchor="middle">ок для жёстких</text>
    <text x="370" y="300" fill="#9a9ab0" font-size="13" text-anchor="middle">деталей и игр</text>
  </g>

  <!-- N-GON -->
  <g>
    <polygon points="540,120 620,90 680,140 660,210 575,215 520,170" fill="#b23b3b" fill-opacity="0.30" stroke="#ef6b6b" stroke-width="3"/>
    <circle cx="540" cy="120" r="5" fill="#ef6b6b"/><circle cx="620" cy="90" r="5" fill="#ef6b6b"/><circle cx="680" cy="140" r="5" fill="#ef6b6b"/>
    <circle cx="660" cy="210" r="5" fill="#ef6b6b"/><circle cx="575" cy="215" r="5" fill="#ef6b6b"/><circle cx="520" cy="170" r="5" fill="#ef6b6b"/>
    <text x="600" y="160" fill="#e8e8f0" font-size="20" font-weight="700" text-anchor="middle">N-gon</text>
    <text x="600" y="258" fill="#ef6b6b" font-size="17" font-weight="700" text-anchor="middle">5+ углов 👎</text>
    <text x="600" y="282" fill="#9a9ab0" font-size="13" text-anchor="middle">кривится при</text>
    <text x="600" y="300" fill="#9a9ab0" font-size="13" text-anchor="middle">сглаживании</text>
  </g>

  <!-- EDGE LOOP -->
  <g>
    <rect x="740" y="80" width="90" height="140" fill="#20202c" stroke="#44465a" stroke-width="2"/>
    <line x1="740" y1="115" x2="830" y2="115" stroke="#44465a" stroke-width="2"/>
    <line x1="740" y1="150" x2="830" y2="150" stroke="#ff7a1a" stroke-width="5"/>
    <line x1="740" y1="185" x2="830" y2="185" stroke="#44465a" stroke-width="2"/>
    <line x1="785" y1="80" x2="785" y2="220" stroke="#44465a" stroke-width="2"/>
    <text x="785" y="258" fill="#ff7a1a" font-size="16" font-weight="700" text-anchor="middle">edge loop</text>
    <text x="785" y="282" fill="#9a9ab0" font-size="13" text-anchor="middle">Alt+ЛКМ —</text>
    <text x="785" y="300" fill="#9a9ab0" font-size="13" text-anchor="middle">вся петля сразу</text>
  </g>

  <text x="440" y="360" fill="#c7c7d6" font-size="16" text-anchor="middle">Стремись к <tspan fill="#5be38f" font-weight="700">квадам</tspan>: чистая сетка легко режется, сглаживается и не ломается.</text>
  <text x="440" y="386" fill="#8a8a9c" font-size="13" text-anchor="middle">Петлю и кольцо рёбер выделяй Alt+ЛКМ / Ctrl+Alt+ЛКМ — не по одному ребру.</text>
</svg>
