<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 0.1: Что такое ИИ, ML и нейросети</title>
<style>
  :root{
    --bg1:#4338ca; --bg2:#06b6d4; --card:#ffffff; --ink:#1f2937;
    --accent:#4f46e5; --ok:#16a34a; --bad:#dc2626; --soft:#e0e7ff;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Как соотносятся ИИ, ML и глубокое обучение (DL)?",
   a:["Это одно и то же","Матрёшка: DL ⊂ ML ⊂ ИИ","ML шире ИИ","DL шире ИИ"],c:1,
   e:"Глубокое обучение — часть ML, а ML — часть ИИ. DL ⊂ ML ⊂ AI."},
  {q:"Чем машинное обучение отличается от обычного программирования?",
   a:["Ничем","Программа сама находит правила по примерам, а не получает их от человека","ML быстрее","ML не нужен код"],c:1,
   e:"В обычном программировании правила пишет человек (if/else), в ML программа выводит их из данных."},
  {q:"Спам-фильтр (письмо → спам/не спам) — это какая задача?",
   a:["Регрессия","Классификация (с учителем)","Кластеризация","Генерация"],c:1,
   e:"Ответы-категории (спам/не спам) при наличии размеченных примеров — это классификация."},
  {q:"Предсказать цену дома (число) по его признакам — это...",
   a:["Классификация","Регрессия","Кластеризация","Обучение с подкреплением"],c:1,
   e:"Предсказание числа — регрессия (тоже обучение с учителем)."},
  {q:"«Разбей покупателей на группы, ответов нет» — это...",
   a:["Классификация","Кластеризация (без учителя)","Регрессия","Генерация"],c:1,
   e:"Нет готовых ответов, ищем структуру сами → кластеризация (unsupervised)."},
  {q:"AlphaGo училась играть через миллионы партий с наградами. Это...",
   a:["Обучение с учителем","Обучение с подкреплением","Кластеризация","Регрессия"],c:1,
   e:"Агент учится через награды/штрафы — обучение с подкреплением (reinforcement)."},
  {q:"ChatGPT и Midjourney создают новый текст/картинки. Это задача...",
   a:["Классификация","Регрессия","Генерация (generative)","Кластеризация"],c:2,
   e:"Создание нового контента — генеративные модели."},
  {q:"Что из этого — задача БЕЗ учителя?",
   a:["Кластеризация покупателей","Распознавание кошки/собаки по фото","Предсказание цены","Спам-фильтр"],c:0,
   e:"Кластеризация не использует правильные ответы — это обучение без учителя."},
  {q:"Три главные причины бума ИИ именно сейчас:",
   a:["Деньги, реклама, мода","Много данных + мощные GPU + трансформеры (2017)","Новые языки программирования","Более быстрый интернет"],c:1,
   e:"Данные из интернета, параллельные вычисления на GPU и архитектура «трансформер»."},
  {q:"Что произошло в 2017 году?",
   a:["Вышел ChatGPT","Статья «Attention is All You Need» — появился трансформер","Придумали Python","Создали первый компьютер"],c:1,
   e:"В 2017 представили трансформер — архитектуру, на которой построены современные LLM."},
  {q:"Что такое тест Тьюринга?",
   a:["Экзамен по программированию","Проверка: сможет ли человек в переписке отличить машину от человека","Тест скорости компьютера","Проверка на вирусы"],c:1,
   e:"Если человек не может понять, машина перед ним или человек — тест пройден (Тьюринг, 1950)."},
  {q:"Почему GPU (видеокарты) важны для ИИ?",
   a:["Они дешёвые","Хорошо делают много параллельных вычислений сразу","Красиво светятся","Не ломаются"],c:1,
   e:"Обучение сетей — это тысячи однотипных операций; GPU считает их параллельно."},
  {q:"«Есть 1000 фото с подписями кошка/собака — учись их различать» — это...",
   a:["Обучение с учителем","Без учителя","С подкреплением","Генерация"],c:0,
   e:"Есть правильные ответы (подписи) → обучение с учителем."},
  {q:"🤔 Обычное программирование хорошо работает, когда...",
   a:["Правил слишком много и они непонятны","Правила понятны и их можно записать (if/else)","Данных миллионы","Нужна нейросеть"],c:1,
   e:"Когда правило чёткое — проще написать код. ML нужен там, где правил слишком много."},
  {q:"🤔 Какая мысль — главная итоговая мысль урока?",
   a:["ИИ — это фантастика далёкого будущего","ML учит компьютер на примерах, а не по жёстким правилам","Программировать не нужно","GPU не важны"],c:1,
   e:"Суть ML: учиться на данных вместо ручного написания всех правил."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🧠 Что такое ИИ, ML и нейросети</h1>
    <div class="sub">Викторина по уроку 0.1 · Нейросети</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! ИИ, ML, типы задач — база усвоена на отлично! 🧠';}
  else if(pct>=70){em='🎉';msg='Отлично! Разницу ИИ/ML/DL и типы задач понимаешь уверенно.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори 4 типа задач ML и причины бума (данные+GPU+трансформеры).';}
  else {em='💪';msg='Ещё разок! Загляни в summary — там матрёшка ИИ⊃ML⊃DL и типы задач.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
