<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="Segoe UI,system-ui,sans-serif"><rect width="900" height="620" fill="#f7f9fc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#4f46e5"/></marker></defs><text x="450" y="34" font-size="23" fill="#1f2937" text-anchor="middle">Что хотим получить от программы?</text><text x="450" y="61" font-size="14" fill="#64748b" text-anchor="middle">Читаем вопрос и идём по подписанным стрелкам</text><rect x="280" y="90" width="340" height="75" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="296" y="118" font-size="18" fill="#4338ca" text-anchor="start">Есть правильные ответы?</text><text x="296" y="146" font-size="15" fill="#1f2937" text-anchor="start">В учебных примерах</text><path d="M280 130 L165 210" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><text x="190" y="155" font-size="16" fill="#1f2937" text-anchor="start">ДА</text><path d="M620 130 L735 210" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><text x="670" y="155" font-size="16" fill="#1f2937" text-anchor="start">НЕТ</text><rect x="30" y="225" width="375" height="80" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="46" y="253" font-size="18" fill="#4338ca" text-anchor="start">Какой нужен ответ?</text><text x="46" y="281" font-size="15" fill="#1f2937" text-anchor="start">Название или количество?</text><rect x="500" y="225" width="370" height="110" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="516" y="253" font-size="18" fill="#4338ca" text-anchor="start">Ищем похожие группы</text><text x="516" y="281" font-size="15" fill="#1f2937" text-anchor="start">Кластеризация: группируем цветки</text><text x="516" y="306" font-size="15" fill="#1f2937" text-anchor="start">по размерам без подписанных видов</text><path d="M125 315 L125 370" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><path d="M320 315 L320 370" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="385" width="230" height="110" rx="10" fill="#dcfce7" stroke="#cbd5e1"/><text x="46" y="413" font-size="18" fill="#4338ca" text-anchor="start">Название → класс</text><text x="46" y="441" font-size="15" fill="#1f2937" text-anchor="start">Классификация</text><text x="46" y="466" font-size="15" fill="#1f2937" text-anchor="start">Например: вид ириса</text><rect x="285" y="385" width="230" height="110" rx="10" fill="#e0f2fe" stroke="#cbd5e1"/><text x="301" y="413" font-size="18" fill="#4338ca" text-anchor="start">Количество → число</text><text x="301" y="441" font-size="15" fill="#1f2937" text-anchor="start">Регрессия</text><text x="301" y="466" font-size="15" fill="#1f2937" text-anchor="start">Например: цена, ₽</text><rect x="550" y="385" width="320" height="110" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="566" y="413" font-size="18" fill="#4338ca" text-anchor="start">Отдельный способ обучения</text><text x="566" y="441" font-size="15" fill="#1f2937" text-anchor="start">Действия и награды:</text><text x="566" y="466" font-size="15" fill="#1f2937" text-anchor="start">обучение с подкреплением</text><rect x="30" y="555" width="840" height="40" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="46" y="581" font-size="14" fill="#713f12" text-anchor="start">💡 Сегодня идём по пути «есть ответы → нужен вид → классификация».</text></svg>