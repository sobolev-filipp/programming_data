<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Segoe UI,system-ui,sans-serif"><rect width="900" height="650" fill="#f7f9fc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#4f46e5"/></marker></defs><text x="450" y="34" font-size="23" fill="#1f2937" text-anchor="middle">Отложенные ответы не попадают в обучение</text><text x="450" y="61" font-size="14" fill="#64748b" text-anchor="middle">Каждая пара содержит размеры одного цветка и его известный вид</text><rect x="30" y="90" width="250" height="90" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="46" y="118" font-size="18" fill="#4338ca" text-anchor="start">150 пар X и y</text><text x="46" y="146" font-size="15" fill="#1f2937" text-anchor="start">Один цветок = одна строка</text><path d="M155 190 L155 225" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><rect x="30" y="240" width="250" height="100" rx="10" fill="#dcfce7" stroke="#cbd5e1"/><text x="46" y="268" font-size="18" fill="#4338ca" text-anchor="start">120 учебных пар</text><text x="46" y="296" font-size="15" fill="#1f2937" text-anchor="start">X_train: 120 × 4</text><text x="46" y="321" font-size="15" fill="#1f2937" text-anchor="start">y_train: 120 ответов</text><path d="M290 290 L380 290" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><rect x="395" y="240" width="190" height="100" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="411" y="268" font-size="18" fill="#4338ca" text-anchor="start">fit</text><text x="411" y="296" font-size="15" fill="#1f2937" text-anchor="start">Размеры + ответы</text><text x="411" y="321" font-size="15" fill="#1f2937" text-anchor="start">Обучаем модель</text><path d="M595 290 L660 290" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><rect x="675" y="240" width="195" height="100" rx="10" fill="#dcfce7" stroke="#cbd5e1"/><text x="691" y="268" font-size="18" fill="#4338ca" text-anchor="start">Модель</text><text x="691" y="296" font-size="15" fill="#1f2937" text-anchor="start">Параметры</text><text x="691" y="321" font-size="15" fill="#1f2937" text-anchor="start">готовы</text><path d="M280 140 L370 140" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><rect x="385" y="90" width="270" height="90" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="401" y="118" font-size="18" fill="#4338ca" text-anchor="start">30 отложенных пар</text><text x="401" y="146" font-size="15" fill="#1f2937" text-anchor="start">X_test и y_test</text><path d="M520 190 L520 380" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><rect x="385" y="395" width="240" height="100" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="401" y="423" font-size="18" fill="#4338ca" text-anchor="start">predict(X_test)</text><text x="401" y="451" font-size="15" fill="#1f2937" text-anchor="start">Только 30 строк размеров</text><text x="401" y="476" font-size="15" fill="#1f2937" text-anchor="start">Получаем 30 меток y_pred</text><path d="M770 350 L770 440" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><path d="M635 445 L660 445" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><rect x="675" y="395" width="195" height="100" rx="10" fill="#fef9c3" stroke="#cbd5e1"/><text x="691" y="423" font-size="18" fill="#4338ca" text-anchor="start">Сравнение</text><text x="691" y="451" font-size="15" fill="#1f2937" text-anchor="start">y_pred и y_test</text><text x="691" y="476" font-size="15" fill="#1f2937" text-anchor="start">Считаем совпадения</text><text x="35" y="420" font-size="16" fill="#1f2937" text-anchor="start">y_test ждёт проверки:</text><text x="35" y="448" font-size="16" fill="#1f2937" text-anchor="start">в fit его не передаём.</text><rect x="30" y="585" width="840" height="40" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="46" y="611" font-size="14" fill="#713f12" text-anchor="start">💡 150 × 0.2 = 30 на проверку; 150 − 30 = 120 на обучение.</text><path d="M665 135 L850 135 L850 380" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><text x="720" y="120" font-size="15" fill="#4338ca">y_test: ответы</text></svg>