<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Segoe UI,system-ui,sans-serif"><rect width="900" height="560" fill="#f7f9fc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#4f46e5"/></marker></defs><text x="450" y="34" font-size="23" fill="#1f2937" text-anchor="middle">Сначала учим, затем спрашиваем</text><text x="450" y="61" font-size="14" fill="#64748b" text-anchor="middle">Два этапа: стрелки показывают, что передаём программе</text><text x="30" y="100" font-size="17" fill="#1f2937" text-anchor="start">1. ОБУЧЕНИЕ: есть размеры и известные виды</text><rect x="30" y="120" width="280" height="125" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="46" y="148" font-size="18" fill="#4338ca" text-anchor="start">Подписанные примеры</text><text x="46" y="176" font-size="15" fill="#1f2937" text-anchor="start">5.1, 3.5, 1.4, 0.2 → setosa</text><text x="46" y="201" font-size="15" fill="#1f2937" text-anchor="start">Другие размеры → другой вид</text><text x="46" y="226" font-size="15" fill="#1f2937" text-anchor="start">Всего 120 учебных цветков</text><path d="M320 180 L385 180" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><rect x="400" y="120" width="180" height="125" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="416" y="148" font-size="18" fill="#4338ca" text-anchor="start">fit</text><text x="416" y="176" font-size="15" fill="#1f2937" text-anchor="start">Подбираем</text><text x="416" y="201" font-size="15" fill="#1f2937" text-anchor="start">параметры</text><path d="M590 180 L650 180" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><rect x="665" y="120" width="205" height="125" rx="10" fill="#dcfce7" stroke="#cbd5e1"/><text x="681" y="148" font-size="18" fill="#4338ca" text-anchor="start">Готовая модель</text><text x="681" y="176" font-size="15" fill="#1f2937" text-anchor="start">Параметры</text><text x="681" y="201" font-size="15" fill="#1f2937" text-anchor="start">сохранены</text><text x="30" y="300" font-size="17" fill="#1f2937" text-anchor="start">2. ПРИМЕНЕНИЕ: передаём только размеры</text><rect x="30" y="320" width="280" height="120" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="46" y="348" font-size="18" fill="#4338ca" text-anchor="start">Измерения одного цветка</text><text x="46" y="376" font-size="15" fill="#1f2937" text-anchor="start">5.1, 3.5, 1.4, 0.2</text><text x="46" y="401" font-size="15" fill="#1f2937" text-anchor="start">Порядок тот же, единицы — см</text><path d="M320 375 L385 375" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><rect x="400" y="320" width="180" height="120" rx="10" fill="#e0e7ff" stroke="#cbd5e1"/><text x="416" y="348" font-size="18" fill="#4338ca" text-anchor="start">predict</text><text x="416" y="376" font-size="15" fill="#1f2937" text-anchor="start">Используем</text><text x="416" y="401" font-size="15" fill="#1f2937" text-anchor="start">готовую модель</text><path d="M590 375 L650 375" fill="none" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a)"/><rect x="665" y="320" width="205" height="120" rx="10" fill="#dcfce7" stroke="#cbd5e1"/><text x="681" y="348" font-size="18" fill="#4338ca" text-anchor="start">Ответ</text><text x="681" y="376" font-size="15" fill="#1f2937" text-anchor="start">Например: setosa</text><text x="681" y="401" font-size="15" fill="#1f2937" text-anchor="start">Это предположение</text><rect x="30" y="505" width="840" height="40" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="46" y="531" font-size="14" fill="#713f12" text-anchor="start">💡 fit меняет параметры. predict применяет их к переданным измерениям.</text></svg>