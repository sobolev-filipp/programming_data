<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Segoe UI,system-ui,sans-serif"><rect width="900" height="450" fill="#f7f9fc"/><defs><marker id="a" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#4f46e5"/></marker></defs><text x="30" y="40" font-size="24" fill="#1f2937">Три части Iris: второй раз делим оставшиеся 120</text><rect x="30" y="90" width="200" height="85" rx="12" fill="#e0e7ff" stroke="#4f46e5"/><text x="45" y="120" font-size="20" fill="#1f2937">150 цветков</text><text x="45" y="150" font-size="16" fill="#1f2937">Весь набор</text><path d="M245 130 L320 130" stroke="#4f46e5" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="340" y="90" width="220" height="85" rx="12" fill="#e0e7ff" stroke="#4f46e5"/><text x="355" y="120" font-size="20" fill="#1f2937">120 в pool</text><text x="355" y="150" font-size="16" fill="#1f2937">80% от всех</text><path d="M575 130 L650 130" stroke="#4f46e5" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="670" y="90" width="200" height="85" rx="12" fill="#e0e7ff" stroke="#4f46e5"/><text x="685" y="120" font-size="20" fill="#1f2937">30 в test</text><text x="685" y="150" font-size="16" fill="#1f2937">20% от всех</text><path d="M450 185 L180 260" stroke="#4f46e5" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M450 185 L620 260" stroke="#4f46e5" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="65" y="275" width="270" height="85" rx="12" fill="#e0e7ff" stroke="#4f46e5"/><text x="80" y="305" font-size="20" fill="#1f2937">90 в train</text><text x="80" y="335" font-size="16" fill="#1f2937">75% от 120 = 60% всех</text><rect x="485" y="275" width="320" height="85" rx="12" fill="#e0e7ff" stroke="#4f46e5"/><text x="500" y="305" font-size="20" fill="#1f2937">30 в val</text><text x="500" y="335" font-size="16" fill="#1f2937">25% от 120 = 20% всех</text><rect x="30" y="385" width="840" height="45" rx="8" fill="#fef9c3"/><text x="45" y="414" font-size="15" fill="#1f2937">💡 Train учит веса. Val помогает выбрать вариант. Test оценивает после выбора.</text></svg>