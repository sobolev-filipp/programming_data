<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Segoe UI,system-ui,sans-serif"><rect width="900" height="460" fill="#f7f9fc"/><text x="30" y="38" font-size="24" fill="#1f2937">Состав поездок: делим на размер своей группы</text><rect x="30" y="80" width="840" height="130" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="48" y="110" font-size="20" fill="#1f2937">Все поездки: 150 объектов</text><rect x="48" y="128" width="350" height="60" rx="8" fill="#e0e7ff"/><text x="60" y="152" font-size="17" fill="#1f2937">Класс 0: 69 / 150 = 46.00%</text><text x="60" y="175" font-size="14" fill="#1f2937">Не дольше 30 минут</text><rect x="448" y="128" width="390" height="60" rx="8" fill="#dcfce7"/><text x="460" y="152" font-size="17" fill="#1f2937">Класс 1: 81 / 150 = 54.00%</text><text x="460" y="175" font-size="14" fill="#1f2937">Дольше 30 минут</text><rect x="30" y="240" width="840" height="130" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="48" y="270" font-size="20" fill="#1f2937">Test: 30 объектов</text><rect x="48" y="288" width="350" height="60" rx="8" fill="#e0e7ff"/><text x="60" y="312" font-size="17" fill="#1f2937">Класс 0: 14 / 30 = 46.67%</text><text x="60" y="335" font-size="14" fill="#1f2937">Не дольше 30 минут</text><rect x="448" y="288" width="390" height="60" rx="8" fill="#dcfce7"/><text x="460" y="312" font-size="17" fill="#1f2937">Класс 1: 16 / 30 = 53.33%</text><text x="460" y="335" font-size="14" fill="#1f2937">Дольше 30 минут</text><rect x="30" y="405" width="840" height="38" rx="8" fill="#fef9c3"/><text x="45" y="430" font-size="15" fill="#1f2937">💡 Сравниваем доли классов между группами, а не количество и не accuracy.</text></svg>