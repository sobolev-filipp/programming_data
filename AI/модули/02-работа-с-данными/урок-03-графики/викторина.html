<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 2.3: Графики</title>
<style>
  :root{
    --bg1:#4338ca; --bg2:#06b6d4; --card:#ffffff; --ink:#1f2937;
    --accent:#4f46e5; --ok:#16a34a; --bad:#dc2626; --soft:#e0e7ff;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
 {
  "q": "Как принято импортировать Matplotlib?",
  "a": [
   "<code>import matplotlib as plt</code>",
   "<code>import matplotlib.pyplot as plt</code>",
   "<code>import matplotlib.plot as pyplot</code>",
   "<code>from matplotlib import pyplot</code>"
  ],
  "c": 1,
  "e": "Стандарт: import matplotlib.pyplot as plt."
 },
 {
  "q": "Какой график для связи ДВУХ величин (рост↔вес)?",
  "a": [
   "<code>plt.bar</code> (столбики категорий)",
   "<code>plt.scatter</code> (точки)",
   "<code>plt.hist</code> (гистограмма)",
   "<code>plt.pie</code> (круговая)"
  ],
  "c": 1,
  "e": "scatter — точки, показывает связь двух переменных."
 },
 {
  "q": "Какой график показывает РАСПРЕДЕЛЕНИЕ значений?",
  "a": [
   "<code>plt.scatter</code> (точки-облако)",
   "<code>plt.hist</code> (гистограмма)",
   "<code>plt.plot</code> (линия)",
   "<code>plt.bar</code> (столбики)"
  ],
  "c": 1,
  "e": "hist разбивает значения на корзины и показывает их частоту."
 },
 {
  "q": "Чем bar отличается от hist?",
  "a": [
   "Ничем особенным — это просто два имени одного графика",
   "bar — по готовым категориям, hist — по числам",
   "bar всегда рисуется ярче и с подписями",
   "hist работает только со строковыми столбцами"
  ],
  "c": 1,
  "e": "bar — по известным категориям, hist — по числовым диапазонам."
 },
 {
  "q": "Что ОБЯЗАТЕЛЬНО должно быть на каждом графике?",
  "a": [
   "Красивая анимация и 3D-эффект вращения",
   "Заголовок и подписи осей",
   "Трёхмерный вид и вращение мышкой",
   "Логотип автора в углу картинки"
  ],
  "c": 1,
  "e": "Без title/xlabel/ylabel график непонятен."
 },
 {
  "q": "Что показывает heatmap корреляций?",
  "a": [
   "Настоящие фотографии из набора данных",
   "Цветом — силу связи между признаками",
   "Сколько времени считался датасет",
   "Полный список всех ошибок в данных"
  ],
  "c": 1,
  "e": "Heatmap раскрашивает матрицу корреляций: ярко = сильная связь."
 },
 {
  "q": "Что за урок «Anscombe's Quartet»?",
  "a": [
   "Известная библиотека для построения трёхмерных графиков",
   "4 набора с одинаковыми числами, но разными графиками",
   "Особый тип ML-модели для таблиц",
   "Музыкальный квартет из учебника"
  ],
  "c": 1,
  "e": "Показывает, почему перед доверием статистике надо смотреть на график."
 },
 {
  "q": "Как в seaborn раскрасить точки по классу?",
  "a": [
   "<code>sns.scatterplot(data=df, x=.., y=.., color='class', legend=True)</code>",
   "<code>sns.scatterplot(data=df, x=.., y=.., hue='class')</code>",
   "<code>plt.color(df['class'])</code>",
   "<code>sns.paint(data=df, by='class')</code>"
  ],
  "c": 1,
  "e": "Параметр hue раскрашивает точки по значению столбца."
 },
 {
  "q": "Что делает <code>sns.regplot</code>?",
  "a": [
   "Только точки, без всякой линии тренда",
   "Точки + линию тренда (регрессии)",
   "Гистограмму распределения чисел",
   "Тепловую карту корреляций"
  ],
  "c": 1,
  "e": "regplot добавляет линию тренда поверх облака точек."
 },
 {
  "q": "Как нарисовать несколько графиков в одной фигуре?",
  "a": [
   "<code>plt.manygraphs(rows, cols, index)</code>",
   "<code>plt.subplot()</code> / <code>plt.subplots()</code>",
   "<code>plt.grid(rows, cols)</code>",
   "<code>plt.multi(nrows, ncols)</code>"
  ],
  "c": 1,
  "e": "subplot(rows, cols, idx) размещает графики сеткой."
 },
 {
  "q": "В каком порядке сохранять и показывать график?",
  "a": [
   "Сначала <code>show</code>, потом <code>savefig</code>",
   "Сначала <code>savefig</code>, потом <code>show</code>",
   "Порядок совсем не важен",
   "Только <code>show</code>"
  ],
  "c": 1,
  "e": "show() очищает фигуру; savefig после него сохранит пустоту."
 },
 {
  "q": "🤔 Зачем строить heatmap при первом знакомстве с датасетом?",
  "a": [
   "Чтобы датасет выглядел красивее на презентации",
   "Сразу видно, какие признаки связаны",
   "Чтобы сразу удалить все лишние данные",
   "Низачем — это просто картинка"
  ],
  "c": 1,
  "e": "Яркие клетки heatmap подсказывают полезные для модели признаки."
 }
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>📈 Графики: Matplotlib и Seaborn</h1>
    <div class="sub">Викторина по уроку 2.3 · Нейросети</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg="Идеально! Типы графиков, heatmap, seaborn — визуализация освоена! 📈";}
  else if(pct>=70){em='🎉';msg="Отлично! Когда какой график и как его подписать — ты знаешь.";}
  else if(pct>=40){em='👍';msg="Неплохо! Повтори: bar для категорий, hist для распределения; подписи обязательны.";}
  else {em='💪';msg="Ещё разок! Загляни в summary — там 4 типа графиков и seaborn-шпаргалка.";}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
