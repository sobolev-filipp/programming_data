<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <rect width="780" height="400" fill="#f7f9fc"/>
  <text x="390" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Как устроена картинка: Figure и Axes</text>
  <text x="390" y="57" text-anchor="middle" font-size="14" fill="#64748b">Figure — холст, Axes — один график на нём; subplot — сетка графиков</text>

  <!-- one figure one axes -->
  <text x="185" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">1 график</text>
  <rect x="55" y="98" width="260" height="190" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="70" y="118" font-size="12.5" font-weight="700" fill="#4338ca">Figure (холст)</text>
  <rect x="95" y="128" width="190" height="130" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <polyline points="105,240 140,200 175,215 210,165 245,180 275,140" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="190" y="278" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">Axes (один график)</text>
  <line x1="318" y1="140" x2="360" y2="140" stroke="#6366f1" stroke-width="2" marker-end="url(#f1)"/>
  <defs><marker id="f1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#6366f1"/></marker></defs>
  <text x="365" y="136" font-size="12" fill="#4338ca">обычный</text>
  <text x="365" y="152" font-size="12" font-family="monospace" fill="#4338ca">plt.plot()</text>

  <!-- subplot grid -->
  <text x="595" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">несколько (subplot 2×2)</text>
  <rect x="460" y="98" width="270" height="190" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2.5"/>
  <text x="475" y="118" font-size="12.5" font-weight="700" fill="#4338ca">Figure (один холст)</text>
  <!-- 4 mini axes -->
  <g>
    <rect x="480" y="128" width="110" height="65" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <polyline points="488,185 510,160 532,170 560,145" fill="none" stroke="#16a34a" stroke-width="2"/>
    <text x="535" y="145" font-size="10" fill="#15803d">axes[0,0]</text>
    <rect x="600" y="128" width="110" height="65" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <circle cx="615" cy="175" r="2.5" fill="#16a34a"/><circle cx="635" cy="165" r="2.5" fill="#16a34a"/><circle cx="655" cy="168" r="2.5" fill="#16a34a"/><circle cx="680" cy="150" r="2.5" fill="#16a34a"/>
    <text x="655" y="145" font-size="10" fill="#15803d">axes[0,1]</text>
    <rect x="480" y="200" width="110" height="65" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="490" y="240" width="12" height="20" fill="#16a34a"/><rect x="508" y="230" width="12" height="30" fill="#16a34a"/><rect x="526" y="220" width="12" height="40" fill="#16a34a"/>
    <text x="555" y="217" font-size="10" fill="#15803d">axes[1,0]</text>
    <rect x="600" y="200" width="110" height="65" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="612" y="245" width="9" height="15" fill="#16a34a"/><rect x="623" y="232" width="9" height="28" fill="#16a34a"/><rect x="634" y="222" width="9" height="38" fill="#16a34a"/><rect x="645" y="235" width="9" height="25" fill="#16a34a"/><rect x="656" y="248" width="9" height="12" fill="#16a34a"/>
    <text x="680" y="217" font-size="10" fill="#15803d">axes[1,1]</text>
  </g>

  <!-- tip -->
  <rect x="60" y="306" width="660" height="82" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="80" y="330" font-size="14" font-weight="700" fill="#854d0e">💬 Простыми словами:</text>
  <text x="80" y="353" font-size="13.5" fill="#854d0e">Figure — это лист бумаги, Axes — один нарисованный на нём график. Обычно нам хватает одного.</text>
  <text x="80" y="375" font-size="13.5" fill="#854d0e">Когда нужно показать несколько графиков рядом — делаем сетку: <tspan font-family="monospace" fill="#b45309">plt.subplot(2,2,i)</tspan> или <tspan font-family="monospace" fill="#b45309">plt.subplots(2,2)</tspan>.</text>
</svg>
