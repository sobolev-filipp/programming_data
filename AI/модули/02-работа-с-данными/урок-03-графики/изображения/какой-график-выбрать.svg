<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <rect width="800" height="420" fill="#f7f9fc"/>
  <text x="400" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">Какой график выбрать — 4 главных типа</text>
  <text x="400" y="60" text-anchor="middle" font-size="14.5" fill="#64748b">сначала реши, ЧТО хочешь показать — тип графика выбирается под это</text>

  <!-- plot -->
  <rect x="35" y="86" width="175" height="300" rx="12" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="122" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#4338ca">plt.plot()</text>
  <text x="122" y="131" text-anchor="middle" font-size="12.5" fill="#4338ca">линия</text>
  <g>
    <rect x="55" y="145" width="135" height="95" fill="#fff" stroke="#c7d2fe"/>
    <polyline points="60,230 85,190 110,205 135,160 160,175 185,150" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  </g>
  <text x="122" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">КАК МЕНЯЕТСЯ</text>
  <text x="122" y="286" text-anchor="middle" font-size="12.5" fill="#4338ca">во времени / по порядку</text>
  <text x="122" y="320" text-anchor="middle" font-size="12" fill="#6366f1">курс валюты, температура</text>
  <text x="122" y="338" text-anchor="middle" font-size="12" fill="#6366f1">по дням, рост со временем</text>

  <!-- scatter -->
  <rect x="222" y="86" width="175" height="300" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="309" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">plt.scatter()</text>
  <text x="309" y="131" text-anchor="middle" font-size="12.5" fill="#166534">точки</text>
  <g>
    <rect x="242" y="145" width="135" height="95" fill="#fff" stroke="#86efac"/>
    <circle cx="260" cy="225" r="3" fill="#16a34a"/><circle cx="278" cy="212" r="3" fill="#16a34a"/><circle cx="292" cy="205" r="3" fill="#16a34a"/><circle cx="305" cy="195" r="3" fill="#16a34a"/><circle cx="318" cy="200" r="3" fill="#16a34a"/><circle cx="330" cy="178" r="3" fill="#16a34a"/><circle cx="345" cy="170" r="3" fill="#16a34a"/><circle cx="360" cy="162" r="3" fill="#16a34a"/><circle cx="300" cy="215" r="3" fill="#16a34a"/><circle cx="335" cy="188" r="3" fill="#16a34a"/>
  </g>
  <text x="309" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">СВЯЗЬ ДВУХ величин</text>
  <text x="309" y="286" text-anchor="middle" font-size="12.5" fill="#166534">есть ли зависимость</text>
  <text x="309" y="320" text-anchor="middle" font-size="12" fill="#16a34a">рост↔вес, возраст↔цена</text>
  <text x="309" y="338" text-anchor="middle" font-size="12" fill="#16a34a">билета (как в корреляции)</text>

  <!-- bar -->
  <rect x="409" y="86" width="175" height="300" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="496" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">plt.bar()</text>
  <text x="496" y="131" text-anchor="middle" font-size="12.5" fill="#9a3412">столбики</text>
  <g>
    <rect x="429" y="145" width="135" height="95" fill="#fff" stroke="#fdba74"/>
    <rect x="440" y="195" width="20" height="45" fill="#ea580c"/><rect x="468" y="175" width="20" height="65" fill="#ea580c"/><rect x="496" y="160" width="20" height="80" fill="#ea580c"/><rect x="524" y="205" width="20" height="35" fill="#ea580c"/>
  </g>
  <text x="496" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">СКОЛЬКО в каждой</text>
  <text x="496" y="286" text-anchor="middle" font-size="12.5" fill="#9a3412">КАТЕГОРИИ (готовые группы)</text>
  <text x="496" y="320" text-anchor="middle" font-size="12" fill="#ea580c">учеников по классам,</text>
  <text x="496" y="338" text-anchor="middle" font-size="12" fill="#ea580c">продажи по месяцам</text>

  <!-- hist -->
  <rect x="596" y="86" width="175" height="300" rx="12" fill="#fae8ff" stroke="#a21caf" stroke-width="2"/>
  <text x="683" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#86198f">plt.hist()</text>
  <text x="683" y="131" text-anchor="middle" font-size="12.5" fill="#86198f">гистограмма</text>
  <g>
    <rect x="616" y="145" width="135" height="95" fill="#fff" stroke="#e9b8f0"/>
    <rect x="626" y="222" width="15" height="18" fill="#a21caf"/><rect x="641" y="205" width="15" height="35" fill="#a21caf"/><rect x="656" y="178" width="15" height="62" fill="#a21caf"/><rect x="671" y="160" width="15" height="80" fill="#a21caf"/><rect x="686" y="175" width="15" height="65" fill="#a21caf"/><rect x="701" y="200" width="15" height="40" fill="#a21caf"/><rect x="716" y="220" width="15" height="20" fill="#a21caf"/>
  </g>
  <text x="683" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#86198f">КАК РАСПРЕДЕЛЕНЫ</text>
  <text x="683" y="286" text-anchor="middle" font-size="12.5" fill="#86198f">числа по диапазонам</text>
  <text x="683" y="320" text-anchor="middle" font-size="12" fill="#a21caf">рост людей, оценки —</text>
  <text x="683" y="338" text-anchor="middle" font-size="12" fill="#a21caf">где густо, где редко (урок 1.6)</text>

  <!-- tip -->
  <rect x="80" y="394" width="640" height="22" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="400" y="409" text-anchor="middle" font-size="12.5" fill="#854d0e">💡 bar vs hist: bar — сколько в ГОТОВЫХ категориях; hist — как числа сами разбились по диапазонам.</text>
</svg>
