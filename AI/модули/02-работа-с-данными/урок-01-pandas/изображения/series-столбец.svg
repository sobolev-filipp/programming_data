<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <rect width="760" height="420" fill="#f7f9fc"/>
  <text x="380" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">Series — один столбец</text>
  <text x="380" y="66" text-anchor="middle" font-size="15" fill="#64748b">список значений, у каждого — свой индекс (номер)</text>

  <!-- code panel -->
  <rect x="40" y="95" width="300" height="120" rx="10" fill="#0f172a"/>
  <text x="60" y="128" font-size="15" fill="#a5b4fc" font-family="monospace">ages = pd.Series(</text>
  <text x="60" y="152" font-size="15" fill="#86efac" font-family="monospace">    [15, 14, 16, 15, 17]</text>
  <text x="60" y="176" font-size="15" fill="#a5b4fc" font-family="monospace">)</text>
  <text x="60" y="200" font-size="15" fill="#e2e8f0" font-family="monospace">print(ages)</text>

  <text x="360" y="162" font-size="30" fill="#4f46e5">→</text>

  <!-- series table: index | value -->
  <g font-size="17">
    <rect x="410" y="95" width="70" height="36" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="480" y="95" width="90" height="36" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="445" y="119" text-anchor="middle" font-weight="700" fill="#4338ca" font-size="14">index</text>
    <text x="525" y="119" text-anchor="middle" font-weight="700" fill="#4338ca" font-size="14">value</text>

    <g fill="#1f2937">
      <rect x="410" y="131" width="70" height="34" fill="#eef2ff" stroke="#c7d2fe"/><rect x="480" y="131" width="90" height="34" fill="#fff" stroke="#c7d2fe"/>
      <text x="445" y="154" text-anchor="middle" font-weight="700" fill="#4338ca">0</text><text x="525" y="154" text-anchor="middle">15</text>
      <rect x="410" y="165" width="70" height="34" fill="#eef2ff" stroke="#c7d2fe"/><rect x="480" y="165" width="90" height="34" fill="#fff" stroke="#c7d2fe"/>
      <text x="445" y="188" text-anchor="middle" font-weight="700" fill="#4338ca">1</text><text x="525" y="188" text-anchor="middle">14</text>
      <rect x="410" y="199" width="70" height="34" fill="#eef2ff" stroke="#c7d2fe"/><rect x="480" y="199" width="90" height="34" fill="#fff" stroke="#c7d2fe"/>
      <text x="445" y="222" text-anchor="middle" font-weight="700" fill="#4338ca">2</text><text x="525" y="222" text-anchor="middle">16</text>
      <rect x="410" y="233" width="70" height="34" fill="#eef2ff" stroke="#c7d2fe"/><rect x="480" y="233" width="90" height="34" fill="#fff" stroke="#c7d2fe"/>
      <text x="445" y="256" text-anchor="middle" font-weight="700" fill="#4338ca">3</text><text x="525" y="256" text-anchor="middle">15</text>
      <rect x="410" y="267" width="70" height="34" fill="#eef2ff" stroke="#c7d2fe"/><rect x="480" y="267" width="90" height="34" fill="#fff" stroke="#c7d2fe"/>
      <text x="445" y="290" text-anchor="middle" font-weight="700" fill="#4338ca">4</text><text x="525" y="290" text-anchor="middle">17</text>
    </g>
    <text x="490" y="318" font-size="14" fill="#64748b" font-style="italic">dtype: int64  (тип значений)</text>
  </g>

  <!-- labels -->
  <rect x="610" y="140" width="135" height="50" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="677" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">слева — индекс</text>
  <text x="677" y="180" text-anchor="middle" font-size="12.5" fill="#4338ca">номер строки</text>
  <line x1="610" y1="165" x2="480" y2="148" stroke="#4f46e5" stroke-width="2"/>

  <rect x="610" y="215" width="135" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="677" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">справа — значения</text>
  <text x="677" y="255" text-anchor="middle" font-size="12.5" fill="#166534">сами данные</text>
  <line x1="610" y1="240" x2="570" y2="216" stroke="#16a34a" stroke-width="2"/>

  <!-- tip -->
  <rect x="40" y="245" width="300" height="130" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="60" y="272" font-size="14.5" font-weight="700" fill="#854d0e">💬 Простыми словами:</text>
  <text x="60" y="296" font-size="13.5" fill="#854d0e">Series — как список Python,</text>
  <text x="60" y="316" font-size="13.5" fill="#854d0e">но у каждого элемента есть</text>
  <text x="60" y="336" font-size="13.5" fill="#854d0e">свой «номерок» (индекс),</text>
  <text x="60" y="356" font-size="13.5" fill="#854d0e">и Pandas умеет его фильтровать.</text>
</svg>
