<svg viewBox="0 0 780 440" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <rect width="780" height="440" fill="#f7f9fc"/>
  <text x="390" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">Реальные данные всегда «грязные»</text>
  <text x="390" y="62" text-anchor="middle" font-size="14.5" fill="#64748b">очистка данных — это ~80% работы аналитика</text>

  <!-- dirty table -->
  <text x="185" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">было: с проблемами</text>
  <g font-size="13.5">
    <!-- header -->
    <rect x="40" y="100" width="100" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="140" y="100" width="55" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="195" y="100" width="70" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="265" y="100" width="65" height="30" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="90" y="120" text-anchor="middle" font-weight="700" fill="#991b1b">name</text>
    <text x="167" y="120" text-anchor="middle" font-weight="700" fill="#991b1b">age</text>
    <text x="230" y="120" text-anchor="middle" font-weight="700" fill="#991b1b">cabin</text>
    <text x="297" y="120" text-anchor="middle" font-weight="700" fill="#991b1b">fare</text>
    <g fill="#1f2937">
      <rect x="40" y="130" width="100" height="28" fill="#fff" stroke="#fecaca"/><text x="90" y="149" text-anchor="middle">Иван</text>
      <rect x="140" y="130" width="55" height="28" fill="#fff" stroke="#fecaca"/><text x="167" y="149" text-anchor="middle">22</text>
      <rect x="195" y="130" width="70" height="28" fill="#fff" stroke="#fecaca"/><text x="230" y="149" text-anchor="middle">C85</text>
      <rect x="265" y="130" width="65" height="28" fill="#fff" stroke="#fecaca"/><text x="297" y="149" text-anchor="middle">"71"</text>

      <rect x="40" y="158" width="100" height="28" fill="#fff" stroke="#fecaca"/><text x="90" y="177" text-anchor="middle">Мария</text>
      <rect x="140" y="158" width="55" height="28" fill="#fef9c3" stroke="#eab308" stroke-width="2"/><text x="167" y="177" text-anchor="middle" fill="#a16207" font-weight="700">NaN</text>
      <rect x="195" y="158" width="70" height="28" fill="#fef9c3" stroke="#eab308" stroke-width="2"/><text x="230" y="177" text-anchor="middle" fill="#a16207" font-weight="700">NaN</text>
      <rect x="265" y="158" width="65" height="28" fill="#fff" stroke="#fecaca"/><text x="297" y="177" text-anchor="middle">"8"</text>

      <rect x="40" y="186" width="100" height="28" fill="#fff" stroke="#fecaca"/><text x="90" y="205" text-anchor="middle">Пётр</text>
      <rect x="140" y="186" width="55" height="28" fill="#fff" stroke="#fecaca"/><text x="167" y="205" text-anchor="middle">16</text>
      <rect x="195" y="186" width="70" height="28" fill="#fef9c3" stroke="#eab308" stroke-width="2"/><text x="230" y="205" text-anchor="middle" fill="#a16207" font-weight="700">NaN</text>
      <rect x="265" y="186" width="65" height="28" fill="#fff" stroke="#fecaca"/><text x="297" y="205" text-anchor="middle">"13"</text>

      <!-- duplicate row -->
      <rect x="40" y="214" width="100" height="28" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/><text x="90" y="233" text-anchor="middle">Пётр</text>
      <rect x="140" y="214" width="55" height="28" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/><text x="167" y="233" text-anchor="middle">16</text>
      <rect x="195" y="214" width="70" height="28" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/><text x="230" y="233" text-anchor="middle" fill="#a16207" font-weight="700">NaN</text>
      <rect x="265" y="214" width="65" height="28" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/><text x="297" y="233" text-anchor="middle">"13"</text>
    </g>
  </g>
  <!-- problem labels -->
  <text x="40" y="262" font-size="12.5" fill="#a16207">🟡 NaN — пропуски (нет данных)</text>
  <text x="40" y="280" font-size="12.5" fill="#be123c">🔴 дубликат строки (Пётр дважды)</text>
  <text x="40" y="298" font-size="12.5" fill="#be123c">🔴 fare — число в кавычках (текст, не число)</text>

  <!-- arrow -->
  <path d="M350 200 L420 200" stroke="#16a34a" stroke-width="4" marker-end="url(#g)"/>
  <defs><marker id="g" markerWidth="11" markerHeight="11" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#16a34a"/></marker></defs>
  <text x="385" y="190" text-anchor="middle" font-size="12.5" fill="#16a34a" font-weight="700">очистка</text>

  <!-- clean table -->
  <text x="575" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">стало: чисто</text>
  <g font-size="13.5">
    <rect x="450" y="100" width="100" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="550" y="100" width="55" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="605" y="100" width="65" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="500" y="120" text-anchor="middle" font-weight="700" fill="#15803d">name</text>
    <text x="577" y="120" text-anchor="middle" font-weight="700" fill="#15803d">age</text>
    <text x="637" y="120" text-anchor="middle" font-weight="700" fill="#15803d">fare</text>
    <g fill="#166534">
      <rect x="450" y="130" width="100" height="28" fill="#fff" stroke="#bbf7d0"/><text x="500" y="149" text-anchor="middle">Иван</text>
      <rect x="550" y="130" width="55" height="28" fill="#fff" stroke="#bbf7d0"/><text x="577" y="149" text-anchor="middle">22</text>
      <rect x="605" y="130" width="65" height="28" fill="#fff" stroke="#bbf7d0"/><text x="637" y="149" text-anchor="middle">71</text>
      <rect x="450" y="158" width="100" height="28" fill="#fff" stroke="#bbf7d0"/><text x="500" y="177" text-anchor="middle">Мария</text>
      <rect x="550" y="158" width="55" height="28" fill="#eff6ff" stroke="#bfdbfe"/><text x="577" y="177" text-anchor="middle" fill="#1d4ed8" font-weight="700">28</text>
      <rect x="605" y="158" width="65" height="28" fill="#fff" stroke="#bbf7d0"/><text x="637" y="177" text-anchor="middle">8</text>
      <rect x="450" y="186" width="100" height="28" fill="#fff" stroke="#bbf7d0"/><text x="500" y="205" text-anchor="middle">Пётр</text>
      <rect x="550" y="186" width="55" height="28" fill="#fff" stroke="#bbf7d0"/><text x="577" y="205" text-anchor="middle">16</text>
      <rect x="605" y="186" width="65" height="28" fill="#fff" stroke="#bbf7d0"/><text x="637" y="205" text-anchor="middle">13</text>
    </g>
  </g>
  <text x="450" y="236" font-size="12.5" fill="#15803d">✓ пропуски заполнены (28 — медиана)</text>
  <text x="450" y="254" font-size="12.5" fill="#15803d">✓ столбец cabin убран, дубликат удалён</text>
  <text x="450" y="272" font-size="12.5" fill="#15803d">✓ fare стал числом</text>

  <!-- tip -->
  <rect x="60" y="328" width="660" height="92" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="80" y="354" font-size="14.5" font-weight="700" fill="#854d0e">💬 Зачем это нужно:</text>
  <text x="80" y="378" font-size="14" fill="#854d0e">нейросеть и формулы не умеют работать с «дырами» и текстом вместо чисел — они просто</text>
  <text x="80" y="399" font-size="14" fill="#854d0e">сломаются. Поэтому данные сначала чистят: убирают пропуски, дубликаты, чинят типы.</text>
  <text x="80" y="414" font-size="12.5" fill="#a16207" font-style="italic">На этом уроке работаем с реальным датасетом «Титаник» (грузим по ссылке в Colab).</text>
</svg>
