<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <rect width="780" height="400" fill="#f7f9fc"/>
  <text x="390" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">Чем заполнять пропуск — fillna()</text>
  <text x="390" y="60" text-anchor="middle" font-size="14.5" fill="#64748b">подставляем «типичное» значение столбца, чтобы не выдумывать лишнего</text>

  <!-- numbers card -->
  <rect x="40" y="86" width="345" height="200" rx="14" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="212" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#4338ca">Числа (возраст, цена)</text>
  <text x="212" y="140" text-anchor="middle" font-size="14" fill="#4338ca">заполняют СРЕДНИМ или МЕДИАНОЙ</text>
  <rect x="60" y="154" width="305" height="34" rx="7" fill="#0f172a"/>
  <text x="72" y="177" font-size="13" font-family="monospace" fill="#e2e8f0">df['age'].fillna(df['age'].median())</text>
  <text x="212" y="212" text-anchor="middle" font-size="13.5" font-weight="700" fill="#4338ca">Медиана надёжнее среднего</text>
  <text x="212" y="232" text-anchor="middle" font-size="12.5" fill="#4338ca">если есть выбросы — среднее «уедет»,</text>
  <text x="212" y="250" text-anchor="middle" font-size="12.5" fill="#4338ca">а медиана (середина) устоит</text>
  <text x="212" y="272" text-anchor="middle" font-size="12" fill="#6366f1" font-style="italic">(вспомни «историю про директора», урок 1.6)</text>

  <!-- categories card -->
  <rect x="400" y="86" width="340" height="200" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="570" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#15803d">Категории (порт, город, пол)</text>
  <text x="570" y="140" text-anchor="middle" font-size="14" fill="#166534">заполняют МОДОЙ — самым частым</text>
  <rect x="420" y="154" width="300" height="34" rx="7" fill="#0f172a"/>
  <text x="432" y="177" font-size="12.5" font-family="monospace" fill="#e2e8f0">df['port'].fillna(df['port'].mode()[0])</text>
  <text x="570" y="212" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">Среднее тут нельзя!</text>
  <text x="570" y="232" text-anchor="middle" font-size="12.5" fill="#166534">у слов нет «среднего». Берём то,</text>
  <text x="570" y="250" text-anchor="middle" font-size="12.5" fill="#166534">что встречается чаще всего.</text>
  <text x="570" y="272" text-anchor="middle" font-size="12" fill="#16a34a" font-style="italic">.mode()[0] — первое из самых частых</text>

  <!-- tip -->
  <rect x="60" y="308" width="660" height="78" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="80" y="333" font-size="14.5" font-weight="700" fill="#854d0e">💬 Как выбрать за 1 секунду:</text>
  <text x="80" y="357" font-size="14" fill="#854d0e">в столбце ЧИСЛА → медиана (или среднее). В столбце СЛОВА → мода.</text>
  <text x="80" y="378" font-size="13.5" fill="#854d0e">⚠️ Важно: результат надо присвоить обратно — <tspan font-family="monospace" fill="#b45309">df['age'] = df['age'].fillna(...)</tspan></text>
</svg>
