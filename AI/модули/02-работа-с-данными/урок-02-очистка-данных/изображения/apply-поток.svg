<svg viewBox="0 0 780 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
  <rect width="780" height="420" fill="#f7f9fc"/>
  <text x="390" y="36" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">.apply() — применить функцию к каждой строке</text>
  <text x="390" y="60" text-anchor="middle" font-size="14.5" fill="#64748b">берём свою функцию и прогоняем её по всему столбцу → получаем новый столбец</text>

  <!-- function box -->
  <rect x="40" y="90" width="250" height="120" rx="12" fill="#0f172a"/>
  <text x="56" y="116" font-size="13.5" font-family="monospace" fill="#a5b4fc">def age_category(age):</text>
  <text x="56" y="138" font-size="13.5" font-family="monospace" fill="#e2e8f0">  if age &lt; 18:</text>
  <text x="56" y="158" font-size="13.5" font-family="monospace" fill="#86efac">    return 'ребёнок'</text>
  <text x="56" y="178" font-size="13.5" font-family="monospace" fill="#e2e8f0">  else:</text>
  <text x="56" y="198" font-size="13.5" font-family="monospace" fill="#86efac">    return 'взрослый'</text>
  <text x="165" y="228" text-anchor="middle" font-size="12.5" fill="#64748b">1. правило для ОДНОГО значения</text>

  <!-- apply arrow -->
  <rect x="315" y="120" width="150" height="60" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2.5"/>
  <text x="390" y="146" text-anchor="middle" font-size="14" font-family="monospace" font-weight="700" fill="#4338ca">.apply(</text>
  <text x="390" y="166" text-anchor="middle" font-size="13" font-family="monospace" fill="#4338ca">age_category)</text>
  <text x="390" y="202" text-anchor="middle" font-size="12.5" fill="#64748b">2. применяем ко ВСЕМ</text>

  <!-- before/after columns -->
  <g font-size="14">
    <text x="545" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">age</text>
    <rect x="505" y="114" width="80" height="26" fill="#fff" stroke="#cbd5e1"/><text x="545" y="132" text-anchor="middle" fill="#1f2937">22</text>
    <rect x="505" y="140" width="80" height="26" fill="#fff" stroke="#cbd5e1"/><text x="545" y="158" text-anchor="middle" fill="#1f2937">8</text>
    <rect x="505" y="166" width="80" height="26" fill="#fff" stroke="#cbd5e1"/><text x="545" y="184" text-anchor="middle" fill="#1f2937">40</text>

    <text x="680" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#15803d">age_group</text>
    <rect x="615" y="114" width="130" height="26" fill="#dcfce7" stroke="#86efac"/><text x="680" y="132" text-anchor="middle" fill="#166534">взрослый</text>
    <rect x="615" y="140" width="130" height="26" fill="#dcfce7" stroke="#86efac"/><text x="680" y="158" text-anchor="middle" fill="#166534">ребёнок</text>
    <rect x="615" y="166" width="130" height="26" fill="#dcfce7" stroke="#86efac"/><text x="680" y="184" text-anchor="middle" fill="#166534">взрослый</text>
  </g>
  <path d="M588 153 L612 153" stroke="#16a34a" stroke-width="2.5" marker-end="url(#ap)"/>
  <defs><marker id="ap" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#16a34a"/></marker></defs>
  <path d="M465 150 L500 150" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#ap2)"/>
  <defs><marker id="ap2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 Z" fill="#4f46e5"/></marker></defs>
  <text x="680" y="212" text-anchor="middle" font-size="12.5" fill="#64748b">3. новый столбец готов</text>

  <!-- axis note -->
  <rect x="40" y="252" width="705" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="60" y="277" font-size="13.5" font-weight="700" fill="#4338ca">А если нужны ДВА столбца сразу?</text>
  <text x="60" y="298" font-size="13.5" fill="#3730a3">Применяем к таблице с <tspan font-family="monospace" fill="#4338ca">axis=1</tspan> — тогда в функцию приходит ВСЯ строка: <tspan font-family="monospace" fill="#4338ca">df.apply(f, axis=1)</tspan>, внутри <tspan font-family="monospace" fill="#4338ca">row['sibsp']+row['parch']</tspan>.</text>

  <!-- tip -->
  <rect x="60" y="328" width="660" height="78" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="80" y="353" font-size="14.5" font-weight="700" fill="#854d0e">💬 Простыми словами:</text>
  <text x="80" y="377" font-size="14" fill="#854d0e">apply — это «пропусти каждое значение через мою функцию». Пишешь правило один раз,</text>
  <text x="80" y="398" font-size="14" fill="#854d0e">а Pandas применяет его ко всем 891 строкам сам. Так делают новые признаки для модели.</text>
</svg>
