<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#f7f9fc"/>
  <text x="450" y="34" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">🎯 Индексы матрицы: m[строка, столбец]</text>
  <text x="450" y="58" font-size="13.5" fill="#64748b" text-anchor="middle">Два индекса через запятую в ОДНИХ скобках. Двоеточие «:» значит «все по этой оси».</text>

  <!-- column indices -->
  <g font-size="13" fill="#7c3aed" text-anchor="middle" font-family="monospace">
    <text x="210" y="112">столбец 0</text><text x="284" y="112">столбец 1</text><text x="358" y="112">столбец 2</text>
  </g>
  <!-- grid -->
  <g font-family="monospace" font-size="22" text-anchor="middle">
    <rect x="180" y="120" width="60" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="210" y="156" fill="#334155">1</text>
    <rect x="254" y="120" width="60" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="284" y="156" fill="#334155">2</text>
    <rect x="328" y="120" width="60" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="358" y="156" fill="#334155">3</text>
    <rect x="180" y="178" width="60" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="210" y="214" fill="#334155">4</text>
    <rect x="254" y="178" width="60" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="284" y="214" fill="#334155">5</text>
    <rect x="328" y="178" width="60" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="358" y="214" fill="#334155">6</text>
    <rect x="180" y="236" width="60" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="210" y="272" fill="#334155">7</text>
    <rect x="254" y="236" width="60" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="284" y="272" fill="#334155">8</text>
    <rect x="328" y="236" width="60" height="54" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="358" y="272" fill="#334155">9</text>
  </g>
  <!-- row indices -->
  <g font-size="13" fill="#7c3aed" text-anchor="end" font-family="monospace">
    <text x="172" y="152">строка 0</text><text x="172" y="210">строка 1</text><text x="172" y="268">строка 2</text>
  </g>

  <!-- highlights -->
  <rect x="176" y="116" width="216" height="62" rx="9" fill="#2563eb" fill-opacity="0.13" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="176" y="116" width="68" height="178" rx="9" fill="#16a34a" fill-opacity="0.13" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="324" y="174" width="68" height="62" rx="9" fill="none" stroke="#dc2626" stroke-width="2.5"/>

  <!-- legend -->
  <g font-family="monospace" font-size="15">
    <rect x="470" y="120" width="380" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="486" y="143" fill="#1e40af" font-weight="700">m[0]</text>
    <text x="486" y="163" fill="#1e40af" font-size="13">→ [1 2 3]  · вся строка 0</text>

    <rect x="470" y="180" width="380" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="486" y="203" fill="#166534" font-weight="700">m[:, 0]</text>
    <text x="486" y="223" fill="#166534" font-size="13">→ [1 4 7]  · все строки, столбец 0</text>

    <rect x="470" y="240" width="380" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="486" y="263" fill="#991b1b" font-weight="700">m[1, 2]</text>
    <text x="486" y="283" fill="#991b1b" font-size="13">→ 6  · строка 1, столбец 2</text>
  </g>

  <rect x="70" y="326" width="760" height="66" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="450" y="350" font-size="13.5" fill="#713f12" text-anchor="middle">💡 Пиши m[1, 2] (через запятую), а НЕ m[1][2]. «:» на месте строки = «все строки»,</text>
  <text x="450" y="372" font-size="13.5" fill="#713f12" text-anchor="middle">на месте столбца = «все столбцы». Поэтому столбец достают так: m[:, 0].</text>
</svg>
