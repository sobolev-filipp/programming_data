<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="840" height="400" fill="#f7f9fc"/>
  <text x="420" y="34" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">⚡ Векторизация: одна операция — сразу на весь массив</text>
  <text x="420" y="58" font-size="13.5" fill="#64748b" text-anchor="middle">Никакого цикла for. Пишешь a * 2 — и NumPy умножает каждый элемент разом.</text>

  <!-- code label -->
  <rect x="300" y="80" width="240" height="40" rx="10" fill="#0f172a"/>
  <text x="420" y="106" font-size="18" font-family="monospace" fill="#a5b4fc" text-anchor="middle">a * 2</text>

  <!-- input row -->
  <text x="70" y="176" font-size="14" fill="#334155" text-anchor="end">a =</text>
  <g font-family="monospace" font-size="22" text-anchor="middle">
    <rect x="90" y="148" width="120" height="56" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8"/><text x="150" y="184" fill="#3730a3">1</text>
    <rect x="222" y="148" width="120" height="56" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8"/><text x="282" y="184" fill="#3730a3">2</text>
    <rect x="354" y="148" width="120" height="56" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8"/><text x="414" y="184" fill="#3730a3">3</text>
    <rect x="486" y="148" width="120" height="56" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8"/><text x="546" y="184" fill="#3730a3">4</text>
    <rect x="618" y="148" width="120" height="56" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8"/><text x="678" y="184" fill="#3730a3">5</text>
  </g>

  <!-- arrows down with x2 -->
  <g>
    <g stroke="#7c3aed" stroke-width="2.5"><line x1="150" y1="210" x2="150" y2="256"/><line x1="282" y1="210" x2="282" y2="256"/><line x1="414" y1="210" x2="414" y2="256"/><line x1="546" y1="210" x2="546" y2="256"/><line x1="678" y1="210" x2="678" y2="256"/></g>
    <g fill="#7c3aed"><polygon points="150,264 144,252 156,252"/><polygon points="282,264 276,252 288,252"/><polygon points="414,264 408,252 420,252"/><polygon points="546,264 540,252 552,252"/><polygon points="678,264 672,252 684,252"/></g>
    <g font-size="12" font-family="monospace" fill="#7c3aed" text-anchor="middle"><text x="168" y="238">×2</text><text x="300" y="238">×2</text><text x="432" y="238">×2</text><text x="564" y="238">×2</text><text x="696" y="238">×2</text></g>
  </g>

  <!-- output row -->
  <text x="70" y="300" font-size="14" fill="#166534" text-anchor="end">→</text>
  <g font-family="monospace" font-size="22" text-anchor="middle">
    <rect x="90" y="272" width="120" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="150" y="308" fill="#166534">2</text>
    <rect x="222" y="272" width="120" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="282" y="308" fill="#166534">4</text>
    <rect x="354" y="272" width="120" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="414" y="308" fill="#166534">6</text>
    <rect x="486" y="272" width="120" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="546" y="308" fill="#166534">8</text>
    <rect x="618" y="272" width="120" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/><text x="678" y="308" fill="#166534">10</text>
  </g>

  <rect x="90" y="352" width="648" height="40" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="414" y="377" font-size="13" fill="#713f12" text-anchor="middle">💡 Обычный Python умножал бы по одному в цикле. NumPy — все 5 (и хоть 10 млн) за один присест.</text>
</svg>
