<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="840" height="400" fill="#f7f9fc"/>
  <text x="420" y="32" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Зарплаты: почему «среднее» обманывает</text>
  <text x="420" y="54" font-size="13.5" fill="#64748b" text-anchor="middle">каждый кружок — один сотрудник, по горизонтали — его зарплата (тыс. ₽)</text>

  <!-- number line -->
  <line x1="80" y1="250" x2="800" y2="250" stroke="#475569" stroke-width="2"/><polygon points="808,250 796,244 796,256" fill="#475569"/>
  <g font-size="11" fill="#94a3b8" font-family="monospace" text-anchor="middle">
    <line x1="107" y1="246" x2="107" y2="254" stroke="#94a3b8"/><text x="107" y="270">40</text>
    <line x1="215" y1="246" x2="215" y2="254" stroke="#94a3b8"/><text x="215" y="270">200</text>
    <line x1="485" y1="246" x2="485" y2="254" stroke="#94a3b8"/><text x="485" y="270">600</text>
    <line x1="756" y1="246" x2="756" y2="254" stroke="#94a3b8"/><text x="756" y="270">1000</text>
  </g>

  <!-- 6 ordinary employees clustered -->
  <g fill="#6366f1" stroke="#4338ca" stroke-width="1.5">
    <circle cx="100" cy="250" r="9"/>
    <circle cx="104" cy="250" r="9"/>
    <circle cx="107" cy="235" r="9"/>
    <circle cx="107" cy="250" r="9"/>
    <circle cx="110" cy="250" r="9"/>
    <circle cx="114" cy="250" r="9"/>
  </g>
  <text x="107" y="300" font-size="12.5" font-weight="700" fill="#4338ca" text-anchor="middle">6 обычных сотрудников</text>
  <text x="107" y="317" font-size="11.5" fill="#64748b" text-anchor="middle">30–50 тыс</text>

  <!-- director -->
  <circle cx="756" cy="250" r="11" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
  <text x="756" y="300" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">директор</text>
  <text x="756" y="317" font-size="11.5" fill="#64748b" text-anchor="middle">1000 тыс</text>

  <!-- median line -->
  <line x1="107" y1="120" x2="107" y2="228" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="107" y="112" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle">медиана = 40</text>

  <!-- mean line -->
  <line x1="215" y1="150" x2="215" y2="235" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="215" y="142" font-size="13" font-weight="700" fill="#ea580c" text-anchor="middle">среднее = 177</text>
  <text x="300" y="175" font-size="12" fill="#ea580c" text-anchor="start">← тут не стоит НИКТО!</text>

  <!-- tip -->
  <rect x="80" y="340" width="720" height="48" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="98" y="363" font-size="13.5" fill="#713f12">💡 Один директор-«выброс» утащил среднее к 177 — в пустое место, где нет ни одного человека.</text>
  <text x="98" y="382" font-size="13.5" fill="#713f12">Медиана (40) осталась там, где реально живёт большинство. Поэтому про зарплаты честнее медиана.</text>
</svg>
