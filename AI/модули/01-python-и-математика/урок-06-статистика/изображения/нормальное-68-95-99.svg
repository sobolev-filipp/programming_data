<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="470" fill="#f7f9fc"/>
  <text x="410" y="30" font-size="21" font-weight="700" fill="#1f2937" text-anchor="middle">Нормальное распределение и правило 68 — 95 — 99.7</text>
  <text x="410" y="52" font-size="12.5" fill="#64748b" text-anchor="middle">пример: рост людей, среднее 175 см, std 10 см</text>

  <defs>
    <clipPath id="bell">
      <path d="M 180 360 C 300 360, 340 125, 410 125 C 480 125, 520 360, 640 360 Z"/>
    </clipPath>
  </defs>

  <!-- bands under the bell (clipped) -->
  <g clip-path="url(#bell)">
    <rect x="200" y="100" width="420" height="260" fill="#a5b4fc" opacity="0.30"/>
    <rect x="270" y="100" width="280" height="260" fill="#6366f1" opacity="0.30"/>
    <rect x="340" y="100" width="140" height="260" fill="#4f46e5" opacity="0.40"/>
  </g>

  <!-- bell outline -->
  <path d="M 180 360 C 300 360, 340 125, 410 125 C 480 125, 520 360, 640 360" fill="none" stroke="#3730a3" stroke-width="3"/>
  <!-- baseline -->
  <line x1="150" y1="360" x2="690" y2="360" stroke="#475569" stroke-width="2"/>

  <!-- sigma lines + tick labels -->
  <g stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3">
    <line x1="200" y1="360" x2="200" y2="330"/><line x1="270" y1="360" x2="270" y2="300"/>
    <line x1="340" y1="360" x2="340" y2="250"/><line x1="410" y1="360" x2="410" y2="125"/>
    <line x1="480" y1="360" x2="480" y2="250"/><line x1="550" y1="360" x2="550" y2="300"/>
    <line x1="620" y1="360" x2="620" y2="330"/>
  </g>
  <g font-size="11" fill="#475569" font-family="monospace" text-anchor="middle">
    <text x="200" y="378">145</text><text x="270" y="378">155</text><text x="340" y="378">165</text>
    <text x="410" y="378" font-weight="700" fill="#1f2937">175</text>
    <text x="480" y="378">185</text><text x="550" y="378">195</text><text x="620" y="378">205</text>
  </g>
  <g font-size="10.5" fill="#94a3b8" text-anchor="middle">
    <text x="340" y="392">−1 std</text><text x="410" y="392">среднее</text><text x="480" y="392">+1 std</text>
  </g>

  <!-- brackets -->
  <g stroke-width="2" fill="none">
    <path d="M 340 240 L 340 232 L 480 232 L 480 240" stroke="#4f46e5"/>
    <path d="M 270 210 L 270 202 L 550 202 L 550 210" stroke="#6366f1"/>
    <path d="M 200 180 L 200 172 L 620 172 L 620 180" stroke="#818cf8"/>
  </g>
  <rect x="350" y="213" width="120" height="19" rx="5" fill="#ffffff" opacity="0.92"/>
  <rect x="350" y="183" width="120" height="19" rx="5" fill="#ffffff" opacity="0.92"/>
  <rect x="346" y="153" width="128" height="19" rx="5" fill="#ffffff" opacity="0.92"/>
  <text x="410" y="227" font-size="12.5" font-weight="700" fill="#4f46e5" text-anchor="middle">68%  (±1 std)</text>
  <text x="410" y="197" font-size="12.5" font-weight="700" fill="#6366f1" text-anchor="middle">95%  (±2 std)</text>
  <text x="410" y="167" font-size="12.5" font-weight="700" fill="#4338ca" text-anchor="middle">99.7%  (±3 std)</text>

  <rect x="150" y="410" width="540" height="48" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="168" y="432" font-size="13" fill="#713f12">💡 Центр колокола = среднее. Ширина колокола = std. В ±1 std помещается</text>
  <text x="168" y="450" font-size="13" fill="#713f12">большинство (68%). За ±3 std почти ничего нет — то, что там, называют «выбросом».</text>
</svg>
