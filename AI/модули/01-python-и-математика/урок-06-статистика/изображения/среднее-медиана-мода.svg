<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 440" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="840" height="440" fill="#f7f9fc"/>
  <text x="420" y="32" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Среднее · медиана · мода — где они стоят</text>

  <!-- LEFT: symmetric -->
  <text x="220" y="66" font-size="15" font-weight="700" fill="#16a34a" text-anchor="middle">Симметричные данные</text>
  <path d="M 80 330 C 160 330, 180 110, 220 110 C 260 110, 280 330, 360 330 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="80" y1="330" x2="372" y2="330" stroke="#475569" stroke-width="2"/>
  <!-- all three coincide -->
  <line x1="220" y1="110" x2="220" y2="330" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="220" y="356" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">среднее = медиана = мода</text>
  <text x="220" y="374" font-size="11.5" fill="#64748b" text-anchor="middle">все три в одной точке</text>

  <!-- RIGHT: right-skewed (salaries) -->
  <text x="620" y="66" font-size="15" font-weight="700" fill="#ea580c" text-anchor="middle">Есть выброс (хвост вправо)</text>
  <path d="M 470 330 C 500 330, 520 120, 560 120 C 610 120, 650 300, 790 328 L 790 330 Z" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
  <line x1="470" y1="330" x2="800" y2="330" stroke="#475569" stroke-width="2"/>

  <!-- mode (peak) -->
  <line x1="560" y1="120" x2="560" y2="330" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="560" y="110" font-size="12.5" font-weight="700" fill="#6366f1" text-anchor="middle">мода</text>
  <!-- median -->
  <line x1="600" y1="175" x2="600" y2="330" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="604" y="165" font-size="12.5" font-weight="700" fill="#16a34a" text-anchor="start">медиана</text>
  <!-- mean (dragged by tail) -->
  <line x1="660" y1="230" x2="660" y2="330" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="664" y="222" font-size="12.5" font-weight="700" fill="#dc2626" text-anchor="start">среднее</text>

  <text x="735" y="300" font-size="11.5" fill="#92400e" text-anchor="middle">хвост-выброс</text>
  <text x="735" y="316" font-size="11.5" fill="#92400e" text-anchor="middle">тянет среднее →</text>

  <!-- tip -->
  <rect x="80" y="392" width="710" height="34" rx="9" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="98" y="414" font-size="13.5" fill="#713f12">💡 Чем длиннее «хвост» из выбросов, тем сильнее среднее уезжает в его сторону. Медиана и мода стоят на месте.</text>
</svg>
