<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="860" height="540" fill="#f7f9fc"/>
  <text x="430" y="32" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Как устроена гистограмма (и какая строка её рисует)</text>

  <!-- ===== CHART on the left ===== -->
  <!-- chart frame -->
  <rect x="150" y="96" width="330" height="300" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <!-- title ① -->
  <text x="315" y="86" font-size="13.5" font-weight="700" fill="#1f2937" text-anchor="middle">Рост учеников</text>
  <circle cx="200" cy="82" r="10" fill="#4f46e5"/><text x="200" y="86" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">1</text>

  <!-- axes -->
  <line x1="180" y1="380" x2="470" y2="380" stroke="#475569" stroke-width="2"/>
  <line x1="180" y1="380" x2="180" y2="110" stroke="#475569" stroke-width="2"/>

  <!-- bars (one per bin) -->
  <g fill="#93c5fd" stroke="#2563eb" stroke-width="1.5">
    <rect x="182" y="330" width="34" height="50"/>
    <rect x="218" y="290" width="34" height="90"/>
    <rect x="254" y="215" width="34" height="165"/>
    <rect x="290" y="150" width="34" height="230"/>
    <rect x="326" y="170" width="34" height="210"/>
    <rect x="362" y="245" width="34" height="135"/>
    <rect x="398" y="300" width="34" height="80"/>
    <rect x="434" y="345" width="34" height="35"/>
  </g>

  <!-- x axis label ③ -->
  <text x="325" y="414" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Рост (см)</text>
  <circle cx="250" cy="410" r="10" fill="#16a34a"/><text x="250" y="414" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">3</text>

  <!-- y axis label ④ -->
  <text x="140" y="250" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" transform="rotate(-90 140 250)">Сколько учеников</text>
  <circle cx="140" cy="300" r="10" fill="#ea580c"/><text x="140" y="304" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">4</text>

  <!-- callout: one bar = one bin ② -->
  <line x1="307" y1="150" x2="307" y2="120" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="307" cy="134" r="10" fill="#4f46e5"/><text x="307" y="138" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">2</text>

  <!-- callout: height = count -->
  <line x1="290" y1="150" x2="178" y2="150" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="250" y="144" font-size="10.5" fill="#dc2626" text-anchor="middle">высота = сколько чисел попало</text>
  <!-- callout: width = bin -->
  <line x1="290" y1="384" x2="324" y2="384" stroke="#7c3aed" stroke-width="2"/>
  <text x="307" y="400" font-size="10" fill="#7c3aed" text-anchor="middle">1 корзина</text>

  <!-- ===== CODE on the right ===== -->
  <rect x="510" y="96" width="320" height="230" rx="12" fill="#0f172a"/>
  <text x="530" y="128" font-size="13.5" font-family="monospace" fill="#64748b">import matplotlib.pyplot as plt</text>

  <circle cx="528" cy="160" r="10" fill="#4f46e5"/><text x="528" y="164" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">2</text>
  <text x="548" y="164" font-size="13" font-family="monospace" fill="#e2e8f0">plt.hist(data, bins=8)</text>
  <text x="548" y="182" font-size="10.5" font-family="monospace" fill="#64748b">↑ рисует столбики, bins=8 → 8 корзин</text>

  <circle cx="528" cy="206" r="10" fill="#4f46e5"/><text x="528" y="210" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">1</text>
  <text x="548" y="210" font-size="13" font-family="monospace" fill="#e2e8f0">plt.title("Рост учеников")</text>

  <circle cx="528" cy="236" r="10" fill="#16a34a"/><text x="528" y="240" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">3</text>
  <text x="548" y="240" font-size="13" font-family="monospace" fill="#e2e8f0">plt.xlabel("Рост (см)")</text>

  <circle cx="528" cy="266" r="10" fill="#ea580c"/><text x="528" y="270" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">4</text>
  <text x="548" y="270" font-size="13" font-family="monospace" fill="#e2e8f0">plt.ylabel("Сколько учеников")</text>

  <circle cx="528" cy="298" r="10" fill="#dc2626"/><text x="528" y="302" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">5</text>
  <text x="548" y="302" font-size="13" font-family="monospace" fill="#e2e8f0">plt.show()</text>
  <text x="548" y="320" font-size="10.5" font-family="monospace" fill="#64748b">↑ открывает окно с картинкой</text>

  <!-- tip -->
  <rect x="150" y="440" width="680" height="76" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="168" y="466" font-size="13.5" fill="#713f12">💡 Читаем так: находим <tspan font-weight="700">самый высокий столбик</tspan> — там чисел больше всего (самое частое значение).</text>
  <text x="168" y="488" font-size="13.5" fill="#713f12">Смотрим, куда «съезжает» основная масса (влево / вправо / в центр) — это и есть форма данных.</text>
  <text x="168" y="508" font-size="13.5" fill="#713f12">Больше <tspan font-family="monospace">bins</tspan> → тоньше столбики и подробнее форма; меньше <tspan font-family="monospace">bins</tspan> → грубее, но нагляднее.</text>
</svg>
