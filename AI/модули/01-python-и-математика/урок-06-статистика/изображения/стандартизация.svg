<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="420" fill="#f7f9fc"/>
  <text x="410" y="32" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Стандартизация (Z-score): привести к одной мерке</text>

  <!-- BEFORE -->
  <text x="60" y="78" font-size="13.5" font-weight="700" fill="#64748b">Было: среднее 4.2, std 0.75</text>
  <line x1="60" y1="120" x2="400" y2="120" stroke="#475569" stroke-width="2"/>
  <g font-size="11" fill="#94a3b8" font-family="monospace" text-anchor="middle">
    <text x="130" y="140">3</text><text x="230" y="140">4.2</text><text x="330" y="140">5</text>
  </g>
  <line x1="230" y1="100" x2="230" y2="128" stroke="#ea580c" stroke-width="2" stroke-dasharray="4 3"/>
  <g fill="#6366f1"><circle cx="130" cy="120" r="7"/><circle cx="210" cy="120" r="7"/><circle cx="330" cy="120" r="7"/></g>

  <!-- arrow + formula -->
  <line x1="410" y1="120" x2="470" y2="120" stroke="#4f46e5" stroke-width="3"/><polygon points="478,120 466,114 466,126" fill="#4f46e5"/>
  <rect x="300" y="168" width="230" height="52" rx="10" fill="#0f172a"/>
  <text x="415" y="200" font-size="15" font-family="monospace" fill="#a5b4fc" text-anchor="middle">z = (x − mean) / std</text>

  <!-- AFTER -->
  <text x="490" y="78" font-size="13.5" font-weight="700" fill="#16a34a">Стало: среднее 0, std 1</text>
  <line x1="480" y1="120" x2="790" y2="120" stroke="#475569" stroke-width="2"/>
  <g font-size="11" fill="#94a3b8" font-family="monospace" text-anchor="middle">
    <text x="540" y="140">−2</text><text x="600" y="140">−1</text><text x="635" y="140">0</text><text x="670" y="140">+1</text><text x="730" y="140">+2</text>
  </g>
  <line x1="635" y1="100" x2="635" y2="128" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>
  <g fill="#16a34a"><circle cx="560" cy="120" r="7"/><circle cx="620" cy="120" r="7"/><circle cx="700" cy="120" r="7"/></g>

  <!-- why -->
  <rect x="60" y="258" width="700" height="96" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="80" y="284" font-size="14" font-weight="700" fill="#3730a3">Зачем это нужно в ML?</text>
  <text x="80" y="308" font-size="13" fill="#3730a3">Признаки бывают в разных масштабах: рост ≈ 170 (см), зарплата ≈ 50000 (₽).</text>
  <text x="80" y="330" font-size="13" fill="#3730a3">Без стандартизации модель решит, что зарплата «важнее» — просто потому, что числа больше.</text>
  <text x="80" y="348" font-size="13" fill="#6366f1">После z-score у всех признаков центр 0 и ширина 1 → они соревнуются честно.</text>

  <rect x="60" y="368" width="700" height="34" rx="9" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="78" y="390" font-size="13.5" fill="#713f12">💡 z = 0 → ровно среднее. z = +2 → на два std выше среднего (редкое, большое значение).</text>
</svg>
