<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="420" fill="#f7f9fc"/>
  <text x="410" y="32" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Одно и то же среднее — разный разброс (std)</text>

  <line x1="80" y1="330" x2="740" y2="330" stroke="#475569" stroke-width="2"/><polygon points="748,330 736,324 736,336" fill="#475569"/>
  <!-- mean -->
  <line x1="410" y1="80" x2="410" y2="330" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="410" y="352" font-size="12.5" font-weight="700" fill="#64748b" text-anchor="middle">среднее (одинаковое у обоих)</text>

  <!-- wide curve (big std) -->
  <path d="M 100 330 C 250 330, 300 180, 410 180 C 520 180, 570 330, 720 330 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <!-- narrow curve (small std) -->
  <path d="M 330 330 C 380 330, 390 95, 410 95 C 430 95, 440 330, 490 330 Z" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" fill-opacity="0.85"/>

  <!-- labels -->
  <text x="410" y="115" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">маленькое std</text>
  <rect x="150" y="150" width="150" height="44" rx="9" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="225" y="170" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">большое std</text>
  <text x="225" y="187" font-size="11.5" fill="#64748b" text-anchor="middle">числа «разлетелись»</text>

  <!-- std arrows -->
  <line x1="410" y1="300" x2="490" y2="300" stroke="#16a34a" stroke-width="2"/><polygon points="492,300 484,296 484,304" fill="#16a34a"/>
  <text x="450" y="294" font-size="11" fill="#16a34a" text-anchor="middle">±std</text>
  <line x1="410" y1="315" x2="560" y2="315" stroke="#dc2626" stroke-width="2"/><polygon points="562,315 554,311 554,319" fill="#dc2626"/>
  <text x="500" y="309" font-size="11" fill="#dc2626" text-anchor="middle">±std</text>

  <rect x="80" y="372" width="660" height="34" rx="9" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="98" y="394" font-size="13.5" fill="#713f12">💡 std — это «ширина» колокола. Узкий колокол → все похожи. Широкий → класс разношёрстный.</text>
</svg>
