<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="840" height="400" fill="#f7f9fc"/>
  <text x="420" y="30" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Learning rate (размер шага) — три случая</text>

  <!-- Panel A: too small -->
  <path d="M 40 90 Q 150 300, 260 90" fill="none" stroke="#4f46e5" stroke-width="3"/>
  <g fill="#ea580c" stroke="#9a3412" stroke-width="1">
    <circle cx="70" cy="150" r="5"/><circle cx="82" cy="166" r="5"/><circle cx="93" cy="180" r="5"/><circle cx="103" cy="192" r="5"/>
  </g>
  <line x1="70" y1="150" x2="103" y2="192" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="150" y="250" font-size="22" text-anchor="middle">🐢</text>
  <text x="150" y="330" font-size="13.5" font-weight="700" fill="#9a3412" text-anchor="middle">Слишком маленький</text>
  <text x="150" y="350" font-size="12" fill="#64748b" text-anchor="middle">крошечные шаги →</text>
  <text x="150" y="366" font-size="12" fill="#64748b" text-anchor="middle">спускаемся вечно</text>

  <!-- Panel B: just right -->
  <path d="M 310 90 Q 420 300, 530 90" fill="none" stroke="#4f46e5" stroke-width="3"/>
  <g fill="#16a34a" stroke="#166534" stroke-width="1">
    <circle cx="340" cy="150" r="5"/><circle cx="395" cy="225" r="5"/><circle cx="420" cy="248" r="6"/>
  </g>
  <path d="M 340 150 L 395 225 L 420 248" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="420" y="285" font-size="20" text-anchor="middle">🎯</text>
  <text x="420" y="330" font-size="13.5" font-weight="700" fill="#166534" text-anchor="middle">В самый раз</text>
  <text x="420" y="350" font-size="12" fill="#64748b" text-anchor="middle">за несколько шагов →</text>
  <text x="420" y="366" font-size="12" fill="#64748b" text-anchor="middle">точно в минимум</text>

  <!-- Panel C: too big -->
  <path d="M 580 90 Q 690 300, 800 90" fill="none" stroke="#4f46e5" stroke-width="3"/>
  <g fill="#dc2626" stroke="#991b1b" stroke-width="1">
    <circle cx="625" cy="170" r="5"/><circle cx="760" cy="130" r="5"/><circle cx="600" cy="90" r="5"/>
  </g>
  <path d="M 625 170 L 760 130 L 600 90" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <polygon points="596,84 603,96 611,88" fill="#dc2626"/>
  <text x="690" y="250" font-size="20" text-anchor="middle">💥</text>
  <text x="690" y="330" font-size="13.5" font-weight="700" fill="#991b1b" text-anchor="middle">Слишком большой</text>
  <text x="690" y="350" font-size="12" fill="#64748b" text-anchor="middle">перепрыгивает дно →</text>
  <text x="690" y="366" font-size="12" fill="#64748b" text-anchor="middle">улетает (расходится)</text>
</svg>
