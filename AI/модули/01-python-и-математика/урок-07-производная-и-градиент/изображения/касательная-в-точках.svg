<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#f7f9fc"/>
  <text x="360" y="30" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Наклон касательной разный в разных точках</text>

  <!-- axes -->
  <line x1="60" y1="360" x2="680" y2="360" stroke="#475569" stroke-width="2"/><polygon points="688,360 676,354 676,366" fill="#475569"/>
  <line x1="360" y1="380" x2="360" y2="70" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- parabola -->
  <path d="M 185 185 Q 360 470, 535 185" fill="none" stroke="#4f46e5" stroke-width="3"/>
  <text x="560" y="180" font-size="13.5" font-weight="700" fill="#4f46e5">f(x)=x²</text>

  <!-- left point: decreasing -->
  <line x1="180" y1="210" x2="262" y2="288" stroke="#dc2626" stroke-width="3"/>
  <circle cx="221" cy="249" r="6" fill="#1f2937"/>
  <rect x="120" y="150" width="150" height="44" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="195" y="170" font-size="12.5" font-weight="700" fill="#991b1b" text-anchor="middle">наклон &lt; 0</text>
  <text x="195" y="187" font-size="11.5" fill="#991b1b" text-anchor="middle">функция убывает</text>

  <!-- bottom point: flat -->
  <line x1="300" y1="360" x2="420" y2="360" stroke="#16a34a" stroke-width="3"/>
  <circle cx="360" cy="360" r="6" fill="#1f2937"/>
  <rect x="285" y="378" width="150" height="38" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="360" y="396" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">наклон = 0</text>
  <text x="360" y="411" font-size="11" fill="#166534" text-anchor="middle">дно (минимум)</text>

  <!-- right point: increasing -->
  <line x1="458" y1="288" x2="540" y2="210" stroke="#ea580c" stroke-width="3"/>
  <circle cx="499" cy="249" r="6" fill="#1f2937"/>
  <rect x="450" y="150" width="150" height="44" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="525" y="170" font-size="12.5" font-weight="700" fill="#9a3412" text-anchor="middle">наклон &gt; 0</text>
  <text x="525" y="187" font-size="11.5" fill="#9a3412" text-anchor="middle">функция растёт</text>
</svg>
