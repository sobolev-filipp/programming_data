<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="780" height="440" fill="#f7f9fc"/>
  <text x="390" y="32" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Производная «составных» функций — 3 правила</text>

  <!-- Card 1: sum -->
  <rect x="30" y="52" width="720" height="106" rx="12" fill="#ffffff" stroke="#dcfce7" stroke-width="2"/>
  <circle cx="58" cy="80" r="14" fill="#16a34a"/><text x="58" y="85" font-size="14" fill="#fff" font-weight="700" text-anchor="middle">+</text>
  <text x="82" y="85" font-size="15" font-weight="700" fill="#166534">Сумма — берём производную у каждого слагаемого</text>
  <rect x="50" y="100" width="300" height="40" rx="8" fill="#0f172a"/>
  <text x="70" y="125" font-size="15" font-family="monospace" fill="#e2e8f0">(f + g)′ = f′ + g′</text>
  <text x="380" y="118" font-size="13" fill="#334155">Пример:</text>
  <text x="380" y="138" font-size="14" font-family="monospace" fill="#166534">(x² + x³)′ = 2x + 3x²</text>

  <!-- Card 2: constant -->
  <rect x="30" y="168" width="720" height="106" rx="12" fill="#ffffff" stroke="#e0e7ff" stroke-width="2"/>
  <circle cx="58" cy="196" r="14" fill="#4f46e5"/><text x="58" y="201" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">×c</text>
  <text x="82" y="201" font-size="15" font-weight="700" fill="#3730a3">Константа × функция — число выносим вперёд</text>
  <rect x="50" y="216" width="300" height="40" rx="8" fill="#0f172a"/>
  <text x="70" y="241" font-size="15" font-family="monospace" fill="#e2e8f0">(c · f)′ = c · f′</text>
  <text x="380" y="234" font-size="13" fill="#334155">Пример:</text>
  <text x="380" y="254" font-size="14" font-family="monospace" fill="#3730a3">(5x²)′ = 5 · 2x = 10x</text>

  <!-- Card 3: product -->
  <rect x="30" y="284" width="720" height="120" rx="12" fill="#ffffff" stroke="#ffedd5" stroke-width="2"/>
  <circle cx="58" cy="312" r="14" fill="#ea580c"/><text x="58" y="317" font-size="13" fill="#fff" font-weight="700" text-anchor="middle">·</text>
  <text x="82" y="317" font-size="15" font-weight="700" fill="#9a3412">Произведение — «крест-накрест»</text>
  <rect x="50" y="332" width="330" height="40" rx="8" fill="#0f172a"/>
  <text x="70" y="357" font-size="15" font-family="monospace" fill="#e2e8f0">(f · g)′ = f′·g + f·g′</text>
  <text x="410" y="350" font-size="13" fill="#334155">Пример:</text>
  <text x="410" y="370" font-size="13.5" font-family="monospace" fill="#9a3412">(x²·sin x)′ = 2x·sin x + x²·cos x</text>
  <rect x="50" y="378" width="330" height="20" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
  <text x="62" y="392" font-size="12" fill="#991b1b">⚠️ НЕ просто f′·g′ — это частая ошибка!</text>

  <text x="585" y="392" font-size="12" fill="#64748b" text-anchor="middle">Чаще всего нужны</text>
  <text x="585" y="408" font-size="12" fill="#64748b" text-anchor="middle">правила 1 и 2 вместе</text>
</svg>
