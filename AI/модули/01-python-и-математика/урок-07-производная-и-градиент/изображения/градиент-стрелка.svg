<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#f7f9fc"/>
  <text x="360" y="30" font-size="20" font-weight="700" fill="#1f2937" text-anchor="middle">Градиент: куда «вверх по холму», антиградиент — «вниз»</text>
  <text x="360" y="52" font-size="12.5" fill="#64748b" text-anchor="middle">кольца — линии одной высоты (как на карте), центр — дно чаши f(x,y)=x²+y²</text>

  <!-- contours -->
  <g fill="none" stroke="#c7d2fe" stroke-width="2">
    <circle cx="300" cy="250" r="190"/><circle cx="300" cy="250" r="150"/><circle cx="300" cy="250" r="110"/><circle cx="300" cy="250" r="70"/><circle cx="300" cy="250" r="32"/>
  </g>
  <text x="300" y="254" font-size="11" fill="#6366f1" text-anchor="middle">низко</text>
  <text x="300" y="80" font-size="11" fill="#6366f1" text-anchor="middle">высоко</text>
  <!-- minimum -->
  <circle cx="300" cy="250" r="5" fill="#16a34a"/>
  <text x="300" y="274" font-size="11" fill="#166534" text-anchor="middle">минимум (0,0)</text>

  <!-- point (3,4) at screen (390,130) -->
  <circle cx="390" cy="130" r="6" fill="#1f2937"/>
  <text x="400" y="126" font-size="12" font-weight="700" fill="#1f2937">точка (3, 4)</text>

  <!-- gradient arrow (uphill, outward) -->
  <line x1="390" y1="130" x2="447" y2="54" stroke="#dc2626" stroke-width="3.5"/><polygon points="452,47 438,54 447,63" fill="#dc2626"/>
  <text x="458" y="48" font-size="12.5" font-weight="700" fill="#dc2626">∇f — вверх (рост)</text>

  <!-- antigradient (downhill, inward) -->
  <line x1="390" y1="130" x2="333" y2="206" stroke="#16a34a" stroke-width="3.5"/><polygon points="328,213 337,200 346,209" fill="#16a34a"/>
  <text x="196" y="210" font-size="12.5" font-weight="700" fill="#166534">−∇f — вниз (к минимуму)</text>

  <!-- panel -->
  <rect x="520" y="250" width="180" height="120" rx="12" fill="#0f172a"/>
  <text x="538" y="280" font-size="13" font-family="monospace" fill="#86efac">в точке (3, 4):</text>
  <text x="538" y="306" font-size="13.5" font-family="monospace" fill="#e2e8f0">∇f = [6, 8]</text>
  <text x="538" y="332" font-size="13.5" font-family="monospace" fill="#fca5a5">рост ↑</text>
  <text x="538" y="356" font-size="13.5" font-family="monospace" fill="#86efac">−∇f = [−6, −8] ↓</text>

  <rect x="40" y="398" width="660" height="30" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="56" y="418" font-size="12.5" fill="#713f12">💡 Градиент всегда смотрит в сторону самого крутого подъёма. Чтобы спускаться — идём ровно наоборот.</text>
</svg>
