<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="700" height="440" fill="#f7f9fc"/>
  <text x="350" y="30" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">Что рисует код: функция f(x)=x² и её производная f′(x)=2x</text>

  <!-- axes -->
  <line x1="55" y1="250" x2="660" y2="250" stroke="#475569" stroke-width="2"/><polygon points="668,250 656,244 656,256" fill="#475569"/>
  <line x1="350" y1="380" x2="350" y2="40" stroke="#475569" stroke-width="2"/><polygon points="350,32 344,44 356,44" fill="#475569"/>
  <g font-size="11" fill="#94a3b8" font-family="monospace" text-anchor="middle">
    <text x="75" y="266">-5</text><text x="625" y="266">5</text><text x="362" y="266">0</text>
  </g>
  <text x="652" y="242" font-size="12" fill="#94a3b8">x</text>

  <!-- parabola -->
  <polyline points="75,25 130,106 185,169 240,214 295,241 350,250 405,241 460,214 515,169 570,106 625,25" fill="none" stroke="#4f46e5" stroke-width="3"/>
  <text x="150" y="60" font-size="13.5" font-weight="700" fill="#4f46e5">f(x) = x²</text>

  <!-- derivative line -->
  <line x1="75" y1="340" x2="625" y2="160" stroke="#ea580c" stroke-width="3"/>
  <text x="520" y="330" font-size="13.5" font-weight="700" fill="#ea580c">f′(x) = 2x</text>

  <!-- highlight x=0 -->
  <circle cx="350" cy="250" r="6" fill="#16a34a"/>
  <text x="358" y="290" font-size="12" fill="#166534">в x=0: производная 0</text>
  <text x="358" y="306" font-size="12" fill="#166534">(дно параболы, оранжевая</text>
  <text x="358" y="322" font-size="12" fill="#166534">линия пересекает ось)</text>

  <!-- left/right notes -->
  <text x="120" y="360" font-size="11.5" fill="#9a3412">слева f′&lt;0</text>
  <text x="560" y="150" font-size="11.5" fill="#9a3412">справа f′&gt;0</text>

  <rect x="55" y="398" width="605" height="30" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="71" y="418" font-size="12.5" fill="#713f12">💡 Оранжевая линия — «скорость» синей: где парабола круче, там производная больше (линия выше).</text>
</svg>
