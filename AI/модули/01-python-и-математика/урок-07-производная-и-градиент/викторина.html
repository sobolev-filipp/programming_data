<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 1.7: Производная и градиент</title>
<style>
  :root{
    --bg1:#4338ca; --bg2:#06b6d4; --card:#ffffff; --ink:#1f2937;
    --accent:#4f46e5; --ok:#16a34a; --bad:#dc2626; --soft:#e0e7ff;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
 {
  "q": "Что такое производная простыми словами?",
  "a": [
   "Площадь всей фигуры под графиком функции на отрезке",
   "Скорость изменения функции (наклон касательной)",
   "Сумма всех значений функции по порядку",
   "Самое большое значение функции на этом графике"
  ],
  "c": 1,
  "e": "Производная — насколько быстро меняется функция; геометрически это наклон касательной."
 },
 {
  "q": "Производная в точке минимума функции равна...",
  "a": [
   "Самому большому значению функции на графике",
   "Нулю — касательная лежит горизонтально",
   "Бесконечности, потому что график обрывается",
   "Минус единице в любой точке минимума"
  ],
  "c": 1,
  "e": "В минимуме (и максимуме) касательная горизонтальна → производная равна 0."
 },
 {
  "q": "Формула численной производной (центральная разность)?",
  "a": [
   "<code>(f(x) + f(x+h)) / (h * h)</code>",
   "<code>(f(x+h) - f(x-h)) / (2*h)</code>",
   "<code>(f(x) - f(x-h)) * 2 * h</code>",
   "<code>(f(x+h) + f(x)) / x</code>"
  ],
  "c": 1,
  "e": "Берём значение чуть правее и чуть левее и делим на 2h — так приближаем наклон."
 },
 {
  "q": "Что такое градиент?",
  "a": [
   "Одно число — наклон функции в единственной точке",
   "Вектор частных производных для функции многих переменных",
   "Большая таблица со всеми данными обучающей выборки, собранными вместе",
   "Плавный переход цвета от одного оттенка к другому"
  ],
  "c": 1,
  "e": "Градиент — набор производных по каждой переменной; это вектор направления роста."
 },
 {
  "q": "Куда указывает градиент?",
  "a": [
   "Всегда строго вниз, в сторону минимума функции",
   "В сторону самого быстрого РОСТА функции",
   "В случайную сторону, свою на каждом шаге спуска",
   "Никуда — это просто число без направления"
  ],
  "c": 1,
  "e": "Градиент показывает направление наибольшего роста; антиградиент — вниз."
 },
 {
  "q": "Чтобы функция УБЫВАЛА, надо идти...",
  "a": [
   "По градиенту — туда, куда показывает его стрелка",
   "Против градиента (в сторону антиградиента)",
   "Перпендикулярно градиенту, ровно вбок",
   "По кругу вокруг текущей точки"
  ],
  "c": 1,
  "e": "Спуск в минимум — это движение против градиента."
 },
 {
  "q": "Формула шага градиентного спуска?",
  "a": [
   "<code>x = x + lr * grad</code>",
   "<code>x = x - lr * grad</code>",
   "<code>x = x * lr - grad</code>",
   "<code>x = grad - lr * x</code>"
  ],
  "c": 1,
  "e": "Новая точка = старая минус learning_rate × градиент (минус = идём вниз)."
 },
 {
  "q": "Что такое learning rate (lr)?",
  "a": [
   "Текущая ошибка модели на обучающих данных",
   "Размер одного шага градиентного спуска",
   "Количество слоёв в нейронной сети",
   "Точность предсказаний модели после обучения"
  ],
  "c": 1,
  "e": "lr задаёт, насколько большой шаг мы делаем при спуске."
 },
 {
  "q": "Что будет при слишком БОЛЬШОМ learning rate?",
  "a": [
   "Спуск идеально и очень быстро сходится прямо в минимум",
   "Точка «перепрыгивает» минимум, спуск расходится",
   "Спуск замирает и совсем перестаёт двигаться",
   "Ничего не изменится по сравнению с маленьким шагом"
  ],
  "c": 1,
  "e": "Большой шаг проскакивает минимум и улетает всё дальше — спуск расходится."
 },
 {
  "q": "А при слишком МАЛЕНЬКОМ lr?",
  "a": [
   "Спуск расходится и улетает в бесконечность",
   "Сходится к минимуму, но очень медленно",
   "Сразу выдаёт ошибку и останавливается",
   "Мгновенно оказывается точно в минимуме"
  ],
  "c": 1,
  "e": "Маленький шаг ведёт к минимуму, но за очень много итераций."
 },
 {
  "q": "Производная больше 0 означает, что функция...",
  "a": [
   "Убывает",
   "Растёт",
   "Стоит на месте",
   "Обрывается"
  ],
  "c": 1,
  "e": "Положительный наклон = функция растёт; отрицательный = убывает."
 },
 {
  "q": "Чему равна производная x² в точке x?",
  "a": [
   "x",
   "2x",
   "x²",
   "2"
  ],
  "c": 1,
  "e": "(x²)' = 2x — наклон вдвое больше самой точки."
 },
 {
  "q": "Как связаны градиентный спуск и нейросети?",
  "a": [
   "Никак не связаны — это совершенно разные вещи",
   "Нейросети обучаются именно градиентным спуском",
   "Градиентный спуск нужен только очень большим сетям",
   "Связь есть только у самых маленьких сетей"
  ],
  "c": 1,
  "e": "Каждый шаг обучения сети — это params = params − lr × gradient."
 }
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>📉 Производная и градиент</h1>
    <div class="sub">Викторина по уроку 1.7 · Нейросети</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg="Идеально! Производная, градиент, градиентный спуск — база обучения сетей! 📉";}
  else if(pct>=70){em='🎉';msg="Отлично! Смысл производной и градиентного спуска ты понимаешь.";}
  else if(pct>=40){em='👍';msg="Неплохо! Повтори: производная — наклон; спуск — идём ПРОТИВ градиента.";}
  else {em='💪';msg="Ещё разок! Загляни в summary — там численная производная и формула шага.";}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
