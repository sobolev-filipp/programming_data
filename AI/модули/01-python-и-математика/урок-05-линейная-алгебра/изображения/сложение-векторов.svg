<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="780" height="420" fill="#f7f9fc"/>
  <text x="390" y="32" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">➕ Сложение векторов: стрелки «хвост к голове»</text>

  <!-- grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="70" y1="98" x2="70" y2="350"/><line x1="112" y1="98" x2="112" y2="350"/><line x1="154" y1="98" x2="154" y2="350"/><line x1="196" y1="98" x2="196" y2="350"/><line x1="238" y1="98" x2="238" y2="350"/><line x1="280" y1="98" x2="280" y2="350"/><line x1="322" y1="98" x2="322" y2="350"/>
    <line x1="70" y1="350" x2="322" y2="350"/><line x1="70" y1="308" x2="322" y2="308"/><line x1="70" y1="266" x2="322" y2="266"/><line x1="70" y1="224" x2="322" y2="224"/><line x1="70" y1="182" x2="322" y2="182"/><line x1="70" y1="140" x2="322" y2="140"/><line x1="70" y1="98" x2="322" y2="98"/>
  </g>
  <line x1="70" y1="350" x2="340" y2="350" stroke="#475569" stroke-width="2"/><polygon points="348,350 336,344 336,356" fill="#475569"/>
  <line x1="70" y1="350" x2="70" y2="90" stroke="#475569" stroke-width="2"/><polygon points="70,82 64,94 76,94" fill="#475569"/>
  <g font-size="11" fill="#94a3b8" font-family="monospace" text-anchor="middle"><text x="112" y="365">1</text><text x="196" y="365">3</text><text x="280" y="365">5</text></g>

  <!-- a -->
  <line x1="70" y1="350" x2="193" y2="143" stroke="#4f46e5" stroke-width="3.5"/><polygon points="196,140 184,145 190,153" fill="#4f46e5"/>
  <text x="80" y="178" font-size="13" font-weight="700" fill="#4f46e5">a=[3,5]</text>
  <!-- b appended -->
  <line x1="196" y1="140" x2="277" y2="100" stroke="#ea580c" stroke-width="3.5" stroke-dasharray="6 3"/><polygon points="280,98 268,100 272,109" fill="#ea580c"/>
  <text x="286" y="108" font-size="13" font-weight="700" fill="#ea580c">b=[2,1]</text>
  <!-- result -->
  <line x1="70" y1="350" x2="277" y2="101" stroke="#16a34a" stroke-width="3" opacity="0.85"/><polygon points="280,98 268,101 273,110" fill="#16a34a"/>
  <text x="214" y="300" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle">a+b=[5,6]</text>

  <!-- panel -->
  <rect x="430" y="90" width="310" height="92" rx="10" fill="#0f172a"/>
  <text x="450" y="116" font-size="14" font-family="monospace" fill="#e2e8f0">a = np.array([3, 5])</text>
  <text x="450" y="138" font-size="14" font-family="monospace" fill="#e2e8f0">b = np.array([2, 1])</text>
  <text x="450" y="162" font-size="14" font-family="monospace" fill="#a5b4fc">a + b  →  [5 6]</text>

  <text x="430" y="214" font-size="14" fill="#334155">Складываем ПОЭЛЕМЕНТНО:</text>
  <text x="448" y="240" font-size="14" font-family="monospace" fill="#16a34a">3 + 2 = 5   (по X)</text>
  <text x="448" y="262" font-size="14" font-family="monospace" fill="#16a34a">5 + 1 = 6   (по Y)</text>

  <rect x="430" y="292" width="310" height="82" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="448" y="318" font-size="13" fill="#713f12">💡 На картинке: приставляем начало b</text>
  <text x="448" y="340" font-size="13" fill="#713f12">к концу a. Зелёная стрелка от начала</text>
  <text x="448" y="362" font-size="13" fill="#713f12">до конца b — это и есть сумма.</text>
</svg>
