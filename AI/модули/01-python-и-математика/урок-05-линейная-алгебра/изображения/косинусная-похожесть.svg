<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="840" height="400" fill="#f7f9fc"/>
  <text x="420" y="32" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">🧭 Косинусная похожесть = cos угла между векторами</text>
  <text x="420" y="56" font-size="13.5" fill="#64748b" text-anchor="middle">Делим скалярное произведение на длины — и остаётся только «похожесть направлений».</text>

  <!-- left: two vectors with angle -->
  <line x1="110" y1="300" x2="340" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="110" y1="300" x2="110" y2="110" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- vector a -->
  <line x1="110" y1="300" x2="300" y2="150" stroke="#4f46e5" stroke-width="3.5"/><polygon points="304,147 291,150 297,159" fill="#4f46e5"/>
  <text x="270" y="140" font-size="13" font-weight="700" fill="#4f46e5">a</text>
  <!-- vector b -->
  <line x1="110" y1="300" x2="320" y2="210" stroke="#16a34a" stroke-width="3.5"/><polygon points="324,208 311,209 316,219" fill="#16a34a"/>
  <text x="300" y="228" font-size="13" font-weight="700" fill="#16a34a">b</text>
  <!-- angle arc -->
  <path d="M 170 262 A 70 70 0 0 1 182 274" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <text x="192" y="258" font-size="13" font-weight="700" fill="#ea580c">угол</text>

  <!-- formula -->
  <rect x="70" y="326" width="300" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="220" y="358" font-size="16" font-family="monospace" font-weight="700" fill="#5b21b6" text-anchor="middle">cos = (a·b) / (|a|·|b|)</text>

  <!-- right: similarity scale -->
  <text x="610" y="110" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">Результат — число от −1 до 1:</text>
  <!-- scale bar zones -->
  <rect x="440" y="150" width="119" height="22" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <rect x="559" y="150" width="102" height="22" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <rect x="661" y="150" width="119" height="22" fill="#bbf7d0" stroke="#16a34a" stroke-width="1"/>
  <!-- ticks -->
  <g font-size="12" font-family="monospace" fill="#475569" text-anchor="middle">
    <text x="440" y="192">−1</text><text x="610" y="192">0</text><text x="780" y="192">1</text>
  </g>
  <text x="499" y="138" font-size="11.5" fill="#991b1b" text-anchor="middle">противоположны</text>
  <text x="610" y="138" font-size="11.5" fill="#475569" text-anchor="middle">не связаны</text>
  <text x="720" y="138" font-size="11.5" fill="#166534" text-anchor="middle">похожи</text>

  <!-- example points -->
  <circle cx="678" cy="161" r="5" fill="#0f766e"/>
  <text x="678" y="228" font-size="12" fill="#0f766e" text-anchor="middle">Анна·Вика</text>
  <text x="678" y="244" font-size="12" font-family="monospace" font-weight="700" fill="#0f766e" text-anchor="middle">0.40</text>
  <line x1="678" y1="172" x2="678" y2="214" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="3 3"/>

  <circle cx="770" cy="161" r="5" fill="#15803d"/>
  <text x="760" y="276" font-size="12" fill="#15803d" text-anchor="middle">Анна·Борис</text>
  <text x="760" y="292" font-size="12" font-family="monospace" font-weight="700" fill="#15803d" text-anchor="middle">0.94</text>
  <line x1="770" y1="172" x2="770" y2="262" stroke="#15803d" stroke-width="1.5" stroke-dasharray="3 3"/>

  <rect x="440" y="326" width="360" height="52" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="620" y="348" font-size="12.5" fill="#713f12" text-anchor="middle">💡 Деление на длины убирает «размер» векторов —</text>
  <text x="620" y="366" font-size="12.5" fill="#713f12" text-anchor="middle">остаётся чистый угол. Поэтому это и есть cos.</text>
</svg>
