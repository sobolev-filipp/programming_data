<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="360" fill="#f7f9fc"/>
  <text x="410" y="32" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">📐 Теорема Пифагора: катет² + катет² = гипотенуза²</text>
  <text x="410" y="56" font-size="13.5" fill="#64748b" text-anchor="middle">Площадь квадрата на длинной стороне = сумма площадей квадратов на двух коротких.</text>

  <!-- triangle -->
  <polygon points="80,270 200,270 80,170" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <rect x="80" y="254" width="16" height="16" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="140" y="290" font-size="13" font-weight="700" fill="#16a34a" text-anchor="middle">катет 3</text>
  <text x="58" y="225" font-size="13" font-weight="700" fill="#ea580c" text-anchor="middle" transform="rotate(-90 58 225)">катет 4</text>
  <text x="152" y="212" font-size="13" font-weight="700" fill="#4f46e5" transform="rotate(-40 152 212)">гипот. 5</text>

  <!-- squares row -->
  <!-- 3x3 = 9 -->
  <g>
    <rect x="300" y="196" width="42" height="42" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <g stroke="#16a34a" stroke-width="0.8" opacity="0.6"><line x1="314" y1="196" x2="314" y2="238"/><line x1="328" y1="196" x2="328" y2="238"/><line x1="300" y1="210" x2="342" y2="210"/><line x1="300" y1="224" x2="342" y2="224"/></g>
    <text x="321" y="262" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">3² = 9</text>
  </g>
  <text x="365" y="222" font-size="24" fill="#64748b" text-anchor="middle">+</text>
  <!-- 4x4 = 16 -->
  <g>
    <rect x="388" y="189" width="56" height="56" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
    <g stroke="#ea580c" stroke-width="0.8" opacity="0.6"><line x1="402" y1="189" x2="402" y2="245"/><line x1="416" y1="189" x2="416" y2="245"/><line x1="430" y1="189" x2="430" y2="245"/><line x1="388" y1="203" x2="444" y2="203"/><line x1="388" y1="217" x2="444" y2="217"/><line x1="388" y1="231" x2="444" y2="231"/></g>
    <text x="416" y="262" font-size="13" font-weight="700" fill="#9a3412" text-anchor="middle">4² = 16</text>
  </g>
  <text x="470" y="222" font-size="24" fill="#64748b" text-anchor="middle">=</text>
  <!-- 5x5 = 25 -->
  <g>
    <rect x="496" y="182" width="70" height="70" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8"/>
    <g stroke="#4f46e5" stroke-width="0.8" opacity="0.6"><line x1="510" y1="182" x2="510" y2="252"/><line x1="524" y1="182" x2="524" y2="252"/><line x1="538" y1="182" x2="538" y2="252"/><line x1="552" y1="182" x2="552" y2="252"/><line x1="496" y1="196" x2="566" y2="196"/><line x1="496" y1="210" x2="566" y2="210"/><line x1="496" y1="224" x2="566" y2="224"/><line x1="496" y1="238" x2="566" y2="238"/></g>
    <text x="531" y="272" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">5² = 25</text>
  </g>
  <!-- equation -->
  <text x="630" y="200" font-size="15" font-family="monospace" fill="#334155">9 + 16 = 25</text>
  <text x="630" y="228" font-size="15" font-family="monospace" fill="#334155">√25 = 5</text>

  <rect x="60" y="306" width="700" height="42" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="410" y="333" font-size="13.5" fill="#713f12" text-anchor="middle">💡 Длина вектора — это гипотенуза. Поэтому норма = √(сумма квадратов координат).</text>
</svg>
