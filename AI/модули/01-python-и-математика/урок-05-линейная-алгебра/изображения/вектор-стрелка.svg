<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="780" height="420" fill="#f7f9fc"/>
  <text x="390" y="32" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">➡️ Вектор [3, 5] — это стрелка из начала координат</text>

  <!-- grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="90" y1="60" x2="90" y2="340"/><line x1="130" y1="60" x2="130" y2="340"/><line x1="170" y1="60" x2="170" y2="340"/><line x1="210" y1="60" x2="210" y2="340"/><line x1="250" y1="60" x2="250" y2="340"/><line x1="290" y1="60" x2="290" y2="340"/><line x1="330" y1="60" x2="330" y2="340"/><line x1="370" y1="60" x2="370" y2="340"/>
    <line x1="90" y1="340" x2="370" y2="340"/><line x1="90" y1="300" x2="370" y2="300"/><line x1="90" y1="260" x2="370" y2="260"/><line x1="90" y1="220" x2="370" y2="220"/><line x1="90" y1="180" x2="370" y2="180"/><line x1="90" y1="140" x2="370" y2="140"/><line x1="90" y1="100" x2="370" y2="100"/><line x1="90" y1="60" x2="370" y2="60"/>
  </g>
  <!-- axes -->
  <line x1="90" y1="340" x2="388" y2="340" stroke="#475569" stroke-width="2"/><polygon points="396,340 384,334 384,346" fill="#475569"/>
  <line x1="90" y1="340" x2="90" y2="52" stroke="#475569" stroke-width="2"/><polygon points="90,44 84,56 96,56" fill="#475569"/>
  <text x="396" y="360" font-size="13" fill="#475569">X</text><text x="72" y="52" font-size="13" fill="#475569">Y</text>
  <!-- axis numbers -->
  <g font-size="11" fill="#94a3b8" font-family="monospace" text-anchor="middle">
    <text x="130" y="356">1</text><text x="170" y="356">2</text><text x="210" y="356">3</text><text x="250" y="356">4</text><text x="290" y="356">5</text>
    <text x="78" y="304">1</text><text x="78" y="224">3</text><text x="78" y="144">5</text>
  </g>
  <text x="80" y="356" font-size="11" fill="#94a3b8" text-anchor="middle">0</text>

  <!-- components -->
  <line x1="90" y1="340" x2="210" y2="340" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="150" y="332" font-size="12" fill="#16a34a" text-anchor="middle">3 вправо</text>
  <line x1="210" y1="340" x2="210" y2="140" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="238" y="245" font-size="12" fill="#ea580c" text-anchor="middle">5 вверх</text>

  <!-- vector -->
  <line x1="90" y1="340" x2="206" y2="146" stroke="#4f46e5" stroke-width="3.5"/><polygon points="210,140 198,145 204,153" fill="#4f46e5"/>
  <circle cx="210" cy="140" r="4" fill="#4f46e5"/>
  <text x="222" y="134" font-size="13" font-weight="700" fill="#4f46e5">(3, 5)</text>

  <!-- side panel -->
  <rect x="440" y="80" width="300" height="60" rx="10" fill="#0f172a"/>
  <text x="460" y="106" font-size="14" font-family="monospace" fill="#e2e8f0">v = np.array([3, 5])</text>
  <text x="460" y="128" font-size="13" font-family="monospace" fill="#94a3b8">v.shape → (2,)</text>

  <text x="440" y="176" font-size="14" fill="#334155">Два числа в векторе — это</text>
  <text x="440" y="198" font-size="14" fill="#334155">две «команды» стрелке:</text>
  <text x="458" y="226" font-size="13.5" fill="#16a34a">• первое (3) — сдвиг вправо по X</text>
  <text x="458" y="250" font-size="13.5" fill="#ea580c">• второе (5) — сдвиг вверх по Y</text>

  <rect x="440" y="286" width="300" height="88" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="458" y="312" font-size="13" fill="#713f12">💡 Массив и стрелка — одно и то же.</text>
  <text x="458" y="334" font-size="13" fill="#713f12">Длина стрелки = «норма» (раздел 2.3),</text>
  <text x="458" y="356" font-size="13" fill="#713f12">направление = куда она смотрит.</text>
</svg>
