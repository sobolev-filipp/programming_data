<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="780" height="420" fill="#f7f9fc"/>
  <text x="390" y="32" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">📏 Длина вектора (норма) = теорема Пифагора</text>

  <!-- grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="80" x2="80" y2="330"/><line x1="130" y1="80" x2="130" y2="330"/><line x1="180" y1="80" x2="180" y2="330"/><line x1="230" y1="80" x2="230" y2="330"/><line x1="280" y1="80" x2="280" y2="330"/>
    <line x1="80" y1="330" x2="280" y2="330"/><line x1="80" y1="280" x2="280" y2="280"/><line x1="80" y1="230" x2="280" y2="230"/><line x1="80" y1="180" x2="280" y2="180"/><line x1="80" y1="130" x2="280" y2="130"/><line x1="80" y1="80" x2="280" y2="80"/>
  </g>
  <line x1="80" y1="330" x2="310" y2="330" stroke="#475569" stroke-width="2"/><polygon points="318,330 306,324 306,336" fill="#475569"/>
  <line x1="80" y1="330" x2="80" y2="72" stroke="#475569" stroke-width="2"/><polygon points="80,64 74,76 86,76" fill="#475569"/>
  <g font-size="11" fill="#94a3b8" font-family="monospace" text-anchor="middle"><text x="130" y="346">1</text><text x="180" y="346">2</text><text x="230" y="346">3</text></g>

  <!-- legs -->
  <line x1="80" y1="330" x2="230" y2="330" stroke="#16a34a" stroke-width="3"/>
  <text x="155" y="348" font-size="13" font-weight="700" fill="#16a34a">катет 3</text>
  <line x1="230" y1="330" x2="230" y2="130" stroke="#ea580c" stroke-width="3"/>
  <text x="238" y="235" font-size="13" font-weight="700" fill="#ea580c">катет 4</text>
  <!-- right angle mark -->
  <rect x="214" y="314" width="16" height="16" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- hypotenuse / vector -->
  <line x1="80" y1="330" x2="226" y2="133" stroke="#4f46e5" stroke-width="3.5"/><polygon points="230,130 218,135 224,143" fill="#4f46e5"/>
  <text x="120" y="215" font-size="13" font-weight="700" fill="#4f46e5" transform="rotate(-38 120 215)">длина = 5</text>
  <text x="236" y="124" font-size="12" font-weight="700" fill="#4f46e5">(3, 4)</text>

  <!-- panel -->
  <rect x="370" y="88" width="380" height="118" rx="10" fill="#0f172a"/>
  <text x="390" y="116" font-size="14" font-family="monospace" fill="#e2e8f0">длина = √(3² + 4²)</text>
  <text x="390" y="140" font-size="14" font-family="monospace" fill="#e2e8f0">      = √(9 + 16) = √25 = 5</text>
  <text x="390" y="170" font-size="13.5" font-family="monospace" fill="#a5b4fc">np.linalg.norm([3, 4])  → 5.0</text>
  <text x="390" y="192" font-size="13.5" font-family="monospace" fill="#94a3b8">np.sqrt((v**2).sum())   → 5.0</text>

  <rect x="370" y="222" width="380" height="118" rx="12" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/>
  <text x="388" y="248" font-size="13.5" fill="#713f12">💡 Рецепт: возвести каждое число в квадрат,</text>
  <text x="388" y="270" font-size="13.5" fill="#713f12">сложить, взять корень. Работает для любого</text>
  <text x="388" y="292" font-size="13.5" fill="#713f12">числа измерений:</text>
  <text x="388" y="316" font-size="13" font-family="monospace" fill="#713f12">[3,4,12] → √(9+16+144)=√169=13</text>
</svg>
