<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 390" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="390" fill="#f7f9fc"/>
  <text x="410" y="32" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">✴️ Умножение матриц: строка × столбец</text>
  <text x="410" y="56" font-size="13.5" fill="#64748b" text-anchor="middle">Элемент C[i,j] = скалярное произведение i-й строки A и j-го столбца B.</text>

  <!-- A -->
  <text x="150" y="92" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">A</text>
  <g font-family="monospace" font-size="20" text-anchor="middle">
    <rect x="110" y="100" width="48" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="134" y="130" fill="#1e40af">1</text>
    <rect x="160" y="100" width="48" height="46" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="184" y="130" fill="#1e40af">2</text>
    <rect x="110" y="148" width="48" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="134" y="178" fill="#334155">3</text>
    <rect x="160" y="148" width="48" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="184" y="178" fill="#334155">4</text>
  </g>
  <text x="224" y="130" font-size="11" fill="#2563eb">строка 0</text>

  <text x="236" y="152" font-size="22" fill="#64748b" text-anchor="middle">@</text>

  <!-- B -->
  <text x="300" y="92" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">B</text>
  <g font-family="monospace" font-size="20" text-anchor="middle">
    <rect x="262" y="100" width="48" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="286" y="130" fill="#166534">5</text>
    <rect x="312" y="100" width="48" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="336" y="130" fill="#334155">6</text>
    <rect x="262" y="148" width="48" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="286" y="178" fill="#166534">7</text>
    <rect x="312" y="148" width="48" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="336" y="178" fill="#334155">8</text>
  </g>
  <text x="286" y="212" font-size="11" fill="#16a34a" text-anchor="middle">столбец 0</text>

  <text x="392" y="152" font-size="22" fill="#64748b" text-anchor="middle">=</text>

  <!-- C -->
  <text x="470" y="92" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">C</text>
  <g font-family="monospace" font-size="20" text-anchor="middle">
    <rect x="430" y="100" width="58" height="46" rx="6" fill="#fef08a" stroke="#eab308" stroke-width="2.5"/><text x="459" y="130" fill="#854d0e" font-weight="700">19</text>
    <rect x="490" y="100" width="58" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="519" y="130" fill="#334155">22</text>
    <rect x="430" y="148" width="58" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="459" y="178" fill="#334155">43</text>
    <rect x="490" y="148" width="58" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="519" y="178" fill="#334155">50</text>
  </g>

  <!-- computation of C[0,0] -->
  <rect x="110" y="250" width="600" height="70" rx="12" fill="#fffbeb" stroke="#eab308" stroke-width="2"/>
  <text x="130" y="278" font-size="14" font-family="monospace" fill="#854d0e">C[0,0] = строка A[0] · столбец B[0]</text>
  <text x="130" y="302" font-size="14" font-family="monospace" fill="#854d0e">       = [1, 2] · [5, 7] = 1·5 + 2·7 = 5 + 14 = <tspan font-weight="700">19</tspan></text>

  <rect x="110" y="334" width="600" height="40" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="410" y="359" font-size="13" fill="#3730a3" text-anchor="middle">Размеры: (2,2) @ (2,2) → (2,2). Правило: столбцы A = строки B. ⚠️ A @ B ≠ A * B!</text>
</svg>
