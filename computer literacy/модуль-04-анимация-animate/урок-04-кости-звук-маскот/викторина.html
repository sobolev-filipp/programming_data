<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Говорящий маскот</title>
<style>
  :root{
    --bg1:#14B8A6; --bg2:#0EA5E9; --card:#ffffff; --ink:#0f172a;
    --accent:#0891B2; --ok:#16a34a; --bad:#dc2626; --soft:#cffafe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что такое риг (rig)?",
   a:["Фильтр","«Скелет» из костей внутри персонажа для управления","Экспорт","Цвет заливки"],c:1,
   e:"Поставил кости — и двигаешь персонажа за кончик, а не каждую деталь отдельно."},
  {q:"Что такое IK (инверсная кинематика)?",
   a:["Тянешь за кончик — сгибается вся цепочка костей","Смена слоя","Морфинг","Импорт звука"],c:0,
   e:"Тянешь кисть — плечо и локоть подстраиваются сами, как настоящая рука."},
  {q:"Каким инструментом ставят кости?",
   a:["«Перо»","«Кость» (Bone Tool, клавиша M)","«Овал»","«Текст»"],c:1,
   e:"Значок косточки на панели слева; протягиваешь цепочку по деталям."},
  {q:"Куда переезжают детали после установки костей?",
   a:["На новый зелёный слой «Арматура»","В корзину","В библиотеку","На слой «звук»"],c:0,
   e:"Позы (движения) IK ставят только на этом слое-арматуре."},
  {q:"Как импортировать звук в проект?",
   a:["F8","Файл → Импорт → Импортировать в библиотеку","Ctrl+B","Экспорт GIF"],c:1,
   e:"Звук ложится в Библиотеку, оттуда его тянут на слой звука."},
  {q:"Какая синхронизация звука нужна для липсинка?",
   a:["«Событие»","«Поток» (Stream)","«Остановить»","«Начать»"],c:1,
   e:"«Поток» привязывает звук к таймлайну — рот успевает за голосом."},
  {q:"Что такое липсинк?",
   a:["Смена цвета","Синхронизация рта со звуком (смена форм рта)","Путь движения","Кнопка"],c:1,
   e:"Несколько форм рта в кадрах под слоги создают иллюзию речи."},
  {q:"Что нужно, чтобы маскот ждал нажатия кнопки?",
   a:["Ярче цвет","this.stop(); на кадре 1","Больше кадров","Морфинг"],c:1,
   e:"Стоп в начале останавливает проигрывание, пока не кликнут кнопку."},
  {q:"Сколько состояний-кадров у символа «Кнопка»?",
   a:["1","2","4 (Вверх / Над / Нажатие / Область)","10"],c:2,
   e:"Up / Over / Down / Hit — обычное, наведение, нажатие, зона клика."},
  {q:"Как проще всего добавить код кнопке?",
   a:["Написать с нуля","Через панель «Фрагменты кода»","Через фильтр","Через морфинг"],c:1,
   e:"Готовый фрагмент «Щёлкните, чтобы перейти к кадру и играть» впишет код сам."},

  {q:"😄 Рука выгибается «наизнанку», локоть смотрит не туда. Почему?",
   a:["Так задумано","Кости вели задом наперёд / нет ограничения сустава","Мало цвета","Нет звука"],c:1,
   e:"Веди кости плечо→локоть→кисть и включи «Ограничить вращение» сустава."},
  {q:"😄 Маскот заговорил сам, ещё до нажатия кнопки. В чём беда?",
   a:["Забыл this.stop(); на кадре 1","Мало кадров","Не тот цвет","Нет рта"],c:0,
   e:"Без стопа сцена играет сама — кнопка становится бесполезной."},
  {q:"😄 Рот открыт всё время, будто маскот «завис в зевке». Что делать?",
   a:["Добавить звук","Менять формы рта (2–4) под слоги","Ярче фон","Больше костей"],c:1,
   e:"Одна форма = «завис». Нужна смена открыт/закрыт хотя бы 2–3 раза за слово."},

  {q:"🤔 Почему IK удобнее, чем двигать каждую деталь руки отдельно?",
   a:["Так ярче","Тянешь кончик — вся цепочка подстраивается сама","Быстрее грузит","Случайно"],c:1,
   e:"Один жест вместо ручной подгонки плеча, локтя и кисти по отдельности."},
  {q:"🤔 Почему рот открывают на гласных, а закрывают на М/П/Б?",
   a:["Каприз","Так реально движутся губы — речь выглядит правдоподобно","Для веса","Для цвета"],c:1,
   e:"Совпадение с реальной артикуляцией создаёт убедительную иллюзию речи."},
  {q:"🤔 Почему GIF не годится для «говорящего с кнопкой» маскота?",
   a:["GIF слишком яркий","GIF не хранит звук и клики — нужен HTML или MP4","GIF без цвета","GIF медленный"],c:1,
   e:"Для звука и интерактива экспортируй HTML5 (клик) или MP4 (звук)."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🤖 Говорящий маскот</h1>
    <div class="sub">Викторина по уроку «Кости, звук и кнопка»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты настоящий кукловод-аниматор! 🤖';}
  else if(pct>=70){em='🎉';msg='Отлично! Кости, звук, липсинк и кнопка — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Помни: IK — тянешь кончик; звук — «Поток»; кнопка — сначала stop().';}
  else {em='💪';msg='Начало есть! Перечитай про кости, «Поток» и кнопку-триггер.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
