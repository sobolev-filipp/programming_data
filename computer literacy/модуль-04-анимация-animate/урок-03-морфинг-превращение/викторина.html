<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Морфинг форм</title>
<style>
  :root{
    --bg1:#38BDF8; --bg2:#A78BFA; --card:#ffffff; --ink:#1e293b;
    --accent:#7c3aed; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что такое морфинг (анимация формы)?",
   a:["Полёт по пути","Плавное превращение одной формы в другую","Смена слоя","Экспорт"],c:1,
   e:"Программа сама дорисовывает промежуточные формы между двумя фигурами."},
  {q:"Морфинг работает с чем?",
   a:["С символами","С чистыми фигурами (заливками)","С группами","С текстом-символом"],c:1,
   e:"Наоборот движению: морфинг — для фигур, а motion tween — для символов."},
  {q:"Какого цвета диапазон морфинга на таймлайне?",
   a:["Синий","Зелёный","Красный","Серый"],c:1,
   e:"Зелёный = анимация формы; синий/оранжевый = анимация движения."},
  {q:"Объект — символ, морфинг не создаётся. Что сделать?",
   a:["Экспорт","Изменить → Разделить (Ctrl+B) — до фигуры","Новый слой","Сменить цвет"],c:1,
   e:"Break Apart превращает символ/группу в чистые фигуры."},
  {q:"Что делают фигурные подсказки (a, b, c)?",
   a:["Красят форму","Управляют, какая точка куда перетекает","Ускоряют","Добавляют звук"],c:1,
   e:"Без них форма может «мяться»; подсказки задают аккуратное перетекание."},
  {q:"Как ставить фигурные подсказки?",
   a:["Как попало","По порядку и по кругу (a,b,c) одинаково на обеих фигурах","Только одну","В центр"],c:1,
   e:"Одинаковый порядок и расположение на старте и финише."},
  {q:"Как добавить фигурную подсказку?",
   a:["F8","Изменить → Фигура → Добавить фигурную подсказку (Ctrl+Shift+H)","Ctrl+G","F5"],c:1,
   e:"Появится красный кружок «a» — его ставят на точку формы."},
  {q:"Перетекает ли цвет при морфинге?",
   a:["Нет","Да, если у фигур разная заливка","Только чёрный","Только вручную"],c:1,
   e:"Разные цвета фигур дают плавный переход цвета вместе с формой."},
  {q:"Как зациклить морфинг без «скачка»?",
   a:["Больше кадров","Сделать последнюю форму = первой","Ярче","Меньше форм"],c:1,
   e:"Совпадение конца и начала = бесшовная петля."},
  {q:"Как создать анимацию формы?",
   a:["F8","2 кадра с разными фигурами → ПКМ → «Создать анимацию формы»","Экспорт","Ctrl+B"],c:1,
   e:"Между ключевыми кадрами с фигурами — команда морфинга."},

  {q:"😄 Нажал F8 по привычке — морфинг «сломался». Почему?",
   a:["Баг","F8 сделал символ, а морфинг — для фигур","Мало цвета","Экран"],c:1,
   e:"Убери символ: Ctrl+B (Разделить), тогда морфинг заработает."},
  {q:"😄 Форма при переходе выворачивается «кишками наружу». Что добавить?",
   a:["Кадры","Фигурные подсказки (a,b,c по кругу)","Цвет","Звук"],c:1,
   e:"Подсказки направляют перетекание — форма перестанет «мяться»."},
  {q:"😄 Диапазон синий, а форма «прыгает», не течёт. В чём дело?",
   a:["Так и надо","Синий — это движение; для морфа нужен зелёный (фигуры)","Мало кадров","Цвет"],c:1,
   e:"Создай именно «анимацию формы» на чистых фигурах — станет зелёным."},

  {q:"🤔 Почему морфинг — для фигур, а движение — для символов?",
   a:["Каприз","Морф меняет саму форму (точки), движение — переносит готовый объект","Так ярче","Случайно"],c:1,
   e:"Разные задачи: одна перекраивает контур, другая двигает целое."},
  {q:"🤔 Почему похожие формы (круг↔сердце) морфятся легче, чем очень разные?",
   a:["Совпадение","Схожая «геометрия» — программе проще сопоставить точки","Быстрее грузит","Ярче"],c:1,
   e:"Чем ближе формы, тем плавнее и предсказуемее переход."},
  {q:"🤔 Зачем «задерживать» форму лишними кадрами (F5)?",
   a:["Для веса","Чтобы зритель успел разглядеть форму перед следующим превращением","Для цвета","Незачем"],c:1,
   e:"Пауза-«замирание» подчёркивает каждую форму в цепочке."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🪄 Морфинг форм</h1>
    <div class="sub">Викторина по уроку «Превращение»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты владеешь магией превращения! 🪄';}
  else if(pct>=70){em='🎉';msg='Отлично! Морфинг, фигуры и подсказки — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Помни: морфинг для фигур (не символов!), зелёный диапазон.';}
  else {em='💪';msg='Начало есть! Перечитай про анимацию формы и подсказки.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
