<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pbg" cx="0.5" cy="0.45" r="0.7"><stop offset="0" stop-color="#FFF1F6"/><stop offset="1" stop-color="#FCD9E7"/></radialGradient>
  </defs>
  <rect width="500" height="400" fill="url(#pbg)"/>

  <!-- circle <-> heart morph (matched M + 4C + Z) -->
  <path fill="#EC4899">
    <animate attributeName="d" dur="3s" repeatCount="indefinite"
      keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
      values="
      M250,110 C290,110 320,140 320,180 C320,220 290,250 250,250 C210,250 180,220 180,180 C180,140 210,110 250,110 Z;
      M250,150 C270,116 316,120 316,160 C316,204 272,232 250,258 C228,232 184,204 184,160 C184,120 230,116 250,150 Z;
      M250,110 C290,110 320,140 320,180 C320,220 290,250 250,250 C210,250 180,220 180,180 C180,140 210,110 250,110 Z"/>
    <animate attributeName="fill" dur="3s" repeatCount="indefinite" keyTimes="0;0.5;1" values="#F472B6;#DC2626;#F472B6"/>
  </path>

  <g fill="#FBBF24">
    <path d="M360,130 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 Z"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.3s" repeatCount="indefinite"/></path>
    <path d="M140,170 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 Z"><animate attributeName="opacity" values="1;0.2;1" dur="1.3s" repeatCount="indefinite"/></path>
  </g>

  <text x="250" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#9D174D" text-anchor="middle">🔵❤️ Простой морфинг: круг ↔ сердце (2 похожие формы)</text>
</svg>
