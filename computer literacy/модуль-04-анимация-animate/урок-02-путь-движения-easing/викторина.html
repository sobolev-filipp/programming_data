<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Путь движения и плавность</title>
<style>
  :root{
    --bg1:#170E42; --bg2:#22D3EE; --card:#ffffff; --ink:#1e293b;
    --accent:#7c3aed; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Как заставить объект лететь по кривой?",
   a:["Нарисовать 100 кадров","Анимация движения → изогнуть траекторию","Сменить цвет","Экспорт GIF"],c:1,
   e:"Motion tween создаёт путь-траекторию, который можно изогнуть."},
  {q:"За что тянуть, чтобы ИЗОГНУТЬ путь?",
   a:["За точку-узел","За саму линию между точками («Выделение» V)","За кадр","За слой"],c:1,
   e:"Тянешь линию — она гнётся. Тянешь точку — она просто переезжает."},
  {q:"Что делает «Ориентировать по траектории»?",
   a:["Красит путь","Поворачивает нос объекта по направлению полёта","Ускоряет","Зацикливает"],c:1,
   e:"Ракета/самолёт «рулит» по пути, а не летит боком."},
  {q:"Где включить «Ориентировать по траектории»?",
   a:["В экспорте","«Свойства» → раздел «Вращение»","В слоях","В библиотеке"],c:1,
   e:"Галочка в свойствах анимации, раздел «Вращение»."},
  {q:"Что такое плавность (Ease / Замедление)?",
   a:["Цвет","Разгон/торможение — скорость меняется, а не ровная","Размер","Звук"],c:1,
   e:"Медленный старт и/или плавная остановка вместо «тракторной» скорости."},
  {q:"Какое Замедление даёт РАЗГОН (медленно→быстро)?",
   a:["Плюс","Минус","Ноль","Любое"],c:1,
   e:"Минус = разгон; плюс = торможение к концу."},
  {q:"Почему живое движется по дугам, а не по прямой?",
   a:["Так медленнее","Прямая идеальная линия выглядит «роботом»; дуги = живо","Для цвета","Случайно"],c:1,
   e:"Птица, мяч, ракета — все движутся плавными кривыми."},
  {q:"Что нужно ПЕРЕД анимацией движения?",
   a:["Звук","Преобразовать объект в символ (F8)","Экспорт","Новый слой"],c:1,
   e:"Motion tween работает только с символом."},
  {q:"Как сделать петлю на пути?",
   a:["Больше кадров","Сильнее изогнуть / добавить точку «Пером» и вытянуть усы","Ярче","Меньше Ease"],c:1,
   e:"Дополнительная точка с усами закручивает траекторию в петлю."},
  {q:"Где тонко настроить кривую скорости?",
   a:["В экспорте","«Редактор движения» (двойной клик по диапазону)","В слоях","В образцах"],c:1,
   e:"Motion Editor рисует свою кривую «медленно-быстро-медленно»."},

  {q:"😄 Тяну за точку — путь не гнётся, точка уезжает. Как надо?",
   a:["Тянуть сильнее точку","Тянуть саму линию между точками","Добавить кадр","Сменить цвет"],c:1,
   e:"Гнётся именно линия; точка только перемещается."},
  {q:"😄 Ракета летит боком, носом в сторону. Что включить?",
   a:["Больше Ease","«Ориентировать по траектории»","Звук","Новый слой"],c:1,
   e:"Тогда нос повернётся по направлению движения."},
  {q:"😄 Полёт скучный, скорость ровная как у трактора. Совет?",
   a:["Больше кадров","Задать Замедление (Ease) — разгон/торможение","Ярче фон","Меньше объектов"],c:1,
   e:"Easing оживляет: медленный старт, плавная остановка."},

  {q:"🤔 Почему символ рисуют носом ВПРАВО перед «ориентацией по пути»?",
   a:["Каприз","«Вперёд» = вправо; тогда поворот по пути выглядит правильно","Так ярче","Быстрее"],c:1,
   e:"Программа считает «перёд» объекта по его исходному направлению."},
  {q:"🤔 Зачем сводить конец пути к началу?",
   a:["Для цвета","Чтобы GIF зациклился без «скачка»","Чтобы быстрее","Незачем"],c:1,
   e:"Совпадение конца и начала = плавная бесшовная петля."},
  {q:"🤔 Чем траектория похожа на «рельсы»?",
   a:["Ничем","Ты рисуешь путь, а символ едет по нему; гнёшь путь — меняется полёт","Она красная","Она звучит"],c:1,
   e:"Путь задаёт маршрут; форма пути = форма движения."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🚀 Путь движения и плавность</h1>
    <div class="sub">Викторина по уроку «Полёт по петле»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Твои объекты летают как надо! 🚀';}
  else if(pct>=70){em='🎉';msg='Отлично! Путь, ориентация и плавность — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Помни: гни линию, «ориентируй по пути», задай Ease.';}
  else {em='💪';msg='Начало есть! Перечитай про траекторию и плавность.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
