<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BAE6FD"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient>
    <clipPath id="screen"><rect x="24" y="24" width="452" height="316" rx="16"/></clipPath>
  </defs>

  <!-- dark film background -->
  <rect width="500" height="400" fill="#0F172A"/>

  <g clip-path="url(#screen)">
    <rect x="24" y="24" width="452" height="316" fill="url(#sky)"/>
    <!-- ground -->
    <rect x="24" y="292" width="452" height="48" fill="#86EFAC"/>
    <ellipse cx="80" cy="70" rx="34" ry="16" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="400" cy="90" rx="40" ry="18" fill="#ffffff" opacity="0.8"/>

    <!-- === TITLE CARD === -->
    <g>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.033;0.111;0.15;1" values="0;1;1;0;0"/>
      <rect x="24" y="24" width="452" height="316" fill="#0F172A" opacity="0.72"/>
      <text x="250" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="800" fill="#FDE047" text-anchor="middle">МОЙ МУЛЬТИК</text>
      <text x="250" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0" text-anchor="middle">🎬 фильм ученика</text>
    </g>

    <!-- === SCENE A: bouncing ball (урок 1) === -->
    <g>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.15;0.18;0.36;0.39;1" values="0;0;1;1;0;0"/>
      <text x="250" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E7490" text-anchor="middle">Сцена 1 · мяч прыгает</text>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -120;0 0" dur="0.85s" repeatCount="indefinite" calcMode="spline" keySplines="0.2 0 0.5 1;0.5 0 0.8 1"/>
        <circle cx="250" cy="268" r="24" fill="#F97316"/>
        <path d="M232,258 a24,24 0 0 1 16,-14" fill="none" stroke="#FDBA74" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- === SCENE B: rocket flies (урок 2) === -->
    <g>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.39;0.42;0.60;0.63;1" values="0;0;1;1;0;0"/>
      <text x="250" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">Сцена 2 · полёт по дуге</text>
      <g>
        <animateTransform attributeName="transform" type="translate" values="30 300;250 150;470 60" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
        <g transform="rotate(38)">
          <path d="M0,-22 C10,-10 10,10 0,22 C-10,10 -10,-10 0,-22 Z" fill="#E2E8F0"/>
          <path d="M0,-22 C6,-14 8,-4 6,6 L-6,6 C-8,-4 -6,-14 0,-22 Z" fill="#F87171"/>
          <circle cx="0" cy="-4" r="5" fill="#38BDF8"/>
          <path d="M-6,6 l-8,12 8,-4 Z M6,6 l8,12 -8,-4 Z" fill="#EF4444"/>
          <path d="M0,22 l0,20" stroke="#FB923C" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
        </g>
      </g>
    </g>

    <!-- === SCENE C: mascot waves & talks (урок 4) === -->
    <g>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.63;0.66;0.86;0.89;1" values="0;0;1;1;0;0"/>
      <text x="250" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#0E7490" text-anchor="middle">Сцена 3 · маскот прощается</text>
      <!-- body -->
      <rect x="222" y="196" width="80" height="86" rx="20" fill="#5EC8D8"/>
      <!-- waving arm -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-16 300 210;24 300 210;-16 300 210" dur="0.9s" repeatCount="indefinite"/>
        <line x1="300" y1="210" x2="338" y2="158" stroke="#4BB8C8" stroke-width="13" stroke-linecap="round"/>
        <circle cx="341" cy="153" r="12" fill="#6FD0DE"/>
      </g>
      <!-- head -->
      <rect x="218" y="130" width="88" height="74" rx="18" fill="#6FD0DE"/>
      <rect x="230" y="144" width="64" height="46" rx="11" fill="#10243A"/>
      <circle cx="248" cy="162" r="6" fill="#67E8F9"/>
      <circle cx="276" cy="162" r="6" fill="#67E8F9"/>
      <ellipse cx="262" cy="180" rx="9" ry="6" fill="#67E8F9"><animate attributeName="ry" values="6;1;6;1;6" dur="0.7s" repeatCount="indefinite"/></ellipse>
    </g>

    <!-- === END CARD === -->
    <g>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.89;0.92;1" values="0;0;1;1"/>
      <rect x="24" y="24" width="452" height="316" fill="#0F172A" opacity="0.8"/>
      <text x="250" y="195" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="800" fill="#FDE047" text-anchor="middle">КОНЕЦ</text>
    </g>
  </g>

  <!-- film frame -->
  <rect x="24" y="24" width="452" height="316" rx="16" fill="none" stroke="#334155" stroke-width="4"/>
  <!-- sprocket holes -->
  <g fill="#1E293B">
    <rect x="6" y="40" width="10" height="14" rx="2"/><rect x="6" y="70" width="10" height="14" rx="2"/><rect x="6" y="100" width="10" height="14" rx="2"/><rect x="6" y="130" width="10" height="14" rx="2"/><rect x="6" y="160" width="10" height="14" rx="2"/><rect x="6" y="190" width="10" height="14" rx="2"/><rect x="6" y="220" width="10" height="14" rx="2"/><rect x="6" y="250" width="10" height="14" rx="2"/><rect x="6" y="280" width="10" height="14" rx="2"/><rect x="6" y="310" width="10" height="14" rx="2"/>
    <rect x="484" y="40" width="10" height="14" rx="2"/><rect x="484" y="70" width="10" height="14" rx="2"/><rect x="484" y="100" width="10" height="14" rx="2"/><rect x="484" y="130" width="10" height="14" rx="2"/><rect x="484" y="160" width="10" height="14" rx="2"/><rect x="484" y="190" width="10" height="14" rx="2"/><rect x="484" y="220" width="10" height="14" rx="2"/><rect x="484" y="250" width="10" height="14" rx="2"/><rect x="484" y="280" width="10" height="14" rx="2"/><rect x="484" y="310" width="10" height="14" rx="2"/>
  </g>

  <text x="250" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#CBD5E1" text-anchor="middle">🏆 Мой мультик: титры + 3 сцены, склеенные в историю (монтаж)</text>
</svg>
