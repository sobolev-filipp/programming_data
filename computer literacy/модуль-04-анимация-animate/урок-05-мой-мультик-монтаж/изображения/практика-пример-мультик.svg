<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pbg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E293B"/><stop offset="1" stop-color="#334155"/></linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#pbg2)"/>

  <text x="250" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#FDE047" text-anchor="middle">🎬 Раскадровка → монтаж</text>

  <!-- film strip -->
  <rect x="30" y="90" width="440" height="180" rx="10" fill="#0F172A"/>
  <!-- sprocket holes top/bottom -->
  <g fill="#475569">
    <rect x="46" y="98" width="16" height="10" rx="2"/><rect x="86" y="98" width="16" height="10" rx="2"/><rect x="126" y="98" width="16" height="10" rx="2"/><rect x="166" y="98" width="16" height="10" rx="2"/><rect x="206" y="98" width="16" height="10" rx="2"/><rect x="246" y="98" width="16" height="10" rx="2"/><rect x="286" y="98" width="16" height="10" rx="2"/><rect x="326" y="98" width="16" height="10" rx="2"/><rect x="366" y="98" width="16" height="10" rx="2"/><rect x="406" y="98" width="16" height="10" rx="2"/><rect x="438" y="98" width="16" height="10" rx="2"/>
    <rect x="46" y="252" width="16" height="10" rx="2"/><rect x="86" y="252" width="16" height="10" rx="2"/><rect x="126" y="252" width="16" height="10" rx="2"/><rect x="166" y="252" width="16" height="10" rx="2"/><rect x="206" y="252" width="16" height="10" rx="2"/><rect x="246" y="252" width="16" height="10" rx="2"/><rect x="286" y="252" width="16" height="10" rx="2"/><rect x="326" y="252" width="16" height="10" rx="2"/><rect x="366" y="252" width="16" height="10" rx="2"/><rect x="406" y="252" width="16" height="10" rx="2"/><rect x="438" y="252" width="16" height="10" rx="2"/>
  </g>

  <!-- FRAME 1: sun rises (морфинг/урок 3) -->
  <g>
    <rect x="70" y="120" width="120" height="120" rx="6" fill="#BAE6FD"/>
    <rect x="70" y="210" width="120" height="30" fill="#86EFAC"/>
    <circle cx="130" cy="200" r="22" fill="#FBBF24"><animate attributeName="cy" values="220;180;220" dur="6s" repeatCount="indefinite"/></circle>
    <rect x="70" y="120" width="120" height="120" rx="6" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="130" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">1 · рассвет</text>
  </g>

  <!-- FRAME 2: rocket (урок 2) -->
  <g>
    <rect x="196" y="120" width="120" height="120" rx="6" fill="#C7D2FE"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-30 30;30 -30;-30 30" dur="6s" repeatCount="indefinite"/>
      <g transform="translate(256,180) rotate(38)">
        <path d="M0,-16 C7,-7 7,7 0,16 C-7,7 -7,-7 0,-16 Z" fill="#F1F5F9"/>
        <circle cx="0" cy="-3" r="4" fill="#38BDF8"/>
        <path d="M0,16 l0,12" stroke="#FB923C" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>
    <rect x="196" y="120" width="120" height="120" rx="6" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="256" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">2 · полёт</text>
  </g>

  <!-- FRAME 3: smiley waves (урок 4) -->
  <g>
    <rect x="322" y="120" width="120" height="120" rx="6" fill="#FEF9C3"/>
    <circle cx="382" cy="180" r="30" fill="#FBBF24"/>
    <circle cx="372" cy="172" r="4" fill="#1E293B"/>
    <circle cx="392" cy="172" r="4" fill="#1E293B"/>
    <path d="M370,190 q12,12 24,0" fill="none" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-20 410 178;20 410 178;-20 410 178" dur="0.8s" repeatCount="indefinite"/>
      <line x1="410" y1="178" x2="430" y2="150" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
    </g>
    <rect x="322" y="120" width="120" height="120" rx="6" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="382" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0" text-anchor="middle">3 · привет</text>
  </g>

  <!-- red playhead sweeping across (монтаж на таймлайне) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;370 0;0 0" dur="6s" repeatCount="indefinite"/>
    <polygon points="70,84 82,84 76,94" fill="#EF4444"/>
    <rect x="74" y="90" width="4" height="188" fill="#EF4444"/>
  </g>

  <!-- timeline bar under strip -->
  <rect x="30" y="292" width="440" height="14" rx="7" fill="#0F172A"/>
  <rect x="34" y="295" width="140" height="8" rx="4" fill="#38BDF8"/>
  <rect x="178" y="295" width="120" height="8" rx="4" fill="#A78BFA"/>
  <rect x="302" y="295" width="164" height="8" rx="4" fill="#34D399"/>

  <text x="250" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#CBD5E1" text-anchor="middle">Сцены на таймлайне склеиваются в мультик — плейхед проигрывает историю</text>
  <text x="250" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">Пример практики: своя история из 3 сцен + титры → экспорт GIF/MP4</text>
</svg>
