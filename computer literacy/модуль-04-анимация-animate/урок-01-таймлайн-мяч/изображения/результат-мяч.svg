<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAF2FB"/><stop offset="1" stop-color="#CFE0F3"/></linearGradient>
    <radialGradient id="ballg" cx="0.38" cy="0.32" r="0.8"><stop offset="0" stop-color="#FF8A80"/><stop offset="0.6" stop-color="#EF4444"/><stop offset="1" stop-color="#B91C1C"/></radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- floor -->
  <rect x="0" y="490" width="800" height="110" fill="#9CB0C6"/>
  <line x1="0" y1="490" x2="800" y2="490" stroke="#7C93AD" stroke-width="3"/>

  <!-- shadow -->
  <ellipse cx="400" cy="494" rx="30" ry="12" fill="#33415580">
    <animate attributeName="rx" values="26;62;72;58;26" keyTimes="0;0.42;0.5;0.58;1" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.9 1;0.4 0 0.6 1;0.4 0 0.6 1;0.1 0 0.35 1"/>
    <animate attributeName="opacity" values="0.15;0.32;0.34;0.28;0.15" keyTimes="0;0.42;0.5;0.58;1" dur="1.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ball with squash & stretch -->
  <ellipse cx="400" cy="150" rx="50" ry="50" fill="url(#ballg)">
    <animate attributeName="cy" values="150;428;456;405;150" keyTimes="0;0.42;0.5;0.58;1" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.9 1;0.4 0 0.6 1;0.4 0 0.6 1;0.1 0 0.35 1"/>
    <animate attributeName="rx" values="50;44;66;47;50" keyTimes="0;0.42;0.5;0.58;1" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="50;60;34;56;50" keyTimes="0;0.42;0.5;0.58;1" dur="1.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- eyes (follow the ball via group translate) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 278;0 306;0 255;0 0" keyTimes="0;0.42;0.5;0.58;1" dur="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.9 1;0.4 0 0.6 1;0.4 0 0.6 1;0.1 0 0.35 1"/>
    <circle cx="384" cy="138" r="11" fill="#ffffff"/>
    <circle cx="416" cy="138" r="11" fill="#ffffff"/>
    <circle cx="386" cy="141" r="5" fill="#1e1e1e"/>
    <circle cx="418" cy="141" r="5" fill="#1e1e1e"/>
  </g>

  <text x="400" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#33415C" text-anchor="middle">🏀 Живой мяч: растяжение в полёте + сжатие от удара</text>
</svg>
