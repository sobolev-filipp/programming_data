<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Таймлайн и живой мяч</title>
<style>
  :root{
    --bg1:#B91C1C; --bg2:#f59e0b; --card:#ffffff; --ink:#1e293b;
    --accent:#dc2626; --ok:#16a34a; --bad:#dc2626; --soft:#fee2e2;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Из чего состоит анимация?",
   a:["Из одного рисунка","Из кадров подряд на таймлайне","Из фильтров","Из текста"],c:1,
   e:"Движение = много кадров подряд, как перелистывание блокнота."},
  {q:"Что такое ключевой кадр (клавиша F6)?",
   a:["Пустой кадр","Кадр, где ты что-то изменил (положение/форму)","Экспорт","Слой"],c:1,
   e:"Анимация — это цепочка ключевых кадров; между ними держится «то же самое»."},
  {q:"Зачем мяч ВЫТЯГИВАЕТСЯ в полёте и СПЛЮЩИВАЕТСЯ от удара?",
   a:["Так проще","Это «сжатие-растяжение» — движение становится живым/упругим","Для цвета","Случайно"],c:1,
   e:"Главный принцип: упругий объект деформируется — и «оживает»."},
  {q:"Что делает «Луковичная кожа» (Onion Skin)?",
   a:["Красит фон","Показывает призраки соседних кадров","Ускоряет","Удаляет кадр"],c:1,
   e:"Видишь соседние кадры — удобно вести объект по дуге и ровнять расстояния."},
  {q:"Каким инструментом сплющивать/растягивать?",
   a:["Текст (T)","Свободное трансформирование (Q)","Овал (O)","Кисть"],c:1,
   e:"«Свободное трансформирование» (Q) тянет ручки — деформирует объект."},
  {q:"Что нужно сделать ПЕРЕД анимацией движения (motion tween)?",
   a:["Сохранить GIF","Преобразовать объект в символ (F8)","Удалить слой","Сменить цвет"],c:1,
   e:"Motion tween работает только с символом. Сначала F8."},
  {q:"Что такое «тайминг»?",
   a:["Цвет кадра","Скорость: мало кадров = быстро, много = медленно","Размер сцены","Звук"],c:1,
   e:"Расстановка кадров задаёт вес и настроение движения."},
  {q:"Как проиграть анимацию?",
   a:["Ctrl+S","Нажать Enter","F8","Удалить кадр"],c:1,
   e:"Enter проигрывает ролик; «,» и «.» листают по кадру."},
  {q:"Какая частота кадров даёт плавность?",
   a:["2 к/с","24 к/с","1 к/с","0"],c:1,
   e:"24 к/с — плавно; 12 — заметно «дёргано»."},
  {q:"Как экспортировать анимацию в GIF?",
   a:["Просто сохранить .fla","Файл → Экспорт → Экспортировать анимированный GIF","Ctrl+P","Печать"],c:1,
   e:"Так получается зацикленная картинка для чата/веба."},

  {q:"😄 Мяч всю дорогу — ровный круг, движется «как деревяшка». Что добавить?",
   a:["Больше цвета","Сжатие-растяжение","Ещё кадров одинаковых","Рамку"],c:1,
   e:"Деформация в полёте/ударе оживляет движение."},
  {q:"😄 «Создать анимацию движения» не работает на моём кружке. Почему?",
   a:["Баг","Кружок не символ — сначала F8","Мало цвета","Нет звука"],c:1,
   e:"Motion tween нужен символ. Преобразуй (F8) и повтори."},
  {q:"😄 Мяч и пол двигаются вместе — не разделить. В чём дело?",
   a:["Экран","Они на одном слое — разнеси по слоям","Мало кадров","Цвет"],c:1,
   e:"Каждый объект — на своём слое, тогда двигаются отдельно."},

  {q:"🤔 Почему у вершины прыжка кадры ставят чаще, а у пола реже?",
   a:["Случайно","У вершины мяч «зависает» (медленно), у пола летит быстро — это вес","Так ярче","Для звука"],c:1,
   e:"Тайминг передаёт гравитацию: медленно вверху, быстро внизу."},
  {q:"🤔 Зачем сохранять «объём» при сжатии (сплющил высоту — расширь ширину)?",
   a:["Каприз","Иначе мяч кажется «сдувшимся», а не упругим","Для цвета","Быстрее"],c:1,
   e:"Постоянный объём читается как резиновый, живой мяч."},
  {q:"🤔 Чем анимация по кадрам отличается от анимации движения (tween)?",
   a:["Ничем","По кадрам — рисуешь всё сам (контроль); tween — программа дорисовывает середину","Tween ярче","По кадрам быстрее"],c:1,
   e:"Профи сочетают: живой прыжок — по кадрам, ровный проезд — tween."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🏀 Таймлайн и живой мяч</h1>
    <div class="sub">Викторина по уроку «Анимация с характером»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты оживляешь картинки — аниматор! 🏀';}
  else if(pct>=70){em='🎉';msg='Отлично! Кадры, сжатие-растяжение и tween — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Помни: F6 ключевой кадр, сжатие-растяжение, F8 перед tween.';}
  else {em='💪';msg='Начало есть! Перечитай про кадры и сжатие-растяжение.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
