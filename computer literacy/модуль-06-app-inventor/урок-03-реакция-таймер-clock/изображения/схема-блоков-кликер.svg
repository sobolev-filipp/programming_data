<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="640" height="470" fill="#f8fafc"/>
  <text x="320" y="26" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Итоговая схема блоков — «Реакция»</text>

  <!-- variables -->
  <g>
    <rect x="30" y="44" width="250" height="30" rx="6" fill="#ff8c1a"/>
    <text x="42" y="64" font-size="12.5" font-weight="700" fill="#fff">initialize global score to 0</text>
    <rect x="300" y="44" width="250" height="30" rx="6" fill="#ff8c1a"/>
    <text x="312" y="64" font-size="12.5" font-weight="700" fill="#fff">initialize global time to 15</text>
  </g>

  <!-- BtnStart -->
  <g>
    <path d="M30 92 h250 v18 h-260 v-10 a8 8 0 0 1 8 -8 z" fill="#f5b800"/>
    <path d="M22 110 h236 v96 a8 8 0 0 1 -8 8 h-220 a8 8 0 0 1 -8 -8 z" fill="#f5b800"/>
    <text x="40" y="105" font-size="12.5" font-weight="700" fill="#5b4500">when BtnStart.Click do</text>
    <rect x="40" y="118" width="205" height="24" rx="5" fill="#ff8c1a"/><text x="49" y="135" font-size="11" font-weight="700" fill="#fff">set score to 0 · set time to 15</text>
    <rect x="40" y="146" width="205" height="24" rx="5" fill="#4a9e4a"/><text x="49" y="163" font-size="11" font-weight="700" fill="#fff">set Labels (Счёт/Время/Результат)</text>
    <rect x="40" y="174" width="205" height="24" rx="5" fill="#4a9e4a"/><text x="49" y="191" font-size="11" font-weight="700" fill="#fff">set BtnTarget.Enabled = true</text>
    <rect x="40" y="200" width="205" height="10" rx="5" fill="#4a9e4a"/>
    <text x="40" y="226" font-size="11" font-weight="700" fill="#166534">▲ set Clock1.TimerEnabled = true → пуск!</text>
  </g>

  <!-- BtnTarget -->
  <g>
    <path d="M300 92 h300 v18 h-310 v-10 a8 8 0 0 1 8 -8 z" fill="#f5b800"/>
    <path d="M292 110 h286 v58 a8 8 0 0 1 -8 8 h-270 a8 8 0 0 1 -8 -8 z" fill="#f5b800"/>
    <text x="310" y="105" font-size="12.5" font-weight="700" fill="#5b4500">when BtnTarget.Click do</text>
    <rect x="310" y="118" width="258" height="26" rx="5" fill="#4a9e4a"/>
    <text x="319" y="135" font-size="11" font-weight="700" fill="#fff">set score to score + random(1..3)</text>
    <rect x="310" y="148" width="258" height="24" rx="5" fill="#4a9e4a"/>
    <text x="319" y="165" font-size="11" font-weight="700" fill="#fff">set LblScore.Text = join("Счёт: ", score)</text>
  </g>

  <!-- Clock.Timer with if -->
  <g>
    <path d="M30 250 h280 v18 h-290 v-10 a8 8 0 0 1 8 -8 z" fill="#f5b800"/>
    <path d="M22 268 h266 v168 a8 8 0 0 1 -8 8 h-250 a8 8 0 0 1 -8 -8 z" fill="#f5b800"/>
    <text x="40" y="263" font-size="12.5" font-weight="700" fill="#5b4500">when Clock1.Timer do</text>
    <rect x="40" y="276" width="235" height="24" rx="5" fill="#ff8c1a"/><text x="49" y="293" font-size="11" font-weight="700" fill="#fff">set time to (time − 1)</text>
    <rect x="40" y="304" width="235" height="24" rx="5" fill="#4a9e4a"/><text x="49" y="321" font-size="11" font-weight="700" fill="#fff">set LblTime.Text = join("Время: ", time)</text>
    <!-- if -->
    <path d="M40 334 h226 v18 h-236 v-10 a8 8 0 0 1 8 -8 z" fill="#ffab19"/>
    <path d="M32 352 h216 v76 a8 8 0 0 1 -8 8 h-200 a8 8 0 0 1 -8 -8 z" fill="#ffab19"/>
    <text x="48" y="347" font-size="12" font-weight="700" fill="#7a3e00">if  time ≤ 0  then</text>
    <rect x="48" y="360" width="192" height="22" rx="5" fill="#ec5a13"/><text x="56" y="376" font-size="10.5" font-weight="700" fill="#fff">set Clock1.TimerEnabled = false</text>
    <rect x="48" y="386" width="192" height="22" rx="5" fill="#4a9e4a"/><text x="56" y="402" font-size="10.5" font-weight="700" fill="#fff">set BtnTarget.Enabled = false</text>
    <rect x="48" y="412" width="192" height="18" rx="5" fill="#4a9e4a"/><text x="56" y="426" font-size="10" font-weight="700" fill="#fff">LblResult = "Стоп! Счёт: "+score</text>
  </g>

  <!-- legend -->
  <text x="310" y="300" font-size="13" font-weight="700" fill="#0f172a">📖 Как читать:</text>
  <text x="310" y="322" font-size="12" fill="#334155">🟠 переменные (score, time)</text>
  <text x="310" y="342" font-size="12" fill="#334155">🟡 события  🟢 действия (set)</text>
  <text x="310" y="362" font-size="12" fill="#334155">🟧 условие if (время вышло)</text>
  <text x="310" y="386" font-size="12" fill="#64748b">💡 Clock тикает сам → отсчёт;</text>
  <text x="310" y="404" font-size="12" fill="#64748b">random(1..3) → случайные очки.</text>
  <text x="310" y="430" font-size="11.5" fill="#b45309" font-weight="700">⚠️ не забудь выключить таймер на 0.</text>
</svg>
