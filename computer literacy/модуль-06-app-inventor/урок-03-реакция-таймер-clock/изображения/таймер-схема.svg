<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="600" height="260" fill="#f8fafc"/>
  <text x="300" y="30" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Как работает Clock (таймер)</text>
  <text x="300" y="50" font-size="12" fill="#64748b" text-anchor="middle">невидимый компонент · Palette → Sensors → Clock</text>

  <!-- clock -->
  <circle cx="110" cy="150" r="52" fill="#e0e7ff" stroke="#6366f1" stroke-width="4"/>
  <line x1="110" y1="150" x2="110" y2="112" stroke="#4338ca" stroke-width="5" stroke-linecap="round"/>
  <line x1="110" y1="150" x2="138" y2="150" stroke="#4338ca" stroke-width="5" stroke-linecap="round"/>
  <circle cx="110" cy="150" r="5" fill="#4338ca"/>
  <text x="110" y="228" font-size="13" font-weight="700" fill="#4338ca" text-anchor="middle">Clock1</text>
  <text x="110" y="90" font-size="11" fill="#64748b" text-anchor="middle">TimerInterval = 1000 мс</text>

  <!-- arrow -->
  <path d="M172 150 H250" stroke="#6366f1" stroke-width="3" marker-end="url(#ar)"/>
  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#6366f1"/></marker></defs>
  <text x="211" y="140" font-size="12" font-weight="700" fill="#4338ca" text-anchor="middle">каждую</text>
  <text x="211" y="168" font-size="12" font-weight="700" fill="#4338ca" text-anchor="middle">секунду</text>

  <!-- event block -->
  <g>
    <path d="M270 108 h230 v18 h-240 v-10 a8 8 0 0 1 8 -8 z" fill="#f5b800"/>
    <path d="M262 126 h216 v52 a8 8 0 0 1 -8 8 h-200 a8 8 0 0 1 -8 -8 z" fill="#f5b800"/>
    <text x="282" y="121" font-size="13" font-weight="700" fill="#5b4500">when Clock1.Timer do</text>
    <rect x="282" y="138" width="176" height="30" rx="6" fill="#4a9e4a"/>
    <text x="291" y="158" font-size="12" font-weight="700" fill="#fff">set global time to (time − 1)</text>
  </g>

  <text x="300" y="232" font-size="13" fill="#0f172a" text-anchor="middle">💡 Событие срабатывает <tspan font-weight="700">само</tspan>, без нажатий — так появляется «время».</text>
  <text x="300" y="250" font-size="11.5" fill="#64748b" text-anchor="middle">TimerEnabled = true → тикает · false → стоит</text>
</svg>
