<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 1: Первое приложение (App Inventor)</title>
<style>
  :root{
    --bg1:#0f9d58; --bg2:#f4b400; --card:#ffffff; --ink:#1f2937;
    --accent:#0f9d58; --ok:#16a34a; --bad:#dc2626; --soft:#e6f4ea;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Где в App Inventor мы рисуем внешний вид приложения?",
   a:["Blocks","Designer","Palette","Google"],c:1,
   e:"Designer — вкладка внешнего вида. Blocks — для логики."},
  {q:"А где программируем поведение (что делает приложение)?",
   a:["Blocks","Designer","Properties","Viewer"],c:0,
   e:"Blocks — вкладка логики: события и действия из блоков."},
  {q:"Какой компонент показывает текст-надпись на экране?",
   a:["Button","Image","Label","Sound"],c:2,
   e:"Label — надпись. Button — кнопка, Image — картинка."},
  {q:"Какой компонент можно нажать, чтобы что-то произошло?",
   a:["Label","Button","Screen","Media"],c:1,
   e:"Button — кнопка, у неё есть событие Click."},
  {q:"Как называется зона слева со всеми «деталями», которые перетаскивают?",
   a:["Palette","Properties","Components","Viewer"],c:0,
   e:"Palette — палитра компонентов, отсюда их берут."},
  {q:"Где меняют текст, цвет и размер выбранного компонента?",
   a:["Palette","Properties","Blocks","Media"],c:1,
   e:"Properties (Свойства) — настройки выбранного компонента."},
  {q:"Какой блок означает «когда нажали кнопку»?",
   a:["set Label2.Text to","when Button1.Click do","call Sound1.Play","initialize global"],c:1,
   e:"when Button1.Click do — событие нажатия. Внутрь кладём действия."},
  {q:"Каким блоком поменять надпись под кнопкой?",
   a:["set Label2.Text to","when Screen1.Initialize","join","Width Fill parent"],c:0,
   e:"set Label2.Text to «…» — устанавливает новый текст метки."},
  {q:"Как проверить приложение прямо на своём телефоне?",
   a:["Скачать .exe","AI2 Companion + QR (одна Wi-Fi)","Отправить по почте","Никак"],c:1,
   e:"Ставим MIT AI2 Companion, Connect → AI Companion, сканируем QR. Телефон и ПК — в одной сети."},
  {q:"Что делает свойство Width = Fill parent у кнопки?",
   a:["Прячет кнопку","Растягивает на всю ширину","Меняет цвет","Добавляет звук"],c:1,
   e:"Fill parent — занять всю доступную ширину. Automatic — по содержимому."},

  {q:"😄 Нажимаю кнопку на телефоне — ничего не меняется. Что не так?",
   a:["Слабый телефон","Блок set …Text стоит ВНЕ when…Click","Нет интернета","Мало памяти"],c:1,
   e:"Действие должно быть ВНУТРИ шапки события when Button1.Click."},
  {q:"😄 Companion не подключается. Что проверить ПЕРВЫМ делом?",
   a:["Перезагрузить ПК","Телефон и ПК в одной Wi-Fi","Купить кабель","Сменить Google"],c:1,
   e:"Причина №1 — телефон по мобильному интернету, а не по классному Wi-Fi."},
  {q:"😄 Проект не создаётся с именем «Моё приложение». Почему?",
   a:["App Inventor сломан","Имя должно быть латиницей без пробелов","Слишком длинно","Нужен платный аккаунт"],c:1,
   e:"Имя проекта — латинские буквы/цифры, без пробелов, с буквы: MyFirstApp."},

  {q:"🤔 Почему интерфейс App Inventor держим на English?",
   a:["Так модно","Русские блоки → ошибки и сложнее искать справку","Быстрее грузится","Так требует Google"],c:1,
   e:"На русском блоки подписаны по-русски — возможны ошибки; вся справка мира — по-английски."},
  {q:"🤔 Почему говорят: приложение = интерфейс + логика?",
   a:["Красивая фраза","Вид (Designer) и поведение (Blocks) — две половины одного","Так дешевле","Случайно"],c:1,
   e:"Designer — что видно, Blocks — что происходит. Обе части нужны."},
  {q:"🤔 Зачем приложению ПРОСТАЯ иконка (1 символ, 1-2 цвета)?",
   a:["Лень рисовать","Её видно крохотной — детали сольются","Так быстрее грузится","Требование закона"],c:1,
   e:"Иконку видно размером с ноготь: сильная = крупный символ, минимум деталей."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>📱 Викторина: первое приложение</h1>
    <div class="sub">Урок 1 · App Inventor</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты готов делать свои приложения — настоящий разработчик! 📱';}
  else if(pct>=70){em='🎉';msg='Отлично! Designer, Blocks и тест на телефоне — освоено.';}
  else if(pct>=40){em='👍';msg='Неплохо! Загляни в самоучитель и пройди урок ещё раз.';}
  else {em='💪';msg='Пробеги урок и самоучитель — и всё встанет на места.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
