<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="640" height="320" fill="#f8fafc"/>
  <text x="320" y="30" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">Три раскладки (Arrangements) — как ставить элементы</text>
  <text x="320" y="50" font-size="12" fill="#64748b" text-anchor="middle">Palette → Layout · сначала контейнер, потом кладём элементы внутрь</text>

  <!-- Horizontal -->
  <g>
    <rect x="30" y="80" width="180" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="44" y="110" width="44" height="30" rx="6" fill="#3b82f6"/>
    <rect x="98" y="110" width="44" height="30" rx="6" fill="#60a5fa"/>
    <rect x="152" y="110" width="44" height="30" rx="6" fill="#93c5fd"/>
    <text x="120" y="200" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="middle">HorizontalArrangement</text>
    <text x="120" y="220" font-size="13" fill="#334155" text-anchor="middle">в РЯД →</text>
    <text x="120" y="240" font-size="11" fill="#64748b" text-anchor="middle">панель: имя + кнопка ⚙️</text>
  </g>

  <!-- Vertical -->
  <g>
    <rect x="235" y="80" width="120" height="140" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="265" y="92" width="60" height="26" rx="6" fill="#22c55e"/>
    <rect x="265" y="124" width="60" height="26" rx="6" fill="#4ade80"/>
    <rect x="265" y="156" width="60" height="26" rx="6" fill="#86efac"/>
    <text x="295" y="248" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle">VerticalArrangement</text>
    <text x="295" y="268" font-size="13" fill="#334155" text-anchor="middle">в СТОЛБИК ↓</text>
    <text x="295" y="288" font-size="11" fill="#64748b" text-anchor="middle">колонка настроек</text>
  </g>

  <!-- Table -->
  <g>
    <rect x="390" y="80" width="150" height="140" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
    <g fill="#ef4444">
      <rect x="405" y="92" width="38" height="38" rx="7"/><rect x="451" y="92" width="38" height="38" rx="7"/><rect x="497" y="92" width="38" height="38" rx="7"/>
    </g>
    <g fill="#f87171">
      <rect x="405" y="138" width="38" height="38" rx="7"/><rect x="451" y="138" width="38" height="38" rx="7"/><rect x="497" y="138" width="38" height="38" rx="7"/>
    </g>
    <text x="465" y="248" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">TableArrangement</text>
    <text x="465" y="268" font-size="13" fill="#334155" text-anchor="middle">в СЕТКУ ▦ (строки × столбцы)</text>
    <text x="465" y="288" font-size="11" fill="#64748b" text-anchor="middle">сетка кнопок-действий 3×2</text>
  </g>

  <text x="320" y="312" font-size="12" fill="#0f172a" text-anchor="middle">💡 Раскладки можно вкладывать друг в друга — так строят любой макет.</text>
</svg>
