<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="620" height="430" fill="#f8fafc"/>
  <text x="310" y="28" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Итоговая схема блоков — «Мой питомец»</text>

  <text x="30" y="58" font-size="13" font-weight="700" fill="#0891b2">▊ Blocks экрана Screen1</text>

  <!-- helper for event blocks -->
  <!-- BtnFeed -->
  <g>
    <path d="M30 70 h250 v18 h-260 v-10 a8 8 0 0 1 8 -8 z" fill="#f5b800"/>
    <path d="M22 88 h236 v40 a8 8 0 0 1 -8 8 h-220 a8 8 0 0 1 -8 -8 z" fill="#f5b800"/>
    <text x="40" y="83" font-size="12.5" font-weight="700" fill="#5b4500">when BtnFeed.Click do</text>
    <rect x="40" y="96" width="205" height="30" rx="6" fill="#4a9e4a"/>
    <text x="49" y="115" font-size="12" font-weight="700" fill="#fff">set PetImage.Picture to</text>
    <rect x="206" y="100" width="34" height="22" rx="5" fill="#d9453f"/><text x="212" y="115" font-size="8.5" fill="#fff">"eat"</text>
  </g>
  <!-- BtnPlay -->
  <g>
    <path d="M310 70 h250 v18 h-260 v-10 a8 8 0 0 1 8 -8 z" fill="#f5b800"/>
    <path d="M302 88 h236 v40 a8 8 0 0 1 -8 8 h-220 a8 8 0 0 1 -8 -8 z" fill="#f5b800"/>
    <text x="320" y="83" font-size="12.5" font-weight="700" fill="#5b4500">when BtnPlay.Click do</text>
    <rect x="320" y="96" width="205" height="30" rx="6" fill="#4a9e4a"/>
    <text x="329" y="115" font-size="12" font-weight="700" fill="#fff">set PetImage.Picture to</text>
    <rect x="486" y="100" width="40" height="22" rx="5" fill="#d9453f"/><text x="492" y="115" font-size="8" fill="#fff">"happy"</text>
  </g>
  <!-- BtnSleep -->
  <g>
    <path d="M30 150 h250 v18 h-260 v-10 a8 8 0 0 1 8 -8 z" fill="#f5b800"/>
    <path d="M22 168 h236 v40 a8 8 0 0 1 -8 8 h-220 a8 8 0 0 1 -8 -8 z" fill="#f5b800"/>
    <text x="40" y="163" font-size="12.5" font-weight="700" fill="#5b4500">when BtnSleep.Click do</text>
    <rect x="40" y="176" width="205" height="30" rx="6" fill="#4a9e4a"/>
    <text x="49" y="195" font-size="12" font-weight="700" fill="#fff">set PetImage.Picture to</text>
    <rect x="206" y="180" width="40" height="22" rx="5" fill="#d9453f"/><text x="212" y="195" font-size="8" fill="#fff">"sleep"</text>
  </g>
  <!-- BtnTalk -->
  <g>
    <path d="M310 150 h270 v18 h-280 v-10 a8 8 0 0 1 8 -8 z" fill="#f5b800"/>
    <path d="M302 168 h256 v40 a8 8 0 0 1 -8 8 h-240 a8 8 0 0 1 -8 -8 z" fill="#f5b800"/>
    <text x="320" y="163" font-size="12.5" font-weight="700" fill="#5b4500">when BtnTalk.Click do</text>
    <rect x="320" y="176" width="230" height="30" rx="6" fill="#1d76c9"/>
    <text x="329" y="195" font-size="11.5" font-weight="700" fill="#fff">call TextToSpeech1.Speak "Мяу!"</text>
  </g>
  <!-- BtnSettings -->
  <g>
    <path d="M30 230 h300 v18 h-310 v-10 a8 8 0 0 1 8 -8 z" fill="#f5b800"/>
    <path d="M22 248 h286 v40 a8 8 0 0 1 -8 8 h-270 a8 8 0 0 1 -8 -8 z" fill="#f5b800"/>
    <text x="40" y="243" font-size="12.5" font-weight="700" fill="#5b4500">when BtnSettings.Click do</text>
    <rect x="40" y="256" width="258" height="30" rx="6" fill="#ff8c1a"/>
    <text x="49" y="275" font-size="12" font-weight="700" fill="#fff">open another screen  "Screen2"</text>
  </g>

  <!-- Screen2 -->
  <text x="30" y="322" font-size="13" font-weight="700" fill="#7c3aed">▊ Blocks экрана Screen2</text>
  <g>
    <path d="M30 334 h250 v18 h-260 v-10 a8 8 0 0 1 8 -8 z" fill="#f5b800"/>
    <path d="M22 352 h236 v36 a8 8 0 0 1 -8 8 h-220 a8 8 0 0 1 -8 -8 z" fill="#f5b800"/>
    <text x="40" y="347" font-size="12.5" font-weight="700" fill="#5b4500">when BtnBack.Click do</text>
    <rect x="40" y="360" width="150" height="28" rx="6" fill="#ff8c1a"/>
    <text x="49" y="378" font-size="12" font-weight="700" fill="#fff">close screen</text>
  </g>

  <!-- legend -->
  <text x="300" y="352" font-size="12" fill="#334155">🟡 событие  🟢 set (сменить картинку)</text>
  <text x="300" y="372" font-size="12" fill="#334155">🔵 call (речь)  🟠 навигация экранов</text>
  <text x="300" y="392" font-size="11.5" fill="#64748b">💡 Блоки BtnBack — на экране Screen2, не Screen1.</text>
</svg>
