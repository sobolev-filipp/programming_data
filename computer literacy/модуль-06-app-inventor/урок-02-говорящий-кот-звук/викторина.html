<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 2: Говорящий кот (App Inventor)</title>
<style>
  :root{
    --bg1:#f97316; --bg2:#db2777; --card:#ffffff; --ink:#1f2937;
    --accent:#ea580c; --ok:#16a34a; --bad:#dc2626; --soft:#ffedd5;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"В каком формате сохранить кота, чтобы не было белого фона вокруг?",
   a:["JPG","PNG (с прозрачностью)","BMP","PDF"],c:1,
   e:"PNG хранит прозрачность — кот ляжет поверх фона без квадрата."},
  {q:"Где удобнее рисовать векторные иконки-кнопки?",
   a:["Photoshop","Illustrator","Word","App Inventor"],c:1,
   e:"Illustrator — вектор: иконки чёткие на любом размере."},
  {q:"Куда в App Inventor загружают свои картинки и звуки?",
   a:["Palette","Media → Upload File","Blocks","Google Диск"],c:1,
   e:"Раздел Media, кнопка Upload File — ассеты доступны всем компонентам."},
  {q:"Какой компонент играет короткий звук (мяу)?",
   a:["Sound","Label","Canvas","Clock"],c:0,
   e:"Sound — для коротких эффектов. Player — для длинных треков."},
  {q:"Какой компонент произносит текст вслух?",
   a:["Sound","TextBox","TextToSpeech","Image"],c:2,
   e:"TextToSpeech.Speak — телефон озвучивает текст, файл не нужен."},
  {q:"Как «кот говорит» БЕЗ микрофона и звуковых файлов?",
   a:["Через TextToSpeech (синтез речи)","Записать голос","Скачать mp3","Никак"],c:0,
   e:"Синтез речи произносит любой текст голосом телефона."},
  {q:"Правильный порядок блоков для проигрывания звука?",
   a:["call Play → set Source","set Sound1.Source → call Sound1.Play","только call Play","только set Source"],c:1,
   e:"Сначала задаём источник, потом играем — иначе сыграет старый звук/тишина."},
  {q:"Чем set отличается от call?",
   a:["Ничем","set меняет свойство, call выполняет действие","call меняет свойство","set удаляет блок"],c:1,
   e:"set …to — свойство (Source), call … — действие (Play/Speak)."},
  {q:"Как поставить кнопки в ровный ряд?",
   a:["HorizontalArrangement","просто рядом бросить","Label","Sound"],c:0,
   e:"HorizontalArrangement выстраивает компоненты в ряд."},
  {q:"Куда ставится фоновая картинка экрана?",
   a:["Image.Picture","Screen1.BackgroundImage","Button.Image","Sound.Source"],c:1,
   e:"Фон — свойство ЭКРАНА: Screen1.BackgroundImage."},

  {q:"😄 Звук не играет, хотя файл загрузил. Что проверить?",
   a:["Перезагрузить телефон","Имя в Source совпадает с Media (с .mp3)","Купить колонки","Сменить кота"],c:1,
   e:"Имя в блоке Source должно точно совпадать с именем файла в Media."},
  {q:"😄 Жмёшь «Говори» — кот молчит. Вероятная причина?",
   a:["Кот обиделся","Нет русского голоса TTS / громкость на нуле","Мало памяти","Старый телефон"],c:1,
   e:"Поставь русский голос в настройках или фразу на английском; проверь громкость."},
  {q:"😄 Вокруг кота белый квадрат. Почему?",
   a:["Сохранили JPG вместо PNG","Экран сломан","Кот белый","Плохой Wi-Fi"],c:0,
   e:"JPG не хранит прозрачность — нужен PNG с прозрачным фоном."},

  {q:"🤔 Почему иконки — в Illustrator (вектор), а кота — в Photoshop (растр)?",
   a:["Так принято","Иконки нужны чёткими на любом размере — это вектор; фото = растр","Illustrator дороже","Случайно"],c:1,
   e:"Вектор масштабируется без потерь (иконки), фото — растровое (Photoshop)."},
  {q:"🤔 Почему приложение со своей графикой «дороже» смотрится?",
   a:["Оно тяжелее","У него уникальный вид и характер, а не стандартные серые кнопки","Больше кода","Так дороже по деньгам"],c:1,
   e:"Дизайн выделяет приложение; серые кнопки — как у всех."},
  {q:"🤔 Что общего у пути ЛЮБОЙ картинки в этом модуле?",
   a:["Adobe → Export PNG → Media → свойство Picture","Всегда рисуем в Scratch","Только фото с телефона","Ничего общего"],c:0,
   e:"Единый пайплайн ассета: сделал в Adobe → PNG → Media → поставил в свойство."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🐱 Викторина: Говорящий кот</h1>
    <div class="sub">Урок 2 · App Inventor + Adobe</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Графика + звук + логика — всё в одном приложении. Класс! 🐱';}
  else if(pct>=70){em='🎉';msg='Отлично! Sound, TextToSpeech и пайплайн ассетов освоены.';}
  else if(pct>=40){em='👍';msg='Неплохо! Загляни в самоучитель и пройди урок ещё раз.';}
  else {em='💪';msg='Пробеги урок и самоучитель — про PNG, Media и Sound встанет на места.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
