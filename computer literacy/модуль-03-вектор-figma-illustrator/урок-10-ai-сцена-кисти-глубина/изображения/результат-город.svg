<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E1A47"/><stop offset="0.55" stop-color="#7A3B6B"/><stop offset="0.8" stop-color="#FF8C42"/><stop offset="1" stop-color="#FFC46B"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFE8A8" stop-opacity="0.9"/><stop offset="1" stop-color="#FFE8A8" stop-opacity="0"/></radialGradient>
    <clipPath id="ground"><rect x="0" y="330" width="700" height="130"/></clipPath>
  </defs>
  <rect width="700" height="460" fill="url(#sky)"/>
  <!-- sun glow + sun -->
  <circle cx="470" cy="312" r="95" fill="url(#sunglow)"/>
  <circle cx="470" cy="312" r="46" fill="#FFD86B"/>

  <!-- clouds -->
  <g fill="#FFE0C2" opacity="0.55">
    <ellipse cx="150" cy="90" rx="60" ry="16"/><ellipse cx="180" cy="80" rx="40" ry="14"/>
    <ellipse cx="560" cy="130" rx="55" ry="14"/><ellipse cx="590" cy="122" rx="34" ry="12"/>
  </g>
  <!-- birds -->
  <g fill="none" stroke="#2E1A47" stroke-width="2.5" stroke-linecap="round" opacity="0.6">
    <path d="M300,110 q8,-8 16,0 q8,-8 16,0"/><path d="M350,130 q6,-6 12,0 q6,-6 12,0"/>
  </g>

  <!-- ground -->
  <rect x="0" y="330" width="700" height="130" fill="#241A3D"/>

  <!-- FAR buildings (light, hazy) -->
  <g fill="#A594C4">
    <rect x="60" y="316" width="40" height="16"/><rect x="108" y="308" width="34" height="24"/>
    <rect x="150" y="318" width="46" height="14"/><rect x="300" y="312" width="30" height="20"/>
    <rect x="340" y="306" width="34" height="26"/><rect x="600" y="314" width="40" height="18"/><rect x="646" y="308" width="34" height="24"/>
  </g>
  <!-- MID buildings -->
  <g fill="#6B5A93">
    <rect x="86" y="296" width="52" height="36"/><rect x="146" y="288" width="40" height="44"/>
    <rect x="250" y="298" width="60" height="34"/><rect x="330" y="290" width="46" height="42"/>
    <rect x="520" y="296" width="54" height="36"/><rect x="580" y="286" width="44" height="46"/>
  </g>

  <!-- long shadows on ground (one light, one angle) -->
  <g clip-path="url(#ground)" fill="#000000" opacity="0.20">
    <polygon points="60,330 118,330 34,430 -24,430"/>
    <polygon points="150,330 208,330 124,440 66,440"/>
    <polygon points="420,330 486,330 402,440 336,440"/>
    <polygon points="560,330 620,330 536,430 476,430"/>
  </g>

  <!-- NEAR buildings (dark silhouettes) + windows -->
  <g fill="#2E2350">
    <rect x="52" y="250" width="66" height="80"/>
    <rect x="140" y="210" width="64" height="120"/>
    <rect x="360" y="238" width="58" height="92"/>
    <rect x="420" y="200" width="70" height="130"/>
    <rect x="560" y="230" width="60" height="100"/>
  </g>
  <g fill="#FFD86B">
    <rect x="66" y="266" width="9" height="12"/><rect x="86" y="266" width="9" height="12"/><rect x="66" y="292" width="9" height="12"/><rect x="86" y="292" width="9" height="12"/>
    <rect x="154" y="228" width="9" height="12"/><rect x="176" y="228" width="9" height="12"/><rect x="154" y="256" width="9" height="12"/><rect x="176" y="256" width="9" height="12"/><rect x="154" y="284" width="9" height="12"/><rect x="176" y="284" width="9" height="12"/>
    <rect x="436" y="220" width="9" height="12"/><rect x="458" y="220" width="9" height="12"/><rect x="436" y="248" width="9" height="12"/><rect x="458" y="248" width="9" height="12"/><rect x="436" y="276" width="9" height="12"/><rect x="458" y="276" width="9" height="12"/>
    <rect x="574" y="248" width="9" height="12"/><rect x="596" y="248" width="9" height="12"/><rect x="574" y="276" width="9" height="12"/><rect x="596" y="276" width="9" height="12"/>
  </g>

  <text x="350" y="446" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#E9DFF6" text-anchor="middle">Глубина: дальнее светлее · ближнее темнее · длинные тени 45°</text>
</svg>
