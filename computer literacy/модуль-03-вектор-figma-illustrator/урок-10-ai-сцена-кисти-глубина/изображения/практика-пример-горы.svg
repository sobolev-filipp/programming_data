<svg viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="msky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9B4A6"/><stop offset="0.55" stop-color="#FFD3A6"/><stop offset="1" stop-color="#FFF0D6"/>
    </linearGradient>
    <radialGradient id="msun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFF3C4"/><stop offset="1" stop-color="#FFE196"/></radialGradient>
  </defs>
  <rect width="700" height="460" fill="url(#msky)"/>
  <circle cx="360" cy="230" r="52" fill="url(#msun)"/>

  <!-- hill planes: far (pale) -> near (dark) -->
