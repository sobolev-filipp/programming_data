<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Сцена с глубиной</title>
<style>
  :root{
    --bg1:#2E1A47; --bg2:#FF8C42; --card:#ffffff; --ink:#1e293b;
    --accent:#c2410c; --ok:#16a34a; --bad:#dc2626; --soft:#ffedd5;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Как показать, что дом ДАЛЕКО?",
   a:["Ярче и крупнее","Светлее, меньше, меньше деталей","Толще обводка","Ближе к низу"],c:1,
   e:"Атмосферная перспектива: дальнее бледнее/меньше, ближнее темнее/крупнее."},
  {q:"Зачем держать планы на отдельных СЛОЯХ?",
   a:["Для веса файла","Порядок и лёгко двигать/красить план целиком","Так ярче","Незачем"],c:1,
   e:"Слои-планы (небо/дальний/средний/передний) = порядок и удобство."},
  {q:"Куда падают тени, если солнце с одной стороны?",
   a:["В разные стороны","В противоположную сторону, все под одним углом","Вверх","Их нет"],c:1,
   e:"Один свет — все тени в одну сторону и под одним углом (обычно 45°)."},
  {q:"Каким режимом заливают длинную тень?",
   a:["Чистый чёрный 100%","«Умножение», непрозрачность ~25%","Экран","Белым"],c:1,
   e:"Полупрозрачное «Умножение» — тень мягкая, а не чёрный «блин»."},
  {q:"Чем обрезать тени, чтобы не лезли на небо?",
   a:["Ластиком","Обтравочной маской по земле (Ctrl+7)","Обводкой","Никак"],c:1,
   e:"Маска по прямоугольнику-земле держит тени только на земле."},
  {q:"Что делает инструмент «Ширина» (Shift+W)?",
   a:["Красит","Делает линию толще/тоньше в точках","Режет","Экспортирует"],c:1,
   e:"Переменная ширина: облака, холмы, «капли»-линии."},
  {q:"Где брать кисти для фактурных штрихов?",
   a:["В экспорте","Окно → Кисти → библиотеки","В слоях","В градиенте"],c:1,
   e:"Библиотеки кистей (Художественные/Декоративные) применяются как обводка."},
  {q:"Почему у неба делают градиент?",
   a:["Так надо всегда","Плавный переход = настроение и глубина","Меньше весит","Для теней"],c:1,
   e:"Градиентное небо задаёт атмосферу и помогает глубине (дымка у горизонта)."},
  {q:"Дальние облака и птицы должны быть…",
   a:["Крупнее и ярче","Мельче и бледнее","Такие же","Чёрными"],c:1,
   e:"Перспектива работает и в небе: далёкое — мельче и бледнее."},
  {q:"Что усиливает ощущение глубины у горизонта?",
   a:["Яркая линия","Светлая дымка (полупрозрачная полоса)","Толстая рамка","Тень"],c:1,
   e:"Дымка «растворяет» дальние планы — глубже."},

  {q:"😄 Город получился плоским, как обои одним цветом. В чём дело?",
   a:["Мало домов","Все планы одного цвета/размера","Нет текста","Малый холст"],c:1,
   e:"Дай дальним посветлеть/уменьшиться, ближним — потемнеть/укрупниться."},
  {q:"😄 Тени смотрят в разные стороны — «сломалось». Что не так?",
   a:["Так модно","Свет один — тени должны быть в одну сторону","Мало теней","Цвет"],c:1,
   e:"Определи источник света и направь все тени одинаково."},
  {q:"😄 Тень залезла на небо огромным чёрным пятном. Чем спасти?",
   a:["Оставить","Обтравочная маска по земле + «Умножение» 25%","Ярче","Удалить дом"],c:1,
   e:"Маска ограничит тень землёй, полупрозрачность смягчит."},

  {q:"🤔 Почему дальние объекты светлеют и «уходят в дымку»?",
   a:["Краска кончилась","В воздухе дымка/пыль рассеивают цвет — так глаз читает даль","Так ярче","Случайно"],c:1,
   e:"Это атмосферная перспектива — реальный эффект воздуха, который мы имитируем."},
  {q:"🤔 Зачем ближнему плану больше деталей, а дальнему меньше?",
   a:["Лень","Вблизи мы видим детали, вдали — общий силуэт: так правдоподобнее","Для веса","Наоборот нужно"],c:1,
   e:"Разница в детализации усиливает ощущение расстояния."},
  {q:"🤔 Чем перспективная сетка отличается от планов-слоёв?",
   a:["Ничем","Сетка строит настоящую геом. перспективу (2 точки); планы — проще, через цвет/размер","Сетка проще","Планы точнее"],c:1,
   e:"Сетка — точная перспектива (продвинуто); планы — быстрый способ глубины через атмосферу."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🌆 Сцена с глубиной</h1>
    <div class="sub">Викторина по уроку «Флэт-город»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты чувствуешь глубину — рисуй любые миры! 🌆';}
  else if(pct>=70){em='🎉';msg='Отлично! Планы, тени и кисти — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Помни: дальнее светлее/меньше, тени в одну сторону.';}
  else {em='💪';msg='Начало есть! Перечитай про планы и атмосферную перспективу.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
