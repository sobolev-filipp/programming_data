<svg viewBox="0 0 400 470" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gemL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DFF3FF"/><stop offset="1" stop-color="#8FCBEE"/></linearGradient>
    <linearGradient id="gemM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9AD3F0"/><stop offset="1" stop-color="#3D8FD1"/></linearGradient>
    <linearGradient id="gemD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4E9BD6"/><stop offset="1" stop-color="#1E5E9E"/></linearGradient>
    <radialGradient id="gshad" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#1E293B" stop-opacity="0.3"/><stop offset="1" stop-color="#1E293B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="470" fill="#EEF6FC"/>
  <text x="200" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E5E9E" text-anchor="middle">Кристалл · грани-градиенты</text>

  <ellipse cx="200" cy="378" rx="95" ry="18" fill="url(#gshad)"/>

  <!-- crown -->
  <polygon points="110,150 160,150 160,105" fill="url(#gemM)" stroke="#1E5E9E" stroke-width="1.5"/>
  <polygon points="160,105 240,105 240,150 160,150" fill="url(#gemL)" stroke="#1E5E9E" stroke-width="1.5"/>
  <polygon points="240,105 290,150 240,150" fill="url(#gemD)" stroke="#1E5E9E" stroke-width="1.5"/>
  <!-- pavilion -->
  <polygon points="110,150 160,150 200,365" fill="url(#gemD)" stroke="#1E5E9E" stroke-width="1.5"/>
  <polygon points="160,150 240,150 200,365" fill="url(#gemM)" stroke="#1E5E9E" stroke-width="1.5"/>
  <polygon points="240,150 290,150 200,365" fill="url(#gemL)" stroke="#1E5E9E" stroke-width="1.5"/>
  <!-- girdle line -->
  <line x1="110" y1="150" x2="290" y2="150" stroke="#1E5E9E" stroke-width="1.5"/>

  <!-- sparkle -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M188,120 l4,10 l10,4 l-10,4 l-4,10 l-4,-10 l-10,-4 l10,-4 Z"/>
    <circle cx="230" cy="200" r="4"/>
  </g>
</svg>
