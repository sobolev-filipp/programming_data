<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Градиенты и глянец</title>
<style>
  :root{
    --bg1:#1E6FA8; --bg2:#F5A623; --card:#ffffff; --ink:#1e293b;
    --accent:#0e7490; --ok:#16a34a; --bad:#dc2626; --soft:#cffafe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Какой градиент превращает круг в ШАР?",
   a:["Линейный","Радиальный (светлый центр → тёмный край)","Никакой","Только чёрный"],c:1,
   e:"Радиальный градиент из центра сам создаёт объём шара."},
  {q:"Для чего нужен ЛИНЕЙНЫЙ градиент?",
   a:["Для шаров","Переход по прямой — стекло, металл, небо","Только для теней","Ни для чего"],c:1,
   e:"Линейный идёт по прямой: цилиндры, стекло, фон."},
  {q:"Как сделать блик, который мягко РАСТВОРЯЕТСЯ?",
   a:["Большое белое пятно","Белый градиент с остановкой «непрозрачность 0»","Чёрный круг","Толстая обводка"],c:1,
   e:"Прозрачная остановка растворяет блик в теле объекта."},
  {q:"Чем задают НАПРАВЛЕНИЕ света в градиенте?",
   a:["Меняют цвет","Тянут инструментом «Градиент» (G) от блика","Крутят объект","Ничем"],c:1,
   e:"«Градиент» (G) задаёт, откуда «светит лампа»."},
  {q:"Что делает Градиентная сетка (Gradient Mesh)?",
   a:["Режет фигуру","Позволяет красить объём узлами в любом месте","Создаёт текст","Экспортирует"],c:1,
   e:"Сетка узлов — «супер-градиент» для лепки света и тени где угодно."},
  {q:"Как быстро создать объём сетки на круге?",
   a:["Файл → Печать","Объект → Создать сетку градиента → «К центру»","Ctrl+S","Обводка"],c:1,
   e:"«К центру» сразу даёт светлое пятно в середине — готовый шар."},
  {q:"Как покрасить узел сетки?",
   a:["Двойной клик по фону","Выбрать узел «Прямым выделением» (A) → задать цвет","Удалить его","Экспорт"],c:1,
   e:"Выделяешь узел белой стрелкой (A) и назначаешь цвет."},
  {q:"Что «приклеивает» объект к столу?",
   a:["Обводка","Мягкая тень под объектом (радиальная, прозрачная)","Яркий цвет","Текст"],c:1,
   e:"Тень-эллипс снизу и позади всего создаёт опору."},
  {q:"Сколько узлов сетки обычно достаточно новичку?",
   a:["20×20","4×4, покрасить 3–4 узла","1","100"],c:1,
   e:"4×4 хватает: свет, тень, блик — и объём готов."},
  {q:"Главное правило реалистичного объёма?",
   a:["Побольше цветов","Один источник света (блик и тень согласованы)","Яркая обводка","Без теней"],c:1,
   e:"Реши, откуда лампа, и держи блик/светлый бок/тень в одну логику."},

  {q:"😄 Нарисовал шар, а он плоский, как блин. Что забыл?",
   a:["Обводку","Радиальный градиент (свет→тень)","Текст","Рамку"],c:1,
   e:"Плоская заливка = блин. Радиальный градиент даёт объём."},
  {q:"😄 Блик — огромное белое пятно, «наклейка». Как исправить?",
   a:["Ещё больше","Маленький + прозрачная остановка (растворить)","Чёрным","Убрать"],c:1,
   e:"Маленький яркий блик + прозрачность = мокрый глянец."},
  {q:"😄 Свет-блик слева, а тень тоже слева — «сломалось». Почему?",
   a:["Так модно","Свет должен быть с ОДНОЙ стороны, тень — с другой","Мало цвета","Экран старый"],c:1,
   e:"Один источник: блик со стороны лампы, тень — напротив."},

  {q:"🤔 Почему радиальный градиент делает именно ШАР, а не диск?",
   a:["Случайно","Светлый центр читается как ближняя точка, тёмные края — как уход в тень","Он ярче","Так в программе"],c:1,
   e:"Мозг видит «свет ближе, края отворачиваются» — это объём."},
  {q:"🤔 Зачем добавлять рефлекс (свет у нижнего края в тени)?",
   a:["Для веса файла","Отражённый свет «оживляет» объём, делает реалистичнее","Чтобы ярче","Незачем"],c:1,
   e:"В жизни от стола отражается свет — лёгкий рефлекс снизу выглядит правдиво."},
  {q:"🤔 Когда лучше сетка, а когда обычный градиент?",
   a:["Всегда сетка","Ровный объём — градиент; сложные переливы в разных местах — сетка","Всегда градиент","Без разницы"],c:1,
   e:"Сетка нужна, когда свет/тень ложатся неравномерно (щёки, вмятины)."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>💧 Градиенты и глянец</h1>
    <div class="sub">Викторина по уроку «Объём и блеск»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты мастер объёма и глянца! 💧🍊';}
  else if(pct>=70){em='🎉';msg='Отлично! Градиенты и сетка — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Помни: радиальный = шар, прозрачная остановка = блик.';}
  else {em='💪';msg='Начало есть! Перечитай про радиальный градиент и сетку.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
