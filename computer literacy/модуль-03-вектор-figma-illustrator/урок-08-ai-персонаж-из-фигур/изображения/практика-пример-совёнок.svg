<svg viewBox="0 0 460 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="obody" cx="0.4" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#9184C7"/><stop offset="0.6" stop-color="#6C5FA6"/><stop offset="1" stop-color="#4B3F84"/>
    </radialGradient>
    <linearGradient id="obelly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E7DFF7"/><stop offset="1" stop-color="#C7BAE8"/>
    </linearGradient>
    <linearGradient id="obeak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD36A"/><stop offset="1" stop-color="#EF9A1C"/>
    </linearGradient>
    <radialGradient id="oshad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1E293B" stop-opacity="0.28"/><stop offset="1" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="oclip"><ellipse cx="230" cy="300" rx="150" ry="168"/></clipPath>
  </defs>
  <rect width="460" height="540" fill="#F1ECFA"/>
  <ellipse cx="230" cy="486" rx="130" ry="22" fill="url(#oshad)"/>

  <!-- ear tufts -->
  <polygon points="150,120 205,220 118,208" fill="#5A4E92"/>
  <polygon points="310,120 255,220 342,208" fill="#5A4E92"/>
  <!-- feet -->
  <g fill="#EF9A1C"><path d="M190,452 l0,22 m-12,0 l24,0" stroke="#EF9A1C" stroke-width="6" stroke-linecap="round"/><path d="M270,452 l0,22 m-12,0 l24,0" stroke="#EF9A1C" stroke-width="6" stroke-linecap="round"/></g>
  <!-- wings -->
  <ellipse cx="108" cy="300" rx="34" ry="98" fill="#5A4E92" transform="rotate(-12 108 300)"/>
  <ellipse cx="352" cy="300" rx="34" ry="98" fill="#5A4E92" transform="rotate(12 352 300)"/>

  <!-- body -->
  <ellipse cx="230" cy="300" rx="150" ry="168" fill="url(#obody)"/>
  <!-- belly -->
  <g clip-path="url(#oclip)"><ellipse cx="230" cy="352" rx="104" ry="130" fill="url(#obelly)"/></g>

  <!-- eye discs -->
  <circle cx="182" cy="248" r="62" fill="#EDE7F8"/>
  <circle cx="278" cy="248" r="62" fill="#EDE7F8"/>
  <!-- eyes -->
  <circle cx="182" cy="252" r="40" fill="#ffffff"/>
  <circle cx="278" cy="252" r="40" fill="#ffffff"/>
  <circle cx="188" cy="258" r="22" fill="#2C2540"/>
  <circle cx="272" cy="258" r="22" fill="#2C2540"/>
  <circle cx="180" cy="250" r="8" fill="#ffffff"/>
  <circle cx="264" cy="250" r="8" fill="#ffffff"/>

  <!-- beak -->
  <path d="M230,288 L248,312 L212,312 Z" fill="url(#obeak)"/>
  <!-- blush -->
  <ellipse cx="140" cy="320" rx="16" ry="10" fill="#F6A5C0" opacity="0.5"/>
  <ellipse cx="320" cy="320" rx="16" ry="10" fill="#F6A5C0" opacity="0.5"/>
</svg>
