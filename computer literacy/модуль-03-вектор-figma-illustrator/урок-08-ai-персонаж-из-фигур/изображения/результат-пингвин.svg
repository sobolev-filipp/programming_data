  <!-- blush -->
  <ellipse cx="188" cy="238" rx="16" ry="10" fill="#F6A5C0" opacity="0.5"/>
  <ellipse cx="312" cy="238" rx="16" ry="10" fill="#F6A5C0" opacity="0.5"/>

  <!-- eyes (close-set, on black head cap) -->
