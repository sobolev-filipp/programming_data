  <ellipse cx="278" cy="196" rx="25" ry="29" fill="#ffffff"/>
  <circle cx="228" cy="204" r="13" fill="#22262B"/>
  <circle cx="272" cy="204" r="13" fill="#22262B"/>
  <circle cx="223" cy="198" r="5" fill="#ffffff"/>
  <circle cx="267" cy="198" r="5" fill="#ffffff"/>

  <!-- beak -->
  <path d="M250,220 L273,240 L250,266 L227,240 Z" fill="url(#pbeak)"/>
  <path d="M250,243 L273,240 L250,266 L227,240 Z" fill="#000000" opacity="0.12"/>
