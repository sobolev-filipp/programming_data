<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" rx="24" fill="#fff8ee"/><g font-family="Arial" fill="#30234e"><text x="45" y="65" font-size="34" font-weight="bold">Главный компонент → три экземпляра</text><rect x="40" y="115" width="1020" height="105" rx="18" fill="#e9e0ff"/><text x="65" y="153" font-size="25" font-weight="bold">Общая рамка: 3 → 6 px</text><text x="65" y="192" font-size="23">Изменение придёт во все рамки без локальных изменений.</text><rect x="40" y="240" width="1020" height="105" rx="18" fill="#d5eee8"/><text x="65" y="278" font-size="25" font-weight="bold">Имя первого экземпляра: ПИЛОТ</text><text x="65" y="317" font-size="23">Своё имя сохранится: это переопределение.</text><rect x="40" y="365" width="1020" height="105" rx="18" fill="#fff0c4"/><text x="65" y="403" font-size="25" font-weight="bold">Отсоединённая карточка</text><text x="65" y="442" font-size="23">Связь потеряна: правки главного компонента не придут.</text></g></svg>