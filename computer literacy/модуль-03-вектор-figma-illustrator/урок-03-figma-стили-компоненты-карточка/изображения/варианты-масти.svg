<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500"><rect width="1100" height="500" rx="20" fill="#fff8ee"/><text x="35" y="45" font-family="Arial" font-size="30" fill="#30234e">Варианты хранят разные нарисованные масти</text><rect x="30" y="75" width="680" height="280" rx="15" fill="none" stroke="#7952c7" stroke-width="2" stroke-dasharray="7 4"/><text x="50" y="105" font-family="Arial" font-size="23" fill="#30234e">Набор: Колода / Туз</text><rect x="60" y="130" width="190" height="190" rx="12" fill="white" stroke="#d8c8b4"/><path d="M0 -30 C-60 -85 -70 10 0 55 C70 10 60 -85 0 -30 Z" transform="translate(155 215) scale(.75)" fill="#b83246"/><text x="76" y="303" font-family="Arial" font-size="18" fill="#30234e">Масть=Червы</text><rect x="280" y="130" width="190" height="190" rx="12" fill="white" stroke="#d8c8b4"/><path d="M0 -65 C0 -65 65 -15 65 25 C65 70 0 50 0 50 C0 50 -65 70 -65 25 C-65 -15 0 -65 0 -65 Z M-7 40 L7 40 L23 85 L-23 85 Z" transform="translate(375 215) scale(.75)" fill="#263445"/><text x="296" y="303" font-family="Arial" font-size="18" fill="#30234e">Масть=Пики</text><rect x="500" y="130" width="190" height="190" rx="12" fill="white" stroke="#d8c8b4"/><path d="M0 -65 L45 0 L0 65 L-45 0 Z" transform="translate(595 215) scale(.75)" fill="#b83246"/><text x="516" y="303" font-family="Arial" font-size="18" fill="#30234e">Масть=Бубны</text><text x="750" y="150" font-family="Arial" font-size="25" fill="#30234e">Assets → Туз</text><text x="750" y="205" font-family="Arial" font-size="21" fill="#30234e">Перетащи экземпляр</text><text x="750" y="260" font-family="Arial" font-size="26" fill="#30234e">Масть: Пики ▾</text><text x="45" y="405" font-family="Arial" font-size="23" fill="#30234e">В главном варианте можно заменить векторные слои.</text><text x="45" y="450" font-family="Arial" font-size="22" fill="#30234e">В экземпляре выбираем масть переключателем — рисунки подставятся сами.</text></svg>