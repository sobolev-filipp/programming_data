<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Стили и компоненты</title>
<style>
  :root{
    --bg1:#4c1d95; --bg2:#f59e0b; --card:#ffffff; --ink:#1e293b;
    --accent:#7c3aed; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS=[{"q": "Что задают стопы градиента?", "a": ["Цвета перехода", "Размер всей карточки", "Порядок внутренних слоёв", "Название нового стиля"], "c": 0, "e": "У каждого стопа свой цвет и непрозрачность."}, {"q": "Чем повернуть переход цвета?", "a": ["Рамкой выделения", "Линией градиента", "Панелью слоёв слева", "Полем размера шрифта"], "c": 1, "e": "Перемещай концы линии градиента."}, {"q": "Что хранит стиль текста?", "a": ["Имя персонажа карты", "Число очков героя", "Настройки шрифта", "Все слои карточки"], "c": 2, "e": "Текст и его оформление — разные вещи."}, {"q": "Где править общую рамку?", "a": ["В каждом PNG отдельно", "В любом текстовом слое", "В настройках экспорта", "В главном компоненте"], "c": 3, "e": "Связанные свойства экземпляров наследуют изменения."}, {"q": "Что такое экземпляр?", "a": ["Связанный объект", "Отдельная растровая картинка", "Новая независимая группа", "Сохранённая цветовая палитра"], "c": 0, "e": "Экземпляр связан с главным компонентом."}, {"q": "Как назвать личное имя в экземпляре?", "a": ["Экспортом картинки", "Переопределением", "Объединением контуров", "Линейным градиентом"], "c": 1, "e": "Локальное изменение сохраняет связь."}, {"q": "Что произойдёт после Detach instance?", "a": ["Исчезнут все тексты", "Изменится цвет рамки", "Прервётся связь", "Удалится главный компонент"], "c": 2, "e": "Отсоединённый объект больше не наследует изменения."}, {"q": "Какой формат сохранит вектор?", "a": ["Картинка JPEG", "Картинка PNG", "Анимация GIF", "Файл SVG"], "c": 3, "e": "SVG хранит векторные формы."}, {"q": "Что проверять перед экспортом?", "a": ["Читаемость текста", "Количество открытых вкладок", "Название браузера на компьютере", "Положение курсора мыши"], "c": 0, "e": "Проверь отступы и длинные имена."}, {"q": "Как надёжно вставить экземпляр?", "a": ["Нарисовать похожую группу", "Перетащить из Assets", "Открыть экспортированный PNG", "Скопировать снимок экрана"], "c": 1, "e": "Assets позволяет вставить экземпляр компонента."}, {"q": "Дизайнер просит золотую рамку всей колоде. Где править?", "a": ["В подписи только робота", "В настройке масштаба холста", "В главном компоненте", "В названии папки экспорта"], "c": 2, "e": "Общие правки выполняют в главном компоненте."}, {"q": "На карте действий оказалось длинное название. Что проверить?", "a": ["Скорость работы интернета", "Количество фигур на холсте", "Порядок вкладок браузера", "Перенос текста"], "c": 3, "e": "Имя не должно выходить за границы карточки."}, {"q": "Туз потерял связь с шаблоном после Detach. Что случилось?", "a": ["Экземпляр отсоединён", "Файл автоматически удалён", "Все слои стали прозрачными", "Градиент превратился в обводку"], "c": 0, "e": "Detach разрывает связь с компонентом."}, {"q": "Рамка одной карты не обновилась. Возможная причина?", "a": ["У карты другое имя", "Толщина переопределена", "Карточка стоит справа", "У файла длинное название"], "c": 1, "e": "Локальная толщина может перекрыть наследуемое значение."}, {"q": "Изменили рамку шаблона. Что будет с личным именем?", "a": ["Заменится именем шаблона", "Превратится в обычный контур", "Сохранится", "Исчезнет вместе с текстом"], "c": 2, "e": "Правка рамки не сбрасывает переопределённый текст."}, {"q": "PNG красивый. Доказывает ли он связь карточек?", "a": ["Да, если рамки одинаковые", "Да, если имена отличаются", "Да, если размер достаточно большой", "Нет, нужен исходник"], "c": 3, "e": "Проверяй связь в редактируемом файле."}];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>Стили и компоненты</h1>
    <div class="sub">Викторина по уроку «Коллекция карточек»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ if(!locked) return; i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Компоненты и стили — твоя суперсила! 🃏';}
  else if(pct>=70){em='🎉';msg='Отлично! Градиенты, стили и компоненты — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: мастер правит все копии, стили — единый вид.';}
  else {em='💪';msg='Начало есть! Перечитай про компоненты, экземпляры и стили.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
