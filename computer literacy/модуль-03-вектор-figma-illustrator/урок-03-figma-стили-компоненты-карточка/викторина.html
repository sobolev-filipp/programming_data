<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Стили и компоненты</title>
<style>
  :root{
    --bg1:#4c1d95; --bg2:#f59e0b; --card:#ffffff; --ink:#1e293b;
    --accent:#7c3aed; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что такое компонент в Figma?",
   a:["Картинка-фон","Мастер-шаблон, из которого делают связанные копии","Название слоя","Тип экспорта"],c:1,
   e:"Компонент (◆) — оригинал; из него ставят экземпляры (◇), которые обновляются вместе."},
  {q:"Что произойдёт с копиями, если поменять МАСТЕР-компонент?",
   a:["Ничего","Все копии обновятся автоматически","Копии удалятся","Только первая"],c:1,
   e:"Правка мастера разлетается по всем экземплярам — это и есть их сила."},
  {q:"Что можно менять в КОПИИ, не разрывая связь?",
   a:["Ничего нельзя","Текст, цвет, картинку (переопределения)","Только удалить","Формат файла"],c:1,
   e:"Override — текст/цвет/картинка меняются, а структура остаётся из мастера."},
  {q:"Что такое стиль цвета?",
   a:["Случайный цвет","Сохранённая краска, применяется в один клик и правится централизованно","Градиент всегда","Обводка"],c:1,
   e:"Стиль цвета/текста хранит настройку; поменял стиль — обновилось везде."},
  {q:"Как сделать заливку «премиальной» и объёмной?",
   a:["Плоский серый","Градиент из 2 оттенков","Чёрный","Убрать заливку"],c:1,
   e:"Мягкий градиент двух близких оттенков выглядит дороже плоского цвета."},
  {q:"Чем линейный градиент отличается от радиального?",
   a:["Ничем","Линейный — по прямой, радиальный — из центра (свечение)","Радиальный ярче","Линейный только чёрный"],c:1,
   e:"Радиальный удобен для ореола-свечения за портретом героя."},
  {q:"Как создать компонент из карточки?",
   a:["Просто скопировать","Выделить → «Create component» (Ctrl+Alt+K)","Сохранить в PNG","Сгруппировать и всё"],c:1,
   e:"После этого появляется фиолетовый ромб ◆ — мастер."},
  {q:"Где лучше держать мастер-компонент?",
   a:["Среди копий","Отдельно «на полке» (или на отдельной странице)","Удалить его","В экспорте"],c:1,
   e:"Так не запутаешься, где оригинал, а где рабочие копии."},
  {q:"Откуда ещё можно ставить копии компонента?",
   a:["Из корзины","Из вкладки Assets (перетащить)","Из браузера","Ниоткуда"],c:1,
   e:"Панель Assets хранит все компоненты — перетаскивай на холст."},
  {q:"Зачем применять СТИЛИ, а не красить на глаз?",
   a:["Так дольше","Чтобы весь набор был единым и правился централизованно","Для веса файла","Незачем"],c:1,
   e:"Стили = порядок в цветах/шрифтах и мгновенная правка всего набора."},

  {q:"😄 Надо 30 одинаковых карточек. Как НЕ надо делать?",
   a:["Компонент + копии","Рисовать все 30 руками по очереди","Assets перетащить","Один мастер"],c:1,
   e:"Руками 30 раз — путь боли. Для этого и придумали компоненты."},
  {q:"😄 Решил поменять рамку у всей колоды из компонента. Куда идти?",
   a:["Править каждую копию","Поменять в мастере — обновятся все","Начать заново","Никуда"],c:1,
   e:"Одна правка мастера = вся колода обновилась."},
  {q:"😄 Карта выглядит «дёшево», хотя всё ровно. Что добавить?",
   a:["Ещё текста","Градиент и золотую обводку","Больше кнопок","Убрать цвет"],c:1,
   e:"Градиент + аккуратная рамка сразу поднимают «дороговизну»."},

  {q:"🤔 Почему дизайнеры интерфейсов повсюду используют компоненты?",
   a:["Мода","Одна правка обновляет весь продукт — экономия часов и единый вид","Так требует Figma","Красивее ромбик"],c:1,
   e:"Кнопки/карточки/иконки как компоненты = быстро менять весь интерфейс сразу."},
  {q:"🤔 Чем стиль текста полезнее, чем каждый раз задавать шрифт вручную?",
   a:["Ничем","Поменял стиль — все заголовки/подписи обновились разом","Быстрее печатать","Меняет язык"],c:1,
   e:"Централизованная типографика: один стиль правит десятки надписей."},
  {q:"🤔 В чём разница между КОПИЕЙ-компонентом и обычной копией группы?",
   a:["Никакой","Экземпляр связан с мастером и обновляется; обычная копия — сама по себе","Группа ярче","Компонент нельзя двигать"],c:1,
   e:"Обычную копию надо править вручную; экземпляр обновляется из мастера."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🃏 Стили и компоненты</h1>
    <div class="sub">Викторина по уроку «Коллекция карточек»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Компоненты и стили — твоя суперсила! 🃏';}
  else if(pct>=70){em='🎉';msg='Отлично! Градиенты, стили и компоненты — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: мастер правит все копии, стили — единый вид.';}
  else {em='💪';msg='Начало есть! Перечитай про компоненты, экземпляры и стили.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
