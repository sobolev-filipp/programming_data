<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#e36a37"/></marker></defs><rect width="794" height="1123" fill="white"/><text x="45" y="55" font-family="Arial" font-size="28" fill="#30234e">Трафарет: масти пером</text><text x="45" y="90" font-family="Arial" font-size="18" fill="#30234e">Квадрат — узел. Золотая точка — куда тянуть мышь.</text><path d="M200 215 C100 115 65 270 200 365 C335 270 300 115 200 215 Z" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="195" y="210" width="10" height="10" fill="#7650c5"/><text x="212" y="215" font-family="Arial" font-size="18" fill="#30234e">A</text><rect x="195" y="360" width="10" height="10" fill="#7650c5"/><text x="212" y="365" font-family="Arial" font-size="18" fill="#30234e">B</text><path d="M200 215 L100 115 M200 365 L335 270" stroke="#e36a37" stroke-width="2" marker-end="url(#a)"/><circle cx="100" cy="115" r="6" fill="#eebd44"/><circle cx="335" cy="270" r="6" fill="#eebd44"/><text x="420" y="185" font-family="Arial" font-size="23" fill="#30234e">Сердце — два узла</text><text x="420" y="230" font-family="Arial" font-size="18" fill="#30234e">A: тяни к золотой точке.</text><text x="420" y="265" font-family="Arial" font-size="18" fill="#30234e">B: тяни вправо-вверх.</text><text x="420" y="300" font-family="Arial" font-size="18" fill="#30234e">Замкни A кликом.</text><text x="420" y="335" font-family="Arial" font-size="18" fill="#30234e">В A и B: No mirroring.</text><text x="420" y="365" font-family="Arial" font-size="18" fill="#30234e">Усы направь к долям:</text><text x="420" y="395" font-family="Arial" font-size="18" fill="#30234e">левый ↖, правый ↗.</text><path d="M200 550 L290 690 L200 830 L110 690 Z" fill="none" stroke="#94a3b8" stroke-width="3"/><rect x="195" y="545" width="10" height="10" fill="#7650c5"/><text x="212" y="550" font-family="Arial" font-size="18" fill="#30234e">1</text><rect x="285" y="685" width="10" height="10" fill="#7650c5"/><text x="302" y="690" font-family="Arial" font-size="18" fill="#30234e">2</text><rect x="195" y="825" width="10" height="10" fill="#7650c5"/><text x="212" y="830" font-family="Arial" font-size="18" fill="#30234e">3</text><rect x="105" y="685" width="10" height="10" fill="#7650c5"/><text x="122" y="690" font-family="Arial" font-size="18" fill="#30234e">4</text><text x="420" y="620" font-family="Arial" font-size="23" fill="#30234e">Бубны — только клики</text><text x="420" y="670" font-family="Arial" font-size="18" fill="#30234e">1 → 2 → 3 → 4 → 1</text><text x="420" y="710" font-family="Arial" font-size="18" fill="#30234e">Не тяни мышь:</text><text x="420" y="745" font-family="Arial" font-size="18" fill="#30234e">все углы остаются острыми.</text><text x="45" y="940" font-family="Arial" font-size="18" fill="#30234e">Сначала потренируйся рядом. Потом используй знак на карте.</text><text x="45" y="980" font-family="Arial" font-size="18" fill="#30234e">Подложка помогает рисовать, но не входит в готовый экспорт.</text></svg>