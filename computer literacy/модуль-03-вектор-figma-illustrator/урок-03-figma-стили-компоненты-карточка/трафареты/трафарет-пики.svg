<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#e36a37"/></marker></defs><rect width="794" height="1123" fill="white"/><text x="45" y="55" font-family="Arial" font-size="30" fill="#30234e">Трафарет: пики — ♠</text><text x="45" y="90" font-family="Arial" font-size="17" fill="#30234e">Острый верх, две округлые доли и ножка. Рисуем двумя контурами.</text><path d="M220 145 V500" stroke="#ccd2db" stroke-dasharray="6 5"/><path d="M220 180 C220 180 340 270 340 350 C340 430 220 400 220 400 C220 400 100 430 100 350 C100 270 220 180 220 180 Z" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M208 388 C210 430 200 455 180 475 L260 475 C240 455 230 430 232 388 Z" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><rect x="215" y="175" width="10" height="10" fill="#7650c5"/><text x="232" y="170" font-family="Arial" font-size="18" fill="#30234e">A</text><rect x="335" y="345" width="10" height="10" fill="#7650c5"/><text x="352" y="340" font-family="Arial" font-size="18" fill="#30234e">B</text><rect x="215" y="395" width="10" height="10" fill="#7650c5"/><text x="232" y="390" font-family="Arial" font-size="18" fill="#30234e">C</text><rect x="95" y="345" width="10" height="10" fill="#7650c5"/><text x="112" y="340" font-family="Arial" font-size="18" fill="#30234e">D</text><path d="M340 270 V430" stroke="#eebd44" stroke-width="1"/><path d="M340 350 V430" stroke="#e36a37" stroke-width="2" marker-end="url(#arrow)"/><circle cx="340" cy="430" r="6" fill="#eebd44"/><path d="M100 270 V430" stroke="#eebd44" stroke-width="1"/><path d="M100 350 V270" stroke="#e36a37" stroke-width="2" marker-end="url(#arrow)"/><circle cx="100" cy="270" r="6" fill="#eebd44"/><text x="405" y="180" font-family="Arial" font-size="16" fill="#30234e">1. Перо (P): кликни A — острый верх.</text><text x="405" y="219" font-family="Arial" font-size="16" fill="#30234e">2. В B нажми и тяни строго вниз</text><text x="405" y="258" font-family="Arial" font-size="16" fill="#30234e">   до золотой точки (80 px).</text><text x="405" y="297" font-family="Arial" font-size="16" fill="#30234e">3. Кликни C без протяжки.</text><text x="405" y="336" font-family="Arial" font-size="16" fill="#30234e">4. В D тяни строго вверх (80 px).</text><text x="405" y="375" font-family="Arial" font-size="16" fill="#30234e">5. Кликни A, чтобы замкнуть контур.</text><text x="405" y="414" font-family="Arial" font-size="16" fill="#30234e">6. Убери обводку, залей #263445.</text><text x="45" y="550" font-family="Arial" font-size="24" fill="#30234e">Ножка — отдельная фигура</text><text x="45" y="590" font-family="Arial" font-size="17" fill="#30234e">Нарисуй пером небольшой трапециевидный контур под знаком:</text><text x="45" y="620" font-family="Arial" font-size="17" fill="#30234e">верх (208, 388) → (232, 388) → (260, 475) → (180, 475) → замкни.</text><text x="45" y="650" font-family="Arial" font-size="17" fill="#30234e">Все четыре точки поставь кликами. Верх ножки немного заходит в знак.</text><text x="45" y="680" font-family="Arial" font-size="17" fill="#30234e">Для закруглённой ножки можешь обвести пунктир, изменив направляющие.</text><text x="45" y="710" font-family="Arial" font-size="17" fill="#30234e">Выдели знак и ножку → Union selection. Получится одна масть.</text><g transform="translate(60 690) scale(.65)"><path d="M220 180 C220 180 340 270 340 350 C340 430 220 400 220 400 C220 400 100 430 100 350 C100 270 220 180 220 180 Z" fill="#263445"/><path d="M208 388 C210 430 200 455 180 475 L260 475 C240 455 230 430 232 388 Z" fill="#263445"/></g><text x="405" y="790" font-family="Arial" font-size="24" fill="#30234e">Проверь силуэт</text><text x="405" y="835" font-family="Arial" font-size="17" fill="#30234e">Верх острый, доли округлые.</text><text x="405" y="870" font-family="Arial" font-size="17" fill="#30234e">Ножка соединена со знаком.</text><text x="405" y="905" font-family="Arial" font-size="17" fill="#30234e">Нет щели между фигурами.</text><text x="45" y="1040" font-family="Arial" font-size="17" fill="#30234e">Импортируй SVG в Figma как подложку и заблокируй слой.</text><text x="45" y="1070" font-family="Arial" font-size="17" fill="#30234e">Рисуй поверх. Перед экспортом скрой трафарет.</text></svg>