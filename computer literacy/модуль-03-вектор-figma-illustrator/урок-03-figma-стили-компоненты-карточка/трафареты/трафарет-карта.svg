<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="white"/><text x="45" y="55" font-family="Arial" font-size="28" fill="#30234e">Трафарет: лицевая сторона и рубашка</text><text x="45" y="85" font-family="Arial" font-size="17" fill="#30234e">Импортируй в Figma как подложку или распечатай на A4.</text><text x="65" y="140" font-family="Arial" font-size="23" fill="#30234e">Лицевая сторона</text><g transform="translate(65 175)"><rect width="288" height="408" rx="19.2" fill="none" stroke="#667085" stroke-width="2"/><rect x="19.2" y="19.2" width="249.6" height="369.6" rx="12" fill="none" stroke="#aaa" stroke-dasharray="5 4"/><path d="M144 0 V408 M0 204 H288" stroke="#ccc" stroke-dasharray="6 5"/><text x="32" y="65" font-family="Arial" font-size="36" fill="#30234e">A</text><text x="32" y="98" font-family="Arial" font-size="29" fill="#30234e">♥</text><g transform="translate(288 408) rotate(180)"><text x="32" y="65" font-family="Arial" font-size="36" fill="#30234e">A</text><text x="32" y="98" font-family="Arial" font-size="29" fill="#30234e">♥</text></g><rect x="77" y="137" width="134" height="134" fill="none" stroke="#aaa" stroke-dasharray="3 4"/></g><text x="440" y="140" font-family="Arial" font-size="23" fill="#30234e">Рубашка</text><g transform="translate(440 175)"><rect width="288" height="408" rx="19.2" fill="none" stroke="#667085" stroke-width="2"/><rect x="19.2" y="19.2" width="249.6" height="369.6" rx="12" fill="none" stroke="#aaa" stroke-dasharray="5 4"/><path d="M144 0 V408 M0 204 H288" stroke="#ccc" stroke-dasharray="6 5"/><path d="M144 110 L202 204 L144 298 L86 204 Z" fill="none" stroke="#bbb" stroke-width="2"/><circle cx="144" cy="204" r="80" fill="none" stroke="#bbb"/></g><text x="45" y="615" font-family="Arial" font-size="16" fill="#30234e">Лицевая сторона · рабочие размеры (px)</text><text x="45" y="633" font-family="Arial" font-size="15" fill="#536074">Фрейм 240 × 340; радиус 16; Fill #FFF9EF.</text><text x="45" y="652" font-family="Arial" font-size="16" fill="#30234e">Внешняя обводка</text><text x="45" y="670" font-family="Arial" font-size="15" fill="#536074">#D8C8B4 · 2 px · Inside · непрозрачность 100%.</text><text x="45" y="689" font-family="Arial" font-size="16" fill="#30234e">Внутренняя рамка</text><text x="45" y="707" font-family="Arial" font-size="15" fill="#536074">208 × 308; X 16, Y 16; радиус 10; Fill нет.</text><text x="45" y="726" font-family="Arial" font-size="16" fill="#30234e">Обводка внутренней рамки</text><text x="45" y="744" font-family="Arial" font-size="15" fill="#536074">#D8C8B4 · 1 px · Inside · непрозрачность 100%.</text><text x="45" y="763" font-family="Arial" font-size="16" fill="#30234e">Буква A (только номинал — текст)</text><text x="45" y="781" font-family="Arial" font-size="15" fill="#536074">Georgia Bold · 30 px · строка Auto · интервал 0.</text><text x="45" y="800" font-family="Arial" font-size="16" fill="#30234e">Цвет и положение буквы</text><text x="45" y="818" font-family="Arial" font-size="15" fill="#536074">Червы / бубны #B83246; пики #263445; X 27, Y 24.</text><text x="45" y="837" font-family="Arial" font-size="16" fill="#30234e">Рисунки мастей — пером</text><text x="45" y="855" font-family="Arial" font-size="15" fill="#536074">Центр: ширина 112; центр (120,170); Stroke нет.</text><text x="45" y="874" font-family="Arial" font-size="16" fill="#30234e">Угловые масти и нижний индекс</text><text x="45" y="892" font-family="Arial" font-size="15" fill="#536074">Ширина 24; верх X 27, Y 62; низ — поворот 180°.</text><text x="45" y="911" font-family="Arial" font-size="16" fill="#30234e">Рубашка</text><text x="45" y="929" font-family="Arial" font-size="15" fill="#536074">240 × 340; радиус 16; Linear вертикально: 0 / 50 / 100%.</text><text x="45" y="948" font-family="Arial" font-size="16" fill="#30234e">Градиент рубашки</text><text x="45" y="966" font-family="Arial" font-size="15" fill="#536074">#102839 → #39718A → #102839; все стопы 100%.</text><text x="45" y="985" font-family="Arial" font-size="16" fill="#30234e">Рамка рубашки</text><text x="45" y="1003" font-family="Arial" font-size="15" fill="#536074">208 × 308; X 16, Y 16; радиус 10; Fill нет; Stroke #E8BD75, 2.</text><text x="45" y="1040" font-family="Arial" font-size="15" fill="#30234e">На листе карты увеличены ×1,2. Все числа выше — для размера 240 × 340.</text><text x="45" y="1064" font-family="Arial" font-size="15" fill="#30234e">SVG: ширина листа 794 px. Подложку заблокируй; перед экспортом скрой.</text><text x="45" y="1088" font-family="Arial" font-size="15" fill="#30234e">Толщина и цвета контуров подложки — подсказки, не готовое оформление.</text></svg>