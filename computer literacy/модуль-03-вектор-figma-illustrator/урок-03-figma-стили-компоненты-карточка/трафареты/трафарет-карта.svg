<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="white"/><text x="45" y="55" font-family="Arial" font-size="28" fill="#30234e">Трафарет: лицевая сторона и рубашка</text><text x="45" y="85" font-family="Arial" font-size="17" fill="#30234e">Импортируй в Figma как подложку или распечатай на A4.</text><text x="65" y="140" font-family="Arial" font-size="23" fill="#30234e">Лицевая сторона</text><g transform="translate(65 175)"><rect width="288" height="408" rx="19.2" fill="none" stroke="#667085" stroke-width="2"/><rect x="19.2" y="19.2" width="249.6" height="369.6" rx="12" fill="none" stroke="#aaa" stroke-dasharray="5 4"/><path d="M144 0 V408 M0 204 H288" stroke="#ccc" stroke-dasharray="6 5"/><text x="32" y="65" font-family="Arial" font-size="36" fill="#30234e">A</text><text x="32" y="98" font-family="Arial" font-size="29" fill="#30234e">♥</text><g transform="translate(288 408) rotate(180)"><text x="32" y="65" font-family="Arial" font-size="36" fill="#30234e">A</text><text x="32" y="98" font-family="Arial" font-size="29" fill="#30234e">♥</text></g><rect x="77" y="137" width="134" height="134" fill="none" stroke="#aaa" stroke-dasharray="3 4"/></g><text x="440" y="140" font-family="Arial" font-size="23" fill="#30234e">Рубашка</text><g transform="translate(440 175)"><rect width="288" height="408" rx="19.2" fill="none" stroke="#667085" stroke-width="2"/><rect x="19.2" y="19.2" width="249.6" height="369.6" rx="12" fill="none" stroke="#aaa" stroke-dasharray="5 4"/><path d="M144 0 V408 M0 204 H288" stroke="#ccc" stroke-dasharray="6 5"/><path d="M144 110 L202 204 L144 298 L86 204 Z" fill="none" stroke="#bbb" stroke-width="2"/><circle cx="144" cy="204" r="80" fill="none" stroke="#bbb"/></g><text x="65" y="620" font-family="Arial" font-size="19" fill="#30234e">Макет увеличен в 1,2 раза. В Figma: W 240, H 340.</text><text x="65" y="655" font-family="Arial" font-size="18" fill="#30234e">Пунктир — оси и безопасные отступы. Их не экспортируем.</text><text x="65" y="705" font-family="Arial" font-size="24" fill="#30234e">Как пользоваться</text><text x="65" y="745" font-family="Arial" font-size="16" fill="#30234e">1. Перетащи SVG в файл и назови слой «Подложка».</text><text x="65" y="777" font-family="Arial" font-size="16" fill="#30234e">2. Установи ширину всей подложки 794 px; заблокируй слой.</text><text x="65" y="809" font-family="Arial" font-size="16" fill="#30234e">3. Поверх рисуй фрейм и фигуры. Размер одной карты на листе: 288 × 408.</text><text x="65" y="841" font-family="Arial" font-size="16" fill="#30234e">4. Для рабочего размера уменьшай собранную карту инструментом Scale</text><text x="65" y="873" font-family="Arial" font-size="16" fill="#30234e">   в 1,2 раза: получишь 240 × 340. Или сразу рисуй в рабочем размере рядом.</text><text x="65" y="905" font-family="Arial" font-size="16" fill="#30234e">5. Поворот нижнего индекса — 180°. Рубашка симметрична относительно центра.</text><text x="65" y="937" font-family="Arial" font-size="16" fill="#30234e">6. Перед экспортом скрой подложку, оси и вспомогательные рамки.</text></svg>