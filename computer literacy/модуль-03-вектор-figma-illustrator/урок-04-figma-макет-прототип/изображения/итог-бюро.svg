<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040"><rect x="0" y="0" width="1400" height="1040" rx="0" fill="#F0F2EE" stroke="none"/><text x="40" y="54" font-family="Segoe UI,Arial" font-size="30" fill="#223B40" font-weight="700" text-anchor="start">Бюро аномалий · готовый маршрут</text><g transform="translate(45 105)"><rect x="0" y="0" width="390" height="844" rx="18" fill="#F8F6EF" stroke="#BCCAC4"/><text x="24" y="74" font-family="Segoe UI,Arial" font-size="26" fill="#223B40" font-weight="700" text-anchor="start">БЮРО АНОМАЛИЙ</text><text x="24" y="116" font-family="Segoe UI,Arial" font-size="14" fill="#657B7C" font-weight="400" text-anchor="start">Отдел необычных происшествий</text><text x="24" y="162" font-family="Segoe UI,Arial" font-size="20" fill="#223B40" font-weight="700" text-anchor="start">Новые дела</text><rect x="24" y="188" width="342" height="72" rx="12" fill="white" stroke="#D4DED9"/><rect x="36" y="204" width="40" height="40" rx="8" fill="#E0ECE8" stroke="none"/><text x="56" y="230" font-family="Segoe UI,Arial" font-size="18" fill="#223B40" font-weight="700" text-anchor="middle">01</text><text x="88" y="218" font-family="Segoe UI,Arial" font-size="18" fill="#223B40" font-weight="700" text-anchor="start">Летающий тостер</text><text x="88" y="242" font-family="Segoe UI,Arial" font-size="14" fill="#657B7C" font-weight="400" text-anchor="start">Крыша столовой</text><rect x="24" y="272" width="342" height="72" rx="12" fill="white" stroke="#D4DED9"/><rect x="36" y="288" width="40" height="40" rx="8" fill="#E0ECE8" stroke="none"/><text x="56" y="314" font-family="Segoe UI,Arial" font-size="18" fill="#223B40" font-weight="700" text-anchor="middle">02</text><text x="88" y="302" font-family="Segoe UI,Arial" font-size="18" fill="#223B40" font-weight="700" text-anchor="start">Часы идут назад</text><text x="88" y="326" font-family="Segoe UI,Arial" font-size="14" fill="#657B7C" font-weight="400" text-anchor="start">Школьны