<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect x="0" y="0" width="1400" height="850" rx="0" fill="#F0F2EE" stroke="none"/><text x="40" y="54" font-family="Segoe UI,Arial" font-size="30" fill="#223B40" font-weight="700" text-anchor="start">Строка дела · выравнивание и режимы размеров</text><g transform="translate(70 190) scale(3)"><rect x="0" y="0" width="342" height="72" rx="12" fill="white" stroke="#D4DED9"/><rect x="12" y="16" width="40" height="40" rx="8" fill="#E0ECE8" stroke="none"/><text x="32" y="42" font-family="Segoe UI,Arial" font-size="18" fill="#223B40" font-weight="700" text-anchor="middle">01</text><text x="64" y="30" font-family="Segoe UI,Arial" font-size="18" fill="#223B40" font-weight="700" text-anchor="start">Летающий тостер</text><text x="64" y="54" font-family="Segoe UI,Arial" font-size="14" fill="#657B7C" font-weight="400" text-anchor="start">Крыша столовой</text></g><text x="70" y="485" font-family="Segoe UI,Arial" font-size="24" fill="#223B40" font-weight="400" text-anchor="start">Номер: Fixed 40 × 40</text><text x="650" y="485" font-family="Segoe UI,Arial" font-size="24" fill="#223B40" font-weight="400" text-anchor="start">Тексты: W Fill 266 · H Hug 48</text><text x="70" y="565" font-family="Segoe UI,Arial" font-size="26" fill="#223B40" font-weight="400" text-anchor="start">Строка: W Fixed 342 · H Hug 72 · padding 12 · gap 12</text><text x="70" y="635" font-family="Segoe UI,Arial" font-size="25" fill="#223B40" font-weight="400" text-anchor="start">342 − 24 − 40 − 12 = 266 px для текстового блока</text><text x="70" y="735" font-family="Segoe UI,Arial" font-size="22" fill="#657B7C" font-weight="400" text-anchor="start">Изображение увеличено ×3. Рабочие размеры подписаны в пикселях.</text></svg>