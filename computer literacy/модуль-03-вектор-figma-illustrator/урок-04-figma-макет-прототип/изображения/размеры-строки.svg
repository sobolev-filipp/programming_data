<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f0f2ee" stroke="none"/><text x="36" y="48" font-family="Segoe UI, Arial" font-size="28" fill="#223b40" font-weight="700">02 / Размеры одной строки: Fixed, Hug, Fill</text><rect x="50" y="150" width="1090" height="180" rx="12" fill="white" stroke="#b8c6c3"/><rect x="88" y="190" width="120" height="120" rx="12" fill="#e0ece8" stroke="none"/><text x="115" y="265" font-family="Segoe UI, Arial" font-size="38" fill="#223b40" font-weight="700">01</text><rect x="245" y="190" width="845" height="120" rx="12" fill="#edf4ef" stroke="#225c53"/><text x="270" y="240" font-family="Segoe UI, Arial" font-size="30" fill="#223b40" font-weight="700">Летающий тостер</text><text x="270" y="280" font-family="Segoe UI, Arial" font-size="22" fill="#657b7c">Крыша столовой</text><text x="65" y="390" font-family="Segoe UI, Arial" font-size="24" fill="#223b40">Значок: Fixed 40 × 40</text><text x="620" y="390" font-family="Segoe UI, Arial" font-size="26" fill="#223b40">Текстовый блок: Fill</text><text x="60" y="470" font-family="Segoe UI, Arial" font-size="24" fill="#223b40">Строка: Fixed 342 · padding 12 · gap 12 · высота Hug</text><text x="60" y="530" font-family="Segoe UI, Arial" font-size="25" fill="#223b40">342 − 24 − 40 − 12 = 266 px для текстового блока</text><text x="60" y="600" font-family="Segoe UI, Arial" font-size="21" fill="#657b7c">Hug у блока текста по высоте: перенос названия увеличит строку.</text></svg>