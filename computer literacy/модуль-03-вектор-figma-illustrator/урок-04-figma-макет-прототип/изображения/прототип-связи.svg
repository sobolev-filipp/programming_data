<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f0f2ee" stroke="none"/><text x="36" y="48" font-family="Segoe UI, Arial" font-size="28" fill="#223b40" font-weight="700">05 / Три взаимодействия и одно закрытие</text><text x="50" y="145" font-family="Segoe UI, Arial" font-size="28" fill="#223b40" font-weight="700">Первая строка</text><text x="420" y="145" font-family="Segoe UI, Arial" font-size="24" fill="#223b40">On click → Navigate to</text><text x="900" y="145" font-family="Segoe UI, Arial" font-size="28" fill="#223b40" font-weight="700">Досье</text><text x="50" y="265" font-family="Segoe UI, Arial" font-size="28" fill="#223b40" font-weight="700">Назад</text><text x="420" y="265" font-family="Segoe UI, Arial" font-size="24" fill="#223b40">On click → Navigate to</text><text x="900" y="265" font-family="Segoe UI, Arial" font-size="28" fill="#223b40" font-weight="700">Журнал</text><text x="50" y="385" font-family="Segoe UI, Arial" font-size="28" fill="#223b40" font-weight="700">Показать улику</text><text x="420" y="385" font-family="Segoe UI, Arial" font-size="24" fill="#223b40">On click → Open overlay</text><text x="900" y="385" font-family="Segoe UI, Arial" font-size="28" fill="#223b40" font-weight="700">Улика</text><text x="50" y="505" font-family="Segoe UI, Arial" font-size="28" fill="#223b40" font-weight="700">Закрыть</text><text x="420" y="505" font-family="Segoe UI, Arial" font-size="24" fill="#223b40">On click → Close overlay</text><text x="50" y="610" font-family="Segoe UI, Arial" font-size="22" fill="#657b7c">Начало потока — Журнал. Для первой проверки анимация Instant.</text></svg>