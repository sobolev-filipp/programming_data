<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1050" viewBox="0 0 1100 1050"><rect x="0" y="0" width="1100" height="1050" rx="0" fill="#F0F2EE" stroke="none"/><text x="40" y="50" font-family="Segoe UI,Arial" font-size="28" fill="#223B40" font-weight="700">Портал в кармане · пример самостоятельной работы</text><g transform="translate(80 105)"><rect x="0" y="0" width="390" height="844" rx="22" fill="#F8F6EF" stroke="#B5C5BF"/><text x="24" y="54" font-family="Segoe UI,Arial" font-size="12" fill="#657B7C" font-weight="700">ПУТЕВОДИТЕЛЬ МЕЖДУ МИРАМИ</text><text x="24" y="102" font-family="Segoe UI,Arial" font-size="28" fill="#223B40" font-weight="700">Куда отправимся?</text><text x="24" y="138" font-family="Segoe UI,Arial" font-size="15" fill="#657B7C">Три направления. Одно приключение.</text><rect x="24" y="180" width="342" height="96" rx="16" fill="white" stroke="#D4DED9"/><rect x="40" y="204" width="48" height="48" rx="10" fill="#E0ECE8" stroke="none"/><text x="50" y="235" font-family="Segoe UI,Arial" font-size="18" fill="#223B40" font-weight="700">01</text><text x="104" y="219" font-family="Segoe UI,Arial" font-size="19" fill="#223B40" font-weight="700">Грибной лес</text><text x="104" y="245" font-family="Segoe UI,Arial" font-size="12" fill="#657B7C">Светящиеся тропы и тихие поляны</text><rect x="24" y="292" width="342" height="96" rx="16" fill="white" stroke="#D4DED9"/><rect x="40" y="316" width="48" height="48" rx="10" fill="#E0ECE8" stroke="none"/><text x="50" y="347" font-family="Segoe UI,Arial" font-size="18" fill="#223B40" font-weight="700">02</text><text x="104" y="331" font-family="Segoe UI,Arial" font-size="19" fill="#223B40" font-weight="700">Облачный город</text><text x="104" y="357" font-family="Segoe UI,Arial" font-size="12" fill="#657B7C">Мосты над облаками</text><rect x="24" y="404" width="342" height="96" rx="16" fill="white" stroke="#D4DED9"/><rect x="40" y="428" width="48" height="48" rx="10" fill="#E0ECE8" stroke="none"/><text x="50" y="459" font-family="Segoe UI,Arial" font-size="18" fill="#223B40" font-weight="700">03</text><text x="104" y="443" font-family="Segoe UI,Arial" font-size="19" fill="#223B40" font-weight="700">Остров роботов</text><text x="104" y="469" font-family="Segoe UI,Arial" font-size="12" fill="#657B7C">Мастерские у синего моря</text><rect x="24" y="568" width="342" height="156" rx="16" fill="#E7EEEA" stroke="none"/><text x="44" y="603" font-family="Segoe UI,Arial" font-size="18" fill="#223B40" font-weight="700">Совет путешественнику</text><text x="44" y="638" font-family="Segoe UI,Arial" font-size="15" fill="#223B40">Открой первый портал, чтобы</text><text x="44" y="663" font-family="Segoe UI,Arial" font-size="15" fill="#223B40">посмотреть место прибытия.</text><text x="24" y="798" font-family="Segoe UI,Arial" font-size="12" fill="#657B7C">Учебный прототип · активен первый мир</text></g><g transform="translate(630 105)"><rect x="0" y="0" width="390" height="844" rx="22" fill="#F8F6EF" stroke="#B5C5BF"/><text x="24" y="54" font-family="Segoe UI,Arial" font-size="12" fill="#657B7C" font-weight="700">МИР 01 / ПРИБЫТИЕ</text><text x="24" y="102" font-family="Segoe UI,Arial" font-size="28" fill="#223B40" font-weight="700">Грибной лес</text><rect x="45" y="155" width="300" height="260" rx="20" fill="#DCE9E6" stroke="none"/><g transform="translate(70 200) scale(1.3)"><rect x="62" y="80" width="34" height="82" rx="10" fill="#DCC7A8"/><path d="M0 90 Q78 -40 156 90Z" fill="#52756A"/><circle cx="48" cy="58" r="8" fill="#E7EFE8"/><circle cx="94" cy="46" r="10" fill="#E7EFE8"/><circle cx="122" cy="73" r="6" fill="#E7EFE8"/></g><g transform="translate(240 300) scale(0.55)"><rect x="62" y="80" width="34" height="82" rx="10" fill="#DCC7A8"/><path d="M0 90 Q78 -40 156 90Z" fill="#52756A"/><circle cx="48" cy="58" r="8" fill="#E7EFE8"/><circle cx="94" cy="46" r="10" fill="#E7EFE8"/><circle cx="122" cy="73" r="6" fill="#E7EFE8"/></g><text x="24" y="475" font-family="Segoe UI,Arial" font-size="22" fill="#223B40" font-weight="700">Там, где светятся тропы</text><text x="24" y="516" font-family="Segoe UI,Arial" font-size="16" fill="#223B40">Тихий мир огромных грибов.</text><text x="24" y="543" font-family="Segoe UI,Arial" font-size="16" fill="#223B40">Выбирай дорогу и не спеши.</text><rect x="24" y="610" width="248" height="50" rx="12" fill="#225C53" stroke="none"/><text x="148.0" y="642" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" fill="white">Обратно к порталам</text><text x="24" y="798" font-family="Segoe UI,Arial" font-size="13" fill="#657B7C">Возврат ведёт к списку направлений.</text></g><text x="510" y="475" font-family="Segoe UI,Arial" font-size="40" fill="#223B40">→</text><text x="80" y="1010" font-family="Segoe UI,Arial" font-size="19" fill="#223B40">Вариант композиции: одинаковые поля, единая типографика, кнопка без обрезки текста.</text></svg>