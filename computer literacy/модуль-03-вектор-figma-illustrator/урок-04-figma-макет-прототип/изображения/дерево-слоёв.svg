<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f0f2ee" stroke="none"/><text x="36" y="48" font-family="Segoe UI, Arial" font-size="28" fill="#223b40" font-weight="700">04 / Вложенность: кто управляет размером</text><text x="65" y="130" font-family="Segoe UI, Arial" font-size="25" fill="#223b40" font-weight="700">Журнал — обычный фрейм 390 × 844</text><text x="100" y="205" font-family="Segoe UI, Arial" font-size="24" fill="#223b40">Контент — Auto layout вертикально</text><text x="140" y="280" font-family="Segoe UI, Arial" font-size="23" fill="#223b40">Список — Auto layout, W 342, H Hug</text><text x="180" y="355" font-family="Segoe UI, Arial" font-size="23" fill="#223b40">Дело — экземпляр компонента, W Fill</text><text x="220" y="430" font-family="Segoe UI, Arial" font-size="22" fill="#223b40">Номер — Fixed 40 × 40</text><text x="220" y="495" font-family="Segoe UI, Arial" font-size="22" fill="#223b40">Тексты — W Fill, H Hug</text><text x="650" y="430" font-family="Segoe UI, Arial" font-size="21" fill="#223b40">Название — W Fill, H Hug</text><text x="650" y="495" font-family="Segoe UI, Arial" font-size="21" fill="#223b40">Место — W Fill, H Hug</text><text x="65" y="600" font-family="Segoe UI, Arial" font-size="22" fill="#657b7c">Контейнеры выбирай в Layers. Не растягивай вложенный текст случайно.</text></svg>