<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect x="0" y="0" width="1400" height="850" rx="0" fill="#F0F2EE" stroke="none"/><text x="40" y="55" font-family="Segoe UI,Arial" font-size="25" fill="#223B40" font-weight="700">Что создаём: 3 самостоятельных фрейма, а не отдельный экран на каждую кнопку</text><rect x="40" y="110" width="400" height="360" rx="12" fill="#FFFFFF" stroke="#D4DED9"/><text x="64" y="155" font-family="Segoe UI,Arial" font-size="28" fill="#223B40" font-weight="700">1. Журнал</text><text x="64" y="190" font-family="Segoe UI,Arial" font-size="20" fill="#657B7C">390 × 844</text><text x="64" y="235" font-family="Segoe UI,Arial" font-size="18" fill="#223B40">Контент журнала</text><text x="64" y="273" font-family="Segoe UI,Arial" font-size="18" fill="#223B40">    Список</text><text x="64" y="311" font-family="Segoe UI,Arial" font-size="18" fill="#223B40">        Дело 01 ← нажимаем</text><text x="64" y="349" font-family="Segoe UI,Arial" font-size="18" fill="#223B40">        Дело 02</text><text x="64" y="387" font-family="Segoe UI,Arial" font-size="18" fill="#223B40">        Дело 03</text><rect x="500" y="110" width="400" height="360" rx="12" fill="#FFFFFF" stroke="#D4DED9"/><text x="524" y="155" font-family="Segoe UI,Arial" font-size="28" fill="#223B40" font-weight="700">2. Досье</text><text x="524" y="190" font-family="Segoe UI,Arial" font-size="20" fill="#657B7C">390 × 844</text><text x="524" y="235" font-family="Segoe UI,Arial" font-size="18" fill="#223B40">Кнопка назад ← нажимаем</text><text x="524" y="273" font-family="Segoe UI,Arial" font-size="18" fill="#223B40">Заголовок и рисунок</text><text x="524" y="311" font-family="Segoe UI,Arial" font-size="18" fill="#223B40">Описание</text><text x="524" y="349" font-family="Segoe UI,Arial" font-size="18" fill="#223B40">Кнопка улики ← нажимаем</text><rect x="960" y="110" width="400" height="360" rx="12" fill="#FFFFFF" stroke="#D4DED9"/><text x="984" y="155" font-family="Segoe UI,Arial" font-size="28" fill="#223B40" font-weight="700">3. Улика</text><text x="984" y="190" font-family="Segoe UI,Arial" font-size="20" fill="#657B7C">280 × 260</text><text x="984" y="235" font-family="Segoe UI,Arial" font-size="18" fill="#223B40">Заголовок</text><text x="984" y="273" font-family="Segoe UI,Arial" font-size="18" fill="#223B40">Сообщение</text><text x="984" y="311" font-family="Segoe UI,Arial" font-size="18" fill="#223B40">Кнопка закрытия ← нажимаем</text><text x="40" y="535" font-family="Segoe UI,Arial" font-size="23" fill="#223B40">Вложенные кнопки и списки уже существуют. В части 7 ничего заново не рисуем.</text><text x="40" y="595" font-family="Segoe UI,Arial" font-size="22" fill="#223B40">Дело 01 → Navigate to → Досье. Назад → Navigate to → Журнал.</text><text x="40" y="655" font-family="Segoe UI,Arial" font-size="22" fill="#223B40">Показать улику → Open overlay → Улика. Закрыть → Close overlay (без цели).</text><text x="40" y="730" font-family="Segoe UI,Arial" font-size="21" fill="#657B7C">Рядом лежит главный компонент «Бюро / Дело». Это шаблон, не четвёртый экран.</text></svg>