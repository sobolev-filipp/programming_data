<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f0f2ee" stroke="none"/><text x="36" y="48" font-family="Segoe UI, Arial" font-size="28" fill="#223b40" font-weight="700">01 / Кнопка: от текста к контейнеру</text><text x="50" y="115" font-family="Segoe UI, Arial" font-size="18" fill="#657b7c">ТЕКСТ</text><text x="430" y="115" font-family="Segoe UI, Arial" font-size="18" fill="#657b7c">SHIFT + A</text><text x="820" y="115" font-family="Segoe UI, Arial" font-size="18" fill="#657b7c">HUG CONTENTS</text><text x="70" y="240" font-family="Segoe UI, Arial" font-size="28" fill="#223b40">Улика</text><text x="310" y="240" font-family="Segoe UI, Arial" font-size="30" fill="#223b40">→</text><rect x="430" y="190" width="200" height="100" rx="12" fill="#225c53" stroke="none"/><text x="462" y="250" font-family="Segoe UI, Arial" font-size="28" fill="white">Улика</text><text x="448" y="179" font-family="Segoe UI, Arial" font-size="18" fill="#223b40">16</text><text x="505" y="318" font-family="Segoe UI, Arial" font-size="18" fill="#223b40">12 сверху / снизу</text><text x="720" y="240" font-family="Segoe UI, Arial" font-size="30" fill="#223b40">→</text><rect x="820" y="190" width="310" height="100" rx="12" fill="#225c53" stroke="none"/><text x="852" y="250" font-family="Segoe UI, Arial" font-size="28" fill="white">Показать улику</text><text x="50" y="420" font-family="Segoe UI, Arial" font-size="25" fill="#223b40">1. Выдели текст → Shift+A.</text><text x="50" y="475" font-family="Segoe UI, Arial" font-size="25" fill="#223b40">2. Padding: 16 слева и справа, 12 сверху и снизу.</text><text x="50" y="530" font-family="Segoe UI, Arial" font-size="25" fill="#223b40">3. Fill назначен контейнеру. Ширина и высота — Hug.</text><text x="50" y="610" font-family="Segoe UI, Arial" font-size="20" fill="#657b7c">Схема. Размер фона меняется от надписи, отступы сохраняются.</text></svg>