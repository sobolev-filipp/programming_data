<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850"><rect x="0" y="0" width="1400" height="850" rx="0" fill="#F0F2EE" stroke="none"/><text x="40" y="54" font-family="Segoe UI,Arial" font-size="30" fill="#223B40" font-weight="700" text-anchor="start">Кнопка · сначала Hug для опыта, затем ширина экрана</text><text x="50" y="126" font-family="Segoe UI,Arial" font-size="24" fill="#223B40" font-weight="700" text-anchor="start">1. Текст + Shift+A</text><rect x="50" y="160" width="120" height="46" rx="12" fill="#225C53" stroke="none"/><text x="110.0" y="189.0" font-family="Segoe UI,Arial" font-size="18" fill="white" font-weight="400" text-anchor="middle">Улика</text><text x="50" y="250" font-family="Segoe UI,Arial" font-size="21" fill="#223B40" font-weight="400" text-anchor="start">Padding: 16 по бокам, 12 сверху и снизу</text><text x="50" y="300" font-family="Segoe UI,Arial" font-size="21" fill="#223B40" font-weight="400" text-anchor="start">Hug: фон растёт от надписи</text><text x="50" y="390" font-family="Segoe UI,Arial" font-size="24" fill="#223B40" font-weight="700" text-anchor="start">2. Более длинная надпись</text><rect x="50" y="430" width="210" height="46" rx="12" fill="#225C53" stroke="none"/><text x="155.0" y="459.0" font-family="Segoe UI,Arial" font-size="18" fill="white" font-weight="400" text-anchor="middle">Показать улику</text><text x="650" y="126" font-family="Segoe UI,Arial" font-size="24" fill="#223B40" font-weight="700" text-anchor="start">3. Размещаем на экране</text><rect x="650" y="160" width="390" height="440" rx="18" fill="#F8F6EF" stroke="#BCCAC4"/><text x="674" y="220" font-family="Segoe UI,Arial" font-size="20" fill="#223B40" font-weight="400" text-anchor="start">Рабочая ширина 342 px</text><rect x="674" y="280" width="342" height="46" rx="12" fill="#225C53" stroke="none"/><text x="845.0" y="309.0" font-family="Segoe UI,Arial" font-size="18" fill="white" font-weight="400" text-anchor="middle">Показать улику</text><text x="674" y="380" font-family="Segoe UI,Arial" font-size="20" fill="#657B7C" font-weight="400" text-anchor="start">24 px слева и справа</text><text x="650" y="655" font-family="Segoe UI,Arial" font-size="23" fill="#223B40" font-weight="400" text-anchor="start">W Fixed 342 · H Hug 46 · текст по центру</text><text x="50" y="760" font-family="Segoe UI,Arial" font-size="22" fill="#657B7C" font-weight="400" text-anchor="start">У учебного образца ширина Hug. У готовой кнопки в обычном экранном фрейме — Fixed.</text></svg>