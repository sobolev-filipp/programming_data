<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect x="0" y="0" width="1200" height="700" rx="0" fill="#f0f2ee" stroke="none"/><text x="36" y="48" font-family="Segoe UI, Arial" font-size="28" fill="#223b40" font-weight="700">03 / Из одной строки собираем журнал</text><text x="35" y="115" font-family="Segoe UI, Arial" font-size="24" fill="#223b40" font-weight="700">1. Строка</text><rect x="35" y="155" width="345" height="82" rx="12" fill="white" stroke="#b8c6c3"/><rect x="47" y="167" width="40" height="40" rx="12" fill="#e0ece8" stroke="none"/><text x="51" y="195" font-family="Segoe UI, Arial" font-size="16" fill="#223b40">01</text><text x="100" y="187" font-family="Segoe UI, Arial" font-size="19" fill="#223b40">Летающий тостер</text><text x="100" y="214" font-family="Segoe UI, Arial" font-size="14" fill="#657b7c">Место происшествия</text><text x="425" y="115" font-family="Segoe UI, Arial" font-size="24" fill="#223b40" font-weight="700">2. Компонент</text><rect x="425" y="155" width="345" height="82" rx="12" fill="white" stroke="#b8c6c3"/><rect x="437" y="167" width="40" height="40" rx="12" fill="#e0ece8" stroke="none"/><text x="441" y="195" font-family="Segoe UI, Arial" font-size="16" fill="#223b40">01</text><text x="490" y="187" font-family="Segoe UI, Arial" font-size="19" fill="#223b40">Летающий тостер</text><text x="490" y="214" font-family="Segoe UI, Arial" font-size="14" fill="#657b7c">Место происшествия</text><text x="815" y="115" font-family="Segoe UI, Arial" font-size="24" fill="#223b40" font-weight="700">3. Список</text><rect x="815" y="155" width="345" height="82" rx="12" fill="white" stroke="#b8c6c3"/><rect x="827" y="167" width="40" height="40" rx="12" fill="#e0ece8" stroke="none"/><text x="831" y="195" font-family="Segoe UI, Arial" font-size="16" fill="#223b40">01</text><text x="880" y="187" font-family="Segoe UI, Arial" font-size="19" fill="#223b40">Летающий тостер</text><text x="880" y="214" font-family="Segoe UI, Arial" font-size="14" fill="#657b7c">Место происшествия</text><rect x="815" y="260" width="345" height="82" rx="12" fill="white" stroke="#b8c6c3"/><rect x="827" y="272" width="40" height="40" rx="12" fill="#e0ece8" stroke="none"/><text x="831" y="300" font-family="Segoe UI, Arial" font-size="16" fill="#223b40">02</text><text x="880" y="292" font-family="Segoe UI, Arial" font-size="19" fill="#223b40">Часы идут назад</text><text x="880" y="319" font-family="Segoe UI, Arial" font-size="14" fill="#657b7c">Место происшествия</text><rect x="815" y="365" width="345" height="82" rx="12" fill="white" stroke="#b8c6c3"/><rect x="827" y="377" width="40" height="40" rx="12" fill="#e0ece8" stroke="none"/><text x="831" y="405" font-family="Segoe UI, Arial" font-size="16" fill="#223b40">03</text><text x="880" y="397" font-family="Segoe UI, Arial" font-size="19" fill="#223b40">Дождь из конфет</text><text x="880" y="424" font-family="Segoe UI, Arial" font-size="14" fill="#657b7c">Место происшествия</text><text x="40" y="530" font-family="Segoe UI, Arial" font-size="25" fill="#223b40">Шаблон — отдельно. Экземпляры — из Assets.</text><text x="40" y="580" font-family="Segoe UI, Arial" font-size="25" fill="#223b40">Три экземпляра → Shift+A → вертикально → gap 12.</text><text x="40" y="630" font-family="Segoe UI, Arial" font-size="21" fill="#657b7c">В Layers строки вложены в Список, а не лежат рядом.</text></svg>