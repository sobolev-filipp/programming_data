<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Автолейаут и прототип</title>
<style>
  :root{
    --bg1:#4c1d95; --bg2:#f59e0b; --card:#ffffff; --ink:#1e293b;
    --accent:#7c3aed; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS=[{"q": "Что делает padding?", "a": ["Отступ от края", "Расстояние между экранами", "Длительность анимации перехода", "Число экземпляров компонента"], "c": 0, "e": "Padding — пространство между краем контейнера и содержимым."}, {"q": "Что делает gap?", "a": ["Радиус углов кнопки", "Промежуток элементов", "Размер всего файла проекта", "Название текущего компонента"], "c": 1, "e": "Gap отделяет соседей внутри Auto layout."}, {"q": "Кнопка должна расти от надписи. Какой режим?", "a": ["Fixed width", "Fill container", "Hug contents", "Ignore auto layout"], "c": 2, "e": "Hug подстраивает контейнер под содержимое и отступы."}, {"q": "Номеру дела нужен размер 40 × 40. Что выбрать?", "a": ["Размер по длине заголовка", "Растягивание до края экрана", "Автоматическую высоту текста", "Fixed"], "c": 3, "e": "Номер имеет фиксированную ширину и высоту."}, {"q": "Что отдать названию в строке шириной 342?", "a": ["Fill container", "Одинаковое число пробелов", "Поворот на 180 градусов", "Отдельный экран прототипа"], "c": 0, "e": "Остаток ширины занимает название, высота подстраивается под перенос текста."}, {"q": "Как добавить Auto layout?", "a": ["Нажать Ctrl+P для печати", "Выделить и Shift+A", "Экспортировать объекты в PNG", "Изменить только масштаб просмотра"], "c": 1, "e": "Shift+A создаёт или применяет Auto layout."}, {"q": "Что проверить, если список не сдвигается?", "a": ["Цвет фона приложения", "Имя папки экспорта файлов", "Вложенность строки", "Положение курсора на холсте"], "c": 2, "e": "Строка должна участвовать в Auto layout списка."}, {"q": "Как открыть досье вместо журнала?", "a": ["Создать ещё один стиль цвета", "Сохранить экспортированный PNG", "Нарисовать стрелку пером", "Navigate to"], "c": 3, "e": "Navigate to переводит на другой экран."}, {"q": "Где проверяют кликабельный прототип?", "a": ["В Present", "В экспортированном PNG-файле", "В названии папки с рисунками", "В списке установленных шрифтов"], "c": 0, "e": "PNG сохраняет вид, просмотр прототипа — взаимодействия."}, {"q": "Как закрыть всплывающее окно?", "a": ["Поменять имя рамки окна", "Close overlay", "Создать ещё один текстовый слой", "Сохранить локальную копию файла"], "c": 1, "e": "Закрытие возвращает к экрану под оверлеем."}, {"q": "Тостер добавил слова в кнопку. Фон вырос. Кто помог?", "a": ["Поворот букв надписи", "Цвет обводки контейнера", "Hug contents", "Экспорт всей страницы"], "c": 2, "e": "Hug учитывает размер содержимого и внутренние отступы."}, {"q": "Новое дело влезло поверх соседей. Что проверить?", "a": ["Название самого файла", "Размер окна просмотра", "Цвет номера происшествия", "Вложенность в список"], "c": 3, "e": "Строка должна быть внутри Auto layout и участвовать в потоке."}, {"q": "Агент ждёт, что тостер вылетит из экрана. Что объяснить?", "a": ["Это учебный прототип", "Нужно подключить второй монитор", "Надо поменять шрифт интерфейса", "Кнопка слишком маленького размера"], "c": 0, "e": "Прототип показывает нажатия и переходы, не управляет настоящими предметами."}, {"q": "Кликается весь фон вместо строки дела. Что проверить?", "a": ["Название первого делоа", "Источник связи", "Толщину внешней рамки кнопки", "Размер экспортированного файла"], "c": 1, "e": "Интеракция могла оказаться на экранном фрейме."}, {"q": "Улика заменила весь экран. Что нужно выбрать?", "a": ["Экспортировать другой формат", "Изменить масштаб холста", "Open overlay", "Удалить главный компонент"], "c": 2, "e": "Open overlay открывает окно поверх текущего экрана."}, {"q": "Есть два красивых PNG. Достаточно для проверки переходов?", "a": ["Да, если они одного размера", "Да, если цвета совпадают", "Да, если названия разные", "Нет, нужен прототип"], "c": 3, "e": "Статичные изображения не содержат интерактивных связей."}];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>Автолейаут и прототип</h1>
    <div class="sub">Викторина по уроку «Бюро аномалий»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ if(!locked) return; i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Автолейаут и прототип — под контролем! 🃏';}
  else if(pct>=70){em='🎉';msg='Отлично! Автолейаут, размеры и переходы — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: проверь размеры контейнеров и цели переходов.';}
  else {em='💪';msg='Начало есть! Повтори размеры и связи прототипа.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
