<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Автолейаут и прототип</title>
<style>
  :root{
    --bg1:#0f172a; --bg2:#06b6d4; --card:#ffffff; --ink:#1e293b;
    --accent:#0891b2; --ok:#16a34a; --bad:#dc2626; --soft:#cffafe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что делает Автолейаут?",
   a:["Красит фон","Сам расставляет элементы с равными отступами","Экспортирует PNG","Рисует пером"],c:1,
   e:"Автолейаут держит направление, промежутки (gap) и отступы (padding) автоматически."},
  {q:"Как включить автолейаут для выделенных элементов?",
   a:["Ctrl+S","Shift+A (или блок Auto layout → +)","Двойной клик","Удалить"],c:1,
   e:"Shift+A оборачивает выделение в авто-контейнер."},
  {q:"Что означает размер «Hug» (по содержимому)?",
   a:["Растянуть на весь экран","Сжаться под контент (кнопка по тексту)","Зафиксировать 100px","Спрятать"],c:1,
   e:"Hug: контейнер подстраивается под содержимое — кнопка растёт под текст."},
  {q:"Как сделать распор «название слева — время справа» в строке?",
   a:["Пробелами","Дать названию ширину Fill (заполнить)","Уменьшить время","Вручную двигать"],c:1,
   e:"Fill раздвигает строку, и время прижимается к правому краю."},
  {q:"Из чего лучше собирать список треков?",
   a:["Копий-групп","Строки-компонента в вертикальном автолейауте","Одной картинки","Текста в столбик"],c:1,
   e:"Компонент-строка + автолейаут = ровный живой список, легко править."},
  {q:"Чем является каждый экран приложения в Figma?",
   a:["Слоем","Отдельным фреймом (Frame)","Компонентом","Стилем"],c:1,
   e:"Экран = фрейм; иначе прототип не свяжет экраны."},
  {q:"Где создают связи между экранами?",
   a:["Во вкладке Design","Во вкладке Prototype (тянуть синюю стрелку)","В экспорте","В слоях"],c:1,
   e:"Prototype → от элемента тянешь стрелку к нужному экрану."},
  {q:"Какое взаимодействие открывает плеер по нажатию на трек?",
   a:["On hover → Scroll","On tap → Navigate to (перейти к экрану)","On drag → Close","Ничего"],c:1,
   e:"«По тапу → перейти к» — базовая связь переходов."},
  {q:"Как проверить, что прототип работает?",
   a:["Сохранить","Нажать ▶ (Play) — режим просмотра","Экспорт SVG","Перезагрузить"],c:1,
   e:"Play открывает интерактивный просмотр — кликаешь по экранам."},
  {q:"Как дать другу потыкать приложение без установки?",
   a:["Отправить .fig","Share → ссылка на прототип (в браузере)","Прислать PNG","Никак"],c:1,
   e:"Ссылка открывает живой прототип прямо в браузере."},

  {q:"😄 Отступы в списке разъехались, правил линейкой полчаса. Как надо?",
   a:["Ещё линейку","Автолейаут — держит отступы сам","Больше пробелов","Забить"],c:1,
   e:"Shift+A — и промежутки ровные автоматически."},
  {q:"😄 Нажал Play, а прототип пустой/не переходит. Частая причина?",
   a:["Слабый ПК","Нет связи или экран не фрейм","Мало цветов","Не тот шрифт"],c:1,
   e:"Проверь: экраны — фреймы, связь тянули во вкладке Prototype."},
  {q:"😄 Кнопку рисовал как фон + текст и подгонял фон вручную. Проще?",
   a:["Так и норм","Автолейаут с padding — фон сам по тексту (Hug)","Больше кнопок","Убрать текст"],c:1,
   e:"Hug + padding = кнопка всегда точно по надписи."},

  {q:"🤔 Зачем дизайнеры делают кликабельный прототип ДО программистов?",
   a:["Для красоты","Чтобы проверить удобство и показать идею, ничего не программируя","Так требует Figma","Чтобы дольше"],c:1,
   e:"Прототип дёшево проверяет, удобно ли, и продаёт идею заказчику."},
  {q:"🤔 Почему список делают автолейаутом, а не расставляют вручную?",
   a:["Мода","Добавил/убрал элемент — всё само сдвинулось и осталось ровным","Быстрее грузит","Ярче"],c:1,
   e:"Живой список сам держит порядок при любых изменениях."},
  {q:"🤔 Что даёт Smart Animate между двумя экранами?",
   a:["Ничего","Плавно превращает одинаковые элементы (обложка «вырастает»)","Меняет цвет","Удаляет экран"],c:1,
   e:"Одинаковые слои плавно анимируются между экранами — «кино»-переход почти без усилий."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>📱 Автолейаут и прототип</h1>
    <div class="sub">Викторина по уроку «Экран приложения»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты собрал приложение — дизайнер интерфейсов! 📱';}
  else if(pct>=70){em='🎉';msg='Отлично! Автолейаут и прототип — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: Shift+A, Hug/Fill, Prototype → Navigate to.';}
  else {em='💪';msg='Начало есть! Перечитай про автолейаут и связи прототипа.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
