<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Comfortaa','Nunito',sans-serif">
  <rect width="900" height="420" rx="22" fill="#FFF8EE"/>
  <text x="450" y="44" text-anchor="middle" font-size="23" font-weight="700" fill="#2A2140">Два движения пера</text>

  <!-- LEFT: click = angle -->
  <g>
    <rect x="40" y="78" width="380" height="300" rx="18" fill="#ffffff" stroke="#EADFCE" stroke-width="2"/>
    <text x="230" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#7C5CFF">Клик — острый угол</text>
    <!-- zigzag -->
    <polyline points="80,300 150,180 220,300 290,180 360,300" fill="none" stroke="#2A2140" stroke-width="5" stroke-linejoin="round"/>
    <!-- anchor squares -->
    <g fill="#ffffff" stroke="#2F6BFF" stroke-width="4">
      <rect x="72" y="292" width="16" height="16" rx="2"/>
      <rect x="142" y="172" width="16" height="16" rx="2"/>
      <rect x="212" y="292" width="16" height="16" rx="2"/>
      <rect x="282" y="172" width="16" height="16" rx="2"/>
      <rect x="352" y="292" width="16" height="16" rx="2"/>
    </g>
    <text x="230" y="350" text-anchor="middle" font-size="15" fill="#8A8398">просто кликаешь — линии прямые</text>
  </g>

  <!-- RIGHT: drag = curve -->
  <g>
    <rect x="480" y="78" width="380" height="300" rx="18" fill="#ffffff" stroke="#EADFCE" stroke-width="2"/>
    <text x="670" y="112" text-anchor="middle" font-size="18" font-weight="700" fill="#12B8A6">Клик и протяжка — кривая</text>
    <!-- wave: up-bump then down-bump through 3 points -->
    <path d="M 520 240 C 560 180, 610 180, 650 240 C 690 300, 740 300, 780 240" fill="none" stroke="#2A2140" stroke-width="5"/>
    <!-- handles (усы) on middle point, horizontal tangent -->
    <line x1="650" y1="240" x2="595" y2="240" stroke="#12B8A6" stroke-width="3"/>
    <line x1="650" y1="240" x2="705" y2="240" stroke="#12B8A6" stroke-width="3"/>
    <circle cx="595" cy="240" r="7" fill="#12B8A6"/>
    <circle cx="705" cy="240" r="7" fill="#12B8A6"/>
    <!-- anchor squares -->
    <g fill="#ffffff" stroke="#2F6BFF" stroke-width="4">
      <rect x="512" y="232" width="16" height="16" rx="2"/>
      <rect x="642" y="232" width="16" height="16" rx="2"/>
      <rect x="772" y="232" width="16" height="16" rx="2"/>
    </g>
    <text x="630" y="190" font-size="14" fill="#12B8A6" font-weight="700">усы</text>
    <text x="670" y="350" text-anchor="middle" font-size="15" fill="#8A8398">тянешь ус — линия выгибается дугой</text>
  </g>
</svg>
