<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Перо и логотип</title>
<style>
  :root{
    --bg1:#0f766e; --bg2:#f59e0b; --card:#ffffff; --ink:#1e293b;
    --accent:#0d9488; --ok:#16a34a; --bad:#dc2626; --soft:#ccfbf1;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Как пером поставить острый угол (прямой отрезок)?",
   a:["Просто кликнуть","Кликнуть и, не отпуская, потянуть в сторону","Дважды кликнуть по фону","Зажать Shift навсегда"],c:0,
   e:"Клик — острый угол. Протяжка нужна для кривых."},
  {q:"Как пером нарисовать плавную кривую?",
   a:["Клик и, не отпуская, потянуть — появятся усы","Поставить очень много коротких кликов подряд близко","Стереть ластиком","Скруглением углов"],c:0,
   e:"Клик с протяжкой вытягивает направляющие (усы) — отрезок выгибается дугой."},
  {q:"Что такое «усы» (направляющие) у точки?",
   a:["Рычаги, которые задают крутизну изгиба","Просто украшение, на форму линии они никак не влияют","Название слоя в панели","Цвет обводки"],c:0,
   e:"Длиннее ус — круче дуга, короче — мягче поворот."},
  {q:"Как замкнуть контур?",
   a:["Кликнуть по самой первой точке","Нажать Delete и начать рисовать всё заново","Сохранить файл","Выделить всё"],c:0,
   e:"Клик по стартовой точке замыкает фигуру. Затем Enter."},
  {q:"Сколько точек нужно для плавной дуги?",
   a:["Мало точек, зато с длинными усами","Чем больше точек наставишь, тем глаже выйдет","Ровно десять","По одной на пиксель"],c:0,
   e:"Плавность дают усы, а не количество точек. Дуга — это 2 точки."},
  {q:"Как выйти из режима рисования пером?",
   a:["Нажать Enter или Esc","Закрыть и снова открыть весь файл Figma","Нажать Ctrl+Z","Кликнуть сто раз"],c:0,
   e:"Enter или Esc завершают контур."},
  {q:"Что делает «Пересечение» (Intersect) с горами и кругом?",
   a:["Оставляет только общую часть","Сваривает их в одну большую бесформенную фигуру","Удаляет круг совсем","Красит обе фигуры"],c:0,
   e:"Intersect оставляет пересечение — рисунок ровно внутри бейджа."},
  {q:"Угол уже стоит, а нужна плавная кривая. Что сделать?",
   a:["Потянуть точку инструментом «Изгиб»","Стереть весь контур и аккуратно нарисовать заново","Добавить ещё десять точек","Сменить цвет"],c:0,
   e:"«Изгиб» превращает угловую точку в гладкую — появляются усы."},
  {q:"Почему у линии-реки обводка, а не заливка?",
   a:["Это открытая линия — у неё штрих, а не тело","Просто так ярче смотрится на тёмном фоне бейджа","Заливки вообще не бывает","Получилось случайно"],c:0,
   e:"Открытый контур показывают обводкой: толщина, скруглённые концы."},
  {q:"Как проверить, что логотип хороший?",
   a:["Уменьшить до аватарки — читается ли","Сделать его как можно больше и ярче по цвету","Добавить побольше деталей","Взять больше цветов"],c:0,
   e:"Настоящий логотип узнаётся и маленьким, и в один цвет."},

  {q:"😄 Ученик поставил 25 точек на простую дугу. Совет?",
   a:["Убрать лишние: дуга — это две точки с усами","Добавить ещё столько же, чтобы стало совсем гладко","Так надёжнее, пусть оставит","Ничего, всё хорошо"],c:0,
   e:"Лишние точки — кривая «пилит». Меньше точек — чище линия."},
  {q:"😄 Пик горы вышел круглым «холмиком». В чём дело?",
   a:["Точку поставили протяжкой, а для угла нужен клик","Экран слишком маленький, на большом будет остро","Не хватило цвета","Забыли обводку"],c:0,
   e:"Острый угол — это клик без протяжки."},
  {q:"😄 «Линия сама тянется за мышкой, я в панике!»",
   a:["Это «резинка» пера, точка ставится по клику","Это серьёзная поломка, надо перезагрузить компьютер","Надо удалить перо","Так теперь будет всегда"],c:0,
   e:"До клика линия просто следует за курсором — это нормально."},

  {q:"🤔 Почему логотип рисуют пером, а не берут готовую картинку?",
   a:["Вектор правится по точкам и чёткий на любом размере","Готовые картинки всегда платные, их запрещено использовать","Пером всегда быстрее","Перо даёт ярче цвет"],c:0,
   e:"Свой вектор-знак чёткий на любом размере и полностью редактируемый."},
  {q:"🤔 Зачем делать одноцветную версию логотипа?",
   a:["Чтобы работал в печати и гравировке — в один цвет","Просто для красоты, на практике это нигде не нужно","Чтобы файл весил меньше","Это вовсе не нужно"],c:0,
   e:"Сильный логотип читается силуэтом, а не только в цвете."},
  {q:"🤔 Почему в знаках ценят простоту (мало деталей)?",
   a:["Простой силуэт узнаётся мгновенно и не слипается","Сложные рисунки вообще запрещено делать в логотипах","Так просто дешевле рисовать","Авторам было лень"],c:0,
   e:"Простые формы читаются за долю секунды и не слипаются на мелком размере."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>Перо и логотип</h1>
    <div class="sub">Викторина по уроку «Логотип-знак»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Перо тебя слушается — рисуй любой логотип! ⛰️';}
  else if(pct>=70){em='🎉';msg='Отлично! Точки, кривые Безье и логотип — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: клик — угол, клик-потяни — кривая, мало точек.';}
  else {em='💪';msg='Начало есть! Перечитай про опорные точки и усы, поиграй в The Bézier Game.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
