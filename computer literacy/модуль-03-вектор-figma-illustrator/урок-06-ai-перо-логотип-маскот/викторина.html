<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Перо и симметрия: маскот</title>
<style>
  :root{
    --bg1:#c2410c; --bg2:#f59e0b; --card:#ffffff; --ink:#1e293b;
    --accent:#ea580c; --ok:#16a34a; --bad:#dc2626; --soft:#ffedd5;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Как проще всего сделать ровный симметричный логотип?",
   a:["Рисовать обе стороны руками","Нарисовать половину и отразить","Скопировать чужой","Взять фото"],c:1,
   e:"Половина + Отражение = идеальная симметрия и быстро."},
  {q:"Что нажать в окне «Отражение», чтобы появилась вторая половина?",
   a:["ОК","Копировать","Отмена","Удалить"],c:1,
   e:"«Копировать» создаёт зеркальную копию; «ОК» просто перевернёт оригинал."},
  {q:"Что склеивает две половинки в один силуэт (без шва)?",
   a:["Разделение","Соединение (Обработка контуров)","Минус верхний","Группа"],c:1,
   e:"«Соединение» (Unite) сваривает половины в цельную фигуру."},
  {q:"Что делает инструмент «Опорная точка» (Shift+C)?",
   a:["Красит","Превращает угол в кривую и наоборот","Удаляет объект","Экспортирует"],c:1,
   e:"Потянул — угол стал плавным; кликнул по гладкой — стала острой."},
  {q:"Как Пером сделать острый кончик уха?",
   a:["Клик-и-протяжка","Просто клик (без протяжки)","Двойной клик фон","Обводкой"],c:1,
   e:"Острый угол = клик. Протяжка даёт дугу (для щеки)."},
  {q:"Зачем нужна вертикальная направляющая по центру?",
   a:["Для красоты","Это ось симметрии — вокруг неё отражаем","Чтобы резать","Для текста"],c:1,
   e:"Точки на оси кладут на направляющую, по ней и зеркалят."},
  {q:"Что рисуем ОДИН раз и не отражаем?",
   a:["Ухо","То, что лежит на оси (нос, макушка)","Глаз","Щёку"],c:1,
   e:"На оси — рисуем один раз; боковое (ухо, глаз) — отражаем."},
  {q:"Как проверить, что логотип удачный?",
   a:["Сделать огромным","Уменьшить до аватарки — узнаётся ли","Добавить деталей","Больше цветов"],c:1,
   e:"Хороший знак читается и маленьким, и в один цвет."},
  {q:"Чем «Прямое выделение» (A) полезно на этом уроке?",
   a:["Красит заливку","Двигает отдельные точки контура","Экспортирует","Создаёт текст"],c:1,
   e:"Белой стрелкой (A) подвигаешь узлы, чтобы поправить форму."},
  {q:"Какую обводку дать маскоту для «мультяшного» вида?",
   a:["Тонкую пунктирную","Толстую тёмную со скруглёнными углами","Никакую","Радужную"],c:1,
   e:"Плотный тёмный контур делает маскот выразительным."},

  {q:"😄 Отразил, а вместо копии оригинал просто перевернулся. Что нажал зря?",
   a:["Копировать","ОК (вместо «Копировать»)","Отмена","Enter"],c:1,
   e:"Нужно было «Копировать». Отмени и повтори."},
  {q:"😄 По центру мордочки видно «шов». Чем убрать?",
   a:["Стереть ластиком","Соединением склеить половинки","Перекрасить","Увеличить"],c:1,
   e:"«Соединение» сольёт половины в один силуэт без шва."},
  {q:"😄 Левое ухо не такое, как правое — рисовал отдельно. Как надо?",
   a:["Дорисовать на глаз","Рисовать одно и отражать","Уменьшить оба","Стереть"],c:1,
   e:"Симметричные детали делают отражением, а не руками."},

  {q:"🤔 Почему профи рисуют половину, а не обе стороны сразу?",
   a:["Лень","Рука не повторит форму точно — отражение даёт идеальную симметрию","Так дороже","Перо запрещает"],c:1,
   e:"Зеркало гарантирует, что стороны совпадут пиксель в пиксель."},
  {q:"🤔 Зачем логотипу одноцветная версия?",
   a:["Для красоты","Чтобы работал в печати/гравировке одним цветом","Меньше весит","Незачем"],c:1,
   e:"Сильный знак читается силуэтом, а не только в цвете."},
  {q:"🤔 Что такое «негативное пространство» в логотипе?",
   a:["Пустой файл","Деталь, «спрятанная» в вырезе/фоне","Тёмный фон","Ошибка"],c:1,
   e:"Умный приём: например, улыбка или ухо образованы вырезом — смотрится дорого."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🦊 Перо и симметрия</h1>
    <div class="sub">Викторина по уроку «Лого-маскот»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Симметрия и перо — твои! Рисуй любой маскот 🦊';}
  else if(pct>=70){em='🎉';msg='Отлично! Отражение, перо и Соединение — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: половина → Отражение → «Копировать» → Соединение.';}
  else {em='💪';msg='Начало есть! Перечитай про Отражение и «Опорную точку».';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
