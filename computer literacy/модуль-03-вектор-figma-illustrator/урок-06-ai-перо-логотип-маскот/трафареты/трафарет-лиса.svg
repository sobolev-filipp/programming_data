<svg viewBox="0 0 794 1123" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#F97316"/></marker>
  </defs>
  <rect width="794" height="1123" fill="#ffffff"/>
  <text x="60" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#1E293B">🦊 Трафарет: лого-лиса</text>
  <text x="60" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748B">Обводи пером по буквам A→B→…→J и замкни в A. ▪ квадрат — клик (угол) · оранжевая стрелка — потяни ус (кривая-щека).</text>
  <line x1="60" y1="104" x2="734" y2="104" stroke="#E2E8F0" stroke-width="2"/>

  <!-- ===== ПОЛНАЯ МОРДОЧКА С ПОДСКАЗКАМИ ===== -->
  <text x="60" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#E8703A">Образец — обведи по точкам</text>
  <g transform="translate(150,60) scale(1.4)">
    <!-- outline -->
    <path d="M210,150 L285,80 L250,168 C285,200 300,220 300,250 C300,290 275,305 255,320 L210,352 L165,320 C145,305 120,290 120,250 C120,220 135,200 170,168 L135,80 Z"
          fill="#FFF6EF" stroke="#B8845F" stroke-width="1.3" stroke-dasharray="4 4"/>
    <!-- handle arrows on curves -->
    <g stroke="#F97316" stroke-width="1.4" marker-end="url(#ah)">
      <line x1="300" y1="252" x2="300" y2="214"/>
      <line x1="120" y1="252" x2="120" y2="214"/>
      <line x1="255" y1="322" x2="290" y2="303"/>
      <line x1="165" y1="322" x2="130" y2="303"/>
    </g>
    <!-- anchor squares -->
    <g fill="#ffffff" stroke="#475569" stroke-width="1.1">
      <rect x="282" y="77" width="6" height="6"/><rect x="247" y="165" width="6" height="6"/>
      <rect x="297" y="247" width="6" height="6"/><rect x="252" y="317" width="6" height="6"/>
      <rect x="207" y="349" width="6" height="6"/><rect x="162" y="317" width="6" height="6"/>
      <rect x="117" y="247" width="6" height="6"/><rect x="167" y="165" width="6" height="6"/>
      <rect x="132" y="77" width="6" height="6"/>
    </g>
    <!-- start (A) -->
    <rect x="206" y="146" width="8" height="8" fill="#2563EB"/>
    <!-- labels -->
    <g font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#334155">
      <text x="214" y="144" fill="#2563EB">A · старт</text>
      <text x="292" y="74">B</text><text x="256" y="162">C</text><text x="308" y="252">D</text>
      <text x="260" y="334">E</text><text x="205" y="372">F</text><text x="150" y="334">G</text>
      <text x="100" y="252">H</text><text x="150" y="162">I</text><text x="118" y="74">J</text>
    </g>
  </g>

  <!-- ===== СПОСОБ СИММЕТРИИ (половина + ось) ===== -->
  <line x1="60" y1="640" x2="734" y2="640" stroke="#E2E8F0" stroke-width="2"/>
  <text x="60" y="676" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E">Быстрый способ — нарисуй ПОЛОВИНУ</text>
  <text x="60" y="702" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#64748B">Обведи только правую половину (A→B→C→D→E→F). Затем: «Отражение» (O) → клик по оси с Alt → «Копировать» → «Соединение».</text>
  <g transform="translate(70,720) scale(1.15)">
    <!-- axis -->
    <line x1="210" y1="55" x2="210" y2="375" stroke="#EC4899" stroke-width="1.2" stroke-dasharray="6 6"/>
    <text x="196" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#EC4899">ось</text>
    <!-- half outline -->
    <path d="M210,150 L285,80 L250,168 C285,200 300,220 300,250 C300,290 275,305 255,320 L210,352"
          fill="none" stroke="#B8845F" stroke-width="1.3" stroke-dasharray="4 4"/>
    <g fill="#ffffff" stroke="#475569" stroke-width="1.1">
      <rect x="282" y="77" width="6" height="6"/><rect x="247" y="165" width="6" height="6"/>
      <rect x="297" y="247" width="6" height="6"/><rect x="252" y="317" width="6" height="6"/>
    </g>
    <rect x="206" y="146" width="8" height="8" fill="#2563EB"/>
    <rect x="206" y="348" width="8" height="8" fill="#DC2626"/>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#334155">
      <text x="216" y="144" fill="#2563EB">A</text><text x="292" y="74">B</text><text x="256" y="162">C</text>
      <text x="308" y="252">D</text><text x="260" y="334">E</text><text x="214" y="360" fill="#DC2626">F</text>
    </g>
    <!-- ghost mirror hint -->
    <path d="M210,150 L135,80 L170,168 C115,200 120,220 120,250 C120,290 145,305 165,320 L210,352"
          fill="none" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="3 6"/>
    <text x="120" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#CBD5E1">← тут появится зеркало</text>
  </g>
</svg>
