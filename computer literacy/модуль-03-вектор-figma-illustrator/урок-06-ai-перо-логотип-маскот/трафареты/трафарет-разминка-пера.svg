<svg viewBox="0 0 794 1123" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#F97316"/></marker>
  </defs>
  <rect width="794" height="1123" fill="#ffffff"/>
  <!-- header -->
  <text x="60" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#1E293B">✒️ Трафарет: разминка пера</text>
  <text x="60" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748B">Обведи «Образец» по точкам, потом повтори в «Практике». ▪ квадрат — опорная точка. Клик = угол · Клик-и-потяни (оранжевая стрелка) = кривая.</text>
  <line x1="60" y1="108" x2="734" y2="108" stroke="#E2E8F0" stroke-width="2"/>

  <!-- ===== 1. ЗУБЦЫ (углы) ===== -->
  <text x="60" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E">1 · Зубцы — только КЛИК (острые углы)</text>
  <!-- образец -->
  <polyline points="100,240 190,180 280,240 370,180 460,240 550,180 640,240" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="#ffffff" stroke="#475569" stroke-width="1.6">
    <rect x="186" y="176" width="8" height="8"/><rect x="276" y="236" width="8" height="8"/><rect x="366" y="176" width="8" height="8"/><rect x="456" y="236" width="8" height="8"/><rect x="546" y="176" width="8" height="8"/>
  </g>
  <rect x="96" y="236" width="9" height="9" fill="#2563EB"/><text x="90" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2563EB">старт</text>
  <circle cx="640" cy="240" r="5" fill="#DC2626"/><text x="628" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DC2626">финиш</text>
  <!-- практика -->
  <text x="100" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-style="italic" fill="#94A3B8">Практика:</text>
  <polyline points="100,360 190,300 280,360 370,300 460,360 550,300 640,360" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="3 6"/>
  <rect x="96" y="356" width="9" height="9" fill="#93C5FD"/><circle cx="640" cy="360" r="5" fill="#FCA5A5"/>

  <!-- ===== 2. ГОРКИ (кривые вверх) ===== -->
  <text x="60" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E">2 · Горки — КЛИК-и-ПОТЯНИ вверх (кривые)</text>
  <!-- образец -->
  <path d="M100,520 A45,45 0 0,1 190,520 A45,45 0 0,1 280,520 A45,45 0 0,1 370,520 A45,45 0 0,1 460,520 A45,45 0 0,1 550,520 A45,45 0 0,1 640,520" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="#ffffff" stroke="#475569" stroke-width="1.6">
    <rect x="186" y="516" width="8" height="8"/><rect x="276" y="516" width="8" height="8"/><rect x="366" y="516" width="8" height="8"/><rect x="456" y="516" width="8" height="8"/><rect x="546" y="516" width="8" height="8"/>
  </g>
  <g stroke="#F97316" stroke-width="2" marker-end="url(#ah)">
    <line x1="145" y1="520" x2="145" y2="482"/><line x1="235" y1="520" x2="235" y2="482"/><line x1="325" y1="520" x2="325" y2="482"/><line x1="415" y1="520" x2="415" y2="482"/><line x1="505" y1="520" x2="505" y2="482"/><line x1="595" y1="520" x2="595" y2="482"/>
  </g>
  <rect x="96" y="516" width="9" height="9" fill="#2563EB"/><circle cx="640" cy="520" r="5" fill="#DC2626"/>
  <!-- практика -->
  <text x="100" y="590" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-style="italic" fill="#94A3B8">Практика:</text>
  <path d="M100,650 A45,45 0 0,1 190,650 A45,45 0 0,1 280,650 A45,45 0 0,1 370,650 A45,45 0 0,1 460,650 A45,45 0 0,1 550,650 A45,45 0 0,1 640,650" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="3 6"/>
  <rect x="96" y="646" width="9" height="9" fill="#93C5FD"/><circle cx="640" cy="650" r="5" fill="#FCA5A5"/>

  <!-- ===== 3. ВОЛНА (S-кривые) ===== -->
  <text x="60" y="752" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E">3 · Волна — тяни усы в стороны (S-кривая)</text>
  <!-- образец -->
  <path d="M100,820 C145,775 190,865 235,820 C280,775 325,865 370,820 C415,775 460,865 505,820 C550,775 595,865 640,820" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 5"/>
  <g fill="#ffffff" stroke="#475569" stroke-width="1.6">
    <rect x="231" y="816" width="8" height="8"/><rect x="366" y="816" width="8" height="8"/><rect x="501" y="816" width="8" height="8"/>
  </g>
  <g stroke="#F97316" stroke-width="2" marker-end="url(#ah)">
    <line x1="235" y1="820" x2="285" y2="820"/><line x1="370" y1="820" x2="420" y2="820"/><line x1="505" y1="820" x2="555" y2="820"/>
  </g>
  <rect x="96" y="816" width="9" height="9" fill="#2563EB"/><circle cx="640" cy="820" r="5" fill="#DC2626"/>
  <!-- практика -->
  <text x="100" y="890" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-style="italic" fill="#94A3B8">Практика:</text>
  <path d="M100,950 C145,905 190,995 235,950 C280,905 325,995 370,950 C415,905 460,995 505,950 C550,905 595,995 640,950" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="3 6"/>
  <rect x="96" y="946" width="9" height="9" fill="#93C5FD"/><circle cx="640" cy="950" r="5" fill="#FCA5A5"/>

  <!-- legend -->
  <line x1="60" y1="1030" x2="734" y2="1030" stroke="#E2E8F0" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">
    <rect x="60" y="1052" width="10" height="10" fill="#fff" stroke="#475569" stroke-width="1.6"/><text x="78" y="1062">опорная точка (клик)</text>
    <line x1="250" y1="1057" x2="285" y2="1057" stroke="#F97316" stroke-width="2" marker-end="url(#ah)"/><text x="293" y="1062">потяни ус (кривая)</text>
    <rect x="470" y="1052" width="10" height="10" fill="#2563EB"/><text x="488" y="1062">старт</text>
    <circle cx="575" cy="1057" r="5" fill="#DC2626"/><text x="588" y="1062">финиш</text>
  </g>
</svg>
