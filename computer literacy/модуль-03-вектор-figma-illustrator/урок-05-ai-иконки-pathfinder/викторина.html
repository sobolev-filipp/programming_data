<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Illustrator и Обработка контуров</title>
<style>
  :root{
    --bg1:#ea580c; --bg2:#ec4899; --card:#ffffff; --ink:#1e293b;
    --accent:#e11d48; --ok:#16a34a; --bad:#dc2626; --soft:#ffe4e6;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Какая операция ВЫРЕЗАЕТ дырку (кольцо доната)?",
   a:["Соединение","Минус верхний","Пересечение","Разделение"],c:1,
   e:"«Минус верхний» — верхняя фигура прорезает нижнюю. Так делают дырки и кольца."},
  {q:"Какая операция СКЛЕИВАЕТ фигуры в один силуэт (чашка+ручка)?",
   a:["Разделение","Соединение","Минус верхний","Пересечение"],c:1,
   e:"«Соединение» (Unite) сваривает фигуры в одну."},
  {q:"Какая операция оставляет только ОБЩУЮ часть (долька арбуза)?",
   a:["Соединение","Пересечение","Разделение","Исключение"],c:1,
   e:"«Пересечение» (Intersect) оставляет зону, где фигуры перекрываются."},
  {q:"Какая операция РЕЖЕТ фигуру линиями на части (полосы мороженого)?",
   a:["Соединение","Разделение","Минус верхний","Пересечение"],c:1,
   e:"«Разделение» (Divide) режет фигуру всеми пересечениями на отдельные куски."},
  {q:"Где в Illustrator панель этих операций?",
   a:["Файл → Экспорт","Окно → Обработка контуров","Правка → Копировать","Слои"],c:1,
   e:"«Обработка контуров» (Pathfinder), Shift+Ctrl+F9. В старых уроках её зря зовут «Навигатором»."},
  {q:"Что сделать СРАЗУ после «Разделения», чтобы красить куски?",
   a:["Сохранить","Разгруппировать (Shift+Ctrl+G)","Экспорт","Соединить"],c:1,
   e:"После Divide части сгруппированы — разгруппируй, потом заливай каждую."},
  {q:"От чего зависит результат «Минус верхний» и «Пересечение»?",
   a:["От цвета","От порядка фигур (кто сверху)","От размера холста","От имени файла"],c:1,
   e:"Режет/оставляет по верхней фигуре — следи за порядком в «Слоях»."},
  {q:"Как задать документ для иконок правильно?",
   a:["CMYK, сантиметры","RGB, пиксели","Оттенки серого","Любой"],c:1,
   e:"Для экрана — профиль RGB и единицы «пиксели»."},
  {q:"Чем «Выделение» (V) отличается от «Прямого выделения» (A)?",
   a:["Ничем","V двигает объект целиком, A тянет отдельные точки","A крупнее","V только для текста"],c:1,
   e:"Чёрная стрелка (V) — весь объект; белая (A) — узлы/точки."},
  {q:"Что делает набор иконок «набором», а не мешаниной?",
   a:["Разный размер","Единый размер + одна палитра","Побольше деталей","Разные обводки"],c:1,
   e:"Одинаковый размер (например, 256) и общая палитра связывают иконки."},

  {q:"😄 Хочу кольцо, положил дырявящий круг ПОД большой — не режет. Почему?",
   a:["Баг","Режет верхняя фигура — подними круг наверх","Мало цвета","Нужен CMYK"],c:1,
   e:"Ctrl+] поднять дырявящий круг, затем «Минус верхний»."},
  {q:"😄 Разрезал мороженое, а цвета не меняются на полосах. Что забыл?",
   a:["Сохранить","Разгруппировать после Разделения","Купить Illustrator","Обводку"],c:1,
   e:"Shift+Ctrl+G — и каждая полоса красится отдельно."},
  {q:"😄 Ищу «панель Навигатора» из старого урока — не нахожу. Где она?",
   a:["Её удалили","Это «Обработка контуров» (Окно → …)","В браузере","В Photoshop"],c:1,
   e:"Старый перевод врёт: нужная панель — «Обработка контуров»."},

  {q:"🤔 Почему сложные формы собирают из простых фигур, а не рисуют одним куском?",
   a:["Так медленнее","Проще, ровнее и легко править по частям","Перо запрещено","Для цвета"],c:1,
   e:"Фигуры + Pathfinder = точность и редактируемость."},
  {q:"🤔 Чем «Составной контур» (Ctrl+8) лучше «Минус верхний» для дырки?",
   a:["Ничем","Дырка остаётся редактируемой — можно двигать потом","Ярче","Меньше весит"],c:1,
   e:"Составной контур не «запекает» вырез — форму дырки можно менять."},
  {q:"🤔 Зачем задавать всем иконкам одинаковую высоту (например 256)?",
   a:["Каприз","Чтобы в наборе/интерфейсе они смотрелись ровно и одинаково","Для веса","Случайно"],c:1,
   e:"Единый размер — признак аккуратного набора и удобен для UI."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🍩 Illustrator: Обработка контуров</h1>
    <div class="sub">Викторина по уроку «Флэт-иконки»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Обработка контуров — твоя суперсила! 🍩';}
  else if(pct>=70){em='🎉';msg='Отлично! 4 операции Pathfinder — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: Соединение/Минус верхний/Пересечение/Разделение.';}
  else {em='💪';msg='Начало есть! Перечитай про Обработку контуров и порядок фигур.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
