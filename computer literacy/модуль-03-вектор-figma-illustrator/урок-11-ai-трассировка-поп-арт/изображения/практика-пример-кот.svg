<svg viewBox="0 0 460 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="5" fill="#0E7490"/>
    </pattern>
  </defs>
  <rect width="460" height="460" fill="#67E8F9"/>
  <rect width="460" height="460" fill="url(#dots)" opacity="0.5"/>

  <!-- ears -->
  <polygon points="120,70 205,175 105,180" fill="#FB923C" stroke="#1E1E1E" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="340,70 255,175 355,180" fill="#FB923C" stroke="#1E1E1E" stroke-width="6" stroke-linejoin="round"/>
  <polygon points="140,95 190,170 128,172" fill="#F9A8D4"/>
  <polygon points="320,95 270,170 332,172" fill="#F9A8D4"/>

  <!-- head -->
  <ellipse cx="230" cy="255" rx="150" ry="140" fill="#FB923C" stroke="#1E1E1E" stroke-width="6"/>
  <!-- stripes -->
  <g fill="#C2410C">
    <path d="M230,120 l16,44 h-32 Z"/>
    <path d="M150,150 l30,30 -34,14 Z"/>
    <path d="M310,150 l-30,30 34,14 Z"/>
  </g>
  <!-- muzzle -->
  <ellipse cx="230" cy="300" rx="90" ry="64" fill="#FFE8C2"/>

  <!-- eyes -->
  <ellipse cx="176" cy="235" rx="34" ry="40" fill="#FDE047" stroke="#1E1E1E" stroke-width="5"/>
  <ellipse cx="284" cy="235" rx="34" ry="40" fill="#FDE047" stroke="#1E1E1E" stroke-width="5"/>
  <ellipse cx="176" cy="238" rx="12" ry="30" fill="#161616"/>
  <ellipse cx="284" cy="238" rx="12" ry="30" fill="#161616"/>
  <circle cx="170" cy="224" r="5" fill="#fff"/>
  <circle cx="278" cy="224" r="5" fill="#fff"/>

  <!-- nose + mouth -->
  <path d="M230,286 l16,16 -32,0 Z" fill="#EC4899" stroke="#1E1E1E" stroke-width="4" stroke-linejoin="round"/>
  <path d="M230,302 v18 M230,320 q-18,14 -34,4 M230,320 q18,14 34,4" fill="none" stroke="#1E1E1E" stroke-width="5" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#1E1E1E" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="300" x2="86" y2="288"/><line x1="150" y1="314" x2="88" y2="322"/>
    <line x1="310" y1="300" x2="374" y2="288"/><line x1="310" y1="314" x2="372" y2="322"/>
  </g>

  <text x="230" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#0E7490" text-anchor="middle">Поп-арт из фото · трассировка + кислотная перекраска</text>
</svg>
