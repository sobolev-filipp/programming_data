  <rect x="720" y="326" width="140" height="230" rx="18" fill="#ffffff"/>
  <circle cx="765" cy="376" r="22" fill="#34A853"/><circle cx="815" cy="376" r="22" fill="#A3E635"/>
  <circle cx="765" cy="430" r="22" fill="#FB923C"/><circle cx="815" cy="430" r="22" fill="#14532D"/>
  <text x="790" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5A7A4A" text-anchor="middle">4 цвета</text>
