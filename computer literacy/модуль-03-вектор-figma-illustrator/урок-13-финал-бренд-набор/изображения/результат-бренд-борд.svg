  <!-- LOGO block -->
  <text x="40" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#5A7A4A">ЛОГОТИП</text>
  <rect x="40" y="106" width="400" height="170" rx="18" fill="#ffffff"/>
  <g transform="translate(120,191)">
    <path d="M0,-52 C30,-24 30,24 0,52 C-30,24 -30,-24 0,-52 Z" fill="#34A853"/>
    <path d="M0,-46 C0,-10 0,20 0,46" fill="none" stroke="#DCFCE7" stroke-width="4"/>
    <path d="M0,-6 C14,-14 22,-16 26,-14 M0,10 C-14,2 -22,0 -26,2" fill="none" stroke="#DCFCE7" stroke-width="3"/>
  </g>
  <text x="200" y="205" font-family="Arial Black, Segoe UI, sans-serif" font-size="46" font-weight="900" fill="#14532D">СВЕЖО</text>

  <!-- ICONS block -->
  <text x="470" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#5A7A4A">ИКОНКИ</text>
  <rect x="470" y="106" width="390" height="170" rx="18" fill="#ffffff"/>
  <!-- cup -->
  <circle cx="565" cy="191" r="52" fill="#ECFCCB"/>
  <path d="M545,168 h40 l-5,52 a15,15 0 0,1 -30,0 Z" fill="#A3E635" stroke="#34A853" stroke-width="4"/>
  <rect x="560" y="150" width="6" height="26" fill="#FB923C"/>
  <!-- apple -->
  <circle cx="665" cy="191" r="52" fill="#ECFCCB"/>
  <circle cx="665" cy="196" r="30" fill="#34A853"/>
  <rect x="662" y="160" width="6" height="14" fill="#7C4A2A"/>
  <ellipse cx="678" cy="166" rx="12" ry="7" fill="#A3E635" transform="rotate(-30 678 166)"/>
  <!-- leaf -->
  <circle cx="765" cy="191" r="52" fill="#ECFCCB"/>
  <path d="M765,161 C788,178 788,208 765,225 C742,208 742,178 765,161 Z" fill="#34A853"/>
  <path d="M765,164 v58" stroke="#DCFCE7" stroke-width="3"/>

  <!-- CARD block -->
  <text x="40" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#5A7A4A">КАРТОЧКА</text>
  <rect x="40" y="326" width="400" height="230" rx="18" fill="#ffffff"/>
  <rect x="70" y="360" width="340" height="162" rx="18" fill="url(#cardg)"/>
  <g transform="translate(112,410) scale(0.5)">
    <path d="M0,-52 C30,-24 30,24 0,52 C-30,24 -30,-24 0,-52 Z" fill="#ffffff"/>
  </g>
  <text x="150" y="405" font-family="Arial Black, Segoe UI, sans-serif" font-size="26" font-weight="900" fill="#ffffff">СВЕЖО</text>
  <text x="150" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#ECFCCB">СМУЗИ-БАР</text>
  <text x="384" y="500" font-family="Arial Black, Segoe UI, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="end">−20%</text>

  <!-- PATTERN block -->
