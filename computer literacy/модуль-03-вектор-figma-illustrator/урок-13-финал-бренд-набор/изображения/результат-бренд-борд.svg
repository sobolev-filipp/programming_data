<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34A853"/><stop offset="1" stop-color="#A3E635"/></linearGradient>
    <pattern id="leafpat" width="46" height="46" patternUnits="userSpaceOnUse">
      <rect width="46" height="46" fill="#DCFCE7"/>
      <ellipse cx="12" cy="12" rx="6" ry="11" fill="#34A853" transform="rotate(30 12 12)"/>
      <ellipse cx="34" cy="34" rx="6" ry="11" fill="#34A853" transform="rotate(30 34 34)"/>
      <circle cx="34" cy="12" r="3.5" fill="#FB923C"/>
      <circle cx="12" cy="34" r="3.5" fill="#FB923C"/>
    </pattern>
  </defs>
  <rect width="900" height="600" fill="#FFF7E6"/>
  <text x="40" y="52" font-family="Arial Black, Segoe UI, sans-serif" font-size="30" font-weight="900" fill="#14532D">СВЕЖО · бренд-набор</text>
