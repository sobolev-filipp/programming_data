<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#14B8A6"/></linearGradient>
    <pattern id="pawpat" width="52" height="52" patternUnits="userSpaceOnUse">
      <rect width="52" height="52" fill="#EDE9FE"/>
      <g fill="#7C3AED">
        <ellipse cx="16" cy="20" rx="7" ry="9"/>
        <circle cx="7" cy="10" r="3"/><circle cx="16" cy="7" r="3"/><circle cx="25" cy="10" r="3"/>
      </g>
      <g fill="#14B8A6">
        <ellipse cx="40" cy="42" rx="7" ry="9"/>
        <circle cx="31" cy="32" r="3"/><circle cx="40" cy="29" r="3"/><circle cx="49" cy="32" r="3"/>
      </g>
    </pattern>
  </defs>
  <rect width="900" height="600" fill="#F5F3FF"/>
  <text x="40" y="52" font-family="Arial Black, Segoe UI, sans-serif" font-size="30" font-weight="900" fill="#4C1D95">ЛАПКА · бренд-набор</text>
  <line x1="40" y1="66" x2="860" y2="66" stroke="#DDD6FE" stroke-width="2"/>

  <!-- LOGO -->
  <text x="40" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6D5BB5">ЛОГОТИП</text>
  <rect x="40" y="106" width="400" height="170" rx="18" fill="#ffffff"/>
  <g transform="translate(120,196)" fill="#7C3AED">
    <ellipse cx="0" cy="14" rx="26" ry="22"/>
    <circle cx="-22" cy="-16" r="10"/><circle cx="-7" cy="-26" r="10"/><circle cx="9" cy="-26" r="10"/><circle cx="24" cy="-16" r="10"/>
  </g>
  <text x="180" y="210" font-family="Arial Black, Segoe UI, sans-serif" font-size="46" font-weight="900" fill="#4C1D95">ЛАПКА</text>

  <!-- ICONS -->
  <text x="470" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6D5BB5">ИКОНКИ</text>
  <rect x="470" y="106" width="390" height="170" rx="18" fill="#ffffff"/>
  <!-- paw -->
  <circle cx="565" cy="191" r="52" fill="#EDE9FE"/>
  <g transform="translate(565,196)" fill="#14B8A6"><ellipse cx="0" cy="10" rx="20" ry="16"/><circle cx="-16" cy="-12" r="7.5"/><circle cx="-5" cy="-19" r="7.5"/><circle cx="6" cy="-19" r="7.5"/><circle cx="17" cy="-12" r="7.5"/></g>
  <!-- bone -->
  <circle cx="665" cy="191" r="52" fill="#EDE9FE"/>
  <g transform="translate(665,191)" fill="#7C3AED"><rect x="-22" y="-7" width="44" height="14" rx="7"/><circle cx="-22" cy="-8" r="8"/><circle cx="-22" cy="8" r="8"/><circle cx="22" cy="-8" r="8"/><circle cx="22" cy="8" r="8"/></g>
  <!-- heart -->
  <circle cx="765" cy="191" r="52" fill="#EDE9FE"/>
  <path d="M765,214 C742,196 748,172 765,182 C782,172 788,196 765,214 Z" fill="#F472B6"/>

  <!-- CARD -->
  <text x="40" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6D5BB5">КАРТОЧКА</text>
  <rect x="40" y="326" width="400" height="230" rx="18" fill="#ffffff"/>
  <rect x="70" y="360" width="340" height="162" rx="18" fill="url(#cardp)"/>
  <g transform="translate(112,408) scale(0.5)" fill="#ffffff"><ellipse cx="0" cy="14" rx="26" ry="22"/><circle cx="-22" cy="-16" r="10"/><circle cx="-7" cy="-26" r="10"/><circle cx="9" cy="-26" r="10"/><circle cx="24" cy="-16" r="10"/></g>
  <text x="150" y="405" font-family="Arial Black, Segoe UI, sans-serif" font-size="26" font-weight="900" fill="#ffffff">ЛАПКА</text>
  <text x="150" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#CCFBF1">ЗООМАГАЗИН</text>
  <text x="384" y="500" font-family="Arial Black, Segoe UI, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="end">КЛУБ</text>

  <!-- PATTERN -->
  <text x="470" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6D5BB5">УЗОР</text>
  <rect x="470" y="326" width="230" height="230" rx="18" fill="url(#pawpat)"/>

  <!-- PALETTE -->
  <text x="720" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#6D5BB5">ПАЛИТРА</text>
  <rect x="720" y="326" width="140" height="230" rx="18" fill="#ffffff"/>
  <circle cx="765" cy="376" r="22" fill="#7C3AED"/><circle cx="815" cy="376" r="22" fill="#14B8A6"/>
  <circle cx="765" cy="430" r="22" fill="#F472B6"/><circle cx="815" cy="430" r="22" fill="#312E81"/>
  <text x="790" y="510" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6D5BB5" text-anchor="middle">4 цвета</text>
</svg>
