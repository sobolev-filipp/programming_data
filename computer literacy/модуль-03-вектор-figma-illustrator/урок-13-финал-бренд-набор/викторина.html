<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Бренд-набор (весь вектор)</title>
<style>
  :root{
    --bg1:#14532D; --bg2:#7C3AED; --card:#ffffff; --ink:#1e293b;
    --accent:#16a34a; --ok:#16a34a; --bad:#dc2626; --soft:#dcfce7;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что держит фирменный набор ЕДИНЫМ?",
   a:["Много цветов","Одна палитра + один характер форм","Крупный логотип","Разные шрифты"],c:1,
   e:"3–4 цвета из «Образцов» + единый стиль форм связывают элементы."},
  {q:"Чем вектор лучше растра?",
   a:["Ярче","Чёткий на любом размере (кривые, не пиксели)","Легче красить","Только для фото"],c:1,
   e:"Вектор — математика кривых, не «мылится» при увеличении."},
  {q:"Как склеить фигуры в один силуэт?",
   a:["Разделение","Соединение (Обработка контуров)","Втягивание","Переход"],c:1,
   e:"«Соединение» (Unite) сваривает фигуры в одну."},
  {q:"Как сделать симметричный знак?",
   a:["Рисовать обе стороны","Половина → «Отражение» → «Копировать»","Копировать 10 раз","Обводкой"],c:1,
   e:"Отражение с «Копировать» даёт идеальную вторую половину."},
  {q:"Чем придать объём объекту?",
   a:["Плоской заливкой","Радиальный градиент / Градиентная сетка","Обводкой","Текстом"],c:1,
   e:"Свет→тень: радиальный градиент = шар; сетка лепит объём узлами."},
  {q:"Что делает Переход (Blend)?",
   a:["Режет","Из 2 фигур рисует все промежуточные (веер/ряд)","Красит фон","Экспорт"],c:1,
   e:"2 фигуры → много копий/переход тона."},
  {q:"Как сделать повторяющийся фирменный фон?",
   a:["Копировать вручную","Объект → Узор → Создать","Градиент","Тень"],c:1,
   e:"Узор (Pattern) — плитка, размноженная сеткой."},
  {q:"Как превратить фото в вектор?",
   a:["Экспорт JPG","Трассировка изображения (+ Разобрать)","Кистью обвести","Градиентом"],c:1,
   e:"Image Trace обводит фото; «Разобрать» даёт редактируемые фигуры."},
  {q:"Каким должен быть логотип?",
   a:["Со множеством мелких деталей","Простым — читается и маленьким","Только цветным","Огромным"],c:1,
   e:"Сильный знак узнаётся и на аватарке, и в один цвет."},
  {q:"Чем финал модуля отличается от обычного урока?",
   a:["Ничем","Сборка всего + защита (рассказ о бренде)","Только тест","Меньше работы"],c:1,
   e:"Дипломная сборка приёмов + презентация решений."},

  {q:"😄 Набор выглядит как «случайные картинки». Первая помощь?",
   a:["Добавить ещё","Свести всё к одной палитре из «Образцов»","Ярче фон","Убрать логотип"],c:1,
   e:"Единая палитра мгновенно связывает разношёрстные элементы."},
  {q:"😄 Логотип красивый, но на аватарке — «каша». Почему?",
   a:["Экран плохой","Слишком много мелких деталей — упростить","Мало цвета","Нет узора"],c:1,
   e:"Знак должен читаться маленьким. Убери лишнее."},
  {q:"😄 Взял для бренда чужой известный логотип. Проблема?",
   a:["Нет проблем","Это чужой бренд — придумай свой","Мало цвета","Слишком просто"],c:1,
   e:"Копировать реальные бренды нельзя. Марка — своя."},

  {q:"🤔 Почему единая палитра важнее идеально ровных краёв?",
   a:["Края не важны","Единство цвета/стиля создаёт «систему»; мелочи глаз прощает","Так быстрее","Для печати"],c:1,
   e:"Мозг считывает бренд по цвету и характеру, а не по пикселям края."},
  {q:"🤔 Зачем защищать работу словами, если она и так видна?",
   a:["Не зачем","Объяснить идею и решения — отдельный ценный навык","Для оценки","Чтобы дольше"],c:1,
   e:"Дизайнер должен уметь обосновать выбор — это часть профессии."},
  {q:"🤔 Что общего у логотипа, иконок и узора в хорошем бренде?",
   a:["Разные стили","Один характер форм и одна палитра — они «родные»","Разные шрифты","Ничего"],c:1,
   e:"Единый визуальный язык делает элементы частями одной системы."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🏆 Бренд-набор</h1>
    <div class="sub">Викторина по всему модулю «Векторная графика»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты вектор-дизайнер — бренд в портфолио! 🎨';}
  else if(pct>=70){em='🎉';msg='Отлично! Весь вектор — Figma и Illustrator — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Помни: единая палитра + один стиль = система.';}
  else {em='💪';msg='Начало есть! Полистай уроки модуля и попробуй снова.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
