<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'Comfortaa','Nunito',sans-serif">
  <rect width="980" height="640" rx="22" fill="#FFF8EE"/>
  <text x="490" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#2A2140">Примеры наборов иконок в едином стиле</text>
  <text x="490" y="72" text-anchor="middle" font-size="15" fill="#7C5CFF">выбери одну тему — 3 иконки, 2–3 цвета, похожие скругления</text>

  <!-- ===== ROW 1: ЕДА ===== -->
  <text x="40" y="168" font-size="18" font-weight="700" fill="#2A2140">Еда</text>
  <!-- Burger -->
  <g transform="translate(360,170)">
    <rect x="-70" y="-70" width="140" height="140" rx="26" fill="#ffffff" stroke="#EADFce" stroke-width="2"/>
    <path d="M-45 -6 A45 26 0 0 1 45 -6 Z" fill="#E6A765"/>
    <circle cx="-20" cy="-22" r="3" fill="#fff"/><circle cx="4" cy="-28" r="3" fill="#fff"/><circle cx="24" cy="-20" r="3" fill="#fff"/>
    <rect x="-47" y="-6" width="94" height="8" rx="4" fill="#6FBF4B"/>
    <rect x="-46" y="2" width="92" height="16" rx="5" fill="#7B4A2B"/>
    <rect x="-45" y="18" width="90" height="16" rx="8" fill="#E6A765"/>
  </g>
  <!-- Cola -->
  <g transform="translate(560,170)">
    <rect x="-70" y="-70" width="140" height="140" rx="26" fill="#ffffff" stroke="#EADFce" stroke-width="2"/>
    <line x1="6" y1="-56" x2="18" y2="-30" stroke="#F2C94C" stroke-width="8" stroke-linecap="round"/>
    <path d="M-30 -34 L30 -34 L23 42 L-23 42 Z" fill="#EB5757"/>
    <rect x="-27" y="-8" width="54" height="16" fill="#ffffff" opacity="0.9"/>
    <circle cx="0" cy="0" r="7" fill="#EB5757"/>
  </g>
  <!-- Fries -->
  <g transform="translate(760,170)">
    <rect x="-70" y="-70" width="140" height="140" rx="26" fill="#ffffff" stroke="#EADFce" stroke-width="2"/>
    <rect x="-20" y="-40" width="9" height="46" rx="4" fill="#F2C94C"/>
    <rect x="-7" y="-46" width="9" height="52" rx="4" fill="#F2C94C"/>
    <rect x="6" y="-42" width="9" height="48" rx="4" fill="#F2C94C"/>
    <rect x="18" y="-36" width="9" height="42" rx="4" fill="#F2C94C"/>
    <path d="M-30 2 L30 2 L24 44 L-24 44 Z" fill="#EB5757"/>
    <rect x="-18" y="14" width="36" height="12" rx="2" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- ===== ROW 2: ИГРЫ ===== -->
  <text x="40" y="330" font-size="18" font-weight="700" fill="#2A2140">Игры</text>
  <!-- Gamepad -->
  <g transform="translate(360,330)">
    <rect x="-70" y="-70" width="140" height="140" rx="26" fill="#ffffff" stroke="#EADFce" stroke-width="2"/>
    <rect x="-52" y="-18" width="104" height="40" rx="20" fill="#7C5CFF"/>
    <rect x="-34" y="-3" width="20" height="6" rx="3" fill="#ffffff"/>
    <rect x="-27" y="-10" width="6" height="20" rx="3" fill="#ffffff"/>
    <circle cx="24" cy="-4" r="6" fill="#F2C94C"/>
    <circle cx="38" cy="8" r="6" fill="#EB5757"/>
  </g>
  <!-- Heart -->
  <g transform="translate(560,330)">
    <rect x="-70" y="-70" width="140" height="140" rx="26" fill="#ffffff" stroke="#EADFce" stroke-width="2"/>
    <path d="M0 34 C -46 2 -34 -34 0 -12 C 34 -34 46 2 0 34 Z" fill="#EB5757"/>
    <path d="M-14 -8 C -20 -14 -10 -22 -6 -14" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- Coin -->
  <g transform="translate(760,330)">
    <rect x="-70" y="-70" width="140" height="140" rx="26" fill="#ffffff" stroke="#EADFce" stroke-width="2"/>
    <circle r="40" fill="#F2C94C" stroke="#E0A800" stroke-width="5"/>
    <circle r="30" fill="none" stroke="#E0A800" stroke-width="3" opacity="0.6"/>
    <path d="M0 -20 L6 -6 L21 -6 L9 3 L14 18 L0 9 L-14 18 L-9 3 L-21 -6 L-6 -6 Z" fill="#E0A800"/>
  </g>

  <!-- ===== ROW 3: ПОГОДА ===== -->
  <text x="40" y="492" font-size="18" font-weight="700" fill="#2A2140">Погода</text>
  <!-- Sun -->
  <g transform="translate(360,492)">
    <rect x="-70" y="-70" width="140" height="140" rx="26" fill="#ffffff" stroke="#EADFce" stroke-width="2"/>
    <g stroke="#FFC93F" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="-46" x2="0" y2="-34"/><line x1="0" y1="34" x2="0" y2="46"/>
      <line x1="-46" y1="0" x2="-34" y2="0"/><line x1="34" y1="0" x2="46" y2="0"/>
      <line x1="-33" y1="-33" x2="-24" y2="-24"/><line x1="24" y1="24" x2="33" y2="33"/>
      <line x1="33" y1="-33" x2="24" y2="-24"/><line x1="-33" y1="33" x2="-24" y2="24"/>
    </g>
    <circle r="26" fill="#FFD23F"/>
  </g>
  <!-- Cloud + rain -->
  <g transform="translate(560,492)">
    <rect x="-70" y="-70" width="140" height="140" rx="26" fill="#ffffff" stroke="#EADFce" stroke-width="2"/>
    <g fill="#9FC9E8">
      <circle cx="-18" cy="-8" r="20"/><circle cx="14" cy="-12" r="24"/><circle cx="30" cy="2" r="16"/>
      <rect x="-38" y="2" width="76" height="20" rx="10"/>
    </g>
    <g stroke="#56CCF2" stroke-width="6" stroke-linecap="round">
      <line x1="-20" y1="30" x2="-24" y2="44"/><line x1="2" y1="30" x2="-2" y2="46"/><line x1="24" y1="30" x2="20" y2="44"/>
    </g>
  </g>
  <!-- Snowflake -->
  <g transform="translate(760,492)">
    <rect x="-70" y="-70" width="140" height="140" rx="26" fill="#ffffff" stroke="#EADFce" stroke-width="2"/>
    <g stroke="#56CCF2" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-42" x2="0" y2="42"/>
      <line x1="-36" y1="-21" x2="36" y2="21"/>
      <line x1="-36" y1="21" x2="36" y2="-21"/>
      <line x1="0" y1="-42" x2="-9" y2="-32"/><line x1="0" y1="-42" x2="9" y2="-32"/>
      <line x1="0" y1="42" x2="-9" y2="32"/><line x1="0" y1="42" x2="9" y2="32"/>
      <line x1="-36" y1="-21" x2="-25" y2="-23"/><line x1="-36" y1="-21" x2="-30" y2="-11"/>
      <line x1="36" y1="21" x2="25" y2="23"/><line x1="36" y1="21" x2="30" y2="11"/>
      <line x1="-36" y1="21" x2="-30" y2="11"/><line x1="-36" y1="21" x2="-25" y2="23"/>
      <line x1="36" y1="-21" x2="30" y2="-11"/><line x1="36" y1="-21" x2="25" y2="-23"/>
    </g>
  </g>

  <text x="490" y="610" text-anchor="middle" font-size="14" fill="#8A8398">Это примеры — можно взять спорт (мяч, кубок, медаль) или музыку (наушники, нота, динамик). Собери из простых фигур.</text>
</svg>
