<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Вектор и Figma: иконки</title>
<style>
  :root{
    --bg1:#4c1d95; --bg2:#0ea5e9; --card:#ffffff; --ink:#1e293b;
    --accent:#7c3aed; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Чем ВЕКТОР отличается от растра?",
   a:["Он всегда цветной","Состоит из кривых и точек — чёткий на любом размере","Тяжелее весит","Только для фото"],c:1,
   e:"Вектор — это математика (кривые), поэтому не «мылится» при увеличении. Растр — пиксели."},
  {q:"Что случится с растровым фото при сильном увеличении?",
   a:["Станет чётче","Рассыплется на квадраты-пиксели","Станет вектором","Ничего"],c:1,
   e:"Пиксели видны как квадратики. Вектор же остаётся ровным."},
  {q:"Для чего лучше подходит вектор?",
   a:["Фотографии заката","Иконки, логотипы, шрифты","Ретушь лица","Эффекты дыма"],c:1,
   e:"Иконки/лого нужны в разных размерах — вектор идеален. Фото — это растр (Photoshop)."},
  {q:"Что делает операция «Объединение» (Union)?",
   a:["Удаляет фигуры","Сваривает несколько фигур в одну","Красит в один цвет","Уменьшает"],c:1,
   e:"Union соединяет фигуры в единый силуэт (корпус+плавники+нос → ракета)."},
  {q:"Что делает «Вычитание» (Subtract)?",
   a:["Складывает фигуры","Вырезает одну фигуру из другой (дырка)","Дублирует","Поворачивает"],c:1,
   e:"Subtract прорезает отверстие — так делаем окно ракеты или полумесяц."},
  {q:"Где в Figma рисуют иконку?",
   a:["На сером холсте где попало","Внутри фрейма (артборда)","В панели слоёв","В браузерной вкладке"],c:1,
   e:"Рисуем внутри фрейма — тогда ровный экспорт и порядок."},
  {q:"Как из прямоугольника сделать «капсулу» (круглые торцы)?",
   a:["Растянуть","Поставить большое скругление углов","Повернуть","Залить градиентом"],c:1,
   e:"Скругление углов в панели справа превращает прямоугольник в капсулу."},
  {q:"В каком формате экспортировать иконку как НАСТОЯЩИЙ вектор?",
   a:["JPG","SVG","BMP","GIF"],c:1,
   e:"SVG хранит кривые — масштабируется без потерь. PNG — картинка (растр) с прозрачностью."},
  {q:"Что нужно, чтобы булева операция стала доступна?",
   a:["Выделить 1 объект","Выделить 2 и более объектов","Сохранить файл","Открыть фрейм"],c:1,
   e:"Булевы работают между двумя (и более) выделенными фигурами."},
  {q:"Как сделать набор иконок «семьёй» (в одном стиле)?",
   a:["Разные цвета у каждой","Единая палитра 2–3 цвета + одинаковые скругления","Разный размер","Больше деталей"],c:1,
   e:"Общая палитра и одинаковые скругления связывают иконки в набор."},

  {q:"😄 Логотип на билборде во всю стену — чёткий. Почему?",
   a:["Дорогая печать","Это вектор — не мылится на любом размере","Повезло","Много пикселей"],c:1,
   e:"Вектор масштабируется без потерь — хоть на кнопку, хоть на дом."},
  {q:"😄 Нарисовал ракету «от руки» пером — вышла кривая. Как проще?",
   a:["Тереть и пробовать снова","Собрать из простых фигур + Объединение","Взять карандаш","Уменьшить"],c:1,
   e:"Сложная форма = сумма простых фигур. Быстрее и ровнее."},
  {q:"😄 Экспортировал иконку в JPG — фон белый квадрат вокруг. Что не так?",
   a:["Так и надо","JPG не умеет прозрачность — нужен PNG или SVG","Мало цветов","Слишком крупно"],c:1,
   e:"Для прозрачного фона — PNG (или SVG). JPG всегда заливает фон."},

  {q:"🤔 Почему иконки в приложениях делают вектором, а не фото?",
   a:["Так красивее случайно","Иконка нужна в разных размерах — вектор везде чёткий и лёгкий","Фото запрещены","Вектор ярче"],c:1,
   e:"Одна вектор-иконка идеальна и на 24px, и на баннере."},
  {q:"🤔 Зачем называть и группировать слои, если и так работает?",
   a:["Не зачем","Чтобы легко находить и менять детали потом","Для веса файла","Для цвета"],c:1,
   e:"Порядок в слоях = быстро поправить цвет/позицию, не запутавшись."},
  {q:"🤔 Булева группа «живая» — что это значит?",
   a:["Она двигается сама","Исходные фигуры внутри целы, их можно раскрыть и подвинуть","Её нельзя менять","Она мигает"],c:1,
   e:"Union/Subtract не разрушают фигуры — раскрыл группу и правишь детали."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🚀 Вектор и Figma</h1>
    <div class="sub">Викторина по уроку «Набор флэт-иконок»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты понял вектор — иконки тебе по плечу! 🚀';}
  else if(pct>=70){em='🎉';msg='Отлично! Фигуры, булевы операции и экспорт — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: вектор = кривые, Union — склеить, Subtract — вырезать.';}
  else {em='💪';msg='Начало есть! Перечитай про вектор/растр и булевы операции.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
