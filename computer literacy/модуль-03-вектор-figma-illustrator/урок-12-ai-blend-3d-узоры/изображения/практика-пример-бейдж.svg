    <polygon points="230,210 218,-120 242,-120" transform="rotate(36 230 210)"/>
    <polygon points="230,210 218,-120 242,-120" transform="rotate(72 230 210)"/>
    <polygon points="230,210 218,-120 242,-120" transform="rotate(108 230 210)"/>
    <polygon points="230,210 218,-120 242,-120" transform="rotate(144 230 210)"/>
    <polygon points="230,210 218,-120 242,-120" transform="rotate(180 230 210)"/>
    <polygon points="230,210 218,-120 242,-120" transform="rotate(216 230 210)"/>
    <polygon points="230,210 218,-120 242,-120" transform="rotate(252 230 210)"/>
    <polygon points="230,210 218,-120 242,-120" transform="rotate(288 230 210)"/>
    <polygon points="230,210 218,-120 242,-120" transform="rotate(324 230 210)"/>
