  <path d="M110,360 H350 L330,398 L350,436 H110 L130,398 Z" fill="#DC2626" stroke="#991B1B" stroke-width="3"/>
  <polygon points="70,372 110,360 110,436 70,424" fill="#B91C1C"/>
  <polygon points="390,372 350,360 350,436 390,424" fill="#B91C1C"/>
  <text x="230" y="410" font-family="Arial Black, Segoe UI, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ПОБЕДА</text>

  <text x="230" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#92400E" text-anchor="middle">3D-звезда + лучи (Blend) + узор</text>
