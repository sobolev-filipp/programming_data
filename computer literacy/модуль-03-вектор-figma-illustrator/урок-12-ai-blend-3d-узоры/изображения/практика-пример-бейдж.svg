    <pattern id="bdots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="3" fill="#F59E0B"/></pattern>
  </defs>
  <rect width="460" height="520" fill="#FEF3C7"/>
  <rect width="460" height="520" fill="url(#bdots)" opacity="0.25"/>

  <!-- sunburst rays behind badge (Blend look), center (230,210) -->
