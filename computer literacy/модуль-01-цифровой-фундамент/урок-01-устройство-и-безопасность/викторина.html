<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Устройство компьютера</title>
<style>
  :root{
    --bg1:#1e1b4b; --bg2:#4338ca; --card:#ffffff; --ink:#1e293b;
    --accent:#6366f1; --ok:#16a34a; --bad:#dc2626; --soft:#eef2ff;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Какая деталь — «мозг» компьютера, который думает и командует?",
   a:["Процессор (CPU)","Видеокарта","Монитор","Блок питания"],c:0,
   e:"Процессор (CPU) — думает, считает и раздаёт задания, миллиарды операций в секунду."},
  {q:"Куда компьютер кладёт то, с чем работает ПРЯМО СЕЙЧАС (и что стирается при выключении)?",
   a:["На накопитель (SSD)","В оперативную память (RAM)","В видеокарту","В блок питания"],c:1,
   e:"RAM — это «рабочий стол». Выключил свет — стол сметён. Поэтому сохраняйся почаще!"},
  {q:"Где файлы, игры и фото хранятся НАВСЕГДА?",
   a:["В оперативной памяти","В процессоре","На накопителе (SSD/HDD)","В мониторе"],c:2,
   e:"Накопитель — это «склад». Всё лежит там, пока сам не удалишь."},
  {q:"Что отвечает за картинку и тянет тяжёлые игры и 3D?",
   a:["Видеокарта (GPU)","Оперативная память","Клавиатура","Кулер"],c:0,
   e:"Видеокарта — «художник». Рисует всё, что ты видишь на экране."},
  {q:"Клавиатура — это устройство…",
   a:["вывода","ввода","хранения","охлаждения"],c:1,
   e:"Ввод: мы «говорим» компьютеру. Вывод — когда он отвечает нам (монитор, колонки)."},
  {q:"Сколько бит в одном байте?",
   a:["2","8","16","1000"],c:1,
   e:"8 бит = 1 байт. Одним байтом можно закодировать один символ, например букву «А»."},
  {q:"Что БЫСТРЕЕ и надёжнее (нет движущихся частей)?",
   a:["HDD (жёсткий диск)","SSD (твердотельный)","Дискета","CD-диск"],c:1,
   e:"SSD быстрее и не боится тряски. Замена HDD на SSD «оживляет» даже старый ПК."},
  {q:"Ядра процессора — это про что?",
   a:["Сколько задач он тянет параллельно","Сколько места на диске","Яркость экрана","Громкость звука"],c:0,
   e:"Ядра — это «сколько поваров на кухне». А частота (ГГц) — как быстро каждый работает."},
  {q:"Каким сочетанием клавиш открыть Диспетчер задач?",
   a:["Ctrl + C","Ctrl + Shift + Esc","Alt + F4","Win + D"],c:1,
   e:"Ctrl+Shift+Esc → вкладка «Производительность» покажет загрузку всех деталей вживую."},
  {q:"Что даёт электричество всем деталям компьютера?",
   a:["Материнская плата","Блок питания","Видеокарта","Кулер"],c:1,
   e:"Блок питания — «сердце». Превращает ток из розетки в правильное питание для деталей."},

  {q:"🛡️ Какой пароль самый надёжный?",
   a:["12345","дата рождения","КороваЛунаВелосипед7!","qwerty"],c:2,
   e:"Длинная фраза из несвязанных слов + число/знак. Длина важнее «сложности» и легче запоминается."},
  {q:"🛡️ Пришло: «Вы выиграли iPhone! Введите данные карты для приза». Что делать?",
   a:["Быстро ввести данные","Не переходить — это мошенники","Переслать друзьям","Ввести чужие данные"],c:1,
   e:"Классический фишинг. Настоящие призы так не раздают. Не переходи и не вводи ничего, скажи взрослому."},
  {q:"🛡️ Что из этого НЕЛЬЗЯ выкладывать в интернет?",
   a:["Любимый цвет","Домашний адрес и номер школы","Название игры","Погоду за окном"],c:1,
   e:"Личные данные (адрес, школу, телефон, геолокацию) публиковать опасно. В сети — как на площади."},
  {q:"🛡️ Как интернет доставляет тебе страницу сайта?",
   a:["Телепортом","Запрос → сервер → ответ пакетами","По воздуху без серверов","Сайт всегда лежит в твоём ПК"],c:1,
   e:"Как почта: твой запрос летит на сервер, а он присылает страницу маленькими пакетами данных."},
  {q:"🛡️ Незнакомец в онлайн-игре зовёт встретиться и просит фото. Как поступить?",
   a:["Пойти одному","Отправить фото","Отказаться и рассказать взрослому","Дать свой адрес"],c:2,
   e:"Не встречайся с интернет-знакомыми без взрослых и рассказывай о таких просьбах тому, кому доверяешь."},
  {q:"🛡️ Что такое двухфакторная защита (2FA)?",
   a:["Два пароля подряд","Пароль + одноразовый код","Два монитора","Антивирус"],c:1,
   e:"Вход = пароль + код из SMS/приложения. Даже если пароль украли, без второго кода не войдут."},

  {q:"🗂️ Что такое операционная система (Windows, Android)?",
   a:["Компьютерная игра","Главная программа-«начальник», управляет всем","Деталь внутри корпуса","Сайт в интернете"],c:1,
   e:"ОС — как администратор здания: запускает программы и командует железом. Без неё ПК не работает."},
  {q:"🗂️ Файл называется `песня.mp3`. Что это за файл?",
   a:["Картинка","Программа","Звук/музыка","Видео"],c:2,
   e:"Расширение после точки — «фамилия» файла. .mp3 = звук, .jpg = картинка, .mp4 = видео, .exe = программа."},
  {q:"🗂️ Какие клавиши — «машина времени», отменяют последнее действие?",
   a:["Ctrl + Z","Ctrl + C","Alt + F4","Ctrl + P"],c:0,
   e:"Ctrl+Z отменяет ошибку почти везде: в Word, Photoshop, папках. Ctrl+Y — вернуть обратно."},
  {q:"🗂️ Как быстро переключаться между открытыми окнами?",
   a:["Ctrl + S","Alt + Tab","F5","Win + L"],c:1,
   e:"Alt+Tab — листаешь окна как карточки. Профи почти не трогают мышку для этого."},
  {q:"🗂️ Как навести порядок в файлах правильно?",
   a:["Свалить всё кучей на Рабочий стол","Разложить по папкам с понятными именами","Называть всё «Новый документ (3)»","Хранить всё в Корзине"],c:1,
   e:"Папки по темам + понятные имена = находишь за секунды. Рабочий стол — витрина, а не свалка."},

  {q:"😄 Компьютер намертво завис. Что сделает настоящий профи ПЕРВЫМ делом?",
   a:["Стукнет по монитору","Скажет волшебное слово","Откроет Диспетчер задач (Ctrl+Shift+Esc)","Выдернет шнур из розетки"],c:2,
   e:"Ctrl+Shift+Esc → закрыть зависшую программу. Бить и выдёргивать — только в мультиках 😄"},
  {q:"😄 Как называется папка, куда попадают удалённые файлы (и откуда их можно спасти)?",
   a:["Мусоропровод","Корзина","Чёрная дыра","Помойка"],c:1,
   e:"Корзина! Пока не очистил — файл можно вернуть. Это как Ctrl+Z, только для файлов."},
  {q:"😄 Друг кричит: «100 вкладок открыто, всё зависло!» Кто там устал больше всех?",
   a:["Мышка","Коврик","Оперативная память (RAM)","Кнопка Пуск"],c:2,
   e:"«Рабочий стол» переполнен — вкладки съели всю оперативку. Пора что-то закрыть 😅"},

  {q:"🤔 На подумать: ты скачал файл `котик.jpg.exe`. Открывать?",
   a:["Да, это же котик","Нет — картинка не бывает .exe, это может быть вирус","Только если милый","Переименовать и открыть"],c:1,
   e:"Двойное расширение — классическая маскировка вируса. Настоящая картинка это .jpg, а не .exe."},
  {q:"🤔 На подумать: почему ПК тормозит и шумит в игре, хотя раньше тянул?",
   a:["Обиделся","Перегрев — забились пылью вентиляторы","Мало места в Корзине","Старый коврик для мыши"],c:1,
   e:"Пыль в кулерах → перегрев → ПК специально снижает скорость, чтобы не сгореть. Нужна чистка."},
  {q:"🤔 На подумать: что будет, если убрать видеокарту, а остальное оставить?",
   a:["ПК станет быстрее","Не будет изображения на экране","Пропадёт звук","Удалятся все файлы"],c:1,
   e:"Видеокарта — «художник». Без неё (и без встроенной графики) рисовать картинку на монитор нечем."},
  {q:"🤔 На подумать: почему длинная фраза-пароль надёжнее короткого `P@s1`?",
   a:["Она красивее","Вариантов перебора становится астрономически много","Её сложнее выговорить","Просто так решили"],c:1,
   e:"Каждый лишний символ умножает число комбинаций. Длина растит их взрывообразно — перебрать нереально."},
];

// перемешиваем вопросы, чтобы каждый запуск был свежим
function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🖥️🛡️🗂️ Компьютер с нуля</h1>
    <div class="sub">Викторина: железо + безопасность + работа в системе</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Процессор в твоей голове работает на максимальной частоте! 🧠⚡';}
  else if(pct>=70){em='🎉';msg='Отлично! Ты уже как уверенный пользователь. Хакеры нервно курят в сторонке 😎';}
  else if(pct>=40){em='👍';msg='Неплохо! Оперативка почти заполнена знаниями — ещё немного, и апгрейд!';}
  else {em='💪';msg='Начало положено! Нажми Ctrl+Z на ошибки, перечитай урок — и в бой снова!';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
