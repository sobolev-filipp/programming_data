<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="monG"><rect x="60" y="18" width="380" height="150" rx="8"/></clipPath>
    <linearGradient id="roomG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#1E293B"/></linearGradient>
  </defs>

  <rect width="500" height="400" fill="#1E1E1E"/>

  <!-- ===== PROGRAM MONITOR ===== -->
  <text x="66" y="12" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#A1A1AA">Программа · интро моего канала</text>
  <rect x="60" y="18" width="380" height="150" rx="8" fill="#0B1220"/>
