  <text x="405" y="307" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#DBEAFE">голос 🤖</text>

  <!-- playhead -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;408 0" dur="6s" repeatCount="indefinite"/>
    <polygon points="55,180 67,180 61,190" fill="#EF4444"/>
