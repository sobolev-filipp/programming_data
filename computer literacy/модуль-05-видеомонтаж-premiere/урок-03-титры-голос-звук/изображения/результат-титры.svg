    <!-- animated intro title -->
    <g>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.08;0.18;1" values="0;0;1;1"/>
      <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite" keyTimes="0;0.18;1" values="0 14;0 0;0 0"/>
      <text x="250" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#FDE047" text-anchor="middle">КАНАЛ ПИКСЕЛЬ</text>
    </g>

    <!-- lower-third name plate slides in from left -->
    <g>
