      <text x="86" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#DDD6FE">ведущий</text>
    </g>

    <!-- subtitle -->
    <g>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.35;0.42;1" values="0;0;1;1"/>
      <rect x="150" y="152" width="200" height="14" rx="3" fill="#000000" opacity="0.5"/>
      <text x="250" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Привет! Это мой канал про игры 🎮</text>
    </g>
