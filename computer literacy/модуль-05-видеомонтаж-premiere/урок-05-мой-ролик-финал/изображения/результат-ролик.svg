<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="monF"><rect x="30" y="26" width="268" height="150" rx="8"/></clipPath>
    <linearGradient id="vidF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#7C2D12"/></linearGradient>
    <radialGradient id="vgF" cx="0.5" cy="0.5" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
  </defs>

  <rect width="500" height="400" fill="#1E1E1E"/>
  <text x="36" y="18" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#A1A1AA">Программа · готовый ролик</text>

  <!-- finished 16:9 video -->
  <rect x="30" y="26" width="268" height="150" rx="8" fill="#0B1220"/>
  <g clip-path="url(#monF)">
    <rect x="30" y="26" width="268" height="150" fill="url(#vidF)"/>
    <circle cx="120" cy="70" r="20" fill="#FDE047"/>
    <rect x="30" y="140" width="268" height="36" fill="#7C2D12"/>
    <rect x="30" y="26" width="268" height="150" fill="url(#vgF)"/>
    <!-- title bar -->
    <rect x="30" y="26" width="268" height="26" fill="#111827" opacity="0.8"/>
    <text x="42" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#fff">🏆 МОЙ ОБЗОР</text>
    <!-- subtitle -->
    <rect x="74" y="156" width="180" height="14" rx="3" fill="#000" opacity="0.5"/>
    <text x="164" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">это моя любимая игра!</text>
    <!-- play button -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.12 1.12;1 1" dur="1.4s" repeatCount="indefinite" additive="sum"/>
      <circle cx="164" cy="100" r="24" fill="#000" opacity="0.45"/>
      <path d="M156,88 L180,100 L156,112 Z" fill="#fff"/>
    </g>
  </g>
  <rect x="30" y="26" width="268" height="150" rx="8" fill="none" stroke="#3F3F46" stroke-width="2"/>

  <!-- export panel -->
  <rect x="312" y="26" width="158" height="150" rx="8" fill="#141414" stroke="#3F3F46" stroke-width="1"/>
  <text x="391" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#E4E4E7" text-anchor="middle">📤 Экспорт</text>
  <text x="322" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#A1A1AA">Формат: H.264 (MP4)</text>
  <!-- horizontal option -->
  <rect x="322" y="72" width="138" height="40" rx="6" fill="#1D4ED8"/>
  <rect x="330" y="82" width="34" height="20" rx="2" fill="#93C5FD"/>
  <text x="372" y="89" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">YouTube</text>
  <text x="372" y="102" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#DBEAFE">1080p · гориз.</text>
  <!-- vertical option -->
  <rect x="322" y="118" width="138" height="40" rx="6" fill="#7C3AED"/>
  <rect x="330" y="124" width="18" height="28" rx="2" fill="#DDD6FE"/>
  <text x="372" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff">Shorts / Reels</text>
  <text x="372" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#EDE9FE">1080×1920 · верт.</text>
  <rect x="322" y="163" width="138" height="6" rx="3" fill="#16A34A"><animate attributeName="width" values="0;138;138" keyTimes="0;0.7;1" dur="3s" repeatCount="indefinite"/></rect>

  <!-- badge line -->
  <text x="250" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle">собрано из всех навыков: 🎬 ритм · ⚡ слоу-мо · 🔊 титры+голос · 🎨 цвет+хромакей</text>

  <!-- timeline (all tracks) -->
  <rect x="16" y="206" width="468" height="120" rx="8" fill="#141414"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#D4D4D8" text-anchor="middle">
    <rect x="20" y="214" width="34" height="18" rx="3" fill="#27272A"/><text x="37" y="227">V3</text>
    <rect x="20" y="234" width="34" height="18" rx="3" fill="#27272A"/><text x="37" y="247">V2</text>
    <rect x="20" y="254" width="34" height="18" rx="3" fill="#27272A"/><text x="37" y="267">V1</text>
    <rect x="20" y="274" width="34" height="18" rx="3" fill="#27272A"/><text x="37" y="287">A2</text>
    <rect x="20" y="294" width="34" height="18" rx="3" fill="#27272A"/><text x="37" y="307">A3</text>
  </g>
  <rect x="58" y="214" width="414" height="18" rx="3" fill="#F59E0B"/><text x="66" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#431407">титры + корректирующий слой (цвет)</text>
  <rect x="58" y="234" width="200" height="18" rx="3" fill="#7C3AED"/><text x="66" y="247" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#EDE9FE">хромакей / эффекты</text>
  <rect x="58" y="254" width="414" height="18" rx="3" fill="#14B8A6"/><text x="66" y="267" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#042F2E">видео (нарезка в ритм + слоу-мо)</text>
  <rect x="58" y="274" width="414" height="18" rx="3" fill="#166534"/><text x="66" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#DCFCE7">музыка (дакинг)</text>
  <rect x="180" y="294" width="230" height="18" rx="3" fill="#1D4ED8"/><text x="188" y="307" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#DBEAFE">голос за кадром 🤖</text>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;414 0" dur="5s" repeatCount="indefinite"/>
    <polygon points="53,208 65,208 59,218" fill="#EF4444"/>
    <rect x="57" y="212" width="3" height="102" fill="#EF4444"/>
  </g>

  <text x="250" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#E4E4E7" text-anchor="middle">🏆 Мой ролик: всё вместе → экспорт для YouTube и Shorts</text>
  <text x="250" y="366" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#A1A1AA" text-anchor="middle">финал модуля: организуй проект (бины) → собери → выведи под платформу</text>
</svg>
