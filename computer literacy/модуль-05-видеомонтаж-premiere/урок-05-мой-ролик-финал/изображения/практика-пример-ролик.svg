<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="phone"><rect x="196" y="24" width="108" height="192" rx="14"/></clipPath>
    <linearGradient id="vlogBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#DB2777"/></linearGradient>
  </defs>

  <rect width="500" height="400" fill="#1E1E1E"/>
  <text x="250" y="16" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#A1A1AA" text-anchor="middle">Программа · вертикаль 9:16 (Shorts/Reels)</text>

  <!-- phone frame -->
  <rect x="190" y="18" width="120" height="204" rx="20" fill="#0B1220" stroke="#3F3F46" stroke-width="3"/>
  <g clip-path="url(#phone)">
    <rect x="196" y="24" width="108" height="192" fill="url(#vlogBg)"/>
    <!-- scene -->
    <circle cx="250" cy="90" r="26" fill="#FCD9B8"/><path d="M226,84 q24,-26 48,0 q-4,-16 -24,-16 q-20,0 -24,16 z" fill="#3F2A55"/>
    <rect x="232" y="116" width="36" height="60" rx="10" fill="#F59E0B"/>
    <!-- big number title (Топ-5) -->
    <text x="250" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#FDE047" text-anchor="middle" stroke="#7C2D12" stroke-width="1">ТОП-5</text>
    <!-- rank badge -->
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;1.12 1.12;1 1" dur="1.1s" repeatCount="indefinite" additive="sum"/>
      <circle cx="285" cy="150" r="16" fill="#EF4444"/>
      <text x="285" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">1</text>
    </g>
    <!-- caption/subtitle -->
    <rect x="206" y="188" width="88" height="16" rx="3" fill="#000" opacity="0.5"/>
    <text x="250" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">а на первом месте…</text>
    <!-- like/subscribe hint -->
    <text x="285" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="16" text-anchor="middle">❤️</text>
  </g>

  <!-- format note -->
  <text x="250" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1" text-anchor="middle">выбери формат: 📱 вертикаль (Shorts) или 🖥 горизонталь (YouTube)</text>

  <!-- mini timeline -->
  <rect x="70" y="252" width="360" height="88" rx="8" fill="#141414"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#D4D4D8" text-anchor="middle">
    <rect x="76" y="260" width="30" height="16" rx="3" fill="#27272A"/><text x="91" y="272">V2</text>
    <rect x="76" y="280" width="30" height="16" rx="3" fill="#27272A"/><text x="91" y="292">V1</text>
    <rect x="76" y="300" width="30" height="16" rx="3" fill="#27272A"/><text x="91" y="312">A1</text>
  </g>
  <rect x="110" y="260" width="314" height="16" rx="3" fill="#F59E0B"/><text x="118" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#431407">титры-номера + голос за кадром</text>
  <rect x="110" y="280" width="314" height="16" rx="3" fill="#14B8A6"/><text x="118" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#042F2E">клипы в ритм (топ-5 / влог / мем)</text>
  <rect x="110" y="300" width="314" height="16" rx="3" fill="#166534"/><text x="118" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#DCFCE7">музыка (дакинг)</text>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;314 0" dur="4.5s" repeatCount="indefinite"/>
    <polygon points="105,254 115,254 110,263" fill="#EF4444"/>
    <rect x="108" y="257" width="3" height="62" fill="#EF4444"/>
  </g>

  <text x="250" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#E4E4E7" text-anchor="middle">Пример практики: свой ролик (влог / обзор / ТОП-5 / мем) для канала</text>
  <text x="250" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#A1A1AA" text-anchor="middle">собери все навыки модуля и опубликуй + защити</text>
</svg>
