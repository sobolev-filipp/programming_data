<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="monT"><rect x="60" y="20" width="380" height="176" rx="8"/></clipPath>
    <linearGradient id="skyT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0EA5E9"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient>
    <path id="run" d="M80,120 L420,120"/>
  </defs>

  <rect width="500" height="400" fill="#1E1E1E"/>

  <!-- ===== PROGRAM MONITOR ===== -->
  <rect x="60" y="20" width="380" height="176" rx="8" fill="#0B1220"/>
  <g clip-path="url(#monT)">
    <rect x="60" y="20" width="380" height="176" fill="url(#skyT)"/>
    <rect x="60" y="158" width="380" height="38" fill="#0369A1"/>
    <!-- speed badges -->
    <g>
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.16;0.20;0.80;0.84;1" values="1;1;0;0;1;1"/>
      <text x="250" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#FDE047" text-anchor="middle">⏩ быстро 200%</text>
    </g>
    <g>
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" keyTimes="0;0.18;0.22;0.80;0.84;1" values="0;0;1;1;0;0"/>
      <text x="250" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#A7F3D0" text-anchor="middle">🐌 слоу-мо 40%</text>
    </g>
    <!-- running comet with variable speed (fast → slow → fast) -->
    <g>
      <animateMotion dur="5s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0.4;0.6;1" keyTimes="0;0.18;0.82;1">
        <mpath xlink:href="#run"/>
      </animateMotion>
      <ellipse cx="-22" cy="0" rx="22" ry="5" fill="#FDE047" opacity="0.5"/>
      <circle cx="0" cy="0" r="13" fill="#FDE047"/>
      <circle cx="-4" cy="-3" r="4" fill="#FFFDE7"/>
    </g>
  </g>
  <rect x="60" y="20" width="380" height="176" rx="8" fill="none" stroke="#3F3F46" stroke-width="2"/>
  <text x="66" y="14" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#A1A1AA">Программа · один момент — разной скоростью</text>

  <!-- ===== TIMELINE with SPEED RAMP ===== -->
  <rect x="16" y="214" width="468" height="150" rx="8" fill="#141414"/>
  <rect x="20" y="240" width="40" height="52" rx="4" fill="#27272A"/><text x="40" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#D4D4D8" text-anchor="middle">V1</text>

  <!-- clip with time-remapping rubber band -->
  <rect x="61" y="240" width="408" height="52" rx="4" fill="#7C3AED"/>
  <text x="70" y="286" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#EDE9FE">клип · Изменение времени (Speed Ramp)</text>
  <!-- speed rubber band: high(fast) → dip(slow) → high(fast) -->
  <polyline points="61,250 150,250 205,278 300,278 355,250 469,250" fill="none" stroke="#FDE047" stroke-width="3"/>
  <g fill="#FDE047">
    <circle cx="150" cy="250" r="4"/><circle cx="205" cy="278" r="4"/><circle cx="300" cy="278" r="4"/><circle cx="355" cy="250" r="4"/>
  </g>
  <text x="105" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#FDE047" text-anchor="middle">200%</text>
  <text x="252" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#FDE047" text-anchor="middle">40% слоу-мо</text>
  <text x="412" y="246" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#FDE047" text-anchor="middle">200%</text>

  <!-- playhead -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;408 0" dur="5s" repeatCount="indefinite"/>
    <polygon points="55,220 67,220 61,230" fill="#EF4444"/>
    <rect x="59" y="224" width="3" height="76" fill="#EF4444"/>
  </g>

  <text x="250" y="332" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#E4E4E7" text-anchor="middle">⚡ Повелитель времени: плавный speed-ramp — разгон → слоу-мо → разгон</text>
  <text x="250" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#A1A1AA" text-anchor="middle">жёлтая «резинка» = скорость клипа: выше — быстрее, ниже — медленнее</text>
</svg>
