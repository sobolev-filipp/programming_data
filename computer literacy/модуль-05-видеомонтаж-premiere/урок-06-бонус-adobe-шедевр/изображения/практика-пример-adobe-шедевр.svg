<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="ph2"><rect x="196" y="30" width="108" height="192" rx="16"/></clipPath>
    <linearGradient id="petBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#0E7490"/></linearGradient>
  </defs>

  <rect width="500" height="400" fill="#1E1E1E"/>
  <text x="250" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#E4E4E7" text-anchor="middle">Твой бренд, собранный из всех программ</text>

  <!-- phone with final promo -->
  <rect x="190" y="24" width="120" height="204" rx="22" fill="#0B1220" stroke="#3F3F46" stroke-width="3"/>
  <g clip-path="url(#ph2)">
    <rect x="196" y="30" width="108" height="192" fill="url(#petBg)"/>
    <!-- logo (Ai) -->
    <circle cx="250" cy="70" r="20" fill="#FDE047"/><path d="M242,66 a3,3 0 0 1 6,0 M252,66 a3,3 0 0 1 6,0 M244,74 q6,7 12,0" stroke="#7C2D12" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="250" y="104" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">ЛАПКА 🐾</text>
    <!-- mascot cat waving (An) -->
    <ellipse cx="250" cy="170" rx="26" ry="24" fill="#F59E0B"/><path d="M230,152 l-4,-14 12,6 z M270,152 l4,-14 -12,6 z" fill="#F59E0B"/>
    <circle cx="242" cy="166" r="3" fill="#1E293B"/><circle cx="258" cy="166" r="3" fill="#1E293B"/>
    <g><animateTransform attributeName="transform" type="rotate" values="-18 276 176;20 276 176;-18 276 176" dur="0.9s" repeatCount="indefinite"/><line x1="276" y1="176" x2="290" y2="160" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/></g>
    <!-- subtitle -->
    <rect x="206" y="196" width="88" height="16" rx="3" fill="#000" opacity="0.45"/>
    <text x="250" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">канал про питомцев!</text>
  </g>

  <!-- pipeline chips (left) -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">
    <rect x="24" y="70" width="140" height="30" rx="8" fill="#2A1A00" stroke="#FF9A00" stroke-width="1.5"/><rect x="32" y="76" width="18" height="18" rx="4" fill="#FF9A00"/><text x="41" y="90" font-size="10" fill="#2A1A00" text-anchor="middle">Ai</text><text x="58" y="90" fill="#FFD79A">логотип 🐾</text><text x="150" y="90" fill="#4ADE80">✓</text>
    <rect x="24" y="108" width="140" height="30" rx="8" fill="#001A2E" stroke="#31A8FF" stroke-width="1.5"/><rect x="32" y="114" width="18" height="18" rx="4" fill="#31A8FF"/><text x="41" y="128" font-size="10" fill="#001A2E" text-anchor="middle">Ps</text><text x="58" y="128" fill="#9DD4FF">обложка</text><text x="150" y="128" fill="#4ADE80">✓</text>
    <rect x="24" y="146" width="140" height="30" rx="8" fill="#2A0018" stroke="#EB4B98" stroke-width="1.5"/><rect x="32" y="152" width="18" height="18" rx="4" fill="#EB4B98"/><text x="41" y="166" font-size="9" fill="#2A0018" text-anchor="middle">An</text><text x="58" y="166" fill="#F9A8D4">заставка</text><text x="150" y="166" fill="#4ADE80">✓</text>
  </g>
  <!-- pipeline chip (right, Premiere = сборка) -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">
    <rect x="336" y="108" width="140" height="30" rx="8" fill="#1A0A2E" stroke="#C084FC" stroke-width="1.5"/><rect x="344" y="114" width="18" height="18" rx="4" fill="#C084FC"/><text x="353" y="128" font-size="10" fill="#1A0A2E" text-anchor="middle">Pr</text><text x="370" y="128" fill="#DDD0FC">монтаж + звук</text></g>
  <text x="406" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#86EFAC" text-anchor="middle">→ экспорт MP4</text>

  <!-- mini timeline -->
  <rect x="70" y="248" width="360" height="70" rx="8" fill="#141414"/>
  <rect x="78" y="256" width="344" height="16" rx="3" fill="#F59E0B"/><text x="86" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#431407">заставка (Animate) + титры + логотип</text>
  <rect x="78" y="276" width="344" height="16" rx="3" fill="#14B8A6"/><text x="86" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#042F2E">клипы про питомца в ритм + слоу-мо</text>
  <rect x="78" y="296" width="344" height="16" rx="3" fill="#166534"/><text x="86" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#DCFCE7">музыка + голос за кадром (дакинг)</text>

  <text x="250" y="342" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#E4E4E7" text-anchor="middle">Пример практики: промо своего бренда/канала («ЛАПКА»)</text>
  <text x="250" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#A1A1AA" text-anchor="middle">свой логотип + обложка + анимация + монтаж в едином стиле</text>
  <text x="250" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#71717A" text-anchor="middle">переиспользуй свои работы из Модулей 2–4</text>
</svg>
