<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Цвет и хромакей</title>
<style>
  :root{
    --bg1:#0EA5E9; --bg2:#F97316; --card:#ffffff; --ink:#0f172a;
    --accent:#0891B2; --ok:#16a34a; --bad:#dc2626; --soft:#cffafe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Почему фон для хромакея делают зелёным?",
   a:["Он красивый","Этого цвета нет на коже и одежде — легко убрать только его","Он дешёвый","Так теплее"],c:1,
   e:"Компьютер убирает один цвет; зелёный далёк от тонов кожи."},
  {q:"Каким эффектом убирают зелёный фон?",
   a:["Lumetri","Ultra Key (Кеинг)","Наплыв","Оптический поток"],c:1,
   e:"Ultra Key «выбивает» выбранный цвет и делает его прозрачным."},
  {q:"Как «сказать» программе, какой цвет убрать?",
   a:["Пипеткой по зелёному («Цвет ключа»)","Клавишей M","Экспортом","Реверсом"],c:0,
   e:"Пипетка берёт цвет фона — его и удаляем."},
  {q:"Куда кладут фон-мир относительно героя?",
   a:["На ту же дорожку","На дорожку ниже (V1), герой сверху (V2)","В аудио","В титры"],c:1,
   e:"Убрав зелёный, за героем видно клип с нижней дорожки."},
  {q:"Как убрать зелёную каёмку по контуру героя?",
   a:["Громче звук","Сжатие (Choke) + Подавление разлива","Реверс","Больше насыщенности"],c:1,
   e:"Choke подтягивает край, Подавление разлива убирает зелёный отсвет."},
  {q:"Какой панелью красят цвет (грейд)?",
   a:["«Цвет Lumetri»","«Ultra Key»","«Проект»","«Эффекты звука»"],c:0,
   e:"Lumetri: баланс белого, контраст, круги, виньетка, LUT."},
  {q:"Что такое teal&orange?",
   a:["Два перехода","Тёплый герой (оранж) + холодный фон/тени (бирюза)","Скорость","Титр"],c:1,
   e:"Классический киношный контраст тёплого и холодного."},
  {q:"Что делает виньетка?",
   a:["Ускоряет","Затемняет края — взгляд собирается в центр","Убирает звук","Режет клип"],c:1,
   e:"Тёмные углы придают «дорогой», киношный вид."},
  {q:"Зачем нужен корректирующий слой?",
   a:["Для звука","Покрасить все клипы разом одним слоем","Для титра","Для реверса"],c:1,
   e:"Правишь один слой — меняется весь ролик; удобно и быстро."},
  {q:"Куда класть корректирующий слой?",
   a:["Под клипы","Сверху клипов (иначе не красит)","В аудио","Всё равно"],c:1,
   e:"Он влияет на то, что под ним, — значит, должен быть выше."},

  {q:"😄 Убрал зелёный — а у героя зелёная каёмка по краю! Что сделать?",
   a:["Громче музыку","Сжатие (Choke) + Подавление разлива","Реверс","Ещё титр"],c:1,
   e:"Эти настройки подчищают контур от зелёного."},
  {q:"😄 Задрал насыщенность на максимум — лица как апельсины! Что делать?",
   a:["Оставить","Убавить насыщенность","Добавить виньетку","Ускорить"],c:1,
   e:"Насыщенность — чуть-чуть; кожа не должна «гореть»."},
  {q:"😄 Сделал корректирующий слой, а цвет не меняется. Почему?",
   a:["Сломался Premiere","Слой под клипами — нужно поднять наверх","Нет звука","Мало кадров"],c:1,
   e:"Корректирующий слой красит только то, что НИЖЕ него."},

  {q:"🤔 Почему teal&orange так нравится глазу?",
   a:["Так модно","Тёплая кожа и холодные тени дают сильный приятный контраст","Ярче экран","Быстрее рендер"],c:1,
   e:"Контраст тёплого/холодного выделяет героя — «как в кино»."},
  {q:"🤔 Почему для чистого ключа нужен ровный яркий зелёный фон?",
   a:["Так красивее","Убирается один цвет; пёстрый/тёмный фон уберётся дырками","Меньше весит","Быстрее грузит"],c:1,
   e:"Ровный цвет — компьютер точно понимает, что удалять."},
  {q:"🤔 Почему телепорт выглядит «наклеенным», если не подогнать свет?",
   a:["Экран плохой","Герой по свету/цвету не совпадает с фоном — мозг замечает","Мало кадров","Нет звука"],c:1,
   e:"Подгон яркости и оттенка героя под фон делает сцену цельной."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🎨🪄 Цвет и хромакей</h1>
    <div class="sub">Викторина по уроку «Киномагия: цвет + телепорт»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты мастер цвета и телепорта! 🪄';}
  else if(pct>=70){em='🎉';msg='Отлично! Хромакей, teal&orange и корр. слой — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Помни: пипетка по зелёному, Choke от каёмки, слой сверху.';}
  else {em='💪';msg='Начало есть! Перечитай про Ultra Key и Lumetri.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
