<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="monK"><rect x="60" y="18" width="380" height="176" rx="8"/></clipPath>
    <linearGradient id="spaceK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1030"/><stop offset="1" stop-color="#3B1E6E"/></linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.5" r="0.75"><stop offset="0.55" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity="0.7"/></radialGradient>
    <linearGradient id="tealTint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F59E0B" stop-opacity="0.12"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0.22"/></linearGradient>
  </defs>

  <rect width="500" height="400" fill="#1E1E1E"/>

  <text x="66" y="12" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#A1A1AA">Программа · телепорт + цветокор</text>
  <rect x="60" y="18" width="380" height="176" rx="8" fill="#0B1220"/>
  <g clip-path="url(#monK)">
    <!-- green screen bg (phase A) -->
    <rect x="60" y="18" width="380" height="176" fill="#22C55E">
      <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.28;0.32;1" values="1;1;0;0"/>
    </rect>
    <!-- space bg (phase B+C) -->
    <g>
      <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.28;0.32;1" values="0;0;1;1"/>
      <rect x="60" y="18" width="380" height="176" fill="url(#spaceK)"/>
      <g fill="#FDE68A"><circle cx="110" cy="50" r="2.5"/><circle cx="160" cy="80" r="1.8"/><circle cx="380" cy="45" r="2.5"/><circle cx="410" cy="90" r="1.8"/><circle cx="95" cy="120" r="1.8"/><circle cx="350" cy="140" r="2"/><circle cx="300" cy="40" r="1.6"/></g>
      <circle cx="130" cy="150" r="18" fill="#FBBF24" opacity="0.9"/>
    </g>

    <!-- character NEUTRAL (phase A+B) -->
    <g>
      <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.58;0.62;1" values="1;1;0;0"/>
      <ellipse cx="250" cy="178" rx="40" ry="10" fill="#000" opacity="0.2"/>
      <rect x="228" y="112" width="44" height="62" rx="12" fill="#64748B"/>
      <circle cx="250" cy="92" r="24" fill="#94A3B8"/><circle cx="250" cy="92" r="17" fill="#CBD5E1"/>
      <rect x="234" y="130" width="8" height="34" rx="4" fill="#64748B"/><rect x="258" y="130" width="8" height="34" rx="4" fill="#64748B"/>
    </g>
    <!-- character GRADED (phase C) — warmer, teal shadows -->
    <g>
      <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.58;0.62;1" values="0;0;1;1"/>
      <ellipse cx="250" cy="178" rx="40" ry="10" fill="#000" opacity="0.3"/>
      <rect x="228" y="112" width="44" height="62" rx="12" fill="#3F6D7A"/>
      <circle cx="250" cy="92" r="24" fill="#7FB0BF"/><circle cx="250" cy="92" r="17" fill="#FCD9B8"/>
      <rect x="234" y="130" width="8" height="34" rx="4" fill="#3F6D7A"/><rect x="258" y="130" width="8" height="34" rx="4" fill="#3F6D7A"/>
    </g>

    <!-- grade overlay: teal tint + vignette (phase C) -->
    <g>
      <animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.58;0.62;1" values="0;0;1;1"/>
      <rect x="60" y="18" width="380" height="176" fill="url(#tealTint)"/>
      <rect x="60" y="18" width="380" height="176" fill="url(#vign)"/>
    </g>

    <!-- phase labels -->
    <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">
      <text x="250" y="40" fill="#052E16"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.26;0.3;1" values="1;1;0;0"/>1 · зелёный фон 🟩</text>
      <text x="250" y="40" fill="#E0E7FF"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.3;0.34;0.56;0.6;1" values="0;0;1;1;0;0"/>2 · хромакей: фон убрали 🌌</text>
      <text x="250" y="40" fill="#FDE68A"><animate attributeName="opacity" dur="7.5s" repeatCount="indefinite" keyTimes="0;0.6;0.64;1" values="0;0;1;1"/>3 · цветокор teal&amp;orange 🎨</text>
    </g>
  </g>
  <rect x="60" y="18" width="380" height="176" rx="8" fill="none" stroke="#3F3F46" stroke-width="2"/>

  <!-- ===== mini timeline ===== -->
  <rect x="16" y="204" width="468" height="118" rx="8" fill="#141414"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#D4D4D8" text-anchor="middle">
    <rect x="20" y="216" width="38" height="24" rx="3" fill="#27272A"/><text x="39" y="231">V3</text>
    <rect x="20" y="246" width="38" height="24" rx="3" fill="#27272A"/><text x="39" y="261">V2</text>
    <rect x="20" y="276" width="38" height="24" rx="3" fill="#27272A"/><text x="39" y="291">V1</text>
  </g>
  <rect x="61" y="216" width="408" height="24" rx="3" fill="#F59E0B"/><text x="70" y="231" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#431407">Корректирующий слой · Lumetri: teal&amp;orange + виньетка</text>
  <rect x="61" y="246" width="408" height="24" rx="3" fill="#7C3AED"/><text x="70" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#EDE9FE">герой · эффект Ultra Key (выбили зелёный)</text>
  <rect x="61" y="276" width="408" height="24" rx="3" fill="#1D4ED8"/><text x="70" y="291" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#DBEAFE">фон: космос 🌌</text>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;408 0" dur="7.5s" repeatCount="indefinite"/>
    <polygon points="55,208 67,208 61,218" fill="#EF4444"/>
    <rect x="59" y="212" width="3" height="92" fill="#EF4444"/>
  </g>

  <text x="250" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#E4E4E7" text-anchor="middle">🚀 «Я на другой планете»: зелёный фон → космос + цветокор teal&amp;orange</text>
  <text x="250" y="363" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#A1A1AA" text-anchor="middle">герой (V2) на фоне (V1); корректирующий слой (V3) красит всё разом</text>
</svg>
