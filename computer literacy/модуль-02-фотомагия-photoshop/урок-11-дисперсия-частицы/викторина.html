<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Дисперсия</title>
<style>
  :root{
    --bg1:#450a0a; --bg2:#b91c1c; --card:#ffffff; --ink:#1e293b;
    --accent:#dc2626; --ok:#16a34a; --bad:#dc2626; --soft:#fee2e2;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Зачем нужны ДВА слоя (герой + частицы)?",
   a:["Для веса файла","Один целый — прячем частицами, из второго — проявляем летящую пыль","Для цвета","Просто так"],c:1,
   e:"Верхний «герой» рассыпаем чёрной кистью, нижний «частицы» проявляем белой — вместе создаётся распад."},
  {q:"Каким цветом кисти ПРЯЧЕМ героя по его маске?",
   a:["Белым","Чёрным","Красным","Синим"],c:1,
   e:"🖤 Чёрное на маске прячет — герой «рассыпается» там, где красишь."},
  {q:"Каким цветом ПРОЯВЛЯЕМ летящие частицы?",
   a:["Чёрным","Белым","Серым","Зелёным"],c:1,
   e:"🤍 Белое показывает — из скрытого слоя «частицы» проступают кусочки."},
  {q:"Что делаем с маской слоя «частицы» ПЕРЕД проявлением белым?",
   a:["Ничего","Делаем её чёрной (Ctrl+I) — весь слой спрятан","Удаляем","Красим красным"],c:1,
   e:"Сначала прячем весь слой (Ctrl+I → чёрная маска), потом белой кистью проявляем частицы."},
  {q:"Чем создать «материал»-шлейф для частиц?",
   a:["Ластиком","Пластикой — растянуть край в сторону разлёта","Текстом","Рамкой"],c:1,
   e:"Пластика размазывает край в струи — из них кисть «вытянет» летящие кусочки."},
  {q:"Какой кистью делают частицы?",
   a:["Круглой жёсткой","Специальной кистью-частицы (брызги/пыль/осколки)","Ластиком","Штампом"],c:1,
   e:"Кисть-частицы даёт рваные органичные кусочки. Круглая — ровные «дырки»."},
  {q:"Как загрузить кисть-частицы в Photoshop?",
   a:["Файл → Открыть","Окно → Кисти → меню → «Импорт кистей…» (.abr)","Ctrl+S","Фильтр"],c:1,
   e:"Панель «Кисти» → меню в углу → «Импорт кистей» → выбрать скачанный .abr."},
  {q:"Куда должны лететь частицы?",
   a:["В разные стороны","В одну сторону — единый «ветер»","Вниз и вверх сразу","Никуда"],c:1,
   e:"Единое направление разлёта = правдоподобно. Врозь — «взрыв салата»."},
  {q:"Где должен быть распад, а где — целое?",
   a:["Везде поровну","Распад у одного края, вторая часть целая","Только по центру","Только внизу"],c:1,
   e:"Сила эффекта — в контрасте: целая фигура ↔ рассыпающийся край."},
  {q:"Что даёт «Рассеивание» кисти (F5)?",
   a:["Меняет цвет","Раскидывает частицы вокруг за один мазок","Сохраняет","Размывает всё"],c:1,
   e:"«Рассеивание» + «Динамика формы» = облако разнокалиберных частиц одним движением."},

  {q:"😄 Рассыпал ВСЕГО героя в точку — никого не узнать. Совет?",
   a:["Так эпичнее","Оставь целую часть, распад — у края","Ещё мельче","Удали"],c:1,
   e:"Без целой части нет контраста. Рассыпаем только край."},
  {q:"😄 Частицы летят в разные стороны — как взрыв салата. Что не так?",
   a:["Всё норм","Держи одно направление («ветер»)","Больше кистей","ПК виноват"],c:1,
   e:"Единое направление разлёта — главное для правдоподобия."},
  {q:"😄 Маска «частиц» ничего не проявляет белой кистью. Что забыл?",
   a:["Сохранить","Сделать маску чёрной (Ctrl+I) перед белой кистью","Выключить ПК","Ничего"],c:1,
   e:"Сначала прячем слой (Ctrl+I), потом белым «вытаскиваем» частицы."},

  {q:"🤔 В чём главная сила эффекта дисперсии?",
   a:["В количестве частиц","В контрасте «целая фигура ↔ распад у края»","В ярких цветах","В размере файла"],c:1,
   e:"Целое рядом с распадающимся читается драматичнее любого хаоса."},
  {q:"🤔 Как сделать разлёт естественным, а не «наклейкой точек»?",
   a:["Одинаковые точки","Разный размер + Рассеивание + одно направление","Больше чёрного","Всё крупнее"],c:1,
   e:"Разнокалиберные частицы в одном направлении = настоящая пыль на ветру."},
  {q:"🤔 Жёсткой круглой кистью выходят ровные «дырки». Почему не похоже на пыль?",
   a:["Экран старый","Нужна кисть-частицы (брызги/пыль) с рваным краем","Мало памяти","Формат не тот"],c:1,
   e:"Форма кисти решает всё: у частиц рваный органичный край, у круглой — ровный."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>💥 Дисперсия</h1>
    <div class="sub">Викторина по уроку «Распад на частицы»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты владеешь распадом — щёлкни пальцами! 💥';}
  else if(pct>=70){em='🎉';msg='Отлично! Две маски и кисть-частицы — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: чёрным прячем, белым проявляем, всё в одну сторону.';}
  else {em='💪';msg='Начало есть! Перечитай про две маски и кисть-частицы.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
