<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Слои, режимы наложения и обмен лицами</title>
<style>
  :root{
    --bg1:#3b1256; --bg2:#b1471f; --card:#ffffff; --ink:#1e293b;
    --accent:#9333ea; --ok:#16a34a; --bad:#dc2626; --soft:#f3e8ff;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Какой режим наложения ЗАТЕМНЯЕТ картинку (белое исчезает)?",
   a:["Экран","Умножение","Обычный","Осветление"],c:1,
   e:"Умножение (Multiply) перемножает цвета — картинка темнеет, белое пропадает. Хорош для теней."},
  {q:"Какой режим наложения ОСВЕТЛЯЕТ картинку (чёрное исчезает)?",
   a:["Умножение","Экран","Затемнение","Обычный"],c:1,
   e:"Экран (Screen) осветляет, чёрное пропадает. Им добавляют свет, блики, свечение."},
  {q:"Что делают режимы Перекрытие и Мягкий свет?",
   a:["Удаляют слой","Усиливают контраст и цвет","Сохраняют файл","Меняют размер"],c:1,
   e:"Перекрытие/Мягкий свет делают картинку контрастнее и сочнее; Мягкий свет — нежнее."},
  {q:"Какая клавиша делает ДУБЛИКАТ активного слоя?",
   a:["Ctrl+J","Ctrl+S","Ctrl+D","Ctrl+T"],c:0,
   e:"Ctrl+J — точная копия слоя. Ctrl+D снимает выделение, Ctrl+T — трансформирование."},
  {q:"Почему фоновый слой «Фон» нельзя двигать и смешивать?",
   a:["Он сломан","Он заблокирован (замок); нужно его разблокировать","Мало памяти","Он невидимый"],c:1,
   e:"У фонового слоя стоит замок. Клик по замку превращает его в обычный «Слой 0» — тогда всё можно."},
  {q:"Зачем перед выравниванием ронять непрозрачность лица до 30%?",
   a:["Для красоты","Чтобы сквозь лицо видеть голову и совместить по глазам","Чтобы сохранить","Чтобы удалить фон"],c:1,
   e:"Полупрозрачность работает как калька: видишь оба лица и накладываешь глаза к глазам."},
  {q:"Что делает Ctrl+клик по МИНИАТЮРЕ слоя «Лицо»?",
   a:["Удаляет слой","Загружает форму лица как выделение","Копирует цвет","Сохраняет"],c:1,
   e:"Ctrl+клик по миниатюре выделяет всё непрозрачное на слое — форму лица. Дальше её можно сжать/вырезать."},
  {q:"Каким приёмом бесшовно сшить кожу лица и головы по тону/цвету?",
   a:["Ластиком","Автоналожение слоёв (Панорама + плавные тона)","Рамкой","Текстом"],c:1,
   e:"Редактирование → Автоналожение слоёв само создаёт маски и выравнивает тон/цвет — шов исчезает."},
  {q:"Автоналожение слоёв — это…",
   a:["Нейросеть/ИИ","Обычный алгоритм (им можно пользоваться в нашем курсе)","Кисть","Фильтр размытия"],c:1,
   e:"Это честный алгоритм сшивки (есть давно), а не ИИ. Мы сами вырезали и подготовили слои."},
  {q:"Зачем перед автоналожением команда «Выделение → Модификация → Сжать»?",
   a:["Уменьшить файл","Убрать под лицом кожу с небольшим запасом (дырку под лицо)","Повернуть","Сохранить"],c:1,
   e:"Сжать на 8–10 px и Delete на слое тела — образуется «дырка», иначе алгоритму нечего сшивать внахлёст."},
  {q:"Как поднять слой на уровень выше в стопке клавишами?",
   a:["Ctrl+]","Ctrl+S","Alt+клик","Ctrl+E"],c:0,
   e:"Ctrl+] поднимает слой, Ctrl+[ опускает. Порядок решает, что впереди."},
  {q:"Как согласовать свет на лице со светом на голове, не портя пиксели?",
   a:["Стереть ластиком","Слой в режиме Мягкий свет/Перекрытие + кисть белым/чёрным","Сохранить в JPG","Уменьшить фото"],c:1,
   e:"Новый слой в режиме наложения + мягкая кисть белым (свет) и чёрным (тень) — обратимая пересветка."},
  {q:"У штампа вокруг оттиска белый фон. Какой режим наложения уберёт белое?",
   a:["Экран","Умножение","Обычный","Мягкий свет"],c:1,
   e:"Умножение убирает белое — остаётся только тёмный оттиск. Классика для печатей, штампов, надписей со сканов."},
  {q:"Зачем переносить слой в другой файл с зажатым Shift (инструмент Перемещение)?",
   a:["Чтобы быстрее","Чтобы картинка встала точно по центру документа","Чтобы удалить фон","Чтобы повернуть"],c:1,
   e:"Shift при переносе ставит слой ровно по центру нового документа — не нужно ловить вручную."},
  {q:"Как сделать белую рамку вокруг фото на открытке?",
   a:["Нарисовать кистью","Стиль слоя → Обводка (Размер, Положение «Внутри», белый цвет)","Ластиком","Волшебной палочкой"],c:1,
   e:"Обводка — это стиль слоя: живёт отдельно и всегда редактируется, пиксели не портит."},
  {q:"Что делает Фильтр → Рендеринг → Облака на пустом слое?",
   a:["Открывает фото облаков из интернета","Сам генерирует облака из двух выбранных цветов","Удаляет небо","Размывает слой"],c:1,
   e:"Photoshop рисует облака математикой из переднего и заднего цвета — «процедурная» текстура, без кисти."},

  {q:"😄 Крутишь режимы на единственном слое «Фон» — ничего не меняется. Почему?",
   a:["Фото проклято","Под слоем нет другого слоя — смешивать не с чем","Мало очков","Экран старый"],c:1,
   e:"Режим наложения смешивает слой с тем, что ПОД ним. Сделай Ctrl+J — появится с чем смешивать."},
  {q:"😄 Лицо вклеил, а оно как наклейка с ободком. Что забыл?",
   a:["Сохранить","Сшить кожу (автоналожение или маска-переход)","Выключить ПК","Купить новый экран"],c:1,
   e:"Голая вставка = наклейка. Автоналожение или мягкая маска убирают край и сводят тон."},
  {q:"😄 Друг просит вклеить его лицо на фото знаменитого блогера. Твой ответ?",
   a:["Конечно, погнали","Живых знаменитостей не берём — давай друга или старинную картину","Только за деньги","Нельзя вообще ничего"],c:1,
   e:"Чужих известных людей и бренды не используем. Друзья (с согласия) и картины-общественное достояние — можно."},

  {q:"🤔 Хочешь оставить голове её волосы, а взять только лицо друга. Что обводить Лассо у донора?",
   a:["Всё фото","Только лицо: брови-щёки-подбородок, без волос и ушей","Только волосы","Фон"],c:1,
   e:"Волосы и уши берём от основы — поэтому Лассо ведём по лицу, не захватывая их."},
  {q:"🤔 Автоналожение недоступно (серое). Скорее всего…",
   a:["Сломался Photoshop","Не выделены минимум ДВА слоя","Нет интернета","Слишком большой экран"],c:1,
   e:"Команде нужно ≥2 выделенных слоя (Лицо + Тело). Ctrl+клик по второму слою — и она станет активной."},
  {q:"🤔 После обмена лицо чуть светлее головы. Быстрый способ поправить?",
   a:["Переделать всё","Слой Умножение обтравочно к лицу — мягко затемнить","Сохранить в PNG","Увеличить холст"],c:1,
   e:"Режим Умножение затемняет; обтравочный к лицу слой с лёгкой кистью подружит яркости."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🔀 Слои и обмен лицами</h1>
    <div class="sub">Викторина по уроку 3</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Слои, режимы наложения и обмен лицами — всё твоё. Ни единого шва! 🎭';}
  else if(pct>=70){em='🎉';msg='Отлично! Автоналожение и режимы наложения в твоих руках.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори про режимы наложения и подготовку слоёв перед автоналожением.';}
  else {em='💪';msg='Начало есть! Перечитай про слои, режимы наложения и автоналожение — и жми Ctrl+Z на ошибки.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
