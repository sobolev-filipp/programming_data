<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Слияние лиц</title>
<style>
  :root{
    --bg1:#3b1256; --bg2:#b1471f; --card:#ffffff; --ink:#1e293b;
    --accent:#9333ea; --ok:#16a34a; --bad:#dc2626; --soft:#f3e8ff;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Зачем при совмещении убавлять непрозрачность верхнего слоя до 50%?",
   a:["Чтобы было красиво","Чтобы сквозь него видеть нижнее лицо и точно совместить черты","Чтобы сохранить","Чтобы удалить фон"],c:1,
   e:"Полупрозрачность работает как калька: видишь оба лица и накладываешь глаза к глазам."},
  {q:"Какой жёсткости брать кисть для плавного перехода между лицами?",
   a:["Жёсткую 100%","Мягкую 0%","Любую","Квадратную"],c:1,
   e:"Мягкая кисть (жёсткость 0%) даёт дымку-переход, а не резкий «шов»."},
  {q:"Что проступит, если закрасить ЧЁРНЫМ по маске верхнего лица (утки)?",
   a:["Ничего","Нижнее лицо (человека)","Чёрное пятно","Фон"],c:1,
   e:"Чёрное прячет верхний слой — сквозь него проступает нижнее лицо человека."},
  {q:"Зачем у кисти низкий Нажим (Flow ~30%)?",
   a:["Чтобы краска ложилась постепенно и переход был плавным","Чтобы быстрее","Для звука","Без разницы"],c:0,
   e:"Малый нажим = краска добавляется по чуть-чуть за несколько проходов — переход мягко нарастает."},
  {q:"Как согласовать цвет утки ТОЛЬКО с уткой, не трогая всё фото?",
   a:["Никак","Сделать коррекцию обтравочной (Alt+клик между слоями)","Стереть фон","Сохранить в JPG"],c:1,
   e:"Обтравочная маска привязывает коррекцию к одному слою — красим только утку."},
  {q:"Как быстро найти резкий «шов» на переходе?",
   a:["Никак","Нажать клавишу \\\\ — маска покажется красным поверх фото","Перезапустить ПК","Сохранить"],c:1,
   e:"Клавиша \\\\ показывает маску красным — сразу видно, где переход резкий."},
  {q:"Какие два фото хорошо сольются в гибрид?",
   a:["Снятые с разных сторон","Похожие по ракурсу и свету (оба анфас)","Разного размера","Размытое и резкое"],c:1,
   e:"Совпадение ракурса и направления света — главное условие, иначе черты не сойдутся."},
  {q:"Спрятал на маске лишнее (пропал нужный глаз). Как вернуть?",
   a:["Начать заново","Нажать X и закрасить это место белым","Стереть ластиком","Сохранить"],c:1,
   e:"Белое на маске показывает. X меняет чёрный/белый — закрасил белым, глаз вернулся."},
  {q:"Чем точно подогнать форму клюва под лицо (для 9–11)?",
   a:["Ластиком","Деформацией (Warp) или Пластикой (Liquify)","Текстом","Рамкой"],c:1,
   e:"Warp тянет за сетку, Пластика мягко сдвигает границы — так дошивают форму."},
  {q:"Пипетка (I) на этом уроке нужна, чтобы…",
   a:["Рисовать","Взять образец цвета кожи и подгонять к нему","Выделять","Сохранять"],c:1,
   e:"Пипеткой берёшь оттенок щеки человека — и подгоняешь под него цвет животного."},

  {q:"😄 Гибрид готов, но посреди лица виден шов. Что делать?",
   a:["Оставить, так авангарднее","Мягкой кистью по маске сгладить переход","Начать заново","Обвести маркером"],c:1,
   e:"Пройди зону шва мягкой кистью малым нажимом — дымка спрячет границу."},
  {q:"😄 Что НЕ поможет сделать плавный переход?",
   a:["Мягкая кисть","Низкий нажим","Жёсткая кисть на 100%","Проверка клавишей \\\\"],c:2,
   e:"Жёсткая кисть оставит резкий край — злейший враг плавного слияния 😅"},
  {q:"😄 Друг слил лицо анфас и морду в профиль. Почему гибрид «поехал»?",
   a:["Фото прокляты","Разный ракурс — черты не совпали","Мало слоёв","ПК устал"],c:1,
   e:"Ракурсы должны совпадать. Анфас клеим к анфас, профиль к профилю."},

  {q:"🤔 Хочешь человеку оставить глаза, а от кота взять усы и нос. Где красить ЧЁРНЫМ по маске кота?",
   a:["По усам и носу","По глазам кота — чтобы проступили глаза человека","Везде","Нигде"],c:1,
   e:"Чёрным прячем то, что НЕ нужно от верхнего слоя. Прячем глаза кота — остаются его усы/нос."},
  {q:"🤔 Переход плавный, а гибрид всё равно как «две картинки». Почему?",
   a:["Мало пикселей","Не согласованы цвет и свет двух лиц","Не сохранил PSD","Старый экран"],c:1,
   e:"Кроме плавного стыка нужен единый цвет и свет — иначе видно, что фрагменты разные."},
  {q:"🤔 Зачем в конце класть Фотофильтр на ВСЕ слои?",
   a:["Для веса файла","Единый оттенок «сшивает» фрагменты в одно целое","Для резкости","Случайно"],c:1,
   e:"Общий тон поверх всего объединяет разные куски в цельное изображение."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🦆🧑 Слияние лиц</h1>
    <div class="sub">Викторина по уроку «Утка-человек» (со смешными вопросами!)</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты сплавишь кого угодно с кем угодно — без единого шва! 🎭';}
  else if(pct>=70){em='🎉';msg='Отлично! Маска-переход в твоих руках. Зверолюди дрожат.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори про мягкую кисть и низкий нажим — и швов не будет.';}
  else {em='💪';msg='Начало есть! Перечитай про маску-переход и жми Ctrl+Z на ошибки.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
