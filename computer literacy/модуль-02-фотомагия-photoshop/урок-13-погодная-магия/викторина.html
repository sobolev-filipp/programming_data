<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Погодная магия</title>
<style>
  :root{
    --bg1:#0f172a; --bg2:#1e40af; --card:#ffffff; --ink:#1e293b;
    --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; --soft:#dbeafe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Из чего «рождается» дождь в Photoshop?",
   a:["Из текста","Из Шума (чёрный слой + Добавить шум)","Из кисти","Из градиента"],c:1,
   e:"Мелкий монохромный шум на чёрном слое — это будущие капли."},
  {q:"Как превратить зерно шума в струи дождя?",
   a:["Резкость","Фильтр → Размытие → Размытие в движении","Ластик","Текст"],c:1,
   e:"«Размытие в движении» под углом 70–80° вытягивает зерно в наклонные струйки."},
  {q:"Какой режим наложения убирает чёрный фон погодного слоя?",
   a:["Умножение","Экран","Обычные","Затемнение"],c:1,
   e:"«Экран» гасит чёрное — остаются светлые струи/снег/дымка поверх фото."},
  {q:"Чем сделать туман?",
   a:["Кистью по точкам","Фильтр → Рендеринг → Облака","Резкостью","Штампом"],c:1,
   e:"Фильтр «Облака» (при чёрно-белых цветах, D) даёт мягкие клубы тумана."},
  {q:"Дождя слишком много. Как проредить?",
   a:["Удалить слой","Ctrl+L (Уровни): чёрный ползунок вправо","Сохранить","Ярче"],c:1,
   e:"Уровнями гасишь слабые струйки — дождь становится реже и чётче."},
  {q:"Дождь и снег в Photoshop — это…",
   a:["Совсем разные приёмы","Один приём с разными настройками","Готовые картинки","Кисти из набора"],c:1,
   e:"Шум → размытие → «Экран». Для снега добавляем Гаусс (круглые точки)."},
  {q:"Что делает Размытие по Гауссу при создании снега?",
   a:["Делает точки круглыми (снежинки)","Стирает снег","Добавляет цвет","Меняет режим"],c:0,
   e:"Лёгкий Гаусс округляет зерно — точки становятся похожи на снежинки."},
  {q:"Где туман должен быть гуще?",
   a:["На лицах спереди","У земли и вдали","Только вверху","Везде поровну"],c:1,
   e:"В жизни туман стелется у земли и в глубине — так и рисуем (по маске)."},
  {q:"Как задать холодное дождливое настроение?",
   a:["Осветлить и добавить жёлтого","Затемнить + добавить синего (Цветовой баланс/Кривые)","Увеличить резкость","Сохранить в JPG"],c:1,
   e:"Пасмурный кадр — тёмный и холодный. Синева в тенях + затемнение."},
  {q:"Зачем погоду держать на ОТДЕЛЬНЫХ слоях?",
   a:["Для веса","Можно включать/выключать и менять, не портя фото","Быстрее","Для цвета"],c:1,
   e:"Отдельные слои = неразрушающе: регулируешь силу и убираешь в любой момент."},

  {q:"😄 Сделал дождь, а вышел чёрный прямоугольник. Что забыл?",
   a:["Сохранить","Режим «Экран»","Купить ПК","Шум"],c:1,
   e:"Без «Экрана» чёрный фон слоя закрывает фото. Ставь «Экран»."},
  {q:"😄 Дождь — сплошная белая стена, сцены не видно. Совет?",
   a:["Так атмосфернее","Проредить Уровнями + убавить «Непрозр.»","Ещё больше дождя","Удалить фото"],c:1,
   e:"Сцену должно быть видно СКВОЗЬ дождь. Прореди и ослабь."},
  {q:"😄 Ливень на солнечном пляжном фото — не верится. Что сделать?",
   a:["Оставить","Сначала приглушить/затемнить кадр","Ярче солнце","Больше дождя"],c:1,
   e:"Погода должна дружить со светом сцены. Пасмурный тон — и дождь уместен."},

  {q:"🤔 Почему дождь делают наклонным (70–80°)?",
   a:["Так модно","Наклон читается как ветер/движение — живее","Быстрее","Меньше весит"],c:1,
   e:"Строго вертикальные струи выглядят мёртво; наклон = ветер и динамика."},
  {q:"🤔 Как придать дождю/снегу глубину?",
   a:["Один слой","Два плана: крупные близкие + мелкие дальние","Больше чёрного","Просто ярче"],c:1,
   e:"Разноразмерные осадки на двух слоях создают объём, как в кино."},
  {q:"🤔 Туман лёг ровной простынёй по всему кадру. Как исправить?",
   a:["Удалить","Маской убрать спереди, оставить гуще вдали/внизу","Сделать ярче","Сохранить"],c:1,
   e:"Маска делает туман неровным и естественным — как в реальности."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🌧 Погодная магия</h1>
    <div class="sub">Викторина по уроку «Дождь, туман, снег, молния»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты повелитель погоды — включай дождь одним слоем! 🌧';}
  else if(pct>=70){em='🎉';msg='Отлично! Дождь, туман и настроение — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: Шум → Размытие в движении → «Экран» → Уровни.';}
  else {em='💪';msg='Начало есть! Перечитай про дождь из шума и режим «Экран».';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
