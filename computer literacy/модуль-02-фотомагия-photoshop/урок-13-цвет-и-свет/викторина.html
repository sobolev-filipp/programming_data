<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Цвет и свет</title>
<style>
  :root{
    --bg1:#0f2440; --bg2:#c2410c; --card:#ffffff; --ink:#1e293b;
    --accent:#0d9488; --ok:#16a34a; --bad:#dc2626; --soft:#ccfbf1;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Ночь — это не просто «темнее». Это…",
   a:["Тёмное + синие тени","Просто чёрный","Ярче и жёлтее","Зелёное"],c:0,
   e:"Настоящая ночь = тёмное + синие тени + тёплые огни. Одной темнотой не обойтись."},
  {q:"Какого цвета делают тени для ночи?",
   a:["Красные","Синие/бирюзовые","Жёлтые","Белые"],c:1,
   e:"Синева в тенях читается как ночь/сумерки."},
  {q:"Какими должны быть огни (окна, фонари) ночью?",
   a:["Синими","Тёплыми (жёлто-оранжевыми)","Зелёными","Чёрными"],c:1,
   e:"Тёплые огни на холодном синем фоне «горят» ярче — красивый контраст."},
  {q:"Что такое teal & orange?",
   a:["Название кисти","Тени холодные (бирюза), света тёплые (оранжевые)","Формат файла","Режим наложения"],c:1,
   e:"Киношная палитра: холодные тени + тёплые света = «дорогая» картинка."},
  {q:"На каком слое/в каком режиме рисуют свет (огни, луну)?",
   a:["Прямо по фото","На новом слое в режиме «Экран»","Ластиком","В режиме «Умножение»"],c:1,
   e:"«Экран» гасит чёрное — остаётся только свечение. Свет всегда отдельным слоем."},
  {q:"Чем сделать лучи света (God rays)?",
   a:["Резкостью","Радиальное размытие («Линейный»/Zoom) от яркого пятна","Ластиком","Текстом"],c:1,
   e:"Яркое пятно + Радиальное размытие «Линейный» = расходящиеся лучи."},
  {q:"Что делает виньетка?",
   a:["Осветляет центр","Затемняет края — собирает взгляд в центр","Меняет цвет","Добавляет шум"],c:1,
   e:"Тёмные края фокусируют внимание на центре — киношный приём."},
  {q:"Чем задают цвет/настроение НЕразрушающе?",
   a:["Ластиком","Корректирующими слоями (◐: Кривые, Цветовой баланс)","Кистью по фото","Штампом"],c:1,
   e:"Корректирующие слои меняют цвет поверх фото — их можно править и выключать."},
  {q:"Как ослабить слишком сильный цветокор?",
   a:["Удалить фото","Убавить «Непрозр.» корректирующего слоя","Сохранить","Ярче"],c:1,
   e:"Непрозрачность слоя плавно уменьшает силу любого эффекта."},
  {q:"Что за окно-«студия цвета» с Экспозицией и Температурой (9–11)?",
   a:["Пластика","Camera Raw (Фильтр → Camera Raw)","Ветер","Облака"],c:1,
   e:"Camera Raw — мощный цветокор в одном окне: экспозиция, тепло/холод, разделение тонов, виньетка."},

  {q:"😄 Сделал «ночь», просто убавив яркость — вышла «серая ночь». Что добавить?",
   a:["Ничего","Синие тени + тёплые огни","Больше чёрного","Ярче"],c:1,
   e:"Темнота без синевы и огней = скучно. Добавь цвет и свет."},
  {q:"😄 Поставил в окна синие лампы — совсем не уютно. Совет?",
   a:["Так модно","Огни делай тёплыми (жёлто-оранжевыми)","Ещё синее","Убрать окна"],c:1,
   e:"Тёплый свет = жизнь и уют, особенно на холодном ночном фоне."},
  {q:"😄 Задавил кадр чёрной виньеткой — видно только «дырку» в центре. Что сделать?",
   a:["Оставить","Сделать виньетку лёгкой (30–50%)","Ещё темнее края","Удалить фото"],c:1,
   e:"Виньетка должна намекать, а не закрывать. Лёгкое затемнение краёв."},

  {q:"🤔 Почему тёплые огни на синем фоне «горят» ярче?",
   a:["Магия","Контраст тёплого и холодного усиливает оба","Экран старый","Формат"],c:1,
   e:"Тёплое рядом с холодным читается сочнее — базовый закон цвета."},
  {q:"🤔 Зачем цвет и свет держать на отдельных слоях?",
   a:["Для веса","Неразрушающе: менять/выключать, не портя фото","Быстрее","Ярче"],c:1,
   e:"Отдельные слои = свобода правок в любой момент."},
  {q:"🤔 Кадр выглядит «дёшево». Что чаще всего добавляет киношности?",
   a:["Больше резкости","Продуманный цвет (teal&orange) + свет + виньетка","Крупнее файл","Другой формат"],c:1,
   e:"Цвет и свет — то, чем «красиво снято» отличается от «дёшево»."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🎬 Цвет и свет</h1>
    <div class="sub">Викторина по уроку «День → ночь»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты колорист — красишь кадр настроением! 🎬';}
  else if(pct>=70){em='🎉';msg='Отлично! День→ночь и teal&orange — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: тени синие, огни тёплые, виньетка лёгкая.';}
  else {em='💪';msg='Начало есть! Перечитай про синие тени и teal&orange.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
