<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Photoshop: слои и коллаж</title>
<style>
  :root{
    --bg1:#4a1d96; --bg2:#db2777; --card:#ffffff; --ink:#1e293b;
    --accent:#7c3aed; --ok:#16a34a; --bad:#dc2626; --soft:#f3e8ff;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что такое «слои» в Photoshop?",
   a:["Кнопки сохранения","Прозрачные плёнки друг на друге","Виды кистей","Цвета"],c:1,
   e:"Слои — стопка прозрачных плёнок. На каждой своё, верхний перекрывает нижний. Это основа Photoshop."},
  {q:"Каким сочетанием трансформировать объект (масштаб, поворот)?",
   a:["Ctrl + T","Ctrl + S","Ctrl + P","Ctrl + O"],c:0,
   e:"Ctrl+T — Free Transform. Тяни за углы — размер, крути — поворот, Enter — применить."},
  {q:"Как быстро сделать копию слоя?",
   a:["Ctrl + Z","Ctrl + J","Ctrl + W","F5"],c:1,
   e:"Ctrl+J дублирует слой. Или зажми Alt и перетащи объект инструментом Перемещение."},
  {q:"В каком формате сохранять, чтобы остались ВСЕ слои (для доработки)?",
   a:[".JPG",".PNG",".PSD",".MP3"],c:2,
   e:".PSD — рабочий файл Photoshop со слоями. Потеряешь его — не сможешь ничего исправить."},
  {q:"Какой формат выбрать, чтобы отправить готовую картинку другу?",
   a:[".PSD",".PNG или .JPG",".EXE",".DOCX"],c:1,
   e:"PNG/JPG — готовая «фотография результата». PSD для этого не подходит (это проект)."},
  {q:"Каким инструментом двигают объекты по холсту?",
   a:["Перемещение (V)","Кисть (B)","Текст (T)","Ластик (E)"],c:0,
   e:"Инструмент Перемещение (клавиша V). Включи «Автовыбор», чтобы кликать прямо по объекту."},
  {q:"Как добавить фото в проект новым слоем?",
   a:["Файл → Печать","Файл → Поместить встроенные","Файл → Закрыть","Фильтр → Размытие"],c:1,
   e:"Файл → Поместить встроенные — картинка появится новым слоем, сразу в рамке трансформации."},
  {q:"Что решает, какой объект окажется впереди, а какой сзади?",
   a:["Размер файла","Порядок слоёв в панели","Цвет объекта","Имя файла"],c:1,
   e:"Кто выше в панели слоёв — тот впереди. Перетаскивай слои вверх/вниз, чтобы менять сцену."},
  {q:"Зачем перед правкой делать ВЫДЕЛЕНИЕ (пунктир-«муравьи»)?",
   a:["Чтобы картинка стала ярче","Чтобы правки касались только выделенной области","Чтобы сохранить файл","Чтобы удалить слой"],c:1,
   e:"Выделение — «рабочая зона». Редактировать можно только внутри пунктира, остальное защищено."},
  {q:"Чем удобен корректирующий слой «Кривые» (как с фарой)?",
   a:["Он навсегда меняет пиксели","Его можно спрятать/удалить — фото вернётся как было","Он уменьшает файл","Он рисует текст"],c:1,
   e:"Корректирующий слой — «правка поверх». Не портит пиксели: убрал слой — и всё как раньше."},
  {q:"Почему на галстуке (обтравочная маска) краска не вылезает за края?",
   a:["Рука не дрожит","Слой показывается только по форме слоя под ним","Кисть волшебная","Так делает JPG"],c:1,
   e:"Обтравочная маска — трафарет: слой виден только там, где есть слой-основа (форма галстука)."},
  {q:"Ты сделал 5 лишних мазков. Как отменить сразу несколько шагов?",
   a:["Закрыть файл","Панель «История» (Окно → История)","Ctrl+S","Нарисовать поверх белым"],c:1,
   e:"Ctrl+Z — шаг назад. А в «Истории» кликни на нужный прошлый шаг и «перепрыгни» на него."},
  {q:"Каким инструментом добавить надпись на пляж или коллаж?",
   a:["Кисть (B)","Текст (T)","Рамка (C)","Масштаб (Z)"],c:1,
   e:"Инструмент «Текст» (T). Текст — отдельный слой, его можно двигать и менять в любой момент."},
  {q:"Овальным выделением обвести идеально круглую фару ИЗ ЦЕНТРА — что зажать?",
   a:["Alt + Shift","Ctrl + S","Tab","Пробел"],c:0,
   e:"Shift — ровный круг, Alt — рост из центра. Вместе (Alt+Shift) — ровный круг из центра."},
  {q:"Быстро менять размер кисти прямо во время рисования — это клавиши…",
   a:["[ и ]","Ctrl и Alt","F1 и F2","W и S"],c:0,
   e:"Скобки [ и ] уменьшают и увеличивают кисть. Размер можно и ползунком, но клавишами — быстрее."},
  {q:"В Photoshop одно действие обычно можно сделать…",
   a:["Только через меню","Только клавишей","Несколькими способами: меню, кнопка или клавиша","Никак"],c:2,
   e:"Меню, кнопка на панели или горячая клавиша ведут к одному результату. Профи выбирают клавиши — быстрее."},
  {q:"На какой клавише «живёт» инструмент Кисть?",
   a:["B","K","P","C"],c:0,
   e:"Кисть — клавиша B (от англ. Brush). Ластик — E, Текст — T, Перемещение — V, Масштаб — Z."},
  {q:"Маленький треугольник ◣ в углу иконки инструмента означает…",
   a:["Инструмент сломан","Под ним спрятана ГРУППА инструментов","Это платно","Инструмент для видео"],c:1,
   e:"Треугольник = скрытая группа. Клик-удержание, Alt+клик или Shift+буква достают спрятанные инструменты."},
  {q:"Панель «Коррекция» нужна, чтобы…",
   a:["Сохранять файлы","Чинить свет и цвет, не портя пиксели","Печатать текст","Рисовать фигуры"],c:1,
   e:"Коррекция (Яркость/Контраст, Кривые, Цветовой тон) правит свет и цвет корректирующим слоем — обратимо."},
  {q:"Кладёшь картинку огня на ЧЁРНОМ фоне на объект. Какой режим наложения уберёт чёрное?",
   a:["Умножение","Экран","Обычные","Затемнение"],c:1,
   e:"«Экран» осветляет и прячет чёрное — остаётся только пламя. «Умножение» наоборот прячет белое (для теней)."},
  {q:"Что делает современная кнопка «Удалить фон» / «Выделить предмет»?",
   a:["Удаляет весь файл","Одним кликом выделяет/убирает фон вокруг объекта","Меняет шрифт","Печатает фото"],c:1,
   e:"Это «умные» помощники: одним нажатием выделяют главный объект или делают фон прозрачным. Край потом дочищают маской."},

  {q:"😄 Ты двигаешь кота, а по экрану едет дом. Что случилось?",
   a:["Photoshop сломался","Выбран не тот слой","Мышка устала","Кот убежал"],c:1,
   e:"Классика! Активен слой дома, а не кота. Всегда смотри, какой слой подсвечен в панели слоёв."},
  {q:"😄 Нужна стая из 50 птиц. Как быстрее всего?",
   a:["Нарисовать каждую вручную","Дублировать слой (Ctrl+J / Alt+тащить)","Скачать 50 фото","Позвать друга"],c:1,
   e:"Одну птицу дублируем много раз и чуть меняем размер/место. Никто не рисует 50 штук вручную 🙂"},
  {q:"😄 Коллаж выглядит «наклеенным стикером». Чего не хватает?",
   a:["Больше текста","Тени под объектом","Рамки","Музыки"],c:1,
   e:"Мягкая тень отдельным слоем мгновенно «сажает» объект в сцену и убирает эффект наклейки."},

  {q:"🤔 На подумать: почему важно сохранять .psd, а не только .png?",
   a:["PSD легче","В PNG нет слоёв — потом ничего не исправишь","PSD красивее","Так модно"],c:1,
   e:"PNG «склеивает» всё в одну картинку. Без PSD ты не сможешь подвинуть или удалить объект."},
  {q:"🤔 На подумать: как сделать, чтобы котёнок казался ГИГАНТСКИМ?",
   a:["Сделать его ярче","Сильно увеличить относительно домов и машин","Повернуть его","Добавить текст «большой»"],c:1,
   e:"Вау-эффект создаёт несоответствие масштабов: маленькие домики рядом с огромным котом."},
  {q:"🤔 На подумать: в какую сторону должна падать тень от объекта?",
   a:["Всегда вниз","В ту же сторону, что и тени на фоне","В любую","К зрителю"],c:1,
   e:"Свет один на всю сцену. Посмотри, куда падают тени на фоне, — туда же клади и свою."},
];

// перемешиваем вопросы, чтобы каждый запуск был свежим
function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🪄 Photoshop: слои и коллаж</h1>
    <div class="sub">Викторина по первому уроку фотомагии</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты уже мастер слоёв. Photoshop тебя боится 😎';}
  else if(pct>=70){em='🎉';msg='Отлично! Слои, трансформация, сохранение — всё в кармане!';}
  else if(pct>=40){em='👍';msg='Неплохо! Ещё разок пройди урок про слои — и будет магия.';}
  else {em='💪';msg='Начало есть! Жми Ctrl+Z на ошибки, перечитай про слои — и снова в бой!';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
