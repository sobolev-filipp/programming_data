<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — GIF-анимация</title>
<style>
  :root{
    --bg1:#164e63; --bg2:#7c3aed; --card:#ffffff; --ink:#1e293b;
    --accent:#0891b2; --ok:#16a34a; --bad:#dc2626; --soft:#cffafe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Где включить анимацию в Photoshop?",
   a:["Файл → Открыть","Окно → Шкала времени → «Создать анимацию кадра»","Фильтр → Пластика","Панель слоёв"],c:1,
   e:"Шкала времени (внизу) — там кадры анимации, тайминг и зацикливание."},
  {q:"Как сделать ПЛАВНОЕ движение, а не «прыжок»?",
   a:["Двигать вручную по кадрам","«Создать промежуточные кадры» (Tween) между стартом и финишем","Ускорить","Ластиком"],c:1,
   e:"Ставишь начало и конец — Photoshop сам плавно заполняет середину."},
  {q:"Что нужно выделить ПЕРЕД «Создать промежуточные кадры»?",
   a:["Один кадр","Два кадра (старт и финиш)","Все слои","Ничего"],c:1,
   e:"Tween работает между двумя выделенными кадрами."},
  {q:"Как зациклить GIF (чтобы крутился по кругу)?",
   a:["Сохранить в JPG","Внизу Шкалы времени выбрать «Постоянно»","Больше кадров","Ctrl+S"],c:1,
   e:"«Постоянно» вместо «Однократно» — и GIF повторяется бесконечно."},
  {q:"Где задают длительность (тайминг) кадра?",
   a:["В строке меню","Под кадром — маленькое время (кликнуть)","На панели слоёв","Нигде"],c:1,
   e:"Под каждым кадром есть его длительность в секундах — клик и выбор."},
  {q:"Как экспортировать GIF?",
   a:["Просто сохранить PSD","Файл → Экспортировать → Сохранить для Web (старый) → GIF","Ctrl+P","Фильтр"],c:1,
   e:"«Сохранить для Web (старый)» → формат GIF → «Постоянно» → Сохранить."},
  {q:"Из чего собирается кадровая анимация?",
   a:["Из фильтров","Из кадров (каждый — состояние слоёв)","Из текста","Из масок"],c:1,
   e:"Каждый кадр — «фотография» слоёв. Меняешь слои между кадрами — получаешь движение."},
  {q:"Сколько держать ФИНАЛЬНЫЙ кадр (пуант)?",
   a:["Как все, 0.1 с","Дольше — 1–2 секунды, чтобы разглядеть","0 секунд","Не важно"],c:1,
   e:"Финалу дают паузу, иначе зритель не успеет прочитать/увидеть."},
  {q:"Tween умеет плавно менять не только «Положение», но и…",
   a:["Формат файла","«Непрозрачность» (плавное появление/исчезание)","Имя слоя","Размер холста"],c:1,
   e:"С «Непрозрачностью» надпись/объект может плавно проявляться."},
  {q:"Как сделать GIF лёгким?",
   a:["Больше кадров и цветов","Уменьшить размер, кадры и число цветов","Крупнее холст","Ярче"],c:1,
   e:"GIF быстро «толстеет»: держи его небольшим и с малым числом цветов."},

  {q:"😄 Очки «прыгнули» на глаза за 1 кадр — некрасиво. Что сделать?",
   a:["Так быстрее","Промежуточные кадры — станет плавно","Ещё быстрее","Удалить"],c:1,
   e:"Tween дорисует спуск — очки поедут мягко."},
  {q:"😄 GIF мигнул один раз и застыл. Что забыл?",
   a:["Сохранить","Поставить «Постоянно» (зацикливание)","Купить ПК","Очки"],c:1,
   e:"Без «Постоянно» анимация проигрывается один раз."},
  {q:"😄 GIF весит 25 МБ и не грузится в чат. Совет?",
   a:["Так и надо","Уменьшить размер/кадры/число цветов","Добавить кадров","Ярче"],c:1,
   e:"Мем должен быть лёгким: меньше пикселей, кадров и цветов."},

  {q:"🤔 Почему движение делают промежуточными кадрами, а не двигают вручную?",
   a:["Вручную нельзя","Программа сама плавно и ровно заполняет середину","Так тяжелее","Для цвета"],c:1,
   e:"Tween экономит время и даёт ровное плавное движение."},
  {q:"🤔 Хочешь, чтобы надпись плавно ПОЯВЛЯЛАСЬ. Какой параметр Tween включить?",
   a:["Положение","Непрозрачность","Цвет","Размер файла"],c:1,
   e:"Непрозрачность от 0 к 100 = плавное проявление надписи."},
  {q:"🤔 Финальный кадр мелькает — не успеть прочитать надпись. Что сделать?",
   a:["Ускорить","Дать финальному кадру 1–2 секунды","Убрать текст","Меньше цветов"],c:1,
   e:"Длительность последнего кадра — пауза для чтения/восприятия."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🖼️ GIF-анимация</h1>
    <div class="sub">Викторина по уроку «Живой мем»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты аниматор — оживишь любую картинку! 🖼️';}
  else if(pct>=70){em='🎉';msg='Отлично! Кадры, Tween и экспорт GIF — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: промежуточные кадры + «Постоянно» + Сохранить для Web.';}
  else {em='💪';msg='Начало есть! Перечитай про Шкалу времени и промежуточные кадры.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
