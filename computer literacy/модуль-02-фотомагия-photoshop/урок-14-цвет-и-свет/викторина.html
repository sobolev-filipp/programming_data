<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Цвет и свет</title>
<style>
  :root{
    --bg1:#0b1220; --bg2:#1e3a8a; --card:#ffffff; --ink:#1e293b;
    --accent:#d97706; --ok:#16a34a; --bad:#dc2626; --soft:#ffedd5;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.45);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что такое «ночь» в цветокоррекции (а не просто темнота)?",
   a:["Просто убавить яркость","Тёмное + синие тени + тёплые огни","Чёрно-белое фото","Больше контраста"],c:1,
   e:"Ночь = затемнить + увести тени в синеву + зажечь тёплый свет."},
  {q:"Какого цвета делают ТЕНИ для ночного кадра?",
   a:["Жёлтыми","Синими / бирюзовыми","Красными","Зелёными"],c:1,
   e:"Синие тени — главный признак ночи, иначе выйдет «серая темнота»."},
  {q:"Какого цвета должны быть ОГНИ в окнах и фонарях?",
   a:["Тёплыми (жёлто-оранжевыми)","Синими","Серыми","Чёрными"],c:0,
   e:"Живой огонь всегда тёплый; на холодном фоне он светится сильнее."},
  {q:"Что такое приём teal & orange?",
   a:["Два фильтра подряд","Тени холодные, света тёплые","Чёрная рамка","Яркость на максимум"],c:1,
   e:"Сине-бирюзовые тени + оранжевые света = киношный «дорогой» контраст."},
  {q:"Что такое «Поиск цвета» (LUT)?",
   a:["Кисть","Готовая таблица «цвет → цвет», кино-профиль","Новый слой","Ластик"],c:1,
   e:"LUT — таблица соответствия цветов. Это ручная коррекция, а не ИИ."},
  {q:"LUT-профиль слишком сильный. Как его приручить?",
   a:["Удалить и забыть","Убавить «Непрозр.» + маской открыть огни и лицо","Нажать резкость","Сохранить в JPG"],c:1,
   e:"Профи не жмёт 100%: ослабляет силу и маской пускает свет сквозь грейд."},
  {q:"На каком слое рисуют свет (огни, луна, лучи)?",
   a:["Прямо по фото","Новый слой в режиме «Экран»","На маске","На фоне"],c:1,
   e:"Свет — на отдельном слое «Экран»: его можно стирать и ослаблять."},
  {q:"Почему свет рисуют именно в режиме «Экран»?",
   a:["Так быстрее","Чёрное исчезает, а свет складывается со сценой","Меньше весит","Для печати"],c:1,
   e:"На «Экране» чёрное невидимо, светлое добавляется — огонёк «горит»."},
  {q:"Чем делают лучи света (God rays)?",
   a:["Текстом","Фильтр → Размытие → Радиальное размытие","Штампом","Уровнями"],c:1,
   e:"Яркое пятно у источника + Радиальное размытие = веер лучей."},
  {q:"Какой МЕТОД Радиального размытия даёт лучи из точки?",
   a:["Кольцевой","Линейный (Зумирование)","Гаусс","Умный"],c:1,
   e:"«Линейный» растягивает свет от центра наружу; «Кольцевой» — завихрение."},
  {q:"Что делает ЧЁРНАЯ кисть на маске корректирующего слоя?",
   a:["Стирает фото","Прячет эффект слоя в этом месте","Красит в чёрный","Удаляет слой"],c:1,
   e:"Маска: чёрным прячем эффект, белым возвращаем. Фото цело."},
  {q:"Зачем сначала делать ночь, а только потом зажигать огни?",
   a:["Нет разницы","На холодном фоне тёплые огни светятся сильнее","Так быстрее сохранять","Меньше слоёв"],c:1,
   e:"Контраст тёплого и холодного: огни на синей ночи «горят» ярче."},
  {q:"Что такое виньетка?",
   a:["Яркая рамка","Лёгкое затемнение краёв, собирает взгляд в центр","Новый фильтр цвета","Текст на фото"],c:1,
   e:"Деликатное затемнение по краям ведёт глаз зрителя в центр кадра."},
  {q:"Как ослабить любой эффект, ничего не переделывая?",
   a:["Начать заново","Убавить «Непрозр.» слоя","Удалить фото","Нажать резкость"],c:1,
   e:"В этом сила неразрушающей работы: крутишь «громкость» слоя."},
  {q:"Зачем нужна «Выборочная коррекция цвета»?",
   a:["Для текста","Править каждый цвет отдельно (точный teal & orange)","Обрезать фото","Сделать ч/б"],c:1,
   e:"Можно покрасить только синие или только тёплые участки, не трогая остальное."},

  {q:"😄 Сделал «ночь», а вышла серая темнота. Что забыл?",
   a:["Сохранить","Синие тени","Купить ПК","Шум"],c:1,
   e:"Без синевы мозг не читает это как ночь. Уведи тени в синий."},
  {q:"😄 Огни в окнах синие и сливаются с ночью. Совет?",
   a:["Так атмосфернее","Сделать огни тёплыми","Добавить ещё синего","Удалить окна"],c:1,
   e:"Свет живого огня тёплый. Жёлто-оранжевые огни на синем фоне светятся."},
  {q:"😄 Накинул кино-LUT на 100% — лица стали синими «зомби». Что делать?",
   a:["Оставить, так модно","Убавить силу и маской открыть лица","Добавить ещё LUT","Сделать ярче"],c:1,
   e:"Приручи грейд: убавь «Непрозр.» и чёрной кистью по маске верни тепло лицам."},

  {q:"🤔 Почему teal & orange выглядит «дорого»?",
   a:["Это дорогой фильтр","Тёплое и холодное усиливают друг друга","Много слоёв","Яркие цвета"],c:1,
   e:"Противоположные цвета в тенях и светах дают сильный киноконтраст."},
  {q:"🤔 «Поиск цвета» — это нейросеть накрасила за меня?",
   a:["Да, это ИИ","Нет, это таблица цвета — обычная ручная коррекция","Да, онлайн","Это кисть"],c:1,
   e:"LUT просто меняет «был цвет → стал цвет». Никакого ИИ, всё честно."},
  {q:"🤔 Лучи идут не от источника, а из угла. Как исправить?",
   a:["Переделать всё","Перетащить центр в окне Радиального размытия на источник","Сменить кисть","Убрать слой"],c:1,
   e:"В окне фильтра двигаешь центр кружка туда, где источник света."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🌙 Цвет и свет</h1>
    <div class="sub">Викторина по уроку «День → ночь: цвет, свет, кино-грейд»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты настоящий колорист — день в ночь одним движением! 🌙';}
  else if(pct>=70){em='🎉';msg='Отлично! Цвет, свет и кино-грейд — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: тёмное + синие тени + тёплые огни, LUT приручай.';}
  else {em='💪';msg='Начало есть! Перечитай про синие тени, «Экран» и «Поиск цвета».';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
