<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Глитч-эффект</title>
<style>
  :root{
    --bg1:#083344; --bg2:#86198f; --card:#ffffff; --ink:#1e293b;
    --accent:#0891b2; --ok:#16a34a; --bad:#dc2626; --soft:#cffafe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Из каких трёх каналов состоит цветной пиксель?",
   a:["Чёрный, серый, белый","Красный, Зелёный, Синий (R/G/B)","Жёлтый, розовый, синий","Тень и свет"],c:1,
   e:"R/G/B — красный, зелёный, синий. Сдвинешь один канал — получишь цветное «двоение»."},
  {q:"Как сделать RGB-двоение (главный глитч)?",
   a:["Размыть","Дубль слоя → выключить канал «К» в «Параметрах наложения» → сдвинуть","Ластиком","Текстом"],c:1,
   e:"Копия без красного + сдвиг = красно-голубое двоение по краям."},
  {q:"Где у слоя выключают цветной канал?",
   a:["В строке меню Файл","Двойной клик по слою → «Параметры наложения» → Каналы К/З/С","На панели инструментов","В Корзине"],c:1,
   e:"«Параметры наложения» (двойной клик по слою) → строка «Каналы: К З С», снимаешь галочку."},
  {q:"Как «порвать» картинку на сдвинутые полосы?",
   a:["Ластиком","Выделить полосу (M) → Ctrl+J → сдвинуть «Перемещением»","Сохранить","Обесцветить"],c:1,
   e:"Полосу копируем на свой слой (Ctrl+J) и двигаем вбок — «разрыв сигнала»."},
  {q:"Какой фильтр даёт горизонтальные штрихи-помехи?",
   a:["Размытие","Фильтр → Стилизация → Ветер","Резкость","Тиснение"],c:1,
   e:"«Ветер» разгоняет пиксели горизонтально — фирменные глитч-штрихи."},
  {q:"Чем добавить «зерно»-помехи?",
   a:["Кистью","Фильтр → Шум → Добавить шум (монохромный)","Ластиком","Текстом"],c:1,
   e:"Монохромный шум даёт помехи как на старом экране."},
  {q:"Какие цвета типичны для киберпанка?",
   a:["Коричневый и серый","Бирюза и маджента (неон)","Только чёрный","Пастель"],c:1,
   e:"Неоновые бирюза + розовый/маджента на тёмном — киберпанк-палитра."},
  {q:"Чем задать киберпанк-тон всей работе?",
   a:["Ластиком","«Карта градиента» / «Цветовой баланс»","Рамкой","Штампом"],c:1,
   e:"Карта градиента (или Цветовой баланс: тени в синий, света в маджента)."},
  {q:"Насколько сдвигать RGB для читаемого глитча?",
   a:["На пол-экрана","5–15 пикселей","На 1 пиксель незаметно","На 300 пикс"],c:1,
   e:"5–15 пикс — двоение видно, но лицо читается. Пол-экрана = каша."},
  {q:"Как сдвинуть слой РОВНО на 1 пиксель?",
   a:["Мышкой на глаз","Стрелками на клавиатуре","Ctrl+S","Двойным кликом"],c:1,
   e:"Стрелки двигают активный слой/выделение по 1 пикселю — точно."},

  {q:"😄 Полосы вышли ровные и одинаковые — это «жалюзи», не глитч. Что делать?",
   a:["Оставить","Сделать разной толщины и сдвига — хаос","Убрать все","Добавить ещё ровнее"],c:1,
   e:"Глитч — это неровность. Разные полосы = живой глюк."},
  {q:"😄 Сдвинул RGB на пол-экрана — каша, лица не видно. Совет?",
   a:["Так круче","Держи сдвиг 5–15 пикс","Ещё дальше","Удали фото"],c:1,
   e:"Умеренный сдвиг читается как стиль, огромный — как ошибка."},
  {q:"😄 Полоса при сдвиге оставила прозрачную «дыру». Что забыл?",
   a:["Сохранить","Сначала Ctrl+J (полоса на свой слой), потом двигать","Выключить ПК","Ничего"],c:1,
   e:"Двигал пиксели прямо на слое. Скопируй полосу на новый слой — дыры не будет."},

  {q:"🤔 Почему при выключенном «К» и сдвиге появляется красно-голубое двоение?",
   a:["Магия","У копии нет красного, у нижнего есть — при сдвиге они расходятся","Экран старый","Формат не тот"],c:1,
   e:"Красный «остаётся» на нижнем слое, бирюзовая копия уезжает — вот и двоение."},
  {q:"🤔 Глитч везде одинаковый — скучно. Как усилить впечатление?",
   a:["Больше шума везде","Акцент на лице/крае + оставить чистые зоны","Сломать всё","Убрать цвет"],c:1,
   e:"Контраст «сломано/цело» усиливает эффект сильнее, чем тотальный хаос."},
  {q:"🤔 Как получить ТРОЙНОЕ двоение цвета?",
   a:["Никак","Две копии: у одной выключить «К» (сдвиг влево), у другой «С» (сдвиг вправо)","Больше шума","Ярче цвет"],c:1,
   e:"Разведи два канала в разные стороны — двоение станет трёхцветным."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🎆 Глитч-эффект</h1>
    <div class="sub">Викторина по уроку «Киберпанк-постер»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты повелитель глитча — киберпанк дрожит! 🎆';}
  else if(pct>=70){em='🎉';msg='Отлично! RGB-сдвиг и полосы — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: выключить канал «К», сдвиг 5–15 пикс, хаос вместо «жалюзи».';}
  else {em='💪';msg='Начало есть! Перечитай про каналы и сдвиг слоя.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
