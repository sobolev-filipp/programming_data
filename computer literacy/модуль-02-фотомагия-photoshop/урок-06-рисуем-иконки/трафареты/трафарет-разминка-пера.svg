<svg viewBox="0 0 794 1123" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="pk" markerWidth="12" markerHeight="12" refX="4" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#FB7185"/></marker>
    <marker id="pks" markerWidth="10" markerHeight="10" refX="3" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9 Z" fill="#FB7185"/></marker>
  </defs>
  <rect width="794" height="1123" fill="#ffffff"/>

  <!-- ===== header ===== -->
  <text x="54" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="800" fill="#134E5E">✒️ Трафарет: Перо — углы и кривые</text>
  <text x="54" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#475569">Обведи по серому образцу. Кривая рождается так: <tspan font-weight="700" fill="#B45309">нажми и тяни мышь к золотой точке 🟠</tspan> — розовая стрелка показывает, <tspan font-weight="700">куда и насколько</tspan> тянуть.</text>
  <line x1="54" y1="98" x2="740" y2="98" stroke="#E2E8F0" stroke-width="2"/>

  <!-- ===== 1. ЗУБЦЫ ===== -->
  <text x="54" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E">1 · Зубцы — только КЛИК (острые углы, тянуть НЕ нужно)</text>
  <polyline points="120,210 200,160 280,210 360,160 440,210 520,160 600,210" fill="none" stroke="#9CA3AF" stroke-width="2.5"/>
  <g fill="#1E293B"><rect x="196" y="156" width="8" height="8"/><rect x="276" y="206" width="8" height="8"/><rect x="356" y="156" width="8" height="8"/><rect x="436" y="206" width="8" height="8"/><rect x="516" y="156" width="8" height="8"/></g>
  <rect x="115" y="205" width="11" height="11" fill="#2563EB"/><text x="104" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2563EB">старт</text>
  <rect x="595" y="205" width="11" height="11" fill="#DC2626"/><text x="582" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DC2626">финиш</text>
  <text x="630" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748B">Линия идёт</text>
  <text x="630" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748B">прямо от точки</text>
  <text x="630" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748B">к точке.</text>
  <text x="54" y="268" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#94A3B8">Практика:</text>
  <polyline points="120,300 200,268 280,300 360,268 440,300 520,268 600,300" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="3 6"/>
  <rect x="115" y="295" width="11" height="11" fill="#93C5FD"/><rect x="595" y="295" width="11" height="11" fill="#FCA5A5"/>

  <line x1="54" y1="334" x2="740" y2="334" stroke="#F1F5F9" stroke-width="2"/>

  <!-- ===== 2. ДУГА (горка) ===== -->
  <text x="54" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E">2 · Дуга — КЛИК-И-ПОТЯНИ (одна горка ∩)</text>
  <!-- arch образец -->
  <path d="M250,470 A92,78 0 0,1 434,470" fill="none" stroke="#9CA3AF" stroke-width="2.5"/>
  <!-- direction lines + gold dots -->
  <line x1="250" y1="470" x2="250" y2="406" stroke="#94A3B8" stroke-width="1.6"/><circle cx="250" cy="402" r="6" fill="#F59E0B"/>
  <line x1="434" y1="470" x2="434" y2="534" stroke="#94A3B8" stroke-width="1.6"/><circle cx="434" cy="538" r="6" fill="#F59E0B"/>
  <!-- pink arrows -->
  <line x1="214" y1="470" x2="214" y2="408" stroke="#FB7185" stroke-width="4" marker-end="url(#pk)"/>
  <line x1="470" y1="470" x2="470" y2="532" stroke="#FB7185" stroke-width="4" marker-end="url(#pk)"/>
  <!-- anchors -->
  <rect x="245" y="465" width="11" height="11" fill="#2563EB"/><text x="234" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2563EB">старт</text>
  <rect x="429" y="465" width="11" height="11" fill="#DC2626"/><text x="416" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DC2626">финиш</text>
  <!-- instruction -->
  <text x="520" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2563EB"><tspan font-weight="700">1.</tspan> 1-я точка: тяни</text>
  <text x="520" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2563EB">мышь ВВЕРХ к 🟠, отпусти.</text>
  <text x="520" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2563EB"><tspan font-weight="700">2.</tspan> 2-я точка: тяни</text>
  <text x="520" y="490" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2563EB">ВНИЗ к 🟠 — выйдет горка.</text>
  <!-- practice -->
  <text x="54" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#94A3B8">Практика:</text>
  <path d="M250,610 A92,70 0 0,1 434,610" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="3 6"/>
  <rect x="245" y="605" width="11" height="11" fill="#93C5FD"/><rect x="429" y="605" width="11" height="11" fill="#FCA5A5"/>

  <line x1="54" y1="650" x2="740" y2="650" stroke="#F1F5F9" stroke-width="2"/>

  <!-- ===== 3. ВОЛНА ===== -->
  <text x="54" y="684" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E">3 · Волна — чередуй: ВВЕРХ, ВНИЗ, ВВЕРХ… (главное!)</text>
  <!-- baseline faint -->
  <line x1="110" y1="790" x2="510" y2="790" stroke="#EEF2F6" stroke-width="1.5" stroke-dasharray="2 5"/>
  <!-- wave образец: humps up,down,up -->
  <path d="M130,790 A58,58 0 0,1 246,790 A58,58 0 0,0 362,790 A58,58 0 0,1 478,790" fill="none" stroke="#9CA3AF" stroke-width="2.5"/>
  <!-- direction lines + gold dots (a1 up, a2 down, a3 up, a4 down) -->
  <g stroke="#94A3B8" stroke-width="1.6">
    <line x1="130" y1="790" x2="130" y2="724"/><line x1="246" y1="790" x2="246" y2="856"/><line x1="362" y1="790" x2="362" y2="724"/><line x1="478" y1="790" x2="478" y2="856"/>
  </g>
  <g fill="#F59E0B"><circle cx="130" cy="720" r="6"/><circle cx="246" cy="860" r="6"/><circle cx="362" cy="720" r="6"/><circle cx="478" cy="860" r="6"/></g>
  <!-- pink arrows up/down beside each -->
  <line x1="104" y1="790" x2="104" y2="726" stroke="#FB7185" stroke-width="4" marker-end="url(#pk)"/>
  <line x1="220" y1="790" x2="220" y2="854" stroke="#FB7185" stroke-width="4" marker-end="url(#pk)"/>
  <line x1="336" y1="790" x2="336" y2="726" stroke="#FB7185" stroke-width="4" marker-end="url(#pk)"/>
  <line x1="452" y1="790" x2="452" y2="854" stroke="#FB7185" stroke-width="4" marker-end="url(#pk)"/>
  <!-- anchors -->
  <rect x="124" y="784" width="12" height="12" fill="#2563EB"/>
  <g fill="#1E293B"><rect x="240" y="784" width="11" height="11"/><rect x="356" y="784" width="11" height="11"/></g>
  <rect x="472" y="784" width="12" height="12" fill="#DC2626"/>
  <text x="112" y="888" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#2563EB">старт</text>
  <text x="462" y="888" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#DC2626">финиш</text>
  <!-- instruction box right -->
  <rect x="538" y="700" width="210" height="150" rx="12" fill="#EFF6FF"/>
  <text x="552" y="726" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#2563EB"><tspan font-weight="700">1.</tspan> Точка на линии →</text>
  <text x="552" y="744" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#2563EB">тяни ВВЕРХ к 🟠 ↑</text>
  <text x="552" y="770" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#2563EB"><tspan font-weight="700">2.</tspan> Следующая точка →</text>
  <text x="552" y="788" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#2563EB">тяни ВНИЗ к 🟠 ↓</text>
  <text x="552" y="814" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#2563EB"><tspan font-weight="700">3.</tspan> Чередуй вверх-вниз</text>
  <text x="552" y="832" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#2563EB">— получится волна.</text>
  <!-- practice wave -->
  <text x="54" y="912" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#94A3B8">Практика:</text>
  <path d="M130,952 A58,52 0 0,1 246,952 A58,52 0 0,0 362,952 A58,52 0 0,1 478,952" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="3 6"/>
  <rect x="124" y="946" width="12" height="12" fill="#93C5FD"/><rect x="472" y="946" width="12" height="12" fill="#FCA5A5"/>

  <!-- ===== legend ===== -->
  <line x1="54" y1="1004" x2="740" y2="1004" stroke="#E2E8F0" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569">
    <rect x="54" y="1026" width="11" height="11" fill="#1E293B"/><text x="72" y="1036">опорная точка</text>
    <rect x="186" y="1026" width="11" height="11" fill="#2563EB"/><text x="204" y="1036">старт</text>
    <rect x="270" y="1026" width="11" height="11" fill="#DC2626"/><text x="288" y="1036">финиш</text>
    <circle cx="366" cy="1032" r="6" fill="#F59E0B"/><text x="378" y="1036">куда дотянуть мышь</text>
    <line x1="548" y1="1032" x2="583" y2="1032" stroke="#FB7185" stroke-width="4" marker-end="url(#pks)"/><text x="590" y="1036">направление и сила</text>
  </g>
  <text x="54" y="1066" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#64748B">💡 Длиннее тянешь к 🟠 — выше и шире изгиб. Ошибся — Ctrl+Z. Поправить потом — белой «Стрелкой» (A) за «ус».</text>
</svg>
