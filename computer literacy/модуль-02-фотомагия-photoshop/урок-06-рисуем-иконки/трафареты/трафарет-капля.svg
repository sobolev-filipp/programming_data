<svg viewBox="0 0 794 1123" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="pk" markerWidth="12" markerHeight="12" refX="4" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#FB7185"/></marker>
  </defs>
  <rect width="794" height="1123" fill="#ffffff"/>
  <!-- header -->
  <text x="54" y="52" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="800" fill="#1D4ED8">💧 Трафарет: капля Пером (кривые)</text>
  <text x="54" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#475569">Рисуем <tspan font-weight="700">по часовой стрелке</tspan>. В круглых точках: <tspan font-weight="700" fill="#B45309">нажми и тяни мышь к золотой точке 🟠</tspan> (розовая стрелка — куда тянуть).</text>
  <line x1="54" y1="98" x2="740" y2="98" stroke="#E2E8F0" stroke-width="2"/>

  <!-- ===== ОБРАЗЕЦ ===== -->
  <text x="54" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E">Образец — обводи по номерам</text>
  <!-- teardrop path -->
  <path d="M250,200 C300,280 320,330 320,370 C320,425 285,455 250,455 C215,455 180,425 180,370 C180,330 200,280 250,200 Z" fill="none" stroke="#9CA3AF" stroke-width="2.5"/>
  <!-- direction lines + gold dots -->
  <line x1="320" y1="370" x2="320" y2="416" stroke="#94A3B8" stroke-width="1.6"/><circle cx="320" cy="420" r="6" fill="#F59E0B"/>
  <line x1="250" y1="455" x2="214" y2="455" stroke="#94A3B8" stroke-width="1.6"/><circle cx="210" cy="455" r="6" fill="#F59E0B"/>
  <line x1="180" y1="370" x2="180" y2="324" stroke="#94A3B8" stroke-width="1.6"/><circle cx="180" cy="320" r="6" fill="#F59E0B"/>
  <!-- pink arrows -->
  <line x1="352" y1="366" x2="352" y2="414" stroke="#FB7185" stroke-width="4" marker-end="url(#pk)"/>
  <line x1="246" y1="486" x2="212" y2="486" stroke="#FB7185" stroke-width="4" marker-end="url(#pk)"/>
  <line x1="148" y1="374" x2="148" y2="326" stroke="#FB7185" stroke-width="4" marker-end="url(#pk)"/>
  <!-- numbered anchors -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">
    <rect x="243" y="193" width="14" height="14" fill="#2563EB"/><text x="250" y="186" fill="#2563EB" font-size="13">1 · клик</text>
    <circle cx="320" cy="370" r="12" fill="#1E293B"/><text x="320" y="375" fill="#fff">2</text>
    <circle cx="250" cy="455" r="12" fill="#1E293B"/><text x="250" y="460" fill="#fff">3</text>
    <circle cx="180" cy="370" r="12" fill="#1E293B"/><text x="180" y="375" fill="#fff">4</text>
  </g>
  <!-- instructions -->
  <rect x="400" y="190" width="348" height="250" rx="14" fill="#EFF6FF"/>
  <text x="418" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1D4ED8">Рисуем по часовой стрелке:</text>
  <text x="418" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155"><tspan font-weight="700" fill="#2563EB">1.</tspan> Точка 1 (верх) — просто <tspan font-weight="700">КЛИК</tspan></text>
  <text x="438" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">(острый кончик, тянуть не нужно).</text>
  <text x="418" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155"><tspan font-weight="700" fill="#2563EB">2.</tspan> Точка 2 (справа) — тяни <tspan font-weight="700">ВНИЗ</tspan> к 🟠.</text>
  <text x="418" y="338" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155"><tspan font-weight="700" fill="#2563EB">3.</tspan> Точка 3 (низ) — тяни <tspan font-weight="700">ВЛЕВО</tspan> к 🟠.</text>
  <text x="418" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155"><tspan font-weight="700" fill="#2563EB">4.</tspan> Точка 4 (слева) — тяни <tspan font-weight="700">ВВЕРХ</tspan> к 🟠.</text>
  <text x="418" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155"><tspan font-weight="700" fill="#2563EB">5.</tspan> Вернись в точку 1 — <tspan font-weight="700">замкни</tspan>.</text>
  <text x="418" y="424" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" fill="#64748B">Тянешь дальше к 🟠 — круглее бок.</text>

  <!-- ===== ПРАКТИКА ===== -->
  <text x="54" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#0F766E">Практика — поставь точки сам(а)</text>
  <path d="M250,620 C300,700 320,750 320,790 C320,845 285,875 250,875 C215,875 180,845 180,790 C180,750 200,700 250,620 Z" fill="none" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="3 7"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#CBD5E1">
    <rect x="244" y="614" width="12" height="12" fill="#93C5FD"/>
    <circle cx="320" cy="790" r="10" fill="none" stroke="#CBD5E1" stroke-width="2"/><text x="320" y="794">2</text>
    <circle cx="250" cy="875" r="10" fill="none" stroke="#CBD5E1" stroke-width="2"/><text x="250" y="879">3</text>
    <circle cx="180" cy="790" r="10" fill="none" stroke="#CBD5E1" stroke-width="2"/><text x="180" y="794">4</text>
  </g>

  <!-- legend -->
  <line x1="54" y1="1004" x2="740" y2="1004" stroke="#E2E8F0" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#475569">
    <rect x="54" y="1026" width="11" height="11" fill="#2563EB"/><text x="72" y="1036">старт (клик)</text>
    <circle cx="200" cy="1032" r="7" fill="#1E293B"/><text x="214" y="1036">точка-перетаскивание</text>
    <circle cx="420" cy="1032" r="6" fill="#F59E0B"/><text x="432" y="1036">куда дотянуть мышь</text>
    <line x1="600" y1="1032" x2="632" y2="1032" stroke="#FB7185" stroke-width="4" marker-end="url(#pk)"/><text x="640" y="1036">направление</text>
  </g>
  <text x="54" y="1066" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#64748B">💡 В иконке капля делается проще — из кружка (см. шаги), но Пером ты поймёшь, как рождается плавная кривая.</text>
</svg>
