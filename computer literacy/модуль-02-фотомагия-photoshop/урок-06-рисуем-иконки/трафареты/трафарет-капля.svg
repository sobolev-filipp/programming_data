<svg viewBox="0 0 794 1123" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#F97316"/></marker>
  </defs>
  <rect width="794" height="1123" fill="#ffffff"/>
  <!-- header -->
  <text x="60" y="64" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#1D4ED8">💧 Трафарет: капля Пером (кривые)</text>
  <text x="60" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#64748B">Точка 1 (верх) — просто КЛИК (острый кончик). Точки 2–4 — КЛИК-И-ПОТЯНИ по оранжевой стрелке (круглый низ). Вернись в точку 1 и замкни.</text>
  <line x1="60" y1="108" x2="734" y2="108" stroke="#E2E8F0" stroke-width="2"/>

  <!-- ===== ОБРАЗЕЦ ===== -->
  <text x="60" y="160" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E">Образец — обведи по номерам</text>
  <path d="M250,230 C300,310 320,360 320,400 C320,455 285,485 250,485 C215,485 180,455 180,400 C180,360 200,310 250,230 Z" fill="#CFEBFF" stroke="#2172DB" stroke-width="2.5" stroke-dasharray="6 5"/>
  <!-- tangent arrows -->
  <g stroke="#F97316" stroke-width="2" marker-end="url(#ah)">
    <line x1="320" y1="400" x2="320" y2="450"/>   <!-- right: pull down -->
    <line x1="250" y1="485" x2="200" y2="485"/>   <!-- bottom: pull left -->
    <line x1="180" y1="400" x2="180" y2="350"/>   <!-- left: pull up -->
  </g>
  <!-- numbered anchors -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">
    <circle cx="250" cy="230" r="13" fill="#2563EB"/><text x="250" y="235" fill="#fff">1</text>
    <circle cx="320" cy="400" r="13" fill="#334155"/><text x="320" y="405" fill="#fff">2</text>
    <circle cx="250" cy="485" r="13" fill="#334155"/><text x="250" y="490" fill="#fff">3</text>
    <circle cx="180" cy="400" r="13" fill="#334155"/><text x="180" y="405" fill="#fff">4</text>
  </g>
  <text x="430" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">1 = острый кончик (клик).</text>
  <text x="430" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#475569">2, 3, 4 = круглый низ:</text>
  <text x="430" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#F97316">клик-и-потяни по стрелке.</text>
  <text x="430" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2563EB">После точки 4 вернись в точку 1 — замкнёшь каплю.</text>

  <!-- ===== ПРАКТИКА ===== -->
  <text x="60" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F766E">Практика — поставь точки сам(а)</text>
  <path d="M250,690 C300,770 320,820 320,860 C320,915 285,945 250,945 C215,945 180,915 180,860 C180,820 200,770 250,690 Z" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="3 7"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    <circle cx="250" cy="690" r="10" fill="none" stroke="#93C5FD" stroke-width="2"/><text x="250" y="694" fill="#93C5FD">1</text>
    <circle cx="320" cy="860" r="10" fill="none" stroke="#CBD5E1" stroke-width="2"/><text x="320" y="864" fill="#CBD5E1">2</text>
    <circle cx="250" cy="945" r="10" fill="none" stroke="#CBD5E1" stroke-width="2"/><text x="250" y="949" fill="#CBD5E1">3</text>
    <circle cx="180" cy="860" r="10" fill="none" stroke="#CBD5E1" stroke-width="2"/><text x="180" y="864" fill="#CBD5E1">4</text>
  </g>

  <line x1="60" y1="1030" x2="734" y2="1030" stroke="#E2E8F0" stroke-width="2"/>
  <text x="60" y="1060" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">💡 В иконке капля делается проще — из кружка (см. шаги), но Пером ты поймёшь, как рождается плавная кривая.</text>
</svg>
