<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Рисуем иконки</title>
<style>
  :root{
    --bg1:#052e2b; --bg2:#166534; --card:#ffffff; --ink:#1e293b;
    --accent:#15803d; --ok:#16a34a; --bad:#dc2626; --soft:#dcfce7;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Чем рисуют иконки в Photoshop?",
   a:["Кистью от руки","Векторными фигурами (U)","Ластиком","Текстом"],c:1,
   e:"Иконки рисуют фигурами — их можно увеличить, перекрасить и поправить без потери качества."},
  {q:"Как нарисовать идеально ровный круг Эллипсом?",
   a:["Аккуратно мышкой","Удерживать Shift при рисовании","Нажать Ctrl+S","Увеличить картинку"],c:1,
   e:"Shift при рисовании Эллипса даёт ровный круг (а Прямоугольника — квадрат)."},
  {q:"Как из нескольких кругов сделать ОДНО облако?",
   a:["Склеить скотчем","Выделить слои → «Объединить фигуры»","Удалить лишние","Сохранить"],c:1,
   e:"«Объединить фигуры» (Merge Shapes) сливает кусочки в одну форму-облако."},
  {q:"Как из круга сделать полумесяц (луну)?",
   a:["Стереть половину кистью","Второй круг → «Вычесть переднюю фигуру»","Повернуть","Уменьшить"],c:1,
   e:"Рисуешь второй круг со смещением и вычитаешь его — остаётся полумесяц."},
  {q:"Чем удобнее всего нарисовать острую молнию?",
   a:["Эллипсом","Пером (P) по точкам","Кистью","Заливкой"],c:1,
   e:"Перо ставит точки-узлы — идеально для острых, угловатых форм вроде молнии."},
  {q:"Зачем включать сетку и привязку?",
   a:["Для красоты","Чтобы фигуры стояли ровно и одинакового размера","Чтобы быстрее","Чтобы сохранить"],c:1,
   e:"Привязка «притягивает» края фигур к клеткам — иконки встают ровно сами."},
  {q:"Как сделать весь набор иконок в ОДНОМ стиле?",
   a:["Перерисовать каждую","Скопировать стиль слоя → Вклеить на остальные","Сохранить в PNG","Никак"],c:1,
   e:"ПКМ по слою → «Скопировать стиль слоя», выдели остальные → «Вклеить стиль слоя»."},
  {q:"Какой клавишей берут группу инструментов-фигур?",
   a:["U","B","T","S"],c:0,
   e:"U — Эллипс, Прямоугольник, Скруглённый прямоугольник, Многоугольник, Линия (Shift+U листает)."},
  {q:"Как нарисовать звезду?",
   a:["Эллипсом","Многоугольником с опцией «Звезда»","Пером","Текстом"],c:1,
   e:"Многоугольник (U) → в параметрах «Звезда» + число лучей → рисуешь звезду."},
  {q:"Почему иконку-фигуру можно увеличить без «мыла»?",
   a:["Это волшебство","Векторная фигура хранит форму, а не пиксели","Она маленькая","Из-за сетки"],c:1,
   e:"Векторные фигуры описаны формой — масштабируются чётко в любой размер."},

  {q:"😄 Вместо круга вышел овал. Что забыл(а)?",
   a:["Сохранить","Зажать Shift","Выключить ПК","Сетку"],c:1,
   e:"Shift делает круг идеальным. Без него легко «сплющить» в овал."},
  {q:"😄 «Объединить фигуры» серое и не нажимается. Почему?",
   a:["Сломался ПК","Слои не фигуры (растровые)","Мало очков","Нет интернета"],c:1,
   e:"Объединять/вычитать можно только слои-фигуры (нарисованные инструментами U)."},
  {q:"😄 Хочешь подвинуть фигуру прямо во время рисования. Как?",
   a:["Начать заново","Зажать Пробел, не отпуская кнопку мыши","Нажать Ctrl+Z","Никак"],c:1,
   e:"Пробел во время рисования двигает фигуру; отпустил — снова тянешь размер."},

  {q:"🤔 Иконки разного размера и вкривь. Что поможет?",
   a:["Ничего","Сетка+привязка и выравнивание (V)","Сохранить в JPG","Сменить тему"],c:1,
   e:"Привязка к сетке + выравнивание/распределение (инструмент Перемещение) ставят всё ровно."},
  {q:"🤔 Нужна «дырка» в фигуре (кольцо, бублик). Как сделать?",
   a:["Стереть кистью","Вторая фигура → «Вычесть переднюю фигуру»","Уменьшить","Повернуть"],c:1,
   e:"Вычитание одной фигуры из другой прорезает отверстие — как в луне и кольце."},
  {q:"🤔 Облако собрал, но тени у иконок разные. Что сделать быстро?",
   a:["Перерисовать","Скопировать стиль с одной и вклеить на все","Удалить тени","Сменить фон"],c:1,
   e:"Копирование стиля слоя мгновенно приводит весь набор к единому виду."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>✏️ Рисуем иконки</h1>
    <div class="sub">Викторина по уроку 6</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Фигуры, Объединить и Вычесть — ты настоящий иконочный дизайнер! ✨';}
  else if(pct>=70){em='🎉';msg='Отлично! Соберёшь любой набор иконок из простых фигур.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори Объединить/Вычесть и рисуй с Shift.';}
  else {em='💪';msg='Начало есть! Перечитай про фигуры, сетку и Объединить/Вычесть.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
