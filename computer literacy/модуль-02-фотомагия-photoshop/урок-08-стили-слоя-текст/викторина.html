<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Стили слоя и текст</title>
<style>
  :root{
    --bg1:#4a044e; --bg2:#a21caf; --card:#ffffff; --ink:#1e293b;
    --accent:#c026d3; --ok:#16a34a; --bad:#dc2626; --soft:#fae8ff;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Как открыть окно «Стиль слоя»?",
   a:["Файл → Открыть","Двойной клик по слою (или кнопка fx внизу панели слоёв)","Ctrl+S","Меню Фильтр"],c:1,
   e:"Двойной клик по слою (справа от имени) или иконка «fx» внизу панели слоёв."},
  {q:"Какой эффект — главный в неоне?",
   a:["Тень","Внешнее свечение","Обводка 20 пикс","Наложение цвета"],c:1,
   e:"Внешнее свечение создаёт неоновый ореол. Внутреннее — «горячую» сердцевину."},
  {q:"В каком режиме наложения должно быть свечение?",
   a:["Обычные","Экран","Умножение","Затемнение"],c:1,
   e:"«Экран» заставляет свет светиться, а не закрашивать грязным пятном."},
  {q:"На каком фоне неон реально виден?",
   a:["На белом","На тёмном","На любом","На красном"],c:1,
   e:"Свечение читается только на тёмном фоне. На светлом неон «пропадает»."},
  {q:"Как залить текст текстурой (огнём, космосом)?",
   a:["Кистью","Текстуру НАД текстом → сделать обтравочной (Alt+клик по границе)","Ластиком","Стилем «Тень»"],c:1,
   e:"Обтравочная маска показывает текстуру только внутри букв."},
  {q:"Как перенести готовый стиль на другой слой?",
   a:["Настроить заново","Правой кнопкой → «Скопировать стиль слоя» → «Вставить стиль слоя»","Удалить слой","Сохранить"],c:1,
   e:"Копирование/вставка стиля (или Alt+перетащить значок fx) переносит все эффекты."},
  {q:"Как сделать неон ярче/плотнее?",
   a:["Уменьшить размер","Продублировать слой текста (Ctrl+J) — стили сложатся","Удалить свечение","Сменить шрифт"],c:1,
   e:"Дубликат складывает эффекты — свечение становится плотнее."},
  {q:"Стили слоя — это навсегда?",
   a:["Да, не изменить","Нет, они живые: выключаются глазиком, меняются двойным кликом","Только в PNG","Только один раз"],c:1,
   e:"Эффекты редактируемые: глазик выключает, двойной клик открывает настройки."},
  {q:"Чем сделать буквы золотыми и объёмными (9–11)?",
   a:["Ластиком","Наложение градиента (жёлтые) + Тиснение","Только Тень","Размытием"],c:1,
   e:"Градиент даёт золотой перелив, Тиснение — объём/скос. Вместе — металл."},
  {q:"Как выключить ОДИН эффект, не удаляя остальные?",
   a:["Удалить слой","Глазик 👁 рядом с эффектом в списке fx под слоем","Ctrl+Z 10 раз","Сохранить"],c:1,
   e:"У каждого эффекта в списке fx свой глазик — вкл/выкл по отдельности."},

  {q:"😄 Раздул свечение на весь экран — вышел «туман», а не неон. Что делать?",
   a:["Оставить, это стиль","Уменьшить размер свечения — яркая сердцевина важнее","Сделать ещё больше","Сменить ПК"],c:1,
   e:"Настоящий неон — тугая яркая трубка + немного ореола. Меньше — лучше."},
  {q:"😄 Сделал неон на белом фоне — не светится. Почему?",
   a:["ПК сломан","Неон виден только на тёмном фоне","Мало стилей","Не сохранил"],c:1,
   e:"Свет заметен на тёмном. Поставь тёмный фон — и «загорится»."},
  {q:"😄 Навесил 8 стилей — надпись как новогодняя ёлка. Совет?",
   a:["Добавить ещё пару","Оставить 3–4 подобранных, чувство меры","Убрать текст","Сделать крупнее"],c:1,
   e:"Меньше, да лучше. Перебор стилей = безвкусица."},

  {q:"🤔 Свечение «пачкает» тёмным вместо света. Что не так с режимом?",
   a:["Ничего","Стоит «Обычные» вместо «Экран»","Мало памяти","Формат не тот"],c:1,
   e:"Свет должен быть в режиме «Экран», иначе он закрашивает, а не светит."},
  {q:"🤔 Нужен одинаковый стиль на 5 надписях быстро. Как?",
   a:["Настраивать каждую заново","Скопировать и вставить стиль слоя","Удалить четыре","Никак"],c:1,
   e:"Один раз настроил — скопировал стиль на остальные. Единый вид за секунды."},
  {q:"🤔 Залил текст огнём, но хочешь переписать слово. Получится, если…",
   a:["текст растрирован","текст остался живым текстовым слоем (обтравка работает и с ним)","никак","удалить огонь"],c:1,
   e:"Не растрируй текст — тогда слово редактируется, а текстура остаётся внутри."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>✨ Стили слоя и текст</h1>
    <div class="sub">Викторина по уроку «Неоновая вывеска»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Стили слоя тебе покорились — светись и пылай! ✨';}
  else if(pct>=70){em='🎉';msg='Отлично! Неон и текст из огня — в кармане.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: свечение — режим «Экран», фон тёмный, без перебора.';}
  else {em='💪';msg='Начало есть! Перечитай про стили слоя и обтравочную маску текста.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
