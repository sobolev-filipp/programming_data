<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Двойная экспозиция</title>
<style>
  :root{
    --bg1:#052e2b; --bg2:#166534; --card:#ffffff; --ink:#1e293b;
    --accent:#15803d; --ok:#16a34a; --bad:#dc2626; --soft:#dcfce7;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Где переключается режим наложения слоя?",
   a:["В строке меню Файл","Список «Обычные» вверху слева панели слоёв","На панели инструментов","Внизу экрана"],c:1,
   e:"Панель слоёв, вверху слева — выпадающий список «Обычные». Там все режимы."},
  {q:"Что делает режим «Экран» (Screen)?",
   a:["Прячет тёмное, высветляет","Прячет светлое, затемняет","Ничего","Удаляет слой"],c:0,
   e:"«Экран» = фонарик: гасит чёрное, оставляет светлое. Идеален для двойной экспозиции."},
  {q:"Что делает режим «Умножение» (Multiply)?",
   a:["Высветляет","Прячет светлое, затемняет","Меняет размер","Сохраняет"],c:1,
   e:"«Умножение» = тень: гасит белое, оставляет тёмное. Для теней и надписей."},
  {q:"Каким должен быть фон под человеком для двойной экспозиции?",
   a:["Чёрным","Светлым/белым","Пёстрым","Красным"],c:1,
   e:"На светлом фоне «Экран» красиво заполняет силуэт текстурой. Тёмный фон всё испортит."},
  {q:"Как заставить текстуру показываться ТОЛЬКО внутри силуэта?",
   a:["Стереть ластиком","Сделать её обтравочной (Alt+клик по границе между слоями)","Сохранить в PNG","Уменьшить"],c:1,
   e:"Обтравочная маска привязывает текстуру к слою-силуэту — она видна только по нему."},
  {q:"Текстура бледная, мало заполняет. Что сделать?",
   a:["Удалить","Продублировать слой (Ctrl+J)","Сохранить","Сменить портрет"],c:1,
   e:"Дубликат `Ctrl+J` удваивает плотность эффекта. Лишнее уберёшь маской."},
  {q:"Как вернуть глаза человека сквозь лес?",
   a:["Никак","Добавить маску на текстуру и закрасить лицо ЧЁРНЫМ","Стереть текстуру","Сменить режим"],c:1,
   e:"Чёрное на маске текстуры прячет лес над лицом — проступают глаза."},
  {q:"Чем задать всей работе единый красивый тон?",
   a:["Ластиком","Корректирующим слоем «Карта градиента»","Рамкой","Текстом"],c:1,
   e:"«Карта градиента» (◐ внизу панели) перекрашивает по яркости в 2 цвета — единый тон."},
  {q:"Эффект слишком резкий. Как смягчить, НЕ меняя режим?",
   a:["Удалить слой","Убавить «Непрозр.» слоя","Сохранить","Увеличить размер"],c:1,
   e:"Непрозрачность слоя (вверху панели) плавно ослабляет любой эффект."},
  {q:"Как быстро перебрать все режимы наложения?",
   a:["Открывать список каждый раз","Взять «Перемещение» (V) и жать Shift + + / Shift + −","Никак","Ctrl+S"],c:1,
   e:"С инструментом «Перемещение» Shift и +/− листают режимы активного слоя."},

  {q:"😄 Включил «Экран», а ничего не смешалось. Что забыл?",
   a:["Сохранить","Светлый фон и/или контрастную текстуру","Купить новый ПК","Ничего"],c:1,
   e:"«Экран» работает, когда есть тёмное на светлом. Нет контраста — нет эффекта."},
  {q:"😄 Как проще всего запомнить «Экран» и «Умножение»?",
   a:["Никак","Экран — фонарик (светлит), Умножение — тень (темнит)","По цвету кнопки","Наугад"],c:1,
   e:"Фонарик 🔦 и тень 🌑 — с этой парой уже можно очень многое."},
  {q:"😄 Лес лёг ПОВЕРХ всего, даже на белый фон. Что не сделал?",
   a:["Не сохранил","Не сделал обтравочную маску","Не выключил ПК","Не то фото"],c:1,
   e:"Обтравка (Alt+клик по границе) запрёт текстуру внутри силуэта."},

  {q:"🤔 Почему для двойной экспозиции берут профиль на светлом небе?",
   a:["Так модно","Чистый силуэт + светлый фон — «Экран» красиво заполняет форму","Меньше весит","Быстрее"],c:1,
   e:"Понятный силуэт и светлый фон — идеальные условия для эффекта."},
  {q:"🤔 Хочешь мрачную, тёмную версию вместо светлой. Какой режим попробовать?",
   a:["Экран","Умножение","Обычные","Никакой"],c:1,
   e:"«Умножение» затемняет — даст драматичную тёмную двойную экспозицию."},
  {q:"🤔 «Карта градиента» раскрасила наоборот (лицо тёмное, фон светлый). Что сделать?",
   a:["Начать заново","Поставить галочку «Инверсия» в свойствах","Удалить слой","Сменить портрет"],c:1,
   e:"Галочка «Инверсия» переворачивает градиент — цвета встанут правильно."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🌲 Двойная экспозиция</h1>
    <div class="sub">Викторина: режимы наложения</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Режимы наложения тебе покорились — свети и затемняй как бог! ✨';}
  else if(pct>=70){em='🎉';msg='Отлично! «Экран» и обтравка — в кармане. Двойные портреты ждут.';}
  else if(pct>=40){em='👍';msg='Неплохо! Запомни: Экран — фонарик, Умножение — тень. И вперёд.';}
  else {em='💪';msg='Начало есть! Перечитай про режимы наложения и светлый фон.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
