<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Гибриды и деформация</title>
<style>
  :root{
    --bg1:#0b3b2e; --bg2:#a16207; --card:#ffffff; --ink:#1e293b;
    --accent:#0d9488; --ok:#16a34a; --bad:#dc2626; --soft:#e0f2f1;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"В каком меню находится «Марионеточная деформация»?",
   a:["Файл","Редактирование","Фильтр","Слои"],c:1,
   e:"Меню «Редактирование» → «Марионеточная деформация». Появится сетка, куда ставим булавки."},
  {q:"Чем «Деформация» (Warp) отличается от «Марионеточной деформации»?",
   a:["Ничем","Warp гнёт всё сеткой, Марионеточная — на булавках (одно держим, другое гнём)","Warp только для текста","Марионеточная удаляет слой"],c:1,
   e:"Warp — общий изгиб «резинкой». Puppet Warp — точный изгиб «в суставах» на булавках."},
  {q:"Булавка Марионеточной деформации, которую ты НЕ трогаешь, что делает?",
   a:["Гнёт всё","Держит это место на месте","Удаляет слой","Меняет цвет"],c:1,
   e:"Неподвижная булавка фиксирует участок. Ставь её у основания детали, чтобы оно не «уползало»."},
  {q:"Как «взять образец» инструментом «Штамп»?",
   a:["Просто кликнуть","Зажать Alt и кликнуть по чистому месту","Нажать Enter","Сохранить"],c:1,
   e:"Alt+клик — берёшь образец. Потом отпускаешь Alt и красишь — образец копируется."},
  {q:"Как вырезать деталь и НЕ удалить остальное навсегда?",
   a:["Ластиком","Выделить и добавить слой-маску (чёрное прячет)","Delete","Обрезать"],c:1,
   e:"Маска прячет лишнее обратимо. Кнопка маски ▢ — внизу панели слоёв."},
  {q:"Как войти в режим «Деформация» (Warp)?",
   a:["Ctrl+S","Ctrl+T → правой кнопкой → «Деформация»","Ctrl+Z","F7"],c:1,
   e:"Свободная трансформация `Ctrl+T`, затем правой кнопкой по картинке → «Деформация» (сетка 3×3)."},
  {q:"Чтобы гнуть деталь много раз без потери качества, слой лучше сделать…",
   a:["Фоном","Смарт-объектом","Чёрным","Скрытым"],c:1,
   e:"Смарт-объект (правой кнопкой по слою) хранит оригинал — гни сколько хочешь, качество цело."},
  {q:"Как сделать коррекцию цвета ТОЛЬКО для приделанной детали?",
   a:["Никак","Сделать корректирующий слой обтравочным (Alt+клик по границе между слоями)","Стереть фон","Сохранить в PNG"],c:1,
   e:"Обтравочная маска привязывает коррекцию к одному слою — красим только деталь."},
  {q:"Где у слоя поле «Непрозр.» (чтобы приглушить тень)?",
   a:["В строке меню","Вверху панели слоёв справа","На панели инструментов","Внизу экрана"],c:1,
   e:"Панель слоёв справа снизу, поле «Непрозр.» — в её верхней части."},
  {q:"Чем сгладить стык детали и тела?",
   a:["Ластиком навсегда","Мягкой кистью по маске + «Штампом»","Резкой кистью","Никак"],c:1,
   e:"Мягкая маска прячет резкий край, Штамп затирает шов соседней текстурой."},

  {q:"😄 Приделал собаке прямой хобот — торчит палкой. Что делать?",
   a:["Оставить, это авангард","Согнуть Деформацией / Марионеточной деформацией","Удалить собаку","Позвать слона"],c:1,
   e:"Хобот должен свисать. Гнём Warp'ом и булавками — станет как настоящий."},
  {q:"😄 Тянешь один узел деформации изо всех сил. Что будет?",
   a:["Красота","Картинку «поведёт», растянет уродливо","ПК взорвётся","Ничего"],c:1,
   e:"Деформируем маленькими движениями. Резкий рывок = каша из пикселей."},
  {q:"😄 «Марионеточная деформация» серая и не нажимается. Скорее всего слой…",
   a:["Слишком красивый","Это «Фон» с замком — сними замок двойным кликом","Чёрный","Пустой"],c:1,
   e:"Инструмент работает по обычному слою. Снятие замка (двойной клик по «Фон») оживит его."},

  {q:"🤔 Свет на собаке слева, а на хоботе справа. Почему гибрид «разваливается»?",
   a:["Мало пикселей","Разное направление света — тени спорят","Не сохранил PSD","Старый экран"],c:1,
   e:"Свет должен падать с одной стороны на всех частях, иначе глаз видит подделку."},
  {q:"🤔 Хочешь закрепить основание хобота и согнуть только кончик. Как расставить булавки?",
   a:["Одна на кончике","У основания (держит) + на кончике (тянешь)","Совсем без булавок","Гнуть Warp на весь слой"],c:1,
   e:"Булавка-держатель у основания + булавка-тяга на кончике = изгиб только кончика."},
  {q:"🤔 Штампом взял образец далеко от стыка, другого цвета/шерсти. Результат?",
   a:["Идеально","Заплатка не совпадёт — шов будет виден","Быстрее","Ничего не изменится"],c:1,
   e:"Образец берут РЯДОМ со стыком, чтобы цвет и текстура совпали."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🐘🐶 Гибриды и деформация</h1>
    <div class="sub">Викторина по уроку «Собако-слон»</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты гнёшь пиксели как пластилин — собери хоть дракона! 🐉';}
  else if(pct>=70){em='🎉';msg='Отлично! Деформация и Штамп в твоих руках. Зоопарк гибридов ждёт.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори разницу Warp и Марионеточной деформации — и вперёд.';}
  else {em='💪';msg='Начало есть! Перечитай про булавки и Штамп, жми Ctrl+Z на ошибки.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
