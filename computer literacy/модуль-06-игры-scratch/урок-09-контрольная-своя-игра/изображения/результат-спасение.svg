<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="720" height="430" fill="#eef2ff"/>
  <text x="24" y="28" font-size="19" font-weight="800" fill="#1f2937">🏆 Пример контрольной: «Спаси котят!» 🐱🔥</text>
  <text x="24" y="47" font-size="12.5" fill="#64748b">Всё из пройденного, собранное в одну игру. Не копируй — сделай свою «Спасательную миссию».</text>

  <!-- ===== PLAY SCREEN ===== -->
  <g>
    <rect x="24" y="58" width="456" height="284" rx="12" fill="#7a5a44"/>
    <rect x="24" y="58" width="456" height="200" rx="12" fill="#a97b57"/>
    <!-- floor -->
    <rect x="24" y="300" width="456" height="42" fill="#5c4030"/>
    <!-- window/frame decor (Photoshop-style bg hint) -->
    <rect x="60" y="90" width="70" height="60" rx="4" fill="#c99a72" stroke="#8a5a3a" stroke-width="3"/>
    <rect x="360" y="90" width="70" height="60" rx="4" fill="#c99a72" stroke="#8a5a3a" stroke-width="3"/>

    <!-- HUD kitten counter -->
    <text x="300" y="80" font-size="12" font-weight="700" fill="#fff8e1">Спасено:</text>
    <g transform="translate(364,76)">
      <g><circle r="8" fill="#5b4636" stroke="#ffd21e" stroke-width="1.5"/><circle r="8" fill="#ffd21e"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.19;0.95;0.98" dur="6s" repeatCount="indefinite"/></circle></g>
      <g transform="translate(21,0)"><circle r="8" fill="#5b4636" stroke="#ffd21e" stroke-width="1.5"/><circle r="8" fill="#ffd21e"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.317;0.357;0.95;0.98" dur="6s" repeatCount="indefinite"/></circle></g>
      <g transform="translate(42,0)"><circle r="8" fill="#5b4636" stroke="#ffd21e" stroke-width="1.5"/><circle r="8" fill="#ffd21e"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.483;0.523;0.95;0.98" dur="6s" repeatCount="indefinite"/></circle></g>
      <g transform="translate(63,0)"><circle r="8" fill="#5b4636" stroke="#ffd21e" stroke-width="1.5"/><circle r="8" fill="#ffd21e"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.69;0.95;0.98" dur="6s" repeatCount="indefinite"/></circle></g>
      <g transform="translate(84,0)"><circle r="8" fill="#5b4636" stroke="#ffd21e" stroke-width="1.5"/><circle r="8" fill="#ffd21e"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.817;0.857;0.95;0.98" dur="6s" repeatCount="indefinite"/></circle></g>
    </g>

    <!-- kittens (fade when rescued) -->
    <g transform="translate(120,178)"><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.15;0.19;0.93;0.97" dur="6s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="11" fill="#f4a460"/><path d="M-9 -8 L-4 -2 L-12 -1 Z" fill="#f4a460"/><path d="M9 -8 L4 -2 L12 -1 Z" fill="#f4a460"/>
      <circle cx="-4" cy="-1" r="1.6" fill="#222"/><circle cx="4" cy="-1" r="1.6" fill="#222"/><path d="M-3 4 Q0 6 3 4" stroke="#a15a1e" stroke-width="1" fill="none"/></g></g>
    <g transform="translate(220,248)"><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.317;0.357;0.93;0.97" dur="6s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="11" fill="#d9d9d9"/><path d="M-9 -8 L-4 -2 L-12 -1 Z" fill="#d9d9d9"/><path d="M9 -8 L4 -2 L12 -1 Z" fill="#d9d9d9"/>
      <circle cx="-4" cy="-1" r="1.6" fill="#222"/><circle cx="4" cy="-1" r="1.6" fill="#222"/></g></g>
    <g transform="translate(330,158)"><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.483;0.523;0.93;0.97" dur="6s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="11" fill="#f4a460"/><path d="M-9 -8 L-4 -2 L-12 -1 Z" fill="#f4a460"/><path d="M9 -8 L4 -2 L12 -1 Z" fill="#f4a460"/>
      <circle cx="-4" cy="-1" r="1.6" fill="#222"/><circle cx="4" cy="-1" r="1.6" fill="#222"/></g></g>
    <g transform="translate(180,286)"><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.65;0.69;0.93;0.97" dur="6s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="11" fill="#3b3b3b"/><path d="M-9 -8 L-4 -2 L-12 -1 Z" fill="#3b3b3b"/><path d="M9 -8 L4 -2 L12 -1 Z" fill="#3b3b3b"/>
      <circle cx="-4" cy="-1" r="1.6" fill="#fff"/><circle cx="4" cy="-1" r="1.6" fill="#fff"/></g></g>
    <g transform="translate(300,286)"><g><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.817;0.857;0.93;0.97" dur="6s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="11" fill="#f4a460"/><path d="M-9 -8 L-4 -2 L-12 -1 Z" fill="#f4a460"/><path d="M9 -8 L4 -2 L12 -1 Z" fill="#f4a460"/>
      <circle cx="-4" cy="-1" r="1.6" fill="#222"/><circle cx="4" cy="-1" r="1.6" fill="#222"/></g></g>

    <!-- FIRE flames (Animate-style flicker) -->
    <g>
      <g transform="translate(60,300)"><path d="M0 0 C -10 -14 6 -18 0 -34 C 12 -22 14 -6 0 0 Z" fill="#ff6a00"><animate attributeName="opacity" values="0.9;1;0.7;1;0.9" dur="0.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="1,1;1,1.25;1,0.9;1,1.15;1,1" dur="0.5s" repeatCount="indefinite"/></path>
        <path d="M0 0 C -5 -8 3 -11 0 -20 C 7 -13 8 -4 0 0 Z" fill="#ffd21e"/></g>
      <g transform="translate(250,300)"><path d="M0 0 C -10 -14 6 -18 0 -36 C 12 -22 14 -6 0 0 Z" fill="#ff6a00"><animate attributeName="opacity" values="1;0.7;1;0.8;1" dur="0.45s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="1,1.1;1,0.85;1,1.3;1,1;1,1.1" dur="0.45s" repeatCount="indefinite"/></path>
        <path d="M0 0 C -5 -8 3 -11 0 -21 C 7 -13 8 -4 0 0 Z" fill="#ffd21e"/></g>
      <g transform="translate(440,300)"><path d="M0 0 C -10 -14 6 -18 0 -32 C 12 -22 14 -6 0 0 Z" fill="#ff6a00"><animate attributeName="opacity" values="0.8;1;0.75;1;0.8" dur="0.55s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="1,1;1,1.2;1,0.95;1,1.25;1,1" dur="0.55s" repeatCount="indefinite"/></path>
        <path d="M0 0 C -5 -8 3 -11 0 -19 C 7 -13 8 -4 0 0 Z" fill="#ffd21e"/></g>
    </g>

    <!-- FIREMAN hero (Illustrator-style) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="60,295;120,295;220,295;330,295;180,295;300,295;60,295"
        keyTimes="0;0.15;0.317;0.483;0.65;0.817;1" dur="6s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="16" rx="14" ry="4" fill="#000" opacity="0.2"/>
      <rect x="-11" y="-6" width="22" height="22" rx="6" fill="#e11d48"/>
      <circle cx="0" cy="-16" r="11" fill="#ffcf8f" stroke="#d98b3a" stroke-width="1.5"/>
      <path d="M-12 -20 A12 10 0 0 1 12 -20 L12 -18 L-12 -18 Z" fill="#facc15" stroke="#ca8a04" stroke-width="1.5"/>
      <circle cx="-4" cy="-16" r="1.8" fill="#333"/><circle cx="4" cy="-16" r="1.8" fill="#333"/>
    </g>

    <!-- rescue popup -->
    <g transform="translate(300,120)"><text x="0" y="0" font-size="16" font-weight="800" fill="#16a34a" text-anchor="middle" opacity="0">спасён! 🐱
      <animate attributeName="opacity" values="0;1;1;0;0;1;1;0" keyTimes="0;0.17;0.24;0.30;0.48;0.50;0.56;0.62" dur="6s" repeatCount="indefinite"/></text></g>
  </g>

  <!-- ===== SIDE: skills combined ===== -->
  <g transform="translate(496,58)">
    <rect x="0" y="0" width="200" height="284" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="14" y="24" font-size="13" font-weight="800" fill="#334155">Что здесь собрано:</text>
    <g font-size="11.5" fill="#475569" font-weight="600">
      <text x="14" y="48">🎮 движение (у.1–2)</text>
      <text x="14" y="72">⭐ касание/условие (у.3)</text>
      <text x="14" y="96">🔢 счёт + таймер (у.4)</text>
      <text x="14" y="120">👯 клоны-огонь (у.5)</text>
      <text x="14" y="144">📣 победа-сообщение (у.7)</text>
    </g>
    <line x1="14" y1="160" x2="186" y2="160" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="14" y="182" font-size="12.5" font-weight="800" fill="#7c3aed">+ свои ассеты:</text>
    <g font-size="11.5" fill="#475569" font-weight="600">
      <text x="14" y="204">🖌 фон — Photoshop</text>
      <text x="14" y="226">✏️ пожарный — Illustrator</text>
      <text x="14" y="248">🎬 огонь — Animate</text>
    </g>
    <rect x="14" y="260" width="172" height="14" rx="7" fill="#eef2ff"/>
    <text x="100" y="271" font-size="10.5" fill="#3730a3" text-anchor="middle" font-weight="700">= твоя контрольная 🏆</text>
  </g>

  <text x="24" y="366" font-size="12.5" fill="#334155"><tspan font-weight="800">Тема:</tspan> «Спасательная миссия». <tspan font-weight="800">Жанр</tspan> и <tspan font-weight="800">сюжет</tspan> выбираешь сам, приёмы — из шпаргалки модуля.</text>
  <text x="24" y="392" font-size="12" fill="#64748b">💡 Ни одной новой темы — только знакомые приёмы, соединённые вместе. Именно это ты и умеешь!</text>
  <text x="24" y="416" font-size="11.5" fill="#94a3b8">Обязательно: 5 приёмов Scratch + свои фон, герой и анимация из Adobe.</text>
</svg>
