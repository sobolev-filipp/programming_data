<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="720" height="300" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="19" font-weight="800" fill="#1f2937">🎨 Как твои ассеты из Adobe попадают в игру</text>
  <text x="24" y="50" font-size="13" fill="#64748b">Рисуешь в Adobe → экспортируешь картинку → загружаешь в Scratch. Игра становится авторской.</text>

  <!-- three source tools -->
  <g>
    <rect x="24" y="80" width="180" height="70" rx="12" fill="#31a8ff"/>
    <text x="114" y="108" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">🖌 Photoshop</text>
    <text x="114" y="130" font-size="12" fill="#e0f2ff" text-anchor="middle">ФОН (480×360)</text>

    <rect x="24" y="160" width="180" height="60" rx="12" fill="#ff9a00"/>
    <text x="114" y="184" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">✏️ Illustrator</text>
    <text x="114" y="204" font-size="12" fill="#fff3e0" text-anchor="middle">ГЕРОЙ (вектор)</text>

    <rect x="24" y="230" width="180" height="50" rx="12" fill="#d8137f"/>
    <text x="114" y="252" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">🎬 Animate</text>
    <text x="114" y="270" font-size="12" fill="#ffe0f0" text-anchor="middle">АНИМАЦИЯ (кадры)</text>
  </g>

  <!-- export step -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#a9)">
    <path d="M204 115 L 280 150"/>
    <path d="M204 190 L 280 178"/>
    <path d="M204 255 L 280 206"/>
  </g>
  <g>
    <rect x="284" y="150" width="150" height="60" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="359" y="176" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">📤 Экспорт</text>
    <text x="359" y="196" font-size="11.5" fill="#64748b" text-anchor="middle">→ PNG (прозрачный!)</text>
  </g>

  <!-- into scratch -->
  <path d="M434 180 L 510 180" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#a9)"/>
  <g>
    <rect x="514" y="120" width="182" height="120" rx="12" fill="#4c97ff"/>
    <text x="605" y="148" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">🐱 Scratch</text>
    <g font-size="11" fill="#eaf3ff" font-weight="600">
      <text x="528" y="172">«Загрузить фон»</text>
      <text x="528" y="192">«Загрузить спрайт»</text>
      <text x="528" y="212">кадры → костюмы</text>
    </g>
    <rect x="528" y="220" width="154" height="14" rx="7" fill="#1e63c7"/>
    <text x="605" y="231" font-size="10" fill="#fff" text-anchor="middle" font-weight="700">= твоя игра оживает!</text>
  </g>

  <text x="24" y="294" font-size="11.5" fill="#94a3b8">⚠️ У героя и анимации — ПРОЗРАЧНЫЙ фон при экспорте, иначе в игре будет белая рамка.</text>

  <defs>
    <marker id="a9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
