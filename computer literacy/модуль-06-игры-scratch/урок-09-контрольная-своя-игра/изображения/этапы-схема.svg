<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="720" height="260" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="19" font-weight="800" fill="#1f2937">🗺 Как собрать контрольную по шагам</text>
  <text x="24" y="50" font-size="13" fill="#64748b">Иди по порядку — не хватайся за всё сразу. Сначала работает, потом красиво.</text>

  <!-- steps -->
  <g>
    <g>
      <rect x="24" y="72" width="200" height="70" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
      <text x="40" y="98" font-size="22">💭</text><text x="72" y="96" font-size="14" font-weight="800" fill="#3730a3">1. Идея</text>
      <text x="40" y="120" font-size="11" fill="#475569">Кого спасаем? жанр?</text>
      <text x="40" y="134" font-size="11" fill="#475569">победа/проигрыш?</text>
    </g>
    <g>
      <rect x="260" y="72" width="200" height="70" rx="12" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/>
      <text x="276" y="98" font-size="22">🎨</text><text x="308" y="96" font-size="14" font-weight="800" fill="#9d174d">2. Ассеты (Adobe)</text>
      <text x="276" y="120" font-size="11" fill="#475569">фон · герой · анимация</text>
      <text x="276" y="134" font-size="11" fill="#475569">→ экспорт PNG</text>
    </g>
    <g>
      <rect x="496" y="72" width="200" height="70" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <text x="512" y="98" font-size="22">🦴</text><text x="544" y="96" font-size="14" font-weight="800" fill="#1e40af">3. Скелет</text>
      <text x="512" y="120" font-size="11" fill="#475569">фон + герой +</text>
      <text x="512" y="134" font-size="11" fill="#475569">управление работает</text>
    </g>

    <g>
      <rect x="496" y="162" width="200" height="70" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      <text x="512" y="188" font-size="22">⚙️</text><text x="544" y="186" font-size="14" font-weight="800" fill="#166534">4. Механики</text>
      <text x="512" y="210" font-size="11" fill="#475569">спасение · счёт ·</text>
      <text x="512" y="224" font-size="11" fill="#475569">опасность · конец</text>
    </g>
    <g>
      <rect x="260" y="162" width="200" height="70" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
      <text x="276" y="188" font-size="22">✨</text><text x="308" y="186" font-size="14" font-weight="800" fill="#92400e">5. Полировка</text>
      <text x="276" y="210" font-size="11" fill="#475569">звуки, экран старта,</text>
      <text x="276" y="224" font-size="11" fill="#475569">анимация, надписи</text>
    </g>
    <g>
      <rect x="24" y="162" width="200" height="70" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
      <text x="40" y="188" font-size="22">🎤</text><text x="72" y="186" font-size="14" font-weight="800" fill="#5b21b6">6. Защита</text>
      <text x="40" y="210" font-size="11" fill="#475569">расскажи про игру,</text>
      <text x="40" y="224" font-size="11" fill="#475569">приёмы и ассеты</text>
    </g>
  </g>

  <!-- arrows -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#a10)">
    <path d="M224 107 L 258 107"/>
    <path d="M460 107 L 494 107"/>
    <path d="M596 142 L 596 160"/>
    <path d="M496 197 L 462 197"/>
    <path d="M260 197 L 226 197"/>
  </g>

  <text x="240" y="252" font-size="11.5" fill="#94a3b8">💡 Сохраняйся каждые 10 минут! Лучше простая рабочая игра, чем большая сломанная.</text>

  <defs>
    <marker id="a10" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
