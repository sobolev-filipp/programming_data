<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 8: Динозаврик (Scratch)</title>
<style>
  :root{
    --bg1:#f59e0b; --bg2:#16a34a; --card:#ffffff; --ink:#1f2937;
    --accent:#0f766e; --ok:#16a34a; --bad:#dc2626; --soft:#d9f2ee;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что такое переменная «скорость_y» в платформере?",
   a:["Цвет героя","Сколько пикселей вверх/вниз герой пролетает за кадр","Размер спрайта","Номер уровня"],c:1,
   e:"Это скорость по вертикали — на неё каждый кадр двигаем героя."},
  {q:"Как в игре сделать гравитацию?",
   a:["изменить [скорость_y] на -1 каждый кадр","играть звук","создать клон","спрятаться"],c:0,
   e:"Гравитация — постоянно уменьшать скорость (тянуть вниз)."},
  {q:"Как двигать героя с учётом гравитации?",
   a:["перейти в x:0 y:0","изменить y на (скорость_y)","идти 10 шагов","повернуть на 90"],c:1,
   e:"Двигаем героя на текущую скорость каждый кадр."},
  {q:"Что такое прыжок в этом движке?",
   a:["Телепорт вверх на 50","Резкий толчок: установить [скорость_y] в 13","Смена костюма","Новый клон"],c:1,
   e:"Прыжок = большой плюс в скорость; дальше гравитация вернёт вниз."},
  {q:"Почему прыжок разрешают «только с земли» (если y = земля)?",
   a:["Для красоты","Иначе можно жать в воздухе и улететь в космос","Для звука","Без разницы"],c:1,
   e:"Правило «стою на земле» не даёт прыгать в полёте бесконечно."},
  {q:"Что делать, когда герой упёрся в пол?",
   a:["Ничего","Вернуть на уровень земли и обнулить скорость_y","Создать клон","Сменить фон"],c:1,
   e:"Иначе он проваливается сквозь пол вниз без конца."},
  {q:"Почему нельзя ставить толчок прыжка в цикл «всегда»?",
   a:["Медленно","Толчок сработает каждый кадр — герой улетит вверх","Некрасиво","Нет звука"],c:1,
   e:"Толчок — разовый, по нажатию клавиши."},
  {q:"Как оживить бег героя?",
   a:["Больше клонов","Смена костюмов бег1↔бег2 на земле, поза прыжка в воздухе","Громче звук","Сменить фон"],c:1,
   e:"Костюм показывает состояние: бежит или в прыжке."},
  {q:"Почему динозавр «бежит», хотя стоит на месте по x?",
   a:["Он телепортируется","Навстречу едут кактусы и земля — иллюзия бега","Он невидим","Меняется размер"],c:1,
   e:"Двигается мир, а не герой — так делают все раннеры."},
  {q:"Кто добавляет очко за перепрыгнутый кактус?",
   a:["И дино, и кактус","Только кактус (когда доехал до края и удаляется)","Только дино","Фон"],c:1,
   e:"Считает один — иначе за один кактус будет +2."},

  {q:"😄 Держу пробел — динозавр улетел за верх экрана. Почему?",
   a:["Мало памяти","Толчок стоит в «всегда» (каждый кадр)","Нет фона","Спрайт большой"],c:1,
   e:"Толчок должен быть разовым — в «когда клавиша нажата»."},
  {q:"😄 Динозавр медленно проваливается сквозь землю. Что забыли?",
   a:["Звук","Вернуть на землю: если y<земля → y=земля, скорость=0","Костюм","Клон"],c:1,
   e:"Без «пола» гравитация тянет его вниз бесконечно."},
  {q:"😄 Через минуту игра дико лагает. В чём дело?",
   a:["Слабый ПК всегда","Кактусы-клоны не удаляются (лимит 300)","Нет музыки","Мало костюмов"],c:1,
   e:"Уехавший или столкнувшийся клон надо «удалить этот клон»."},

  {q:"🤔 Чем прыжок динозаврика отличается от взмаха в Flappy Bird?",
   a:["Ничем","Дино толкается только с земли, курочка машет в воздухе","Дино быстрее","Курочка больше"],c:1,
   e:"Движок один, но у Flappy взмах работает в любой точке."},
  {q:"🤔 Почему динозаврик, Flappy и Марио — «одна физика»?",
   a:["Совпадение","У всех гравитация + толчок вверх; меняется управление и препятствия","Один автор","Один цвет"],c:1,
   e:"Освоил движок — соберёшь любую прыгалку."},
  {q:"🤔 Как из раннера сделать настоящий платформер (Марио)?",
   a:["Добавить звук","Ходьба ←/→ + «стою на земле = касаюсь цвета платформы»","Больше кактусов","Ярче фон"],c:1,
   e:"Проверка «касается цвета платформы» позволяет стоять на любых площадках."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🦖 Динозаврик</h1>
    <div class="sub">Викторина по уроку 8 · Scratch</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Движок гравитации и прыжка — полностью твой! 🦖';}
  else if(pct>=70){em='🎉';msg='Отлично! Раннер и платформер тебе по плечу.';}
  else if(pct>=40){em='👍';msg='Неплохо! Помни: гравитация тянет скорость вниз, прыжок — толчок с земли.';}
  else {em='💪';msg='Начало есть! Загляни в самоучитель — там движок по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
