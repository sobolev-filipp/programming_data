<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="700" height="400" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="19" font-weight="800" fill="#1f2937">🌍 Как рождается дуга прыжка</text>
  <text x="24" y="50" font-size="13" fill="#64748b">Гравитация каждый кадр отнимает 1 от «скорость_y». Скорость и рисует дугу.</text>

  <!-- ground -->
  <line x1="40" y1="300" x2="660" y2="300" stroke="#8a8a8a" stroke-width="3"/>
  <text x="46" y="318" font-size="12" fill="#64748b">земля</text>

  <!-- arc (dashed path of jump) -->
  <path d="M110 300 Q 350 60 590 300" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- points with speed values -->
  <g font-size="12" font-weight="700">
    <!-- start -->
    <circle cx="110" cy="300" r="7" fill="#2563eb"/>
    <text x="90" y="332" fill="#2563eb">толчок!</text>
    <rect x="46" y="342" width="150" height="20" rx="5" fill="#2563eb"/><text x="53" y="356" fill="#fff" font-size="11">скорость_y = 13 ⬆</text>

    <!-- rising -->
    <circle cx="200" cy="200" r="6" fill="#3b82f6"/>
    <text x="150" y="196" fill="#3b82f6">взлёт: 13→7</text>
    <text x="150" y="212" fill="#64748b" font-size="10">замедляется ⬆</text>

    <!-- apex -->
    <circle cx="350" cy="120" r="7" fill="#7c3aed"/>
    <text x="318" y="108" fill="#7c3aed">вершина</text>
    <rect x="300" y="126" width="100" height="20" rx="5" fill="#7c3aed"/><text x="307" y="140" fill="#fff" font-size="11">скорость_y = 0</text>

    <!-- falling -->
    <circle cx="500" cy="200" r="6" fill="#ef4444"/>
    <text x="500" y="196" fill="#ef4444">падение: −1→−7</text>
    <text x="500" y="212" fill="#64748b" font-size="10">ускоряется ⬇</text>

    <!-- land -->
    <circle cx="590" cy="300" r="7" fill="#16a34a"/>
    <text x="560" y="332" fill="#16a34a">приземлился</text>
    <rect x="504" y="342" width="156" height="20" rx="5" fill="#16a34a"/><text x="511" y="356" fill="#fff" font-size="11">y=земля → скорость=0</text>
  </g>

  <!-- the engine blocks -->
  <g font-size="11" font-weight="700" fill="#ffffff">
    <text x="24" y="86" font-size="12.5" font-weight="800" fill="#334155">Движок (в цикле «всегда»):</text>
    <rect x="24" y="92" width="250" height="20" rx="4" fill="#ff8c1a"/><text x="31" y="106">изменить [скорость_y] на -1</text>
    <text x="284" y="106" font-size="11" fill="#c2410c" font-weight="700">← гравитация</text>
    <rect x="24" y="114" width="250" height="20" rx="4" fill="#4c97ff"/><text x="31" y="128">изменить y на (скорость_y)</text>
    <text x="284" y="128" font-size="11" fill="#2563eb" font-weight="700">← движение</text>
  </g>

  <text x="24" y="386" font-size="12" fill="#94a3b8">💡 Тот же движок — у динозаврика, Flappy Bird и Марио. Меняется только управление.</text>
</svg>
