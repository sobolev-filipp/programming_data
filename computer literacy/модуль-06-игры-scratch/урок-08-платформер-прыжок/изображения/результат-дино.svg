<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="720" height="360" fill="url(#sky)"/>
  <text x="24" y="30" font-size="19" font-weight="800" fill="#1f2937">🦖 Динозаврик — прыгай через кактусы</text>
  <text x="24" y="49" font-size="12.5" fill="#64748b">Гравитация тянет вниз, пробел даёт толчок вверх — получается дуга прыжка.</text>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g><ellipse cx="0" cy="90" rx="26" ry="12"/><ellipse cx="18" cy="86" rx="18" ry="12"/>
      <animateTransform attributeName="transform" type="translate" values="720,0;-80,0" dur="9s" repeatCount="indefinite"/></g>
    <g><ellipse cx="0" cy="130" rx="20" ry="9"/><ellipse cx="14" cy="127" rx="14" ry="9"/>
      <animateTransform attributeName="transform" type="translate" values="720,0;-80,0" dur="13s" begin="-4s" repeatCount="indefinite"/></g>
  </g>

  <!-- ground -->
  <line x1="0" y1="270" x2="720" y2="270" stroke="#8a8a8a" stroke-width="3"/>
  <g stroke="#c4c4c4" stroke-width="3">
    <g>
      <line x1="40" y1="284" x2="90" y2="284"/><line x1="180" y1="290" x2="210" y2="290"/>
      <line x1="320" y1="284" x2="380" y2="284"/><line x1="500" y1="290" x2="540" y2="290"/><line x1="640" y1="284" x2="690" y2="284"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-200,0" dur="1.1s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- HUD score -->
  <text x="588" y="90" font-size="18" font-weight="800" fill="#535353">Счёт: 07</text>

  <!-- CACTUS moving left -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="560,270;-180,270" dur="4s" repeatCount="indefinite"/>
    <g fill="#4a7c2f">
      <rect x="-6" y="-52" width="13" height="52" rx="3"/>
      <rect x="-18" y="-38" width="10" height="8" rx="3"/><rect x="-18" y="-46" width="8" height="12" rx="3"/>
      <rect x="7" y="-32" width="10" height="8" rx="3"/><rect x="9" y="-40" width="8" height="12" rx="3"/>
    </g>
  </g>

  <!-- DINO (jumps over cactus) -->
  <g transform="translate(140,270)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0,0; 0,0; 0,-58; 0,-74; 0,-58; 0,0; 0,0"
        keyTimes="0;0.60;0.66;0.725;0.79;0.85;1" dur="4s" repeatCount="indefinite"/>
      <g fill="#535353">
        <!-- tail -->
        <rect x="-34" y="-38" width="16" height="9" rx="2"/>
        <!-- body -->
        <rect x="-22" y="-44" width="30" height="34" rx="4"/>
        <!-- neck+head -->
        <rect x="4" y="-58" width="22" height="24" rx="4"/>
        <!-- snout -->
        <rect x="24" y="-50" width="12" height="10" rx="2"/>
        <!-- arm -->
        <rect x="2" y="-32" width="8" height="5" rx="2"/>
        <!-- eye -->
        <circle cx="18" cy="-50" r="2.6" fill="#fff"/>
      </g>
      <!-- running legs (alternate) -->
      <g fill="#535353">
        <rect x="-16" y="-10" width="8" height="12" rx="2">
          <animate attributeName="height" values="12;4;12" dur="0.3s" repeatCount="indefinite"/></rect>
        <rect x="-2" y="-10" width="8" height="12" rx="2">
          <animate attributeName="height" values="4;12;4" dur="0.3s" repeatCount="indefinite"/></rect>
      </g>
    </g>
  </g>

  <!-- +1 popup when cactus passes -->
  <g transform="translate(150,190)">
    <text x="0" y="0" font-size="22" font-weight="800" fill="#16a34a" opacity="0">+1
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.85;0.9;0.96;1" dur="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,10;0,10;0,-14" keyTimes="0;0.85;1" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- physics caption -->
  <g transform="translate(24,300)">
    <rect x="0" y="0" width="672" height="44" rx="10" fill="#ffffff" opacity="0.92"/>
    <text x="16" y="27" font-size="13" fill="#334155"><tspan font-weight="800" fill="#c2410c">Гравитация:</tspan> каждый кадр «скорость_y −1».   <tspan font-weight="800" fill="#2563eb">Прыжок:</tspan> «скорость_y = 13» (толчок вверх, только с земли).</text>
  </g>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#fbfbf6"/>
    </linearGradient>
  </defs>
</svg>
