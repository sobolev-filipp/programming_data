<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 2: Управляй героем (Scratch)</title>
<style>
  :root{
    --bg1:#59c059; --bg2:#4c97ff; --card:#ffffff; --ink:#1f2937;
    --accent:#2f9e44; --ok:#16a34a; --bad:#dc2626; --soft:#e3f6e6;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что задают координаты x и y?",
   a:["Цвет спрайта","Место спрайта на сцене","Скорость","Размер"],c:1,
   e:"x и y — это положение: x вбок, y вверх/вниз."},
  {q:"Куда двигает блок «изменить x на 10»?",
   a:["Вверх","Вправо","Вниз","Влево"],c:1,
   e:"Плюс по x = вправо. Минус по x = влево."},
  {q:"А «изменить y на -10»?",
   a:["Вниз","Вверх","Вправо","Влево"],c:0,
   e:"Минус по y = вниз. Плюс по y = вверх."},
  {q:"Какой блок ловит нажатие стрелки?",
   a:["когда нажат флажок","когда клавиша [стрелка] нажата","всегда","идти 10 шагов"],c:1,
   e:"Событие «когда клавиша нажата» запускает скрипт по клавише."},
  {q:"Почему плавное управление лучше 4 отдельных скриптов?",
   a:["Красивее блоки","Едет непрерывно и работает диагональ (2 клавиши сразу)","Меньше блоков","Громче звук"],c:1,
   e:"Опрос в «всегда» даёт плавность и одновременные клавиши."},
  {q:"Какой блок делает управление плавным?",
   a:["ждать","всегда + если <клавиша нажата?>","перейти в x:0 y:0","следующий костюм"],c:1,
   e:"Цикл «всегда» много раз в секунду проверяет клавиши."},
  {q:"Как не дать герою улететь за экран?",
   a:["Уменьшить размер","если на краю, оттолкнуться (или стенки по x/y)","Убрать фон","Больше костюмов"],c:1,
   e:"«если на краю оттолкнуться» держит героя на сцене."},
  {q:"Чтобы герой не летал «вверх ногами» влево, нужно…",
   a:["перейти в центр","установить способ вращения «влево-вправо»","играть звук","ждать"],c:1,
   e:"Способ вращения «влево-вправо» только зеркалит спрайт."},
  {q:"Как анимировать крылья ТОЛЬКО в полёте?",
   a:["Просто «следующий костюм» в «всегда»","Обернуть «следующий костюм» в «если <клавиша нажата?>»","Добавить фон","Увеличить скорость"],c:1,
   e:"Анимацию привязывают к условию «жмём клавишу»."},
  {q:"Что делает «перейти в x:0 y:0»?",
   a:["Удаляет спрайт","Телепортирует в центр сцены","Меняет костюм","Ускоряет"],c:1,
   e:"x:0 y:0 — центр сцены, удобно для рестарта."},
  {q:"Что нужно, чтобы спрайт начал рисовать след?",
   a:["Поднять перо","Опустить перо","Очистить","Спрятать спрайт"],c:1,
   e:"«Опустить перо» = прижать фломастер к листу; «поднять» = оторвать."},
  {q:"Какой угол поворота нужен, чтобы нарисовать квадрат?",
   a:["45°","90°","120°","60°"],c:1,
   e:"360 ÷ 4 стороны = 90°. Повторить 4 раза: идти + повернуть 90."},

  {q:"😄 Жму «вправо» — герой едет ВНИЗ. В чём дело?",
   a:["Клавиатура сломана","Перепутаны x и y (или знак)","Нет фона","Мало костюмов"],c:1,
   e:"Право/лево — это x; вниз — это y со знаком минус."},
  {q:"😄 Герой улетел за экран и «пропал». Чего не хватило?",
   a:["Звука","Ограничения поля (край/стенки)","Костюмов","Второго спрайта"],c:1,
   e:"Без границ герой уходит в бесконечность."},
  {q:"😄 Нельзя лететь по диагонали, всё рывками. Почему?",
   a:["Слабый компьютер","Остался способ «4 отдельных скрипта»","Нет звука","Много костюмов"],c:1,
   e:"Диагональ и плавность даёт только «всегда»+«если»."},

  {q:"🤔 Чем «управляемый» герой отличается от «автономного» (урок 1)?",
   a:["Ничем","Управляемый реагирует на игрока, автономный действует сам","Управляемый быстрее","Автономный ярче"],c:1,
   e:"Игрок и его клавиши превращают анимацию в игру."},
  {q:"🤔 Почему «непрерывное действие» кладут внутрь цикла «всегда»?",
   a:["Так короче","Чтобы проверка/движение повторялись много раз в секунду","Для цвета","Случайно"],c:1,
   e:"Управление, враги, столкновения — всё живёт в главном цикле."},
  {q:"🤔 Зачем в играх кнопка «вернуться в центр» по пробелу?",
   a:["Для красоты","Быстро тестировать, не перезапуская флажком","Ускоряет игру","Меняет фон"],c:1,
   e:"Рестарт-телепорт экономит время при отладке."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🐉 Управляй героем</h1>
    <div class="sub">Викторина по уроку 2 · Scratch</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты повелитель клавиш — герой слушается на 100%! 🐉';}
  else if(pct>=70){em='🎉';msg='Отлично! Координаты и плавное управление — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: x — вбок, y — вверх/вниз; плавно = «всегда»+«если».';}
  else {em='💪';msg='Начало есть! Загляни в самоучитель — там всё по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
