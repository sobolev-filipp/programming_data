<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 6: Защити планету (Scratch)</title>
<style>
  :root{
    --bg1:#0ea5e9; --bg2:#6366f1; --card:#ffffff; --ink:#1f2937;
    --accent:#4f46e5; --ok:#16a34a; --bad:#dc2626; --soft:#e5e7ff;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Как игрок «стреляет» в Scratch?",
   a:["Рисует пулю каждый раз","Создаёт клон пули по нажатию","Меняет фон","Двигает мышку"],c:1,
   e:"Выстрел = клон-пуля, который штампует игрок по кнопке."},
  {q:"Зачем «перейти к [Ракета]» перед созданием клона пули?",
   a:["Для красоты","Чтобы пуля вылетала ровно из ракеты","Для звука","Для счёта"],c:1,
   e:"Пуля встаёт на ракету — стреляет «из носа», где бы корабль ни был."},
  {q:"Зачем «ждать 0.3» после создания пули-клона?",
   a:["Тормозить игру","Скорострельность + защита от лавины клонов (лимит 300)","Для фона","Ни за чем"],c:1,
   e:"Пауза задаёт темп стрельбы и бережёт лимит клонов."},
  {q:"Как сделать попадание пули по астероиду?",
   a:["ждать 3 сек","если ⟨касается [Пуля]?⟩ / ⟨касается [Астероид]?⟩","идти 10 шагов","очистить"],c:1,
   e:"Оба клона проверяют касание друг друга."},
  {q:"Кто должен добавлять очко при попадании?",
   a:["И пуля, и астероид","Только астероид (умирает один раз)","Только пуля","Ракета"],c:1,
   e:"Иначе за один астероид насчитается +2 очка."},
  {q:"Почему улетевшие вверх пули надо удалять?",
   a:["Для красоты","Иначе клоны копятся, лимит 300, лаги","Так ярче","Не надо"],c:1,
   e:"`если y>170 → удалить этот клон` бережёт ресурсы."},
  {q:"Как появляются астероиды?",
   a:["Сами из воздуха","Родитель штампует клоны в случайных местах вверху","Игрок рисует","Из фона"],c:1,
   e:"Как «дождь» урока 5: спрятаться → случайная точка → создать клон."},
  {q:"Как сделать «урон планете»?",
   a:["если астероид долетел до низа → жизни -1","играть звук","создать клон","спрятаться"],c:0,
   e:"Пропущенный астероид у нижнего края отнимает жизнь."},
  {q:"«касается [Астероид]?» ловит один астероид или все?",
   a:["Только первый","Любой клон этого спрайта — все сразу","Только большой","Никакой"],c:1,
   e:"Одно правило работает для всех клонов-врагов."},
  {q:"Как сделать огонь двигателя и вращение астероида?",
   a:["Нарисовать движение","Смена костюмов в цикле (следующий костюм + ждать)","Больше клонов","Громче звук"],c:1,
   e:"3 костюма + «следующий костюм» = живая анимация."},

  {q:"😄 Через пару секунд игра дико лагает. Что забыли?",
   a:["Звук","Удалять клонов (пули и астероиды)","Фон","Костюм"],c:1,
   e:"Без `удалить этот клон` копятся сотни объектов."},
  {q:"😄 Пуля вылетает из УГЛА, а не из ракеты. Почему?",
   a:["Мало памяти","Нет «перейти к [Ракета]» перед клоном","Нет фона","Спрайт большой"],c:1,
   e:"Клон появляется там, где стоит спрайт-пуля; поставь её на ракету."},
  {q:"😄 За один астероид насчитывается +2 очка. В чём дело?",
   a:["Сломан Scratch","«+1» стоит и у пули, и у астероида","Нет звука","Мало клонов"],c:1,
   e:"Очко должно добавлять только одна сторона (астероид)."},

  {q:"🤔 Чем стрельба отличается от «дождя» (урок 5)?",
   a:["Ничем","Клон пускает игрок, он летит к врагу — клон встречает клон","Быстрее","Ярче"],c:1,
   e:"Появился снаряд игрока и взаимодействие клон↔клон."},
  {q:"🤔 Почему любая «боёвка» = снаряд + враг + касание?",
   a:["Так принято","Это универсальный приём — меняются только картинки","Для оценки","Случайно"],c:1,
   e:"Танки, футбол, защита башни — та же схема, другие спрайты."},
  {q:"🤔 Почему пауза при стрельбе важна не только для баланса?",
   a:["Незачем","Без неё мгновенно упрёшься в лимит 300 клонов","Для цвета","Для звука"],c:1,
   e:"Пауза не даёт за секунду наштамповать сотни пуль."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🚀 Защити планету</h1>
    <div class="sub">Викторина по уроку 6 · Scratch</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Ты защитил планету на 100%! Пули, попадания, клоны — всё твоё! 🚀';}
  else if(pct>=70){em='🎉';msg='Отлично! Стрельба клонами и попадания — под контролем.';}
  else if(pct>=40){em='👍';msg='Неплохо! Помни: пуля у ракеты, очко считает астероид, клонов удалять.';}
  else {em='💪';msg='Начало есть! Загляни в самоучитель — там всё по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
