<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="720" height="470" fill="#f7f9fc"/>
  <text x="24" y="28" font-size="19" font-weight="800" fill="#1f2937">🧩 Итоговая схема блоков — «Защити планету»</text>
  <text x="24" y="48" font-size="12.5" fill="#64748b">Новое — клон встречает клон: пуля 🔫 и астероид ☄️ проверяют касание.</text>

  <g font-weight="700" fill="#ffffff" font-size="11">
    <!-- ===== ROCKET ===== -->
    <text x="24" y="72" font-size="12.5" font-weight="800" fill="#0284c7">🚀 Ракета</text>
    <rect x="24" y="78" width="320" height="20" rx="9" fill="#f5b800"/><text x="31" y="92" fill="#3d2f00">когда 🚩</text>
    <rect x="24" y="100" width="320" height="20" rx="4" fill="#ff8c1a"/><text x="31" y="114">установить [счёт] 0 · [жизни] 3 · y = -150</text>
    <rect x="24" y="122" width="320" height="20" rx="4" fill="#ffab19"/><text x="31" y="136">всегда:</text>
    <rect x="38" y="144" width="306" height="20" rx="4" fill="#4c97ff"/><text x="45" y="158">если ←/→ нажата → изменить x на ±8</text>
    <rect x="38" y="166" width="306" height="20" rx="4" fill="#4c97ff"/><text x="45" y="180">если на краю, оттолкнуться</text>
    <rect x="38" y="188" width="306" height="20" rx="4" fill="#ffab19"/><text x="45" y="202">если ⟨жизни = 0⟩ → сказать (Счёт…) → стоп</text>

    <!-- ===== BULLET ===== -->
    <text x="24" y="240" font-size="12.5" font-weight="800" fill="#a16207">🔫 Пуля — стрельба и клон</text>
    <rect x="24" y="246" width="320" height="20" rx="9" fill="#f5b800"/><text x="31" y="260" fill="#3d2f00">когда 🚩 → спрятаться → всегда:</text>
    <rect x="38" y="268" width="306" height="20" rx="4" fill="#ffab19"/><text x="45" y="282">если ⟨пробел⟩ → перейти к [Ракета] →</text>
    <rect x="52" y="290" width="292" height="20" rx="4" fill="#ffab19"/><text x="59" y="304">создать клон [сам] → ждать 0.3</text>
    <rect x="24" y="316" width="320" height="20" rx="9" fill="#ffab19"/><text x="31" y="330">когда я начинаю как клон → показаться → всегда:</text>
    <rect x="38" y="338" width="306" height="20" rx="4" fill="#4c97ff"/><text x="45" y="352">изменить y на 12</text>
    <rect x="38" y="360" width="306" height="20" rx="4" fill="#ffab19"/><text x="45" y="374">если ⟨касается [Астероид]?⟩ → удалить клон</text>
    <rect x="38" y="382" width="306" height="20" rx="4" fill="#ffab19"/><text x="45" y="396">если ⟨y &gt; 170⟩ → удалить клон</text>

    <!-- ===== ASTEROID ===== -->
    <text x="376" y="72" font-size="12.5" font-weight="800" fill="#b45309">☄️ Астероид — падение и урон</text>
    <rect x="376" y="78" width="322" height="20" rx="9" fill="#f5b800"/><text x="383" y="92" fill="#3d2f00">когда 🚩 → спрятаться → всегда:</text>
    <rect x="390" y="100" width="308" height="20" rx="4" fill="#4c97ff"/><text x="397" y="114">перейти x:(случайное) y:180</text>
    <rect x="390" y="122" width="308" height="20" rx="4" fill="#ffab19"/><text x="397" y="136">создать клон [сам] → ждать (случайное)</text>
    <rect x="376" y="150" width="322" height="20" rx="9" fill="#ffab19"/><text x="383" y="164">когда я начинаю как клон → показаться → всегда:</text>
    <rect x="390" y="172" width="308" height="20" rx="4" fill="#4c97ff"/><text x="397" y="186">изменить y на -4  (падаем)</text>
    <rect x="390" y="194" width="308" height="30" rx="4" fill="#ffab19"/>
    <text x="397" y="207">если ⟨касается [Пуля]?⟩ →</text><text x="397" y="220" font-size="10" fill="#fff8e1">счёт +1 · удалить клон</text>
    <rect x="390" y="226" width="308" height="30" rx="4" fill="#ffab19"/>
    <text x="397" y="239">если ⟨y &lt; -175⟩ (упал на планету) →</text><text x="397" y="252" font-size="10" fill="#fff8e1">жизни −1 · удалить клон</text>

    <!-- collision note -->
    <rect x="376" y="284" width="322" height="86" rx="10" fill="#0b1026"/>
    <text x="392" y="308" font-size="13" font-weight="800" fill="#fbbf24">💥 Попадание = клон ✕ клон</text>
    <text x="392" y="330" font-size="11.5" font-weight="600" fill="#e2e8f0">Пуля и астероид проверяют «касается ...?»</text>
    <text x="392" y="348" font-size="11.5" font-weight="600" fill="#e2e8f0">Очко даёт ТОЛЬКО астероид (иначе +2).</text>
    <text x="392" y="366" font-size="11.5" font-weight="600" fill="#fca5a5">Всех клонов удалять — иначе лаги!</text>
  </g>

  <!-- legend -->
  <g font-size="11" font-weight="600" fill="#475569" transform="translate(24,432)">
    <rect x="0" y="-10" width="14" height="14" rx="3" fill="#f5b800"/><text x="20" y="1">События/клоны-шапка</text>
    <rect x="150" y="-10" width="14" height="14" rx="3" fill="#4c97ff"/><text x="170" y="1">Движение</text>
    <rect x="250" y="-10" width="14" height="14" rx="3" fill="#ffab19"/><text x="270" y="1">Управление (клоны/если)</text>
    <rect x="452" y="-10" width="14" height="14" rx="3" fill="#ff8c1a"/><text x="472" y="1">Переменные</text>
  </g>
  <text x="24" y="460" font-size="11.5" fill="#94a3b8">💡 Пуля появляется у ракеты (`перейти к [Ракета]`), «ждать 0.3» — скорострельность.</text>
</svg>
