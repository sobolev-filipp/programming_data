<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#f7f9fc"/>
  <text x="24" y="34" font-size="20" font-weight="800" fill="#1f2937">🚀 Защити планету — космическая стрелялка ☄️</text>
  <text x="24" y="55" font-size="13" fill="#64748b">Ракета сбивает астероиды пулями. Долетел до планеты — минус жизнь.</text>

  <!-- ===== SPACE STAGE ===== -->
  <rect x="24" y="70" width="440" height="350" rx="12" fill="#0b1026"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="70" cy="120" r="1.5"/><circle cx="150" cy="160" r="1.2"/><circle cx="250" cy="110" r="1.6"/>
    <circle cx="330" cy="150" r="1.3"/><circle cx="410" cy="120" r="1.5"/><circle cx="120" cy="240" r="1.2"/>
    <circle cx="380" cy="260" r="1.4"/><circle cx="200" cy="300" r="1.2"/>
  </g>
  <!-- planet edge (bottom) -->
  <path d="M24 400 q220 -34 440 0 l0 20 l-440 0 z" fill="#3b82f6" opacity="0.5"/>
  <path d="M24 402 q220 -32 440 0" fill="none" stroke="#60a5fa" stroke-width="2"/>

  <!-- Asteroid A (shot) -->
  <g>
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        values="200,90; 200,180; 200,180" keyTimes="0;0.3;1" dur="6s" repeatCount="indefinite"/>
      <g>
        <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.29;0.31;0.99;1" dur="6s" repeatCount="indefinite"/>
        <path d="M0 -16 q7 -6 4 -16" stroke="#f97316" stroke-width="3" fill="none"/>
        <circle cx="0" cy="0" r="13" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
        <circle cx="-4" cy="-2" r="3" fill="#4b5563"/><circle cx="4" cy="4" r="2.5" fill="#4b5563"/>
      </g>
    </g>
  </g>
  <!-- Asteroid B (reaches planet) -->
  <g>
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        values="330,90; 330,90; 330,382; 330,382" keyTimes="0;0.2;0.72;1" dur="6s" repeatCount="indefinite"/>
      <g>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.71;0.74;1" dur="6s" repeatCount="indefinite"/>
        <path d="M0 -16 q7 -6 4 -16" stroke="#f97316" stroke-width="3" fill="none"/>
        <circle cx="0" cy="0" r="13" fill="#6b7280" stroke="#4b5563" stroke-width="2"/>
        <circle cx="-4" cy="-2" r="3" fill="#4b5563"/><circle cx="4" cy="4" r="2.5" fill="#4b5563"/>
      </g>
    </g>
  </g>

  <!-- Bullet A (hits) -->
  <g>
    <rect x="-2" y="-9" width="4" height="18" rx="2" fill="#fde047">
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        values="200,368; 200,196; 200,196" keyTimes="0;0.3;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.29;0.31;0.99;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- Bullet B (misses, flies up) -->
  <g>
    <rect x="-2" y="-9" width="4" height="18" rx="2" fill="#67e8f9">
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        values="250,368; 250,368; 250,90; 250,90" keyTimes="0;0.5;0.9;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.51;0.88;0.9" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- explosion at hit (200,180) -->
  <g transform="translate(200,180)">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.29;0.33;0.42;1" dur="6s" repeatCount="indefinite"/>
    <path d="M0 -20 L5 -6 L20 -6 L8 3 L13 18 L0 8 L-13 18 L-8 3 L-20 -6 L-5 -6 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="216" y="176" font-size="17" font-weight="800" fill="#22c55e">+1<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.31;0.35;0.46;1" dur="6s" repeatCount="indefinite"/></text>
  <text x="352" y="374" font-size="17" font-weight="800" fill="#f87171">−1<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.72;0.76;0.86;1" dur="6s" repeatCount="indefinite"/></text>

  <!-- ROCKET -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="200,384; 210,384; 245,384; 250,384; 200,384" keyTimes="0;0.3;0.6;0.85;1" dur="6s" repeatCount="indefinite"/>
    <path d="M0 -18 L10 8 L-10 8 Z" fill="#9aa4b0" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M-10 8 l-6 8 l6 -2 z" fill="#6b7280"/><path d="M10 8 l6 8 l-6 -2 z" fill="#6b7280"/>
    <circle cx="0" cy="-4" r="3" fill="#38bdf8"/>
    <path d="M-4 9 l4 10 l4 -10 z" fill="#fb923c"><animate attributeName="opacity" values="1;0.5;1" dur="0.2s" repeatCount="indefinite"/></path>
  </g>

  <!-- ===== HUD ===== -->
  <g transform="translate(504,90)">
    <rect x="0" y="0" width="192" height="60" rx="12" fill="#4c97ff"/>
    <text x="16" y="26" font-size="15" font-weight="700" fill="#fff">счёт</text>
    <g font-size="34" font-weight="800" fill="#fff" text-anchor="end">
      <text x="176" y="42"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.3;0.31;1" dur="6s" repeatCount="indefinite"/>0</text>
      <text x="176" y="42"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.31;1" dur="6s" repeatCount="indefinite"/>1</text>
    </g>
    <text x="0" y="92" font-size="15" font-weight="700" fill="#475569">жизни:</text>
    <g>
      <path d="M70 82 q0 -6 6 -6 q4 0 4 4 q0 -4 4 -4 q6 0 6 6 q0 6 -10 12 q-10 -6 -10 -12 z" fill="#ef4444"/>
      <path d="M100 82 q0 -6 6 -6 q4 0 4 4 q0 -4 4 -4 q6 0 6 6 q0 6 -10 12 q-10 -6 -10 -12 z" fill="#ef4444"/>
      <path d="M130 82 q0 -6 6 -6 q4 0 4 4 q0 -4 4 -4 q6 0 6 6 q0 6 -10 12 q-10 -6 -10 -12 z" fill="#ef4444">
        <animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.72;0.74;0.99;1" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="0" y="132" font-size="12" fill="#94a3b8">🔫 Пуля-клон встречает</text>
    <text x="0" y="148" font-size="12" fill="#94a3b8">☄️ астероид-клон = попадание.</text>
  </g>
</svg>
