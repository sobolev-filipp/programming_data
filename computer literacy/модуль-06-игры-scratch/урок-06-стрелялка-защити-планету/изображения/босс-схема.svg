<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="680" height="380" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="20" font-weight="800" fill="#1f2937">👾 Доп «Босс-астероид»</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Огромный враг с полоской здоровья — расстреляй много раз!</text>

  <!-- preview -->
  <rect x="24" y="76" width="230" height="270" rx="10" fill="#0b1026"/>
  <!-- boss -->
  <g transform="translate(139,150)">
    <circle cx="0" cy="0" r="46" fill="#6b7280" stroke="#4b5563" stroke-width="3"/>
    <circle cx="-16" cy="-8" r="8" fill="#4b5563"/><circle cx="14" cy="6" r="7" fill="#4b5563"/><circle cx="4" cy="20" r="6" fill="#4b5563"/>
    <circle cx="-12" cy="10" r="4" fill="#ef4444"/><circle cx="12" cy="-10" r="4" fill="#ef4444"/>
  </g>
  <!-- health bar -->
  <rect x="54" y="94" width="170" height="12" rx="6" fill="#3f3f46"/>
  <rect x="54" y="94" width="110" height="12" rx="6" fill="#22c55e"/>
  <text x="139" y="118" font-size="11" fill="#e2e8f0" text-anchor="middle">здоровье босса: 13 / 20</text>
  <!-- rocket + bullets -->
  <g transform="translate(139,320)">
    <path d="M0 -14 L8 6 L-8 6 Z" fill="#9aa4b0"/>
  </g>
  <rect x="137" y="250" width="4" height="14" rx="2" fill="#fde047"/>
  <rect x="137" y="220" width="4" height="14" rx="2" fill="#fde047"/>

  <!-- scripts -->
  <g font-weight="700" fill="#ffffff" font-size="12">
    <text x="278" y="94" font-size="13" font-weight="800" fill="#334155">Что добавить (у большого астероида):</text>

    <text x="278" y="120" font-size="12" font-weight="700" fill="#b45309">1. Здоровье босса:</text>
    <rect x="278" y="126" width="378" height="22" rx="5" fill="#ff8c1a"/><text x="285" y="141">установить [здоровье босса] в 20   (показать полоской)</text>

    <text x="278" y="172" font-size="12" font-weight="700" fill="#15803d">2. Попадание — минус здоровье:</text>
    <rect x="278" y="178" width="378" height="22" rx="5" fill="#ffab19"/><text x="285" y="193">всегда: если ⟨касается [Пуля]?⟩ →</text>
    <rect x="292" y="202" width="364" height="22" rx="5" fill="#ff8c1a"/><text x="299" y="217">изменить [здоровье босса] на -1</text>

    <text x="278" y="250" font-size="12" font-weight="700" fill="#dc2626">3. Победа:</text>
    <rect x="278" y="256" width="378" height="22" rx="5" fill="#ffab19"/><text x="285" y="271">если ⟨здоровье босса = 0⟩ →</text>
    <rect x="292" y="280" width="364" height="22" rx="5" fill="#9966ff"/><text x="299" y="295">сказать [Босс повержен! 🏆] → стоп всё</text>

    <text x="278" y="326" font-size="12" font-weight="700" fill="#a16207">4. Босс «плюётся»:</text>
    <rect x="278" y="332" width="378" height="20" rx="5" fill="#ffab19"/><text x="285" y="346" font-size="11">ездит влево-вправо и штампует клоны-осколки вниз</text>
  </g>

  <text x="278" y="368" font-size="11" fill="#94a3b8">💡 Сошлись переменные (у.4), клоны (у.5) и попадания (у.6).</text>
</svg>
