<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="720" height="440" fill="#f7f9fc"/>
  <text x="24" y="34" font-size="20" font-weight="800" fill="#1f2937">🐺 Ну, погоди! Волк ловит яйца 🥚</text>
  <text x="24" y="55" font-size="13" fill="#64748b">Яйца-клоны сыплются сверху. Поймал — +1, уронил — −1 жизнь.</text>

  <!-- ===== STAGE ===== -->
  <rect x="24" y="70" width="440" height="350" rx="12" fill="#e8f2ff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="24" y="372" width="440" height="48" rx="0" fill="#bfe3a3"/>
  <rect x="24" y="372" width="440" height="8" fill="#a6d488"/>

  <!-- falling eggs (clones) -->
  <!-- Egg A: caught -->
  <g>
    <g transform="translate(150,0)">
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        values="150,90; 150,340; 150,340" keyTimes="0;0.32;1" dur="6s" repeatCount="indefinite"/>
      <g>
        <animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.31;0.33;0.99;1" dur="6s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="11" ry="14" fill="#fffef7" stroke="#e2d9b0" stroke-width="2"/>
        <ellipse cx="-3" cy="-4" rx="3" ry="4" fill="#ffffff"/>
      </g>
    </g>
  </g>
  <!-- Egg B: missed -->
  <g>
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        values="360,90; 360,90; 360,368; 360,368" keyTimes="0;0.2;0.58;1" dur="6s" repeatCount="indefinite"/>
      <g>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.21;0.57;0.6;1" dur="6s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="11" ry="14" fill="#fffef7" stroke="#e2d9b0" stroke-width="2"/>
        <ellipse cx="-3" cy="-4" rx="3" ry="4" fill="#ffffff"/>
      </g>
    </g>
  </g>
  <!-- Egg C: caught -->
  <g>
    <g>
      <animateTransform attributeName="transform" attributeType="XML" type="translate"
        values="280,90; 280,90; 280,340; 280,340" keyTimes="0;0.5;0.88;1" dur="6s" repeatCount="indefinite"/>
      <g>
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.51;0.88;0.9" dur="6s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="11" ry="14" fill="#fffef7" stroke="#e2d9b0" stroke-width="2"/>
        <ellipse cx="-3" cy="-4" rx="3" ry="4" fill="#ffffff"/>
      </g>
    </g>
  </g>

  <!-- crack on miss (Egg B) -->
  <g transform="translate(360,372)">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.57;0.62;0.72;1" dur="6s" repeatCount="indefinite"/>
    <path d="M-12 0 l4 -6 l3 5 l4 -6 l3 6" stroke="#e0b000" stroke-width="2" fill="none"/>
    <ellipse cx="0" cy="2" rx="16" ry="4" fill="#ffe08a" opacity="0.8"/>
  </g>

  <!-- +1 / -1 popups -->
  <text x="150" y="320" font-size="18" font-weight="800" fill="#16a34a" text-anchor="middle">+1<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.31;0.35;0.45;1" dur="6s" repeatCount="indefinite"/></text>
  <text x="280" y="320" font-size="18" font-weight="800" fill="#16a34a" text-anchor="middle">+1<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.87;0.9;1" dur="6s" repeatCount="indefinite"/></text>
  <text x="392" y="360" font-size="18" font-weight="800" fill="#dc2626" text-anchor="middle">−1<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.58;0.62;0.72;1" dur="6s" repeatCount="indefinite"/></text>

  <!-- ===== WOLF ===== -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="150,352; 150,352; 220,352; 280,352; 280,352" keyTimes="0;0.32;0.55;0.88;1" dur="6s" repeatCount="indefinite"/>
    <!-- legs -->
    <rect x="-10" y="16" width="7" height="16" rx="3" fill="#3f3f46"/>
    <rect x="4" y="16" width="7" height="16" rx="3" fill="#3f3f46"/>
    <!-- body pink -->
    <ellipse cx="0" cy="4" rx="16" ry="14" fill="#ff5c8a" stroke="#e11d63" stroke-width="1.5"/>
    <!-- head gray -->
    <circle cx="2" cy="-16" r="12" fill="#9aa4b0" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M-6 -26 l-2 -7 l7 4 z" fill="#9aa4b0" stroke="#6b7280" stroke-width="1"/>
    <path d="M10 -26 l3 -7 l-6 4 z" fill="#9aa4b0" stroke="#6b7280" stroke-width="1"/>
    <ellipse cx="-3" cy="-14" rx="4" ry="3" fill="#cbd5e1"/>
    <circle cx="0" cy="-18" r="1.6" fill="#111"/>
    <!-- basket in front -->
    <path d="M-26 -2 q6 16 20 16 q14 0 20 -16 z" fill="#a9743a" stroke="#7c4f22" stroke-width="1.5"/>
    <path d="M-24 0 l40 0" stroke="#7c4f22" stroke-width="1.2"/>
    <path d="M-26 -2 q26 -14 46 0" fill="none" stroke="#7c4f22" stroke-width="2"/>
  </g>

  <!-- ===== HUD ===== -->
  <g transform="translate(504,90)">
    <rect x="0" y="0" width="192" height="60" rx="12" fill="#ff8c1a"/>
    <text x="16" y="26" font-size="15" font-weight="700" fill="#fff">счёт</text>
    <g font-size="34" font-weight="800" fill="#fff" text-anchor="end">
      <text x="176" y="42"><animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.32;0.33;0.88;1" dur="6s" repeatCount="indefinite"/>0</text>
      <text x="176" y="42"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.33;0.88;0.89;1" dur="6s" repeatCount="indefinite"/>1</text>
      <text x="176" y="42"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.88;0.89;1" dur="6s" repeatCount="indefinite"/>2</text>
    </g>

    <text x="0" y="92" font-size="15" font-weight="700" fill="#475569">жизни:</text>
    <g>
      <path d="M70 82 q0 -6 6 -6 q4 0 4 4 q0 -4 4 -4 q6 0 6 6 q0 6 -10 12 q-10 -6 -10 -12 z" fill="#ef4444"/>
      <path d="M100 82 q0 -6 6 -6 q4 0 4 4 q0 -4 4 -4 q6 0 6 6 q0 6 -10 12 q-10 -6 -10 -12 z" fill="#ef4444"/>
      <path d="M130 82 q0 -6 6 -6 q4 0 4 4 q0 -4 4 -4 q6 0 6 6 q0 6 -10 12 q-10 -6 -10 -12 z" fill="#ef4444">
        <animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.58;0.6;0.99;1" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>

    <text x="0" y="140" font-size="12" fill="#94a3b8">Одно яйцо-спрайт →</text>
    <text x="0" y="156" font-size="12" fill="#94a3b8">много клонов-«дождь».</text>
  </g>
</svg>
