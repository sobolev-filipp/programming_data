<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 7: Остров приключений (Scratch)</title>
<style>
  :root{
    --bg1:#0d9488; --bg2:#7c3aed; --card:#ffffff; --ink:#1f2937;
    --accent:#7c3aed; --ok:#16a34a; --bad:#dc2626; --soft:#efe6ff;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что делает блок «передать [новый уровень]»?",
   a:["Меняет фон","Кричит сигнал всем спрайтам сразу","Создаёт клон","Прибавляет очко"],c:1,
   e:"«передать» — это сигнал, его слышат все спрайты и Сцена."},
  {q:"Какой блок ловит сигнал?",
   a:["когда я получу [новый уровень]","когда 🚩","всегда","если"],c:0,
   e:"«когда я получу …» — шапка, запускается по приходу сигнала."},
  {q:"Чем сообщение отличается от переменной?",
   a:["Ничем","Сообщение — сигнал «делай сейчас», переменная хранит число","Сообщение хранит число","Переменная — это сигнал"],c:1,
   e:"Переменная хранит число (счёт=5), сообщение ничего не хранит."},
  {q:"Как создать новое сообщение?",
   a:["Нарисовать спрайт","В блоке «передать» ▾ → «Новое сообщение»","Добавить фон","Завести переменную"],c:1,
   e:"Через стрелочку ▾ в блоке «передать» → «Новое сообщение»."},
  {q:"Кто в игре удобнее всего работает «дирижёром» (меняет фоны-экраны)?",
   a:["Герой","Сцена","Звезда","Кнопка"],c:1,
   e:"Фон общий для всех — им логично управлять со Сцены."},
  {q:"Как в Scratch сделать «экраны» игры (старт, уровни, победа)?",
   a:["Разные проекты","Разные фоны + «переключить фон на …»","Разные спрайты","Много клонов"],c:1,
   e:"Каждый экран — свой фон; Сцена переключает их по сигналу."},
  {q:"Что происходит по ОДНОМУ сигналу «новый уровень»?",
   a:["Только меняется фон","Сразу срабатывают все, кто его слушает","Ничего","Игра выключается"],c:1,
   e:"Сцена меняет фон, герой встаёт на старт, звёзды рассыпаются — все вместе."},
  {q:"Почему управление героем ставят под 🚩, а не под «когда я получу [новый уровень]»?",
   a:["Так красивее","Иначе на каждом уровне запустится лишний цикл «всегда»","Для звука","Без разницы"],c:1,
   e:"Циклы по сигналу складываются — герой задёргается. Постоянные циклы — под флажком."},
  {q:"Как замыкается переход на следующий уровень?",
   a:["Само собой","Портал: «изменить уровень на 1» + «передать [новый уровень]»","Нажать флажок","Сменить костюм"],c:1,
   e:"Портал растит уровень и кричит сигнал — Сцена выбирает новый фон."},
  {q:"Как сделать экран «Победа» после 3 уровней?",
   a:["если уровень = 4 → передать [победа]","играть звук","создать клон","очистить"],c:0,
   e:"Когда уровень дорос до 4, Сцена передаёт [победа] и включает финальный фон."},

  {q:"😄 Нажал кнопку «Играть», а ничего не начинается. Что забыли?",
   a:["Звук","Слушателя: ни один спрайт не ловит «когда я получу»","Фон","Костюм"],c:1,
   e:"«передать» без «когда я получу» — крик в пустоту."},
  {q:"😄 Фон не переключается на уровень 2. Самая частая причина?",
   a:["Мало памяти","Опечатка/пробел в имени фона или сообщения","Слишком быстро","Нет звука"],c:1,
   e:"Имя должно совпадать буква в букву — выбирай из списка ▾."},
  {q:"😄 После победы новая игра стартует с 3-го уровня. Почему?",
   a:["Сломан Scratch","Под флажком нет «установить уровень в 1»","Мало клонов","Нет фона"],c:1,
   e:"Флажок должен обнулять «уровень» и «собрано»."},

  {q:"🤔 Чем сообщения похожи на школьный звонок?",
   a:["Ничем","Один сигнал — и все реагируют одновременно","Он громкий","Он длинный"],c:1,
   e:"«Перемена!» — и весь класс встаёт: один сигнал, много реакций."},
  {q:"🤔 Зачем нужен «передать [x] и ждать»?",
   a:["Ускорить игру","Дождаться, пока все слушатели доделают — для сценок по очереди","Для цвета","Для клонов"],c:1,
   e:"Реплики в диалоге идут строго по очереди и не наедут друг на друга."},
  {q:"🤔 Почему игра из «экранов и сигналов» — это как конструктор?",
   a:["Так принято","Из простых сигналов собирается длинный сценарий без гигантского скрипта","Для оценки","Случайно"],c:1,
   e:"Сигнал запускает сигнал (уровень→победа→титры) — сложное из простого."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🏝 Остров приключений</h1>
    <div class="sub">Викторина по уроку 7 · Scratch</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.textContent='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.textContent='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Сообщения, дирижёр и уровни — всё твоё! 🏝';}
  else if(pct>=70){em='🎉';msg='Отлично! Игру из экранов и сигналов ты собрать сможешь.';}
  else if(pct>=40){em='👍';msg='Неплохо! Помни: передать = сигнал, Сцена = дирижёр, имена без опечаток.';}
  else {em='💪';msg='Начало есть! Загляни в самоучитель — там всё по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
