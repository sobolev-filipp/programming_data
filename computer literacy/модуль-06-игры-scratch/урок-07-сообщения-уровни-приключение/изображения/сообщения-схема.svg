<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="680" height="400" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="19" font-weight="800" fill="#1f2937">📣 Как работает сообщение</text>
  <text x="24" y="50" font-size="13" fill="#64748b">Один спрайт «кричит» сигнал — все, кто настроен на это имя, откликаются <tspan font-weight="700">одновременно</tspan>.</text>

  <!-- sender -->
  <g>
    <rect x="40" y="150" width="180" height="60" rx="12" fill="#312e5f"/>
    <text x="130" y="176" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">🔘 Кнопка «Играть»</text>
    <rect x="52" y="184" width="156" height="20" rx="6" fill="#f5b800"/>
    <text x="130" y="198" font-size="11" font-weight="800" fill="#3d2f00" text-anchor="middle">передать [новый уровень]</text>
  </g>
  <text x="130" y="132" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">📣 крикнул один раз</text>

  <!-- radio waves -->
  <g fill="none" stroke="#f5b800" stroke-width="3" opacity="0.8">
    <path d="M232 180 q16 -18 0 -36"/>
    <path d="M244 180 q26 -30 0 -60"/>
    <path d="M244 180 q26 30 0 60"/>
  </g>

  <!-- arrows to receivers -->
  <g stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <path d="M226 165 C 320 90, 360 80, 440 80"/>
    <path d="M226 175 C 320 150, 360 148, 440 148"/>
    <path d="M226 190 C 320 218, 360 220, 440 220"/>
    <path d="M226 200 C 320 288, 360 292, 440 292"/>
  </g>

  <!-- receivers -->
  <g>
    <g>
      <rect x="440" y="58" width="212" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="450" y="66" width="192" height="18" rx="6" fill="#f5b800"/>
      <text x="546" y="79" font-size="10.5" font-weight="800" fill="#3d2f00" text-anchor="middle">когда я получу [новый уровень]</text>
      <text x="546" y="98" font-size="11" fill="#475569" text-anchor="middle">🎬 Сцена → меняет фон</text>
    </g>
    <g>
      <rect x="440" y="126" width="212" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="450" y="134" width="192" height="18" rx="6" fill="#f5b800"/>
      <text x="546" y="147" font-size="10.5" font-weight="800" fill="#3d2f00" text-anchor="middle">когда я получу [новый уровень]</text>
      <text x="546" y="166" font-size="11" fill="#475569" text-anchor="middle">🦸 Герой → встаёт на старт</text>
    </g>
    <g>
      <rect x="440" y="198" width="212" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="450" y="206" width="192" height="18" rx="6" fill="#f5b800"/>
      <text x="546" y="219" font-size="10.5" font-weight="800" fill="#3d2f00" text-anchor="middle">когда я получу [новый уровень]</text>
      <text x="546" y="238" font-size="11" fill="#475569" text-anchor="middle">⭐ Звёзды → рассыпаются</text>
    </g>
    <g>
      <rect x="440" y="270" width="212" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="450" y="278" width="192" height="18" rx="6" fill="#f5b800"/>
      <text x="546" y="291" font-size="10.5" font-weight="800" fill="#3d2f00" text-anchor="middle">когда я получу [новый уровень]</text>
      <text x="546" y="310" font-size="11" fill="#475569" text-anchor="middle">🌀 Портал → прячется</text>
    </g>
  </g>

  <!-- compare box -->
  <g>
    <rect x="24" y="330" width="628" height="54" rx="10" fill="#eef2ff"/>
    <text x="40" y="352" font-size="12.5" font-weight="800" fill="#3730a3">Не путай:</text>
    <text x="40" y="372" font-size="12.5" fill="#334155"><tspan font-weight="700">Переменная</tspan> хранит ЧИСЛО (счёт = 5).   <tspan font-weight="700">Сообщение</tspan> — это СИГНАЛ «делай сейчас», оно ничего не хранит.</text>
  </g>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
