<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="900" height="430" fill="#f7f9fc"/>
  <text x="450" y="36" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">⌨️ ReadLine() спрашивает, WriteLine() отвечает</text>
  <text x="450" y="60" font-size="14" fill="#64748b" text-anchor="middle">программа получает ответ от пользователя и показывает свой</text>

  <!-- USER -->
  <g transform="translate(30,150)">
    <circle cx="55" cy="40" r="34" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
    <text x="55" y="52" font-size="34" text-anchor="middle">🧑</text>
    <text x="55" y="102" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">пользователь</text>
    <text x="55" y="121" font-size="12" fill="#64748b" text-anchor="middle">печатает на клавиатуре</text>
  </g>

  <!-- ReadLine arrow -->
  <g>
    <path d="M 150 178 L 268 178" stroke="#a855f7" stroke-width="4" fill="none"/>
    <polygon points="268,178 254,170 254,186" fill="#a855f7"/>
    <rect x="150" y="142" width="120" height="26" rx="13" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="210" y="160" font-size="12.5" font-weight="700" fill="#7e22ce" text-anchor="middle" font-family="monospace">ReadLine()</text>
    <text x="210" y="206" font-size="12" fill="#64748b" text-anchor="middle">ВВОД: «дай ответ»</text>
  </g>

  <!-- STRING box -->
  <g transform="translate(285,140)">
    <rect x="0" y="0" width="150" height="80" rx="12" fill="#ffffff" stroke="#a855f7" stroke-width="2.5"/>
    <text x="75" y="34" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">строка (string)</text>
    <text x="75" y="62" font-size="24" font-weight="800" fill="#9333ea" text-anchor="middle" font-family="monospace">"5"</text>
  </g>

  <!-- Convert arrow -->
  <g>
    <path d="M 445 178 L 560 178" stroke="#0d9488" stroke-width="4" fill="none"/>
    <polygon points="560,178 546,170 546,186" fill="#0d9488"/>
    <rect x="437" y="142" width="135" height="26" rx="13" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <text x="504" y="160" font-size="11.5" font-weight="700" fill="#0f766e" text-anchor="middle" font-family="monospace">Convert.ToInt32</text>
    <text x="504" y="206" font-size="12" fill="#64748b" text-anchor="middle">превращаем в число</text>
  </g>

  <!-- NUMBER box -->
  <g transform="translate(580,140)">
    <rect x="0" y="0" width="140" height="80" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="70" y="34" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">число (int)</text>
    <text x="70" y="62" font-size="26" font-weight="800" fill="#2563eb" text-anchor="middle" font-family="monospace">5</text>
  </g>

  <!-- screen -->
  <g transform="translate(748,132)">
    <rect x="0" y="0" width="128" height="96" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="14" y="34" font-size="12.5" font-family="monospace" fill="#4ade80">Уровень? 5</text>
    <text x="14" y="58" font-size="12.5" font-family="monospace" fill="#e2e8f0">Осталось</text>
    <text x="14" y="76" font-size="12.5" font-family="monospace" fill="#e2e8f0">95 уровней</text>
    <text x="64" y="118" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">экран (WriteLine)</text>
  </g>

  <!-- warning -->
  <rect x="150" y="310" width="600" height="72" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="450" y="338" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle">⚠️ ReadLine() ВСЕГДА возвращает строку — даже если ввели «5»!</text>
  <text x="450" y="364" font-size="13.5" fill="#7f1d1d" text-anchor="middle">чтобы считать как число, оберни: <tspan font-family="monospace" font-weight="700">int n = Convert.ToInt32(Console.ReadLine());</tspan></text>
</svg>
