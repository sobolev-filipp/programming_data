<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="860" height="380" fill="#f7f9fc"/>
  <text x="430" y="36" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">➗ Деление зависит от ТИПА чисел</text>
  <text x="430" y="60" font-size="14" fill="#64748b" text-anchor="middle">одно и то же <tspan font-family="monospace" fill="#334155">10 / 3</tspan> даёт разный результат — всё решает тип</text>

  <!-- LEFT: int / int -->
  <g transform="translate(50,90)">
    <rect x="0" y="0" width="360" height="240" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <rect x="0" y="0" width="360" height="48" rx="16" fill="#dbeafe"/>
    <rect x="0" y="32" width="360" height="16" fill="#dbeafe"/>
    <text x="180" y="32" font-size="17" font-weight="800" fill="#1d4ed8" text-anchor="middle" font-family="monospace">int / int</text>
    <text x="180" y="100" font-size="30" font-weight="800" fill="#334155" text-anchor="middle" font-family="monospace">10 / 3</text>
    <text x="180" y="150" font-size="26" fill="#94a3b8" text-anchor="middle">= 3,333…</text>
    <text x="180" y="150" font-size="26" fill="#94a3b8" text-anchor="middle" text-decoration="line-through" opacity="0">= 3,333…</text>
    <line x1="235" y1="140" x2="330" y2="140" stroke="#dc2626" stroke-width="2.5"/>
    <text x="180" y="196" font-size="42" font-weight="800" fill="#2563eb" text-anchor="middle" font-family="monospace">3</text>
    <text x="180" y="226" font-size="13" fill="#64748b" text-anchor="middle">дробная часть ОТБРАСЫВАЕТСЯ (нацело)</text>
  </g>

  <!-- RIGHT: double / int -->
  <g transform="translate(450,90)">
    <rect x="0" y="0" width="360" height="240" rx="16" fill="#ffffff" stroke="#0d9488" stroke-width="2.5"/>
    <rect x="0" y="0" width="360" height="48" rx="16" fill="#ccfbf1"/>
    <rect x="0" y="32" width="360" height="16" fill="#ccfbf1"/>
    <text x="180" y="32" font-size="17" font-weight="800" fill="#0f766e" text-anchor="middle" font-family="monospace">(double)10 / 3</text>
    <text x="180" y="100" font-size="26" font-weight="800" fill="#334155" text-anchor="middle" font-family="monospace">10.0 / 3</text>
    <text x="180" y="152" font-size="42" font-weight="800" fill="#0d9488" text-anchor="middle" font-family="monospace">3,33</text>
    <text x="180" y="188" font-size="13" fill="#64748b" text-anchor="middle">дробь сохраняется</text>
    <text x="180" y="214" font-size="13" fill="#334155" text-anchor="middle" font-family="monospace">Math.Round(x, 2) → 3,33</text>
  </g>

  <text x="430" y="360" font-size="13.5" fill="#475569" text-anchor="middle" font-style="italic">💡 Нужна дробь от целых — приведи одно число к double: (double)a / b</text>
</svg>
