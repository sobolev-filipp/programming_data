<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="900" height="360" fill="#f7f9fc"/>
  <text x="450" y="34" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">⚙️ Компиляция: сначала перевести, потом запустить</text>

  <!-- C# compiled path -->
  <text x="40" y="78" font-size="15" font-weight="800" fill="#6d28d9">C# — компилируемый</text>

  <g transform="translate(40,92)">
    <rect x="0" y="0" width="150" height="78" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"/>
    <text x="75" y="30" font-size="26" text-anchor="middle">📄</text>
    <text x="75" y="54" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">твой код</text>
    <text x="75" y="70" font-size="12" fill="#64748b" text-anchor="middle" font-family="monospace">Program.cs</text>
  </g>
  <g><path d="M 196 131 L 246 131" stroke="#6d28d9" stroke-width="4" fill="none"/><polygon points="246,131 232,123 232,139" fill="#6d28d9"/></g>

  <g transform="translate(250,92)">
    <rect x="0" y="0" width="160" height="78" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2.5"/>
    <text x="80" y="30" font-size="26" text-anchor="middle">🏭</text>
    <text x="80" y="54" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">компилятор</text>
    <text x="80" y="70" font-size="11.5" fill="#64748b" text-anchor="middle">переводит ВЕСЬ код</text>
  </g>
  <g><path d="M 416 131 L 466 131" stroke="#6d28d9" stroke-width="4" fill="none"/><polygon points="466,131 452,123 452,139" fill="#6d28d9"/></g>

  <g transform="translate(470,92)">
    <rect x="0" y="0" width="160" height="78" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"/>
    <text x="80" y="30" font-size="26" text-anchor="middle">📦</text>
    <text x="80" y="54" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">готовая программа</text>
    <text x="80" y="70" font-size="12" fill="#64748b" text-anchor="middle" font-family="monospace">.exe</text>
  </g>
  <g><path d="M 636 131 L 686 131" stroke="#6d28d9" stroke-width="4" fill="none"/><polygon points="686,131 672,123 672,139" fill="#6d28d9"/></g>

  <g transform="translate(690,92)">
    <rect x="0" y="0" width="170" height="78" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="85" y="32" font-size="24" text-anchor="middle">▶️</text>
    <text x="85" y="56" font-size="13.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">запуск</text>
    <text x="85" y="72" font-size="12" fill="#4ade80" text-anchor="middle">результат на экране</text>
  </g>

  <!-- divider -->
  <line x1="40" y1="210" x2="860" y2="210" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Python interpreted path (comparison) -->
  <text x="40" y="244" font-size="15" font-weight="800" fill="#2563eb">🐍 Python — интерпретируемый (для сравнения)</text>

  <g transform="translate(40,258)">
    <rect x="0" y="0" width="150" height="66" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="75" y="28" font-size="22" text-anchor="middle">📄</text>
    <text x="75" y="50" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">код .py</text>
  </g>
  <g><path d="M 196 291 L 246 291" stroke="#2563eb" stroke-width="4" fill="none"/><polygon points="246,291 232,283 232,299" fill="#2563eb"/></g>

  <g transform="translate(250,258)">
    <rect x="0" y="0" width="360" height="66" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="180" y="30" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">интерпретатор читает и выполняет</text>
    <text x="180" y="50" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">строку за строкой — сразу</text>
  </g>
  <g><path d="M 616 291 L 666 291" stroke="#2563eb" stroke-width="4" fill="none"/><polygon points="666,291 652,283 652,299" fill="#2563eb"/></g>

  <g transform="translate(670,258)">
    <rect x="0" y="0" width="190" height="66" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="95" y="40" font-size="13" fill="#4ade80" text-anchor="middle" font-family="monospace">результат сразу</text>
  </g>

  <text x="450" y="348" font-size="12.5" fill="#475569" text-anchor="middle" font-style="italic">💡 C# сначала переводит весь код и ловит много ошибок ДО запуска. Python выполнял строчки на ходу.</text>
</svg>
