<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 1: Старт C# (ввод-вывод и типы)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Чем в C# вывести текст на экран?",
   a:["<code>print()</code>","<code>Console.WriteLine()</code>","<code>echo</code>","<code>say()</code>"],c:1,
   e:"В C# вывод — Console.WriteLine(...). print — это был Python."},
  {q:"Что ставят в конце каждой команды в C#?",
   a:["Точку <code>.</code>","Точку с запятой <code>;</code>","Ничего","Двоеточие <code>:</code>"],c:1,
   e:"Каждая команда заканчивается ; — как точка в конце предложения."},
  {q:"Какой ТИП у значения <code>5</code>?",
   a:["<code>string</code>","<code>int</code> (целое)","<code>double</code>","<code>char</code>"],c:1,
   e:"5 без кавычек и без точки — целое число, тип int."},
  {q:"Какой ТИП у значения <code>87.5</code>?",
   a:["<code>int</code>","<code>double</code> (дробное)","<code>string</code>","<code>bool</code>"],c:1,
   e:"Число с точкой — дробное, тип double. В коде именно точка, не запятая."},
  {q:"В каких кавычках пишут <code>string</code> (текст)?",
   a:["В одинарных <code>'...'</code>","В двойных <code>\"...\"</code>","Без кавычек","В скобках"],c:1,
   e:"Строка — в двойных кавычках: \"Маг\". Одинарные — это char."},
  {q:"Как в C# записать тип <code>char</code> (один символ)?",
   a:["<code>\"В\"</code>","<code>'В'</code>","<code>char(В)</code>","<code>[В]</code>"],c:1,
   e:"char — ровно один символ в ОДИНАРНЫХ кавычках: 'В'."},
  {q:"Как правильно записать логический тип?",
   a:["<code>True</code> / <code>False</code>","<code>true</code> / <code>false</code>","<code>да</code> / <code>нет</code>","<code>1</code> / <code>0</code>"],c:1,
   e:"В C# bool пишется маленькими буквами: true / false (в Python было с большой)."},
  {q:"Зачем нужен знак <code>$</code> в <code>$\"Уровень: {x}\"</code>?",
   a:["Для скорости","Разрешает вставить переменную из {x} в текст","Это опечатка","Делает текст жирным"],c:1,
   e:"$ включает интерполяцию — как f-строка в Python. Без $ выведется буквально {x}."},
  {q:"Что вернёт <code>Console.ReadLine()</code>, если ввели 5?",
   a:["Число 5 (int)","Строку \"5\" (string)","Дробное 5.0","Ничего"],c:1,
   e:"ReadLine() ВСЕГДА возвращает строку — даже если ввели цифры."},
  {q:"Как превратить введённую строку в число, чтобы считать?",
   a:["Никак","<code>Convert.ToInt32(Console.ReadLine())</code>","Добавить кавычки","Написать с большой буквы"],c:1,
   e:"Оборачиваем в Convert.ToInt32(...) — аналог int(input()) из Python."},
  {q:"Что напечатает <code>Console.WriteLine(\"2\" + \"3\")</code>?",
   a:["5","23","Ошибку","2 + 3"],c:1,
   e:"Строки не складываются, а склеиваются: \"2\"+\"3\" = \"23\"."},
  {q:"С чего начинается однострочный комментарий в C#?",
   a:["<code>#</code>","<code>//</code>","<code>--</code>","<code>/*</code>"],c:1,
   e:"Однострочный комментарий — //. (В Python был #.) Многострочный — /* ... */."},
  {q:"C# — это какой язык?",
   a:["Интерпретируемый (как Python)","Компилируемый: сначала перевод, потом запуск","Только для сайтов","Язык разметки"],c:1,
   e:"C# компилируется: весь код переводится в программу, и уже она запускается."},
  {q:"Что произойдёт в строке <code>var city = \"Сочи\";</code>?",
   a:["Ошибка — нет типа","Компилятор сам поймёт, что это string","Город станет числом","Ничего"],c:1,
   e:"var — «сам определи тип». Справа строка → значит тип string."},

  {q:"😄 Ты написал <code>console.writeline(\"Привет\")</code> маленькими буквами. Что будет?",
   a:["Всё сработает","Ошибка: C# чувствителен к регистру, нужно <code>Console.WriteLine</code>","Выведет CONSOLE","Запустит игру"],c:1,
   e:"C# различает большие и маленькие буквы: правильно Console.WriteLine."},
  {q:"😄 Забыл поставить <code>;</code> в конце строки. Что скажет C#?",
   a:["Спасибо","Ошибка <code>; expected</code>","Ничего, ; не нужен","Перезагрузится"],c:1,
   e:"Без ; компилятор не поймёт, где конец команды → ; expected."},
  {q:"😄 Спросил уровень через ReadLine и сразу сделал <code>level - 1</code> — ошибка. Что забыл?",
   a:["Сохранить файл","Превратить ввод в число через <code>Convert.ToInt32</code>","Поставить кавычки","Купить новый ПК"],c:1,
   e:"ReadLine даёт строку; для вычислений нужно Convert.ToInt32(...)."},

  {q:"🤔 Почему <code>5</code> и <code>\"5\"</code> — это РАЗНОЕ?",
   a:["Это одно и то же","Разный тип: число можно сложить, строку — только склеить","Кавычки для красоты","5 больше"],c:1,
   e:"Тип решает, что можно делать: с числом — считать, со строкой — склеивать."},
  {q:"🤔 Зачем C# просит писать тип переменной заранее (<code>int x = 5;</code>)?",
   a:["Чтобы было сложнее","Чтобы заранее знать содержимое и ловить ошибки ДО запуска","Для красоты","Это необязательно"],c:1,
   e:"Зная тип, компилятор проверяет код заранее и не даст положить текст в число."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🧊 Старт C#</h1>
    <div class="sub">Викторина по уроку 1 · C# (ввод-вывод и типы)</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Типы, ввод-вывод и Convert — всё в кармане! 🧊';}
  else if(pct>=70){em='🎉';msg='Отлично! Старт на C# уверенный.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: ReadLine даёт строку, для счёта нужен Convert.ToInt32; 5 ≠ "5".';}
  else {em='💪';msg='Начало положено! Загляни в самоучитель — там всё по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
