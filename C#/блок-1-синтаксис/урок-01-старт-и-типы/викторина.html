<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 1: Старт C# (ввод-вывод и типы)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Чем в C# выводят текст на экран?", a:["<code>Console.WriteLine()</code>","<code>print()</code>","<code>System.out.print()</code>","<code>Console.Print()</code>"], c:0, e:"Вывод в C# — Console.WriteLine(). print() — это Python, System.out — Java."},
  {q:"Что ставят в конце каждой команды C#?", a:["Двоеточие <code>:</code>","Косую черту <code>/</code>","Точку с запятой <code>;</code>","Точку <code>.</code>"], c:2, e:"Каждая команда заканчивается ; — как точка в конце предложения."},
  {q:"Какой ТИП у значения <code>5</code>?", a:["<code>string</code>","<code>double</code>","<code>char</code>","<code>int</code>"], c:3, e:"5 — без кавычек и без точки — это целое число, тип int."},
  {q:"Какой ТИП у значения <code>87.5</code>?", a:["<code>bool</code>","<code>double</code>","<code>int</code>","<code>string</code>"], c:1, e:"Число с точкой — дробное, тип double."},
  {q:"В какие кавычки берут <code>string</code> (текст)?", a:["В одинарные <code>'...'</code>","В двойные <code>\"...\"</code>","В «ёлочки» <code>«...»</code>","Вообще без кавычек"], c:1, e:"Строка — в двойных кавычках. Одинарные — это char (один символ)."},
  {q:"Как записать значение типа <code>char</code>?", a:["<code>\"В\"</code>","<code>{В}</code>","<code>'В'</code>","<code>char:В</code>"], c:2, e:"char — ровно один символ в ОДИНАРНЫХ кавычках: 'В'. Двойные — это строка."},
  {q:"Как правильно пишется логический тип?", a:["<code>Да</code> / <code>Нет</code>","<code>True</code> / <code>False</code>","<code>1</code> / <code>0</code>","<code>true</code> / <code>false</code>"], c:3, e:"В C# — true/false маленькими буквами (в Python было с большой)."},
  {q:"Зачем знак <code>$</code> в <code>$\"Счёт: {x}\"</code>?", a:["Разрешает вставить переменную в текст","Переводит число в рубли и валюту","Делает шрифт крупнее и жирнее","Включает проверку орфографии"], c:0, e:"$ включает интерполяцию (как f-строка). Без $ выведется буквально {x}."},
  {q:"Что вернёт <code>ReadLine()</code>, если ввели 5?", a:["Дробное 5.0","Строку <code>\"5\"</code>","Число 5 (int)","Пустоту"], c:1, e:"ReadLine() ВСЕГДА возвращает строку — даже если ввели цифры."},
  {q:"Как превратить введённую строку в целое число?", a:["Написать строку с большой буквы","Обернуть строку в двойные кавычки","Поставить перед строкой плюс","<code>int.Parse(...)</code> или <code>Convert.ToInt32(...)</code>"], c:3, e:"В число — int.Parse(...) или Convert.ToInt32(...). Для дробных: double.Parse / Convert.ToDouble."},
  {q:"Что напечатает <code>\"2\" + \"3\"</code>?", a:["<code>5</code>","<code>23</code>","<code>2 + 3</code>","Ошибку"], c:1, e:"Строки не складываются, а склеиваются: \"2\"+\"3\" = \"23\"."},
  {q:"С чего начинается однострочный комментарий?", a:["<code>#</code>","<code>--</code>","<code>//</code>","<code>&lt;!--</code>"], c:2, e:"Однострочный — //. В Python был #. Многострочный — /* ... */."},
  {q:"C# по способу запуска — какой язык?", a:["Компилируемый: сперва перевод","Интерпретируемый, как Python","Работает только в браузере","Это язык разметки, не код"], c:0, e:"C# компилируется: код переводится в программу, и уже она запускается."},
  {q:"Что сделает <code>var city = \"Сочи\";</code>?", a:["Выдаст ошибку: тип не указан","Сам поймёт, что это string","Сделает город числом","Ничего, var запрещён"], c:1, e:"var — «определи тип сам». Справа строка → значит тип string."},
  {q:"Что даст <code>(int)'A'</code>?", a:["Код символа — число 65","Снова ту же букву A","Строку из одной буквы","Ошибку приведения"], c:0, e:"Символ хранится как код: (int)'A' = 65. Обратно: (char)65 = 'A'."},
  {q:"Как превратить число <code>255</code> в строку?", a:["Разделить 255 на единицу","<code>(255).ToString()</code> или <code>$\"{255}\"</code>","Применить <code>Convert.ToInt32</code>","Прибавить к 255 ноль"], c:1, e:"Число → строка: .ToString() или подстановка в $\"...\"."},
  {q:"Что вернёт <code>(int)87.9</code>?", a:["<code>88</code> — округлит вверх","<code>87</code> — отбросит дробь","<code>87.9</code> без изменений","Ошибку типов"], c:1, e:"Приведение (int) ОТБРАСЫВАЕТ дробную часть, не округляет → 87."},
  {q:"😄 Написал <code>console.writeline(...)</code> маленькими буквами. Что будет?", a:["Выведет текст КАПСОМ","Ошибка: C# различает регистр","Сработает как обычно","Запустит игру"], c:1, e:"C# чувствителен к регистру: правильно Console.WriteLine."},
  {q:"😄 Забыл <code>;</code> в конце строки. Что скажет C#?", a:["Ничего, ; не обязателен","Ошибка: <code>; expected</code>","Молча перезапустится","Напишет «спасибо»"], c:1, e:"Без ; компилятор не поймёт, где конец команды → ; expected."},
  {q:"😄 Записал в коде дробь как <code>87,5</code> (через запятую). Что не так?", a:["Всё верно, так и надо","В коде дробь пишут через точку","Надо писать <code>87;5</code>","Запятая делает число больше"], c:1, e:"В коде дробь — через точку (87.5). Запятая появится лишь при ВЫВОДЕ на русской Windows."},
  {q:"🤔 Почему <code>5</code> и <code>\"5\"</code> — это РАЗНОЕ?", a:["Это одно и то же","Разный тип: число и текст","<code>\"5\"</code> больше по значению","Кавычки просто для красоты"], c:1, e:"Тип решает, что можно делать: число складывают, строку — склеивают."},
  {q:"🤔 Зачем указывать тип заранее (<code>int x = 5;</code>)?", a:["чтобы было просто сложнее","Чтобы ловить ошибки до запуска","Это просто старая традиция","Без типа код быстрее"], c:1, e:"Зная тип, компилятор проверяет код заранее и не даст положить текст в число."}
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🧊 Старт C#</h1>
    <div class="sub">Викторина по уроку 1 · C# (ввод-вывод и типы)</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Типы, ввод-вывод и Convert — всё в кармане! 🧊';}
  else if(pct>=70){em='🎉';msg='Отлично! Старт на C# уверенный.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: ReadLine даёт строку, для счёта нужен Convert.ToInt32; 5 ≠ "5".';}
  else {em='💪';msg='Начало положено! Загляни в самоучитель — там всё по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
