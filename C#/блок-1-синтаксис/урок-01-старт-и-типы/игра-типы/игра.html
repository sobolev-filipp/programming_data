<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сортировщик типов — тренажёр (Урок 1 C#)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:30px 30px 26px;position:relative;overflow:hidden}
  h1{margin:0 0 4px;font-size:25px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:16px;font-size:14px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:14px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:16px}
  .streak{color:#b45309;font-weight:700}
  .card-val{background:#0f172a;border-radius:16px;padding:30px 18px;text-align:center;margin-bottom:8px}
  .card-val .lead{color:#94a3b8;font-size:13px;margin-bottom:10px;font-family:"Segoe UI"}
  .card-val code{color:#e2e8f0;font-size:40px;font-weight:700;font-family:Consolas,"Courier New",monospace;word-break:break-all}
  .hintq{text-align:center;color:#64748b;font-size:15px;margin:12px 0 14px}
  .bins{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  @media(max-width:560px){.bins{grid-template-columns:repeat(3,1fr)}}
  .bin{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:14px 6px;cursor:pointer;
    transition:.15s;text-align:center}
  .bin:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-3px)}
  .bin b{display:block;font-size:17px;color:var(--accent);font-family:Consolas,monospace}
  .bin span{display:block;font-size:11px;color:#94a3b8;margin-top:3px}
  .bin.ok{border-color:var(--ok);background:#dcfce7}.bin.ok b{color:#166534}
  .bin.bad{border-color:var(--bad);background:#fee2e2}.bin.bad b{color:#991b1b}
  .bin:disabled{cursor:default;transform:none}
  .fb{margin-top:14px;padding:13px 15px;border-radius:12px;font-size:15px;display:none;line-height:1.4}
  .fb.show{display:block}.fb.good{background:#dcfce7;color:#166534}.fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:16px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:17px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}.btn:hover{filter:brightness(1.08)}
  .center{text-align:center}.score{font-size:60px;font-weight:800;margin:6px 0}.emoji{font-size:64px}
  .rules{background:var(--soft);border-radius:12px;padding:12px 15px;font-size:13.5px;color:#4c1d95;margin-bottom:14px;line-height:1.45}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// Тренажёр по уроку 1: определи ТИП значения. Главная ловушка — кавычки.
const ROUNDS = [
  {v:'5',            t:'int',    e:"Без кавычек и без точки → целое число int."},
  {v:'"5"',          t:'string', e:"В ДВОЙНЫХ кавычках — это текст (string), а не число!"},
  {v:"'5'",          t:'char',   e:"В ОДИНАРНЫХ кавычках один символ → char."},
  {v:'87.5',         t:'double', e:"Число с точкой → дробное double."},
  {v:'true',         t:'bool',   e:"true/false (маленькими) → логический bool."},
  {v:'"Маг"',        t:'string', e:"Текст в двойных кавычках → string."},
  {v:"'A'",          t:'char',   e:"Один символ в одинарных кавычках → char."},
  {v:'42',           t:'int',    e:"Целое без точки и кавычек → int."},
  {v:'3.14',         t:'double', e:"Есть точка → дробное double."},
  {v:'"true"',       t:'string', e:"Ловушка! В кавычках даже true — это строка string."},
  {v:'false',        t:'bool',   e:"false без кавычек → bool."},
  {v:'"3.14"',       t:'string', e:"Ловушка! В кавычках число — это текст string."},
  {v:"'9'",          t:'char',   e:"Одинарные кавычки, один символ → char (не число!)."},
  {v:'100',          t:'int',    e:"Целое число → int."},
  {v:'"Привет!"',    t:'string', e:"Текст в двойных кавычках → string."},
  {v:'0.5',          t:'double', e:"Точка в числе → double."},
];
const BINS=[
  {t:'int',s:'целое'},{t:'double',s:'дробное'},{t:'string',s:'текст'},
  {t:'bool',s:'да/нет'},{t:'char',s:'символ'}
];

let order=[], i=0, score=0, streak=0, best=0, locked=false;
const app=document.getElementById('app');

function start(){
  order=[...Array(ROUNDS.length).keys()];
  for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  i=0;score=0;streak=0;best=0;render();
}

function render(){
  const Q=ROUNDS[order[i]];
  app.innerHTML=`
    <h1>🧰 Сортировщик типов</h1>
    <div class="sub">Урок 1 · определи ТИП значения. Главная подсказка — кавычки!</div>
    ${i===0?`<div class="rules">Правила: <b>без кавычек и без точки</b> → <code>int</code>; <b>с точкой</b> → <code>double</code>; <b>"двойные кавычки"</b> → <code>string</code>; <b>'одинарные'</b> → <code>char</code>; <b>true/false</b> → <code>bool</code>.</div>`:''}
    <div class="bar"><i style="width:${(i/ROUNDS.length)*100}%"></i></div>
    <div class="meta"><span>Значение ${i+1} из ${ROUNDS.length}</span><span>⭐ ${score} · <span class="streak">🔥 ${streak}</span></span></div>
    <div class="card-val"><div class="lead">какой ТИП у этого значения?</div><code>${Q.v.replace(/</g,'&lt;')}</code></div>
    <div class="bins" id="bins">
      ${BINS.map(b=>`<button class="bin" data-t="${b.t}"><b>${b.t}</b><span>${b.s}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===ROUNDS.length-1?'Итог →':'Дальше →'}</button>`;
  locked=false;
  document.querySelectorAll('.bin').forEach(b=>b.onclick=()=>choose(b.dataset.t));
  document.getElementById('next').onclick=next;
}

function choose(t){
  if(locked)return;locked=true;
  const Q=ROUNDS[order[i]];
  const bins=[...document.querySelectorAll('.bin')];
  bins.forEach(b=>{b.disabled=true; if(b.dataset.t===Q.t)b.classList.add('ok');});
  const fb=document.getElementById('fb');
  if(t===Q.t){score++;streak++;best=Math.max(best,streak);fb.className='fb show good';
    fb.innerHTML='✅ Верно! '+Q.e+(streak>=3?` 🔥 Серия ${streak}!`:'');}
  else{streak=0;bins.find(b=>b.dataset.t===t).classList.add('bad');
    fb.className='fb show no';fb.innerHTML='❌ Мимо. '+Q.e;}
  document.getElementById('next').classList.add('show');
}

function next(){i++; if(i<ROUNDS.length)render(); else result();}

function result(){
  const pct=Math.round(score/ROUNDS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Кавычки и точки тебя не обманут.';}
  else if(pct>=70){em='🎉';msg='Отлично! Типы почти всегда определяешь верно.';}
  else if(pct>=40){em='👍';msg='Неплохо! Помни: кавычки решают — "5" это текст, \'5\' это символ.';}
  else {em='💪';msg='Ещё заход! Перечитай правило про кавычки в итого.md.';}
  app.innerHTML=`<div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${ROUNDS.length}</div>
      <div class="sub">${msg}<br>Лучшая серия подряд: 🔥 ${best}</div>
      <button class="btn show" id="again">🔁 Играть снова</button>
    </div>`;
  document.getElementById('again').onclick=start;
}

document.addEventListener('keydown',e=>{
  const map={'1':'int','2':'double','3':'string','4':'bool','5':'char'};
  if(map[e.key]){const b=document.querySelector(`.bin[data-t="${map[e.key]}"]`); if(b&&!b.disabled)choose(map[e.key]);}
  if(e.key==='Enter'){const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show'))next();}
});

start();
</script>
</body>
</html>
