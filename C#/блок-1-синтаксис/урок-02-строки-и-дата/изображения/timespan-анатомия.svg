<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="900" height="460" fill="#f7f9fc"/>
  <text x="450" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">TimeSpan: «части» против «всего»</text>
  <text x="450" y="68" text-anchor="middle" font-size="15" fill="#64748b">Один и тот же промежуток 2 ч 15 мин можно прочитать двумя способами.</text>

  <text x="450" y="104" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">new TimeSpan(2, 15, 0)  →  2 ч 15 мин</text>

  <!-- bar: 2 hours + 15 min -->
  <rect x="120" y="130" width="480" height="48" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <line x1="360" y1="130" x2="360" y2="178" stroke="#3b82f6" stroke-width="2"/>
  <line x1="600" y1="130" x2="600" y2="178" stroke="#3b82f6" stroke-width="2"/>
  <rect x="600" y="130" width="60" height="48" rx="8" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <text x="240" y="160" text-anchor="middle" font-size="15" fill="#1e40af">1-й час</text>
  <text x="480" y="160" text-anchor="middle" font-size="15" fill="#1e40af">2-й час</text>
  <text x="630" y="160" text-anchor="middle" font-size="13" fill="#b45309">15 м</text>

  <!-- ЧАСТИ -->
  <rect x="120" y="220" width="360" height="150" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
  <text x="140" y="250" font-size="17" font-weight="700" fill="#15803d">ЧАСТИ (как разложено)</text>
  <text x="140" y="284" font-size="15" font-family="Consolas, monospace" fill="#0f172a">.Days    = 0</text>
  <text x="140" y="310" font-size="15" font-family="Consolas, monospace" fill="#0f172a">.Hours   = 2</text>
  <text x="140" y="336" font-size="15" font-family="Consolas, monospace" fill="#0f172a">.Minutes = 15</text>
  <text x="140" y="360" font-size="12.5" fill="#64748b">Hours ≤ 23, Minutes ≤ 59</text>

  <!-- ВСЕГО -->
  <rect x="510" y="220" width="360" height="150" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="530" y="250" font-size="17" font-weight="700" fill="#7c3aed">ВСЕГО (пересчитано целиком)</text>
  <text x="530" y="284" font-size="15" font-family="Consolas, monospace" fill="#0f172a">.TotalHours   = 2.25</text>
  <text x="530" y="310" font-size="15" font-family="Consolas, monospace" fill="#0f172a">.TotalMinutes = 135</text>
  <text x="530" y="336" font-size="15" font-family="Consolas, monospace" fill="#0f172a">.TotalDays    = 0.09…</text>
  <text x="530" y="360" font-size="12.5" fill="#64748b">дробное число</text>

  <text x="450" y="410" text-anchor="middle" font-size="14.5" fill="#334155">«2 ч 15 мин» — это части (.Hours/.Minutes).  «Всего 135 минут» — это .TotalMinutes.</text>
  <text x="450" y="434" text-anchor="middle" font-size="13.5" fill="#64748b">Для «7 дн 5 ч 32 мин» бери части; для «всего N часов» — .Total…</text>
</svg>
