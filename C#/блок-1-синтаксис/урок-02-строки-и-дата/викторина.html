<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 2: Строки и дата (C#)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Как узнать длину строки <code>s</code>?", a:["<code>s.Length</code>","<code>len(s)</code>","<code>s.size</code>","<code>s.count()</code>"], c:0, e:".Length — свойство, без скобок. len() — это был Python."},
  {q:"Как сделать строку <code>s</code> заглавными буквами?", a:["<code>s.ToUpper()</code>","<code>s.upper()</code>","<code>UPPER(s)</code>","<code>s.toBig()</code>"], c:0, e:"Метод с большой буквы и через точку: s.ToUpper()."},
  {q:"Что вернёт <code>\"привет\".Substring(0, 3)</code>?", a:["\"при\"","\"вет\"","\"пр\"","\"ивет\""], c:0, e:"Substring(старт, длина): с 0-го символа, длиной 3 → \"при\"."},
  {q:"С какого номера считаются символы в строке?", a:["с 1","с 0","с -1","с последнего"], c:1, e:"Индексы идут с 0: первый символ — s[0]."},
  {q:"Что вернёт <code>\"привет\"[0]</code>?", a:["'п'","'т'","6","\"привет\""], c:0, e:"s[0] — первый символ строки, это 'п'."},
  {q:"Что делает <code>\"  ок  \".Trim()</code>?", a:["\"ок\"","\"  ОК  \"","пустую строку","ошибку"], c:0, e:"Trim() убирает пробелы по краям → \"ок\"."},
  {q:"Что вернёт <code>\"молоко\".Replace(\"о\", \"а\")</code>?", a:["\"молоко\"","\"молока\"","\"малака\"","ошибку"], c:2, e:"Replace меняет ВСЕ «о» на «а» → \"малака\"."},
  {q:"Что вернёт <code>\"я кот\".Contains(\"кот\")</code>?", a:["<code>true</code>","<code>false</code>","число 2","\"кот\""], c:0, e:"Contains проверяет наличие подстроки → true/false."},
  {q:"Что вернёт <code>IndexOf</code>, если искомого в строке НЕТ?", a:["0","-1","null","ошибку"], c:1, e:"IndexOf возвращает -1, если ничего не нашёл."},
  {q:"Как вывести дату в виде <code>18.08.2026</code>?", a:["<code>DateTime.Now.ToString(\"dd.MM.yyyy\")</code>","<code>DateTime.Format(\"ru\").Short()</code>","<code>Date.Today.ToPrint(\"d.m.y\")</code>","<code>System.Now.AsDate(\"full\")</code>"], c:0, e:"Форматирование — .ToString(\"dd.MM.yyyy\"): дни.месяц.год."},
  {q:"Что вернёт <code>DateTime.Now.AddDays(7)</code>?", a:["дату через 7 дней","число 7","сегодня","выдаст ошибку компиляции"], c:0, e:"AddDays(7) даёт новую дату на 7 дней вперёд."},
  {q:"Чем в формате даты отличается <code>MM</code> от <code>mm</code>?", a:["MM — месяц, mm — минуты","mm — месяц, MM — минуты","оба означают месяц","оба означают минуты"], c:0, e:"MM (большие) — месяц, mm (маленькие) — минуты. Легко перепутать."},
  {q:"Чем отличаются <code>DateTime</code> и <code>TimeSpan</code>?", a:["момент времени и промежуток","это одно и то же","только дата и только время","промежуток и момент (наоборот)"], c:0, e:"DateTime — точка во времени (момент), TimeSpan — длительность (промежуток)."},
  {q:"Что получится из разности двух дат <code>d2 - d1</code>?", a:["промежуток (TimeSpan)","снова дата (DateTime)","строка с датой","количество лет"], c:0, e:"Момент минус момент = TimeSpan. Из него берут .Days / .TotalHours."},
  {q:"Что делает <code>s.StartsWith(\"А\")</code>?", a:["проверяет начало строки","делает первую букву «А»","добавляет «А» в начало","считает буквы «А»"], c:0, e:"StartsWith проверяет, начинается ли строка с «А» → true/false."},
  {q:"Как убрать пробелы и сделать заглавными за один раз?", a:["<code>s.Trim().ToUpper()</code>","<code>s.Clean().Big()</code>","<code>s.Upper().Strip()</code>","<code>s.Caps().NoSpace()</code>"], c:0, e:"Методы цепочкой слева направо: сначала Trim(), потом ToUpper()."},
  {q:"😄 Написал <code>s.Length()</code> со скобками. Что будет?", a:["всё сработает","ошибка: Length без скобок","просто вернёт ноль","удвоит строку"], c:1, e:"Length — свойство, без скобок. Скобки — только у методов."},
  {q:"😄 Сделал <code>s.ToUpper()</code>, а строка не изменилась. Почему?", a:["значит, C# сломался","метод вернул НОВУЮ строку","тут нужны кавычки","ToUpper не бывает"], c:1, e:"Строка неизменяема: возьми результат — s = s.ToUpper();"},
  {q:"😄 У слова из 5 букв взял <code>s[10]</code>. Что будет?", a:["будет пустая строка","ошибка: выход за границы","последняя буква","это один пробел"], c:1, e:"Индексы 0..4; s[10] → IndexOutOfRangeException."},
  {q:"🤔 Почему методы строк возвращают НОВУЮ строку?", a:["так работает медленнее","строка «только для чтения»","это ошибка самого языка","просто чтобы занять память"], c:1, e:"Строки в C# неизменяемы: метод даёт новую строку, а оригинал цел."},
  {q:"🤔 Зачем <code>Contains</code> возвращает <code>true/false</code>?", a:["просто для красоты","чтобы решить в условии if","это происходит случайно","чтобы считать буквы"], c:1, e:"true/false — основа условий: if (mail.Contains(\"@\")) ..."}
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🧵 Строки и дата</h1>
    <div class="sub">Викторина по уроку 2 · C#</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Методы строк и дата — под контролем! 🧵';}
  else if(pct>=70){em='🎉';msg='Отлично! Со строками работаешь уверенно.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: .Length без скобок, метод даёт новую строку, индексы с 0.';}
  else {em='💪';msg='Ещё разок! Загляни в самоучитель — там всё по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
