<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 7: Методы (C#)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что такое метод?", a:["своя команда: пишешь раз, зовёшь много","разновидность типа данных","это разновидность цикла","обычная переменная"], c:0, e:"Метод — код, оформленный как команда: вызывай сколько нужно."},
  {q:"Что означает <code>void</code> перед методом?", a:["метод ничего не возвращает","метод возвращает число","это будет ошибка компиляции","метод всегда пустой"], c:0, e:"void — метод-работник: сделал команды и всё, результата нет."},
  {q:"Что делает <code>return</code> в методе?", a:["возвращает результат наружу","печатает на экран","останавливает программу","создаёт новый метод"], c:0, e:"return отдаёт результат, который можно использовать после вызова."},
  {q:"Как «своя команда» называлась в Python?", a:["<code>def</code>","<code>func</code>","<code>method</code>","<code>void</code>"], c:0, e:"В Python это def. В C# — метод (с типами)."},
  {q:"Что нового у параметров в C# по сравнению с Python?", a:["у них есть ТИП: <code>string name</code>","совсем ничего нового","их всегда больше","они необязательны"], c:0, e:"В C# у каждого параметра указывают тип: void Greet(string name)."},
  {q:"В <code>void Greet(string name)</code> что такое <code>string name</code>?", a:["параметр с типом","возвращаемое значение","комментарий","ошибка"], c:0, e:"Это параметр — данные для метода; string — его тип."},
  {q:"Что вернёт <code>Cube(2)</code>, если <code>int Cube(int x) => x*x*x;</code>?", a:["8","6","4","2"], c:0, e:"2*2*2 = 8."},
  {q:"В чём разница <code>void</code> и типизированного метода?", a:["void делает, типизированный возвращает","никакой разницы нет","void работает быстрее","типизированный печатает"], c:0, e:"void просто делает; метод с типом возвращает результат через return."},
  {q:"Написал метод, но на экране ничего. Что забыл?", a:["вызвать метод по имени","указать тип","комментарий","задаёт какой-то цвет"], c:0, e:"Определить метод мало — его нужно вызвать: Name(...)."},
  {q:"Что такое <code>void Greet(string name = \"гость\")</code>?", a:["параметр по умолчанию","это ошибка","возвращаемое значение","комментарий"], c:0, e:"Вызов Greet() без аргумента → name станет «гость»."},
  {q:"Как передать в метод целый массив?", a:["параметром типа <code>int[] a</code>","никак нельзя","только по одному элементу","только через ref"], c:0, e:"Массив — параметр типа int[]; метод работает со всем массивом."},
  {q:"Зачем нужен <code>ref</code> у параметра?", a:["чтобы менять ОРИГИНАЛ переменной","просто для скорости","только для строк","вообще ни за чем"], c:0, e:"Без ref параметр — копия; с ref метод меняет саму переменную снаружи."},
  {q:"Что делает <code>out</code>-параметр?", a:["возвращает несколько значений сразу","совсем ничего","ускоряет метод","печатает текст"], c:0, e:"out возвращает доп. результаты (MinMax даёт min и max сразу)."},
  {q:"Что ОБЯЗАТЕЛЬНО должно быть у рекурсии?", a:["база — когда остановиться","обязательно цвет","обязательно массив","обязательно ref"], c:0, e:"Без базы рекурсия бесконечна → StackOverflowException."},
  {q:"Метод <code>bool Greater(int a, int b)</code> вернёт...", a:["<code>true</code> или <code>false</code>","это обычное число","строку","ничего"], c:0, e:"Тип bool — метод возвращает true/false."},
  {q:"Можно ли использовать результат <code>void</code>-метода?", a:["нет, void ничего не отдаёт","да, конечно","только число","только строку"], c:0, e:"void не возвращает результат. Нужен — делай типизированный метод + return."},
  {q:"😄 Написал <code>int Add(int a, int b) { }</code> без <code>return</code>. Что будет?", a:["просто вернёт ноль","ошибка: not all code paths return","да, наверное, всё хорошо","просто вернёт a"], c:1, e:"Типизированный метод обязан вернуть значение через return."},
  {q:"😄 Передал в <code>int</code>-параметр слово <code>\"десять\"</code>. Что будет?", a:["сработает","ошибка: тип не совпал","вернёт 10","совсем ничего не произойдёт"], c:1, e:"Тип аргумента должен совпадать с типом параметра (нужно число)."},
  {q:"😄 Сделал <code>Hello()</code> и <code>Hello(name)</code> внизу файла — ошибка. Почему?", a:["так нельзя вообще","локальные функции не перегружаются","просто мало скобок","нужен static"], c:1, e:"У локальных функций нет перегрузки; вместо неё — параметр по умолчанию."},
  {q:"🤔 Зачем вообще выносить код в методы?", a:["чтобы было длиннее","не повторяться и править в одном месте","так требует C#","просто ради скорости работы"], c:1, e:"Пишешь раз, зовёшь много; правишь в одном месте — меньше ошибок."},
  {q:"🤔 Почему главный цикл «RPG-боя» короткий и понятный?", a:["это просто случайность","сложность спрятана в методы","просто мало кода","из-за цвета"], c:1, e:"Методы прячут детали — главный код читается как рассказ: ударил, показал HP."}
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🧩 Методы</h1>
    <div class="sub">Викторина по уроку 7 · C#</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! void, return и параметры — методы освоены! 🧩';}
  else if(pct>=70){em='🎉';msg='Отлично! Свои методы пишешь уверенно.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: void делает, return возвращает, метод надо вызвать.';}
  else {em='💪';msg='Ещё разок! Загляни в самоучитель — там методы по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
