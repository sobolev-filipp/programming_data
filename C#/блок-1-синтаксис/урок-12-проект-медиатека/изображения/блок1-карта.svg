<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="880" height="470" fill="#f7f9fc"/>
  <text x="440" y="36" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">🏆 Блок 1 пройден — что ты теперь умеешь</text>

  <!-- 12 карточек-уроков 4x3 -->
  <!-- row helper: each card 195x100 -->
  <g font-family="'Segoe UI',sans-serif">
    <!-- 1 -->
    <rect x="30"  y="60" width="195" height="88" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="42" y="82" font-size="12.5" font-weight="700" fill="#5b21b6">1 · Типы и ввод-вывод</text>
    <text x="42" y="102" font-size="11" fill="#475569">WriteLine, типы, Convert</text>
    <text x="42" y="120" font-size="11" fill="#475569">арифметика, Math</text>
    <!-- 2 -->
    <rect x="240" y="60" width="195" height="88" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="252" y="82" font-size="12.5" font-weight="700" fill="#5b21b6">2 · Строки и дата</text>
    <text x="252" y="102" font-size="11" fill="#475569">ToUpper, Substring</text>
    <text x="252" y="120" font-size="11" fill="#475569">DateTime</text>
    <!-- 3 -->
    <rect x="450" y="60" width="195" height="88" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="462" y="82" font-size="12.5" font-weight="700" fill="#5b21b6">3 · Условия + switch</text>
    <text x="462" y="102" font-size="11" fill="#475569">if / else, switch</text>
    <text x="462" y="120" font-size="11" fill="#475569">тернарник ?:</text>
    <!-- 4 -->
    <rect x="660" y="60" width="195" height="88" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="672" y="82" font-size="12.5" font-weight="700" fill="#1d4ed8">4 · Циклы for / while</text>
    <text x="672" y="102" font-size="11" fill="#475569">break, continue</text>
    <text x="672" y="120" font-size="11" fill="#475569">Random</text>

    <!-- 5 -->
    <rect x="30"  y="158" width="195" height="88" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="42" y="180" font-size="12.5" font-weight="700" fill="#1d4ed8">5 · foreach, вложенные</text>
    <text x="42" y="200" font-size="11" fill="#475569">do-while, узоры</text>
    <text x="42" y="218" font-size="11" fill="#475569">цвет консоли</text>
    <!-- 6 -->
    <rect x="240" y="158" width="195" height="88" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="252" y="180" font-size="12.5" font-weight="700" fill="#1d4ed8">6 · Массивы</text>
    <text x="252" y="200" font-size="11" fill="#475569">int[], Sort, LINQ</text>
    <text x="252" y="218" font-size="11" fill="#475569">Max/Sum/Average</text>
    <!-- 7 -->
    <rect x="450" y="158" width="195" height="88" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="462" y="180" font-size="12.5" font-weight="700" fill="#1d4ed8">7 · Методы</text>
    <text x="462" y="200" font-size="11" fill="#475569">void / return, =&gt;</text>
    <text x="462" y="218" font-size="11" fill="#475569">ref / out, рекурсия</text>
    <!-- 8 -->
    <rect x="660" y="158" width="195" height="88" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="672" y="180" font-size="12.5" font-weight="700" fill="#047857">8 · List и Dictionary</text>
    <text x="672" y="200" font-size="11" fill="#475569">Add/Remove, счётчик</text>
    <text x="672" y="218" font-size="11" fill="#475569">ключ → значение</text>

    <!-- 9 -->
    <rect x="30"  y="256" width="195" height="88" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
    <text x="42" y="278" font-size="12.5" font-weight="700" fill="#047857">9 · Файлы и исключения</text>
    <text x="42" y="298" font-size="11" fill="#475569">File.*, try/catch</text>
    <text x="42" y="316" font-size="11" fill="#475569">TryParse</text>
    <!-- 10 -->
    <rect x="240" y="256" width="195" height="88" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="252" y="278" font-size="12.5" font-weight="700" fill="#be185d">10 · Классы и объекты</text>
    <text x="252" y="298" font-size="11" fill="#475569">поля, методы, свойства</text>
    <text x="252" y="316" font-size="11" fill="#475569">конструктор, static</text>
    <!-- 11 -->
    <rect x="450" y="256" width="195" height="88" rx="10" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
    <text x="462" y="278" font-size="12.5" font-weight="700" fill="#be185d">11 · Наследование</text>
    <text x="462" y="298" font-size="11" fill="#475569">: Base, virtual/override</text>
    <text x="462" y="316" font-size="11" fill="#475569">полиморфизм, private</text>
    <!-- 12 -->
    <rect x="660" y="256" width="195" height="88" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2.5"/>
    <text x="672" y="278" font-size="12.5" font-weight="700" fill="#a16207">12 · 🏆 Проект</text>
    <text x="672" y="298" font-size="11" fill="#475569">Медиатека — всё вместе</text>
    <text x="672" y="316" font-size="11" fill="#475569">классы+List+файл</text>
  </g>

  <!-- легенда цветов -->
  <g font-size="11.5">
    <rect x="30" y="368" width="16" height="16" rx="3" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="52" y="381" fill="#475569">основы и условия</text>
    <rect x="185" y="368" width="16" height="16" rx="3" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="207" y="381" fill="#475569">циклы, массивы, методы</text>
    <rect x="390" y="368" width="16" height="16" rx="3" fill="#d1fae5" stroke="#10b981"/>
    <text x="412" y="381" fill="#475569">коллекции и файлы</text>
    <rect x="560" y="368" width="16" height="16" rx="3" fill="#fce7f3" stroke="#db2777"/>
    <text x="582" y="381" fill="#475569">ООП</text>
    <rect x="640" y="368" width="16" height="16" rx="3" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="662" y="381" fill="#475569">финальный проект</text>
  </g>

  <rect x="150" y="405" width="580" height="46" rx="12" fill="#fff" stroke="#512bd4" stroke-width="2"/>
  <text x="440" y="425" font-size="14" font-weight="700" fill="#512bd4" text-anchor="middle">От Console.WriteLine до своего приложения с классами и сохранением данных 🎉</text>
  <text x="440" y="443" font-size="12" fill="#64748b" text-anchor="middle">Дальше — Блок 2: 📱 MAUI (те же знания + кнопки и экраны)</text>
</svg>
