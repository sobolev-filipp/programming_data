<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Финал блока 1 (C#)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Как напечатать текст в консоль?", a:["<code>Console.WriteLine()</code>","<code>print()</code>","<code>echo</code>","<code>Show()</code>"], c:0, e:"В C# вывод — Console.WriteLine (в Python был print)."},
  {q:"Как безопасно превратить ввод в число?", a:["<code>int.TryParse(x, out n)</code>","<code>int(x)</code>","<code>x + 0</code>","сделать это никак нельзя"], c:0, e:"TryParse проверяет и достаёт число, не роняя программу."},
  {q:"Что перебирает <code>foreach</code>?", a:["все элементы коллекции","только числа","только файлы","вообще совсем ничего"], c:0, e:"foreach проходит по каждому элементу массива/списка."},
  {q:"Чем <code>List&lt;T&gt;</code> лучше массива?", a:["может расти — Add/Remove","ничем не лучше","он цветной","быстрее всегда"], c:0, e:"У массива размер фиксирован, List растёт."},
  {q:"Как узнать размер списка?", a:["<code>.Count</code>","<code>.Length</code>","<code>.Size</code>","<code>len()</code>"], c:0, e:"У List размер — Count (Length было у массива)."},
  {q:"<code>Dictionary&lt;K,V&gt;</code> — это...", a:["пары «ключ → значение»","обычный список","просто число","разновидность метода"], c:0, e:"Словарь хранит значения по ключам."},
  {q:"Что делает <code>return</code> в методе?", a:["возвращает результат наружу","печатает на экран","останавливает ПК","создаёт метод"], c:0, e:"return отдаёт результат вызвавшему коду."},
  {q:"Как записать данные в файл?", a:["<code>File.WriteAllText</code>","<code>save()</code>","<code>print to file</code>","нельзя"], c:0, e:"File.WriteAllText / AppendAllText пишут в файл."},
  {q:"Зачем <code>try/catch</code>?", a:["поймать ошибку, чтобы не упасть","ускорить код","создать файл","печатать"], c:0, e:"Опасный код в try; ошибку ловит catch."},
  {q:"Что такое класс?", a:["чертёж","это объект","разновидность цикла","просто файл"], c:0, e:"Класс — описание; объект — то, что по нему создано."},
  {q:"Как создать объект?", a:["<code>Book b = new Book(...);</code>","<code>Book b;</code>","<code>make Book;</code>","<code>Book();</code>"], c:0, e:"Объект создаётся через new."},
  {q:"Зачем конструктор?", a:["создать объект сразу с данными","удалить объект","печатать","считать"], c:0, e:"Конструктор задаёт поля при создании объекта."},
  {q:"Как записать наследование «Book от MediaItem»?", a:["<code>class Book : MediaItem</code>","<code>Book + MediaItem</code>","<code>Book = MediaItem</code>","<code>Book extends MediaItem</code>"], c:0, e:"Наследование в C# — через двоеточие."},
  {q:"<code>virtual</code> + <code>override</code> — для чего?", a:["наследник делает метод по-своему","для скорости","просто удалить метод","для файлов"], c:0, e:"virtual разрешает, override переопределяет поведение."},
  {q:"Что такое полиморфизм?", a:["один вызов — разное поведение","это просто много классов","это просто много полей","это разновидность ошибки"], c:0, e:"item.Info() у книги и фильма печатает по-разному."},
  {q:"Зачем поле делать <code>private</code>?", a:["спрятать данные от порчи снаружи","просто ради скорости работы","работает только для чисел","вообще ни за чем"], c:0, e:"private прячет данные — доступ только через методы (инкапсуляция)."},
  {q:"Как показать весь каталог из книг и фильмов?", a:["<code>foreach</code> + <code>m.Info()</code>","куча <code>if</code>","никак нельзя","только по одному"], c:0, e:"Один foreach, а Info() у каждого свой — без if (полиморфизм)."},
  {q:"😄 После «загрузить» каталог пустой. Что забыли?", a:["это обычный файл","присвоить: <code>catalog = Load(...)</code>","задаёт какой-то цвет","new"], c:1, e:"Метод Load возвращает список — его надо присвоить."},
  {q:"😄 Ввели букву вместо года — и упало. Чего не хватило?", a:["цвета","<code>int.TryParse</code> для защиты","нового класса","файла"], c:1, e:"Год надо спрашивать через TryParse (метод AskYear)."},
  {q:"😄 Добавили класс <code>Game</code>, но при загрузке игры пропадают. Почему?", a:["игры нельзя","не добавили ветку GAME в Load","видимо, не хватает памяти","нужен static"], c:1, e:"В Load нужна ветка else if (p[0]==\"GAME\") ..."},
  {q:"🤔 Чему главному научил блок 1?", a:["только печатать текст","собирать программу из кирпичиков","только играть","ничему"], c:1, e:"Большая программа — это знакомые части (типы, циклы, коллекции, классы, файлы), соединённые вместе."},
  {q:"🤔 Хочешь каталог не книг, а игр. Что менять?", a:["всё писать заново","в основном классы и поля","вообще совсем ничего","только цвет"], c:1, e:"Хорошая структура: меняешь классы, «обвязка» (меню/список/файл) остаётся."}
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🏆 Финал блока 1</h1>
    <div class="sub">Большая викторина по всему блоку · C#</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Весь блок 1 у тебя в кармане — готов к MAUI! 🎉';}
  else if(pct>=70){em='🎉';msg='Отлично! Фундамент C# заложен крепко.';}
  else if(pct>=40){em='👍';msg='Неплохо! Пробегись по итогам уроков блока и вернись.';}
  else {em='💪';msg='Ещё разок! Полистай итого.md уроков 8–12 — и снова сюда.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Блок 1 пройден!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
