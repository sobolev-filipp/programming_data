<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 11: Наследование и инкапсуляция (C#)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что такое наследование?", a:["взять готовое от родителя + своё","просто копировать код руками","удалить лишний класс","это разновидность типа"], c:0, e:"Наследник получает поля и методы родителя и добавляет своё."},
  {q:"Как записать, что <code>SavingsAccount</code> наследует <code>Account</code>?", a:["<code>class SavingsAccount : Account</code>","<code>SavingsAccount + Account</code>","<code>SavingsAccount = Account</code>","<code>SavingsAccount extends Account</code>"], c:0, e:"В C# наследование пишут через двоеточие."},
  {q:"Что получает наследник от родителя?", a:["все его поля и методы","вообще совсем ничего","только имя","только конструктор"], c:0, e:"Наследник автоматически получает всё «публичное» от родителя."},
  {q:"Зачем нужен <code>: base(...)</code>?", a:["вызвать конструктор родителя","удалить объект","напечатать текст","создать поле"], c:0, e:"base(...) передаёт данные конструктору родителя, чтобы он заполнил свои поля."},
  {q:"Что означает <code>virtual</code> у метода родителя?", a:["метод можно переопределить","метод работает быстро","метод пустой","метод static"], c:0, e:"virtual разрешает наследнику дать свою версию метода."},
  {q:"Что означает <code>override</code>?", a:["«вот моя версия» метода","совсем новый метод","просто удалить метод","приватный метод"], c:0, e:"override заменяет поведение virtual-метода родителя."},
  {q:"Что делает <code>base.ApplyMonthly()</code> внутри override?", a:["вызовет версию родителя","всё зациклит","удалит счёт","совсем ничего не произойдёт"], c:0, e:"base.Method() выполняет родительскую версию — «как родитель, потом своё»."},
  {q:"Что такое полиморфизм?", a:["один вызов — разное поведение","это просто много классов","это просто много полей","это разновидность ошибки"], c:0, e:"a.ApplyMonthly() у списка Account даёт разное поведение — каждый счёт по-своему."},
  {q:"Зачем список <code>List&lt;Account&gt;</code> из вкладов и карт?", a:["обработать счета единообразно","так вообще нельзя","просто ради скорости работы","только для чисел"], c:0, e:"В список типа родителя кладут любых наследников; каждый действует по-своему."},
  {q:"Что такое инкапсуляция?", a:["прятать данные, доступ через методы","это и есть наследование","это разновидность цикла","это просто обычный файл"], c:0, e:"private прячет поле, public-методы дают безопасный доступ с правилами."},
  {q:"Что делает <code>private</code>?", a:["видно только своему классу","видно вообще всем","видно наследникам","ускоряет работу кода"], c:0, e:"private — доступ только внутри своего класса."},
  {q:"Что делает <code>public</code>?", a:["доступно снаружи","скрывает член","только для чисел","удаляет член"], c:0, e:"public — член доступен отовсюду."},
  {q:"Что такое <code>protected</code>?", a:["для класса И наследников","для вообще всех","строго приватное","это static"], c:0, e:"protected — видно самому классу и наследникам, но не снаружи."},
  {q:"Три кита ООП — это...", a:["инкапсуляция, наследование, полиморфизм","классы, циклы, файлы","поля, методы, свойства","if, for, while"], c:0, e:"Три главных принципа ООП: инкапсуляция, наследование, полиморфизм."},
  {q:"Наследник-вклад добавил метод <code>AddInterest()</code>. У родителя он есть?", a:["нет — только у наследника","да, у родителя тоже","у всех классов","это будет ошибка компиляции"], c:0, e:"Наследник может добавлять СВОИ методы, которых у родителя нет."},
  {q:"«Вклад — это счёт». Как это в коде?", a:["<code>SavingsAccount : Account</code>","<code>Account : SavingsAccount</code>","они не связаны","через static"], c:0, e:"Наследник — это разновидность родителя: SavingsAccount : Account."},
  {q:"😄 У родителя конструктор с параметрами, наследник без <code>: base(...)</code>. Что будет?", a:["да, наверное, всё хорошо","ошибка — нет конструктора без аргументов","будет пустой объект","0"], c:1, e:"Нужно вызвать конструктор родителя через : base(...)."},
  {q:"😄 Забыл <code>virtual</code>, но пишешь <code>override</code>. Итог?", a:["сработает","ошибка — нечего переопределять","станет static","совсем ничего не произойдёт"], c:1, e:"override работает только над virtual-методом родителя."},
  {q:"😄 Написал <code>acc.balance = 1000000;</code>, а <code>balance</code> — <code>protected</code>. Что скажет C#?", a:["разбогател","ошибка — поле недоступно снаружи","ноль","ок"], c:1, e:"Закрытое поле снаружи не достать — в этом смысл инкапсуляции."},
  {q:"🤔 Зачем наследование, если можно скопировать класс?", a:["это совсем незачем","не дублировать: правишь в родителе","так получается короче","просто ради скорости работы"], c:1, e:"Общее живёт в родителе; поправил раз — исправилось у всех наследников."},
  {q:"🤔 Добавляем в банк кредитный счёт. Что достаточно сделать?", a:["переписать весь расчёт","новый класс <code>CreditAccount : Account</code>","удалить старые классы","вообще совсем ничего"], c:1, e:"Благодаря полиморфизму новый наследник работает в старом цикле без изменений."}
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🌳 Наследование и инкапсуляция</h1>
    <div class="sub">Викторина по уроку 11 · C#</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Три кита ООП покорены! 🌳';}
  else if(pct>=70){em='🎉';msg='Отлично! Наследование и инкапсуляция в кармане.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: : base, virtual/override, private.';}
  else {em='💪';msg='Ещё разок! Загляни в самоучитель — там наследование по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
