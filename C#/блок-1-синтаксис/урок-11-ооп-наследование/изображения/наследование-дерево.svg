<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#f7f9fc"/>
  <text x="440" y="36" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">🌳 Наследование — общее берём у «родителя»</text>

  <!-- родитель -->
  <rect x="300" y="62" width="280" height="120" rx="14" fill="#ede9fe" stroke="#6d28d9" stroke-width="3"/>
  <text x="440" y="88" font-size="17" font-weight="700" fill="#5b21b6" text-anchor="middle" font-family="monospace">class Account</text>
  <text x="440" y="107" font-size="12.5" fill="#7c3aed" text-anchor="middle">РОДИТЕЛЬ (базовый счёт)</text>
  <line x1="320" y1="118" x2="560" y2="118" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="320" y="138" font-size="13" fill="#334155" font-family="monospace">Owner, balance</text>
  <text x="320" y="157" font-size="13" fill="#334155" font-family="monospace">Deposit(), Withdraw()</text>
  <text x="320" y="176" font-size="13" fill="#334155" font-family="monospace">virtual ApplyMonthly()</text>

  <!-- линии к детям -->
  <path d="M 440 182 L 440 205 L 165 205 L 165 240" stroke="#6d28d9" stroke-width="2.5" fill="none"/>
  <path d="M 440 182 L 440 240" stroke="#6d28d9" stroke-width="2.5" fill="none"/>
  <path d="M 440 182 L 440 205 L 715 205 L 715 240" stroke="#6d28d9" stroke-width="2.5" fill="none"/>
  <polygon points="165,240 159,228 171,228" fill="#6d28d9"/>
  <polygon points="440,240 434,228 446,228" fill="#6d28d9"/>
  <polygon points="715,240 709,228 721,228" fill="#6d28d9"/>

  <!-- дети -->
  <g>
    <rect x="45" y="243" width="240" height="130" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="165" y="267" font-size="14" font-weight="700" fill="#166534" text-anchor="middle" font-family="monospace">SavingsAccount</text>
    <text x="165" y="285" font-size="11.5" fill="#15803d" text-anchor="middle">вклад</text>
    <text x="62" y="312" font-size="12.5" fill="#64748b" font-family="monospace">+ всё от Account</text>
    <text x="62" y="333" font-size="12.5" fill="#334155" font-family="monospace">override ApplyMonthly()</text>
    <text x="62" y="353" font-size="12.5" fill="#334155" font-family="monospace">+5% в месяц</text>

    <rect x="320" y="243" width="240" height="130" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="440" y="267" font-size="14" font-weight="700" fill="#166534" text-anchor="middle" font-family="monospace">CheckingAccount</text>
    <text x="440" y="285" font-size="11.5" fill="#15803d" text-anchor="middle">карта</text>
    <text x="337" y="312" font-size="12.5" fill="#64748b" font-family="monospace">+ всё от Account</text>
    <text x="337" y="333" font-size="12.5" fill="#334155" font-family="monospace">override ApplyMonthly()</text>
    <text x="337" y="353" font-size="12.5" fill="#334155" font-family="monospace">-10 обслуживание</text>

    <rect x="595" y="243" width="240" height="130" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="715" y="267" font-size="14" font-weight="700" fill="#166534" text-anchor="middle" font-family="monospace">SalaryAccount</text>
    <text x="715" y="285" font-size="11.5" fill="#15803d" text-anchor="middle">зарплатный</text>
    <text x="612" y="312" font-size="12.5" fill="#64748b" font-family="monospace">+ всё от Account</text>
    <text x="612" y="333" font-size="12.5" fill="#334155" font-family="monospace">override ApplyMonthly()</text>
    <text x="612" y="353" font-size="12.5" fill="#334155" font-family="monospace">+ зарплата</text>
  </g>

  <text x="440" y="404" font-size="14" fill="#5b21b6" text-anchor="middle">Общее (владелец, баланс, пополнение) — ОДИН раз в Account · каждый счёт меняет своё (<tspan font-family="monospace">override</tspan>)</text>
  <text x="440" y="423" font-size="12.5" fill="#94a3b8" text-anchor="middle">🐍 как в Python: class SavingsAccount(Account)</text>
</svg>
