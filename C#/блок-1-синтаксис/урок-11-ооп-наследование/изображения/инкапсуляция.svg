<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="860" height="400" fill="#f7f9fc"/>
  <text x="430" y="36" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">🔒 Инкапсуляция — прячем данные, открываем доступ через методы</text>

  <!-- объект-сейф -->
  <rect x="90" y="80" width="330" height="250" rx="16" fill="#fff" stroke="#334155" stroke-width="2.5"/>
  <text x="255" y="108" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle" font-family="monospace">class BankAccount</text>

  <!-- private зона -->
  <rect x="115" y="125" width="280" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="255" y="148" font-size="13.5" font-weight="700" fill="#b91c1c" text-anchor="middle">🔒 private (снаружи НЕ видно)</text>
  <text x="255" y="176" font-size="15" fill="#991b1b" text-anchor="middle" font-family="monospace">private int balance;</text>

  <!-- public зона -->
  <rect x="115" y="210" width="280" height="105" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="255" y="233" font-size="13.5" font-weight="700" fill="#166534" text-anchor="middle">🔓 public (можно снаружи)</text>
  <text x="132" y="260" font-size="14" fill="#14532d" font-family="monospace">Deposit(sum)  — положить</text>
  <text x="132" y="283" font-size="14" fill="#14532d" font-family="monospace">Withdraw(sum) — снять (с проверкой)</text>
  <text x="132" y="306" font-size="14" fill="#14532d" font-family="monospace">Balance       — только читать</text>

  <!-- снаружи -->
  <text x="620" y="118" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Снаружи (твой код)</text>

  <rect x="470" y="140" width="320" height="52" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="486" y="164" font-size="13.5" fill="#14532d" font-family="monospace">acc.Deposit(50);</text>
  <text x="486" y="183" font-size="12.5" fill="#16a34a">✅ можно — через public-метод</text>

  <rect x="470" y="208" width="320" height="52" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="486" y="232" font-size="13.5" fill="#991b1b" font-family="monospace">acc.balance = -999;</text>
  <text x="486" y="251" font-size="12.5" fill="#dc2626">❌ нельзя — balance приватный</text>

  <path d="M 470 166 L 400 166" stroke="#16a34a" stroke-width="2.5" fill="none"/>
  <polygon points="400,166 412,160 412,172" fill="#16a34a"/>

  <rect x="470" y="280" width="320" height="60" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="630" y="303" font-size="12.5" fill="#1d4ed8" text-anchor="middle">Зачем: правила (баланс не в минус)</text>
  <text x="630" y="323" font-size="12.5" fill="#1d4ed8" text-anchor="middle">нельзя обойти — только через методы</text>
</svg>
