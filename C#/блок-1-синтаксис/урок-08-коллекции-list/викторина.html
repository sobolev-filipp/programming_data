<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 8: List и Dictionary (C#)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Чем <code>List&lt;T&gt;</code> лучше массива <code>int[]</code>?", a:["он может РАСТИ (Add)","ничем не лучше","он работает быстрее","он цветной"], c:0, e:"У массива размер фиксирован, а List растёт через Add."},
  {q:"Как добавить элемент в конец списка?", a:["<code>list.Add(x)</code>","<code>list.append(x)</code>","<code>list.Push(x)</code>","<code>list + x</code>"], c:0, e:"В C# — метод Add (в Python это был append)."},
  {q:"Как узнать, сколько элементов в списке?", a:["<code>list.Count</code>","<code>list.Length</code>","<code>list.Size</code>","<code>len(list)</code>"], c:0, e:"У List размер — свойство Count (без скобок). Length — у массива."},
  {q:"Как обратиться к первому элементу списка?", a:["<code>list[0]</code>","<code>list[1]</code>","<code>list.First</code>","<code>list(0)</code>"], c:0, e:"Нумерация с нуля, как в массиве: list[0]."},
  {q:"Что делает <code>list.Contains(\"меч\")</code>?", a:["проверяет, есть ли меч","добавляет меч","удаляет меч","считает мечи"], c:0, e:"Contains отвечает true/false — есть ли такой элемент."},
  {q:"Что вернёт <code>list.IndexOf(x)</code>, если <code>x</code> НЕТ?", a:["-1","0","ошибку","null"], c:0, e:"IndexOf возвращает -1, когда элемента нет."},
  {q:"Что делает <code>list.Sort()</code>?", a:["сортирует сам список","удаляет всё","возвращает новый список","считает сумму"], c:0, e:"Sort меняет порядок самого списка."},
  {q:"Чем <code>Remove(x)</code> отличается от <code>RemoveAt(i)</code>?", a:["Remove по значению, RemoveAt по индексу","они ничем не отличаются","Remove работает быстрее","RemoveAt только для строк"], c:0, e:"Remove ищет значение, RemoveAt удаляет на позиции i."},
  {q:"Что такое <code>Dictionary&lt;K,V&gt;</code>?", a:["пары «ключ → значение»","это обычный список","это массив","это метод"], c:0, e:"Dictionary хранит пары ключ→значение; в Python это словарь { }."},
  {q:"Как положить в словарь пару «меч → 100»?", a:["<code>prices[\"меч\"] = 100</code>","<code>prices.Add(100)</code>","<code>prices = 100</code>","<code>prices(меч,100)</code>"], c:0, e:"Ключ в квадратных скобках: prices[\"меч\"] = 100."},
  {q:"Как проверить, есть ли ключ «щит» в словаре?", a:["<code>prices.ContainsKey(\"щит\")</code>","<code>prices.Contains(\"щит\")</code>","<code>\"щит\" in prices</code>","<code>prices.Has(\"щит\")</code>"], c:0, e:"Для ключа словаря — ContainsKey."},
  {q:"Зачем нужен <code>TryGetValue</code>?", a:["безопасно взять значение по ключу","просто для скорости","для сортировки","вообще ни за чем"], c:0, e:"TryGetValue проверяет ключ и достаёт значение — без исключения."},
  {q:"Как перебрать все пары словаря?", a:["<code>foreach (var p in d)</code> → p.Key/p.Value","<code>for i in d</code>","сделать это никак нельзя","<code>d.All()</code>"], c:0, e:"foreach по словарю даёт пары: p.Key и p.Value."},
  {q:"Могут ли в словаре быть два одинаковых ключа?", a:["нет, ключи уникальны","да, можно","только числа","только строки"], c:0, e:"Ключ уникален; запись по существующему заменяет значение."},
  {q:"Когда лучше <code>Dictionary</code>, а не <code>List</code>?", a:["когда ищем по ключу","вообще никогда","когда данных мало","только для чисел"], c:0, e:"Dictionary — поиск по ключу; List — порядок по номеру."},
  {q:"Как посчитать, сколько раз встречается предмет?", a:["есть ключ → +1, иначе = 1","через Sort","через Reverse","сделать это никак нельзя"], c:0, e:"Классика словаря-счётчика: ContainsKey → ++ иначе = 1."},
  {q:"😄 Написал <code>list.Length</code> у списка — ошибка. Что не так?", a:["List сломан","у списка размер — <code>Count</code>","нужен цвет","забыл точку"], c:1, e:"Length — у массива; у List и словаря — Count."},
  {q:"😄 Взял <code>prices[\"лук\"]</code>, а лука нет. Что будет?", a:["вернёт 0","ошибка <code>KeyNotFoundException</code>","добавит лук","совсем ничего не произойдёт"], c:1, e:"Нет ключа → исключение. Проверяй ContainsKey / TryGetValue."},
  {q:"😄 В списке из 3 элементов позвал <code>RemoveAt(5)</code>. Итог?", a:["удалит последний элемент","ошибка: индекс за границей","просто очистит список","добавит пустой элемент"], c:1, e:"Индекс в 0..Count-1, иначе ArgumentOutOfRangeException."},
  {q:"🤔 Очередь в столовой: список или словарь?", a:["словарь","список — важен порядок","фикс. массив","ни то ни другое"], c:1, e:"Порядок важен, ключей-имён нет → List."},
  {q:"🤔 Телефонная книга (имя → номер): список или словарь?", a:["это обычный список","словарь — поиск по ключу-имени","массив","оба плохи"], c:1, e:"Поиск по ключу (имени) → Dictionary."}
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🎒 List и Dictionary</h1>
    <div class="sub">Викторина по уроку 8 · C#</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! List и Dictionary — коллекции освоены! 🎒';}
  else if(pct>=70){em='🎉';msg='Отлично! Списки и словари в кармане.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: Count (не Length), ContainsKey перед доступом.';}
  else {em='💪';msg='Ещё разок! Загляни в самоучитель — там List и Dictionary по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
