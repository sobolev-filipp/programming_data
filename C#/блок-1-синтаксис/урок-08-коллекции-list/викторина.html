<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 8: List и Dictionary (C#)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Чем <code>List&lt;T&gt;</code> лучше массива <code>int[]</code>?",
   a:["Ничем","Он может РАСТИ — добавляй сколько нужно","Он быстрее","Он цветной"],c:1,
   e:"У массива размер фиксирован, а List растёт через Add."},
  {q:"Как добавить элемент в конец списка?",
   a:["<code>list.append()</code>","<code>list.Add(x)</code>","<code>list.Push(x)</code>","<code>list + x</code>"],c:1,
   e:"В C# — метод Add (в Python это был append)."},
  {q:"Как узнать, сколько элементов в списке?",
   a:["<code>list.Length</code>","<code>list.Count</code>","<code>list.Size</code>","<code>len(list)</code>"],c:1,
   e:"У List размер — свойство Count (без скобок). Length было у массива."},
  {q:"Как обратиться к первому элементу списка?",
   a:["<code>list[1]</code>","<code>list[0]</code>","<code>list.First</code>","<code>list(0)</code>"],c:1,
   e:"Нумерация с нуля, как в массиве: list[0]."},
  {q:"Что делает <code>list.Contains(\"меч\")</code>?",
   a:["Добавляет меч","Проверяет, есть ли меч (True/False)","Удаляет меч","Считает мечи"],c:1,
   e:"Contains отвечает, есть ли такой элемент в списке."},
  {q:"Что вернёт <code>list.IndexOf(x)</code>, если <code>x</code> в списке НЕТ?",
   a:["0","<code>-1</code>","ошибку","null"],c:1,
   e:"IndexOf возвращает -1, когда элемента нет."},
  {q:"Что делает <code>list.Sort()</code>?",
   a:["Удаляет всё","Сортирует сам список","Возвращает новый список","Считает сумму"],c:1,
   e:"Sort сортирует сам список (меняет его порядок)."},
  {q:"Чем <code>Remove(x)</code> отличается от <code>RemoveAt(i)</code>?",
   a:["Ничем","Remove — по значению, RemoveAt — по индексу","Remove быстрее","RemoveAt для строк"],c:1,
   e:"Remove ищет значение, RemoveAt удаляет элемент на позиции i."},
  {q:"Что такое <code>Dictionary&lt;K,V&gt;</code>?",
   a:["Список","Пары «ключ → значение» (как словарь в Python)","Массив","Метод"],c:1,
   e:"Dictionary хранит пары ключ→значение; в Python это словарь { }."},
  {q:"Как положить в словарь пару «меч → 100»?",
   a:["<code>prices.Add(100)</code>","<code>prices[\"меч\"] = 100</code>","<code>prices = 100</code>","<code>prices(меч,100)</code>"],c:1,
   e:"Ключ в квадратных скобках: prices[\"меч\"] = 100."},
  {q:"Как проверить, есть ли ключ «щит» в словаре?",
   a:["<code>prices.Contains(\"щит\")</code>","<code>prices.ContainsKey(\"щит\")</code>","<code>\"щит\" in prices</code>","<code>prices.Has</code>"],c:1,
   e:"Для ключа словаря — ContainsKey."},
  {q:"Зачем нужен <code>TryGetValue</code>?",
   a:["Для скорости","Безопасно взять значение по ключу (и проверить сразу)","Для сортировки","Ни за чем"],c:1,
   e:"TryGetValue и проверяет ключ, и достаёт значение — без исключения."},
  {q:"Как перебрать все пары словаря?",
   a:["<code>foreach (var pair in d)</code> → pair.Key/pair.Value","<code>for i in d</code>","нельзя","<code>d.All()</code>"],c:1,
   e:"foreach по словарю даёт пары: pair.Key и pair.Value."},
  {q:"Могут ли в словаре быть два одинаковых ключа?",
   a:["Да","Нет — ключи уникальны, повтор перезапишет значение","Только числа","Только строки"],c:1,
   e:"Ключ уникален. Запись по существующему ключу заменяет значение."},
  {q:"Когда лучше <code>Dictionary</code>, а не <code>List</code>?",
   a:["Никогда","Когда ищем по имени/ключу (товар→цена)","Когда данных мало","Для чисел"],c:1,
   e:"Dictionary удобен для поиска по ключу; List — для порядка по номеру."},
  {q:"Как посчитать, сколько раз встречается предмет (счётчик)?",
   a:["Через цикл + <code>if ContainsKey → ++ иначе = 1</code>","Через Sort","Через Reverse","Никак"],c:1,
   e:"Классика словаря-счётчика: есть ключ → +1, иначе поставить 1."},

  {q:"😄 Написал <code>list.Length</code> у списка — красная ошибка. Что не так?",
   a:["List сломан","У списка размер — <code>Count</code>, а не Length","Нужен цвет","Забыл точку"],c:1,
   e:"Length — у массива; у List и словаря — Count."},
  {q:"😄 Взял <code>prices[\"лук\"]</code>, а лука в словаре нет. Что будет?",
   a:["Вернёт 0","Ошибка <code>KeyNotFoundException</code>","Добавит лук","Ничего"],c:1,
   e:"Нет ключа → исключение. Проверяй ContainsKey или бери TryGetValue."},
  {q:"😄 В списке из 3 элементов позвал <code>RemoveAt(5)</code>. Итог?",
   a:["Удалит последний","Ошибка: индекс за границей","Очистит список","Добавит пустой"],c:1,
   e:"Индекс должен быть в 0..Count-1, иначе ArgumentOutOfRangeException."},

  {q:"🤔 Очередь в столовой: список или словарь?",
   a:["Словарь","Список — важен порядок, доступ по номеру","Массив фикс.","Ни то ни другое"],c:1,
   e:"Порядок важен, ключей-имён нет → List."},
  {q:"🤔 Телефонная книга (имя → номер): список или словарь?",
   a:["Список","Словарь — ищем значение по ключу-имени","Массив","Оба плохи"],c:1,
   e:"Поиск по ключу (имени) → Dictionary."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🎒 List и Dictionary</h1>
    <div class="sub">Викторина по уроку 8 · C#</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! List и Dictionary — коллекции освоены! 🎒';}
  else if(pct>=70){em='🎉';msg='Отлично! Списки и словари в кармане.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: Count (не Length), ContainsKey перед доступом.';}
  else {em='💪';msg='Ещё разок! Загляни в самоучитель — там List и Dictionary по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
