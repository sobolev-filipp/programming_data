<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="410" fill="#f7f9fc"/>
  <text x="410" y="36" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">🔂 Вложенные циклы — цикл внутри цикла</text>
  <text x="410" y="60" font-size="14" fill="#64748b" text-anchor="middle">для каждого шага ВНЕШНЕГО цикла внутренний прокручивается ПОЛНОСТЬЮ</text>

  <!-- code -->
  <g font-family="monospace" font-size="15">
    <rect x="40" y="92" width="330" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="58" y="120" fill="#1d4ed8" font-weight="700">for (int i = 1; i &lt;= 3; i++)  // строки</text>
    <rect x="70" y="134" width="285" height="70" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <text x="86" y="160" fill="#c2410c" font-weight="700">for (int j = 1; j &lt;= 3; j++)</text>
    <text x="86" y="182" fill="#9a3412">Console.Write((i,j));  // столбцы</text>
    <text x="58" y="228" fill="#1d4ed8">Console.WriteLine();   // конец строки</text>
  </g>
  <text x="205" y="262" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700">внешний = строки (i)</text>
  <text x="212" y="280" font-size="12.5" fill="#ea580c" text-anchor="middle" font-weight="700">внутренний = столбцы (j)</text>

  <!-- grid result -->
  <text x="600" y="86" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">что получится:</text>
  <g font-family="monospace" font-size="13">
    <!-- rows -->
    <g transform="translate(470,100)">
      <!-- row i=1 -->
      <rect x="0" y="0" width="80" height="34" rx="6" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><text x="40" y="22" text-anchor="middle" fill="#334155">(1,1)</text>
      <rect x="84" y="0" width="80" height="34" rx="6" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><text x="124" y="22" text-anchor="middle" fill="#334155">(1,2)</text>
      <rect x="168" y="0" width="80" height="34" rx="6" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><text x="208" y="22" text-anchor="middle" fill="#334155">(1,3)</text>
      <text x="270" y="22" fill="#2563eb" font-weight="700">← i=1</text>
      <!-- row i=2 -->
      <rect x="0" y="42" width="80" height="34" rx="6" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><text x="40" y="64" text-anchor="middle" fill="#334155">(2,1)</text>
      <rect x="84" y="42" width="80" height="34" rx="6" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><text x="124" y="64" text-anchor="middle" fill="#334155">(2,2)</text>
      <rect x="168" y="42" width="80" height="34" rx="6" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><text x="208" y="64" text-anchor="middle" fill="#334155">(2,3)</text>
      <text x="270" y="64" fill="#2563eb" font-weight="700">← i=2</text>
      <!-- row i=3 -->
      <rect x="0" y="84" width="80" height="34" rx="6" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><text x="40" y="106" text-anchor="middle" fill="#334155">(3,1)</text>
      <rect x="84" y="84" width="80" height="34" rx="6" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><text x="124" y="106" text-anchor="middle" fill="#334155">(3,2)</text>
      <rect x="168" y="84" width="80" height="34" rx="6" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><text x="208" y="106" text-anchor="middle" fill="#334155">(3,3)</text>
      <text x="270" y="106" fill="#2563eb" font-weight="700">← i=3</text>
    </g>
    <!-- arrow inner direction -->
    <path d="M 470 240 L 710 240" stroke="#ea580c" stroke-width="2.5" fill="none"/><polygon points="710,240 700,235 700,245" fill="#ea580c"/>
    <text x="590" y="258" font-size="12.5" fill="#ea580c" text-anchor="middle" font-weight="700">j: слева направо (весь ряд)</text>
  </g>

  <rect x="150" y="320" width="520" height="72" rx="12" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="410" y="347" font-size="14" font-weight="700" fill="#047857" text-anchor="middle">💡 Внешний цикл — строки, внутренний — что внутри строки.</text>
  <text x="410" y="372" font-size="13" fill="#065f46" text-anchor="middle">После внутреннего цикла ставим Console.WriteLine() — перевод на новую строку.</text>
</svg>
