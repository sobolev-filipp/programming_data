<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 10: ООП, классы и объекты (C#)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что такое класс?",
   a:["Конкретный герой","Чертёж (свой тип данных)","Метод","Файл"],c:1,
   e:"Класс — описание/чертёж; сам он ничего не делает."},
  {q:"Что такое объект?",
   a:["Чертёж","То, что сделано по классу через <code>new</code>","Цикл","Ошибка"],c:1,
   e:"Объект — конкретный экземпляр класса (напр. hero1 = Артур)."},
  {q:"Как создать объект?",
   a:["<code>Hero h;</code>","<code>Hero h = new Hero();</code>","<code>make Hero</code>","<code>Hero()</code>"],c:1,
   e:"Объект создаётся ключевым словом new."},
  {q:"Что такое поле класса?",
   a:["Поведение","Данные объекта (имя, hp)","Файл","Цикл"],c:1,
   e:"Поле хранит данные объекта — то, что он «знает»."},
  {q:"Что такое метод класса?",
   a:["Данные","Поведение — что объект умеет","Тип","Поле"],c:1,
   e:"Метод — действие объекта (например, Attack())."},
  {q:"Зачем нужен конструктор?",
   a:["Удалять объект","Создавать объект сразу с данными","Печатать","Считать"],c:1,
   e:"Конструктор задаёт поля при рождении: new Hero(\"Артур\", 100)."},
  {q:"Как выглядит имя конструктора?",
   a:["всегда Main","как имя класса, без типа возврата","любое","только Init"],c:1,
   e:"Конструктор называется как класс и не имеет типа возврата."},
  {q:"Что такое <code>this</code>?",
   a:["класс","текущий объект («я сам»)","метод","поле"],c:1,
   e:"this — ссылка на текущий объект; помогает при совпадении имён."},
  {q:"Чем свойство лучше обычного поля?",
   a:["Ничем","Может ПРОВЕРЯТЬ значение в set","Быстрее","Короче"],c:1,
   e:"Свойство с get/set контролирует данные (напр. Hp не станет < 0)."},
  {q:"Что означает <code>value</code> внутри set?",
   a:["Имя объекта","Присваиваемое значение","Ноль","Тип"],c:1,
   e:"value — то, что присваивают свойству: Hp = 5 → value == 5."},
  {q:"<code>public bool IsAlive => Hp > 0;</code> — это...",
   a:["поле","вычисляемое свойство (только get)","метод void","конструктор"],c:1,
   e:"Вычисляемое свойство считается на лету, не хранится."},
  {q:"Что значит <code>static</code>?",
   a:["у каждого объекта своё","общее для всего класса","только для чисел","приватное"],c:1,
   e:"static принадлежит классу; static-счётчик один на все объекты."},
  {q:"Как обратиться к <code>static</code>-полю <code>Count</code>?",
   a:["<code>hero.Count</code>","<code>Hero.Count</code> (через класс)","<code>Count()</code>","никак"],c:1,
   e:"static читают через класс: Hero.Count."},
  {q:"Что такое перегрузка метода?",
   a:["метод с ошибкой","несколько методов с одним именем и разными параметрами","медленный метод","static-метод"],c:1,
   e:"Перегрузка — одно имя, разные параметры; C# выбирает по типу аргумента."},
  {q:"Где в top-level программе пишут класс?",
   a:["в самом верху","ВНИЗУ, после основного кода","в отдельном языке","всё равно"],c:1,
   e:"Объявления классов идут после top-level операторов — внизу файла."},
  {q:"<code>Math.Max</code>, <code>Console.WriteLine</code> — это какие методы?",
   a:["обычные","<code>static</code> (вызов через тип, без new)","поля","конструкторы"],c:1,
   e:"Они static — поэтому зовутся через тип, без создания объекта."},

  {q:"😄 Написал <code>Hero h;</code> и сразу <code>h.Name = \"Артур\"</code>. Что будет?",
   a:["Всё ок","NullReferenceException — забыл <code>new</code>","Создастся сам","0"],c:1,
   e:"Без new объекта нет — обращение к его полю падает."},
  {q:"😄 Сделал <code>hero.Hp = -500</code>, а <code>Hp</code> — свойство с проверкой. Итог?",
   a:["-500","0 (сеттер не пустил в минус)","ошибка","500"],c:1,
   e:"set проверил value и заменил отрицательное на 0."},
  {q:"😄 Два метода <code>int Show()</code> и <code>string Show()</code> — только тип возврата разный. Ошибка?",
   a:["Нет, всё ок","Да — перегрузка по параметрам, а не по возврату","Нужен static","Мало скобок"],c:1,
   e:"Перегрузку различают по параметрам; одного разного возврата мало."},

  {q:"🤔 Зачем вообще классы, если были переменные и методы?",
   a:["Низачем","Собрать данные и поведение в один аккуратный тип-«коробку»","Для скорости","Так короче"],c:1,
   e:"Класс объединяет данные и действия объекта — меньше путаницы, больше порядка."},
  {q:"🤔 В проекте Hero и Enemy почти одинаковые. Что напрашивается?",
   a:["Скопировать ещё раз","Общий «родитель» — наследование (Урок 11)","Удалить один","static"],c:1,
   e:"Повторение классов убирают наследованием — это следующая тема."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🏗 ООП: классы и объекты</h1>
    <div class="sub">Викторина по уроку 10 · C#</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Классы, объекты, свойства — ООП освоено! 🏗';}
  else if(pct>=70){em='🎉';msg='Отлично! Свои типы создаёшь уверенно.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: класс vs объект, new, свойства, static.';}
  else {em='💪';msg='Ещё разок! Загляни в самоучитель — там классы по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
