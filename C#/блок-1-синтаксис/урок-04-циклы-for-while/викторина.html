<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 4: Циклы for и while (C#)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Из скольких частей состоит заголовок <code>for</code>?", a:["из трёх: начало; условие; шаг","всего из одной части","из двух частей","сколько угодно"], c:0, e:"for (начало; условие; шаг) — три части в скобках."},
  {q:"Чем разделены три части в <code>for</code>?", a:["точкой с запятой <code>;</code>","запятой <code>,</code>","двоеточием <code>:</code>","их разделяют пробелом"], c:0, e:"Части for разделяются ; : for (int i=0; i<5; i++)."},
  {q:"Что означает <code>i++</code>?", a:["<code>i = i + 1</code>","умножить i на 2","удвоить i","обнулить i"], c:0, e:"i++ — короткая запись i = i + 1."},
  {q:"Как задать шаг 2 в цикле <code>for</code>?", a:["<code>i += 2</code>","<code>i++</code>","<code>i * 2</code>","<code>i == 2</code>"], c:0, e:"i += 2 увеличивает счётчик на 2 каждый повтор."},
  {q:"Зачем нужен <code>while (true)</code> с <code>break</code>?", a:["повторять до события, потом выйти","зациклить программу навсегда","это будет всегда ошибка","сделано ради красоты"], c:0, e:"Когда число повторов неизвестно: крутимся и выходим по break."},
  {q:"Что делает <code>continue</code>?", a:["пропускает текущий шаг","полностью выходит из цикла","останавливает программу","повторяет шаг дважды"], c:0, e:"continue пропускает остаток шага и идёт к следующему."},
  {q:"Что делает <code>break</code> в цикле?", a:["выходит из цикла совсем","пропускает один шаг","начинает цикл заново","вообще совсем ничего"], c:0, e:"break прекращает цикл полностью."},
  {q:"Что даёт <code>rnd.Next(1, 7)</code>?", a:["1..6 (7 не входит)","1..7 включительно","0..7","всегда 7"], c:0, e:"Верхняя граница НЕ входит: Next(1,7) → 1,2,3,4,5,6."},
  {q:"Что вернёт <code>rnd.NextDouble()</code>?", a:["дробное 0.0..~1.0","целое число","всегда 0","вернёт обычную строку"], c:0, e:"NextDouble() — случайное ДРОБНОЕ от 0.0 до 1.0 (для «шанса»)."},
  {q:"Что даёт <code>rnd.Next(6)</code> (одно число)?", a:["0..5 (6 не входит)","1..6 включительно","всегда 6","0..6"], c:0, e:"Next(6) → 0..5 (верхняя граница исключается)."},
  {q:"Программа «висит» в цикле. Как остановить в консоли?", a:["нажать <code>Ctrl+C</code>","просто подождать","перезагрузить ПК","никак нельзя"], c:0, e:"Ctrl+C прерывает выполнение — как в Python."},
  {q:"Что выведет <code>for (int i = 5; i >= 1; i--)</code>?", a:["5 4 3 2 1","1 2 3 4 5","5 5 5 5 5","ничего"], c:0, e:"Старт с 5, шаг i-- (уменьшаем) → 5 4 3 2 1."},
  {q:"Где правильно создавать <code>Random</code>?", a:["один раз ДО цикла","внутри цикла каждый раз","где угодно, не важно","только после цикла"], c:0, e:"Создавай Random один раз до цикла — иначе числа могут повторяться."},
  {q:"Что обязательно в <code>while</code>, чтобы он не стал вечным?", a:["менять переменную условия","писать побольше строк","просто добавить комментарий","ничего делать не нужно"], c:0, e:"В while сам меняй переменную условия (n--, i++), иначе цикл бесконечный."},
  {q:"😄 В <code>while (n > 0)</code> забыл <code>n--</code>. Что будет?", a:["да ничего страшного","бесконечный цикл — зависнет","ошибка компиляции","тогда n станет нулём"], c:1, e:"Без изменения n условие всегда истинно → цикл не закончится."},
  {q:"😄 Написал <code>for (int i=1, i<=5, i++)</code> через запятые. Беда?", a:["да, наверное, всё хорошо","части for разделяют <code>;</code>, не <code>,</code>","просто мало скобок","i не бывает"], c:1, e:"Три части for разделяются ; , а не запятой."},
  {q:"😄 <code>rnd.Next(1, 100)</code> ни разу не дал 100. Почему?", a:["просто не повезло","верх не входит — нужно Next","значит, Random сломался","100 запрещено"], c:1, e:"Верхний край исключается: для 1..100 пиши Next(1, 101)."},
  {q:"🤔 Когда удобнее <code>for</code>, а когда <code>while</code>?", a:["нужен всегда только for","for — по счётчику; while — по условию","всегда только while","никакой разницы вообще нет"], c:1, e:"for — когда известно число повторов; while — пока что-то не случится."},
  {q:"🤔 Зачем накопитель (<code>sum = 0</code>) заводят ДО цикла?", a:["сделано ради красоты","чтобы копить, а не обнулять","так работает быстрее","его надо заводить внутри"], c:1, e:"Внутри он обнулялся бы каждый шаг. Заводим ДО, копим внутри."}
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🔁 Циклы: for и while</h1>
    <div class="sub">Викторина по уроку 4 · C#</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! for, while и Random — всё в кармане! 🔁';}
  else if(pct>=70){em='🎉';msg='Отлично! Циклы освоены уверенно.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: три части for, менять переменную в while, границы Random.';}
  else {em='💪';msg='Ещё разок! Загляни в самоучитель — там циклы по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
