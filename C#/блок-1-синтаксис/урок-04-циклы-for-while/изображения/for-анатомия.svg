<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="400" fill="#f7f9fc"/>
  <text x="410" y="36" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">🔁 Цикл for — три части в скобках</text>

  <!-- code line with colored parts -->
  <g font-family="monospace" font-size="19">
    <text x="120" y="88" fill="#334155" font-weight="700">for (</text>
    <rect x="170" y="70" width="118" height="30" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="229" y="91" fill="#166534" font-weight="700" text-anchor="middle">int i = 1</text>
    <text x="292" y="88" fill="#334155" font-weight="700">;</text>
    <rect x="306" y="70" width="80" height="30" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="346" y="91" fill="#1d4ed8" font-weight="700" text-anchor="middle">i &lt;= 5</text>
    <text x="390" y="88" fill="#334155" font-weight="700">;</text>
    <rect x="404" y="70" width="60" height="30" rx="7" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="434" y="91" fill="#c2410c" font-weight="700" text-anchor="middle">i++</text>
    <text x="470" y="88" fill="#334155" font-weight="700">)</text>
  </g>
  <text x="229" y="120" font-size="12.5" fill="#16a34a" text-anchor="middle" font-weight="700">1. НАЧАЛО (один раз)</text>
  <text x="346" y="120" font-size="12.5" fill="#2563eb" text-anchor="middle" font-weight="700">2. УСЛОВИЕ</text>
  <text x="434" y="120" font-size="12.5" fill="#ea580c" text-anchor="middle" font-weight="700">3. ШАГ</text>

  <!-- flow -->
  <!-- start -->
  <g transform="translate(60,170)">
    <rect x="0" y="0" width="150" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <text x="75" y="28" font-size="14" fill="#166534" text-anchor="middle" font-family="monospace">int i = 1</text>
  </g>
  <path d="M 210 193 L 250 193" stroke="#334155" stroke-width="3" fill="none"/><polygon points="250,193 238,187 238,199" fill="#334155"/>

  <!-- condition diamond -->
  <g transform="translate(255,163)">
    <polygon points="90,0 180,53 90,106 0,53" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="90" y="49" font-size="14" fill="#1d4ed8" text-anchor="middle" font-family="monospace">i &lt;= 5 ?</text>
    <text x="90" y="68" font-size="12" fill="#64748b" text-anchor="middle">условие</text>
  </g>

  <!-- true -> body -->
  <path d="M 435 216 L 435 250 L 250 250 L 250 265" stroke="#16a34a" stroke-width="3" fill="none"/><polygon points="250,265 244,253 256,253" fill="#16a34a"/>
  <text x="450" y="240" font-size="13" fill="#16a34a" font-weight="700">истина ✓</text>

  <!-- body -->
  <g transform="translate(160,268)">
    <rect x="0" y="0" width="180" height="46" rx="10" fill="#ffffff" stroke="#334155" stroke-width="2.5"/>
    <text x="90" y="21" font-size="13" fill="#334155" text-anchor="middle">тело цикла { … }</text>
    <text x="90" y="38" font-size="11.5" fill="#64748b" text-anchor="middle">что повторяем</text>
  </g>

  <!-- body -> step -->
  <path d="M 340 291 L 430 291" stroke="#334155" stroke-width="3" fill="none"/><polygon points="430,291 418,285 418,297" fill="#334155"/>
  <!-- step -->
  <g transform="translate(435,268)">
    <rect x="0" y="0" width="120" height="46" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/>
    <text x="60" y="28" font-size="14" fill="#c2410c" text-anchor="middle" font-family="monospace">i++</text>
  </g>
  <!-- step -> back to condition -->
  <path d="M 555 291 L 600 291 L 600 216 L 445 216" stroke="#ea580c" stroke-width="3" fill="none" stroke-dasharray="6 5"/><polygon points="445,216 457,210 457,222" fill="#ea580c"/>
  <text x="612" y="255" font-size="12.5" fill="#ea580c" font-weight="700">снова проверка</text>

  <!-- false -> exit -->
  <path d="M 345 216 L 700 216 L 700 176" stroke="#dc2626" stroke-width="3" fill="none"/><polygon points="700,176 694,188 706,188" fill="#dc2626"/>
  <text x="620" y="208" font-size="13" fill="#dc2626" font-weight="700">ложь ✗ → выход</text>

  <text x="410" y="382" font-size="13" fill="#475569" text-anchor="middle" font-style="italic">Порядок: начало → проверка условия → тело → шаг → снова проверка … пока условие истинно.</text>
</svg>
