<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Что напечатает цикл — тренажёр (Урок 4 C#)</title>
<style>
  :root{ --bg1:#512bd4; --bg2:#9b6dff; --card:#fff; --ink:#1f2937; --accent:#512bd4;
    --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe; }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:30px 30px 26px;overflow:hidden}
  h1{margin:0 0 4px;font-size:24px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:16px;font-size:14px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:14px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:16px}
  .streak{color:#b45309;font-weight:700}
  .card-val{background:#0f172a;border-radius:16px;padding:20px 18px;margin-bottom:8px}
  .card-val .lead{color:#94a3b8;font-size:13px;margin-bottom:10px;text-align:center}
  .card-val pre{color:#e2e8f0;font-size:15px;font-family:Consolas,"Courier New",monospace;margin:0;white-space:pre-wrap;line-height:1.5}
  .bins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  @media(max-width:520px){.bins{grid-template-columns:1fr}}
  .bin{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:14px 10px;cursor:pointer;
    transition:.15s;text-align:center;font-size:17px;font-family:Consolas,monospace;font-weight:700}
  .bin:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .bin.ok{border-color:var(--ok);background:#dcfce7}
  .bin.bad{border-color:var(--bad);background:#fee2e2}
  .bin:disabled{cursor:default;transform:none}
  .fb{margin-top:14px;padding:13px 15px;border-radius:12px;font-size:15px;display:none;line-height:1.4}
  .fb.show{display:block}.fb.good{background:#dcfce7;color:#166534}.fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:16px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:17px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}.btn:hover{filter:brightness(1.08)}
  .center{text-align:center}.score{font-size:60px;font-weight:800;margin:6px 0}.emoji{font-size:64px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// Тренажёр по уроку 4: предскажи, что напечатает цикл.
const ROUNDS = [
  {code:'for (int i = 1; i <= 3; i++)\n    Console.Write(i);', a:["123","1234","0123","321"], c:0, e:"i от 1 до 3 → 1,2,3."},
  {code:'for (int i = 0; i < 3; i++)\n    Console.Write(i);', a:["123","012","0123","0 1 2"], c:1, e:"Старт 0, условие i<3 → 0,1,2."},
  {code:'for (int i = 2; i <= 6; i += 2)\n    Console.Write(i);', a:["2468","23456","246","024"], c:2, e:"Шаг +2: 2,4,6 (на 8 условие i<=6 ложно)."},
  {code:'for (int i = 5; i >= 1; i--)\n    Console.Write(i);', a:["12345","54321","5432","43210"], c:1, e:"Старт 5, шаг i-- → 5,4,3,2,1."},
  {code:'for (int i = 1; i <= 5; i++) {\n    if (i == 3) continue;\n    Console.Write(i);\n}', a:["12345","1245","123","345"], c:1, e:"continue пропускает только i==3 → 1245."},
  {code:'for (int i = 1; i <= 9; i++) {\n    if (i == 4) break;\n    Console.Write(i);\n}', a:["123","1234","123456789","1239"], c:0, e:"break на i==4 выходит из цикла → 123."},
  {code:'int i = 1;\nwhile (i <= 3) {\n    Console.Write(i);\n    i++;\n}', a:["111","123","0123","12"], c:1, e:"while печатает 1,2,3 (i растёт до 4 и стоп)."},
  {code:'int s = 0;\nfor (int i = 1; i <= 4; i++)\n    s += i;\nConsole.Write(s);', a:["4","1234","10","24"], c:2, e:"Накопитель: 1+2+3+4 = 10."},
  {code:'for (int i = 0; i < 6; i += 2)\n    Console.Write(i + " ");', a:["0 2 4 ","0 2 4 6 ","1 3 5 ","0 1 2 "], c:0, e:"0,2,4 (на 6 условие i<6 ложно)."},
  {code:'for (int i = 3; i >= 1; i--)\n    Console.Write("*");', a:["*","**","***","****"], c:2, e:"Цикл идёт 3 раза (3,2,1) → три звезды."},
];
let order=[], i=0, score=0, streak=0, best=0, locked=false;
const app=document.getElementById('app');
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function start(){
  order=[...Array(ROUNDS.length).keys()];
  for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];}
  i=0;score=0;streak=0;best=0;render();
}
function render(){
  const Q=ROUNDS[order[i]];
  app.innerHTML=`
    <h1>🔁 Что напечатает цикл?</h1>
    <div class="sub">Урок 4 · пройди цикл в голове и выбери вывод</div>
    <div class="bar"><i style="width:${(i/ROUNDS.length)*100}%"></i></div>
    <div class="meta"><span>Цикл ${i+1} из ${ROUNDS.length}</span><span>⭐ ${score} · <span class="streak">🔥 ${streak}</span></span></div>
    <div class="card-val"><div class="lead">что выведет этот код?</div><pre>${esc(Q.code)}</pre></div>
    <div class="bins" id="bins">
      ${Q.a.map((t,n)=>`<button class="bin" data-n="${n}">${esc(t)}</button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===ROUNDS.length-1?'Итог →':'Дальше →'}</button>`;
  locked=false;
  document.querySelectorAll('.bin').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}
function choose(n){
  if(locked)return;locked=true;
  const Q=ROUNDS[order[i]];
  const bins=[...document.querySelectorAll('.bin')];
  bins.forEach(b=>{b.disabled=true; if(+b.dataset.n===Q.c)b.classList.add('ok');});
  const fb=document.getElementById('fb');
  if(n===Q.c){score++;streak++;best=Math.max(best,streak);fb.className='fb show good';
    fb.innerHTML='✅ Верно! '+Q.e+(streak>=3?` 🔥 Серия ${streak}!`:'');}
  else{streak=0;bins[n].classList.add('bad');fb.className='fb show no';fb.innerHTML='❌ Мимо. '+Q.e;}
  document.getElementById('next').classList.add('show');
}
function next(){i++; if(i<ROUNDS.length)render(); else result();}
function result(){
  const pct=Math.round(score/ROUNDS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Трассируешь циклы как настоящий программист.';}
  else if(pct>=70){em='🎉';msg='Отлично! break/continue и шаг почти не путаешь.';}
  else if(pct>=40){em='👍';msg='Неплохо! Проходи цикл по шагам: старт, условие, шаг.';}
  else {em='💪';msg='Ещё заход! Загляни в итого.md про for и while.';}
  app.innerHTML=`<div class="center"><div class="emoji">${em}</div><h1>Готово!</h1>
      <div class="score">${score} / ${ROUNDS.length}</div>
      <div class="sub">${msg}<br>Лучшая серия: 🔥 ${best}</div>
      <button class="btn show" id="again">🔁 Играть снова</button></div>`;
  document.getElementById('again').onclick=start;
}
document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){const b=document.querySelector(`.bin[data-n="${+e.key-1}"]`); if(b&&!b.disabled)choose(+e.key-1);}
  if(e.key==='Enter'){const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show'))next();}
});
start();
</script>
</body>
</html>
