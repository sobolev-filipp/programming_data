<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 5 MAUI (Контролы выбора)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Зачем нужны контролы выбора вместо <code>Entry</code>?",
   a:["чтобы печатать быстрее","чтобы выбирать без печати (и сложнее ошибиться)","для красоты","они не нужны"],c:1,
   e:"Тумблеры/ползунки/списки — выбор мышью/пальцем, без ввода «абв»."},
  {q:"Как прочитать значение <code>Switch</code>?",
   a:["<code>IsToggled</code> (bool)","<code>Value</code>","<code>Text</code>","<code>State</code>"],c:0,
   e:"Switch → IsToggled (true/false)."},
  {q:"Как прочитать значение <code>CheckBox</code>?",
   a:["<code>IsToggled</code>","<code>IsChecked</code> (bool)","<code>Checked</code>","<code>Value</code>"],c:1,
   e:"CheckBox → IsChecked. У Switch — IsToggled (не путать!)."},
  {q:"Какого типа <code>Slider.Value</code>?",
   a:["int","<code>double</code> (дробное)","string","bool"],c:1,
   e:"Value — дробное. Для целого приводим (int)."},
  {q:"Ползунок дал 7.0, а нужно целое число. Что сделать?",
   a:["ничего","привести <code>(int)Value</code>","умножить","никак"],c:1,
   e:"(int)Value отбросит дробную часть."},
  {q:"Что делает <code>Stepper</code>?",
   a:["печатает текст","задаёт число кнопками − и +","выбирает дату","красит фон"],c:1,
   e:"Stepper — точное целое кнопками ±. Родственник Slider."},
  {q:"Какое событие у <code>Slider</code> и <code>Stepper</code>?",
   a:["<code>Clicked</code>","<code>ValueChanged</code>","<code>Moved</code>","<code>TextChanged</code>"],c:1,
   e:"ValueChanged — значение изменилось."},
  {q:"Что лежит в <code>e.NewValue</code> в обработчике <code>ValueChanged</code>?",
   a:["старое значение","новое значение контрола","имя","цвет"],c:1,
   e:"e.NewValue — новое значение (тоже double)."},
  {q:"Как узнать, что выбрано в <code>Picker</code>?",
   a:["<code>Picker.Text</code>","<code>SelectedIndex</code> / <code>SelectedItem</code>","<code>Picker.Value</code>","никак"],c:1,
   e:"SelectedIndex — номер, SelectedItem — сам текст."},
  {q:"Чему равен <code>SelectedIndex</code>, пока в <code>Picker</code> ничего не выбрали?",
   a:["0","<code>-1</code>","null","1"],c:1,
   e:"−1 значит «выбор не сделан». Всегда проверяй это!"},
  {q:"Что сделать <b>перед</b> чтением выбора из <code>Picker</code>?",
   a:["покрасить","проверить <code>SelectedIndex == -1</code>","ничего","очистить"],c:1,
   e:"Иначе на невыбранном списке приложение упадёт."},
  {q:"Чем удобно использовать <code>SelectedIndex</code> (0,1,2…)?",
   a:["как цвет","как индекс массива (цены/ответы)","как имя","никак"],c:1,
   e:"prices[SelectedIndex] сразу даёт нужный элемент — приём из блока 1."},
  {q:"Что читаем у <code>DatePicker</code> (в .NET 10)?",
   a:["<code>Date</code> — тип <code>DateTime?</code>","<code>Text</code>","<code>Value</code>","<code>Day</code>"],c:0,
   e:"Date — это DateTime? (может быть «не выбрана»)."},
  {q:"Какое событие у <code>Switch</code>?",
   a:["<code>Clicked</code>","<code>Toggled</code>","<code>ValueChanged</code>","<code>Checked</code>"],c:1,
   e:"Switch → Toggled (в e.Value — новое состояние)."},
  {q:"У <code>Switch</code>/<code>Slider</code> нет своей надписи. Что делать?",
   a:["ничего","поставить рядом <code>Label</code>","удалить","покрасить"],c:1,
   e:"Подпись ставим отдельной меткой (в HorizontalStackLayout)."},

  {q:"😄 Жмёшь «Оформить», не выбрав размер — приложение падает. Почему?",
   a:["мало памяти","<code>SelectedIndex</code> равен −1, а его не проверили","вирус","нет интернета"],c:1,
   e:"prices[-1] вылетает. Сначала проверь SelectedIndex == -1."},
  {q:"😄 Ползунок показал 6.7, а в число попало 6. Из-за чего?",
   a:["ошибка","<code>(int)</code> отбрасывает дробную часть","округление вверх","баг MAUI"],c:1,
   e:"(int)6.7 = 6 — дробь отброшена (не округление)."},
  {q:"😄 Тебе нужно округлить 6.7 до 7, а <code>(int)</code> даёт 6. Что взять?",
   a:["<code>(int)</code> ещё раз","<code>Math.Round</code> (из блока 1)","ничего","<code>string</code>"],c:1,
   e:"(int) только отбрасывает; для округления — Math.Round."},

  {q:"🤔 Чем похожи <code>Slider</code> и <code>Stepper</code>?",
   a:["ничем","у обоих <code>Value</code> (double) и событие <code>ValueChanged</code>","оба списки","оба даты"],c:1,
   e:"Родственники: разница только в виде (плавно / кнопками)."},
  {q:"🤔 <code>DatePicker.Date</code> бывает «не выбрана». Как безопасно взять дату?",
   a:["<code>Date.Now</code>","<code>Date ?? DateTime.Today</code>","<code>(DateTime)Date</code>","никак"],c:1,
   e:"?? даёт запасное значение — как ?? \"\" для пустого поля в уроке 4."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🍕 Урок 5 — Контролы выбора</h1>
    <div class="sub">Проверь себя по Switch, Slider, Picker и другим</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Любой контрол выбора тебе по плечу.';}
  else if(pct>=70){em='🎉';msg='Отлично! Значения и события ты понял(а).';}
  else if(pct>=40){em='👍';msg='Неплохо! Загляни в итого.md и попробуй снова.';}
  else {em='💪';msg='Ещё разок! Перечитай про SelectedIndex и (int)Value.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Урок 5 пройден!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
