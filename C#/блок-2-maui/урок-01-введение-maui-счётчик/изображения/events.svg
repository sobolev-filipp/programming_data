<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330"><rect width="800" height="330" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#26334a"><text x="400" y="35" font-size="25">Четыре кнопки — один обработчик</text><rect x="15" y="60" width="185" height="55" rx="10" fill="LightGreen"/><text x="107" y="94" font-size="18">Радостное</text><path d="M107 115 V145 H400 V175" fill="none" stroke="#64748b" stroke-width="2"/><rect x="210" y="60" width="185" height="55" rx="10" fill="LightBlue"/><text x="302" y="94" font-size="18">Спокойное</text><path d="M302 115 V145 H400 V175" fill="none" stroke="#64748b" stroke-width="2"/><rect x="405" y="60" width="185" height="55" rx="10" fill="LightGray"/><text x="497" y="94" font-size="18">Грустное</text><path d="M497 115 V145 H400 V175" fill="none" stroke="#64748b" stroke-width="2"/><rect x="600" y="60" width="185" height="55" rx="10" fill="LightCoral"/><text x="692" y="94" font-size="18">Гнев</text><path d="M692 115 V145 H400 V175" fill="none" stroke="#64748b" stroke-width="2"/><rect x="130" y="175" width="540" height="60" rx="10" fill="#e0e7ff"/><text x="400" y="211" font-size="21">MoodBtn(object? sender, EventArgs e)</text><text x="400" y="275" font-size="20">sender — нажатая кнопка</text><text x="400" y="303" font-size="17">Берём её цвет и выбираем изображение</text></g></svg>