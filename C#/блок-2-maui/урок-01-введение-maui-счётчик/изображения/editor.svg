<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"><rect width="100%" height="100%" fill="#f0edff"/><text x="35" y="48" font-family="sans-serif" font-size="30" font-weight="bold" fill="#31205e">Где искать файлы и запуск</text><rect x="35" y="75" width="930" height="72" rx="12" fill="white" stroke="#b7a8e8"/><text x="55" y="104" font-family="sans-serif" font-size="22" font-weight="bold" fill="#31205e">Solution Explorer / Explorer</text><text x="55" y="130" font-family="sans-serif" font-size="19" fill="#344054">MainPage.xaml → MainPage.xaml.cs; Resources → Images</text><rect x="35" y="165" width="930" height="72" rx="12" fill="white" stroke="#b7a8e8"/><text x="55" y="194" font-family="sans-serif" font-size="22" font-weight="bold" fill="#31205e">Редактор</text><text x="55" y="220" font-family="sans-serif" font-size="19" fill="#344054">Открываем файл, пишем XAML или C#, сохраняем</text><rect x="35" y="255" width="930" height="72" rx="12" fill="white" stroke="#b7a8e8"/><text x="55" y="284" font-family="sans-serif" font-size="22" font-weight="bold" fill="#31205e">Панель запуска</text><text x="55" y="310" font-family="sans-serif" font-size="19" fill="#344054">Windows Machine / Mac Catalyst → Run</text><rect x="35" y="345" width="930" height="72" rx="12" fill="white" stroke="#b7a8e8"/><text x="55" y="374" font-family="sans-serif" font-size="22" font-weight="bold" fill="#31205e">Output / Terminal</text><text x="55" y="400" font-family="sans-serif" font-size="19" fill="#344054">Смотрим первую ошибку сборки, а не весь список сразу</text></svg>
