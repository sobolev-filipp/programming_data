<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="900" height="470" fill="#f7f9fc"/>
  <text x="450" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Как работает «Счётчик»</text>
  <text x="450" y="66" text-anchor="middle" font-size="15" fill="#64748b">Нажал кнопку → код сработал → экран обновился</text>

  <!-- phone mockup -->
  <rect x="60" y="95" width="230" height="330" rx="28" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <rect x="120" y="108" width="110" height="10" rx="5" fill="#e2e8f0"/>
  <text x="175" y="165" text-anchor="middle" font-size="18" font-weight="600" fill="#1f2937">Мой счётчик</text>
  <text x="175" y="235" text-anchor="middle" font-size="70" font-weight="800" fill="#512bd4">3</text>
  <rect x="95" y="270" width="160" height="34" rx="9" fill="#512bd4"/>
  <text x="175" y="293" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">+1</text>
  <rect x="95" y="312" width="160" height="34" rx="9" fill="#512bd4"/>
  <text x="175" y="335" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">-1</text>
  <rect x="95" y="354" width="160" height="34" rx="9" fill="#9b6dff"/>
  <text x="175" y="377" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Сброс</text>

  <!-- flow -->
  <g>
    <rect x="360" y="120" width="470" height="60" rx="12" fill="#ede9fe" stroke="#512bd4" stroke-width="2"/>
    <text x="380" y="147" font-size="17" font-weight="700" fill="#512bd4">1. Человек нажал кнопку «+1»</text>
    <text x="380" y="169" font-size="14" fill="#4c1d95">событие Clicked срабатывает</text>

    <rect x="360" y="205" width="470" height="80" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="232" font-size="17" font-weight="700" fill="#15803d">2. MAUI зовёт метод OnPlusClicked</text>
    <text x="380" y="256" font-size="14.5" font-family="Consolas, monospace" fill="#0f172a">count++;</text>
    <text x="380" y="276" font-size="14.5" font-family="Consolas, monospace" fill="#0f172a">CountLabel.Text = count.ToString();</text>

    <rect x="360" y="310" width="470" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="380" y="337" font-size="17" font-weight="700" fill="#15803d">3. Экран показывает новое число</text>
    <text x="380" y="359" font-size="14" fill="#166534">метка CountLabel обновилась: 3 → 4</text>

    <path d="M 595 180 L 595 203" stroke="#334155" stroke-width="2.5" marker-end="url(#a2)"/>
    <path d="M 595 285 L 595 308" stroke="#334155" stroke-width="2.5" marker-end="url(#a2)"/>
    <path d="M 360 340 C 320 340, 300 250, 258 240" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a3)"/>
  </g>

  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="a3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0ea5e9"/></marker>
  </defs>

  <text x="450" y="445" text-anchor="middle" font-size="13.5" fill="#0ea5e9">🔵 число на экране всегда обновляем сами — строкой CountLabel.Text = ...</text>
</svg>
