<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 1 MAUI (Счётчик)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что такое MAUI?",
   a:["игра","способ делать приложения с окном на C#","браузер","база данных"],c:1,
   e:"MAUI — приложения с окном для Windows, Android, Mac, iOS на C#."},
  {q:"Какой файл отвечает за <b>внешность</b> экрана?",
   a:["<code>MainPage.xaml</code>","<code>MainPage.xaml.cs</code>","<code>MauiProgram.cs</code>","<code>App.xaml</code>"],c:0,
   e:"XAML-файл описывает, как выглядит экран."},
  {q:"Какой файл отвечает за <b>логику</b> (что делает)?",
   a:["<code>MainPage.xaml</code>","<code>MainPage.xaml.cs</code> (code-behind)","<code>Resources</code>","<code>Platforms</code>"],c:1,
   e:"Файл .xaml.cs — «мозг» экрана, на C#."},
  {q:"На каком языке пишут разметку экрана?",
   a:["Python","XAML (теги в угловых скобках)","SQL","HTML"],c:1,
   e:"Разметка MAUI — язык XAML, похож на HTML."},
  {q:"Что такое <code>Label</code>?",
   a:["кнопка","текст на экране","картинка","поле ввода"],c:1,
   e:"Label — текст на экране (аналог Console.WriteLine)."},
  {q:"Что такое <code>Button</code>?",
   a:["текст","кнопка, на которую нажимают","список","окно"],c:1,
   e:"Button — кнопка."},
  {q:"Что делает <code>VerticalStackLayout</code>?",
   a:["ставит элементы друг под другом","красит фон","считает","ставит в ряд"],c:0,
   e:"Это «стопка» — элементы идут вертикально, друг под другом."},
  {q:"Зачем элементу <code>x:Name</code>?",
   a:["для красоты","чтобы менять его из кода C#","для цвета","ни за чем"],c:1,
   e:"Имя нужно, чтобы обратиться к элементу из кода: CountLabel.Text = ..."},
  {q:"Что значит <code>Clicked=\"OnPlusClicked\"</code>?",
   a:["цвет кнопки","какой метод вызвать при нажатии","имя кнопки","размер"],c:1,
   e:"Clicked связывает кнопку с методом-обработчиком в C#."},
  {q:"Как поменять текст метки из кода?",
   a:["<code>CountLabel = 5</code>","<code>CountLabel.Text = count.ToString()</code>","<code>print(count)</code>","<code>Label(count)</code>"],c:1,
   e:"Меняем свойство: Элемент.Свойство = значение."},
  {q:"Как превратить число в строку для <code>Text</code>?",
   a:["<code>count.ToString()</code>","<code>str(count)</code>","<code>(string)</code>","никак"],c:0,
   e:"В C# число → строка через .ToString() (или интерполяцию $\"{count}\")."},
  {q:"Где объявить <code>count</code>, чтобы он <b>помнил</b> значение между нажатиями?",
   a:["внутри метода кнопки","в классе (рядом с конструктором)","в XAML","в файле App.xaml"],c:1,
   e:"Переменная в классе живёт всё время работы; внутри метода — обнуляется каждый раз."},
  {q:"Подпись метода-обработчика кнопки — это...",
   a:["<code>(int x)</code>","<code>(object? sender, EventArgs e)</code>","<code>()</code>","<code>(string s)</code>"],c:1,
   e:"У обработчика Clicked всегда такая «подпись»."},
  {q:"Как быстро запустить приложение на Windows?",
   a:["двойной клик по файлу","платформа <b>Windows Machine</b> → ▶ (F5)","через блокнот","никак"],c:1,
   e:"На Windows проще всего проверять на Windows Machine."},

  {q:"😄 Жмёшь «+1», а число на экране не меняется. Что забыл(а)?",
   a:["купить новый ПК","обновить метку: <code>CountLabel.Text = ...</code>","цвет","закрыть окно"],c:1,
   e:"count меняется, но экран надо обновлять вручную."},
  {q:"😄 Счётчик всё время показывает 0 или 1 и «забывает» значение. Почему?",
   a:["мало памяти","<code>int count</code> объявлен внутри метода, а не в классе","нет интернета","старый ПК"],c:1,
   e:"Переменную-счётчик надо объявлять в классе, чтобы она помнила значение."},
  {q:"😄 При сборке: «обработчик OnPlusClicked не найден». В чём дело?",
   a:["вирус","имя в <code>Clicked</code> не совпадает с именем метода в C#","мало кнопок","нужен новый проект"],c:1,
   e:"Имена в XAML и в C# должны совпадать буква в букву."},

  {q:"🤔 Чем приложение с окном удобнее консоли для обычного человека?",
   a:["ничем","привычно и наглядно: кнопки, поля, а не текстовые команды","быстрее считает","меньше весит"],c:1,
   e:"Обычные люди пользуются кнопками и полями, а не консолью."},
  {q:"🤔 XAML больше всего похож на какой язык из веба?",
   a:["Python","HTML (разметка тегами)","JavaScript","CSS"],c:1,
   e:"XAML — язык разметки с тегами, как HTML."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>📱 Урок 1 — MAUI и «Счётчик»</h1>
    <div class="sub">Проверь себя по первому приложению</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Первое приложение — как на ладони.';}
  else if(pct>=70){em='🎉';msg='Отлично! Связку XAML↔C# ты понял(а).';}
  else if(pct>=40){em='👍';msg='Неплохо! Загляни в итого.md и попробуй снова.';}
  else {em='💪';msg='Ещё разок! Перечитай урок про Label, Button и x:Name.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Урок 1 пройден!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
