<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 1: Введение в MAUI — Моё настроение</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {
    "q": "Где описывается внешний вид страницы?",
    "a": [
      "MainPage.xaml",
      "MainPage.xaml.cs",
      "MauiProgram.cs",
      "AppShell.xaml.cs"
    ],
    "c": 0,
    "e": "Разметка конкретной страницы находится в MainPage.xaml."
  },
  {
    "q": "Где пишем обработчик кнопки?",
    "a": [
      "MainPage.xaml.cs",
      "MainPage.xaml",
      "Resources/Images",
      "Platforms/Windows"
    ],
    "c": 0,
    "e": "Обработчик страницы пишем в её файле C#."
  },
  {
    "q": "Какое свойство Label задаёт надпись?",
    "a": [
      "Text",
      "Title",
      "Source",
      "Content"
    ],
    "c": 0,
    "e": "Label.Text хранит отображаемую строку."
  },
  {
    "q": "Какое свойство меняет цвет текста?",
    "a": [
      "TextColor",
      "BackgroundColor",
      "FontSize",
      "FontAttributes"
    ],
    "c": 0,
    "e": "TextColor отвечает за цвет букв."
  },
  {
    "q": "Как задать жирный текст?",
    "a": [
      "FontAttributes=\"Bold\"",
      "FontAttributes=\"Italic\"",
      "FontSize=\"20\"",
      "TextColor=\"Black\""
    ],
    "c": 0,
    "e": "Bold — жирное начертание."
  },
  {
    "q": "Что связывает имя элемента с кодом C#?",
    "a": [
      "x:Name",
      "Text",
      "Clicked",
      "Source"
    ],
    "c": 0,
    "e": "x:Name позволяет обратиться к элементу по имени."
  },
  {
    "q": "Какое событие вызывается при нажатии Button?",
    "a": [
      "Clicked",
      "TextChanged",
      "Loaded",
      "SizeChanged"
    ],
    "c": 0,
    "e": "Clicked срабатывает при нажатии кнопки."
  },
  {
    "q": "Как изменить надпись MoodLabel?",
    "a": [
      "MoodLabel.Text = \"Привет\";",
      "MoodLabel.Title = \"Привет\";",
      "MoodLabel.Source = \"Привет\";",
      "MoodLabel.Content = \"Привет\";"
    ],
    "c": 0,
    "e": "Для Label используется Text."
  },
  {
    "q": "Куда положить mood_happy.png?",
    "a": [
      "Resources/Images",
      "Resources/Fonts",
      "Platforms/Windows",
      "Resources/Styles"
    ],
    "c": 0,
    "e": "Изображения MAUI размещают в Resources/Images."
  },
  {
    "q": "Какое свойство Image задаёт файл?",
    "a": [
      "Source",
      "Text",
      "Title",
      "Content"
    ],
    "c": 0,
    "e": "Source определяет источник изображения."
  },
  {
    "q": "Как показать картинку целиком с сохранением пропорций?",
    "a": [
      "AspectFit",
      "AspectFill",
      "Fill",
      "Center"
    ],
    "c": 0,
    "e": "AspectFit вписывает изображение без обрезки."
  },
  {
    "q": "Что делает IsVisible = false?",
    "a": [
      "Скрывает элемент",
      "Отключает нажатия",
      "Очищает надпись",
      "Меняет прозрачность"
    ],
    "c": 0,
    "e": "IsVisible управляет видимостью."
  },
  {
    "q": "Как отключить кнопку, оставив её на экране?",
    "a": [
      "IsEnabled = false",
      "IsVisible = false",
      "Opacity = 0",
      "Text = \"\""
    ],
    "c": 0,
    "e": "IsEnabled запрещает взаимодействие."
  },
  {
    "q": "Какой контейнер размещает элементы сверху вниз?",
    "a": [
      "VerticalStackLayout",
      "HorizontalStackLayout",
      "Grid",
      "Border"
    ],
    "c": 0,
    "e": "VerticalStackLayout располагает дочерние элементы вертикально."
  },
  {
    "q": "Что делает InitializeComponent()?",
    "a": [
      "Загружает разметку страницы",
      "Запускает обработчик кнопки",
      "Сохраняет настройки страницы",
      "Закрывает текущее окно"
    ],
    "c": 0,
    "e": "Метод инициализирует элементы из XAML."
  },
  {
    "q": "Какой тип подходит для параметра цвета в SetMood?",
    "a": [
      "Color",
      "string[]",
      "int",
      "bool"
    ],
    "c": 0,
    "e": "Color представляет цвет MAUI."
  },
  {
    "q": "Зачем выносить смену настроения в SetMood?",
    "a": [
      "Чтобы не повторять код",
      "Чтобы скрыть кнопки",
      "Чтобы создать новую страницу",
      "Чтобы сохранить картинку"
    ],
    "c": 0,
    "e": "Общий метод позволяет менять интерфейс из нескольких обработчиков."
  },
  {
    "q": "Что вернёт Random.Shared.Next(3)?",
    "a": [
      "Число от 0 до 2",
      "Число от 1 до 3",
      "Число от 0 до 3",
      "Число от 1 до 2"
    ],
    "c": 0,
    "e": "Верхняя граница Next не включается."
  },
  {
    "q": "Как изменить фон страницы из её кода?",
    "a": [
      "BackgroundColor = Colors.Gold;",
      "TextColor = Colors.Gold;",
      "FontColor = Colors.Gold;",
      "Stroke = Colors.Gold;"
    ],
    "c": 0,
    "e": "BackgroundColor задаёт фон страницы."
  },
  {
    "q": "В XAML указано Clicked=\"OnHappyClicked\". Что нужно в C#?",
    "a": [
      "Метод OnHappyClicked",
      "Переменная OnHappyClicked",
      "Свойство OnHappyClicked",
      "Класс OnHappyClicked"
    ],
    "c": 0,
    "e": "Имя обработчика должно совпадать с указанным в XAML."
  }
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>Введение в MAUI — Моё настроение</h1>
    <div class="sub">Викторина по уроку 1 · C# + MAUI</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='';msg='Все ответы верны.';}
  else if(pct>=70){em='';msg='Хороший результат. Разбери вопросы, в которых ошибся.';}
  else if(pct>=40){em='';msg='Повтори свойства и примеры из урока.';}
  else {em='';msg='Вернись к самоучителю и попробуй снова.';}
  app.innerHTML=`
    <div class="center">
      
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) { e.preventDefault(); next(); } }
});

render();
</script>
</body>
</html>
