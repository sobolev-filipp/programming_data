<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MAUI — викторина</title><style>body{font:18px system-ui;max-width:760px;margin:35px auto;padding:20px;background:#f3f5fa;color:#26334a}fieldset{background:white;border:1px solid #ccd4e2;border-radius:12px;margin:16px 0;padding:18px}label{display:block;margin:8px}button{padding:12px 20px;background:#26334a;color:white;border:0;border-radius:8px;font:inherit}</style><h1>Первые приложения MAUI</h1><form id="quiz"></form><button id="check">Проверить</button><p id="result" role="status"></p><script>const qs=[["Что описывает XAML?", ["Внешний вид", "Только вычисления", "SDK"], 0], ["Как назвать элемент для C#?", ["Text", "x:Name", "Source"], 1], ["Какое событие у кнопки?", ["Clicked", "FontSize", "Padding"], 0], ["Как поменять картинку?", ["Image.Text", "Image.Source", "Image.Spacing"], 1], ["Что возвращает Next(3)?", ["1–3", "0–3", "0–2"], 2], ["Зачем InitializeComponent?", ["Загрузить разметку", "Удалить проект", "Выбрать SDK"], 0]]; const f=document.querySelector('#quiz'); qs.forEach(([q,a],i)=>{const field=document.createElement('fieldset'); const l=document.createElement('legend');l.textContent=(i+1)+'. '+q;field.append(l);a.forEach((v,j)=>{const label=document.createElement('label');const r=document.createElement('input');r.type='radio';r.name='q'+i;r.value=j;label.append(r,' '+v);field.append(label)});f.append(field)});document.querySelector('#check').onclick=()=>{let score=0;qs.forEach((q,i)=>{const r=f.querySelector('input[name=q'+i+']:checked');if(r&&Number(r.value)===q[2])score++});document.querySelector('#result').textContent='Результат: '+score+' из '+qs.length;};</script></html>
