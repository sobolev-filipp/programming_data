<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="900" height="520" fill="#f7f9fc"/>
  <text x="450" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Как работает «Анкета»</text>
  <text x="450" y="66" text-anchor="middle" font-size="15" fill="#64748b">Поля приняли текст → кнопка запускает проверку → собираем ответ.</text>

  <!-- fields -->
  <text x="60" y="110" font-size="15" font-weight="700" fill="#334155">Поля ввода</text>
  <rect x="60" y="122" width="240" height="46" rx="8" fill="#ffffff" stroke="#512bd4" stroke-width="2"/>
  <text x="76" y="150" font-size="15" fill="#0f172a">Имя — Entry</text>
  <rect x="60" y="178" width="240" height="46" rx="8" fill="#ffffff" stroke="#512bd4" stroke-width="2"/>
  <text x="76" y="206" font-size="15" fill="#0f172a">Возраст — Entry (Numeric)</text>
  <rect x="60" y="234" width="240" height="60" rx="8" fill="#ffffff" stroke="#512bd4" stroke-width="2"/>
  <text x="76" y="262" font-size="15" fill="#0f172a">О себе — Editor</text>
  <text x="76" y="282" font-size="12" fill="#94a3b8">(многострочное)</text>

  <!-- button -->
  <rect x="360" y="185" width="150" height="48" rx="10" fill="#512bd4"/>
  <text x="435" y="215" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Готово</text>
  <path d="M 300 208 L 356 208" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- check -->
  <rect x="360" y="270" width="220" height="120" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="470" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Проверка</text>
  <text x="376" y="324" font-size="13.5" font-family="Consolas, monospace" fill="#334155">IsNullOrWhiteSpace</text>
  <text x="376" y="348" font-size="13.5" font-family="Consolas, monospace" fill="#334155">int.TryParse</text>
  <text x="376" y="372" font-size="12" fill="#64748b">пусто? число?</text>
  <path d="M 435 233 L 435 268" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- result -->
  <rect x="630" y="150" width="230" height="120" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2.5"/>
  <text x="745" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Результат (Label)</text>
  <text x="646" y="208" font-size="14" fill="#0f172a">Привет, Алиса!</text>
  <text x="646" y="230" font-size="14" fill="#0f172a">Тебе 14 лет.</text>
  <text x="646" y="252" font-size="14" fill="#0f172a">О себе: люблю игры</text>
  <path d="M 580 300 C 640 300, 700 285, 745 272" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- branches -->
  <rect x="360" y="420" width="500" height="72" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="376" y="446" font-size="14" fill="#991b1b">Имя пустое → «Впиши, пожалуйста, имя!»</text>
  <text x="376" y="472" font-size="14" fill="#991b1b">Возраст не число → «А возраст введи числом.»</text>
  <path d="M 470 390 L 470 418" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#r)"/>

  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#16a34a"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#ef4444"/></marker>
  </defs>
</svg>
