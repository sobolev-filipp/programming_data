<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="720" height="540" fill="#f7f9fc"/>
  <text x="360" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Grid — таблица из строк и столбцов</text>
  <text x="360" y="68" text-anchor="middle" font-size="15" fill="#64748b">Адрес ячейки = номер строки и столбца. Считаем с нуля, как индексы массива.</text>

  <!-- column headers -->
  <text x="240" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#512bd4">столбец 0</text>
  <text x="360" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#512bd4">1</text>
  <text x="480" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#512bd4">2</text>

  <!-- row headers -->
  <text x="150" y="196" text-anchor="end" font-size="18" font-weight="700" fill="#16a34a">строка 0</text>
  <text x="150" y="316" text-anchor="end" font-size="18" font-weight="700" fill="#16a34a">1</text>
  <text x="150" y="436" text-anchor="end" font-size="18" font-weight="700" fill="#16a34a">2</text>

  <!-- cells -->
  <g fill="#ffffff" stroke="#cbd5e1" stroke-width="2">
    <rect x="180" y="130" width="120" height="120" rx="8"/>
    <rect x="300" y="130" width="120" height="120" rx="8"/>
    <rect x="420" y="130" width="120" height="120" rx="8"/>
    <rect x="180" y="250" width="120" height="120" rx="8"/>
    <rect x="300" y="250" width="120" height="120" rx="8"/>
    <rect x="180" y="370" width="120" height="120" rx="8"/>
    <rect x="300" y="370" width="120" height="120" rx="8"/>
    <rect x="420" y="370" width="120" height="120" rx="8"/>
  </g>

  <!-- highlighted cell row1 col2 -->
  <rect x="420" y="250" width="120" height="120" rx="8" fill="#ede9fe" stroke="#512bd4" stroke-width="3"/>
  <text x="480" y="305" text-anchor="middle" font-size="16" font-weight="700" fill="#512bd4">Row="1"</text>
  <text x="480" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#512bd4">Column="2"</text>

  <text x="360" y="524" text-anchor="middle" font-size="14" fill="#64748b">Подсвечена ячейка «строка 1, столбец 2» → Grid.Row="1" Grid.Column="2"</text>
</svg>
