<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 3 MAUI (Сетка Grid)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что такое <code>Grid</code>?",
   a:["кнопка","макет-таблица из строк и столбцов","цвет","переменная"],c:1,
   e:"Grid делит место на строки и столбцы; на пересечении — ячейки."},
  {q:"Когда <code>Grid</code> удобнее стеков?",
   a:["всегда","когда элементы ложатся таблицей (сетка, форма)","никогда","для одной кнопки"],c:1,
   e:"Ровные строки и столбцы (калькулятор, клавиатура) — это про Grid."},
  {q:"Что задаёт <code>RowDefinitions</code>?",
   a:["цвет строк","строки сетки и их размеры","шрифт","имя"],c:1,
   e:"RowDefinitions перечисляет строки; ColumnDefinitions — столбцы."},
  {q:"Что значит размер <code>*</code>?",
   a:["ровно 1 пиксель","«займи оставшееся место» (делится поровну)","спрятать","авто по тексту"],c:1,
   e:"Звёздочки делят свободное место поровну. 2* — вдвое больше."},
  {q:"Что значит размер <code>Auto</code>?",
   a:["очень большой","ровно по размеру содержимого","половина экрана","ноль"],c:1,
   e:"Auto — столько, сколько нужно содержимому ячейки."},
  {q:"Как положить элемент в нужную ячейку?",
   a:["<code>Cell=\"1,2\"</code>","<code>Grid.Row</code> и <code>Grid.Column</code>","<code>Place</code>","никак"],c:1,
   e:"Указываем строку и столбец: Grid.Row=\"1\" Grid.Column=\"2\"."},
  {q:"С какого числа нумеруются строки и столбцы?",
   a:["с 1","с нуля (0)","с −1","как угодно"],c:1,
   e:"Как индексы массива: первый — 0, второй — 1."},
  {q:"Второй столбец слева — это <code>Grid.Column=</code>?",
   a:["<code>\"2\"</code>","<code>\"1\"</code>","<code>\"0\"</code>","<code>\"3\"</code>"],c:1,
   e:"Счёт с нуля: первый — 0, второй — 1."},
  {q:"Как растянуть элемент на 4 столбца?",
   a:["<code>Grid.ColumnSpan=\"4\"</code>","<code>Width=\"4\"</code>","<code>Columns=\"4\"</code>","никак"],c:0,
   e:"ColumnSpan растягивает по столбцам, RowSpan — по строкам."},
  {q:"Что задаёт <code>RowSpacing</code>?",
   a:["высоту строки","расстояние между строками","цвет","отступ текста"],c:1,
   e:"RowSpacing — зазор между строками, ColumnSpacing — между столбцами."},
  {q:"Забыл(а) у элемента <code>Grid.Row</code>/<code>Grid.Column</code>. Куда он встанет?",
   a:["исчезнет совсем","в ячейку (0,0) — наложится на соседа","в центр","в последнюю ячейку"],c:1,
   e:"Без координат элемент садится в ячейку 0,0."},
  {q:"Один метод на много кнопок — через что узнать нажатую?",
   a:["<code>this</code>","<code>sender</code>","<code>e.Text</code>","<code>name</code>"],c:1,
   e:"sender — «кто позвал»: Button b = (Button)sender;"},
  {q:"Что делает <code>(Button)sender</code>?",
   a:["создаёт кнопку","говорит, что sender — это кнопка (и берём её Text)","удаляет","красит"],c:1,
   e:"Приведение: получаем нажатую кнопку и её свойства."},
  {q:"Что вычисляет результат в калькуляторе по знаку операции?",
   a:["<code>if</code> из 100 веток","<code>switch</code> по операции","цикл","массив"],c:1,
   e:"switch (op) выбирает формулу: +, −, ×, ÷."},
  {q:"<code>10 ÷ 3</code> даёт длинный «хвост». Чем подрезать?",
   a:["<code>Math.Round(result, 4)</code>","удалить кнопку","<code>int</code>","никак"],c:0,
   e:"Math.Round(x, 4) оставит 3,3333. Math — из блока 1."},

  {q:"😄 Все кнопки свалились в один угол экрана. Что забыл(а)?",
   a:["купить монитор","задать <code>Grid.Row</code>/<code>Grid.Column</code>","цвет","интернет"],c:1,
   e:"Без координат все садятся в ячейку 0,0 друг на друга."},
  {q:"😄 Кнопка «пропала». Строк в сетке 5, а у неё <code>Grid.Row=\"5\"</code>. Почему?",
   a:["сломался ПК","строки 0–4, а 5 — уже за краем сетки","мало памяти","нужен рестарт"],c:1,
   e:"Счёт с нуля: пять строк — это 0,1,2,3,4. Row=5 не существует."},
  {q:"😄 Кнопки в сетке слиплись в сплошную стену. Что добавить <code>Grid</code>?",
   a:["<code>RowSpacing</code>/<code>ColumnSpacing</code>","ещё кнопок","цвет","звук"],c:0,
   e:"Зазоры между строками и столбцами делают сетку аккуратной."},

  {q:"🤔 Для клавиатуры калькулятора что выберешь?",
   a:["много вложенных стеков","<code>Grid</code> (сетку)","одну кнопку","консоль"],c:1,
   e:"Ровная сетка кнопок — идеальный случай для Grid."},
  {q:"🤔 <code>ColumnDefinitions=\"*,2*\"</code> — какой столбец шире?",
   a:["первый","второй (в два раза)","одинаковые","никакой"],c:1,
   e:"2* получает вдвое больше места, чем *."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🧮 Урок 3 — Сетка Grid</h1>
    <div class="sub">Проверь себя по строкам, столбцам и калькулятору</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Сетка Grid — как таблица умножения.';}
  else if(pct>=70){em='🎉';msg='Отлично! Строки, столбцы и координаты ты понял(а).';}
  else if(pct>=40){em='👍';msg='Неплохо! Загляни в итого.md и попробуй снова.';}
  else {em='💪';msg='Ещё разок! Перечитай про Grid.Row/Column и счёт с нуля.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Урок 3 пройден!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
