<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', system-ui, sans-serif">
  <rect width="900" height="520" fill="#f7f9fc"/>
  <text x="450" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Вложенные стеки — коробка в коробке</text>
  <text x="450" y="66" text-anchor="middle" font-size="15" fill="#64748b">Шапка карточки: ряд (аватар + блок), а блок справа — столбик (имя над ролью).</text>

  <!-- outer vertical card -->
  <rect x="90" y="95" width="720" height="300" rx="16" fill="#ffffff" stroke="#512bd4" stroke-width="2.5"/>
  <text x="110" y="122" font-size="15" font-weight="700" fill="#512bd4">VerticalStackLayout — вся карточка (столбик)</text>

  <!-- header horizontal -->
  <rect x="120" y="140" width="660" height="140" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="140" y="164" font-size="14" font-weight="700" fill="#15803d">HorizontalStackLayout — шапка (ряд)</text>

  <!-- avatar -->
  <rect x="150" y="178" width="120" height="86" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="210" y="236" text-anchor="middle" font-size="44">🦊</text>
  <text x="210" y="256" text-anchor="middle" font-size="11" fill="#b45309">Label (аватар)</text>

  <!-- inner vertical -->
  <rect x="300" y="178" width="430" height="86" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="320" y="199" font-size="13" font-weight="700" fill="#1e40af">VerticalStackLayout — имя/роль (столбик, вложен!)</text>
  <text x="320" y="228" font-size="20" font-weight="700" fill="#0f172a">Алиса</text>
  <text x="320" y="252" font-size="15" fill="#64748b">Гейм-дизайнер</text>

  <!-- rows below -->
  <rect x="120" y="296" width="660" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="140" y="318" font-size="14" fill="#15803d">HorizontalStackLayout → «Город:»  «Казань»</text>
  <rect x="120" y="344" width="660" height="34" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="140" y="366" font-size="14" fill="#15803d">HorizontalStackLayout → «Любит:»  «платформеры»</text>

  <!-- legend -->
  <rect x="150" y="430" width="22" height="16" rx="4" fill="#ffffff" stroke="#512bd4" stroke-width="2.5"/>
  <text x="180" y="443" font-size="14" fill="#334155">— вертикальная стопка (столбик)</text>
  <rect x="470" y="430" width="22" height="16" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="500" y="443" font-size="14" fill="#334155">— горизонтальная стопка (ряд)</text>

  <text x="450" y="486" text-anchor="middle" font-size="14" fill="#64748b">Снаружи — столбик. Внутри — ряд. А в ряду снова столбик. Так строится любой экран.</text>
</svg>
