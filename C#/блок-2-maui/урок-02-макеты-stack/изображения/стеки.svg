<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400"><rect width="700" height="400" fill="#eef2f7"/><g font-family="Arial" fill="#17243a" font-size="20"><text x="30" y="35">Вертикальный контейнер</text><rect x="30" y="55" width="290" height="310" rx="12" fill="white" stroke="#315b9b"/><rect x="50" y="80" width="250" height="55" rx="6" fill="#dce9f5"/><text x="65" y="115">Заголовок</text><rect x="50" y="155" width="250" height="105" rx="6" fill="#dce9f5"/><rect x="65" y="170" width="75" height="75" rx="6" fill="#a8c8e8"/><text x="155" y="195">Имя</text><text x="155" y="225">Роль</text><rect x="50" y="280" width="250" height="55" rx="6" fill="#a8c8e8"/><text x="65" y="315">Кнопка</text><text x="355" y="100">Padding: от края до блока</text><text x="355" y="150">Spacing: между блоками</text><text x="355" y="205">Вложенный ряд:</text><text x="355" y="235">аватар + имя и роль</text><text x="355" y="300">Margin: снаружи элемента</text></g></svg>