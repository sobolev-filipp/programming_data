<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460"><rect width="100%" height="100%" fill="#f0edff"/><text x="35" y="48" font-family="sans-serif" font-size="30" font-weight="bold" fill="#31205e">Элементы конструктора</text><rect x="35" y="75" width="930" height="72" rx="12" fill="white" stroke="#b7a8e8"/><text x="55" y="104" font-family="sans-serif" font-size="22" font-weight="bold" fill="#31205e">Entry → TextChanged</text><text x="55" y="130" font-family="sans-serif" font-size="19" fill="#344054">Ввод названия → обновляем заголовок</text><rect x="35" y="165" width="930" height="72" rx="12" fill="white" stroke="#b7a8e8"/><text x="55" y="194" font-family="sans-serif" font-size="22" font-weight="bold" fill="#31205e">Picker → SelectedIndexChanged</text><text x="55" y="220" font-family="sans-serif" font-size="19" fill="#344054">Выбор типа → меняем изображение и цену</text><rect x="35" y="255" width="930" height="72" rx="12" fill="white" stroke="#b7a8e8"/><text x="55" y="284" font-family="sans-serif" font-size="22" font-weight="bold" fill="#31205e">CheckBox → CheckedChanged</text><text x="55" y="310" font-family="sans-serif" font-size="19" fill="#344054">Щит включён → прибавляем 300</text><rect x="35" y="345" width="930" height="72" rx="12" fill="white" stroke="#b7a8e8"/><text x="55" y="374" font-family="sans-serif" font-size="22" font-weight="bold" fill="#31205e">UpdateShip()</text><text x="55" y="400" font-family="sans-serif" font-size="19" fill="#344054">Читаем все значения и заново вычисляем результат</text></svg>
