<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 2 MAUI (Макеты: стеки)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что такое <b>макет</b> (layout)?", a:["контейнер, расставляющий элементы","просто цвет экрана","это разновидность кнопки","это обычная переменная"], c:0, e:"Макет — коробка-контейнер: кладём элементы, а он их расставляет по правилу."},
  {q:"Как ставит элементы <code>VerticalStackLayout</code>?", a:["друг под другом","в один ряд","по кругу","случайно"], c:0, e:"Vertical = вертикально, элементы идут сверху вниз."},
  {q:"Как ставит элементы <code>HorizontalStackLayout</code>?", a:["в ряд","друг под другом","стопкой","по центру"], c:0, e:"Horizontal = горизонтально, элементы идут в ряд."},
  {q:"Что задаёт <code>Spacing</code>?", a:["расстояние между элементами","цвет фона","размер шрифта","имя контейнера"], c:0, e:"Spacing — «воздух» между детьми внутри стопки."},
  {q:"Что задаёт <code>Padding</code>?", a:["отступ от краёв контейнера","расстояние между элементами","жирность текста","фон"], c:0, e:"Padding — поле от краёв контейнера до элементов внутри."},
  {q:"Как поставить элемент по центру по горизонтали?", a:["<code>HorizontalOptions=\"Center\"</code>","<code>Center=true</code>","<code>Middle=\"yes\"</code>","<code>Align=0</code>"], c:0, e:"HorizontalOptions управляет прижатием: Start / Center / End / Fill."},
  {q:"Что делает <code>HorizontalOptions=\"End\"</code>?", a:["прижимает вправо","прижимает влево","растягивает","прячет"], c:0, e:"End = к правому краю (Start — к левому, Center — по центру)."},
  {q:"Что такое <b>вложенные стеки</b>?", a:["стопка внутри стопки","две разные программы","две кнопки","ошибка"], c:0, e:"Стопку кладут внутрь другой стопки — так строятся все экраны."},
  {q:"Аватар слева, справа имя над ролью. Какой <b>внешний</b> контейнер?", a:["<code>HorizontalStackLayout</code>","<code>VerticalStackLayout</code>","<code>Label</code>","<code>Button</code>"], c:0, e:"Аватар и блок стоят в ряд → внешний горизонтальный; имя/роль внутри — вертикальный."},
  {q:"Что делает <code>FontAttributes=\"Bold\"</code>?", a:["делает текст жирным","увеличивает шрифт","красит текст","центрирует"], c:0, e:"Bold — жирное начертание текста."},
  {q:"Чтобы менять контейнер из кода C#, ему нужно...", a:["задать <code>x:Name</code>","совсем ничего","покрасить фон","удалить его"], c:0, e:"Как и метке: есть имя — можно писать Card.Spacing = 40;"},
  {q:"Как задать цвет в коде C# (а не в XAML)?", a:["из класса <code>Colors</code>","строкой <code>\"Purple\"</code>","обычным числом","никак нельзя"], c:0, e:"В XAML цвет — строкой, в C# — из класса Colors."},
  {q:"Элементы встали <b>столбиком</b>, а хотел в ряд. Что не так?", a:["они в <code>VerticalStackLayout</code>","видимо, не хватает памяти","просто нет интернета","виноват старый ПК"], c:0, e:"Направление задаёт контейнер — нужен HorizontalStackLayout."},
  {q:"Что значит <code>Padding=\"40,10\"</code>?", a:["40 по бокам, 10 сверху/снизу","40 и 10 просто случайно","отступ только слева","это будет ошибка компиляции"], c:0, e:"Два числа: горизонтально (бока) и вертикально (верх/низ)."},
  {q:"XAML-ошибка при сборке экрана. Частая причина?", a:["не закрыт вложенный тег","мало кнопок","нет цвета","длинный текст"], c:0, e:"У каждого <...> должен быть парный </...>. Помогают отступы-лесенка."},
  {q:"😄 Хотел кнопки в ряд, а они встали столбиком. Кто «виноват»?", a:["клавиатура","контейнер — это <code>VerticalStackLayout</code>","мышь","монитор"], c:1, e:"Просто не тот контейнер — оберни в HorizontalStackLayout."},
  {q:"😄 Большой аватар «подпрыгнул» над мелким текстом. Что добавить?", a:["новый ПК","<code>VerticalOptions=\"Center\"</code> элементам","ещё один аватар","шрифт 200"], c:1, e:"Выравнивание по центру ставит их на одну линию."},
  {q:"😄 <code>Card.Spacing = 40;</code>, а IDE: «Card не существует». Забыл(а)?", a:["купить лицензию","<code>x:Name=\"Card\"</code> у стопки","надо закрыть окно","обновить Windows"], c:1, e:"Без имени код не «видит» контейнер."},
  {q:"🤔 Любой сложный экран приложения — это по сути...", a:["одна большая кнопка","стопки, вложенные друг в друга","одна картинка","таблица чисел"], c:1, e:"Столбики и ряды, вложенные как матрёшки, — основа любого экрана."},
  {q:"🤔 Нужны ровные колонки и элементы по краям строки. Что удобнее стеков?", a:["ещё больше стеков","<code>Grid</code> (сетка) — следующий урок","консоль","совсем ничего не произойдёт"], c:1, e:"Точные таблицы и «по краям» удобно делать через Grid (урок 3)."}
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>📐 Урок 2 — Макеты: стеки</h1>
    <div class="sub">Проверь себя по расстановке элементов</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Стеки и вложенность — твои.';}
  else if(pct>=70){em='🎉';msg='Отлично! Ряды, столбики и вложение ты понял(а).';}
  else if(pct>=40){em='👍';msg='Неплохо! Загляни в итого.md и попробуй снова.';}
  else {em='💪';msg='Ещё разок! Перечитай урок про Vertical/Horizontal и вложенные стеки.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Урок 2 пройден!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
