<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 7 MAUI (События и логика)</title>
<style>
  :root{
    --bg1:#512bd4; --bg2:#9b6dff; --card:#ffffff; --ink:#1f2937;
    --accent:#512bd4; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что такое параметр <code>sender</code> в обработчике?",
   a:["текст кнопки","элемент, который вызвал событие","цвет","число"],c:1,
   e:"sender — кто вызвал событие (какую кнопку нажали)."},
  {q:"Зачем нужен <code>sender</code>?",
   a:["для красоты","один обработчик на много кнопок","чтобы красить","он не нужен"],c:1,
   e:"Один метод обслуживает много кнопок — внутри узнаём нажатую."},
  {q:"Как безопасно получить кнопку из <code>sender</code>?",
   a:["<code>sender.Text</code>","<code>if (sender is Button btn)</code>","<code>new Button()</code>","никак"],c:1,
   e:"sender is Button btn проверяет тип и сразу даёт переменную btn."},
  {q:"Почему нельзя написать <code>sender.Text</code> напрямую?",
   a:["длинно","у типа <code>object?</code> нет свойства <code>Text</code>","запрещено","можно"],c:1,
   e:"sender имеет тип object?; сначала приведи к Button."},
  {q:"Что показывает <code>DisplayAlertAsync</code>?",
   a:["новую страницу","всплывающее окно поверх приложения","консоль","файл"],c:1,
   e:"Всплывающее окно с заголовком, текстом и кнопкой(ами)."},
  {q:"Сколько аргументов у окна-<b>сообщения</b> (одна кнопка)?",
   a:["один","три: заголовок, текст, кнопка","пять","ноль"],c:1,
   e:"DisplayAlertAsync(\"Заголовок\",\"Текст\",\"OK\")."},
  {q:"Что вернёт окно-<b>вопрос</b> с двумя кнопками?",
   a:["строку","<code>bool</code> (true/false)","число","ничего"],c:1,
   e:"true — нажали первую кнопку, false — вторую."},
  {q:"В <code>DisplayAlertAsync(...,\"Да\",\"Нет\")</code> что вернёт нажатие «Да»?",
   a:["<code>false</code>","<code>true</code>","\"Да\"","0"],c:1,
   e:"Третий аргумент (первая кнопка) = true."},
  {q:"Что делает <code>await</code> перед <code>DisplayAlertAsync</code>?",
   a:["ускоряет","ждёт, пока окно закроют","красит окно","удаляет"],c:1,
   e:"await = «дождись результата, потом иди дальше»."},
  {q:"Что нужно добавить в заголовок метода, чтобы работал <code>await</code>?",
   a:["<code>static</code>","<code>async</code>","<code>void</code>","ничего"],c:1,
   e:"async = «метод умеет ждать». Без него await — ошибка."},
  {q:"Как называется метод окна в <b>.NET 10</b>?",
   a:["<code>DisplayAlert</code>","<code>DisplayAlertAsync</code>","<code>ShowAlert</code>","<code>MessageBox</code>"],c:1,
   e:"DisplayAlertAsync (со словом Async); старое имя устарело."},
  {q:"Что делает <code>IsEnabled = false</code>?",
   a:["прячет элемент","делает серым/неактивным (виден)","удаляет","красит"],c:1,
   e:"Элемент виден, но нажать/ввести нельзя (серый)."},
  {q:"Что делает <code>IsVisible = false</code>?",
   a:["делает серым","прячет совсем (и место не занимает)","отключает","красит"],c:1,
   e:"Элемент исчезает полностью."},
  {q:"Кнопка «Отправить» серая, пока не введено имя. Какое свойство меняем?",
   a:["<code>IsVisible</code>","<code>IsEnabled</code>","<code>Text</code>","<code>Color</code>"],c:1,
   e:"IsEnabled: серая (нельзя нажать), но видна."},
  {q:"Кнопка «Заново» появляется только после ответа. Какое свойство?",
   a:["<code>IsEnabled</code>","<code>IsVisible</code>","<code>Opacity</code>","<code>Text</code>"],c:1,
   e:"IsVisible=false в XAML, потом =true из кода."},

  {q:"😄 Написал <code>await</code>, а <code>async</code> забыл. Что скажет компилятор?",
   a:["спасибо","ошибку — await только в async-методе","ничего","похвалит"],c:1,
   e:"await работает только в методе с async."},
  {q:"😄 Кнопка «Удалить всё» удаляет сразу без вопроса. Что добавить?",
   a:["цвет","подтверждение <code>DisplayAlertAsync(...\"Да\",\"Нет\")</code>","звук","ничего"],c:1,
   e:"Перед необратимым — всегда спрашивай «Точно?»."},
  {q:"😄 Три кнопки, а обработчик на всех реагирует одинаково. Почему?",
   a:["баг MAUI","не читаешь <code>sender</code>","мало памяти","нет интернета"],c:1,
   e:"Надо внутри взять btn.Text из sender, чтобы различать."},

  {q:"🤔 Убрал <code>await</code> у окна-вопроса (метод оставил async). Что с <code>bool</code>?",
   a:["всё ок","код не дождётся ответа — результат неверный","станет строкой","ошибка навсегда"],c:1,
   e:"Без await код помчится дальше, не дождавшись выбора."},
  {q:"🤔 Чем <code>sender is Button btn</code> лучше <code>(Button)sender</code> (ур.3)?",
   a:["ничем","проверяет тип и не упадёт, если не кнопка","быстрее рисует","короче"],c:1,
   e:"Безопасно: если не Button — просто не войдёт в if, без падения."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>⚡ Урок 7 — События и логика</h1>
    <div class="sub">Проверь себя: sender, DisplayAlertAsync, IsEnabled/IsVisible</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! События и окна тебе покорились.';}
  else if(pct>=70){em='🎉';msg='Отлично! sender и DisplayAlertAsync ты понял(а).';}
  else if(pct>=40){em='👍';msg='Неплохо! Загляни в итого.md и попробуй снова.';}
  else {em='💪';msg='Ещё разок! Перечитай про sender, async/await и IsEnabled.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Урок 7 пройден!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
