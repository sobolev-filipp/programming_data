<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра — Пиксель-мемори</title>
<style>
  :root{--bg1:#37c871;--bg2:#43b7ff;--ink:#2b2350;--yellow:#ffd23f;--green:#37c871;}
  *{box-sizing:border-box;margin:0;font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;}
  body{min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;
    align-items:center;justify-content:center;padding:16px;color:var(--ink);}
  .stage{width:min(600px,100%);background:#fff;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.25);
    padding:24px 22px 28px;text-align:center;}
  .bip{width:74px;height:auto;margin-bottom:2px;}
  h1{font-size:26px;color:#2a9d5c;margin:4px 0;}
  .sub{color:#7a76a0;font-size:16px;margin-bottom:12px;}
  .top{display:flex;justify-content:center;gap:18px;font-size:18px;color:#4a4a6a;margin-bottom:10px;}
  .top b{color:#2b2350;}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;margin:0 auto;}
  .cell{aspect-ratio:1;border-radius:14px;background:linear-gradient(135deg,#8a5cf6,#43b7ff);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:min(9vw,44px);position:relative;
    box-shadow:0 6px 14px rgba(0,0,0,.18);transition:transform .1s;user-select:none;}
  .cell:hover{transform:translateY(-2px);}
  .cell .back{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:12px;}
  .cell .back i{background:rgba(255,255,255,.35);border-radius:3px;}
  .cell.open{background:#fff8ec;}
  .cell.open .back{display:none;}
  .cell.done{background:#d9f8e5;cursor:default;}
  .cell .em{display:none;}
  .cell.open .em, .cell.done .em{display:block;}
  .start,.next{border:none;border-radius:18px;background:var(--yellow);color:#6b4e00;font-size:24px;
    font-weight:bold;padding:15px 30px;margin-top:16px;cursor:pointer;}
  .start:hover,.next:hover{background:#ffdf6a;}
  .big{font-size:56px;margin:6px 0;}
  .hidden{display:none !important;}
  .hint{color:#9a96b8;font-size:14px;margin-top:14px;}
</style>
</head>
<body>
<div class="stage">
  <svg class="bip" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
    <line x1="60" y1="18" x2="60" y2="8" stroke="#43b7ff" stroke-width="5"/><circle cx="60" cy="7" r="7" fill="#ffd23f"/>
    <rect x="22" y="22" width="76" height="62" rx="20" fill="#ffd23f"/><rect x="33" y="34" width="54" height="32" rx="13" fill="#2b2350"/>
    <circle cx="50" cy="50" r="8" fill="#43b7ff"/><circle cx="72" cy="50" r="8" fill="#43b7ff"/>
    <circle cx="50" cy="50" r="3.5" fill="#fff"/><circle cx="72" cy="50" r="3.5" fill="#fff"/>
    <path d="M49 73 q11 9 22 0" stroke="#2b2350" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="34" y="88" width="52" height="30" rx="14" fill="#43b7ff"/>
  </svg>

  <div id="intro">
    <h1>Пиксель-мемори! 🐾</h1>
    <p class="sub">Найди все пары пиксельных зверят. Открывай по две карточки!</p>
    <button class="start" onclick="startGame()">▶ Играть!</button>
    <p class="hint">Запоминай, где кто спрятался. Одинаковые — пара!</p>
  </div>

  <div id="game" class="hidden">
    <div class="top"><div>Пары: <b id="pairs">0</b>/<span id="totalPairs">8</span></div><div>Ходы: <b id="moves">0</b></div></div>
    <div class="board" id="board"></div>
  </div>

  <div id="result" class="hidden">
    <div class="big">🏆</div>
    <h1 id="resTitle">Все пары найдены!</h1>
    <p class="sub" id="resText"></p>
    <button class="next" onclick="location.reload()">↺ Ещё разок</button>
  </div>
</div>

<script>
const PETS = ['🐱','🐶','🐰','🐸','🐭','🦊','🐼','🦁'];
let deck=[], first=null, lock=false, pairs=0, moves=0;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const BACK='<div class="back"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>';

function startGame(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  deck=shuffle([...PETS,...PETS]);
  first=null; lock=false; pairs=0; moves=0;
  document.getElementById('pairs').textContent='0';
  document.getElementById('moves').textContent='0';
  const board=document.getElementById('board'); board.innerHTML='';
  deck.forEach((em,i)=>{
    const c=document.createElement('div'); c.className='cell'; c.dataset.i=i; c.dataset.em=em;
    c.innerHTML=BACK+'<span class="em">'+em+'</span>';
    c.onclick=()=>flip(c);
    board.appendChild(c);
  });
}

function flip(c){
  if(lock) return;
  if(c.classList.contains('open')||c.classList.contains('done')) return;
  c.classList.add('open');
  if(!first){ first=c; return; }
  // вторая карта
  moves++; document.getElementById('moves').textContent=moves;
  if(first.dataset.em===c.dataset.em){
    first.classList.add('done'); c.classList.add('done');
    first=null; pairs++; document.getElementById('pairs').textContent=pairs;
    if(pairs===PETS.length) setTimeout(win,500);
  } else {
    lock=true;
    const a=first, b=c; first=null;
    setTimeout(()=>{ a.classList.remove('open'); b.classList.remove('open'); lock=false; },800);
  }
}

function win(){
  document.getElementById('game').classList.add('hidden');
  const r=document.getElementById('result'); r.classList.remove('hidden');
  let praise = moves<=12 ? 'Невероятная память! 🏆' : moves<=20 ? 'Отличная память! 👏' : 'Молодец, все пары найдены! 💪';
  document.getElementById('resText').textContent='Ты нашёл все '+PETS.length+' пар за '+moves+' ходов! ⭐ '+praise;
}
</script>
</body>
</html>
