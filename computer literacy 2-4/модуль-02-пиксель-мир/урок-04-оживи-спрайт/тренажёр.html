<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр печати — Поймай букву</title>
<style>
  :root{--bg1:#43b7ff;--bg2:#37c871;--ink:#2b2350;--yellow:#ffd23f;--green:#37c871;--red:#ff7a7a;}
  *{box-sizing:border-box;margin:0;font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;user-select:none;}
  body{min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;
    align-items:center;justify-content:center;padding:16px;color:var(--ink);}
  .stage{width:min(680px,100%);background:#fff;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.25);
    padding:26px 24px 32px;text-align:center;}
  .bip{width:80px;height:auto;margin-bottom:2px;}
  h1{font-size:28px;color:#1e86c9;margin:2px 0;}
  .sub{color:#7a76a0;font-size:16px;margin-bottom:12px;}
  .letter{font-size:150px;font-weight:bold;line-height:1.1;color:#2b2350;margin:6px 0;
    transition:transform .1s,color .1s;}
  .letter.ok{color:var(--green);transform:scale(1.15);}
  .letter.no{color:var(--red);animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  .say{font-size:22px;font-weight:bold;min-height:30px;margin-top:4px;}
  .prog{height:20px;background:#eee;border-radius:10px;overflow:hidden;margin:14px auto 4px;max-width:360px;}
  .prog>div{height:100%;width:0;background:linear-gradient(90deg,#43b7ff,#37c871);transition:width .2s;}
  .cnt{font-size:18px;color:#7a76a0;}
  .start,.next{border:none;border-radius:18px;background:var(--yellow);color:#6b4e00;font-size:24px;
    font-weight:bold;padding:15px 30px;margin-top:14px;cursor:pointer;}
  .start:hover,.next:hover{background:#ffdf6a;}
  .med{font-size:56px;margin:6px 0;}
  .hidden{display:none !important;}
  .tip{color:#9a96b8;font-size:14px;margin-top:12px;}
</style>
</head>
<body>
<div class="stage">
  <svg class="bip" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
    <line x1="60" y1="18" x2="60" y2="8" stroke="#43b7ff" stroke-width="5"/><circle cx="60" cy="7" r="7" fill="#ffd23f"/>
    <rect x="22" y="22" width="76" height="62" rx="20" fill="#ffd23f"/><rect x="33" y="34" width="54" height="32" rx="13" fill="#2b2350"/>
    <circle cx="50" cy="50" r="8" fill="#43b7ff"/><circle cx="72" cy="50" r="8" fill="#43b7ff"/>
    <circle cx="50" cy="50" r="3.5" fill="#fff"/><circle cx="72" cy="50" r="3.5" fill="#fff"/>
    <path d="M49 73 q11 9 22 0" stroke="#2b2350" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="34" y="88" width="52" height="30" rx="14" fill="#43b7ff"/>
  </svg>

  <div id="intro">
    <h1>Поймай букву! ⌨️</h1>
    <p class="sub">На экране появится буква — найди и нажми её на клавиатуре!</p>
    <button class="start" onclick="startGame()">▶ Играть!</button>
    <p class="tip">Тренируем пальчики. Не спеши — ищи букву спокойно.</p>
  </div>

  <div id="game" class="hidden">
    <div class="letter" id="letter">А</div>
    <div class="say" id="say">Нажми эту букву 👆</div>
    <div class="prog"><div id="bar"></div></div>
    <div class="cnt" id="cnt">Поймано: 0 из 12</div>
  </div>

  <div id="result" class="hidden">
    <div class="med" id="med">🏆</div>
    <h1>Молодец! 🎉</h1>
    <p class="sub" id="resText"></p>
    <button class="next" onclick="location.reload()">↺ Ещё разок</button>
  </div>
</div>

<script>
const POOL = ['А','О','М','П','К','Т','Н','Р','С','Л','В','Е','И','У','Д','Б','Я','Ш'];
const TOTAL = 12;
let queue=[], idx=0, done=0;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function startGame(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  queue=[]; for(let i=0;i<TOTAL;i++) queue.push(POOL[Math.random()*POOL.length|0]);
  idx=0; done=0;
  showLetter();
}
function showLetter(){
  const el=document.getElementById('letter');
  el.className='letter'; el.textContent=queue[idx];
  document.getElementById('say').textContent='Нажми эту букву 👆';
  document.getElementById('say').style.color='#2b2350';
}
function updateProg(){
  document.getElementById('bar').style.width=Math.round(done/TOTAL*100)+'%';
  document.getElementById('cnt').textContent='Поймано: '+done+' из '+TOTAL;
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('game').classList.contains('hidden')) return;
  if(e.key.length!==1) return; // игнор служебных клавиш
  const want=queue[idx];
  const el=document.getElementById('letter');
  const say=document.getElementById('say');
  if(e.key.toUpperCase()===want){
    el.className='letter ok'; say.textContent='✅ Верно!'; say.style.color='#37c871';
    done++; updateProg();
    setTimeout(()=>{ idx++; if(idx>=TOTAL){ finish(); } else { showLetter(); } }, 500);
  } else {
    el.className='letter no'; say.textContent='Не та буква — ищи «'+want+'» 👀'; say.style.color='#e0555f';
    setTimeout(()=>{ if(!document.getElementById('game').classList.contains('hidden')){ el.className='letter'; } }, 350);
  }
});
function finish(){
  document.getElementById('game').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('med').textContent='🏆';
  document.getElementById('resText').textContent='Ты поймал все '+TOTAL+' букв! Пальчики стали быстрее ⭐';
}
</script>
</body>
</html>
