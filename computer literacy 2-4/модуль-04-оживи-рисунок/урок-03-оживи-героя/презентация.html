<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Урок 13 — Оживи героя: анимация</title>
<style>
  :root{--ink:#2b2350;--yellow:#ffd23f;--blue:#43b7ff;--green:#37c871;--pink:#ff7ab6;--purple:#8a5cf6;--orange:#ff9e45;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;}
  html,body{height:100%;}
  body{background:#231a3d;overflow:hidden;color:var(--ink);}
  .slide{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vh 6vw;}
  .slide.active{display:flex;animation:pop .4s ease;}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  .art{font-size:clamp(70px,16vh,150px);line-height:1;margin:10px 0 4px;}
  h1{font-size:clamp(30px,6.5vh,64px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.15);}
  h2{font-size:clamp(26px,5.2vh,50px);color:#fff;margin-bottom:8px;}
  p{font-size:clamp(20px,3.6vh,34px);color:#fff;max-width:24ch;margin-top:10px;line-height:1.35;}
  .card{background:#fff;border-radius:30px;padding:4vh 5vw;max-width:980px;box-shadow:0 16px 40px rgba(0,0,0,.3);}
  .card h2,.card p,.card h1{color:var(--ink);text-shadow:none;}
  .steps{list-style:none;text-align:left;font-size:clamp(19px,3.4vh,31px);color:var(--ink);margin-top:10px;}
  .steps li{margin:11px 0;display:flex;gap:14px;align-items:center;}
  .bignum{display:inline-flex;min-width:44px;height:44px;border-radius:14px;background:var(--green);color:#fff;
    align-items:center;justify-content:center;font-weight:bold;font-size:24px;}
  .frames{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;}
  .frame{background:#fff;border-radius:16px;width:clamp(66px,11vh,96px);height:clamp(66px,11vh,96px);display:flex;align-items:center;justify-content:center;font-size:clamp(34px,6vh,54px);box-shadow:0 8px 18px rgba(0,0,0,.2);}
  .nav{position:fixed;bottom:14px;right:18px;display:flex;gap:10px;align-items:center;z-index:10;}
  .nav button{border:none;background:rgba(255,255,255,.9);border-radius:12px;font-size:24px;width:52px;height:46px;cursor:pointer;}
  .nav button:active{transform:translateY(2px);}
  .counter{position:fixed;bottom:20px;left:18px;color:#fff;font-size:18px;opacity:.7;z-index:10;}
  .tag{position:fixed;top:16px;left:20px;color:#fff;opacity:.65;font-size:17px;z-index:10;}
  .hintkey{position:fixed;top:16px;right:20px;color:#fff;opacity:.55;font-size:15px;z-index:10;}
  @media(max-width:600px){.hintkey{display:none;}}
</style>
</head>
<body>
<div class="tag">🎞 Урок 13 · Модуль 4 «Оживи рисунок»</div>
<div class="hintkey">← → или пробел листают слайды</div>
<div id="deck"></div>
<div class="counter" id="counter"></div>
<div class="nav">
  <button onclick="go(-1)">◀</button>
  <button onclick="go(1)">▶</button>
</div>

<script>
const BIP = `<svg viewBox="0 0 120 130" width="130" height="140" xmlns="http://www.w3.org/2000/svg">
  <line x1="60" y1="18" x2="60" y2="8" stroke="#43b7ff" stroke-width="5"/><circle cx="60" cy="7" r="7" fill="#ffd23f"/>
  <rect x="22" y="22" width="76" height="62" rx="20" fill="#ffd23f"/>
  <rect x="33" y="34" width="54" height="32" rx="13" fill="#2b2350"/>
  <circle cx="50" cy="50" r="8" fill="#43b7ff"/><circle cx="72" cy="50" r="8" fill="#43b7ff"/>
  <circle cx="50" cy="50" r="3.5" fill="#fff"/><circle cx="72" cy="50" r="3.5" fill="#fff"/>
  <path d="M49 73 q11 9 22 0" stroke="#2b2350" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="34" y="88" width="52" height="30" rx="14" fill="#43b7ff"/>
  <rect x="12" y="92" width="16" height="9" rx="4" fill="#ffd23f"/><rect x="92" y="92" width="16" height="9" rx="4" fill="#ffd23f"/>
</svg>`;

const SLIDES = [
  {bg:['#8a5cf6','#37c871'], html:`${BIP}<h1>Оживи героя! 🎞</h1><p>Сегодня наш нарисованный герой задвигается сам!</p>`},
  {bg:['#37c871','#ff7ab6'], html:`<div class="art">👁✋</div><h2>Вау-проект</h2><p>Герой <b>моргнёт и помашет лапкой</b> — сам, по кругу! Всего 3–4 кадра.</p>`},
  {bg:['#8a5cf6','#43b7ff'], html:`<div class="card"><h2>Секрет мультиков</h2><p>Анимация — это <b>обман зрения</b>: много похожих картинок-кадров быстро сменяются, и глаз видит движение!</p>
     <div class="frames"><div class="frame">🙂</div><div class="frame">😐</div><div class="frame">😊</div></div></div>`},
  {bg:['#43b7ff','#8a5cf6'], html:`<div class="card"><h2>Три новых слова</h2>
     <ul class="steps">
       <li><span class="bignum">🎞</span> <b>Кадр</b> — одна картинка</li>
       <li><span class="bignum">🔁</span> <b>Калька</b> — бледная тень прошлого кадра</li>
       <li><span class="bignum">⏩</span> <b>FPS</b> — сколько кадров в секунду</li>
     </ul></div>`},
  {bg:['#ff9e45','#ff7ab6'], html:`<div class="art">🧍🔁</div><h1>Физминутка «Живые кадры»</h1><p>«Кадр!» — рука внизу, «кадр!» — посередине, «кадр!» — вверху. Быстрее — машем!</p>`},
  {bg:['#8a5cf6','#37c871'], html:`<div class="card"><h2>Включаем анимацию</h2>
     <ul class="steps">
       <li><span class="bignum">1</span> 🎬 Window → Workspace → <b>Animation</b></li>
       <li><span class="bignum">2</span> 📊 Внизу — <b>Timeline</b> (полоса кадров)</li>
       <li><span class="bignum">3</span> ⏩ Поставь <b>FPS = 8</b></li>
     </ul></div>`},
  {bg:['#37c871','#43b7ff'], html:`<div class="card"><h2>🏀 Оживляем мячик</h2>
     <ul class="steps">
       <li><span class="bignum">1</span> Кадр 1 — мячик вверху</li>
       <li><span class="bignum">2</span> Duplicate Frame + мячик у пола</li>
       <li><span class="bignum">3</span> Duplicate — снова вверху → <b>Play</b>!</li>
     </ul></div>`},
  {bg:['#43b7ff','#8a5cf6'], html:`<div class="card"><h2>🔁 Калька — твой помощник</h2><p>Кнопка-лампочка (<b>Onion skin</b>) показывает прошлый кадр <b>бледно</b>. Рисуй по тени — движение будет ровным!</p></div>`},
  {bg:['#37c871','#ff7ab6'], html:`<div class="card"><h2>👁✋ Герой оживает</h2>
     <ul class="steps">
       <li><span class="bignum">1</span> Кадр: глаза открыты, лапка вверх</li>
       <li><span class="bignum">2</span> Кадр: глаза прикрыты</li>
       <li><span class="bignum">3</span> Кадр: открыты, лапка вниз → <b>Play</b>!</li>
     </ul></div>`},
  {bg:['#ff7ab6','#8a5cf6'], html:`<div class="art">🎞🧩</div><h1>Игра «Кадр за кадром»</h1><p>Расставь перепутанные кадры по порядку — и мультик оживёт!</p>`},
  {bg:['#8a5cf6','#43b7ff'], html:`<div class="art">💾</div><div class="card"><h2>Сохраняем</h2><p><b>File → Save</b> → <b>.kra</b> (помнит все кадры). Завтра соберём из них мультик!</p></div>`},
  {bg:['#ff9e45','#43b7ff'], html:`<div class="art">⌨️🔤</div><h1>Тренажёр печати</h1><p>Три режима, уровень 12!</p>`},
  {bg:['#37c871','#ff7ab6'], html:`${BIP}<div class="art">🎞🎉</div><h1>Ты — аниматор!</h1><p>Твой герой ожил! Викторина и звёзды ⭐</p>`},
];

const deck=document.getElementById('deck');
SLIDES.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide'; d.id='s'+i;
  d.style.background=`linear-gradient(135deg,${s.bg[0]},${s.bg[1]})`;
  d.innerHTML=s.html;
  deck.appendChild(d);
});
let cur=0;
function show(n){
  document.getElementById('s'+cur).classList.remove('active');
  cur=Math.max(0,Math.min(SLIDES.length-1,n));
  document.getElementById('s'+cur).classList.add('active');
  document.getElementById('counter').textContent=(cur+1)+' / '+SLIDES.length;
}
function go(step){show(cur+step);}
show(0);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(-1);}
  if(e.key==='Home')show(0);
  if(e.key==='End')show(SLIDES.length-1);
});
document.addEventListener('click',e=>{if(!e.target.closest('.nav'))go(1);});
</script>
</body>
</html>
