<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#f5f7fb"/>
  <text x="320" y="30" font-size="20" font-weight="800" fill="#1f2937" text-anchor="middle">🎭 Примерно что получится — а персонаж у тебя СВОЙ!</text>
  <text x="320" y="52" font-size="13" fill="#64748b" text-anchor="middle">Анимация = смена костюмов (кадров). Без звука — «голос» надписью.</text>

  <!-- panel 1: butterfly flaps -->
  <g transform="translate(20,70)">
    <rect x="0" y="0" width="195" height="200" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="97" y="24" font-size="13" font-weight="700" fill="#7a4fd6" text-anchor="middle">🦋 Машет крыльями</text>
    <g transform="translate(55,110)"><rect x="-34" y="-34" width="68" height="68" rx="10" fill="#f1ecfe"/><text x="0" y="14" font-size="40" text-anchor="middle">🦋</text><text x="0" y="46" font-size="11" fill="#475569" text-anchor="middle">костюм 1</text></g>
    <text x="100" y="105" font-size="22" fill="#4cbb5c" text-anchor="middle">↔</text>
    <g transform="translate(145,110)"><rect x="-34" y="-34" width="68" height="68" rx="10" fill="#f1ecfe"/><text x="0" y="14" font-size="40" text-anchor="middle" transform="scale(0.78,1)">🦋</text><text x="0" y="46" font-size="11" fill="#475569" text-anchor="middle">костюм 2</text></g>
  </g>

  <!-- panel 2: walking figure -->
  <g transform="translate(228,70)">
    <rect x="0" y="0" width="185" height="200" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="92" y="24" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">🚶 Шагает лапами</text>
    <g transform="translate(50,112)"><text x="0" y="14" font-size="44" text-anchor="middle">🧍</text></g>
    <text x="92" y="108" font-size="22" fill="#4cbb5c" text-anchor="middle">→</text>
    <g transform="translate(135,112)"><text x="0" y="14" font-size="44" text-anchor="middle">🚶</text></g>
    <text x="92" y="180" font-size="11" fill="#475569" text-anchor="middle">следующий костюм + ждать</text>
  </g>

  <!-- panel 3: dress-up / emotions -->
  <g transform="translate(426,70)">
    <rect x="0" y="0" width="194" height="200" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="97" y="24" font-size="13" font-weight="700" fill="#ff8c1a" text-anchor="middle">🎩 Наряд / 😃 эмоция</text>
    <g transform="translate(52,96)"><text x="0" y="12" font-size="34" text-anchor="middle">😀</text></g>
    <g transform="translate(142,96)"><text x="0" y="12" font-size="34" text-anchor="middle">😮</text></g>
    <g transform="translate(52,150)"><text x="0" y="12" font-size="34" text-anchor="middle">😢</text></g>
    <g transform="translate(142,150)"><text x="0" y="12" font-size="34" text-anchor="middle">🎩</text></g>
    <text x="97" y="186" font-size="11" fill="#475569" text-anchor="middle">по клику / по клавише меняем костюм</text>
  </g>
</svg>
