<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 300" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="580" height="300" fill="#f7f9fc"/>
  <text x="290" y="34" font-size="20" font-weight="800" fill="#1f2937" text-anchor="middle">👗 Костюмы = кадры анимации</text>
  <text x="290" y="56" font-size="13" fill="#64748b" text-anchor="middle">Быстрая смена двух поз = герой шагает лапами</text>

  <!-- frame 1 -->
  <g transform="translate(70,80)">
    <rect x="0" y="0" width="160" height="150" rx="14" fill="#eaf7ff" stroke="#4c97ff" stroke-width="3"/>
    <text x="80" y="26" font-size="14" font-weight="700" fill="#2f6fd0" text-anchor="middle">костюм 1</text>
    <!-- cat pose A (legs apart) -->
    <g transform="translate(80,92)">
      <ellipse cx="0" cy="0" rx="34" ry="24" fill="#ff9a3c" stroke="#e06f1e" stroke-width="3"/>
      <circle cx="26" cy="-14" r="18" fill="#ffb066" stroke="#e06f1e" stroke-width="3"/>
      <path d="M14 -26 l4 -14 l10 8 z" fill="#ffb066" stroke="#e06f1e" stroke-width="2"/>
      <path d="M34 -28 l6 -13 l7 11 z" fill="#ffb066" stroke="#e06f1e" stroke-width="2"/>
      <circle cx="24" cy="-16" r="2.6" fill="#3b2a1a"/><circle cx="33" cy="-16" r="2.6" fill="#3b2a1a"/>
      <path d="M-32 -4 q-24 -6 -18 -30" stroke="#e06f1e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g stroke="#e06f1e" stroke-width="6" stroke-linecap="round">
        <path d="M-14 22 l-8 14"/><path d="M14 22 l8 14"/>
      </g>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(262,155)">
    <path d="M0 0 l40 0" stroke="#4cbb5c" stroke-width="6" stroke-linecap="round"/>
    <path d="M52 0 l-16 -9 l0 18 z" fill="#4cbb5c"/>
    <path d="M52 -34 l-40 0" stroke="#4cbb5c" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 -34 l16 -9 l0 18 z" fill="#4cbb5c"/>
    <text x="26" y="24" font-size="12" font-weight="700" fill="#2e9e52" text-anchor="middle">смена</text>
  </g>

  <!-- frame 2 -->
  <g transform="translate(350,80)">
    <rect x="0" y="0" width="160" height="150" rx="14" fill="#eaf7ff" stroke="#9966ff" stroke-width="3"/>
    <text x="80" y="26" font-size="14" font-weight="700" fill="#7a4fd6" text-anchor="middle">костюм 2</text>
    <!-- cat pose B (legs crossed) -->
    <g transform="translate(80,92)">
      <ellipse cx="0" cy="0" rx="34" ry="24" fill="#ff9a3c" stroke="#e06f1e" stroke-width="3"/>
      <circle cx="26" cy="-14" r="18" fill="#ffb066" stroke="#e06f1e" stroke-width="3"/>
      <path d="M14 -26 l4 -14 l10 8 z" fill="#ffb066" stroke="#e06f1e" stroke-width="2"/>
      <path d="M34 -28 l6 -13 l7 11 z" fill="#ffb066" stroke="#e06f1e" stroke-width="2"/>
      <circle cx="24" cy="-16" r="2.6" fill="#3b2a1a"/><circle cx="33" cy="-16" r="2.6" fill="#3b2a1a"/>
      <path d="M-32 -4 q-24 -6 -18 -30" stroke="#e06f1e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g stroke="#e06f1e" stroke-width="6" stroke-linecap="round">
        <path d="M-14 22 l8 14"/><path d="M14 22 l-8 14"/>
      </g>
    </g>
  </g>

  <text x="290" y="276" font-size="13" fill="#16a34a" font-weight="700" text-anchor="middle">🐾 «следующий костюм» + «ждать 0.2» = живая походка</text>
</svg>
