<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/><stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="720" height="420" fill="#f5f7fb"/>
  <text x="24" y="36" font-size="23" font-weight="700" fill="#1f2937">🎭 Живой герой шагает лапами</text>
  <text x="24" y="60" font-size="14" fill="#64748b">Смена двух костюмов на ходу = перебор лап (без звука)</text>

  <!-- stage -->
  <rect x="24" y="80" width="470" height="300" rx="14" fill="url(#sky)" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="440" cy="128" r="24" fill="#ffe08a"/>
  <g fill="#fff" opacity="0.9"><ellipse cx="140" cy="140" rx="32" ry="15"/><ellipse cx="300" cy="118" rx="28" ry="13"/></g>
  <rect x="24" y="330" width="470" height="50" fill="#8fd16a"/>
  <rect x="24" y="330" width="470" height="9" fill="#79c057"/>

  <!-- walking cat: moves, legs toggle (costume swap) -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="80,300; 410,300; 80,300" keyTimes="0;0.5;1" dur="6s" repeatCount="indefinite"/>
    <!-- right-facing -->
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.98;1" dur="6s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="32" ry="22" fill="#ff9a3c" stroke="#e06f1e" stroke-width="3"/>
      <circle cx="24" cy="-13" r="17" fill="#ffb066" stroke="#e06f1e" stroke-width="3"/>
      <path d="M13 -24 l4 -13 l9 7 z" fill="#ffb066" stroke="#e06f1e" stroke-width="2"/>
      <path d="M31 -26 l6 -12 l6 10 z" fill="#ffb066" stroke="#e06f1e" stroke-width="2"/>
      <circle cx="22" cy="-15" r="2.4" fill="#3b2a1a"/><circle cx="30" cy="-15" r="2.4" fill="#3b2a1a"/>
      <path d="M-30 -4 q-22 -6 -16 -28" stroke="#e06f1e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g stroke="#e06f1e" stroke-width="6" stroke-linecap="round">
        <g><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.3s" repeatCount="indefinite"/>
          <path d="M-13 20 l-8 13"/><path d="M13 20 l8 13"/></g>
        <g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="0.3s" repeatCount="indefinite"/>
          <path d="M-13 20 l8 13"/><path d="M13 20 l-8 13"/></g>
      </g>
    </g>
    <!-- left-facing -->
    <g transform="scale(-1,1)">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.48;0.5;0.98;1" dur="6s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="32" ry="22" fill="#ff9a3c" stroke="#e06f1e" stroke-width="3"/>
      <circle cx="24" cy="-13" r="17" fill="#ffb066" stroke="#e06f1e" stroke-width="3"/>
      <path d="M13 -24 l4 -13 l9 7 z" fill="#ffb066" stroke="#e06f1e" stroke-width="2"/>
      <path d="M31 -26 l6 -12 l6 10 z" fill="#ffb066" stroke="#e06f1e" stroke-width="2"/>
      <circle cx="22" cy="-15" r="2.4" fill="#3b2a1a"/><circle cx="30" cy="-15" r="2.4" fill="#3b2a1a"/>
      <path d="M-30 -4 q-22 -6 -16 -28" stroke="#e06f1e" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g stroke="#e06f1e" stroke-width="6" stroke-linecap="round">
        <g><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.3s" repeatCount="indefinite"/>
          <path d="M-13 20 l-8 13"/><path d="M13 20 l8 13"/></g>
        <g><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="0.3s" repeatCount="indefinite"/>
          <path d="M-13 20 l8 13"/><path d="M13 20 l-8 13"/></g>
      </g>
    </g>
  </g>

  <!-- SCRIPT preview -->
  <g transform="translate(516,96)" font-size="12.5" font-weight="700" fill="#fff">
    <text x="0" y="-6" font-size="13" font-weight="700" fill="#475569">Скрипт ходьбы:</text>
    <path d="M0 2 q0 -8 8 -8 l48 0 q5 5 10 0 l56 0 q8 0 8 8 l0 16 l-130 0 z" fill="#f5b800"/>
    <text x="10" y="13" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="0" y="26" width="178" height="26" rx="6" fill="#ff8c1a"/><text x="10" y="43">всегда</text>
    <rect x="0" y="52" width="12" height="118" fill="#ff8c1a"/>
    <rect x="14" y="54" width="164" height="26" rx="6" fill="#4c97ff"/><text x="24" y="71">идти 5 шагов</text>
    <rect x="14" y="82" width="164" height="26" rx="6" fill="#9966ff"/><text x="24" y="99">следующий костюм</text>
    <rect x="14" y="110" width="164" height="26" rx="6" fill="#ff8c1a"/><text x="24" y="127">ждать 0.2 секунды</text>
    <rect x="14" y="138" width="164" height="26" rx="6" fill="#4c97ff"/><text x="24" y="155" font-size="11">если на краю, оттолкнуться</text>
    <rect x="0" y="170" width="178" height="12" rx="6" fill="#ff8c1a"/>
  </g>
</svg>
