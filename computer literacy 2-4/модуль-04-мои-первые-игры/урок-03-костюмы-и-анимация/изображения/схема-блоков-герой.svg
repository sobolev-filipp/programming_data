<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="20" font-weight="800" fill="#1f2937">🧩 Итоговая схема — «Живой герой» (без звука)</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Три скрипта. Цвет блока = раздел палитры.</text>

  <!-- SCRIPT 1 walk -->
  <text x="24" y="82" font-size="13" font-weight="700" fill="#334155">🐾 Ходьба (костюмы)</text>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <path d="M24 92 q0 -9 9 -9 l50 0 q5 5 10 0 l70 0 q9 0 9 9 l0 18 l-148 0 z" fill="#f5b800"/>
    <text x="33" y="106" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="24" y="110" width="216" height="26" rx="6" fill="#ff8c1a"/><text x="33" y="127">всегда</text>
    <rect x="24" y="136" width="12" height="118" fill="#ff8c1a"/>
    <rect x="38" y="138" width="202" height="26" rx="6" fill="#4c97ff"/><text x="47" y="155">идти 5 шагов</text>
    <rect x="38" y="166" width="202" height="26" rx="6" fill="#9966ff"/><text x="47" y="183">следующий костюм</text>
    <rect x="38" y="194" width="202" height="26" rx="6" fill="#ff8c1a"/><text x="47" y="211">ждать 0.2 секунды</text>
    <rect x="38" y="222" width="202" height="26" rx="6" fill="#4c97ff"/><text x="47" y="239" font-size="11">если на краю, оттолкнуться</text>
    <rect x="24" y="250" width="216" height="12" rx="6" fill="#ff8c1a"/>
  </g>

  <!-- SCRIPT 2 dress-up -->
  <text x="276" y="82" font-size="13" font-weight="700" fill="#334155">🎩 Переодевалка</text>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <path d="M276 92 q0 -9 9 -9 l64 0 q5 5 10 0 l78 0 q9 0 9 9 l0 18 l-170 0 z" fill="#f5b800"/>
    <text x="285" y="106" fill="#3d2f00">когда клавиша пробел нажата</text>
    <rect x="276" y="110" width="195" height="26" rx="6" fill="#9966ff"/><text x="285" y="127">следующий костюм</text>
  </g>
  <text x="276" y="156" font-size="11" fill="#16a34a" font-weight="700">⌨️ пробел → новый наряд</text>

  <!-- SCRIPT 3 emotions -->
  <text x="276" y="196" font-size="13" font-weight="700" fill="#334155">😃 Эмоции по клику</text>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <path d="M276 206 q0 -9 9 -9 l60 0 q5 5 10 0 l62 0 q9 0 9 9 l0 18 l-150 0 z" fill="#f5b800"/>
    <text x="285" y="220" fill="#3d2f00">когда этот спрайт нажат</text>
    <rect x="276" y="224" width="195" height="26" rx="6" fill="#9966ff"/><text x="285" y="241">следующий костюм</text>
    <rect x="276" y="252" width="195" height="26" rx="6" fill="#9966ff"/><text x="285" y="269" font-size="11">говорить «Ого!» 1 секунду</text>
  </g>

  <!-- legend -->
  <g font-size="12" font-weight="600" fill="#475569" transform="translate(520,96)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#334155">Цвета = разделы:</text>
    <rect x="0" y="12" width="16" height="16" rx="4" fill="#f5b800"/><text x="22" y="25">События</text>
    <rect x="0" y="34" width="16" height="16" rx="4" fill="#4c97ff"/><text x="22" y="47">Движение</text>
    <rect x="0" y="56" width="16" height="16" rx="4" fill="#9966ff"/><text x="22" y="69">Внешний вид</text>
    <rect x="0" y="78" width="16" height="16" rx="4" fill="#ff8c1a"/><text x="22" y="91">Управление</text>
  </g>
  <g transform="translate(520,200)" font-size="12" fill="#64748b">
    <text x="0" y="0" font-weight="700" fill="#334155">🔇 Без звука:</text>
    <text x="0" y="20">«голос» героя —</text>
    <text x="0" y="38">надпись «говорить»,</text>
    <text x="0" y="56">эмоции — костюмы-лица.</text>
  </g>

  <text x="24" y="330" font-size="12" fill="#94a3b8">💡 Анимация = «следующий костюм» + «ждать». ⚠️ Переодевалку НЕ клади в «всегда» — только по клавише.</text>
</svg>
