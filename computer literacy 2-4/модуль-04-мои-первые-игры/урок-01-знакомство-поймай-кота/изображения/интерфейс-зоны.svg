<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/><stop offset="1" stop-color="#e9f7ff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#eef2f8"/>
  <text x="24" y="34" font-size="22" font-weight="800" fill="#1f2937">🧭 Четыре зоны экрана Scratch</text>
  <text x="24" y="56" font-size="13" fill="#64748b">Блоки БЕРЁМ слева, СОБИРАЕМ в центре, смотрим результат на сцене справа.</text>

  <!-- program window -->
  <rect x="24" y="72" width="712" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- top bar -->
  <rect x="24" y="72" width="712" height="34" rx="12" fill="#5a4bd6"/>
  <rect x="24" y="92" width="712" height="14" fill="#5a4bd6"/>
  <circle cx="690" cy="89" r="9" fill="#22c55e"/><path d="M687 85 l0 8 M687 85 l7 2 l-7 2" stroke="#fff" stroke-width="2" fill="none"/>
  <circle cx="712" cy="89" r="9" fill="#ef4444"/><rect x="708" y="85" width="8" height="8" rx="2" fill="#fff"/>
  <text x="40" y="94" font-size="12" font-weight="700" fill="#fff">Scratch · 🚩 старт  ⏹ стоп</text>

  <!-- ===== 1. PALETTE (left) ===== -->
  <rect x="36" y="118" width="150" height="270" rx="8" fill="#f1f5fb" stroke="#dbe3ef"/>
  <circle cx="54" cy="138" r="7" fill="#4c97ff"/><text x="68" y="142" font-size="11" fill="#475569">Движение</text>
  <circle cx="54" cy="160" r="7" fill="#9966ff"/><text x="68" y="164" font-size="11" fill="#475569">Внешний вид</text>
  <circle cx="54" cy="182" r="7" fill="#cf63cf"/><text x="68" y="186" font-size="11" fill="#475569">Звук</text>
  <circle cx="54" cy="204" r="7" fill="#f5b800"/><text x="68" y="208" font-size="11" fill="#475569">События</text>
  <circle cx="54" cy="226" r="7" fill="#ff8c1a"/><text x="68" y="230" font-size="11" fill="#475569">Управление</text>
  <rect x="48" y="250" width="126" height="22" rx="5" fill="#4c97ff"/><text x="56" y="265" font-size="10" fill="#fff">идти 10 шагов</text>
  <rect x="48" y="278" width="126" height="22" rx="5" fill="#4c97ff"/><text x="56" y="293" font-size="10" fill="#fff">повернуть ↻ 15</text>
  <rect x="48" y="306" width="126" height="22" rx="5" fill="#9966ff"/><text x="56" y="321" font-size="10" fill="#fff">говорить Привет!</text>

  <!-- ===== 2. SCRIPTS (center) ===== -->
  <rect x="196" y="118" width="300" height="270" rx="8" fill="#fbfcfe" stroke="#dbe3ef"/>
  <g font-size="11" font-weight="700" fill="#fff">
    <path d="M230 150 q0 -9 9 -9 l48 0 q5 5 10 0 l70 0 q9 0 9 9 l0 16 l-146 0 z" fill="#f5b800"/>
    <text x="240" y="162" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="230" y="168" width="146" height="24" rx="5" fill="#ff8c1a"/><text x="240" y="184">всегда</text>
    <rect x="244" y="194" width="132" height="24" rx="5" fill="#4c97ff"/><text x="252" y="210">идти 5 шагов</text>
    <rect x="230" y="220" width="146" height="10" rx="5" fill="#ff8c1a"/>
  </g>
  <text x="346" y="376" font-size="11" fill="#94a3b8" text-anchor="middle">сюда перетаскиваем блоки</text>

  <!-- ===== 3. STAGE (top-right) ===== -->
  <rect x="506" y="118" width="218" height="150" rx="8" fill="url(#sky)" stroke="#cbd5e1"/>
  <circle cx="690" cy="148" r="16" fill="#ffe08a"/>
  <ellipse cx="560" cy="150" rx="22" ry="10" fill="#fff" opacity="0.9"/>
  <rect x="506" y="238" width="218" height="30" fill="#8fd16a"/>
  <!-- small cat -->
  <g transform="translate(600,228)">
    <ellipse cx="0" cy="0" rx="20" ry="14" fill="#ff9a3c" stroke="#e06f1e" stroke-width="2"/>
    <circle cx="15" cy="-9" r="11" fill="#ffb066" stroke="#e06f1e" stroke-width="2"/>
    <path d="M8 -17 l2 -9 l7 5 z" fill="#ffb066" stroke="#e06f1e" stroke-width="1.5"/>
    <path d="M20 -18 l4 -8 l4 7 z" fill="#ffb066" stroke="#e06f1e" stroke-width="1.5"/>
    <circle cx="13" cy="-10" r="1.8" fill="#3b2a1a"/><circle cx="19" cy="-10" r="1.8" fill="#3b2a1a"/>
    <path d="M-19 -2 q-14 -4 -10 -18" stroke="#e06f1e" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== 4. SPRITE LIST (bottom-right) ===== -->
  <rect x="506" y="276" width="218" height="112" rx="8" fill="#f1f5fb" stroke="#dbe3ef"/>
  <text x="516" y="294" font-size="11" font-weight="700" fill="#475569">Спрайты</text>
  <rect x="516" y="300" width="56" height="56" rx="8" fill="#fff" stroke="#4c97ff" stroke-width="2.5"/>
  <g transform="translate(544,330) scale(0.8)">
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#ff9a3c" stroke="#e06f1e" stroke-width="2"/>
    <circle cx="12" cy="-7" r="9" fill="#ffb066" stroke="#e06f1e" stroke-width="2"/>
  </g>
  <text x="544" y="372" font-size="10" fill="#475569" text-anchor="middle">Котик</text>
  <rect x="584" y="300" width="56" height="56" rx="8" fill="#fff" stroke="#dbe3ef"/>
  <text x="612" y="332" font-size="20" text-anchor="middle">🖼</text>
  <text x="612" y="372" font-size="10" fill="#475569" text-anchor="middle">Сцена</text>

  <!-- ===== numbered callouts ===== -->
  <g font-weight="800" font-size="13">
    <circle cx="48" cy="118" r="14" fill="#4c97ff"/><text x="48" y="123" fill="#fff" text-anchor="middle">1</text>
    <circle cx="208" cy="118" r="14" fill="#ff8c1a"/><text x="208" y="123" fill="#fff" text-anchor="middle">2</text>
    <circle cx="518" cy="118" r="14" fill="#22c55e"/><text x="518" y="123" fill="#fff" text-anchor="middle">3</text>
    <circle cx="518" cy="290" r="14" fill="#9966ff"/><text x="518" y="295" fill="#fff" text-anchor="middle">4</text>
  </g>

  <!-- legend row -->
  <g font-size="13" font-weight="600" fill="#334155">
    <circle cx="40" cy="430" r="12" fill="#4c97ff"/><text x="40" y="435" fill="#fff" text-anchor="middle" font-weight="800">1</text>
    <text x="60" y="435">🧱 Палитра блоков (слева)</text>
    <circle cx="300" cy="430" r="12" fill="#ff8c1a"/><text x="300" y="435" fill="#fff" text-anchor="middle" font-weight="800">2</text>
    <text x="320" y="435">🛠 Область скриптов (центр)</text>
    <circle cx="40" cy="456" r="12" fill="#22c55e"/><text x="40" y="461" fill="#fff" text-anchor="middle" font-weight="800">3</text>
    <text x="60" y="461">🎭 Сцена (справа вверху)</text>
    <circle cx="300" cy="456" r="12" fill="#9966ff"/><text x="300" y="461" fill="#fff" text-anchor="middle" font-weight="800">4</text>
    <text x="320" y="461">🐱 Список спрайтов (справа внизу)</text>
  </g>
</svg>
