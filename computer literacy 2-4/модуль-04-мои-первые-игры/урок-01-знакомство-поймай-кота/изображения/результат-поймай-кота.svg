<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/><stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="720" height="420" fill="#f5f7fb"/>
  <text x="24" y="36" font-size="24" font-weight="700" fill="#1f2937">🎮 Игра «Поймай кота!»</text>
  <text x="24" y="60" font-size="14" fill="#64748b">Кот телепортируется по сцене — лови его кликом мышки!</text>

  <!-- stage -->
  <rect x="24" y="78" width="672" height="314" rx="16" fill="url(#sky)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- green flag + score chip -->
  <g transform="translate(44,96)">
    <rect x="-6" y="-14" width="64" height="24" rx="8" fill="#fff" stroke="#22c55e" stroke-width="2"/>
    <path d="M2 -10 l0 16" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <path d="M4 -10 l14 4 l-14 4 z" fill="#22c55e"/>
    <text x="26" y="3" font-size="11" font-weight="700" fill="#16a34a">СТАРТ</text>
  </g>
  <g transform="translate(560,92)">
    <rect x="0" y="0" width="128" height="30" rx="12" fill="#ffd23f"/>
    <text x="64" y="21" font-size="15" font-weight="800" fill="#6b4e00" text-anchor="middle">🏆 Поймано: 3</text>
  </g>

  <!-- sparkle (follows cat, flashes on teleport) -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="150,300; 520,170; 300,350; 600,300; 150,300" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/>
    <g fill="#ffd23f" stroke="#ffb300" stroke-width="1">
      <animate attributeName="opacity" values="1;0.2;1;0.2;1;0.2;1;0.2;1" keyTimes="0;0.12;0.25;0.37;0.5;0.62;0.75;0.87;1" dur="4s" repeatCount="indefinite"/>
      <path d="M0 -34 l6 16 l16 -2 l-12 12 l4 16 l-14 -9 l-14 9 l4 -16 l-12 -12 l16 2 z"/>
    </g>
  </g>

  <!-- cat teleporting -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="150,300; 520,170; 300,350; 600,300; 150,300" keyTimes="0;0.25;0.5;0.75;1" calcMode="discrete" dur="4s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="30" ry="21" fill="#ff9a3c" stroke="#e06f1e" stroke-width="3"/>
    <circle cx="23" cy="-12" r="16" fill="#ffb066" stroke="#e06f1e" stroke-width="3"/>
    <path d="M12 -23 l4 -12 l9 7 z" fill="#ffb066" stroke="#e06f1e" stroke-width="2"/>
    <path d="M30 -25 l6 -11 l6 10 z" fill="#ffb066" stroke="#e06f1e" stroke-width="2"/>
    <circle cx="21" cy="-14" r="2.4" fill="#3b2a1a"/><circle cx="29" cy="-14" r="2.4" fill="#3b2a1a"/>
    <path d="M23 -7 q2 3 4 0" stroke="#3b2a1a" stroke-width="1.6" fill="none"/>
    <path d="M-28 -3 q-20 -6 -15 -26" stroke="#e06f1e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g stroke="#e06f1e" stroke-width="5" stroke-linecap="round"><path d="M-12 19 l-6 11"/><path d="M12 19 l6 11"/></g>
  </g>

  <!-- "Поймал!" bubble flashes when cat is at 3rd spot (~0.5-0.62) -->
  <g transform="translate(300,300)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.53;0.62;0.65;1" dur="4s" repeatCount="indefinite"/>
    <rect x="18" y="-18" width="92" height="30" rx="14" fill="#fff" stroke="#9966ff" stroke-width="2"/>
    <path d="M30 12 l-8 12 l20 -12 z" fill="#fff" stroke="#9966ff" stroke-width="2"/>
    <text x="64" y="2" font-size="15" font-weight="800" fill="#7a4fd6" text-anchor="middle">Поймал!</text>
  </g>

  <!-- mouse cursor -->
  <g transform="translate(360,250)">
    <path d="M0 0 l0 26 l6 -7 l5 11 l5 -2 l-5 -11 l9 0 z" fill="#1f2937" stroke="#fff" stroke-width="1.5"/>
  </g>
</svg>
