<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf7ff"/><stop offset="1" stop-color="#f6fbff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="720" height="420" fill="#f5f7fb"/>
  <text x="24" y="36" font-size="23" font-weight="700" fill="#1f2937">🖊 Котик-художник рисует квадрат</text>
  <text x="24" y="60" font-size="14" fill="#64748b">Опустил перо → идёт и поворачивает → получается фигура</text>

  <!-- stage -->
  <rect x="40" y="76" width="420" height="300" rx="14" fill="url(#sky)" stroke="#cbd5e1" stroke-width="2"/>

  <!-- drawn square trail (reveals) -->
  <path d="M150 140 L350 140 L350 320 L150 320 Z" fill="none" stroke="#ff5a8a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" pathLength="720" stroke-dasharray="720">
    <animate attributeName="stroke-dashoffset" values="720;0;0" keyTimes="0;0.85;1" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- cat moving along the square -->
  <g>
    <animateMotion dur="6s" repeatCount="indefinite" rotate="0"
      keyPoints="0;1;1" keyTimes="0;0.85;1" calcMode="linear"
      path="M150 140 L350 140 L350 320 L150 320 Z"/>
    <ellipse cx="0" cy="0" rx="20" ry="14" fill="#ff9a3c" stroke="#e06f1e" stroke-width="2.5"/>
    <circle cx="15" cy="-9" r="11" fill="#ffb066" stroke="#e06f1e" stroke-width="2.5"/>
    <path d="M8 -17 l2 -9 l7 5 z" fill="#ffb066" stroke="#e06f1e" stroke-width="1.5"/>
    <path d="M20 -18 l4 -8 l4 7 z" fill="#ffb066" stroke="#e06f1e" stroke-width="1.5"/>
    <circle cx="13" cy="-10" r="1.8" fill="#3b2a1a"/><circle cx="19" cy="-10" r="1.8" fill="#3b2a1a"/>
    <path d="M-19 -2 q-14 -4 -10 -18" stroke="#e06f1e" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- pencil -->
    <line x1="-2" y1="12" x2="-2" y2="26" stroke="#ffcf33" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-2" cy="27" r="2.5" fill="#ff5a8a"/>
  </g>

  <!-- ================ SCRIPT preview ================ -->
  <g transform="translate(486,92)" font-size="12.5" font-weight="700" fill="#fff">
    <text x="0" y="-6" font-size="13" font-weight="700" fill="#475569">Программа:</text>
    <path d="M0 2 q0 -8 8 -8 l48 0 q5 5 10 0 l56 0 q8 0 8 8 l0 16 l-130 0 z" fill="#f5b800"/>
    <text x="10" y="13" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="0" y="26" width="196" height="26" rx="6" fill="#0fbd8c"/><text x="10" y="43">очистить</text>
    <rect x="0" y="54" width="196" height="26" rx="6" fill="#0fbd8c"/><text x="10" y="71">опустить перо</text>
    <rect x="0" y="82" width="196" height="26" rx="6" fill="#ff8c1a"/><text x="10" y="99">повторить 4 раза</text>
    <rect x="0" y="108" width="12" height="62" fill="#ff8c1a"/>
    <rect x="14" y="110" width="182" height="26" rx="6" fill="#4c97ff"/><text x="24" y="127">идти 80 шагов</text>
    <rect x="14" y="138" width="182" height="26" rx="6" fill="#4c97ff"/><text x="24" y="155" font-size="12">повернуть ↻ 90 градусов</text>
    <rect x="0" y="170" width="196" height="12" rx="6" fill="#ff8c1a"/>
  </g>
</svg>
