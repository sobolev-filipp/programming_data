<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="640" height="380" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="20" font-weight="800" fill="#1f2937">🧩 Итоговая схема — «Котик рисует квадрат»</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Цвет блока = раздел палитры. Оба блока внутри «повторить»!</text>

  <!-- script -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <path d="M24 72 q0 -10 10 -10 l56 0 q6 6 12 0 l80 0 q10 0 10 10 l0 20 l-168 0 z" fill="#f5b800"/>
    <text x="34" y="87" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="24" y="92" width="226" height="28" rx="6" fill="#0fbd8c"/><text x="34" y="111">очистить</text>
    <rect x="24" y="122" width="226" height="28" rx="6" fill="#0fbd8c"/><text x="34" y="141">опустить перо</text>
    <rect x="24" y="152" width="226" height="28" rx="6" fill="#ff8c1a"/><text x="34" y="171">повторить 4 раза</text>
    <rect x="24" y="180" width="14" height="66" fill="#ff8c1a"/>
    <rect x="40" y="182" width="210" height="28" rx="6" fill="#4c97ff"/><text x="50" y="201">идти 80 шагов</text>
    <rect x="40" y="212" width="210" height="28" rx="6" fill="#4c97ff"/><text x="50" y="231" font-size="12">повернуть ↻ 90 градусов</text>
    <rect x="24" y="246" width="226" height="14" rx="6" fill="#ff8c1a"/>
  </g>
  <text x="24" y="292" font-size="12" fill="#16a34a" font-weight="700">▶ Котик рисует квадрат ⬜ цветным следом</text>

  <!-- result square preview -->
  <g transform="translate(330,86)">
    <rect x="0" y="0" width="180" height="150" rx="10" fill="#eaf7ff" stroke="#cbd5e1"/>
    <rect x="40" y="35" width="80" height="80" fill="none" stroke="#ff5a8a" stroke-width="5"/>
    <text x="90" y="138" font-size="11" fill="#64748b" text-anchor="middle">результат на сцене</text>
  </g>

  <!-- legend -->
  <g font-size="12" font-weight="600" fill="#475569" transform="translate(330,250)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#334155">Цвета = разделы:</text>
    <rect x="0" y="12" width="16" height="16" rx="4" fill="#f5b800"/><text x="22" y="25">События</text>
    <rect x="0" y="34" width="16" height="16" rx="4" fill="#4c97ff"/><text x="22" y="47">Движение</text>
    <rect x="0" y="56" width="16" height="16" rx="4" fill="#ff8c1a"/><text x="22" y="69">Управление</text>
    <rect x="130" y="12" width="16" height="16" rx="4" fill="#0fbd8c"/><text x="152" y="25">Перо</text>
  </g>

  <text x="24" y="330" font-size="12" fill="#94a3b8">💡 Угол = 360 ÷ число сторон: квадрат 90°, треугольник 120°, звезда 144°.</text>
  <text x="24" y="352" font-size="12" fill="#94a3b8">⚠️ «идти» и «повернуть» должны быть ВНУТРИ рамки «повторить», иначе выйдет одна линия.</text>
</svg>
