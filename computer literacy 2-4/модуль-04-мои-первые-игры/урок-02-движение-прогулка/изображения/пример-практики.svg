<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#f5f7fb"/>
  <text x="320" y="30" font-size="20" font-weight="800" fill="#1f2937" text-anchor="middle">🎨 Примерно что можно нарисовать пером — а рисунок у тебя СВОЙ!</text>
  <text x="320" y="52" font-size="13" fill="#64748b" text-anchor="middle">Все рисунки — из «повторить N [идти + повернуть]» и пера</text>

  <!-- panel 1: flower bed -->
  <g transform="translate(20,70)">
    <rect x="0" y="0" width="140" height="200" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="70" y="22" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">🌸 Клумба</text>
    <g transform="translate(45,80)" stroke="#ff5a8a" stroke-width="3" fill="none">
      <g><rect x="-10" y="-10" width="20" height="20"/><rect x="-10" y="-10" width="20" height="20" transform="rotate(30)"/><rect x="-10" y="-10" width="20" height="20" transform="rotate(60)"/></g>
    </g>
    <g transform="translate(95,120)" stroke="#9966ff" stroke-width="3" fill="none">
      <rect x="-9" y="-9" width="18" height="18"/><rect x="-9" y="-9" width="18" height="18" transform="rotate(30)"/><rect x="-9" y="-9" width="18" height="18" transform="rotate(60)"/>
    </g>
    <g transform="translate(60,150)" stroke="#ff8c1a" stroke-width="3" fill="none">
      <rect x="-8" y="-8" width="16" height="16"/><rect x="-8" y="-8" width="16" height="16" transform="rotate(45)"/>
    </g>
  </g>

  <!-- panel 2: house -->
  <g transform="translate(176,70)">
    <rect x="0" y="0" width="140" height="200" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="70" y="22" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">🏠 Домик</text>
    <g stroke="#4c97ff" stroke-width="4" fill="none" stroke-linejoin="round">
      <rect x="42" y="100" width="56" height="56"/>
      <path d="M36 100 l34 -34 l34 34"/>
    </g>
    <rect x="60" y="124" width="20" height="32" fill="none" stroke="#ff8c1a" stroke-width="3"/>
  </g>

  <!-- panel 3: letter -->
  <g transform="translate(332,70)">
    <rect x="0" y="0" width="140" height="200" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="70" y="22" font-size="13" font-weight="700" fill="#2f6fd0" text-anchor="middle">🔤 Твоя буква</text>
    <g stroke="#37c871" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48 150 l0 -70 l24 44 l24 -44 l0 70"/>
    </g>
    <text x="70" y="185" font-size="11" fill="#475569" text-anchor="middle">первая буква имени</text>
  </g>

  <!-- panel 4: stars -->
  <g transform="translate(488,70)">
    <rect x="0" y="0" width="132" height="200" rx="12" fill="#241546" stroke="#cbd5e1"/>
    <text x="66" y="22" font-size="13" font-weight="700" fill="#ffd23f" text-anchor="middle">⭐ Звёзды</text>
    <g stroke="#ffd23f" stroke-width="2.5" fill="none">
      <path d="M40 60 l10 26 l-26 -16 l32 0 l-26 16 z"/>
      <path d="M92 110 l8 20 l-20 -12 l24 0 l-20 12 z"/>
      <path d="M55 160 l9 22 l-22 -13 l26 0 l-22 13 z"/>
    </g>
    <text x="66" y="192" font-size="10" fill="#c9bdf0" text-anchor="middle">перо поднимай между ними</text>
  </g>
</svg>
