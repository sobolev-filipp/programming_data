<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="420" height="380" fill="#f7f9fc"/>
  <text x="210" y="34" font-size="19" font-weight="800" fill="#1f2937" text-anchor="middle">🧭 Направление в Scratch</text>
  <text x="210" y="56" font-size="13" fill="#64748b" text-anchor="middle">Блок «повернуться в направление …»</text>

  <!-- compass circle -->
  <circle cx="210" cy="210" r="120" fill="#eaf2ff" stroke="#4c97ff" stroke-width="3"/>
  <circle cx="210" cy="210" r="4" fill="#1f2937"/>

  <!-- arrows -->
  <g stroke="#ff8c1a" stroke-width="5" stroke-linecap="round" fill="#ff8c1a">
    <!-- up 0 -->
    <line x1="210" y1="210" x2="210" y2="110"/><path d="M210 98 l-8 16 l16 0 z"/>
    <!-- right 90 -->
    <line x1="210" y1="210" x2="310" y2="210"/><path d="M322 210 l-16 -8 l0 16 z"/>
    <!-- down 180 -->
    <line x1="210" y1="210" x2="210" y2="310"/><path d="M210 322 l-8 -16 l16 0 z"/>
    <!-- left -90 -->
    <line x1="210" y1="210" x2="110" y2="210"/><path d="M98 210 l16 -8 l0 16 z"/>
  </g>

  <!-- labels -->
  <g font-weight="800" font-size="16">
    <circle cx="210" cy="84" r="18" fill="#22c55e"/><text x="210" y="90" fill="#fff" text-anchor="middle">0</text>
    <circle cx="346" cy="210" r="18" fill="#4c97ff"/><text x="346" y="216" fill="#fff" text-anchor="middle">90</text>
    <circle cx="210" cy="340" r="20" fill="#9966ff"/><text x="210" y="346" fill="#fff" text-anchor="middle">180</text>
    <circle cx="70" cy="210" r="20" fill="#cf63cf"/><text x="70" y="216" fill="#fff" text-anchor="middle">-90</text>
  </g>
  <g font-size="13" font-weight="700" fill="#334155" text-anchor="middle">
    <text x="210" y="134">⬆️ вверх</text>
    <text x="276" y="196">➡️ вправо</text>
    <text x="210" y="296">⬇️ вниз</text>
    <text x="150" y="196">⬅️ влево</text>
  </g>

  <!-- cat in center facing right -->
  <g transform="translate(210,210)">
    <ellipse cx="0" cy="0" rx="18" ry="12" fill="#ff9a3c" stroke="#e06f1e" stroke-width="2"/>
    <circle cx="14" cy="-8" r="10" fill="#ffb066" stroke="#e06f1e" stroke-width="2"/>
    <path d="M8 -15 l2 -8 l6 5 z" fill="#ffb066" stroke="#e06f1e" stroke-width="1.5"/>
    <circle cx="12" cy="-9" r="1.6" fill="#3b2a1a"/><circle cx="17" cy="-9" r="1.6" fill="#3b2a1a"/>
  </g>
</svg>
