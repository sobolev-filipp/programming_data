<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра — Поверни и попади</title>
<style>
  :root{--ink:#1f2a52;--yellow:#ffd23f;--blue:#4c97ff;--green:#4cbb5c;--purple:#9966ff;--orange:#ff8c1a;--red:#ff6b6b;--pen:#0fbd8c;}
  *{box-sizing:border-box;font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;margin:0;padding:0;}
  body{min-height:100vh;background:linear-gradient(135deg,#4c97ff,#0fbd8c);display:flex;align-items:center;justify-content:center;padding:14px;color:var(--ink);}
  .wrap{width:min(760px,100%);background:#fff;border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.3);padding:18px 20px 22px;position:relative;overflow:hidden;}
  h1{text-align:center;color:#2f6fd0;font-size:27px;margin:2px 0;}
  .sub{text-align:center;color:#7a86a8;font-size:16px;margin-bottom:10px;}
  .hud{display:flex;justify-content:space-around;align-items:center;background:#eaf2ff;border-radius:16px;padding:8px 10px;font-size:19px;font-weight:bold;margin-bottom:10px;}
  .stage{position:relative;height:300px;background:radial-gradient(circle at 50% 52%, #eafff6, #d6f0ff);border-radius:16px;overflow:hidden;border:3px solid #cfe3ff;margin-bottom:10px;}
  .ring{position:absolute;border:2px dashed #b9cdeb;border-radius:50%;}
  #cat{position:absolute;font-size:40px;transform:translate(-50%,-50%);z-index:3;}
  #arrow{position:absolute;width:10px;z-index:2;transform-origin:50% 100%;}
  #arrow .shaft{width:6px;background:linear-gradient(#ff8c1a,#ffbe5c);border-radius:4px;margin:0 auto;}
  #arrow .head{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:16px solid #ff8c1a;margin:0 auto;}
  #target{position:absolute;font-size:34px;transform:translate(-50%,-50%);z-index:2;transition:left .25s, top .25s;}
  #trail{position:absolute;inset:0;z-index:1;}
  .controls{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:6px;flex-wrap:wrap;}
  .rot{background:var(--blue);color:#fff;border:none;border-radius:14px;font-size:26px;width:68px;height:52px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);}
  .rot:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .goBtn{background:var(--green);color:#fff;border:none;border-radius:14px;font-size:22px;font-weight:bold;padding:12px 30px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);}
  .goBtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .timebar{height:14px;background:#eee;border-radius:8px;overflow:hidden;margin-top:12px;}
  .timefill{height:100%;background:linear-gradient(90deg,var(--green),var(--yellow));width:100%;}
  .msg{text-align:center;font-size:19px;font-weight:bold;min-height:26px;margin-top:8px;color:var(--ink);}
  .start{background:var(--yellow);color:#6b4e00;border:none;border-radius:16px;padding:16px 30px;font-size:24px;font-weight:bold;cursor:pointer;display:block;margin:14px auto;}
  .hint{text-align:center;color:#9aa4bf;font-size:14px;margin-top:10px;}
  .stars{font-size:48px;text-align:center;letter-spacing:4px;}
  .stage.flash{animation:flash .4s;}
  @keyframes flash{0%,100%{filter:none}50%{filter:brightness(1.1) hue-rotate(-20deg);background:#ffd9d9}}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎯 Поверни и попади</h1>

  <div id="intro">
    <p class="sub">Поворачивай котика кнопками <b>↺ ↻</b>, целься стрелкой в рыбку 🐟 и жми <b>«Идти!»</b></p>
    <div class="stage" style="height:200px"><div id="cat0" style="position:absolute;left:50%;top:52%;font-size:40px;transform:translate(-50%,-50%)">🐱</div></div>
    <button class="start" onclick="startGame()">▶ Играть!</button>
    <p class="hint">Клавиши: ← → поворот, Пробел/Enter — «Идти!». Чем дальше раунд — тем точнее надо целиться!</p>
  </div>

  <div id="game" class="hidden">
    <div class="hud">
      <span>🏆 <b id="score">0</b></span>
      <span>Раунд <b id="round">1</b></span>
      <span id="lives">❤️❤️❤️</span>
    </div>
    <div class="stage" id="stage">
      <svg id="trail"></svg>
      <div id="target">🐟</div>
      <div id="arrow"><div class="head"></div><div class="shaft"></div></div>
      <div id="cat">🐱</div>
    </div>
    <div class="controls">
      <button class="rot" onclick="rotate(-15)">↺</button>
      <button class="goBtn" onclick="go()">Идти! 🐾</button>
      <button class="rot" onclick="rotate(15)">↻</button>
    </div>
    <div class="timebar"><div class="timefill" id="timefill"></div></div>
    <div class="msg" id="msg"></div>
  </div>

  <div id="over" class="hidden">
    <h1>Игра окончена! 🎉</h1>
    <div class="stars" id="stars"></div>
    <p class="sub" id="finalscore"></p>
    <p class="sub" id="praise"></p>
    <button class="start" onclick="location.reload()">↺ Ещё разок</button>
  </div>
</div>

<script>
let state='intro', score=0, round=1, lives=3;
let aim=90, target=90, remaining=0, roundTime=0, last=0, rafId=0;
const R=110;              // distance to target (px)
const ARROW_LEN=78;

function tol(){ return Math.max(8, 22 - round*1.3); }     // tolerance shrinks
function roundTimeMs(){ return Math.max(3600, 7000 - round*240); }
function angDiff(a,b){ return ((a-b+540)%360)-180; }      // -180..180

function center(){ const s=document.getElementById('stage'); return {x:s.clientWidth/2, y:s.clientHeight*0.52}; }

function startGame(){
  score=0; round=1; lives=3; aim=90;
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  updateHud();
  startRound();
  last=0; rafId=requestAnimationFrame(loop);
}
function updateHud(){
  document.getElementById('score').textContent=score;
  document.getElementById('round').textContent=round;
  document.getElementById('lives').textContent='❤️'.repeat(lives)+'🖤'.repeat(Math.max(0,3-lives));
}

function startRound(){
  state='aim';
  // place cat at center
  const c=center();
  const cat=document.getElementById('cat');
  cat.style.left=c.x+'px'; cat.style.top=c.y+'px';
  // random target direction, multiple of 15 so it's fair
  target=(Math.random()*24|0)*15;
  placeTarget();
  // random starting aim different from target
  aim=(Math.random()*24|0)*15;
  drawArrow();
  clearTrail();
  remaining=roundTimeMs(); roundTime=remaining; updateTime();
  document.getElementById('msg').textContent='Целься в рыбку 🐟 и жми «Идти!»';
}

function placeTarget(){
  const c=center();
  const rad=target*Math.PI/180;
  const x=c.x + R*Math.sin(rad);
  const y=c.y - R*Math.cos(rad);
  const t=document.getElementById('target');
  t.style.left=x+'px'; t.style.top=y+'px';
}

function drawArrow(){
  const c=center();
  const a=document.getElementById('arrow');
  a.style.height=ARROW_LEN+'px';
  a.querySelector('.shaft').style.height=(ARROW_LEN-16)+'px';
  a.style.left=(c.x-5)+'px';
  a.style.top=(c.y-ARROW_LEN)+'px';
  a.style.transform='rotate('+aim+'deg)';
}

function rotate(step){
  if(state!=='aim') return;
  aim=(aim+step+360)%360;
  drawArrow();
}

function clearTrail(){ document.getElementById('trail').innerHTML=''; }
function drawHitLine(){
  const c=center(); const rad=aim*Math.PI/180;
  const x2=c.x + R*Math.sin(rad), y2=c.y - R*Math.cos(rad);
  const svg=document.getElementById('trail');
  svg.innerHTML='<line x1="'+c.x+'" y1="'+c.y+'" x2="'+x2+'" y2="'+y2+'" stroke="#ff5a8a" stroke-width="5" stroke-linecap="round"/>';
}

function go(){
  if(state!=='aim') return;
  state='run';
  const diff=Math.abs(angDiff(aim,target));
  const cat=document.getElementById('cat');
  const c=center(); const rad=aim*Math.PI/180;
  // move cat along aim
  const x2=c.x + R*Math.sin(rad), y2=c.y - R*Math.cos(rad);
  cat.style.transition='left .5s, top .5s';
  cat.style.left=x2+'px'; cat.style.top=y2+'px';
  drawHitLine();
  if(diff<=tol()){
    const timeBonus=Math.round(remaining/1000)*2;
    const precision=Math.max(0, Math.round((tol()-diff)));
    const gained=10+timeBonus+precision;
    score+=gained; updateHud();
    document.getElementById('msg').textContent='🎯 Попал! +'+gained+(diff<4?' 🌟 Точно в цель!':'');
    round++;
    setTimeout(()=>{ cat.style.transition='none'; if(state!=='over') startRound(); }, 800);
  } else {
    document.getElementById('msg').textContent='Мимо! Крути стрелку точнее на рыбку 🔄';
    setTimeout(()=>{ cat.style.transition='none'; if(state!=='over'){ loseLife(); } }, 700);
  }
}

function loseLife(){
  lives--; updateHud();
  const st=document.getElementById('stage');
  st.classList.remove('flash'); void st.offsetWidth; st.classList.add('flash');
  if(lives<=0){ gameOver(); return; }
  startRound();
}

function updateTime(){
  const pct=roundTime>0?Math.max(0,remaining/roundTime*100):0;
  const f=document.getElementById('timefill'); if(f) f.style.width=pct+'%';
}

function loop(ts){
  if(state==='over') return;
  if(!last) last=ts;
  const dt=ts-last; last=ts;
  if(state==='aim'){
    remaining-=dt;
    if(remaining<=0){ remaining=0; updateTime(); document.getElementById('msg').textContent='⏰ Время вышло!'; state='run'; setTimeout(()=>{ if(state!=='over') loseLife(); }, 500); rafId=requestAnimationFrame(loop); return; }
    updateTime();
  }
  rafId=requestAnimationFrame(loop);
}

function gameOver(){
  state='over';
  document.getElementById('game').classList.add('hidden');
  document.getElementById('over').classList.remove('hidden');
  let stars = score>=150?5 : score>=100?4 : score>=60?3 : score>=30?2 : 1;
  document.getElementById('stars').textContent='⭐'.repeat(stars)+'☆'.repeat(5-stars);
  document.getElementById('finalscore').textContent='Очков: '+score+' · раундов пройдено: '+(round-1);
  document.getElementById('praise').textContent = score>=100?'Ты снайпер поворотов! 🏆' : score>=50?'Отлично целишься! 👏' : 'Молодец, тренируйся ещё! 💪';
}

document.addEventListener('keydown',e=>{
  if(state!=='aim') return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); rotate(-15); }
  if(e.key==='ArrowRight'){ e.preventDefault(); rotate(15); }
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); go(); }
});
window.addEventListener('resize',()=>{ if(state==='aim'){ placeTarget(); drawArrow(); } });
</script>
</body>
</html>
