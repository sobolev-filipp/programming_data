<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#f5f7fb"/>
  <text x="320" y="30" font-size="20" font-weight="800" fill="#1f2937" text-anchor="middle">🎮 Своя игра — собери всё, что умеешь!</text>
  <text x="320" y="52" font-size="13" fill="#64748b" text-anchor="middle">Клоны + переменные + управление + «если» — в одной своей игре</text>

  <!-- panel 1: own shooter -->
  <g transform="translate(20,70)">
    <rect x="0" y="0" width="195" height="200" rx="12" fill="#101a38"/>
    <text x="97" y="24" font-size="14" font-weight="700" fill="#9fd0ff" text-anchor="middle">🚀 Свой тир</text>
    <text x="60" y="80" font-size="22" text-anchor="middle">👾</text>
    <text x="130" y="70" font-size="22" text-anchor="middle">👾</text>
    <g fill="#ffe14d"><rect x="94" y="120" width="6" height="16" rx="3"/></g>
    <text x="97" y="170" font-size="24" text-anchor="middle">🛸</text>
    <text x="97" y="190" font-size="11" fill="#9fd0ff" text-anchor="middle">стреляй по своим врагам</text>
  </g>

  <!-- panel 2: collector -->
  <g transform="translate(228,70)">
    <rect x="0" y="0" width="185" height="200" rx="12" fill="#13344a"/>
    <text x="92" y="24" font-size="14" font-weight="700" fill="#aef3ff" text-anchor="middle">💎 Свой сборщик</text>
    <text x="55" y="80" font-size="22" text-anchor="middle">💎</text>
    <text x="125" y="95" font-size="22" text-anchor="middle">💎</text>
    <text x="92" y="150" font-size="26" text-anchor="middle">🤖</text>
    <rect x="30" y="165" width="124" height="22" rx="7" fill="#0c2436"/>
    <text x="92" y="181" font-size="12" font-weight="700" fill="#aef3ff" text-anchor="middle">очки растут</text>
  </g>

  <!-- panel 3: dodge -->
  <g transform="translate(426,70)">
    <rect x="0" y="0" width="194" height="200" rx="12" fill="#2a1430"/>
    <text x="97" y="24" font-size="14" font-weight="700" fill="#ffb3e6" text-anchor="middle">⚡ Своя уворачивалка</text>
    <text x="55" y="80" font-size="22" text-anchor="middle">⚡</text>
    <text x="130" y="70" font-size="22" text-anchor="middle">☄️</text>
    <text x="97" y="150" font-size="26" text-anchor="middle">🏃</text>
    <text x="97" y="186" font-size="11" fill="#ffb3e6" text-anchor="middle">уклоняйся, береги жизни</text>
  </g>
</svg>
