<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="560" height="240" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="18" font-weight="800" fill="#1f2937">👾 Доп-вау: астероид-босс</text>
  <text x="24" y="50" font-size="12.5" fill="#64748b">У босса переменная «здоровье». Попал пулей — минус единица. Здоровье 0 — разбит, +10 очков.</text>

  <!-- boss with health bar -->
  <g>
    <circle cx="90" cy="140" r="46" fill="#8a7458" stroke="#5f4d3a" stroke-width="3"/>
    <circle cx="74" cy="128" r="7" fill="#5f4d3a"/><circle cx="108" cy="150" r="6" fill="#5f4d3a"/><circle cx="96" cy="118" r="5" fill="#5f4d3a"/>
    <rect x="48" y="196" width="84" height="12" rx="6" fill="#e5e7eb"/>
    <rect x="48" y="196" width="50" height="12" rx="6" fill="#ff6b6b"/>
    <text x="90" y="226" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle">здоровье: 3</text>
  </g>

  <!-- blocks -->
  <g font-size="12" font-weight="700" fill="#ffffff">
    <rect x="170" y="70" width="366" height="22" rx="6" fill="#ff7a00"/><text x="178" y="85">задать здоровье = 5</text>

    <rect x="170" y="100" width="366" height="44" rx="6" fill="#ffab19"/>
    <text x="178" y="120" fill="#3d2f00">если касается Пуля →</text>
    <rect x="186" y="122" width="342" height="18" rx="4" fill="#ff7a00"/><text x="194" y="135" font-size="11">изменить здоровье на -1</text>

    <rect x="170" y="152" width="366" height="44" rx="6" fill="#ffab19"/>
    <text x="178" y="172" fill="#3d2f00">если здоровье = 0 →</text>
    <rect x="186" y="174" width="342" height="18" rx="4" fill="#ff7a00"/><text x="194" y="187" font-size="11">изменить очки на 10 · спрятаться</text>
  </g>
</svg>
