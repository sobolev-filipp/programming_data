<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="660" height="300" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="20" font-weight="800" fill="#1f2937">🔫 Стрельба клонами</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Пуля — это клон. Пробел создаёт клон у корабля, и он летит вверх.</text>

  <!-- stage with ship + bullets -->
  <g>
    <rect x="30" y="80" width="200" height="160" rx="12" fill="#101a38"/>
    <polygon points="130,210 146,236 114,236" fill="#4cc3ff"/>
    <g fill="#ffe14d">
      <rect x="127" y="150" width="6" height="16" rx="3"/>
      <rect x="127" y="110" width="6" height="16" rx="3"/>
    </g>
    <text x="130" y="100" font-size="20" text-anchor="middle">💥</text>
    <text x="130" y="256" font-size="11" fill="#9fb0d6" text-anchor="middle">пробел → пуля вверх</text>
  </g>

  <!-- arrow -->
  <path d="M242 160 L286 160" stroke="#ff8c1a" stroke-width="6" stroke-linecap="round"/>
  <path d="M286 160 l-16 -9 l0 18 z" fill="#ff8c1a"/>

  <!-- blocks -->
  <g font-size="12" font-weight="700" fill="#fff">
    <path d="M300 86 q0 -8 8 -8 l170 0 q5 5 10 0 l10 0 q8 0 8 8 l0 14 l-206 0 z" fill="#f5b800"/>
    <text x="308" y="99" fill="#3d2f00">когда клавиша «пробел» нажата</text>
    <rect x="300" y="100" width="206" height="24" rx="6" fill="#ff8c1a"/><text x="308" y="116">создать клон (сам себя)</text>

    <path d="M300 140 q0 -8 8 -8 l150 0 q5 5 10 0 l30 0 q8 0 8 8 l0 14 l-206 0 z" fill="#ff8c1a"/>
    <text x="308" y="153">когда я начинаю как клон</text>
    <rect x="300" y="154" width="206" height="22" rx="5" fill="#9966ff"/><text x="308" y="169">показаться · перейти к Корабль</text>
    <rect x="300" y="178" width="206" height="22" rx="5" fill="#ff8c1a"/><text x="308" y="193">повторить 20</text>
    <rect x="300" y="200" width="12" height="24" fill="#ff8c1a"/>
    <rect x="316" y="202" width="190" height="20" rx="4" fill="#4c97ff"/><text x="324" y="216" font-size="11">изменить y на 15</text>
    <rect x="300" y="226" width="206" height="22" rx="5" fill="#ff8c1a"/><text x="308" y="241">удалить этот клон</text>
  </g>

  <text x="24" y="284" font-size="12" fill="#94a3b8">💡 Один пробел — одна пуля-клон. Долетела доверху или попала — удаляется.</text>
</svg>
