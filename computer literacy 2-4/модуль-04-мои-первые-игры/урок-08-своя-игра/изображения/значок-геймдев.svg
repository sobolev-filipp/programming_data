<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 340" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%"><stop offset="0%" stop-color="#5aa0ff"/><stop offset="100%" stop-color="#2b5bd6"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe98a"/><stop offset="100%" stop-color="#f5a623"/></linearGradient>
  </defs>

  <!-- rays around the medal -->
  <g stroke="#ffd23f" stroke-width="6" stroke-linecap="round" opacity="0.55" transform="translate(0,-18)">
    <line x1="170" y1="16" x2="170" y2="40"/>
    <line x1="60" y1="60" x2="78" y2="78"/><line x1="280" y1="60" x2="262" y2="78"/>
    <line x1="30" y1="150" x2="54" y2="150"/><line x1="310" y1="150" x2="286" y2="150"/>
    <line x1="60" y1="240" x2="78" y2="222"/><line x1="280" y1="240" x2="262" y2="222"/>
  </g>

  <!-- medal -->
  <g transform="translate(0,-18)">
    <circle cx="170" cy="150" r="98" fill="url(#ring)"/>
    <circle cx="170" cy="150" r="82" fill="url(#bg)"/>
    <circle cx="170" cy="150" r="82" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/>
    <!-- gamepad -->
    <g transform="translate(170,150)">
      <rect x="-52" y="-20" width="104" height="48" rx="24" fill="#1f2a52"/>
      <circle cx="-30" cy="6" r="5.5" fill="#ffd23f"/>
      <rect x="-36" y="0" width="12" height="4" rx="2" fill="#ffd23f"/><rect x="-32" y="-4" width="4" height="12" rx="2" fill="#ffd23f"/>
      <circle cx="26" cy="-2" r="5.5" fill="#ff6b6b"/><circle cx="40" cy="10" r="5.5" fill="#4cbb5c"/>
    </g>
  </g>

  <!-- title below medal -->
  <text x="170" y="286" font-size="27" font-weight="800" fill="#2b2f52" text-anchor="middle">Юный геймдев 🎮</text>
  <text x="170" y="312" font-size="14" fill="#6b7196" text-anchor="middle">модуль «Мои первые игры»</text>
</svg>
