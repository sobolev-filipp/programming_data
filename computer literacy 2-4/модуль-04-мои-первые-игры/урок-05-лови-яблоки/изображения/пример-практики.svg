<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#f5f7fb"/>
  <text x="320" y="30" font-size="20" font-weight="800" fill="#1f2937" text-anchor="middle">🧺 Примеры своей ловилки — а игра у тебя своя!</text>
  <text x="320" y="52" font-size="13" fill="#64748b" text-anchor="middle">Герой ездит ←→, сверху падает добыча; промах — минус жизнь</text>

  <!-- panel 1: squirrel -->
  <g transform="translate(20,70)">
    <rect x="0" y="0" width="195" height="200" rx="12" fill="#f3f7e8" stroke="#cbd5e1"/>
    <text x="97" y="24" font-size="14" font-weight="700" fill="#7a5a2f" text-anchor="middle">🐿 Белка и орехи</text>
    <text x="70" y="80" font-size="24" text-anchor="middle">🌰</text>
    <text x="130" y="110" font-size="22" text-anchor="middle">🌰</text>
    <text x="97" y="150" font-size="34" text-anchor="middle">🐿</text>
    <text x="97" y="184" font-size="11" fill="#475569" text-anchor="middle">лови 🌰 · пропускай шишки</text>
  </g>

  <!-- panel 2: goalie -->
  <g transform="translate(228,70)">
    <rect x="0" y="0" width="185" height="200" rx="12" fill="#eafbe8" stroke="#cbd5e1"/>
    <text x="92" y="24" font-size="14" font-weight="700" fill="#2e9e52" text-anchor="middle">🧤 Вратарь</text>
    <text x="60" y="80" font-size="24" text-anchor="middle">⚽</text>
    <text x="120" y="110" font-size="22" text-anchor="middle">⚽</text>
    <text x="92" y="155" font-size="34" text-anchor="middle">🧤</text>
    <text x="92" y="184" font-size="11" fill="#475569" text-anchor="middle">лови мячи · не пропусти гол</text>
  </g>

  <!-- panel 3: cook -->
  <g transform="translate(426,70)">
    <rect x="0" y="0" width="194" height="200" rx="12" fill="#fff6e8" stroke="#cbd5e1"/>
    <text x="97" y="24" font-size="14" font-weight="700" fill="#b8860b" text-anchor="middle">👨‍🍳 Повар и яйца</text>
    <text x="65" y="80" font-size="24" text-anchor="middle">🥚</text>
    <text x="130" y="110" font-size="22" text-anchor="middle">🥚</text>
    <text x="97" y="155" font-size="34" text-anchor="middle">👨‍🍳</text>
    <text x="97" y="184" font-size="11" fill="#475569" text-anchor="middle">лови яйца · берегись камней</text>
  </g>
</svg>
