<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#f5f7fb"/>
  <text x="320" y="30" font-size="20" font-weight="800" fill="#1f2937" text-anchor="middle">🧬 Клоны — а проект у тебя свой!</text>
  <text x="320" y="52" font-size="13" fill="#64748b" text-anchor="middle">Один спрайт делает много живых копий: салют, звёзды, стайка</text>

  <!-- panel 1: salute -->
  <g transform="translate(20,70)">
    <rect x="0" y="0" width="195" height="200" rx="12" fill="#1e1b3a"/>
    <text x="97" y="24" font-size="14" font-weight="700" fill="#ffd23f" text-anchor="middle">🎆 Салют по клику</text>
    <circle cx="97" cy="110" r="4" fill="#fff"/>
    <g stroke="#ffd23f" stroke-width="3" stroke-linecap="round">
      <line x1="97" y1="110" x2="97" y2="72"/><line x1="97" y1="110" x2="135" y2="110"/>
      <line x1="97" y1="110" x2="59" y2="110"/><line x1="97" y1="110" x2="97" y2="148"/>
      <line x1="97" y1="110" x2="124" y2="83"/><line x1="97" y1="110" x2="70" y2="83"/>
      <line x1="97" y1="110" x2="124" y2="137"/><line x1="97" y1="110" x2="70" y2="137"/>
    </g>
    <g fill="#ff7ab6"><circle cx="97" cy="70" r="4"/><circle cx="137" cy="110" r="4"/><circle cx="57" cy="110" r="4"/><circle cx="97" cy="150" r="4"/></g>
    <text x="97" y="186" font-size="11" fill="#cbd5e1" text-anchor="middle">искры-клоны летят врозь</text>
  </g>

  <!-- panel 2: starfield -->
  <g transform="translate(228,70)">
    <rect x="0" y="0" width="185" height="200" rx="12" fill="#10204a"/>
    <text x="92" y="24" font-size="14" font-weight="700" fill="#9fd0ff" text-anchor="middle">⭐ Звёздное небо</text>
    <g fill="#ffd23f">
      <text x="30" y="60" font-size="16" text-anchor="middle">✦</text><text x="150" y="70" font-size="12" text-anchor="middle">✦</text>
      <text x="80" y="90" font-size="20" text-anchor="middle">✦</text><text x="120" y="120" font-size="14" text-anchor="middle">✦</text>
      <text x="45" y="130" font-size="12" text-anchor="middle">✦</text><text x="160" y="140" font-size="18" text-anchor="middle">✦</text>
      <text x="95" y="155" font-size="13" text-anchor="middle">✦</text><text x="30" y="165" font-size="16" text-anchor="middle">✦</text>
    </g>
    <text x="92" y="186" font-size="11" fill="#9fd0ff" text-anchor="middle">клоны по всему небу</text>
  </g>

  <!-- panel 3: fish swarm -->
  <g transform="translate(426,70)">
    <rect x="0" y="0" width="194" height="200" rx="12" fill="#12506b"/>
    <text x="97" y="24" font-size="14" font-weight="700" fill="#aef3ff" text-anchor="middle">🐟 Стайка рыбок</text>
    <g font-size="20">
      <text x="45" y="70" text-anchor="middle">🐟</text><text x="110" y="65" text-anchor="middle">🐟</text>
      <text x="150" y="95" text-anchor="middle">🐟</text><text x="70" y="105" text-anchor="middle">🐟</text>
      <text x="120" y="130" text-anchor="middle">🐟</text><text x="55" y="140" text-anchor="middle">🐟</text>
      <text x="150" y="150" text-anchor="middle">🐟</text>
    </g>
    <text x="97" y="186" font-size="11" fill="#aef3ff" text-anchor="middle">много клонов плывут</text>
  </g>
</svg>
