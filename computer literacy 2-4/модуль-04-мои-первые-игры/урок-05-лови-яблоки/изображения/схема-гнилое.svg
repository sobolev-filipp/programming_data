<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="640" height="260" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="19" font-weight="800" fill="#1f2937">🟢 Доп-вау — «Берегись гнилого!» (лови нужное)</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Гнилое яблоко падает тоже. Поймал его — минус жизнь; пропустил — всё хорошо.</text>

  <g font-size="12" font-weight="700" fill="#ffffff">
    <path d="M24 72 q0 -9 9 -9 l50 0 q5 5 10 0 l56 0 q9 0 9 9 l0 16 l-134 0 z" fill="#f5b800"/>
    <text x="33" y="85" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="24" y="88" width="420" height="24" rx="6" fill="#4c97ff"/><text x="32" y="104" font-size="11">перейти наверх (случайный x) — как яблоко</text>
    <rect x="24" y="112" width="420" height="24" rx="6" fill="#ff8c1a"/><text x="32" y="128">всегда</text>
    <rect x="24" y="136" width="12" height="96" fill="#ff8c1a"/>
    <rect x="38" y="138" width="406" height="22" rx="5" fill="#4c97ff"/><text x="46" y="153" font-size="11">изменить y на -6</text>
    <rect x="38" y="162" width="406" height="68" rx="6" fill="#ffab19"/>
    <text x="46" y="178" font-size="11">если &lt;касается (Bowl)?&gt; то  ← поймал ГНИЛОЕ</text>
    <rect x="52" y="184" width="384" height="18" rx="4" fill="#9966ff"/><text x="58" y="197" font-size="10">говорить «Фу!» · изменить жизни на -1 · наверх</text>
    <text x="46" y="220" font-size="11">иначе: если упало вниз → просто наверх (не наказываем)</text>
  </g>

  <text x="24" y="250" font-size="12" fill="#16a34a" font-weight="700">👆 Лови спелые 🍎, пропускай гнилые 🟢 — у гнилого развилка НАОБОРОТ!</text>
</svg>
