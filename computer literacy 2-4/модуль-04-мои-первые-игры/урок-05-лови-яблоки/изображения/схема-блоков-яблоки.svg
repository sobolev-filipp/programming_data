<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="720" height="400" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="20" font-weight="800" fill="#1f2937">🧩 Итоговая схема — игра «Лови яблоки»</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Корзина ездит ←→, яблоко падает и решает «поймал / промах».</text>

  <!-- basket scripts -->
  <text x="24" y="80" font-size="13" font-weight="700" fill="#334155">🧺 Корзина — управление</text>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <path d="M24 90 q0 -9 9 -9 l64 0 q5 5 10 0 l20 0 q9 0 9 9 l0 16 l-112 0 z" fill="#f5b800"/>
    <text x="33" y="103" fill="#3d2f00">когда → нажата</text>
    <rect x="24" y="106" width="136" height="24" rx="6" fill="#4c97ff"/><text x="32" y="122">изменить x на 20</text>
    <path d="M180 90 q0 -9 9 -9 l64 0 q5 5 10 0 l20 0 q9 0 9 9 l0 16 l-112 0 z" fill="#f5b800"/>
    <text x="189" y="103" fill="#3d2f00">когда ← нажата</text>
    <rect x="180" y="106" width="136" height="24" rx="6" fill="#4c97ff"/><text x="188" y="122">изменить x на -20</text>
  </g>

  <!-- apple script -->
  <text x="370" y="80" font-size="13" font-weight="700" fill="#334155">🍎 Яблоко — падение и выбор</text>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <path d="M370 90 q0 -9 9 -9 l50 0 q5 5 10 0 l56 0 q9 0 9 9 l0 16 l-134 0 z" fill="#f5b800"/>
    <text x="379" y="103" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="370" y="106" width="300" height="24" rx="6" fill="#ff7a00"/><text x="378" y="122">задать жизни = 3</text>
    <rect x="370" y="130" width="300" height="24" rx="6" fill="#4c97ff"/><text x="378" y="146" font-size="11">перейти наверх (случайный x)</text>
    <rect x="370" y="154" width="300" height="24" rx="6" fill="#ff8c1a"/><text x="378" y="170">всегда</text>
    <rect x="370" y="178" width="12" height="178" fill="#ff8c1a"/>
    <rect x="384" y="180" width="286" height="22" rx="5" fill="#4c97ff"/><text x="392" y="195" font-size="11">изменить y на -6</text>
    <!-- if-else -->
    <rect x="384" y="204" width="286" height="92" rx="6" fill="#ffab19"/>
    <text x="392" y="220" font-size="11">если &lt;касается (Bowl)?&gt; то</text>
    <rect x="398" y="226" width="258" height="18" rx="4" fill="#9966ff"/><text x="404" y="239" font-size="10">говорить «Ням!» · перейти наверх</text>
    <text x="392" y="260" font-size="11">иначе</text>
    <rect x="398" y="266" width="258" height="24" rx="4" fill="#4c97ff"/><text x="404" y="282" font-size="9.5">если y&lt;-160 → «Эх!» · жизни −1 · наверх</text>
    <!-- game over -->
    <rect x="384" y="300" width="286" height="24" rx="6" fill="#ff7a00"/><text x="392" y="316" font-size="10.5">если жизни = 0 → говорить «Конец!» · стоп</text>
    <rect x="370" y="326" width="300" height="12" rx="6" fill="#ff8c1a"/>
  </g>

  <!-- legend -->
  <g font-size="11.5" font-weight="600" fill="#475569" transform="translate(24,150)">
    <text x="0" y="0" font-weight="700" fill="#334155">Цвета:</text>
    <rect x="0" y="10" width="14" height="14" rx="3" fill="#f5b800"/><text x="19" y="21">События</text>
    <rect x="0" y="30" width="14" height="14" rx="3" fill="#4c97ff"/><text x="19" y="41">Движение</text>
    <rect x="0" y="50" width="14" height="14" rx="3" fill="#ff8c1a"/><text x="19" y="61">Управление</text>
    <rect x="0" y="70" width="14" height="14" rx="3" fill="#ffab19"/><text x="19" y="81">если…иначе</text>
    <rect x="0" y="90" width="14" height="14" rx="3" fill="#9966ff"/><text x="19" y="101">Внешний вид</text>
    <rect x="0" y="110" width="14" height="14" rx="3" fill="#ff7a00"/><text x="19" y="121">Переменные</text>
  </g>

  <text x="24" y="376" font-size="12" fill="#94a3b8">💡 «если … иначе» = выбор: поймал → +яблоко, иначе промах → −жизнь. ⚠️ Возвращай яблоко наверх! 🔇 Надписью.</text>
</svg>
