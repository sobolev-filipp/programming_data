<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="780" height="470" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="20" font-weight="800" fill="#1f2937">🧩 Схема блоков — игра «Лови яблоки» на клонах</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Завод штампует клоны; каждый клон падает и решает «поймал / промах». Корзина ездит ←→.</text>

  <!-- basket -->
  <text x="24" y="84" font-size="13" font-weight="700" fill="#334155">🧺 Корзина — управление</text>
  <g font-size="11.5" font-weight="700" fill="#ffffff">
    <path d="M24 94 q0 -9 9 -9 l58 0 q5 5 10 0 l18 0 q9 0 9 9 l0 15 l-104 0 z" fill="#f5b800"/>
    <text x="32" y="107" fill="#3d2f00">когда → нажата</text>
    <rect x="24" y="109" width="128" height="22" rx="6" fill="#4c97ff"/><text x="32" y="124">изменить x на 20</text>
    <path d="M24 139 q0 -9 9 -9 l58 0 q5 5 10 0 l18 0 q9 0 9 9 l0 15 l-104 0 z" fill="#f5b800"/>
    <text x="32" y="152" fill="#3d2f00">когда ← нажата</text>
    <rect x="24" y="154" width="128" height="22" rx="6" fill="#4c97ff"/><text x="32" y="169">изменить x на -20</text>
  </g>

  <!-- factory -->
  <text x="24" y="214" font-size="13" font-weight="700" fill="#334155">🍎 Яблоко-завод — штампует клоны</text>
  <g font-size="11.5" font-weight="700" fill="#ffffff">
    <path d="M24 224 q0 -9 9 -9 l52 0 q5 5 10 0 l54 0 q9 0 9 9 l0 15 l-134 0 z" fill="#f5b800"/>
    <text x="32" y="237" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="24" y="239" width="214" height="22" rx="6" fill="#ff7a00"/><text x="32" y="254">задать жизни = 3</text>
    <rect x="24" y="263" width="214" height="22" rx="6" fill="#9966ff"/><text x="32" y="278">скрыться</text>
    <rect x="24" y="287" width="214" height="22" rx="6" fill="#ff8c1a"/><text x="32" y="302">всегда</text>
    <rect x="24" y="309" width="12" height="52" fill="#ff8c1a"/>
    <rect x="40" y="311" width="198" height="22" rx="5" fill="#ff8c1a"/><text x="48" y="326">создать клон (сам себя)</text>
    <rect x="40" y="335" width="198" height="22" rx="5" fill="#ff8c1a"/><text x="48" y="350">ждать 1 сек</text>
    <rect x="24" y="361" width="214" height="10" rx="5" fill="#ff8c1a"/>
  </g>

  <!-- clone behaviour -->
  <text x="300" y="84" font-size="13" font-weight="700" fill="#334155">🍏 Клон яблока — падение и выбор</text>
  <g font-size="11.5" font-weight="700" fill="#ffffff">
    <path d="M300 94 q0 -9 9 -9 l150 0 q5 5 10 0 l20 0 q9 0 9 9 l0 15 l-198 0 z" fill="#ff8c1a"/>
    <text x="308" y="107">когда я начинаю как клон</text>
    <rect x="300" y="109" width="456" height="22" rx="6" fill="#9966ff"/><text x="308" y="124">показаться</text>
    <rect x="300" y="133" width="456" height="22" rx="6" fill="#4c97ff"/><text x="308" y="148">перейти в x:(случайное -220..220) y:170</text>
    <rect x="300" y="157" width="456" height="22" rx="6" fill="#ff8c1a"/><text x="308" y="172">всегда</text>
    <rect x="300" y="179" width="12" height="258" fill="#ff8c1a"/>
    <rect x="314" y="181" width="442" height="22" rx="5" fill="#4c97ff"/><text x="322" y="196">изменить y на -6</text>
    <!-- if-else -->
    <rect x="314" y="205" width="442" height="128" rx="6" fill="#ffab19"/>
    <text x="322" y="221" fill="#3d2f00">если &lt;касается (Bowl)?&gt; то</text>
    <rect x="330" y="227" width="418" height="20" rx="4" fill="#9966ff"/><text x="338" y="241" font-size="11">говорить «Ням!» 0.2</text>
    <rect x="330" y="249" width="418" height="20" rx="4" fill="#ff8c1a"/><text x="338" y="263" font-size="11">удалить этот клон</text>
    <text x="322" y="285" fill="#3d2f00">иначе</text>
    <rect x="330" y="291" width="418" height="36" rx="4" fill="#4c97ff"/>
    <text x="338" y="305" font-size="10.5">если y&lt;-160 то: «Эх!» · изменить жизни на -1 ·</text>
    <text x="338" y="320" font-size="10.5">удалить этот клон</text>
    <!-- game over -->
    <rect x="314" y="337" width="442" height="22" rx="5" fill="#ff7a00"/><text x="322" y="352" font-size="11">если жизни = 0 → остановить всё</text>
    <rect x="300" y="363" width="456" height="10" rx="5" fill="#ff8c1a"/>
  </g>

  <!-- legend -->
  <g font-size="11.5" font-weight="600" fill="#475569" transform="translate(24,392)">
    <text x="0" y="0" font-weight="700" fill="#334155">Цвета блоков:</text>
    <rect x="0" y="10" width="13" height="13" rx="3" fill="#f5b800"/><text x="18" y="21">События</text>
    <rect x="96" y="10" width="13" height="13" rx="3" fill="#4c97ff"/><text x="114" y="21">Движение</text>
    <rect x="196" y="10" width="13" height="13" rx="3" fill="#ff8c1a"/><text x="214" y="21">Управление / клоны</text>
    <rect x="0" y="32" width="13" height="13" rx="3" fill="#ffab19"/><text x="18" y="43">если…иначе</text>
    <rect x="96" y="32" width="13" height="13" rx="3" fill="#9966ff"/><text x="114" y="43">Внешний вид</text>
    <rect x="196" y="32" width="13" height="13" rx="3" fill="#ff7a00"/><text x="214" y="43">Переменные</text>
  </g>

  <text x="24" y="458" font-size="12" fill="#94a3b8">💡 Завод: скрыться + всегда [создать клон]. Клон: падает → поймал → удалиться / промах → −жизнь. ⚠️ Удаляй клон! 🔇 Надписью.</text>
</svg>
