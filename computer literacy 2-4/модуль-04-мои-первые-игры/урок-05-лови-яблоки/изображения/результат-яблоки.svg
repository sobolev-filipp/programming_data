<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe3ff"/><stop offset="1" stop-color="#eaf7df"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="720" height="420" fill="#f5f7fb"/>
  <text x="24" y="36" font-size="24" font-weight="700" fill="#1f2937">🍎 Игра «Лови яблоки»</text>
  <text x="24" y="60" font-size="14" fill="#64748b">Лови спелые яблоки корзиной (стрелки ←→), промах — минус жизнь!</text>

  <!-- field -->
  <rect x="24" y="78" width="470" height="314" rx="16" fill="url(#sky2)" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="24" y="360" width="470" height="32" fill="#8fd16a"/>

  <!-- lives chip -->
  <g transform="translate(360,92)">
    <rect x="0" y="0" width="120" height="30" rx="12" fill="#ff7a7a"/>
    <text x="60" y="21" font-size="15" font-weight="800" fill="#fff" text-anchor="middle">❤️ жизни: 3</text>
  </g>

  <!-- falling apples -->
  <g font-size="30">
    <text x="130" y="0" text-anchor="middle">🍎<animate attributeName="y" values="110;360" dur="2.2s" repeatCount="indefinite"/></text>
    <text x="300" y="0" text-anchor="middle">🍎<animate attributeName="y" values="90;360" dur="2.8s" repeatCount="indefinite"/></text>
    <text x="400" y="0" text-anchor="middle">🟢<animate attributeName="y" values="120;360" dur="2.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- basket catches (slides a bit) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="110,348; 300,348; 180,348; 110,348" keyTimes="0;0.4;0.75;1" dur="2.8s" repeatCount="indefinite"/>
    <text x="0" y="0" font-size="40" text-anchor="middle">🧺</text>
  </g>

  <!-- Ням! bubble flashes -->
  <g transform="translate(300,300)">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.42;0.5;0.55" dur="2.8s" repeatCount="indefinite"/>
    <rect x="14" y="-16" width="70" height="28" rx="13" fill="#fff" stroke="#4cbb5c" stroke-width="2"/>
    <text x="49" y="3" font-size="14" font-weight="800" fill="#16a34a" text-anchor="middle">Ням!</text>
  </g>

  <!-- arrow hint -->
  <g transform="translate(40,330)" fill="#fff" font-size="13" font-weight="800">
    <rect x="0" y="0" width="18" height="16" rx="4" fill="#3a4b8b"/><text x="9" y="13" text-anchor="middle">←</text>
    <rect x="22" y="0" width="18" height="16" rx="4" fill="#3a4b8b"/><text x="31" y="13" text-anchor="middle">→</text>
  </g>

  <!-- SCRIPT preview -->
  <g transform="translate(516,96)" font-size="12.5" font-weight="700" fill="#fff">
    <text x="0" y="-6" font-size="13" font-weight="700" fill="#475569">Скрипт яблока:</text>
    <rect x="0" y="0" width="182" height="24" rx="6" fill="#ff8c1a"/><text x="8" y="16">всегда</text>
    <rect x="0" y="24" width="12" height="130" fill="#ff8c1a"/>
    <rect x="14" y="26" width="168" height="24" rx="6" fill="#4c97ff"/><text x="22" y="42">изменить y на -6</text>
    <rect x="14" y="52" width="168" height="76" rx="6" fill="#ffab19"/>
    <text x="22" y="68" font-size="11">если касается корзины</text>
    <rect x="20" y="74" width="156" height="18" rx="4" fill="#9966ff"/><text x="26" y="87" font-size="10">Ням! · наверх</text>
    <text x="22" y="106" font-size="11">иначе (упало)</text>
    <rect x="20" y="110" width="156" height="16" rx="4" fill="#ff7a00"/><text x="26" y="122" font-size="9">жизни −1 · наверх</text>
    <rect x="14" y="130" width="168" height="22" rx="6" fill="#ff7a00"/><text x="22" y="145" font-size="10">если жизни=0 → стоп</text>
    <rect x="0" y="154" width="182" height="12" rx="6" fill="#ff8c1a"/>
  </g>
</svg>
