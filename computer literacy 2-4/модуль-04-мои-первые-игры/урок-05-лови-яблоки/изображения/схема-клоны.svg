<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="660" height="320" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="20" font-weight="800" fill="#1f2937">🧬 Клоны — один спрайт делает много копий</text>
  <text x="24" y="52" font-size="13" fill="#64748b">«создать клон себя» = живая копия. Каждый клон живёт и падает сам.</text>

  <!-- original -->
  <g>
    <rect x="30" y="86" width="150" height="150" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <text x="105" y="112" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">1 спрайт-оригинал</text>
    <text x="105" y="170" font-size="54" text-anchor="middle">🍎</text>
    <rect x="44" y="196" width="122" height="26" rx="7" fill="#ff8c1a"/>
    <text x="105" y="214" font-size="11.5" font-weight="700" fill="#fff" text-anchor="middle">создать клон (себя)</text>
  </g>

  <!-- arrow -->
  <g>
    <path d="M190 160 L250 160" stroke="#ff8c1a" stroke-width="6" stroke-linecap="round"/>
    <path d="M250 160 l-16 -9 l0 18 z" fill="#ff8c1a"/>
    <text x="220" y="146" font-size="12" font-weight="700" fill="#ff8c1a" text-anchor="middle">штампует</text>
  </g>

  <!-- clones cloud -->
  <g>
    <rect x="262" y="86" width="372" height="150" rx="16" fill="#eef5ff" stroke="#bcd3ff"/>
    <text x="448" y="108" font-size="13" font-weight="700" fill="#2b5bd6" text-anchor="middle">много клонов — каждый падает сам</text>
    <text x="300" y="150" font-size="30" text-anchor="middle">🍎</text>
    <text x="350" y="138" font-size="30" text-anchor="middle">🍎</text>
    <text x="400" y="156" font-size="30" text-anchor="middle">🍎</text>
    <text x="452" y="140" font-size="30" text-anchor="middle">🍎</text>
    <text x="504" y="158" font-size="30" text-anchor="middle">🍎</text>
    <text x="556" y="142" font-size="30" text-anchor="middle">🍎</text>
    <text x="604" y="156" font-size="30" text-anchor="middle">🍎</text>
    <text x="326" y="196" font-size="30" text-anchor="middle">🍎</text>
    <text x="388" y="206" font-size="30" text-anchor="middle">🍎</text>
    <text x="462" y="200" font-size="30" text-anchor="middle">🍎</text>
    <text x="536" y="204" font-size="30" text-anchor="middle">🍎</text>
    <text x="596" y="200" font-size="30" text-anchor="middle">🍎</text>
  </g>

  <!-- three clone blocks -->
  <g font-size="12" font-weight="700" fill="#fff">
    <text x="24" y="266" font-size="13" font-weight="700" fill="#334155">Три блока клонов (раздел «Управление» 🟧):</text>
    <rect x="24" y="276" width="180" height="26" rx="7" fill="#ff8c1a"/><text x="114" y="294" text-anchor="middle">создать клон (сам себя)</text>
    <path d="M222 276 q0 -0 0 0 l188 0 l0 26 l-188 0 z" fill="#ff8c1a"/>
    <path d="M222 276 q0 -8 8 -8 l60 0 q5 5 10 0 l102 0 q8 0 8 8 l0 26 l-188 0 z" fill="#ff8c1a"/>
    <text x="316" y="294" text-anchor="middle">когда я начинаю как клон</text>
    <rect x="428" y="276" width="180" height="26" rx="7" fill="#ff8c1a"/><text x="518" y="294" text-anchor="middle">удалить этот клон</text>
  </g>
</svg>
