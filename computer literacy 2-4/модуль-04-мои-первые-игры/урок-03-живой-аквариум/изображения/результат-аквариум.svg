<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#4aa3e0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="720" height="420" fill="#f5f7fb"/>
  <text x="24" y="36" font-size="24" font-weight="700" fill="#1f2937">🐠 Игра «Живой аквариум»</text>
  <text x="24" y="60" font-size="14" fill="#64748b">Рыбки машут плавниками, акула крадётся за твоей мышкой!</text>

  <!-- tank -->
  <rect x="24" y="78" width="470" height="314" rx="16" fill="url(#water)" stroke="#2b86c5" stroke-width="3"/>
  <rect x="24" y="356" width="470" height="36" rx="0" fill="#e8d8a0"/>
  <g fill="#3fa34d"><path d="M70 356 q6 -30 14 0 M90 356 q5 -22 10 0 M420 356 q6 -26 12 0"/></g>

  <!-- bubbles rising -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="150" cy="340" r="5"><animate attributeName="cy" values="340;100" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="340" r="3"><animate attributeName="cy" values="350;110" dur="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="340" r="4"><animate attributeName="cy" values="345;120" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0" dur="4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- FISH 1 (swims + flaps tail) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="80,150; 360,150; 80,150" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite"/>
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.48;0.5;0.98;1" dur="7s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="0" rx="26" ry="16" fill="#ff8c42"/>
      <circle cx="16" cy="-4" r="3" fill="#1f2937"/>
      <g fill="#ff6f1f"><path d="M-24 0 l-18 -12 l0 24 z"><animate attributeName="d" values="M-24 0 l-18 -12 l0 24 z;M-24 0 l-18 -6 l0 12 z;M-24 0 l-18 -12 l0 24 z" dur="0.4s" repeatCount="indefinite"/></path></g>
      <path d="M-2 -16 q10 -10 18 -4" stroke="#ff6f1f" stroke-width="4" fill="none"/>
    </g>
  </g>

  <!-- FISH 2 (smaller, other speed) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="420,260; 120,260; 420,260" keyTimes="0;0.5;1" dur="9s" repeatCount="indefinite"/>
    <g transform="scale(-0.8,0.8)">
      <ellipse cx="0" cy="0" rx="26" ry="16" fill="#ffd23f"/>
      <circle cx="16" cy="-4" r="3" fill="#1f2937"/>
      <g fill="#e0b400"><path d="M-24 0 l-18 -12 l0 24 z"><animate attributeName="d" values="M-24 0 l-18 -6 l0 12 z;M-24 0 l-18 -12 l0 24 z;M-24 0 l-18 -6 l0 12 z" dur="0.45s" repeatCount="indefinite"/></path></g>
    </g>
  </g>

  <!-- SHARK follows mouse -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="300,320; 150,200; 380,110; 300,320" keyTimes="0;0.33;0.66;1" dur="8s" repeatCount="indefinite"/>
    <g>
      <ellipse cx="0" cy="0" rx="40" ry="18" fill="#8a9bb0"/>
      <path d="M-40 0 l-22 -14 l0 28 z" fill="#8a9bb0"/>
      <path d="M-6 -18 l10 -22 l10 22 z" fill="#8a9bb0"/>
      <circle cx="26" cy="-4" r="3.5" fill="#1f2937"/>
      <path d="M12 8 l26 0 l-4 6 l-6 -3 l-6 3 l-6 -3 l-4 3 z" fill="#fff"/>
    </g>
  </g>

  <!-- mouse cursor near shark path -->
  <g transform="translate(400,100)">
    <path d="M0 0 l0 24 l6 -6 l5 10 l5 -2 l-5 -10 l8 0 z" fill="#1f2937" stroke="#fff" stroke-width="1.5"/>
  </g>

  <!-- SCRIPT preview -->
  <g transform="translate(516,96)" font-size="12.5" font-weight="700" fill="#fff">
    <text x="0" y="-6" font-size="13" font-weight="700" fill="#475569">Скрипт рыбки:</text>
    <path d="M0 2 q0 -8 8 -8 l48 0 q5 5 10 0 l56 0 q8 0 8 8 l0 16 l-130 0 z" fill="#f5b800"/>
    <text x="10" y="13" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="0" y="26" width="178" height="24" rx="6" fill="#4c97ff"/><text x="8" y="42" font-size="11">способ вращения ←→</text>
    <rect x="0" y="52" width="178" height="26" rx="6" fill="#ff8c1a"/><text x="10" y="69">всегда</text>
    <rect x="0" y="78" width="12" height="96" fill="#ff8c1a"/>
    <rect x="14" y="80" width="164" height="24" rx="6" fill="#4c97ff"/><text x="22" y="96" font-size="11">идти 3 + если на краю</text>
    <rect x="14" y="106" width="164" height="24" rx="6" fill="#9966ff"/><text x="22" y="122" font-size="11">следующий костюм</text>
    <rect x="14" y="132" width="164" height="24" rx="6" fill="#ff8c1a"/><text x="22" y="148" font-size="11">ждать 0.2 сек</text>
    <rect x="0" y="162" width="178" height="12" rx="6" fill="#ff8c1a"/>
    <text x="0" y="194" font-size="11" font-weight="500" fill="#94a3b8">🦈 Акула: к мышке + анимация</text>
  </g>
</svg>
