<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="19" font-weight="800" fill="#1f2937">🦈 Доп-вау — «Акула-охотник» (плывёт за мышкой, ловит рыбок)</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Два скрипта: акула плывёт за мышкой, рыбка убегает при касании.</text>

  <!-- shark script -->
  <text x="24" y="80" font-size="13" font-weight="700" fill="#334155">🦈 Акула</text>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <path d="M24 90 q0 -9 9 -9 l50 0 q5 5 10 0 l56 0 q9 0 9 9 l0 18 l-134 0 z" fill="#f5b800"/>
    <text x="33" y="104" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="24" y="108" width="260" height="26" rx="6" fill="#ff8c1a"/><text x="33" y="125">всегда</text>
    <rect x="24" y="134" width="12" height="90" fill="#ff8c1a"/>
    <rect x="38" y="136" width="246" height="26" rx="6" fill="#4c97ff"/><text x="47" y="153" font-size="11">повернуться к (указатель мыши)</text>
    <rect x="38" y="164" width="246" height="26" rx="6" fill="#4c97ff"/><text x="47" y="181">идти 5 шагов</text>
    <rect x="38" y="192" width="246" height="26" rx="6" fill="#9966ff"/><text x="47" y="209" font-size="11">следующий костюм · ждать 0.1</text>
    <rect x="24" y="220" width="260" height="12" rx="6" fill="#ff8c1a"/>
  </g>

  <!-- fish catch script -->
  <text x="330" y="80" font-size="13" font-weight="700" fill="#334155">🐠 Рыбка (убегает)</text>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <path d="M330 90 q0 -9 9 -9 l50 0 q5 5 10 0 l56 0 q9 0 9 9 l0 18 l-134 0 z" fill="#f5b800"/>
    <text x="339" y="104" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="330" y="108" width="280" height="26" rx="6" fill="#ff8c1a"/><text x="339" y="125">всегда</text>
    <rect x="330" y="134" width="12" height="90" fill="#ff8c1a"/>
    <rect x="344" y="136" width="266" height="88" rx="6" fill="#59c059"/>
    <text x="353" y="155" font-size="12">если &lt;касается (Shark)?&gt; то 🦈</text>
    <rect x="358" y="162" width="238" height="24" rx="5" fill="#9966ff"/><text x="366" y="178" font-size="11">говорить «Ой!» 0.5 сек</text>
    <rect x="358" y="190" width="238" height="24" rx="5" fill="#4c97ff"/><text x="366" y="206" font-size="11">перейти в случайную позицию</text>
  </g>

  <text x="24" y="252" font-size="12" fill="#16a34a" font-weight="700">👆 Веди акулу мышкой → коснулась рыбки → рыбка «Ой!» и удирает. Охота! 🔇 без звука.</text>
  <g font-size="11.5" font-weight="600" fill="#475569" transform="translate(24,266)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#4c97ff"/><text x="20" y="11">Движение</text>
    <rect x="100" y="0" width="14" height="14" rx="3" fill="#9966ff"/><text x="120" y="11">Внешний вид</text>
    <rect x="220" y="0" width="14" height="14" rx="3" fill="#ff8c1a"/><text x="240" y="11">Управление</text>
    <rect x="330" y="0" width="14" height="14" rx="3" fill="#59c059"/><text x="350" y="11">Сенсоры</text>
  </g>
</svg>
