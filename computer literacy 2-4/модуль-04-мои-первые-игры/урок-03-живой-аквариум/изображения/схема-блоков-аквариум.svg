<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="760" height="360" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="20" font-weight="800" fill="#1f2937">🧩 Итоговая схема — игра «Живой аквариум»</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Рыбка плавает и машет, акула охотится. Цвет блока = раздел.</text>

  <!-- SCRIPT fish -->
  <text x="24" y="82" font-size="13" font-weight="700" fill="#334155">🐠 Рыбка плавает и машет</text>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <path d="M24 92 q0 -9 9 -9 l50 0 q5 5 10 0 l70 0 q9 0 9 9 l0 18 l-148 0 z" fill="#f5b800"/>
    <text x="33" y="106" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="24" y="110" width="236" height="26" rx="6" fill="#4c97ff"/><text x="33" y="127">способ вращения ←→</text>
    <rect x="24" y="136" width="236" height="26" rx="6" fill="#ff8c1a"/><text x="33" y="153">всегда</text>
    <rect x="24" y="162" width="12" height="118" fill="#ff8c1a"/>
    <rect x="38" y="164" width="222" height="26" rx="6" fill="#4c97ff"/><text x="47" y="181">идти 3 шага</text>
    <rect x="38" y="192" width="222" height="26" rx="6" fill="#4c97ff"/><text x="47" y="209" font-size="11">если на краю, оттолкнуться</text>
    <rect x="38" y="220" width="222" height="26" rx="6" fill="#9966ff"/><text x="47" y="237">следующий костюм</text>
    <rect x="38" y="248" width="222" height="26" rx="6" fill="#ff8c1a"/><text x="47" y="265">ждать 0.2 секунды</text>
    <rect x="24" y="276" width="236" height="12" rx="6" fill="#ff8c1a"/>
  </g>

  <!-- SCRIPT shark -->
  <text x="300" y="82" font-size="13" font-weight="700" fill="#334155">🦈 Акула за мышкой</text>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <path d="M300 92 q0 -9 9 -9 l50 0 q5 5 10 0 l70 0 q9 0 9 9 l0 18 l-148 0 z" fill="#f5b800"/>
    <text x="309" y="106" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="300" y="110" width="220" height="26" rx="6" fill="#ff8c1a"/><text x="309" y="127">всегда</text>
    <rect x="300" y="136" width="12" height="90" fill="#ff8c1a"/>
    <rect x="314" y="138" width="206" height="26" rx="6" fill="#4c97ff"/><text x="322" y="155" font-size="11">повернуться к мышке</text>
    <rect x="314" y="166" width="206" height="26" rx="6" fill="#4c97ff"/><text x="322" y="183">идти 5 шагов</text>
    <rect x="314" y="194" width="206" height="26" rx="6" fill="#9966ff"/><text x="322" y="211" font-size="11">следующий костюм · ждать</text>
    <rect x="300" y="222" width="220" height="12" rx="6" fill="#ff8c1a"/>
  </g>
  <!-- catch note -->
  <g transform="translate(300,250)" font-size="12" font-weight="700" fill="#ffffff">
    <rect x="0" y="0" width="220" height="40" rx="6" fill="#59c059"/>
    <text x="10" y="17">если &lt;касается (Shark)?&gt; → 🐠</text>
    <text x="10" y="33" font-size="11">говорить «Ой!» · в случ. позицию</text>
  </g>

  <!-- legend -->
  <g font-size="12" font-weight="600" fill="#475569" transform="translate(556,96)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#334155">Цвета = разделы:</text>
    <rect x="0" y="12" width="16" height="16" rx="4" fill="#f5b800"/><text x="22" y="25">События</text>
    <rect x="0" y="34" width="16" height="16" rx="4" fill="#4c97ff"/><text x="22" y="47">Движение</text>
    <rect x="0" y="56" width="16" height="16" rx="4" fill="#9966ff"/><text x="22" y="69">Внешний вид</text>
    <rect x="0" y="78" width="16" height="16" rx="4" fill="#ff8c1a"/><text x="22" y="91">Управление</text>
    <rect x="0" y="100" width="16" height="16" rx="4" fill="#59c059"/><text x="22" y="113">Сенсоры</text>
  </g>
  <g transform="translate(556,230)" font-size="11.5" fill="#64748b">
    <text x="0" y="0" font-weight="700" fill="#334155">💡 «след. костюм»+«ждать»</text>
    <text x="0" y="16">= анимация. Стайка — дублируй.</text>
    <text x="0" y="36" font-weight="700" fill="#334155">🔇 «Ой!» — надписью.</text>
  </g>
</svg>
