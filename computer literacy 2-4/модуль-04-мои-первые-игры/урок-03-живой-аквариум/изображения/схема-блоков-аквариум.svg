<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 320" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="620" height="320" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="20" font-weight="800" fill="#1f2937">🧩 Итоговая схема — рыбка плавает и машет</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Главный скрипт аквариума. Цвет блока = раздел палитры.</text>

  <g font-size="13" font-weight="700" fill="#ffffff">
    <path d="M24 72 q0 -10 10 -10 l56 0 q6 6 12 0 l70 0 q9 0 9 10 l0 20 l-158 0 z" fill="#f5b800"/>
    <text x="34" y="87" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="24" y="92" width="300" height="28" rx="6" fill="#4c97ff"/><text x="34" y="111">способ вращения ←→</text>
    <rect x="24" y="120" width="300" height="28" rx="6" fill="#ff8c1a"/><text x="34" y="139">всегда</text>
    <rect x="24" y="148" width="14" height="124" fill="#ff8c1a"/>
    <rect x="40" y="150" width="284" height="28" rx="6" fill="#4c97ff"/><text x="50" y="169">идти 3 шага</text>
    <rect x="40" y="180" width="284" height="28" rx="6" fill="#4c97ff"/><text x="50" y="199" font-size="12">если на краю, оттолкнуться</text>
    <rect x="40" y="210" width="284" height="28" rx="6" fill="#9966ff"/><text x="50" y="229">следующий костюм</text>
    <rect x="40" y="240" width="284" height="28" rx="6" fill="#ff8c1a"/><text x="50" y="259">ждать 0.2 секунды</text>
    <rect x="24" y="270" width="300" height="12" rx="6" fill="#ff8c1a"/>
  </g>

  <!-- legend -->
  <g font-size="12" font-weight="600" fill="#475569" transform="translate(380,96)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#334155">Цвета = разделы:</text>
    <rect x="0" y="12" width="16" height="16" rx="4" fill="#f5b800"/><text x="22" y="25">События</text>
    <rect x="0" y="34" width="16" height="16" rx="4" fill="#4c97ff"/><text x="22" y="47">Движение</text>
    <rect x="0" y="56" width="16" height="16" rx="4" fill="#9966ff"/><text x="22" y="69">Внешний вид</text>
    <rect x="0" y="78" width="16" height="16" rx="4" fill="#ff8c1a"/><text x="22" y="91">Управление</text>
  </g>
  <g transform="translate(380,210)" font-size="11.5" fill="#64748b">
    <text x="0" y="0" font-weight="700" fill="#334155">💡 «след. костюм» + «ждать»</text>
    <text x="0" y="16">= рыбка машет плавником.</text>
    <text x="0" y="34" font-weight="700" fill="#334155">🐠 Стайка — «Дублировать».</text>
    <text x="0" y="52">🦈 Акула — см. схему доп-вау.</text>
  </g>

  <text x="24" y="306" font-size="12" fill="#16a34a" font-weight="700">▶ Рыбка плавает туда-сюда и машет плавником 🐠</text>
</svg>
