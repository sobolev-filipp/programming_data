<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#f5f7fb"/>
  <text x="320" y="30" font-size="20" font-weight="800" fill="#1f2937" text-anchor="middle">🌍 Примеры своего живого мира — а мир у тебя СВОЙ!</text>
  <text x="320" y="52" font-size="13" fill="#64748b" text-anchor="middle">Герои оживают сменой костюмов; кого-то ведёшь мышкой</text>

  <!-- panel 1: meadow -->
  <g transform="translate(20,70)">
    <rect x="0" y="0" width="195" height="200" rx="12" fill="#eafbe8" stroke="#cbd5e1"/>
    <text x="97" y="24" font-size="14" font-weight="700" fill="#2e9e52" text-anchor="middle">🦋 Поляна</text>
    <text x="55" y="95" font-size="34" text-anchor="middle">🦋</text>
    <text x="140" y="120" font-size="28" text-anchor="middle">🦋</text>
    <text x="90" y="160" font-size="26" text-anchor="middle">🐱</text>
    <text x="97" y="186" font-size="11" fill="#475569" text-anchor="middle">бабочки машут · кот-ловец</text>
  </g>

  <!-- panel 2: space -->
  <g transform="translate(228,70)">
    <rect x="0" y="0" width="185" height="200" rx="12" fill="#241546" stroke="#cbd5e1"/>
    <text x="92" y="24" font-size="14" font-weight="700" fill="#ffd23f" text-anchor="middle">🚀 Космос</text>
    <g fill="#ffd23f"><path d="M45 70 l4 10 l11 -1 l-8 7 l3 11 l-10 -6 l-10 6 l3 -11 l-8 -7 l11 1 z"/></g>
    <text x="130" y="95" font-size="20" text-anchor="middle">✨</text>
    <text x="90" y="150" font-size="30" text-anchor="middle">🛸</text>
    <text x="92" y="186" font-size="11" fill="#c9bdf0" text-anchor="middle">звёзды мигают · тарелка за мышкой</text>
  </g>

  <!-- panel 3: jungle -->
  <g transform="translate(426,70)">
    <rect x="0" y="0" width="194" height="200" rx="12" fill="#e6f6d8" stroke="#cbd5e1"/>
    <text x="97" y="24" font-size="14" font-weight="700" fill="#2e7d32" text-anchor="middle">🦜 Джунгли</text>
    <text x="55" y="95" font-size="32" text-anchor="middle">🦜</text>
    <text x="140" y="130" font-size="30" text-anchor="middle">🐒</text>
    <text x="97" y="186" font-size="11" fill="#475569" text-anchor="middle">попугай машет · обезьянка скачет</text>
  </g>
</svg>
