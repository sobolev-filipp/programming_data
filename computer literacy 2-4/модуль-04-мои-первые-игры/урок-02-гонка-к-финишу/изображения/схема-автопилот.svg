<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="620" height="300" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="19" font-weight="800" fill="#1f2937">🤖 Доп-вау — «Жук-автопилот» (соперник, едет сам)</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Дубль жука со своей программой. Катается без мышки — обгони его!</text>

  <g font-size="13" font-weight="700" fill="#ffffff">
    <path d="M24 72 q0 -10 10 -10 l56 0 q6 6 12 0 l70 0 q9 0 9 10 l0 20 l-158 0 z" fill="#f5b800"/>
    <text x="34" y="87" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="24" y="92" width="300" height="26" rx="6" fill="#ff8c1a"/><text x="34" y="110">всегда</text>
    <rect x="24" y="118" width="14" height="96" fill="#ff8c1a"/>
    <rect x="40" y="120" width="284" height="28" rx="6" fill="#4c97ff"/><text x="50" y="138">идти 5 шагов</text>
    <rect x="40" y="150" width="284" height="28" rx="6" fill="#4c97ff"/><text x="50" y="168" font-size="12">если на краю, оттолкнуться</text>
    <rect x="40" y="180" width="284" height="30" rx="6" fill="#4c97ff"/><text x="50" y="199" font-size="11">повернуть ↻ (случайное число 0–15)</text>
    <rect x="24" y="210" width="300" height="12" rx="6" fill="#ff8c1a"/>
  </g>

  <!-- legend -->
  <g font-size="12" font-weight="600" fill="#475569" transform="translate(380,96)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#334155">Цвета:</text>
    <rect x="0" y="12" width="16" height="16" rx="4" fill="#f5b800"/><text x="22" y="25">События</text>
    <rect x="0" y="34" width="16" height="16" rx="4" fill="#ff8c1a"/><text x="22" y="47">Управление</text>
    <rect x="0" y="56" width="16" height="16" rx="4" fill="#4c97ff"/><text x="22" y="69">Движение</text>
  </g>
  <g transform="translate(380,190)" font-size="12" fill="#64748b">
    <text x="0" y="0" font-weight="700" fill="#334155">🤖 Как сделать:</text>
    <text x="0" y="18">правый клик по жуку →</text>
    <text x="0" y="36">«Дублировать», у копии —</text>
    <text x="0" y="54">вот эта программа.</text>
  </g>

  <text x="24" y="248" font-size="12" fill="#16a34a" font-weight="700">▶ Соперник катается сам: едет, у стенки разворачивается, иногда виляет. Гонка вдвоём! 🏁</text>
</svg>
