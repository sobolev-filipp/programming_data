<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#f5f7fb"/>
  <text x="320" y="30" font-size="20" font-weight="800" fill="#1f2937" text-anchor="middle">🏁 Примеры своей гонки — а трасса у тебя СВОЯ!</text>
  <text x="320" y="52" font-size="13" fill="#64748b" text-anchor="middle">Герой едет за мышкой, рисует след → доезжает до финиша</text>

  <!-- panel 1: car to garage -->
  <g transform="translate(20,70)">
    <rect x="0" y="0" width="195" height="200" rx="12" fill="#eafbe8" stroke="#cbd5e1"/>
    <text x="97" y="24" font-size="14" font-weight="700" fill="#2e9e52" text-anchor="middle">🚗 Машинка в гараж</text>
    <path d="M30 150 C 90 150 80 70 160 90" fill="none" stroke="#4c97ff" stroke-width="5" stroke-dasharray="2 6"/>
    <text x="30" y="150" font-size="26" text-anchor="middle">🚗</text>
    <text x="160" y="80" font-size="24" text-anchor="middle">🏠</text>
    <text x="97" y="186" font-size="11" fill="#475569" text-anchor="middle">рисуй дорогу → финиш</text>
  </g>

  <!-- panel 2: bee to flower -->
  <g transform="translate(228,70)">
    <rect x="0" y="0" width="185" height="200" rx="12" fill="#fff6d6" stroke="#cbd5e1"/>
    <text x="92" y="24" font-size="14" font-weight="700" fill="#b8860b" text-anchor="middle">🐝 Пчела к цветку</text>
    <path d="M30 60 C 70 120 120 80 150 150" fill="none" stroke="#ffb300" stroke-width="5" stroke-dasharray="2 6"/>
    <text x="30" y="62" font-size="24" text-anchor="middle">🐝</text>
    <text x="150" y="160" font-size="26" text-anchor="middle">🌸</text>
    <text x="92" y="186" font-size="11" fill="#475569" text-anchor="middle">летит за мышкой → нектар!</text>
  </g>

  <!-- panel 3: rocket to planet -->
  <g transform="translate(426,70)">
    <rect x="0" y="0" width="194" height="200" rx="12" fill="#241546" stroke="#cbd5e1"/>
    <text x="97" y="24" font-size="14" font-weight="700" fill="#ff7ab6" text-anchor="middle">🚀 Ракета на базу</text>
    <path d="M40 150 C 90 150 110 70 160 80" fill="none" stroke="#ff7ab6" stroke-width="5" stroke-dasharray="2 6"/>
    <text x="40" y="152" font-size="24" text-anchor="middle">🚀</text>
    <text x="162" y="88" font-size="26" text-anchor="middle">🪐</text>
    <circle cx="70" cy="60" r="2" fill="#fff"/><circle cx="120" cy="120" r="2" fill="#fff"/>
    <text x="97" y="186" font-size="11" fill="#c9bdf0" text-anchor="middle">огненный след → планета</text>
  </g>
</svg>
