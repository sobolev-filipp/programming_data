<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="700" height="360" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="20" font-weight="800" fill="#1f2937">🧩 Итоговая схема — игра «Гонка к финишу»</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Руль + газ + проверка финиша. Цвет блока = раздел палитры.</text>

  <!-- script -->
  <g font-size="13" font-weight="700" fill="#ffffff">
    <path d="M24 72 q0 -10 10 -10 l56 0 q6 6 12 0 l80 0 q10 0 10 10 l0 20 l-168 0 z" fill="#f5b800"/>
    <text x="34" y="87" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="24" y="92" width="300" height="28" rx="6" fill="#0fbd8c"/><text x="34" y="111" font-size="12">очистить · опустить перо · цвет</text>
    <rect x="24" y="122" width="300" height="28" rx="6" fill="#ff8c1a"/><text x="34" y="141">всегда</text>
    <rect x="24" y="150" width="14" height="150" fill="#ff8c1a"/>
    <rect x="40" y="152" width="284" height="30" rx="6" fill="#4c97ff"/><text x="50" y="171" font-size="12">повернуться к (указатель мыши) 🖱 руль</text>
    <rect x="40" y="184" width="284" height="30" rx="6" fill="#4c97ff"/><text x="50" y="203">идти 4 шага  🏎 газ</text>
    <!-- if block -->
    <rect x="40" y="216" width="284" height="68" rx="6" fill="#59c059"/>
    <text x="50" y="235" font-size="12">если &lt;касается (Финиш)?&gt; то 🏁</text>
    <rect x="54" y="242" width="258" height="16" rx="5" fill="#9966ff"/><text x="62" y="255" font-size="11">говорить «Финиш! 🏁» 2 сек</text>
    <rect x="54" y="262" width="258" height="16" rx="5" fill="#ff8c1a"/><text x="62" y="275" font-size="11">остановить всё</text>
    <rect x="24" y="300" width="300" height="12" rx="6" fill="#ff8c1a"/>
  </g>

  <!-- legend -->
  <g font-size="12" font-weight="600" fill="#475569" transform="translate(380,96)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#334155">Цвета = разделы:</text>
    <rect x="0" y="12" width="16" height="16" rx="4" fill="#f5b800"/><text x="22" y="25">События</text>
    <rect x="0" y="34" width="16" height="16" rx="4" fill="#4c97ff"/><text x="22" y="47">Движение</text>
    <rect x="0" y="56" width="16" height="16" rx="4" fill="#9966ff"/><text x="22" y="69">Внешний вид</text>
    <rect x="0" y="78" width="16" height="16" rx="4" fill="#ff8c1a"/><text x="22" y="91">Управление</text>
    <rect x="0" y="100" width="16" height="16" rx="4" fill="#59c059"/><text x="22" y="113">Сенсоры</text>
    <rect x="0" y="122" width="16" height="16" rx="4" fill="#0fbd8c"/><text x="22" y="135">Перо</text>
  </g>

  <g transform="translate(380,250)" font-size="12" fill="#64748b">
    <text x="0" y="0" font-weight="700" fill="#334155">💡 «Повернуться к мышке» + «идти» =</text>
    <text x="0" y="18">герой едет за мышкой (руль + газ).</text>
    <text x="0" y="40" font-weight="700" fill="#334155">⚠️ «если касается» — внутри «всегда»,</text>
    <text x="0" y="58">имя финиша = имя спрайта. 🔇 Финиш — надписью.</text>
  </g>
</svg>
