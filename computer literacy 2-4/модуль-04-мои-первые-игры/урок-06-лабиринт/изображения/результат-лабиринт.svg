<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="#f5f7fb"/>
  <text x="24" y="36" font-size="24" font-weight="700" fill="#1f2937">🧩 Игра «Лабиринт»</text>
  <text x="24" y="60" font-size="14" fill="#64748b">Веди героя стрелками к выходу, не касаясь синих стен!</text>

  <!-- maze field: blue walls as background, light corridor on top -->
  <rect x="24" y="78" width="470" height="314" rx="14" fill="#3f5bd6" stroke="#2b3b9b" stroke-width="2"/>
  <!-- corridor (floor) -->
  <path d="M70 352 L70 150 L200 150 L200 300 L340 300 L340 130 L452 130"
        fill="none" stroke="#eaf0ff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- start -->
  <circle cx="70" cy="352" r="12" fill="#37c871"/><text x="70" y="378" font-size="11" fill="#dbe3ef" text-anchor="middle">старт</text>
  <!-- exit -->
  <circle cx="452" cy="130" r="13" fill="#ffd23f" stroke="#e0a800" stroke-width="2"/><text x="452" y="108" font-size="11" fill="#fff" text-anchor="middle">выход 🚪</text>

  <!-- hero travels the corridor -->
  <g>
    <animateMotion dur="5s" repeatCount="indefinite" rotate="0"
      path="M70 352 L70 150 L200 150 L200 300 L340 300 L340 130 L452 130"/>
    <circle cx="0" cy="0" r="12" fill="#ff8c42" stroke="#d96a1f" stroke-width="2"/>
    <circle cx="-4" cy="-3" r="2" fill="#1f2937"/><circle cx="4" cy="-3" r="2" fill="#1f2937"/>
  </g>

  <!-- Победа! bubble near exit, flashes at end -->
  <g transform="translate(360,150)">
    <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.6;0.82;0.85;0.98;1" dur="5s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="100" height="28" rx="13" fill="#fff" stroke="#37c871" stroke-width="2"/>
    <text x="50" y="19" font-size="14" font-weight="800" fill="#16a34a" text-anchor="middle">Победа! 🎉</text>
  </g>

  <!-- arrow hint -->
  <g transform="translate(40,96)" fill="#fff" font-size="13" font-weight="800">
    <rect x="18" y="0" width="16" height="14" rx="3" fill="#2b3b9b"/><text x="26" y="12" text-anchor="middle">↑</text>
    <rect x="0" y="16" width="16" height="14" rx="3" fill="#2b3b9b"/><text x="8" y="28" text-anchor="middle">←</text>
    <rect x="18" y="16" width="16" height="14" rx="3" fill="#2b3b9b"/><text x="26" y="28" text-anchor="middle">↓</text>
    <rect x="36" y="16" width="16" height="14" rx="3" fill="#2b3b9b"/><text x="44" y="28" text-anchor="middle">→</text>
  </g>

  <!-- SCRIPT preview -->
  <g transform="translate(516,96)" font-size="12.5" font-weight="700" fill="#fff">
    <text x="0" y="-6" font-size="13" font-weight="700" fill="#475569">Скрипт героя:</text>
    <path d="M0 2 q0 -8 8 -8 l48 0 q5 5 10 0 l56 0 q8 0 8 8 l0 16 l-130 0 z" fill="#f5b800"/>
    <text x="10" y="13" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="0" y="26" width="178" height="24" rx="6" fill="#4c97ff"/><text x="8" y="42" font-size="11">перейти в старт</text>
    <rect x="0" y="52" width="178" height="26" rx="6" fill="#ff8c1a"/><text x="10" y="69">всегда</text>
    <rect x="0" y="78" width="12" height="88" fill="#ff8c1a"/>
    <rect x="14" y="80" width="164" height="38" rx="6" fill="#59c059"/>
    <text x="22" y="95" font-size="10.5">если касается синего</text>
    <rect x="20" y="100" width="152" height="14" rx="4" fill="#4c97ff"/><text x="26" y="111" font-size="9">Ой! · в начало</text>
    <rect x="14" y="120" width="164" height="38" rx="6" fill="#59c059"/>
    <text x="22" y="135" font-size="10.5">если касается золотого</text>
    <rect x="20" y="140" width="152" height="14" rx="4" fill="#9966ff"/><text x="26" y="151" font-size="9">Победа! · стоп</text>
    <rect x="0" y="158" width="178" height="12" rx="6" fill="#ff8c1a"/>
    <text x="0" y="190" font-size="11" fill="#94a3b8">+ 4 скрипта-стрелки (←↑↓→)</text>
  </g>
</svg>
