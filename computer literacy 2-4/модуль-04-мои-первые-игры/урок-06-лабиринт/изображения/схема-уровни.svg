<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="640" height="260" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="19" font-weight="800" fill="#1f2937">🎭 Доп-вау — «Два уровня» (разные фоны)</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Дошёл до выхода → «следующий фон» → новый лабиринт, герой снова на старте.</text>

  <!-- level 1 mini -->
  <g transform="translate(40,74)">
    <rect x="0" y="0" width="150" height="110" rx="10" fill="#3f5bd6"/>
    <path d="M20 95 L20 30 L120 30 L120 90" fill="none" stroke="#eaf0ff" stroke-width="14" stroke-linecap="round"/>
    <circle cx="20" cy="95" r="6" fill="#37c871"/><circle cx="120" cy="90" r="6" fill="#ffd23f"/>
    <text x="75" y="128" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Уровень 1</text>
  </g>

  <!-- arrow -->
  <g transform="translate(210,128)">
    <path d="M0 0 l56 0" stroke="#ff8c1a" stroke-width="6" stroke-linecap="round"/>
    <path d="M68 0 l-16 -9 l0 18 z" fill="#ff8c1a"/>
    <text x="30" y="-12" font-size="12" font-weight="700" fill="#e07b00" text-anchor="middle">следующий</text>
    <text x="30" y="26" font-size="12" font-weight="700" fill="#e07b00" text-anchor="middle">фон</text>
  </g>

  <!-- level 2 mini -->
  <g transform="translate(300,74)">
    <rect x="0" y="0" width="150" height="110" rx="10" fill="#3f5bd6"/>
    <path d="M20 95 L20 55 L70 55 L70 25 L120 25 L120 60 L90 60 L90 90" fill="none" stroke="#eaf0ff" stroke-width="12" stroke-linecap="round"/>
    <circle cx="20" cy="95" r="6" fill="#37c871"/><circle cx="90" cy="90" r="6" fill="#ffd23f"/>
    <text x="75" y="128" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Уровень 2 (труднее)</text>
  </g>

  <!-- block -->
  <g transform="translate(470,80)" font-size="11.5" font-weight="700" fill="#ffffff">
    <text x="0" y="-4" font-size="12" font-weight="700" fill="#475569">У выхода:</text>
    <rect x="0" y="0" width="150" height="22" rx="5" fill="#9966ff"/><text x="7" y="15" font-size="10">следующий фон</text>
    <rect x="0" y="26" width="150" height="22" rx="5" fill="#4c97ff"/><text x="7" y="41" font-size="10">перейти в старт</text>
    <rect x="0" y="52" width="150" height="22" rx="5" fill="#9966ff"/><text x="7" y="67" font-size="10">говорить «Уровень 2!»</text>
  </g>

  <text x="24" y="226" font-size="12" fill="#16a34a" font-weight="700">🏆 Прошёл все фоны → «Ты прошёл все уровни!» + остановить всё.</text>
</svg>
