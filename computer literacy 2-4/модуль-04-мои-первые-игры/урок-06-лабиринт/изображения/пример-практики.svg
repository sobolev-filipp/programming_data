<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="640" height="300" fill="#f5f7fb"/>
  <text x="320" y="30" font-size="20" font-weight="800" fill="#1f2937" text-anchor="middle">🎨 Свой фон + «касается цвета» — а игра у тебя своя!</text>
  <text x="320" y="52" font-size="13" fill="#64748b" text-anchor="middle">Те же умения, что в лабиринте, но игра другая</text>

  <!-- panel 1: buzz wire -->
  <g transform="translate(20,70)">
    <rect x="0" y="0" width="195" height="200" rx="12" fill="#101828"/>
    <text x="97" y="24" font-size="14" font-weight="700" fill="#ff8c1a" text-anchor="middle">🔌 Не задень провод</text>
    <path d="M20 160 Q60 60 100 120 T180 70" fill="none" stroke="#ff8c1a" stroke-width="9" stroke-linecap="round"/>
    <circle cx="20" cy="160" r="10" fill="none" stroke="#4cc3ff" stroke-width="5"/>
    <text x="180" y="60" font-size="16" text-anchor="middle">🏁</text>
    <text x="97" y="188" font-size="11" fill="#cbd5e1" text-anchor="middle">веди колечко, не коснись</text>
  </g>

  <!-- panel 2: lava -->
  <g transform="translate(228,70)">
    <rect x="0" y="0" width="185" height="200" rx="12" fill="#7a1f12"/>
    <text x="92" y="24" font-size="14" font-weight="700" fill="#ffd23f" text-anchor="middle">🌋 Пол — это лава</text>
    <g fill="#5a5f6b">
      <rect x="18" y="150" width="40" height="22" rx="7"/><rect x="78" y="120" width="40" height="22" rx="7"/>
      <rect x="130" y="150" width="40" height="22" rx="7"/><rect x="60" y="80" width="40" height="22" rx="7"/>
    </g>
    <text x="38" y="166" font-size="16" text-anchor="middle">🦖</text>
    <text x="92" y="188" font-size="11" fill="#ffd9d0" text-anchor="middle">прыгай по камням, не в лаву</text>
  </g>

  <!-- panel 3: zones -->
  <g transform="translate(426,70)">
    <rect x="0" y="0" width="194" height="200" rx="12" fill="#1f2937"/>
    <text x="97" y="24" font-size="14" font-weight="700" fill="#aef3b5" text-anchor="middle">🗺 Цветные зоны</text>
    <rect x="12" y="36" width="80" height="80" rx="8" fill="#2e9e52"/>
    <rect x="100" y="36" width="82" height="80" rx="8" fill="#2b7fd6"/>
    <rect x="12" y="122" width="170" height="48" rx="8" fill="#d9b24a"/>
    <text x="52" y="82" font-size="18" text-anchor="middle">🌲</text>
    <text x="141" y="82" font-size="18" text-anchor="middle">🌊</text>
    <text x="97" y="152" font-size="18" text-anchor="middle">🐫</text>
    <text x="97" y="188" font-size="11" fill="#aef3b5" text-anchor="middle">зашёл в зону — герой говорит</text>
  </g>
</svg>
