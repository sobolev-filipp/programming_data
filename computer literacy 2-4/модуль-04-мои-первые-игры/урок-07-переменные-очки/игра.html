<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра — Пинг-понг</title>
<style>
  :root{--ink:#1f2a52;--yellow:#ffd23f;--blue:#4c97ff;--green:#4cbb5c;--red:#ff6b6b;}
  *{box-sizing:border-box;font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;margin:0;padding:0;}
  body{min-height:100vh;background:linear-gradient(135deg,#16233f,#4c97ff);display:flex;align-items:center;justify-content:center;padding:14px;color:var(--ink);}
  .wrap{width:min(560px,100%);background:#fff;border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.3);padding:18px 20px 22px;position:relative;overflow:hidden;}
  h1{text-align:center;color:#2b6fd6;font-size:27px;margin:2px 0;}
  .sub{text-align:center;color:#7a86a8;font-size:16px;margin-bottom:10px;}
  .hud{display:flex;justify-content:space-around;align-items:center;background:#eef2ff;border-radius:16px;padding:8px 10px;font-size:19px;font-weight:bold;margin-bottom:10px;}
  canvas{display:block;width:100%;background:#16233f;border-radius:14px;touch-action:none;cursor:pointer;}
  .msg{text-align:center;font-size:18px;font-weight:bold;min-height:24px;margin-top:8px;color:var(--ink);}
  .start{background:var(--yellow);color:#6b4e00;border:none;border-radius:16px;padding:16px 30px;font-size:24px;font-weight:bold;cursor:pointer;display:block;margin:14px auto;}
  .hint{text-align:center;color:#9aa4bf;font-size:14px;margin-top:10px;}
  .stars{font-size:48px;text-align:center;letter-spacing:4px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🏓 Пинг-понг</h1>

  <div id="intro">
    <p class="sub">Двигай ракетку мышкой и отбивай мяч. Каждый удар — очко! Пропустил — минус жизнь.</p>
    <button class="start" onclick="startGame()">▶ Играть!</button>
    <p class="hint">Веди ракетку мышкой (или стрелками ← →). Три жизни.</p>
  </div>

  <div id="game" class="hidden">
    <div class="hud">
      <span>🏆 <b id="score">0</b></span>
      <span>❤ <b id="lives">3</b></span>
      <span>🥇 <b id="best">0</b></span>
    </div>
    <canvas id="cv" width="520" height="380"></canvas>
    <div class="msg" id="msg"></div>
  </div>

  <div id="over" class="hidden">
    <h1>Игра окончена! 🎉</h1>
    <div class="stars" id="starsres"></div>
    <p class="sub" id="finalscore"></p>
    <p class="sub" id="praise"></p>
    <button class="start" onclick="location.reload()">↺ Ещё разок</button>
  </div>
</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
let state='intro', score=0, lives=3, best=0;
let ball, paddle, raf=0;

function reset(dir){
  ball={x:W/2, y:H/2, r:9, vx:(Math.random()<.5?-1:1)*2.4, vy:3.2};
}
function startGame(){
  score=0; lives=3; state='play';
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('score').textContent=0;
  document.getElementById('lives').textContent=3;
  document.getElementById('best').textContent=best;
  paddle={x:W/2-45, y:H-26, w:90, h:12};
  reset();
  cancelAnimationFrame(raf);
  loop();
}

function loop(){
  if(state!=='play') return;
  update();
  draw();
  raf=requestAnimationFrame(loop);
}

function update(){
  ball.x+=ball.vx; ball.y+=ball.vy;
  // walls
  if(ball.x-ball.r<0){ ball.x=ball.r; ball.vx*=-1; }
  if(ball.x+ball.r>W){ ball.x=W-ball.r; ball.vx*=-1; }
  if(ball.y-ball.r<0){ ball.y=ball.r; ball.vy*=-1; }
  // paddle hit
  if(ball.vy>0 && ball.y+ball.r>=paddle.y && ball.y+ball.r<=paddle.y+paddle.h+8
     && ball.x>=paddle.x-ball.r && ball.x<=paddle.x+paddle.w+ball.r){
    ball.y=paddle.y-ball.r;
    ball.vy=-Math.abs(ball.vy)-0.15;              // bounce up, speed up a touch
    const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);
    ball.vx=hit*3.2;                              // angle depends where it hit
    score++;
    document.getElementById('score').textContent=score;
    if(score>best){ best=score; document.getElementById('best').textContent=best; }
  }
  // missed
  if(ball.y-ball.r>H){
    lives--;
    document.getElementById('lives').textContent=lives;
    document.getElementById('msg').textContent='Мимо! −1 жизнь';
    if(lives<=0){ gameOver(); return; }
    reset();
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // center dashes
  ctx.strokeStyle='#2e4472'; ctx.lineWidth=3; ctx.setLineDash([8,10]);
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
  // paddle
  ctx.fillStyle='#4cc3ff';
  ctx.beginPath(); ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6); ctx.fill();
  // ball
  ctx.fillStyle='#ffd23f';
  ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7); ctx.fill();
}

function gameOver(){
  state='over'; cancelAnimationFrame(raf);
  document.getElementById('game').classList.add('hidden');
  document.getElementById('over').classList.remove('hidden');
  let st = score>=15?5 : score>=10?4 : score>=5?3 : score>=2?2 : 1;
  document.getElementById('starsres').textContent='⭐'.repeat(st)+'☆'.repeat(5-st);
  document.getElementById('finalscore').textContent='Твой счёт: '+score+'  ·  рекорд: '+best;
  document.getElementById('praise').textContent = score>=10?'Ты чемпион пинг-понга! 🏆' : score>=4?'Отличная реакция! 👏' : 'Молодец, тренируйся ещё! 💪';
}

function movePaddleTo(px){
  if(!paddle) return;
  paddle.x=Math.max(0,Math.min(W-paddle.w, px-paddle.w/2));
}
function pointerX(e){
  const r=cv.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  return cx*(W/r.width);
}
cv.addEventListener('mousemove',e=>{ if(state==='play') movePaddleTo(pointerX(e)); });
cv.addEventListener('touchmove',e=>{ if(state==='play'){ movePaddleTo(pointerX(e)); e.preventDefault(); } },{passive:false});
document.addEventListener('keydown',e=>{
  if(state!=='play'||!paddle) return;
  if(e.key==='ArrowLeft'){ paddle.x=Math.max(0,paddle.x-26); e.preventDefault(); }
  if(e.key==='ArrowRight'){ paddle.x=Math.min(W-paddle.w,paddle.x+26); e.preventDefault(); }
});
// roundRect fallback
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r);
    this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); return this;
  };
}
</script>
</body>
</html>
