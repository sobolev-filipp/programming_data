<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="640" height="280" fill="#f7f9fc"/>
  <text x="24" y="30" font-size="19" font-weight="800" fill="#1f2937">🔺 Доп-вау — «Берегись шипа!» (опасность)</text>
  <text x="24" y="52" font-size="13" fill="#64748b">Шип прыгает по сцене; коснулся его — ракета охает и летит в центр.</text>

  <!-- spike script -->
  <text x="24" y="80" font-size="13" font-weight="700" fill="#334155">🔺 Шип</text>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <path d="M24 90 q0 -9 9 -9 l50 0 q5 5 10 0 l56 0 q9 0 9 9 l0 16 l-134 0 z" fill="#f5b800"/>
    <text x="33" y="104" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="24" y="108" width="250" height="24" rx="6" fill="#ff8c1a"/><text x="32" y="124">всегда</text>
    <rect x="24" y="132" width="12" height="52" fill="#ff8c1a"/>
    <rect x="38" y="134" width="236" height="22" rx="5" fill="#4c97ff"/><text x="46" y="150" font-size="11">перейти в случайную позицию</text>
    <rect x="38" y="158" width="236" height="22" rx="5" fill="#ff8c1a"/><text x="46" y="174" font-size="11">ждать 3 секунды</text>
    <rect x="24" y="182" width="250" height="12" rx="6" fill="#ff8c1a"/>
  </g>

  <!-- rocket hit script -->
  <text x="320" y="80" font-size="13" font-weight="700" fill="#334155">🚀 Ракета (касание шипа)</text>
  <g font-size="12" font-weight="700" fill="#ffffff">
    <path d="M320 90 q0 -9 9 -9 l50 0 q5 5 10 0 l56 0 q9 0 9 9 l0 16 l-134 0 z" fill="#f5b800"/>
    <text x="329" y="104" fill="#3d2f00">когда 🚩 нажат</text>
    <rect x="320" y="108" width="290" height="24" rx="6" fill="#ff8c1a"/><text x="328" y="124">всегда</text>
    <rect x="320" y="132" width="12" height="90" fill="#ff8c1a"/>
    <rect x="334" y="134" width="276" height="88" rx="6" fill="#59c059"/>
    <text x="342" y="152" font-size="11">если &lt;касается (Шип)?&gt; то</text>
    <rect x="348" y="158" width="256" height="24" rx="5" fill="#9966ff"/><text x="356" y="174" font-size="11">говорить «Ой!» 0.5 сек</text>
    <rect x="348" y="186" width="256" height="24" rx="5" fill="#4c97ff"/><text x="356" y="202" font-size="11">перейти в x:0 y:0 (в центр)</text>
  </g>

  <text x="24" y="226" font-size="12" fill="#16a34a" font-weight="700">👆 Собирай звёзды ⭐, но уворачивайся от шипа 🔺 — игра на ловкость!</text>
  <g font-size="11.5" font-weight="600" fill="#475569" transform="translate(24,242)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#4c97ff"/><text x="20" y="11">Движение</text>
    <rect x="100" y="0" width="14" height="14" rx="3" fill="#9966ff"/><text x="120" y="11">Внешний вид</text>
    <rect x="220" y="0" width="14" height="14" rx="3" fill="#ff8c1a"/><text x="240" y="11">Управление</text>
    <rect x="330" y="0" width="14" height="14" rx="3" fill="#59c059"/><text x="350" y="11">Сенсоры</text>
  </g>
</svg>
