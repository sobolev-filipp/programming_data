<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <radialGradient id="space" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#2a3b7a"/><stop offset="1" stop-color="#121a3a"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="720" height="420" fill="#f5f7fb"/>
  <text x="24" y="36" font-size="24" font-weight="700" fill="#1f2937">🚀 Игра «Собери звёзды»</text>
  <text x="24" y="60" font-size="14" fill="#64748b">Веди ракету стрелками, собирай звёзды, уворачивайся от шипа!</text>

  <!-- space -->
  <rect x="24" y="78" width="470" height="314" rx="16" fill="url(#space)" stroke="#2b3b6b" stroke-width="2"/>
  <g fill="#fff"><circle cx="80" cy="120" r="1.6"/><circle cx="200" cy="100" r="1.3"/><circle cx="420" cy="140" r="1.6"/><circle cx="140" cy="320" r="1.3"/><circle cx="380" cy="300" r="1.6"/><circle cx="300" cy="360" r="1.3"/></g>

  <!-- stars (twinkle) -->
  <g fill="#ffd23f">
    <path d="M160 160 l5 12 l13 -1 l-10 9 l3 13 l-11 -7 l-11 7 l3 -13 l-10 -9 l13 1 z"><animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/></path>
    <path d="M380 220 l5 12 l13 -1 l-10 9 l3 13 l-11 -7 l-11 7 l3 -13 l-10 -9 l13 1 z"><animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/></path>
    <path d="M250 300 l5 12 l13 -1 l-10 9 l3 13 l-11 -7 l-11 7 l3 -13 l-10 -9 l13 1 z"><animate attributeName="opacity" values="1;0.5;1" dur="1.3s" repeatCount="indefinite"/></path>
  </g>

  <!-- spike -->
  <g transform="translate(330,330)">
    <path d="M0 -20 l16 28 l-32 0 z" fill="#ff5a5a" stroke="#c23b3b" stroke-width="2"/>
    <text x="0" y="-2" font-size="12" fill="#fff" text-anchor="middle">⚠</text>
  </g>

  <!-- score chip -->
  <g transform="translate(360,92)">
    <rect x="0" y="0" width="120" height="30" rx="12" fill="#ffd23f"/>
    <text x="60" y="21" font-size="15" font-weight="800" fill="#6b4e00" text-anchor="middle">⭐ Собрано: 5</text>
  </g>

  <!-- rocket (flies a small path collecting) -->
  <g>
    <animateMotion dur="5s" repeatCount="indefinite" rotate="0"
      path="M120 300 L160 180 L300 260 L380 230 L250 310 L120 300"/>
    <text x="0" y="0" font-size="40" text-anchor="middle" dominant-baseline="central">🚀</text>
  </g>

  <!-- +1 bubble -->
  <g transform="translate(170,150)">
    <animate attributeName="opacity" values="0;1;1;0;0;0" keyTimes="0;0.18;0.28;0.34;0.9;1" dur="5s" repeatCount="indefinite"/>
    <rect x="0" y="0" width="54" height="26" rx="12" fill="#fff" stroke="#4cbb5c" stroke-width="2"/>
    <text x="27" y="18" font-size="14" font-weight="800" fill="#16a34a" text-anchor="middle">+1!</text>
  </g>

  <!-- arrow-keys hint -->
  <g transform="translate(60,350)" fill="#fff" opacity="0.85" font-size="14" font-weight="800">
    <rect x="18" y="-16" width="20" height="18" rx="4" fill="#3a4b8b"/><text x="28" y="-2" text-anchor="middle">↑</text>
    <rect x="-4" y="6" width="20" height="18" rx="4" fill="#3a4b8b"/><text x="6" y="20" text-anchor="middle">←</text>
    <rect x="18" y="6" width="20" height="18" rx="4" fill="#3a4b8b"/><text x="28" y="20" text-anchor="middle">↓</text>
    <rect x="40" y="6" width="20" height="18" rx="4" fill="#3a4b8b"/><text x="50" y="20" text-anchor="middle">→</text>
  </g>

  <!-- SCRIPT preview -->
  <g transform="translate(516,96)" font-size="12.5" font-weight="700" fill="#fff">
    <text x="0" y="-6" font-size="13" font-weight="700" fill="#475569">Скрипты ракеты:</text>
    <path d="M0 2 q0 -8 8 -8 l70 0 q5 5 10 0 l56 0 q8 0 8 8 l0 16 l-152 0 z" fill="#f5b800"/>
    <text x="10" y="13" fill="#3d2f00">когда ↑ нажата</text>
    <rect x="0" y="26" width="178" height="24" rx="6" fill="#4c97ff"/><text x="8" y="42">изменить y на 10</text>
    <path d="M0 56 q0 -8 8 -8 l70 0 q5 5 10 0 l56 0 q8 0 8 8 l0 16 l-152 0 z" fill="#f5b800"/>
    <text x="10" y="67" fill="#3d2f00">когда → нажата</text>
    <rect x="0" y="80" width="178" height="24" rx="6" fill="#4c97ff"/><text x="8" y="96">изменить x на 10</text>
    <text x="0" y="122" font-size="11" fill="#94a3b8">…и так ← и ↓ (всего 4 стрелки)</text>
    <text x="0" y="148" font-size="11" fill="#94a3b8">⭐ звезда: прыгает + ловится</text>
    <text x="0" y="164" font-size="11" fill="#94a3b8">«если касается Rocketship?»</text>
  </g>
</svg>
