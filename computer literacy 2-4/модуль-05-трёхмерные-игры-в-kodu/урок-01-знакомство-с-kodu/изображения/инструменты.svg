<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><rect width="960" height="540" rx="24" fill="#eff6ff"/><text x="480" y="48" font-family="Arial,sans-serif" font-size="31" font-weight="bold" text-anchor="middle" fill="#1f2a52">Три инструмента меняют землю</text><rect x="22" y="88" width="292" height="390" rx="24" fill="white"/><g transform="translate(32,100)"><path d="M 30 180 L 135 125 240 180 135 235 Z" fill="#68c875" stroke="#319a62" stroke-width="5"/></g><text x="168" y="385" font-family="Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#1f2a52">Кисть земли</text><text x="168" y="426" font-family="Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2a52">Рисуем площадку</text><rect x="334" y="88" width="292" height="390" rx="24" fill="white"/><g transform="translate(344,100)"><path d="M 30 180 L 135 80 240 180 135 235 Z" fill="#68c875" stroke="#319a62" stroke-width="5"/></g><text x="480" y="385" font-family="Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#1f2a52">Холмы и ямы</text><text x="480" y="426" font-family="Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2a52">Меняем высоту</text><rect x="646" y="88" width="292" height="390" rx="24" fill="white"/><g transform="translate(656,100)"><path d="M 30 180 L 135 125 240 180 135 235 Z" fill="#68c875" stroke="#319a62" stroke-width="5"/><ellipse cx="135" cy="180" rx="64" ry="30" fill="#4c97ff"/></g><text x="792" y="385" font-family="Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#1f2a52">Вода</text><text x="792" y="426" font-family="Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#1f2a52">Заполняем низину</text></svg>