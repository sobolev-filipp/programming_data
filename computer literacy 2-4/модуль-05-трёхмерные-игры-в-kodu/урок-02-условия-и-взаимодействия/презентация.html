<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Урок 20 · Kodu</title><style>*{box-sizing:border-box}body{margin:0;font-family:'Comic Sans MS','Segoe UI',system-ui;background:#12385b;color:#173a57}.slide{min-height:100vh;padding:22px 4vw;display:flex;flex-direction:column;gap:16px}.top,.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{padding:12px 20px;border-radius:30px;background:#ffffffc4;font-weight:700}.stage{max-width:1180px;width:100%;margin:auto;flex:1;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:25px}.copy{background:#ffffffc4;border-radius:28px;padding:35px;box-shadow:0 18px 32px #29537922}h1{font-size:clamp(32px,4.2vw,65px);line-height:1.1;margin:0 0 22px}p{font-size:clamp(23px,2.5vw,38px);line-height:1.35;margin:0}.illustration{border-radius:28px;min-height:320px;display:grid;place-items:center;background:#ffffff8c;padding:18px}.illustration img{width:100%;height:auto;max-height:62vh;object-fit:contain}.bip{font-size:135px;text-align:center}.nav{padding:10px 3vw}.nav button{background:#135c91;color:white;border:0;border-radius:18px;padding:15px 28px;font-size:22px;cursor:pointer}.nav button:disabled{opacity:.4}@media(max-width:700px){.stage{grid-template-columns:1fr}.illustration{min-height:160px}.bip{font-size:70px}.copy{padding:20px}}</style></head><body><div class="slide" id="slide"><div class="top"><span class="pill">Бип · Kodu · урок 20</span><span id="count" class="pill"></span></div><div class="stage"><section class="copy"><h1 id="title"></h1><p id="content"></p></section><section class="illustration" id="picture"></section></div><div class="nav"><button id="prev">← Назад</button><span class="pill">← → / пробел</span><button id="next">Вперёд →</button></div></div><script>const SLIDES=[{"title": "Мир начинает отвечать", "content": "Сегодня робот научится замечать яблоки и реагировать на касание.", "image": "яблочный-патруль.png", "bg": ["#d4f5c4", "#d7edff"]}, {"title": "Что помним?", "content": "КОГДА — условие. ДЕЛАТЬ — действие. Программа принадлежит объекту.", "image": "схема-сравнение.svg", "bg": ["#e2ebff", "#d0fff0"]}, {"title": "Задача", "content": "Заметить яблоко → подъехать → коснуться → съесть.", "image": "план-поляны.svg", "bg": ["#d4f5c4", "#d7edff"]}, {"title": "Создадим поляну", "content": "Широкая ровная земля, дорожка, герой, первое яблоко.", "image": "план-поляны.svg", "bg": ["#e2ebff", "#d0fff0"]}, {"title": "Открой программу Байкера", "content": "Объект → ПКМ по Байкеру → Программа → Страница 1.", "image": "", "bg": ["#d4f5c4", "#d7edff"]}, {"title": "Первая строка", "content": "КОГДА + Вижу + Яблоко → ДЕЛАТЬ + Двигаться + К нему.", "image": "схема-яблоки.svg", "bg": ["#e2ebff", "#d0fff0"]}, {"title": "Проверяем", "content": "Запусти: робот подъезжает, но яблоко пока не исчезает. Почему?", "image": "", "bg": ["#d4f5c4", "#d7edff"]}, {"title": "Вторая строка", "content": "КОГДА + Касание + Яблоко → ДЕЛАТЬ + Съесть + Это.", "image": "схема-яблоки.svg", "bg": ["#e2ebff", "#d0fff0"]}, {"title": "Теперь несколько яблок", "content": "Добавь ещё 4–5 яблок и посмотри, как герой ищет следующую цель.", "image": "план-поляны.svg", "bg": ["#d4f5c4", "#d7edff"]}, {"title": "Перерыв для глаз", "content": "Посмотри вдаль и на ладонь, поморгай. Встань, разомни плечи.", "image": "", "bg": ["#e2ebff", "#d0fff0"]}, {"title": "Второй персонаж", "content": "Стражу нужна своя программа; он может ехать к герою.", "image": "схема-страж.svg", "bg": ["#d4f5c4", "#d7edff"]}, {"title": "Что делать при ошибке?", "content": "Проверь нужного героя, условие, действие, видимость и запуск.", "image": "схема-ошибка.svg", "bg": ["#e2ebff", "#d0fff0"]}, {"title": "Почему две строки?", "content": "«Вижу» — обнаружение. «Касание» — близкий контакт.", "image": "схема-яблоки.svg", "bg": ["#d4f5c4", "#d7edff"]}, {"title": "Сохраняем мир", "content": "Домик → Сохранить мой мир → понятное название.", "image": "", "bg": ["#e2ebff", "#d0fff0"]}, {"title": "Самостоятельно", "content": "«Фруктовый курьер» и «Парк приветствий» — другие истории.", "image": "", "bg": ["#d4f5c4", "#d7edff"]}, {"title": "Закрепляем", "content": "Игра «Робот-сборщик», викторина и тренажёр печати: уровень 20.", "image": "", "bg": ["#e2ebff", "#d0fff0"]},{"title": "Итоговый проект: Три дерева", "content": "Красные, зелёные и чёрные яблоки. Игрок выбирает, к какому дереву подъехать.", "image": "три-дерева.svg", "bg": ["#d4f5c4", "#d7edff"]},{"title": "Проверяем цвет в условии", "content": "КОГДА Касание → Яблоко → Красный. ДЕЛАТЬ Изменить цвет → Красный. Без цветового фильтра реакция будет на все яблоки.", "image": "три-дерева.svg", "bg": ["#e2ebff", "#d0fff0"]},{"title": "Не забудь убрать яблоко", "content": "Добавляем отдельное действие Съесть → Это. Сначала проверяем красное, потом зелёное.", "image": "три-дерева.svg", "bg": ["#fce8d5", "#e3f6d3"]},{"title": "Чёрное яблоко", "content": "Особое сообщение или звук: «Фу! Это яблоко гнилое!» Проверяй реакцию отдельно от удаления предмета.", "image": "три-дерева.svg", "bg": ["#e2ebff", "#d0fff0"]},{"title": "Мини-проект: Парк приветствий", "content": "Смотритель едет к гостю, когда видит его, а при касании здоровается. Сравни два условия.", "image": "парк-приветствий.svg", "bg": ["#d4f5c4", "#d7edff"]}];let index=0;const $=id=>document.getElementById(id);function render(){let s=SLIDES[index];$('title').textContent=s.title;$('content').textContent=s.content;$('count').textContent=(index+1)+' / '+SLIDES.length;$('slide').style.background=`linear-gradient(135deg,${s.bg[0]},${s.bg[1]})`;$('picture').innerHTML=s.image?'<img alt="Иллюстрация" src="изображения/'+s.image+'">':'<div class="bip">🤖</div>';$('prev').disabled=index===0;$('next').disabled=index===SLIDES.length-1;}function go(d){index=Math.max(0,Math.min(SLIDES.length-1,index+d));render()}$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});render();</script></body></html>
