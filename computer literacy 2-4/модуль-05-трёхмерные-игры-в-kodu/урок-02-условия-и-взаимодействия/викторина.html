<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Викторина · Урок 20</title><style>*{box-sizing:border-box}body{font-family:'Comic Sans MS','Segoe UI',system-ui;margin:0;background:linear-gradient(125deg,#d1eeff,#dbf6b7);color:#1c3f5d;min-height:100vh;display:grid;place-items:center}.card{width:min(760px,94vw);background:white;border-radius:25px;box-shadow:0 15px 45px #3072a022;padding:30px}.hidden{display:none!important}h1{font-size:clamp(28px,4vw,41px)}p{font-size:24px}.answers{display:grid;gap:14px}button{font:inherit;font-size:22px;cursor:pointer;padding:15px;border-radius:15px;background:#eaf7ff;border:2px solid #afd9ed;color:#15476c;text-align:left}.answers button:hover{background:#d0f0ff}button:disabled{opacity:.75;cursor:default}.good{background:#d1f4b6!important}.bad{background:#ffd5d2!important}.meta{display:flex;justify-content:space-between;font-weight:700}.go{background:#14679b!important;color:white;border:none}.small{font-size:17px;color:#567}.dots{letter-spacing:7px}</style></head><body><main class="card"><div class="meta"><span>🤖 Бип · Урок 20</span><span id="progress"></span></div><section id="start"><h1>Условия Kodu</h1><p>10 вопросов. Нажимай на ответы или клавиши 1–3.</p><button class="go" id="begin">Начать викторину</button></section><section id="play" class="hidden"><p id="dots" class="small dots"></p><h1 id="question"></h1><div class="answers" id="answers"></div><p id="feedback"></p><button id="next" class="go hidden">Следующий вопрос →</button></section><section id="finish" class="hidden"><h1 id="result"></h1><p id="stars"></p><p>Ошибки — подсказка для следующей попытки, не повод расстраиваться.</p><button id="again" class="go">Попробовать ещё раз</button></section></main><script>const QUESTIONS=[{"q": "Когда герой замечает яблоко издалека, какое условие подходит?", "a": ["Вижу", "Касание", "Всегда"], "c": 0}, {"q": "Что должно произойти при касании яблока?", "a": ["Двигаться свободно", "Съесть это", "Изменить небо"], "c": 1}, {"q": "Где находится действие?", "a": ["В части КОГДА", "На панели камеры", "В части ДЕЛАТЬ"], "c": 2}, {"q": "Кому принадлежит программа?", "a": ["Выбранному персонажу", "Всему компьютеру", "Любому яблоку"], "c": 0}, {"q": "Почему первое правило не убирает яблоко?", "a": ["Потому что оно только двигает героя", "Потому что нет тропинки", "Потому что мир не сохранён"], "c": 0}, {"q": "Какая запись заставит робота ехать к замеченному яблоку?", "a": ["Касание яблока → сказать", "Вижу яблоко → двигаться к нему", "Всегда → менять небо"], "c": 1}, {"q": "Что проверить, если робот стоит?", "a": ["Цвет неба", "Количество деревьев", "Выбран ли объект и есть ли правило"], "c": 2}, {"q": "Какую проверку делаем сначала при ошибке?", "a": ["Изменяем по одной причине", "Удаляем весь мир", "Добавляем десять яблок"], "c": 0}, {"q": "Какой инструмент выбирает героя для редактирования?", "a": ["Камера", "Объект", "Вода"], "c": 1}, {"q": "Что означает «Это» после «Съесть»?", "a": ["Вся поляна", "Другой герой", "Предмет, которого коснулись"], "c": 2}];let order=[],i=0,score=0,answered=false;const $=id=>document.getElementById(id);function shuffle(a){for(let k=a.length-1;k>0;k--){let j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}function show(id){['start','play','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function init(){order=shuffle(QUESTIONS.map(q=>({...q,opts:shuffle(q.a.map((label,j)=>({label,ok:j===q.c})))})));i=0;score=0;show('play');render()}function render(){answered=false;let q=order[i];$('progress').textContent=(i+1)+' / '+order.length;$('dots').textContent='●'.repeat(i)+'○'.repeat(order.length-i);$('question').textContent=q.q;$('feedback').textContent='';$('next').classList.add('hidden');$('answers').innerHTML='';q.opts.forEach((x,k)=>{let b=document.createElement('button');b.textContent=(k+1)+'. '+x.label;b.onclick=()=>choose(k);$('answers').append(b)})}function choose(k){if(answered)return;answered=true;let q=order[i];if(q.opts[k].ok)score++;Array.from($('answers').children).forEach((b,j)=>{b.disabled=true;if(q.opts[j].ok)b.classList.add('good');else if(j===k)b.classList.add('bad')});$('feedback').textContent=q.opts[k].ok?'Верно! Так и работает условие.':'Проверь зелёный вариант. Можно попробовать ещё раз позже.';$('next').classList.remove('hidden');$('next').textContent=i===order.length-1?'Посмотреть результат':'Следующий вопрос →'}function next(){if(++i<order.length)render();else{show('finish');$('progress').textContent='Готово';$('result').textContent='Правильных ответов: '+score+' из '+order.length;$('stars').textContent=score>=9?'⭐⭐⭐':score>=6?'⭐⭐':'⭐'}}$('begin').onclick=init;$('again').onclick=init;$('next').onclick=next;document.addEventListener('keydown',e=>{if(!($('play').classList.contains('hidden'))){if(['1','2','3'].includes(e.key))choose(Number(e.key)-1);else if(e.key==='Enter'&&answered)next()}})</script></body></html>
