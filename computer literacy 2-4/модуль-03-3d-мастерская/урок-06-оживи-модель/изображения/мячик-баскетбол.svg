<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF3E0"/><stop offset="1" stop-color="#FFE0B2"/></linearGradient>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.8"><stop offset="0" stop-color="#FFB366"/><stop offset="0.6" stop-color="#F97316"/><stop offset="1" stop-color="#C2410C"/></radialGradient>
  </defs>
  <rect width="800" height="440" fill="url(#bgB)"/>
  <text x="400" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#C2410C" text-anchor="middle">Мяч прыгает: в полёте тянется, от удара сжимается 🏀</text>

  <!-- floor -->
  <rect x="0" y="360" width="800" height="80" fill="#D7A66A"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#B5833F" stroke-width="3"/>

  <!-- shadow -->
  <ellipse cx="400" cy="364" rx="40" ry="11" fill="#7C3A00">
    <animate attributeName="rx" values="24;60;24" keyTimes="0;0.5;1" dur="1.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 1 1;0 0 0.5 1"/>
    <animate attributeName="opacity" values="0.12;0.3;0.12" keyTimes="0;0.5;1" dur="1.3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- bouncing ball: outer translate, inner squash&stretch -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="400 150;400 315;400 150" keyTimes="0;0.5;1" dur="1.3s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 1 1;0 0 0.5 1"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 1;0.92 1.08;1.22 0.78;0.92 1.08;1 1" keyTimes="0;0.3;0.5;0.7;1" dur="1.3s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="45" fill="url(#ball)"/>
      <!-- seams -->
      <line x1="0" y1="-45" x2="0" y2="45" stroke="#7C2D12" stroke-width="3"/>
      <line x1="-45" y1="0" x2="45" y2="0" stroke="#7C2D12" stroke-width="3"/>
      <path d="M-42,-16 Q0,6 42,-16" fill="none" stroke="#7C2D12" stroke-width="3"/>
      <path d="M-42,16 Q0,-6 42,16" fill="none" stroke="#7C2D12" stroke-width="3"/>
    </g>
  </g>
</svg>
