<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgH" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E7F0FF"/><stop offset="1" stop-color="#CFE0F3"/></linearGradient>
    <radialGradient id="ball2" cx="0.38" cy="0.32" r="0.8"><stop offset="0" stop-color="#FFB366"/><stop offset="0.6" stop-color="#F97316"/><stop offset="1" stop-color="#C2410C"/></radialGradient>
  </defs>
  <rect width="800" height="440" fill="url(#bgH)"/>
  <text x="400" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#1D4ED8" text-anchor="middle">Бросок в корзину: мяч летит по дуге и — свиш! 🏀🥅</text>

  <!-- floor -->
  <rect x="0" y="380" width="800" height="60" fill="#9CB0C6"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#7C93AD" stroke-width="3"/>

  <!-- hoop on the right -->
  <g>
    <!-- pole -->
    <rect x="712" y="150" width="14" height="230" fill="#64748B"/>
    <!-- backboard -->
    <rect x="628" y="92" width="92" height="66" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="4"/>
    <rect x="648" y="118" width="40" height="26" fill="none" stroke="#EF4444" stroke-width="4"/>
    <!-- rim -->
    <ellipse cx="625" cy="170" rx="40" ry="10" fill="none" stroke="#F97316" stroke-width="6"/>
    <!-- net -->
    <g stroke="#CBD5E1" stroke-width="2" fill="none">
      <path d="M588,172 L600,220 L625,232 L650,220 L662,172"/>
      <path d="M600,172 L612,224"/><path d="M612,172 L612,228"/>
      <path d="M625,172 L625,232"/><path d="M638,172 L638,228"/><path d="M650,172 L638,224"/>
      <path d="M594,196 L656,196"/><path d="M602,218 L648,218"/>
    </g>
  </g>

  <!-- arc guide (dotted) -->
  <path d="M150,330 Q380,70 625,172" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 8" opacity="0.6"/>

  <!-- flying ball -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="150 330;300 150;470 110;625 172;625 250;625 250;150 330"
      keyTimes="0;0.28;0.5;0.68;0.82;0.9;1" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;1;1;0;0;1" keyTimes="0;0.28;0.5;0.68;0.82;0.9;0.98;1" dur="2.6s" repeatCount="indefinite"/>
    <circle cx="0" cy="0" r="26" fill="url(#ball2)"/>
    <line x1="0" y1="-26" x2="0" y2="26" stroke="#7C2D12" stroke-width="2.5"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#7C2D12" stroke-width="2.5"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" from="0 0 0" to="360 0 0" dur="1.1s" repeatCount="indefinite"/>
  </g>

  <!-- swish spark -->
  <text x="625" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#F97316" text-anchor="middle" opacity="0">
    свиш!
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.8;0.86;0.93;1" dur="2.6s" repeatCount="indefinite"/>
  </text>
</svg>
