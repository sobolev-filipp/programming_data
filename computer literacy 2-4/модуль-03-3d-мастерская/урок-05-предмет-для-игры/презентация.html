<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Урок 8 — Предмет для игры с ИИ</title>
<style>
  :root{--ink:#2b2350;--yellow:#ffd23f;--blue:#43b7ff;--green:#37c871;--pink:#ff7ab6;--purple:#8a5cf6;--violet:#5b7cfa;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;}
  html,body{height:100%;}
  body{background:#241a40;overflow:hidden;color:var(--ink);}
  .slide{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vh 6vw;}
  .slide.active{display:flex;animation:pop .4s ease;}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  .art{font-size:clamp(70px,16vh,150px);line-height:1;margin:10px 0 4px;}
  h1{font-size:clamp(30px,6.5vh,64px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.15);}
  h2{font-size:clamp(26px,5.2vh,50px);color:#fff;margin-bottom:8px;}
  p{font-size:clamp(20px,3.6vh,34px);color:#fff;max-width:24ch;margin-top:10px;line-height:1.35;}
  .card{background:#fff;border-radius:30px;padding:4vh 5vw;max-width:960px;box-shadow:0 16px 40px rgba(0,0,0,.3);}
  .card h2,.card p,.card h1{color:var(--ink);text-shadow:none;}
  .steps{list-style:none;text-align:left;font-size:clamp(19px,3.4vh,31px);color:var(--ink);margin-top:10px;}
  .steps li{margin:11px 0;display:flex;gap:14px;align-items:center;}
  .bignum{display:inline-flex;min-width:44px;height:44px;border-radius:14px;background:var(--purple);color:#fff;
    align-items:center;justify-content:center;font-weight:bold;font-size:24px;}
  .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
  .chip{background:#fff;border-radius:22px;padding:14px 18px;font-size:clamp(17px,2.8vh,26px);color:var(--ink);
    box-shadow:0 8px 18px rgba(0,0,0,.18);min-width:120px;}
  .chip .e{font-size:clamp(34px,7vh,58px);display:block;}
  .nav{position:fixed;bottom:14px;right:18px;display:flex;gap:10px;align-items:center;z-index:10;}
  .nav button{border:none;background:rgba(255,255,255,.9);border-radius:12px;font-size:24px;width:52px;height:46px;cursor:pointer;}
  .nav button:active{transform:translateY(2px);}
  .counter{position:fixed;bottom:20px;left:18px;color:#fff;font-size:18px;opacity:.7;z-index:10;}
  .tag{position:fixed;top:16px;left:20px;color:#fff;opacity:.65;font-size:17px;z-index:10;}
  .hintkey{position:fixed;top:16px;right:20px;color:#fff;opacity:.55;font-size:15px;z-index:10;}
  @media(max-width:600px){.hintkey{display:none;}}
</style>
</head>
<body>
<div class="tag">⚗️ Урок 8 · Модуль 3 «3D-мастерская»</div>
<div class="hintkey">← → или пробел листают слайды</div>
<div id="deck"></div>
<div class="counter" id="counter"></div>
<div class="nav">
  <button onclick="go(-1)">◀</button>
  <button onclick="go(1)">▶</button>
</div>

<script>
const BIP = `<svg viewBox="0 0 120 130" width="130" height="140" xmlns="http://www.w3.org/2000/svg">
  <line x1="60" y1="18" x2="60" y2="8" stroke="#43b7ff" stroke-width="5"/><circle cx="60" cy="7" r="7" fill="#ffd23f"/>
  <rect x="22" y="22" width="76" height="62" rx="20" fill="#ffd23f"/>
  <rect x="33" y="34" width="54" height="32" rx="13" fill="#2b2350"/>
  <circle cx="50" cy="50" r="8" fill="#43b7ff"/><circle cx="72" cy="50" r="8" fill="#43b7ff"/>
  <circle cx="50" cy="50" r="3.5" fill="#fff"/><circle cx="72" cy="50" r="3.5" fill="#fff"/>
  <path d="M49 73 q11 9 22 0" stroke="#2b2350" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="34" y="88" width="52" height="30" rx="14" fill="#43b7ff"/>
  <rect x="12" y="92" width="16" height="9" rx="4" fill="#ffd23f"/><rect x="92" y="92" width="16" height="9" rx="4" fill="#ffd23f"/>
</svg>`;

const SLIDES = [
  {bg:['#8a5cf6','#37c871'], html:`${BIP}<h1>Волшебный предмет для игры</h1><p>Придумаем вместе с ИИ и слепим! 🤖⚗️</p>`},
  {bg:['#37c871','#8a5cf6'], html:`<div class="art">🧪🗝️💎</div><h2>Что сделаем сегодня</h2><p>Придумаем <b>магический предмет</b> (зелье, ключ, амулет), ИИ подскажет идею — а слепим его <b>мы</b>!</p>`},
  {bg:['#5b7cfa','#8a5cf6'], html:`<div class="card"><h2>🤖 ИИ — помощник по идеям</h2><p>Расскажи словами: <b>какой предмет</b> и <b>для чего</b>. ИИ покажет, как он может выглядеть. <b>Идею даёт ИИ — лепишь ты!</b></p></div>`},
  {bg:['#8a5cf6','#5b7cfa'], html:`<div class="card"><h2>Описание для ИИ: что + какой + для чего</h2>
     <ul class="steps">
       <li><span class="bignum">1</span> 🧪 <b>Что?</b> зелье</li>
       <li><span class="bignum">2</span> 🎨 <b>Какой?</b> голубое, в бутылочке</li>
       <li><span class="bignum">3</span> ✨ <b>Для чего?</b> даёт скорость</li>
     </ul></div>`},
  {bg:['#37c871','#8a5cf6'], html:`<div class="art">🧍✨</div><h1>Физминутка</h1><p>«Варим зелье»: помешали большой котёл руками по кругу, бросили щепотку искр вверх, «буль-буль» присели-встали!</p>`},
  {bg:['#43b7ff','#8a5cf6'], html:`<div class="card"><h2>🧪 Лепим зелье (по шагам)</h2>
     <ul class="steps">
       <li><span class="bignum">1</span> 🍾 Бутылочка — куб (S)</li>
       <li><span class="bignum">2</span> 🟦 Жидкость — куб внутри, ярко</li>
       <li><span class="bignum">3</span> 🔘 Пробка — куб сверху</li>
     </ul></div>`},
  {bg:['#8a5cf6','#43b7ff'], html:`<div class="card"><h2>🆕 Секрет: стекло (Opacity)</h2><p>Чтобы бутылочка была <b>стеклянной</b>, выбери её грань и убавь ползунок <b>Opacity (Прозрачность)</b> — сквозь стекло видно жидкость! Так же — кристалл, лёд, окошко.</p></div>`},
  {bg:['#5b7cfa','#37c871'], html:`<div class="card"><h2>Другие предметы на выбор</h2>
     <div class="row">
       <div class="chip"><span class="e">🗝️</span>Ключ</div>
       <div class="chip"><span class="e">💎</span>Амулет</div>
       <div class="chip"><span class="e">🍎</span>Еда</div>
       <div class="chip"><span class="e">🪙</span>Монетка</div>
     </div></div>`},
  {bg:['#8a5cf6','#5b7cfa'], html:`<div class="art">⚗️🎮</div><h1>Игра «Зельевар»</h1><p>Бип диктует рецепт — брось ингредиенты в котёл по порядку!</p>`},
  {bg:['#43b7ff','#8a5cf6'], html:`<div class="art">💾</div><div class="card"><h2>Сохраняем (быстро!)</h2><p><b>File → Save</b>. Твой волшебный предмет готов — положим его в игру героя!</p></div>`},
  {bg:['#ffb03f','#43b7ff'], html:`<div class="art">⌨️🔤</div><h1>Тренажёр печати</h1><p>Три режима, уровень 8 — букв и слов ещё больше!</p>`},
  {bg:['#37c871','#8a5cf6'], html:`${BIP}<div class="art">⚗️🎉</div><h1>Ты — создатель артефактов!</h1><p>Викторина и звёзды ⭐</p>`},
];

const deck=document.getElementById('deck');
SLIDES.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide'; d.id='s'+i;
  d.style.background=`linear-gradient(135deg,${s.bg[0]},${s.bg[1]})`;
  d.innerHTML=s.html;
  deck.appendChild(d);
});
let cur=0;
function show(n){
  document.getElementById('s'+cur).classList.remove('active');
  cur=Math.max(0,Math.min(SLIDES.length-1,n));
  document.getElementById('s'+cur).classList.add('active');
  document.getElementById('counter').textContent=(cur+1)+' / '+SLIDES.length;
}
function go(step){show(cur+step);}
show(0);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(-1);}
  if(e.key==='Home')show(0);
  if(e.key==='End')show(SLIDES.length-1);
});
document.addEventListener('click',e=>{if(!e.target.closest('.nav'))go(1);});
</script>
</body>
</html>
