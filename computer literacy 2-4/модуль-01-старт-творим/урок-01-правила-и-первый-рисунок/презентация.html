<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Урок 1 — Привет, компьютер!</title>
<style>
  :root{--ink:#2b2350;--yellow:#ffd23f;--blue:#43b7ff;--green:#37c871;--pink:#ff7ab6;--purple:#8a5cf6;}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;}
  html,body{height:100%;}
  body{background:#1c1740;overflow:hidden;color:var(--ink);}
  .slide{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:5vh 6vw;}
  .slide.active{display:flex;animation:pop .4s ease;}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  .art{font-size:clamp(70px,16vh,150px);line-height:1;margin:10px 0 4px;}
  h1{font-size:clamp(30px,6.5vh,64px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.15);}
  h2{font-size:clamp(26px,5.2vh,50px);color:#fff;margin-bottom:8px;}
  p{font-size:clamp(20px,3.6vh,34px);color:#fff;max-width:22ch;margin-top:10px;line-height:1.35;}
  .card{background:#fff;border-radius:30px;padding:4vh 5vw;max-width:900px;box-shadow:0 16px 40px rgba(0,0,0,.3);}
  .card h2,.card p,.card h1{color:var(--ink);text-shadow:none;}
  .steps{list-style:none;text-align:left;font-size:clamp(20px,3.6vh,32px);color:var(--ink);margin-top:10px;}
  .steps li{margin:12px 0;display:flex;gap:14px;align-items:center;}
  .bignum{display:inline-flex;min-width:46px;height:46px;border-radius:14px;background:var(--blue);color:#fff;
    align-items:center;justify-content:center;font-weight:bold;font-size:26px;}
  .bip{width:clamp(90px,15vh,150px);height:auto;margin:6px;}
  .row{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;margin-top:12px;}
  .chip{background:#ffffff;border-radius:22px;padding:14px 18px;font-size:clamp(18px,3vh,28px);color:var(--ink);
    box-shadow:0 8px 18px rgba(0,0,0,.18);min-width:130px;}
  .chip .e{font-size:clamp(34px,7vh,58px);display:block;}
  .nav{position:fixed;bottom:14px;right:18px;display:flex;gap:10px;align-items:center;z-index:10;}
  .nav button{border:none;background:rgba(255,255,255,.9);border-radius:12px;font-size:24px;width:52px;height:46px;cursor:pointer;}
  .nav button:active{transform:translateY(2px);}
  .counter{position:fixed;bottom:20px;left:18px;color:#fff;font-size:18px;opacity:.7;z-index:10;}
  .tag{position:fixed;top:16px;left:20px;color:#fff;opacity:.65;font-size:17px;z-index:10;}
  .hintkey{position:fixed;top:16px;right:20px;color:#fff;opacity:.55;font-size:15px;z-index:10;}
  @media(max-width:600px){.hintkey{display:none;}}
</style>
</head>
<body>

<div class="tag">🚀 Урок 1 · Модуль 1</div>
<div class="hintkey">← → или пробел листают слайды</div>
<div id="deck"></div>
<div class="counter" id="counter"></div>
<div class="nav">
  <button onclick="go(-1)">◀</button>
  <button onclick="go(1)">▶</button>
</div>

<script>
const BIP = `<svg class="bip" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
  <line x1="60" y1="18" x2="60" y2="8" stroke="#43b7ff" stroke-width="5"/><circle cx="60" cy="7" r="7" fill="#ffd23f"/>
  <rect x="22" y="22" width="76" height="62" rx="20" fill="#ffd23f"/>
  <rect x="33" y="34" width="54" height="32" rx="13" fill="#2b2350"/>
  <circle cx="50" cy="50" r="8" fill="#43b7ff"/><circle cx="72" cy="50" r="8" fill="#43b7ff"/>
  <circle cx="50" cy="50" r="3.5" fill="#fff"/><circle cx="72" cy="50" r="3.5" fill="#fff"/>
  <path d="M49 73 q11 9 22 0" stroke="#2b2350" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="34" y="88" width="52" height="30" rx="14" fill="#43b7ff"/>
  <rect x="12" y="92" width="16" height="9" rx="4" fill="#ffd23f"/><rect x="92" y="92" width="16" height="9" rx="4" fill="#ffd23f"/>
</svg>`;

/* Каждый слайд: bg (градиент) + html-содержимое */
const SLIDES = [
  {bg:['#5b7cfa','#8a5cf6'], html:`${BIP}<h1>Привет, компьютер!</h1><p>Наш первый урок 🎉</p>`},
  {bg:['#43b7ff','#5b7cfa'], html:`${BIP}<h2>Это робот Бип 🤖</h2><p>Он будет с нами весь курс. Помашем ему! 👋</p>`},
  {bg:['#ffb03f','#ff7ab6'], html:`<div class="art">⭐</div><div class="card"><h2>У нас нет оценок!</h2><p>Мы копим <b>звёздочки</b> за старание. И <b>никогда</b> их не забираем!</p></div>`},
  {bg:['#8a5cf6','#5b7cfa'], html:`<div class="art">📜</div><h1>Правила волшебной мастерской</h1><p>Их всего несколько — запомним!</p>`},
  {bg:['#37c871','#43b7ff'], html:`<div class="art">🐢</div><h2>Заходим спокойно</h2><p>Не бежим и не толкаемся — компьютеры никуда не улетят!</p>`},
  {bg:['#ff7ab6','#ffb03f'], html:`<div class="art">🍎🚫</div><h2>Не едим у компьютера</h2><p>От крошек и сока он «болеет». Кушаем за столом!</p>`},
  {bg:['#43b7ff','#37c871'], html:`<div class="art">🪑</div><div class="card"><h2>Сидим ровно</h2><p>Спинка прямая · ножки на полу · экран на расстоянии вытянутой руки</p></div>`},
  {bg:['#5b7cfa','#43b7ff'], html:`<div class="art">👀</div><h2>Бережём глазки</h2><p>Иногда смотрим в окно на что-то далёкое и моргаем как бабочка 🦋</p>`},
  {bg:['#8a5cf6','#ff7ab6'], html:`<div class="art">🤝</div><h2>Бережём технику</h2><p>Не стучим по клавишам, не дёргаем провода, чужой компьютер не трогаем.</p>`},
  {bg:['#ffb03f','#37c871'], html:`<div class="art">✋</div><h2>Не получается — зовём!</h2><p>Поднимаем руку и просим учителя. Ошибаться — это нормально! 💪</p>`},
  {bg:['#37c871','#8a5cf6'], html:`<div class="art">🤖💪</div><h1>Физминутка «Мы — роботы»</h1><p>Встали! Руки-рычаги вверх-вниз, повороты, зарядились: би-и-п!</p>`},
  {bg:['#43b7ff','#5b7cfa'], html:`<h2 style="color:#fff">Знакомься, компьютер!</h2>
     <div class="row">
       <div class="chip"><span class="e">🖥️</span>Экран<br>(монитор)</div>
       <div class="chip"><span class="e">🖱️</span>Мышка</div>
       <div class="chip"><span class="e">⌨️</span>Клавиатура</div>
       <div class="chip"><span class="e">📦</span>Системный<br>блок</div>
     </div>`},
  {bg:['#8a5cf6','#43b7ff'], html:`<div class="art">⏻</div><div class="card"><h2>Будим компьютер</h2>
     <ul class="steps">
       <li><span class="bignum">1</span> Нашли кнопку ⏻</li>
       <li><span class="bignum">2</span> Нажали <b>один</b> раз</li>
       <li><span class="bignum">3</span> Ждём — он просыпается ⏳</li>
       <li><span class="bignum">4</span> Появился Рабочий стол 🖥️</li>
     </ul></div>`},
  {bg:['#ff7ab6','#8a5cf6'], html:`<div class="art">🖱️➡️</div><h2>Ловим стрелочку</h2><p>Двигаем мышку — по экрану бегает <b>стрелочка-курсор</b>. Поймай уголок!</p>`},
  {bg:['#43b7ff','#37c871'], html:`<div class="art">👆</div><div class="card"><h2>Левый клик</h2><p>Самая главная кнопка мышки — <b>левая</b>. Нажал один раз — <b>щёлк!</b> — выбрал.</p></div>`},
  {bg:['#5b7cfa','#ffb03f'], html:`<div class="art">🐧</div><div class="card"><h2>Открываем Tux Paint</h2><p>Наводим стрелочку на значок и делаем <b>два быстрых щелчка</b> (двойной клик).</p></div>`},
  {bg:['#43b7ff','#8a5cf6'], html:`<h2 style="color:#fff">Кнопки Tux Paint 🐧</h2>
     <div class="row">
       <div class="chip"><span class="e">🖌</span>Кисть</div>
       <div class="chip"><span class="e">🎟</span>Штамп</div>
       <div class="chip"><span class="e">🪣</span>Заливка</div>
       <div class="chip"><span class="e">✨</span>Волшебство</div>
       <div class="chip"><span class="e">🧽</span>Ластик</div>
       <div class="chip"><span class="e">↩️</span>Отмена</div>
     </div>`},
  {bg:['#ff7ab6','#37c871'], html:`<div class="art">🎨🦸🐱</div><h1>Рисуем любимого героя!</h1><p>Нарисуй <b>любимого героя</b> из мультика, игры или сказки. Кисть, цвета, штампы — твори!</p>`},
  {bg:['#ffb03f','#43b7ff'], html:`<div class="art">↩️</div><div class="card"><h2>Кнопка «Отмена»</h2><p>Ошибся? Нажал — и всё вернулось! Поэтому <b>пробуй смело</b>, ничего не испортишь.</p></div>`},
  {bg:['#8a5cf6','#5b7cfa'], html:`<div class="art">⏻😴</div><div class="card"><h2>Выключаем правильно</h2><p><b>«Пуск» → «Выключение»</b>. Компьютер укладываем спать по-доброму, а не выдёргиваем!</p></div>`},
  {bg:['#37c871','#ffb03f'], html:`${BIP}<h1>Вы — молодцы! 🎉</h1><p>А теперь — весёлая викторина и звёздочки ⭐</p>`},
];

const deck=document.getElementById('deck');
SLIDES.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide'; d.id='s'+i;
  d.style.background=`linear-gradient(135deg,${s.bg[0]},${s.bg[1]})`;
  d.innerHTML=s.html;
  deck.appendChild(d);
});

let cur=0;
function show(n){
  document.getElementById('s'+cur).classList.remove('active');
  cur=Math.max(0,Math.min(SLIDES.length-1,n));
  document.getElementById('s'+cur).classList.add('active');
  document.getElementById('counter').textContent=(cur+1)+' / '+SLIDES.length;
}
function go(step){show(cur+step);}
show(0);

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown'){e.preventDefault();go(1);}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();go(-1);}
  if(e.key==='Home')show(0);
  if(e.key==='End')show(SLIDES.length-1);
});
document.addEventListener('click',e=>{if(!e.target.closest('.nav'))go(1);});
</script>
</body>
</html>
