<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра — Догони звёздочку!</title>
<style>
  :root{--bg1:#43b7ff;--bg2:#8a5cf6;--ink:#2b2350;--yellow:#ffd23f;}
  *{box-sizing:border-box;margin:0;font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;user-select:none;}
  body{height:100vh;overflow:hidden;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:#fff;}
  #hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:12px 20px;font-size:26px;font-weight:bold;text-shadow:0 2px 0 rgba(0,0,0,.2);z-index:5;}
  #play{position:fixed;inset:0;}
  .star{position:absolute;font-size:56px;cursor:pointer;transform:scale(0);animation:grow .2s forwards;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));}
  @keyframes grow{to{transform:scale(1)}}
  .pop{animation:pop .3s forwards;pointer-events:none;}
  @keyframes pop{to{transform:scale(1.8);opacity:0}}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;z-index:10;}
  .card{background:#fff;color:var(--ink);border-radius:28px;padding:30px 34px;box-shadow:0 16px 40px rgba(0,0,0,.3);max-width:520px;}
  h1{font-size:34px;color:#4a2fb0;margin-bottom:6px;}
  p{font-size:20px;margin:10px 0;}
  button{border:none;border-radius:18px;background:var(--yellow);color:#6b4e00;font-size:26px;font-weight:bold;
    padding:16px 30px;margin-top:14px;cursor:pointer;}
  button:hover{background:#ffdf6a;}
  .bip{width:92px;height:auto;margin-bottom:4px;}
  .big{font-size:60px;margin:8px 0;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div id="hud" class="hidden">
  <div>⭐ Поймано: <span id="score">0</span></div>
  <div>⏱ <span id="time">45</span></div>
</div>
<div id="play" class="hidden"></div>

<!-- СТАРТ -->
<div id="intro" class="screen">
  <div class="card">
    <svg class="bip" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
      <line x1="60" y1="18" x2="60" y2="8" stroke="#43b7ff" stroke-width="5"/><circle cx="60" cy="7" r="7" fill="#ffd23f"/>
      <rect x="22" y="22" width="76" height="62" rx="20" fill="#ffd23f"/><rect x="33" y="34" width="54" height="32" rx="13" fill="#2b2350"/>
      <circle cx="50" cy="50" r="8" fill="#43b7ff"/><circle cx="72" cy="50" r="8" fill="#43b7ff"/>
      <circle cx="50" cy="50" r="3.5" fill="#fff"/><circle cx="72" cy="50" r="3.5" fill="#fff"/>
      <path d="M49 73 q11 9 22 0" stroke="#2b2350" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="34" y="88" width="52" height="30" rx="14" fill="#43b7ff"/>
    </svg>
    <h1>Догони звёздочку! ⭐</h1>
    <p>На экране появляются звёздочки. <b>Наводи стрелочку мышкой и щёлкай</b> по ним — лови как можно больше!</p>
    <p>Это тренировка для мышки. Готов?</p>
    <button onclick="startGame()">▶ Играть!</button>
  </div>
</div>

<!-- ИТОГ -->
<div id="over" class="screen hidden">
  <div class="card">
    <div class="big" id="medal">⭐</div>
    <h1 id="resTitle">Молодец!</h1>
    <p id="resText"></p>
    <button onclick="location.reload()">↺ Ещё разок</button>
  </div>
</div>

<script>
const EMOJIS = ["⭐","🌟","✨","💫"];
let score=0, timeLeft=45, spawnT=null, tickT=null, running=false;
const play=document.getElementById('play');

function startGame(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  play.classList.remove('hidden');
  score=0; timeLeft=45; running=true;
  document.getElementById('score').textContent=0;
  document.getElementById('time').textContent=45;
  spawnT=setInterval(spawnStar, 850);
  tickT=setInterval(tick, 1000);
  spawnStar();
}

function tick(){
  timeLeft--;
  document.getElementById('time').textContent=timeLeft;
  if(timeLeft<=0) endGame();
}

function spawnStar(){
  if(!running) return;
  const s=document.createElement('div');
  s.className='star';
  s.textContent=EMOJIS[Math.random()*EMOJIS.length|0];
  const m=70;
  const x=m+Math.random()*(window.innerWidth-2*m);
  const y=80+Math.random()*(window.innerHeight-160);
  s.style.left=x+'px'; s.style.top=y+'px';
  s.addEventListener('click',()=>{
    if(!running) return;
    score++; document.getElementById('score').textContent=score;
    s.className='star pop';
    setTimeout(()=>s.remove(),300);
  });
  play.appendChild(s);
  setTimeout(()=>{ if(s.parentNode&&!s.classList.contains('pop')) s.remove(); }, 2200);
}

function endGame(){
  running=false; clearInterval(spawnT); clearInterval(tickT);
  play.innerHTML=''; play.classList.add('hidden');
  document.getElementById('hud').classList.add('hidden');
  const medal = score>=25?'🏆':score>=15?'🥇':score>=8?'🌟':'⭐';
  const title = score>=15?'Супер! Ты мастер мыши!':score>=8?'Здорово получается!':'Молодец, что старался!';
  document.getElementById('medal').textContent=medal;
  document.getElementById('resTitle').textContent=title;
  document.getElementById('resText').textContent='Ты поймал ⭐ '+score+' звёздочек!';
  document.getElementById('over').classList.remove('hidden');
}
</script>
</body>
</html>
