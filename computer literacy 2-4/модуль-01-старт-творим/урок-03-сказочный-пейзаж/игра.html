<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра — Наведи порядок</title>
<style>
  :root{--bg1:#8a5cf6;--bg2:#43b7ff;--ink:#2b2350;--yellow:#ffd23f;--green:#37c871;--red:#ff7a7a;}
  *{box-sizing:border-box;margin:0;font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;user-select:none;}
  body{min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;
    align-items:center;justify-content:center;padding:16px;color:var(--ink);}
  .stage{width:min(820px,100%);background:#fff;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.25);
    padding:24px 22px 28px;text-align:center;}
  .bip{width:80px;height:auto;margin-bottom:2px;}
  h1{font-size:28px;color:#6a3fd0;margin:2px 0;}
  .sub{color:#7a76a0;font-size:16px;margin-bottom:12px;}
  .hint2{font-size:20px;font-weight:bold;min-height:28px;margin:8px 0;color:var(--ink);}
  .files{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:110px;margin-bottom:10px;}
  .file{width:110px;border:4px solid #eee;border-radius:18px;background:#f7f7ff;padding:10px 6px;cursor:pointer;
    transition:transform .1s,border-color .15s,background .15s;}
  .file:hover{transform:translateY(-3px);}
  .file.sel{border-color:var(--yellow);background:#fff7db;transform:translateY(-6px) scale(1.05);box-shadow:0 8px 16px rgba(0,0,0,.15);}
  .file .em{font-size:46px;line-height:1;}
  .file .nm{font-size:15px;margin-top:4px;color:var(--ink);word-break:break-all;}
  .folders{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
  .folder{width:180px;border:4px dashed #cbd0ff;border-radius:20px;background:#eef1ff;padding:14px 8px;cursor:pointer;
    transition:transform .1s,border-color .15s,background .15s;}
  .folder:hover{background:#e2e7ff;border-color:#9fa8ff;}
  .folder.bad{animation:shake .35s;border-color:var(--red);background:#ffe1e1;}
  .folder.good{border-color:var(--green);background:#d9f8e5;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .folder .em{font-size:44px;}.folder .nm{font-size:19px;font-weight:bold;margin-top:2px;}
  .folder .cnt{font-size:15px;color:#7a76a0;margin-top:2px;}
  .start,.next{border:none;border-radius:18px;background:var(--yellow);color:#6b4e00;font-size:24px;
    font-weight:bold;padding:15px 30px;margin-top:14px;cursor:pointer;}
  .start:hover,.next:hover{background:#ffdf6a;}
  .big{font-size:58px;margin:6px 0;}
  .hidden{display:none !important;}
  .tip{color:#9a96b8;font-size:14px;margin-top:12px;}
</style>
</head>
<body>
<div class="stage">
  <svg class="bip" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
    <line x1="60" y1="18" x2="60" y2="8" stroke="#43b7ff" stroke-width="5"/><circle cx="60" cy="7" r="7" fill="#ffd23f"/>
    <rect x="22" y="22" width="76" height="62" rx="20" fill="#ffd23f"/><rect x="33" y="34" width="54" height="32" rx="13" fill="#2b2350"/>
    <circle cx="50" cy="50" r="8" fill="#43b7ff"/><circle cx="72" cy="50" r="8" fill="#43b7ff"/>
    <circle cx="50" cy="50" r="3.5" fill="#fff"/><circle cx="72" cy="50" r="3.5" fill="#fff"/>
    <path d="M49 73 q11 9 22 0" stroke="#2b2350" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="34" y="88" width="52" height="30" rx="14" fill="#43b7ff"/>
  </svg>

  <div id="intro">
    <h1>Наведи порядок! 🧹</h1>
    <p class="sub">У кладовщика всё перепуталось. Разложи файлы по коробкам!</p>
    <button class="start" onclick="startGame()">▶ Играть!</button>
    <p class="tip">Возьми файл (щёлкни по нему), потом щёлкни нужную коробку.</p>
  </div>

  <div id="game" class="hidden">
    <div class="hint2" id="hint">Возьми файл — щёлкни по нему 👆</div>
    <div class="files" id="files"></div>
    <div class="folders" id="folders"></div>
  </div>

  <div id="result" class="hidden">
    <div class="big">🏆</div>
    <h1>Порядок наведён! 🎉</h1>
    <p class="sub" id="resText"></p>
    <button class="next" onclick="location.reload()">↺ Ещё разок</button>
  </div>
</div>

<script>
const FILES = [
  {em:"🖼️", nm:"кот.jpg",   type:"pic"},
  {em:"🎵", nm:"песенка.mp3", type:"mus"},
  {em:"📄", nm:"письмо.txt",  type:"txt"},
  {em:"🖼️", nm:"море.png",   type:"pic"},
  {em:"🎵", nm:"танец.mp3",   type:"mus"},
  {em:"📄", nm:"сказка.txt",  type:"txt"},
];
const FOLDERS = [
  {id:"pic", em:"📁", nm:"Картинки"},
  {id:"mus", em:"📁", nm:"Музыка"},
  {id:"txt", em:"📁", nm:"Тексты"},
];
let left=0, selIndex=-1, counts={pic:0,mus:0,txt:0};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

function startGame(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  left=FILES.length; selIndex=-1; counts={pic:0,mus:0,txt:0};
  renderFolders(); renderFiles();
}

function renderFiles(){
  const box=document.getElementById('files'); box.innerHTML='';
  shuffle(FILES.map((f,i)=>({f,i}))).forEach(({f,i})=>{
    if(f.done) return;
    const el=document.createElement('div');
    el.className='file'+(selIndex===i?' sel':'');
    el.innerHTML='<div class="em">'+f.em+'</div><div class="nm">'+f.nm+'</div>';
    el.onclick=()=>{selIndex=i; document.getElementById('hint').textContent='Теперь щёлкни коробку для «'+f.nm+'» 📁'; renderFiles();};
    box.appendChild(el);
  });
}

function renderFolders(){
  const box=document.getElementById('folders'); box.innerHTML='';
  FOLDERS.forEach(fo=>{
    const el=document.createElement('div');
    el.className='folder'; el.id='fo_'+fo.id;
    el.innerHTML='<div class="em">'+fo.em+'</div><div class="nm">'+fo.nm+'</div><div class="cnt" id="cnt_'+fo.id+'">'+counts[fo.id]+' шт.</div>';
    el.onclick=()=>drop(fo.id);
    box.appendChild(el);
  });
}

function drop(folderId){
  if(selIndex<0){ document.getElementById('hint').textContent='Сначала возьми файл — щёлкни по нему 👆'; return; }
  const f=FILES[selIndex];
  const fo=document.getElementById('fo_'+folderId);
  if(f.type===folderId){
    f.done=true; left--; counts[folderId]++;
    document.getElementById('cnt_'+folderId).textContent=counts[folderId]+' шт.';
    fo.classList.add('good'); setTimeout(()=>fo.classList.remove('good'),400);
    document.getElementById('hint').textContent='✅ Верно! Молодец! ⭐';
    selIndex=-1; renderFiles();
    if(left===0) setTimeout(finish,500);
  } else {
    fo.classList.add('bad'); setTimeout(()=>fo.classList.remove('bad'),400);
    document.getElementById('hint').textContent='Ой, не та коробка! Посмотри на значок 👀';
  }
}

function finish(){
  document.getElementById('game').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  document.getElementById('resText').textContent='Ты разложил все '+FILES.length+' файла по коробкам! Кладовщик говорит спасибо ⭐';
}
</script>
</body>
</html>
