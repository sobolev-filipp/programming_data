<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра — Придумай для ИИ</title>
<style>
  :root{--bg1:#8a5cf6;--bg2:#43b7ff;--ink:#2b2350;--yellow:#ffd23f;--green:#37c871;}
  *{box-sizing:border-box;margin:0;font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;user-select:none;}
  body{min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));display:flex;
    align-items:center;justify-content:center;padding:16px;color:var(--ink);}
  .stage{width:min(760px,100%);background:#fff;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.25);
    padding:24px 22px 30px;text-align:center;}
  .bip{width:80px;height:auto;margin-bottom:2px;}
  h1{font-size:27px;color:#6a3fd0;margin:2px 0;}
  .sub{color:#7a76a0;font-size:16px;margin-bottom:10px;}
  .rowlabel{font-size:16px;color:#7a76a0;font-weight:bold;margin:12px 0 4px;text-align:left;}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .chip{border:3px solid #eee;border-radius:16px;background:#f7f7ff;padding:8px 12px;cursor:pointer;font-size:18px;
    transition:transform .08s,border-color .15s,background .15s;}
  .chip:hover{transform:translateY(-2px);}
  .chip.sel{border-color:var(--yellow);background:#fff7db;transform:scale(1.05);}
  .chip .e{font-size:26px;display:block;}
  .phrase{margin:16px 0 4px;font-size:26px;font-weight:bold;color:#2b2350;min-height:40px;}
  .go{border:none;border-radius:18px;background:var(--yellow);color:#6b4e00;font-size:22px;font-weight:bold;
    padding:14px 28px;margin-top:10px;cursor:pointer;}
  .go:hover{background:#ffdf6a;}
  .go:disabled{opacity:.4;cursor:default;}
  .fb{font-size:20px;font-weight:bold;min-height:52px;margin-top:12px;color:#2e9e5b;}
  .start{border:none;border-radius:18px;background:var(--yellow);color:#6b4e00;font-size:24px;font-weight:bold;
    padding:15px 30px;margin-top:12px;cursor:pointer;}
  .start:hover{background:#ffdf6a;}
  .hidden{display:none !important;}
  .tip{color:#9a96b8;font-size:14px;margin-top:12px;}
</style>
</head>
<body>
<div class="stage">
  <svg class="bip" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg">
    <line x1="60" y1="18" x2="60" y2="8" stroke="#43b7ff" stroke-width="5"/><circle cx="60" cy="7" r="7" fill="#ffd23f"/>
    <rect x="22" y="22" width="76" height="62" rx="20" fill="#ffd23f"/><rect x="33" y="34" width="54" height="32" rx="13" fill="#2b2350"/>
    <circle cx="50" cy="50" r="8" fill="#43b7ff"/><circle cx="72" cy="50" r="8" fill="#43b7ff"/>
    <circle cx="50" cy="50" r="3.5" fill="#fff"/><circle cx="72" cy="50" r="3.5" fill="#fff"/>
    <path d="M49 73 q11 9 22 0" stroke="#2b2350" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="34" y="88" width="52" height="30" rx="14" fill="#43b7ff"/>
  </svg>

  <div id="intro">
    <h1>Придумай для ИИ! ✨</h1>
    <p class="sub">Собери описание героя из слов — так мы «просим» нейросеть нарисовать картинку!</p>
    <button class="start" onclick="startGame()">▶ Играть!</button>
    <p class="tip">Формула: <b>какой + кто + где</b>. Выбери по одному из каждой строчки.</p>
  </div>

  <div id="game" class="hidden">
    <div class="rowlabel">1) Какой?</div><div class="row" id="rowKakoy"></div>
    <div class="rowlabel">2) Кто?</div><div class="row" id="rowKto"></div>
    <div class="rowlabel">3) Где?</div><div class="row" id="rowGde"></div>
    <div class="phrase" id="phrase">…</div>
    <button class="go" id="go" onclick="reveal()" disabled>✨ Это нарисует ИИ!</button>
    <div class="fb" id="fb"></div>
  </div>
</div>

<script>
const KAKOY = [{w:'золотой',e:'⭐'},{w:'радужный',e:'🌈'},{w:'синий',e:'💙'},{w:'волшебный',e:'✨'},{w:'огненный',e:'🔥'}];
const KTO   = [{w:'дракон',e:'🐉'},{w:'кот',e:'🐱'},{w:'робот',e:'🤖'},{w:'единорог',e:'🦄'},{w:'щенок',e:'🐶'}];
const GDE   = [{w:'в космосе',e:'🚀'},{w:'на радуге',e:'🌈'},{w:'в замке',e:'🏰'},{w:'под водой',e:'🌊'},{w:'в лесу',e:'🌲'}];
let sel={kakoy:null,kto:null,gde:null};

function startGame(){
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  sel={kakoy:null,kto:null,gde:null};
  render('rowKakoy',KAKOY,'kakoy');
  render('rowKto',KTO,'kto');
  render('rowGde',GDE,'gde');
  update();
}
function render(rowId,list,key){
  const box=document.getElementById(rowId); box.innerHTML='';
  list.forEach((item,i)=>{
    const c=document.createElement('div');
    c.className='chip'+(sel[key]===i?' sel':'');
    c.innerHTML='<span class="e">'+item.e+'</span>'+item.w;
    c.onclick=()=>{sel[key]=i; render(rowId,list,key); update();};
    box.appendChild(c);
  });
}
function update(){
  const ph=document.getElementById('phrase');
  const parts=[];
  if(sel.kakoy!==null) parts.push(KAKOY[sel.kakoy].w);
  if(sel.kto!==null) parts.push(KTO[sel.kto].w);
  if(sel.gde!==null) parts.push(GDE[sel.gde].w);
  ph.textContent = parts.length? '«'+parts.join(' ')+'»' : '…';
  const all = sel.kakoy!==null && sel.kto!==null && sel.gde!==null;
  document.getElementById('go').disabled = !all;
  document.getElementById('fb').textContent='';
}
function reveal(){
  const em = KAKOY[sel.kakoy].e+KTO[sel.kto].e+GDE[sel.gde].e;
  const phrase='«'+KAKOY[sel.kakoy].w+' '+KTO[sel.kto].w+' '+GDE[sel.gde].w+'»';
  document.getElementById('fb').innerHTML='✅ Отличное описание! '+em+'<br>Такую картинку нарисует нейросеть! ⭐<br><span style="color:#7a76a0;font-size:15px">Нажми слова ещё раз — придумай новое!</span>';
}
</script>
</body>
</html>
