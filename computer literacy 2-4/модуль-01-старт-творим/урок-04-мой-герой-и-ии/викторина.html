<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Мой герой и ИИ</title>
<style>
  :root{
    --bg1:#8a5cf6; --bg2:#43b7ff; --card:#ffffff; --ink:#2b2350;
    --yellow:#ffd23f; --blue:#43b7ff; --green:#37c871; --red:#ff7a7a; --soft:#eef0ff;
  }
  *{box-sizing:border-box;font-family:'Comic Sans MS','Segoe UI',system-ui,sans-serif;}
  body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;align-items:center;justify-content:center;padding:16px;color:var(--ink);}
  .stage{width:min(760px,100%);background:var(--card);border-radius:28px;
    box-shadow:0 18px 50px rgba(0,0,0,.25);padding:28px 26px 32px;position:relative;overflow:hidden;}
  .bip{width:96px;height:96px;display:block;margin:0 auto 6px;}
  h1{text-align:center;font-size:30px;margin:6px 0 2px;color:#5a34c0;}
  .sub{text-align:center;color:#7a76a0;font-size:17px;margin:0 0 18px;}
  .btn{display:block;width:100%;border:none;border-radius:18px;padding:16px 18px;margin:10px 0;
    font-size:20px;cursor:pointer;background:var(--soft);color:var(--ink);text-align:left;
    transition:transform .08s, background .15s;border:3px solid transparent;}
  .btn:hover{transform:translateY(-2px);background:#e2e6ff;}
  .btn .num{display:inline-flex;width:34px;height:34px;border-radius:10px;background:var(--blue);
    color:#fff;align-items:center;justify-content:center;font-weight:bold;margin-right:12px;vertical-align:middle;}
  .btn.ok{background:#d9f8e5;border-color:var(--green);}
  .btn.no{background:#ffe1e1;border-color:var(--red);}
  .start{background:var(--yellow);color:#6b4e00;text-align:center;font-size:24px;font-weight:bold;}
  .start:hover{background:#ffdf6a;}
  .pic{font-size:64px;text-align:center;margin:6px 0 10px;line-height:1;}
  .q{font-size:24px;text-align:center;font-weight:bold;margin:4px 0 16px;}
  .bar{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;}
  .dot{width:16px;height:16px;border-radius:50%;background:#eee;}
  .dot.done{background:var(--green);}
  .dot.now{background:var(--yellow);transform:scale(1.25);}
  .feedback{text-align:center;font-size:22px;min-height:30px;margin-top:8px;font-weight:bold;}
  .count{text-align:center;font-size:20px;color:#7a76a0;margin-top:4px;}
  .stars{font-size:52px;text-align:center;letter-spacing:4px;margin:10px 0;}
  .next{background:var(--blue);color:#fff;text-align:center;font-size:22px;font-weight:bold;max-width:260px;margin:16px auto 0;}
  .hint{text-align:center;color:#9a96b8;font-size:14px;margin-top:14px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="stage">
  <svg class="bip" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <line x1="60" y1="16" x2="60" y2="6" stroke="#43b7ff" stroke-width="4"/>
    <circle cx="60" cy="6" r="6" fill="#ffd23f"/>
    <rect x="24" y="20" width="72" height="60" rx="18" fill="#ffd23f"/>
    <rect x="34" y="32" width="52" height="30" rx="12" fill="#2b2350"/>
    <circle cx="50" cy="47" r="7" fill="#43b7ff"/><circle cx="72" cy="47" r="7" fill="#43b7ff"/>
    <circle cx="50" cy="47" r="3" fill="#fff"/><circle cx="72" cy="47" r="3" fill="#fff"/>
    <path d="M50 70 q10 8 20 0" stroke="#2b2350" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="36" y="84" width="48" height="26" rx="12" fill="#43b7ff"/>
    <rect x="16" y="88" width="14" height="8" rx="4" fill="#ffd23f"/>
    <rect x="90" y="88" width="14" height="8" rx="4" fill="#ffd23f"/>
  </svg>

  <div id="intro">
    <h1>Викторина Бипа</h1>
    <p class="sub">«Мой герой и ИИ» 🦸🤖 — 10 вопросов</p>
    <button class="btn start" onclick="startQuiz()">▶ Начать!</button>
    <p class="hint">Учитель читает вопрос вслух. Отвечаем кнопкой или клавишами 1 · 2 · 3</p>
  </div>

  <div id="quiz" class="hidden">
    <div class="bar" id="bar"></div>
    <div class="pic" id="pic">🤖</div>
    <div class="q" id="qtext"></div>
    <div id="answers"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <div id="result" class="hidden">
    <h1>Ура! Молодцы! 🎉</h1>
    <div class="stars" id="stars"></div>
    <p class="count" id="score"></p>
    <p class="sub" id="praise"></p>
    <button class="btn next" onclick="location.reload()">↺ Ещё разок</button>
  </div>
</div>

<script>
const QUESTIONS = [
  { pic:"🤖", q:"Умный помощник в компьютере, который рисует и придумывает, — это…",
    a:["Нейросеть (ИИ)","Пылесос"], c:0 },
  { pic:"🗣️", q:"Как нейросеть понимает, что нарисовать?",
    a:["По нашим словам","По запаху"], c:0 },
  { pic:"🎯", q:"Чтобы ИИ нарисовал точнее, слова надо…",
    a:["Сделать точнее (кто+какой+где)","Кричать громче"], c:0 },
  { pic:"🐧", q:"Своего героя мы рисовали в программе…",
    a:["Tux Paint","Калькулятор"], c:0 },
  { pic:"🅰️", q:"Каким инструментом подписали имя героя?",
    a:["Текст (буква A)","Заливка"], c:0 },
  { pic:"❤️", q:"Кто вкладывает в ИИ идеи и доброту?",
    a:["Человек","Никто"], c:0 },
  { pic:"🖌️", q:"Героя можно создать…",
    a:["И руками, и словами","Только руками"], c:0 },
  { pic:"🛡️", q:"С нейросетью на уроке работаем…",
    a:["Вместе с учителем","Тайком"], c:0 },
  { pic:"🐉", q:"Где пример хорошего описания для ИИ?",
    a:["«золотой дракон на радуге»","«просто нарисуй что-нибудь»"], c:0 },
  { pic:"💾", q:"Что делаем с рисунком героя, чтобы не потерять?",
    a:["Сохраняем","Стираем"], c:0 },
];

let order=[], idx=0, correct=0, answered=false;
function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function startQuiz(){
  order = shuffle([...Array(QUESTIONS.length).keys()]);
  idx=0; correct=0;
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  buildBar(); showQuestion();
}
function buildBar(){
  const bar=document.getElementById('bar'); bar.innerHTML='';
  for(let i=0;i<order.length;i++){const d=document.createElement('div');d.className='dot';d.id='dot'+i;bar.appendChild(d);}
}
function showQuestion(){
  answered=false;
  const qq=QUESTIONS[order[idx]];
  document.getElementById('pic').textContent=qq.pic;
  document.getElementById('qtext').textContent=qq.q;
  document.getElementById('feedback').textContent='';
  for(let i=0;i<order.length;i++){const d=document.getElementById('dot'+i);d.className='dot'+(i<idx?' done':i===idx?' now':'');}
  const opts=qq.a.map((t,i)=>({t,ok:i===qq.c}));
  shuffle(opts);
  const box=document.getElementById('answers'); box.innerHTML='';
  opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='btn'; b.innerHTML='<span class="num">'+(i+1)+'</span>'+o.t;
    b.onclick=()=>choose(b,o.ok);
    box.appendChild(b);
  });
}
function choose(btn,ok){
  if(answered) return; answered=true;
  const fb=document.getElementById('feedback');
  const buttons=[...document.querySelectorAll('#answers .btn')];
  buttons.forEach(b=>b.onclick=null);
  if(ok){ btn.classList.add('ok'); correct++; fb.textContent='✅ Верно! Молодец! ⭐'; fb.style.color='#37c871'; }
  else{
    btn.classList.add('no');
    buttons.forEach(b=>{ if(b.textContent.replace(/^\d/,'').trim()===correctText()) b.classList.add('ok'); });
    fb.textContent='Почти! Правильный ответ подсвечен 💛'; fb.style.color='#f0a500';
  }
  setTimeout(nextQuestion,1400);
}
function correctText(){const qq=QUESTIONS[order[idx]];return qq.a[qq.c];}
function nextQuestion(){ idx++; if(idx>=order.length){ showResult(); return; } showQuestion(); }
function showResult(){
  document.getElementById('quiz').classList.add('hidden');
  const r=document.getElementById('result'); r.classList.remove('hidden');
  const total=order.length;
  const starCount=Math.max(1,Math.round(correct/total*5));
  document.getElementById('stars').textContent='⭐'.repeat(starCount)+'☆'.repeat(5-starCount);
  document.getElementById('score').textContent='Правильных ответов: '+correct+' из '+total;
  let praise = correct===total ? 'Идеально! Ты и художник, и повелитель ИИ! 🏆'
            : correct>=total*0.6 ? 'Здорово! Ты отлично всё запомнил! 👏'
            : 'Молодец, что старался! В следующий раз будет ещё лучше! 💪';
  document.getElementById('praise').textContent=praise;
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('quiz').classList.contains('hidden')) return;
  const n=parseInt(e.key); if(n>=1&&n<=3){const b=document.querySelectorAll('#answers .btn')[n-1]; if(b&&!answered) b.click();}
});
</script>
</body>
</html>
