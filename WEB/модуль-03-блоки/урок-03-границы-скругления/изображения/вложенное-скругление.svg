<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="760" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="380" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Вложенное скругление: внутренний радиус = внешний − отступ</text>
<rect x="40" y="78" width="190" height="190" rx="34" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
<rect x="58" y="96" width="154" height="154" rx="34" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
<text x="135" y="177" text-anchor="middle" font-size="13" fill="#0369a1" font-family="'Consolas','Courier New',monospace">inner</text>
<circle cx="204" cy="72" r="16" fill="#dc2626"/>
<text x="204" y="78" text-anchor="middle" font-size="18" fill="#fff">✗</text>
<text x="135" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">inner: 34px (= внешний)</text>
<text x="135" y="314" text-anchor="middle" font-size="12" fill="#64748b">у угла щель шире — некрасиво</text>
<rect x="270" y="78" width="190" height="190" rx="34" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
<rect x="288" y="96" width="154" height="154" rx="0" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
<text x="365" y="177" text-anchor="middle" font-size="13" fill="#0369a1" font-family="'Consolas','Courier New',monospace">inner</text>
<circle cx="434" cy="72" r="16" fill="#dc2626"/>
<text x="434" y="78" text-anchor="middle" font-size="18" fill="#fff">✗</text>
<text x="365" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">inner: 0 (острый)</text>
<text x="365" y="314" text-anchor="middle" font-size="12" fill="#64748b">острое внутри круглого — плохо</text>
<rect x="500" y="78" width="190" height="190" rx="34" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/>
<rect x="518" y="96" width="154" height="154" rx="16" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
<text x="595" y="177" text-anchor="middle" font-size="13" fill="#0369a1" font-family="'Consolas','Courier New',monospace">inner</text>
<circle cx="664" cy="72" r="16" fill="#16a34a"/>
<text x="664" y="78" text-anchor="middle" font-size="18" fill="#fff">✓</text>
<text x="595" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#16a34a">inner: 16px (34 − 18)</text>
<text x="595" y="314" text-anchor="middle" font-size="12" fill="#64748b">линии параллельны — идеально</text>
<rect x="180" y="352" width="400" height="34" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="380" y="374" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6" font-family="'Consolas','Courier New',monospace">inner-radius = outer-radius − padding</text>
</svg>