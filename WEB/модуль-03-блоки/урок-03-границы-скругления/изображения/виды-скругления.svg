<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="760" height="340" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="380" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">border-radius: не только круг</text>
