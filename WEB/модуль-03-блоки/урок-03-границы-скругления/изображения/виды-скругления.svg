<text x="380" y="290" text-anchor="middle" font-size="13" fill="#475569">4 угла по часовой: border-radius: верх-лево  верх-право  низ-право  низ-лево</text>
<text x="380" y="314" text-anchor="middle" font-size="12" fill="#94a3b8">«таблетка» = очень большой радиус на невысоком блоке</text>
