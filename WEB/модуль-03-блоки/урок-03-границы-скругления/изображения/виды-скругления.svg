<text x="120" y="225" text-anchor="middle" font-size="13" font-family="'Consolas','Courier New',monospace" fill="#334155">14px</text>
<text x="120" y="245" text-anchor="middle" font-size="12" fill="#64748b">мягкие углы</text>
<path d="M 296 80 L 370 80 L 370 154 A 46 46 0 0 1 324 200 L 250 200 L 250 126 A 46 46 0 0 1 296 80 Z" fill="#c7f9cc" stroke="#059669" stroke-width="2.5"/>
<text x="310" y="225" text-anchor="middle" font-size="13" font-family="'Consolas','Courier New',monospace" fill="#334155">46px 0 46px 0</text>
<text x="310" y="245" text-anchor="middle" font-size="12" fill="#64748b">«капля» (по углам)</text>
<rect x="440" y="118" width="160" height="60" rx="30" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/>
<text x="520" y="153" text-anchor="middle" font-size="13" font-family="'Consolas','Courier New',monospace" fill="#92400e">999px</text>
<text x="520" y="225" text-anchor="middle" font-size="13" font-family="'Consolas','Courier New',monospace" fill="#334155">border-radius: 999px</text>
<text x="520" y="245" text-anchor="middle" font-size="12" fill="#64748b">«таблетка» (бейдж, кнопка)</text>
<circle cx="680" cy="140" r="58" fill="#fdba74" stroke="#ea580c" stroke-width="2.5"/>
