<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 Неоновые и стеклянные карточки</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            font-family: "Segoe UI", system-ui, sans-serif;
            /* градиентный фон */
            background: linear-gradient(135deg, #6d28d9, #db2777, #f59e0b);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 40px;
        }

        /* градиентный текст */
        .title {
            width: 100%;
            text-align: center;
            font-size: 64px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(90deg, #a5f3fc, #ffffff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        /* стеклянная карточка */
        .glass {
            width: 260px;
            padding: 28px;
            border-radius: 20px;
            text-align: center;
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }
        .glass h3 { margin-bottom: 8px; font-size: 20px; }
        .glass p  { opacity: 0.9; margin-bottom: 18px; font-size: 14px; }

        /* неоновая кнопка */
        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 999px;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            background: linear-gradient(90deg, #6366f1, #ec4899);
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.6);
            transition: 0.2s;
        }
        .btn:hover { box-shadow: 0 0 32px rgba(236, 72, 153, 0.95); transform: translateY(-2px); }
        .btn:focus { outline: 3px solid #fff; outline-offset: 3px; }

        /* карточка с градиентной рамкой */
        .grad-border {
            width: 260px;
            padding: 28px;
            border: 3px solid transparent;
            border-radius: 20px;
            text-align: center;
            background:
                linear-gradient(#1e1b4b, #1e1b4b) padding-box,
                linear-gradient(135deg, #22d3ee, #a855f7) border-box;
            color: #fff;
        }
        .grad-border h3 { margin-bottom: 8px; }
        .grad-border p { opacity: 0.85; font-size: 14px; margin-bottom: 18px; }

        .disc {
            width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 14px;
            background: conic-gradient(#f43f5e, #f59e0b, #eab308, #22c55e, #0ea5e9, #a855f7, #f43f5e);
        }
    </style>
</head>
<body>
    <h1 class="title">CYBER CARDS</h1>

    <!-- стеклянная -->
    <article class="glass">
        <div class="disc"></div>
        <h3>💎 Premium</h3>
        <p>Матовое стекло + конический диск.</p>
        <a href="#" class="btn">Выбрать</a>
    </article>

    <!-- градиентная рамка -->
    <article class="grad-border">
        <h3>⚡ Neon</h3>
        <p>Карточка с градиентной рамкой и неоновой кнопкой.</p>
        <a href="#" class="btn">Активировать</a>
    </article>
</body>
</html>
