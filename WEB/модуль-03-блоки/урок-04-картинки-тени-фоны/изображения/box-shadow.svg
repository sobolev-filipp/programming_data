<text x="380" y="300" text-anchor="middle" font-size="13" font-family="'Consolas','Courier New',monospace" fill="#475569">box-shadow: смещениеX  смещениеY  размытие  [растяжение]  цвет;</text>
<text x="380" y="326" text-anchor="middle" font-size="12" fill="#94a3b8">Можно несколько теней через запятую. inset — тень внутрь блока.</text>
