<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="780" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="390" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Путь своего шрифта: от файла до текста</text>

  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- 1. Файл -->
  <rect x="30" y="90" width="180" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="120" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#5b21b6">1. Файл шрифта</text>
  <text x="120" y="150" text-anchor="middle" font-size="40">🔤</text>
  <text x="120" y="188" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="14" fill="#334155">fonts/mario.woff2</text>

  <!-- стрелка 1 -->
  <line x1="212" y1="150" x2="288" y2="150" stroke="#7c3aed" stroke-width="3" marker-end="url(#arr)"/>
  <text x="250" y="138" text-anchor="middle" font-size="12" fill="#7c3aed" font-weight="700">url()</text>
  <text x="250" y="172" text-anchor="middle" font-size="11" fill="#64748b">путь к файлу</text>

  <!-- 2. @font-face -->
  <rect x="292" y="80" width="230" height="140" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="407" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#0369a1">2. Описываем @font-face</text>
  <g font-family="'Consolas','Courier New',monospace" font-size="13" fill="#334155">
    <text x="308" y="140">@font-face {</text>
    <text x="320" y="162" fill="#7c3aed">font-family: MyGameFont</text>
    <text x="320" y="184" fill="#e34f26">src: url(...)</text>
    <text x="308" y="206">}</text>
  </g>

  <!-- стрелка 2 -->
  <line x1="524" y1="150" x2="600" y2="150" stroke="#7c3aed" stroke-width="3" marker-end="url(#arr)"/>
  <text x="562" y="138" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="700">по имени</text>
  <text x="562" y="172" text-anchor="middle" font-size="11" fill="#64748b">font-family</text>

  <!-- 3. Текст -->
  <rect x="604" y="90" width="150" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="679" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">3. Текст</text>
  <text x="679" y="172" text-anchor="middle" font-size="46" font-weight="800" fill="#16a34a">Аа</text>
  <text x="679" y="196" text-anchor="middle" font-size="12" fill="#64748b">красивый шрифт!</text>

  <text x="390" y="290" text-anchor="middle" font-size="14" fill="#475569">Сначала подключить (url в @font-face) — потом применить (font-family). Оба шага обязательны.</text>
</svg>
