<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Постер · Музыка будущего</title>

    <!-- 1. Подключаем два шрифта с Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #0f0f23;
            color: #f5f5f5;
            text-align: center;
            /* 2. Применяем спокойный шрифт для всего текста */
            font-family: "Montserrat", sans-serif;
            padding: 60px 20px;
        }
        h1 {
            /* выразительный «плакатный» шрифт для заголовка */
            font-family: "Bebas Neue", sans-serif;
            font-size: 96px;
            letter-spacing: 4px;
            line-height: 0.95;
            margin: 0;
            color: #ff2e63;
        }
        .sub {
            font-size: 22px;
            font-weight: 300;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-top: 10px;
        }
        .date {
            color: #08d9d6;
            font-weight: 700;
            margin-top: 24px;
            font-size: 18px;
        }
        .btn {
            display: inline-block;
            margin-top: 28px;
            padding: 14px 30px;
            background: #ff2e63;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .btn:hover { background: #08d9d6; color: #0f0f23; transform: translateY(-2px); }
    </style>
</head>
<body>
    <h1>МУЗЫКА<br>БУДУЩЕГО</h1>
    <p class="sub">Фестиваль электронной музыки</p>
    <p class="date">15 июля · 19:00 · Парк «Заря»</p>
    <a href="#" class="btn">Купить билет</a>
</body>
</html>
