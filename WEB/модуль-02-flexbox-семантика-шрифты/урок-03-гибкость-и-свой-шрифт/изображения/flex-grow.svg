<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="440" rx="16" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">flex-grow — кто занимает свободное место</text>

  <!-- row 1: no grow -->
  <text x="40" y="78" font-size="15" font-weight="700" fill="#4338ca">flex-grow: 0 (по умолчанию) — по содержимому, справа пусто</text>
  <rect x="40" y="88" width="640" height="72" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="52" y="100" width="120" height="48" rx="8" fill="#6366f1"/>
  <rect x="180" y="100" width="120" height="48" rx="8" fill="#6366f1"/>
  <rect x="308" y="100" width="120" height="48" rx="8" fill="#6366f1"/>
  <rect x="440" y="100" width="228" height="48" rx="8" fill="#e2e8f0"/>
  <text x="554" y="129" text-anchor="middle" font-size="14" fill="#94a3b8">пустое место</text>

  <!-- row 2: all grow 1 -->
  <text x="40" y="206" font-size="15" font-weight="700" fill="#16a34a">flex: 1 всем — делят место поровну, растягиваясь</text>
  <rect x="40" y="216" width="640" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <rect x="52" y="228" width="200" height="48" rx="8" fill="#22c55e"/>
  <rect x="260" y="228" width="200" height="48" rx="8" fill="#22c55e"/>
  <rect x="468" y="228" width="200" height="48" rx="8" fill="#22c55e"/>

  <!-- row 3: middle grow 2 -->
  <text x="40" y="334" font-size="15" font-weight="700" fill="#ea580c">средней flex: 2 — забирает вдвое больше свободного места</text>
  <rect x="40" y="344" width="640" height="72" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <rect x="52" y="356" width="150" height="48" rx="8" fill="#f97316"/>
  <rect x="210" y="356" width="308" height="48" rx="8" fill="#fb923c"/>
  <text x="364" y="385" text-anchor="middle" font-size="14" fill="#7c2d12">flex: 2</text>
  <rect x="526" y="356" width="142" height="48" rx="8" fill="#f97316"/>
</svg>
