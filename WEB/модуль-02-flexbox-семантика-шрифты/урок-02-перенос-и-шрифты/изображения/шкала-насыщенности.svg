<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="780" height="340" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="390" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Насыщенность шрифта: font-weight</text>
  <text x="390" y="62" text-anchor="middle" font-size="14" fill="#64748b">чем больше число — тем толще буквы (от 100 до 900)</text>

  <!-- подсветка ключевых значений 400 и 700 -->
  <rect x="284" y="82" width="72" height="212" rx="10" fill="#dcfce7"/>
  <rect x="530" y="82" width="72" height="212" rx="10" fill="#ede9fe"/>

  <!-- колонки: 100..900 -->
  <g text-anchor="middle">
    <!-- 100 -->
    <text x="80"  y="150" font-size="40" font-weight="100" fill="#334155">Аа</text>
    <rect x="52"  y="180" width="56" height="6"  rx="3" fill="#94a3b8"/>
    <text x="80"  y="230" font-size="15" fill="#64748b">100</text>

    <!-- 200 -->
    <text x="160" y="150" font-size="40" font-weight="200" fill="#334155">Аа</text>
    <rect x="132" y="178" width="56" height="9"  rx="4" fill="#94a3b8"/>
    <text x="160" y="230" font-size="15" fill="#64748b">200</text>

    <!-- 300 -->
    <text x="240" y="150" font-size="40" font-weight="300" fill="#334155">Аа</text>
    <rect x="212" y="176" width="56" height="12" rx="4" fill="#94a3b8"/>
    <text x="240" y="230" font-size="15" fill="#64748b">300</text>
    <text x="240" y="252" font-size="12" fill="#94a3b8">тонкий</text>

    <!-- 400 (обычный) -->
    <text x="320" y="150" font-size="40" font-weight="400" fill="#15803d">Аа</text>
    <rect x="292" y="174" width="56" height="15" rx="5" fill="#16a34a"/>
    <text x="320" y="230" font-size="15" font-weight="700" fill="#15803d">400</text>
    <text x="320" y="252" font-size="12" fill="#15803d" font-weight="700">обычный</text>
    <text x="320" y="272" font-size="11" fill="#15803d">= normal</text>

    <!-- 500 -->
    <text x="400" y="150" font-size="40" font-weight="500" fill="#334155">Аа</text>
    <rect x="372" y="172" width="56" height="17" rx="6" fill="#64748b"/>
    <text x="400" y="230" font-size="15" fill="#64748b">500</text>

    <!-- 600 -->
    <text x="480" y="150" font-size="40" font-weight="600" fill="#334155">Аа</text>
    <rect x="452" y="170" width="56" height="20" rx="6" fill="#64748b"/>
    <text x="480" y="230" font-size="15" fill="#64748b">600</text>

    <!-- 700 (жирный) -->
    <text x="566" y="150" font-size="40" font-weight="700" fill="#5b21b6">Аа</text>
    <rect x="538" y="168" width="56" height="23" rx="7" fill="#7c3aed"/>
    <text x="566" y="230" font-size="15" font-weight="700" fill="#5b21b6">700</text>
    <text x="566" y="252" font-size="12" fill="#5b21b6" font-weight="700">жирный</text>
    <text x="566" y="272" font-size="11" fill="#5b21b6">= bold</text>

    <!-- 800 -->
    <text x="646" y="150" font-size="40" font-weight="800" fill="#334155">Аа</text>
    <rect x="618" y="166" width="56" height="26" rx="7" fill="#334155"/>
    <text x="646" y="230" font-size="15" fill="#64748b">800</text>

    <!-- 900 -->
    <text x="726" y="150" font-size="40" font-weight="900" fill="#1e293b">Аа</text>
    <rect x="698" y="164" width="56" height="30" rx="8" fill="#0f172a"/>
    <text x="726" y="230" font-size="15" fill="#64748b">900</text>
    <text x="726" y="252" font-size="12" fill="#94a3b8">чёрный</text>
  </g>

  <text x="390" y="318" text-anchor="middle" font-size="13" fill="#94a3b8">Словами: normal = 400, bold = 700. С Google Fonts нужное начертание надо подключить.</text>
</svg>
