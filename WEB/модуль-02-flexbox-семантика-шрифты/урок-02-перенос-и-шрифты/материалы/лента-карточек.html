<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<title>Лента карточек — пример урока</title>
<style>
  body { font-family: "Montserrat", sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 28px 20px; }
  h1 { font-family: "Oswald", sans-serif; font-weight: 700; letter-spacing: 1px; text-align: center; font-size: 34px; margin: 0 0 24px; }

  .cards {
    display: flex;
    flex-wrap: wrap;            /* перенос карточек в сетку */
    gap: 20px;
    justify-content: center;    /* ряды по центру */
    max-width: 960px;
    margin: 0 auto;
  }
  .card {
    width: 220px;
    background: #1e293b;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 10px 24px rgba(0,0,0,.3);
  }
  .cover {
    height: 110px;
    border-radius: 10px;
    margin-bottom: 12px;
    background: linear-gradient(135deg, #6366f1, #38bdf8);
  }
  .card h3 { font-family: "Oswald", sans-serif; margin: 0 0 6px; color: #38bdf8; font-weight: 700; }
  .card p  { margin: 0; font-size: 14px; color: #cbd5e1; }
</style>
</head>
<body>
    <h1>🎮 Топ игр недели</h1>
    <section class="cards">
        <article class="card"><div class="cover"></div><h3>Space Run</h3><p>Космический раннер с рекордами.</p></article>
        <article class="card"><div class="cover"></div><h3>Dungeon Cat</h3><p>Кот-герой в подземельях.</p></article>
        <article class="card"><div class="cover"></div><h3>Pixel Racer</h3><p>Пиксельные ночные гонки.</p></article>
        <article class="card"><div class="cover"></div><h3>Sky Islands</h3><p>Летающие острова и загадки.</p></article>
        <article class="card"><div class="cover"></div><h3>Neon Jump</h3><p>Неоновый платформер.</p></article>
        <article class="card"><div class="cover"></div><h3>Robo War</h3><p>Битва боевых роботов.</p></article>
    </section>
</body>
</html>
