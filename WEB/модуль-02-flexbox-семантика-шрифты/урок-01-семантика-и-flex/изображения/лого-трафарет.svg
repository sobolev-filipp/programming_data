<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" rx="16" fill="#f8fafc"/>
  <text x="360" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Трафарет: строй символ внутри круга</text>

  <!-- stencil circle -->
  <circle cx="230" cy="230" r="140" fill="#eef2ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- inscribed square -->
  <rect x="131" y="131" width="198" height="198" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="4 5"/>
  <!-- cross guides -->
  <line x1="230" y1="70" x2="230" y2="390" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="70" y1="230" x2="390" y2="230" stroke="#a5b4fc" stroke-width="1.5" stroke-dasharray="4 5"/>
  <!-- inner circle (safe zone) -->
  <circle cx="230" cy="230" r="95" fill="none" stroke="#c7d2fe" stroke-width="1.5" stroke-dasharray="3 5"/>

  <!-- sample symbol inside (simple rocket silhouette, faint) -->
  <g opacity="0.9">
    <polygon points="230,170 248,196 248,280 212,280 212,196" fill="#6366f1"/>
    <polygon points="212,256 212,286 196,286" fill="#4338ca"/>
    <polygon points="248,256 248,286 264,286" fill="#4338ca"/>
    <circle cx="230" cy="214" r="12" fill="#38bdf8"/>
  </g>

  <!-- hints -->
  <g font-size="15" fill="#334155">
    <text x="430" y="120" font-weight="700" fill="#4338ca">Подсказки</text>
    <text x="430" y="150">• Символ — внутри круга,</text>
    <text x="443" y="172">по центру креста.</text>
    <text x="430" y="202">• Крупные детали в центре,</text>
    <text x="443" y="224">мелочь — ближе к краю.</text>
    <text x="430" y="254">• Оставь воздух у края</text>
    <text x="443" y="276">(не прижимай к границе).</text>
    <text x="430" y="306">• 1–2 цвета, простые формы.</text>
    <text x="430" y="336">• Должен узнаваться даже</text>
    <text x="443" y="358">размером с монетку.</text>
  </g>
</svg>
