<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Таблица рекордов</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Montserrat", sans-serif;
            background: #f8fafc;
            color: #1e293b;
            max-width: 620px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        h1 { text-align: center; color: #ea580c; }

        .scores {
            border-collapse: collapse;      /* одинарные рамки */
            width: 100%;
            box-shadow: 0 6px 20px rgba(0,0,0,.08);
            border-radius: 12px;
            overflow: hidden;               /* чтобы скруглились углы */
        }
        .scores caption {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .scores th, .scores td {
            border: 1px solid #e2e8f0;
            padding: 12px 16px;
            text-align: left;
        }
        .scores thead th {
            background-color: #ea580c;       /* цветная шапка */
            color: white;
        }
        .scores tbody tr:nth-child(even) {
            background-color: #fff7ed;       /* зебра */
        }
        .scores tbody tr:hover {
            background-color: #ffedd5;        /* подсветка строки */
        }
        .scores td:last-child { font-weight: 700; text-align: right; }
    </style>
</head>
<body>
    <h1>🏆 Турнир по Mario Kart</h1>

    <table class="scores">
        <caption>Таблица рекордов сезона</caption>
        <thead>
            <tr>
                <th colspan="3">🏁 Финальный зачёт</th>
            </tr>
            <tr>
                <th>Место</th>
                <th>Игрок</th>
                <th>Очки</th>
            </tr>
        </thead>
        <tbody>
            <tr><td>🥇 1</td><td>Максим</td><td>980</td></tr>
            <tr><td>🥈 2</td><td>Аня</td><td>870</td></tr>
            <tr><td>🥉 3</td><td>Игорь</td><td>815</td></tr>
            <tr><td>4</td><td>Лена</td><td>760</td></tr>
            <tr><td>5</td><td>Тимур</td><td>705</td></tr>
        </tbody>
    </table>
</body>
</html>
