<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 3: Таблицы</title>
<style>
  :root{
    --bg1:#d97706; --bg2:#dc2626; --card:#ffffff; --ink:#1f2937;
    --accent:#d97706; --ok:#16a34a; --bad:#dc2626; --soft:#fef3c7;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// Урок 3 (Модуль 3): таблицы + 🔁 повтор модуля 3 и flex из М2 + смешные + на подумать.
// Длина варианта НЕ выдаёт правильный ответ (проверено скриптом).
const QUESTIONS = [
  {q:"Из какого тега строится ВСЯ таблица?",
   a:["&lt;table&gt;","&lt;tr&gt; для всей таблицы","&lt;td&gt;","&lt;grid&gt;"],c:0,
   e:"&lt;table&gt; — контейнер всей таблицы."},
  {q:"Какой тег — это одна СТРОКА таблицы?",
   a:["&lt;td&gt;","&lt;tr&gt;","&lt;th&gt;","&lt;row&gt;"],c:1,
   e:"&lt;tr&gt; (table row) — строка. Внутри неё — ячейки."},
  {q:"Какой тег — обычная ЯЧЕЙКА с данными?",
   a:["&lt;td&gt;","&lt;tr&gt;","&lt;th&gt;","&lt;cell&gt;"],c:0,
   e:"&lt;td&gt; (table data) — ячейка с данными."},
  {q:"Чем &lt;th&gt; отличается от &lt;td&gt;?",
   a:["&lt;th&gt; — жирный заголовок","Ничем, они одинаковые","&lt;th&gt; всегда крупнее остальных","&lt;th&gt; только для картинок"],c:0,
   e:"&lt;th&gt; — ячейка-заголовок, браузер делает её жирной и по центру."},
  {q:"Сколько столбцов в таблице, где в строке три &lt;td&gt;?",
   a:["Один","Два","Три","Зависит от CSS"],c:2,
   e:"Сколько &lt;td&gt; в строке — столько столбцов. Тут три."},
  {q:"Что делает <code>&lt;caption&gt;</code>?",
   a:["Подпись таблицы","Отдельную строку данных","Ячейку","Рамку"],c:0,
   e:"&lt;caption&gt; — подпись таблицы, пишется сразу после &lt;table&gt;."},
  {q:"Что убирает <code>border-collapse: collapse</code>?",
   a:["Двойные рамки","Вообще все рамки у таблицы","Текст","Цвет"],c:0,
   e:"Убирает двойные рамки — они становятся одинарными. Обязательный приём."},
  {q:"Как объединить ячейки ПО ГОРИЗОНТАЛИ?",
   a:["colspan","rowspan для горизонтали","merge","join"],c:0,
   e:"colspan=\"2\" растягивает ячейку на 2 столбца (по горизонтали)."},
  {q:"Как объединить ячейки ПО ВЕРТИКАЛИ?",
   a:["rowspan","colspan для вертикали","vspan","merge"],c:0,
   e:"rowspan=\"2\" растягивает ячейку на 2 строки (по вертикали)."},
  {q:"Написал <code>&lt;th colspan=\"2\"&gt;</code>. Что с лишней ячейкой в строке?",
   a:["Убрать лишнюю ячейку","Оставить как есть","Добавить ещё одну рядом","Ничего не делать"],c:0,
   e:"Растянул на 2 столбца — убери одну обычную ячейку, иначе таблица поедет."},
  {q:"Как сделать «зебру» (чередование цвета строк)?",
   a:["tbody tr:nth-child(even)","свойство table:stripe включить","tr:hover","tr:even"],c:0,
   e:"tbody tr:nth-child(even) красит чётные строки — получается зебра."},
  {q:"Куда заворачивают строки с ДАННЫМИ таблицы?",
   a:["&lt;thead&gt;","&lt;tbody&gt;","&lt;caption&gt;","&lt;tfoot&gt;"],c:1,
   e:"&lt;tbody&gt; — тело таблицы (данные); &lt;thead&gt; — шапка."},
  {q:"Что развернёт Emmet <code>table>tr*3>td*3</code>?",
   a:["Таблицу 3×3","Три отдельные таблицы подряд","1 строку","Список"],c:0,
   e:"Таблицу из 3 строк по 3 ячейки — 3×3."},

  {q:"🔁 Урок 2: из какого тега делают меню сайта?",
   a:["&lt;ul&gt; без маркеров","&lt;table&gt; со строками","&lt;menu&gt;","&lt;nav&gt; вместо списка"],c:0,
   e:"Меню — список &lt;ul&gt; с list-style: none и display: flex."},
  {q:"🔁 Модуль 2: как подключают шрифт с Google Fonts?",
   a:["&lt;link&gt; + font-family","устаревшим тегом &lt;font&gt;","@table","src=шрифт"],c:0,
   e:"Подключить &lt;link&gt; в &lt;head&gt; + применить font-family."},
  {q:"🔁 Урок 1: как открыть ссылку в новой вкладке?",
   a:["target=\"_blank\"","атрибут new равно tab","href=\"blank\"","open"],c:0,
   e:"target=\"_blank\"."},
  {q:"🔁 Модуль 2: что делает <code>url()</code> в CSS?",
   a:["Путь к файлу","Красит весь текст подряд","Ссылку","Строку"],c:0,
   e:"url() — путь к файлу (шрифт, картинка, фон)."},

  {q:"😄 У таблицы двойные толстые рамки. Что добавить?",
   a:["border-collapse: collapse","просто убрать border: none","padding","width: 100%"],c:0,
   e:"border-collapse: collapse схлопывает двойные рамки в одинарные."},
  {q:"😄 После colspan таблица «съехала». Почему?",
   a:["Лишняя ячейка в строке","Данных слишком мало совсем","Нет caption","Забыл tbody"],c:0,
   e:"Растянутая ячейка заняла место — лишний &lt;td&gt; надо убрать."},

  {q:"🤔 Почему на таблицах нельзя верстать всю страницу?",
   a:["Таблица — только для данных","Наоборот, так очень удобно верстать","Таблицы слишком медленные","Их просто запретили"],c:0,
   e:"Таблица — для табличных данных. Расположение блоков — Flexbox (модуль 2) и Grid."},
  {q:"🤔 Зачем разделять таблицу на &lt;thead&gt; и &lt;tbody&gt;?",
   a:["Для смысла и стилей","Просто для красоты вида","Так грузится быстрее","Это обязательно всегда и везде"],c:0,
   e:"Смысловое деление: шапка и тело отдельно — удобно и понятно браузеру."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>📊 Таблицы</h1>
    <div class="sub">Викторина по уроку 3 · Модуль 3 · WEB</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Таблицы — под контролем! 📊';}
  else if(pct>=70){em='🎉';msg='Отлично! Таблицы строишь уверенно.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: table>tr>td, colspan/rowspan, border-collapse.';}
  else {em='💪';msg='Начало положено! Загляни в самоучитель — там по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
