<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина с оценкой — Модуль 3: Контент</title>
<style>
  :root{
    --bg1:#2563eb; --bg2:#059669; --card:#ffffff; --ink:#1f2937;
    --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; --soft:#e0e7ff;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:24px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:21px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:18px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:14px 18px;font-size:17px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:15px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:15px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .grade{font-size:92px;font-weight:800;margin:6px 0;line-height:1}
  .scoreline{font-size:20px;color:#475569;margin-bottom:6px}
  .emoji{font-size:64px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// Викторина С ОЦЕНКОЙ по всему Модулю 3 (ссылки, списки, таблицы) + повтор flex/шрифтов.
// Длина варианта НЕ выдаёт правильный ответ (проверено скриптом).
const QUESTIONS = [
  {q:"Какой тег делает ссылку?",a:["&lt;a&gt;","&lt;link&gt;","&lt;href&gt;","&lt;url&gt;"],c:0,e:"&lt;a&gt; — ссылка. &lt;link&gt; — подключение CSS."},
  {q:"Какой атрибут задаёт адрес ссылки?",a:["href","src","rel","адрес задаёт тег link"],c:0,e:"href — адрес ссылки; src — у картинок."},
  {q:"Как открыть ссылку в новой вкладке?",a:["target=\"_blank\"","атрибут new равно tab","open=\"new\"","href=\"_blank\""],c:0,e:"target=\"_blank\" открывает в новой вкладке."},
  {q:"Что означает <code>href=\"about.html\"</code> (без https)?",a:["Свою страницу рядом","Чужой сайт где-то в интернете","Ошибку в коде","Картинку"],c:0,e:"Просто имя файла — это своя страница рядом."},
  {q:"Как сделать ссылку-письмо?",a:["href=\"mailto:...\"","почту открывает атрибут email","href=\"send:...\"","href=\"tel:...\""],c:0,e:"mailto: открывает почтовую программу."},
  {q:"Как работает якорь (прыжок к разделу)?",a:["id у раздела + href=\"#имя\"","переход делают через target раздела","jump=\"имя\"","href=\"раздел\""],c:0,e:"id=\"имя\" на разделе и href=\"#имя\" в ссылке."},
  {q:"В каком порядке пишут псевдоклассы ссылок?",a:["link, visited, hover, active","можно писать в совершенно любом порядке","hover, active, link, visited","active, hover, visited, link"],c:0,e:"LoVe HAte: link → visited → hover → active."},
  {q:"Как убрать подчёркивание у ссылки?",a:["text-decoration: none","свойство underline со значением off","text-align: none","border: none"],c:0,e:"text-decoration: none убирает подчёркивание."},

  {q:"Какой тег — маркированный список?",a:["&lt;ul&gt;","&lt;ol&gt;","&lt;li&gt;","&lt;dl&gt;"],c:0,e:"&lt;ul&gt; — маркированный (с точками)."},
  {q:"Какой тег — нумерованный список?",a:["&lt;ol&gt;","&lt;ul&gt;","список с номерами делает тег num","&lt;list&gt;"],c:0,e:"&lt;ol&gt; — нумерованный (ordered)."},
  {q:"Каким тегом оформляют пункт списка?",a:["&lt;li&gt;","&lt;p&gt;","&lt;item&gt;","&lt;point&gt;"],c:0,e:"&lt;li&gt; — один пункт списка."},
  {q:"Как убрать маркеры у списка?",a:["list-style: none","маркеры убирает свойство marker off","display: none","list-hide: true"],c:0,e:"list-style: none убирает маркеры (нужно для меню)."},
  {q:"Куда кладут вложенный список?",a:["Внутрь &lt;li&gt;","Между пунктами снаружи списка","В секцию &lt;head&gt;","В отдельный файл"],c:0,e:"Вложенный список — внутрь &lt;li&gt;, до его &lt;/li&gt;."},
  {q:"Для чего нужен список &lt;dl&gt;?",a:["Пары «термин — описание»","Только для картинок в ряд","Для меню навигации","Для чисел"],c:0,e:"&lt;dl&gt; + &lt;dt&gt; + &lt;dd&gt; — словарик/FAQ."},
  {q:"Из чего чаще делают меню сайта?",a:["Из &lt;ul&gt; без маркеров","Из большой таблицы данных","Из картинок","Из заголовков"],c:0,e:"Меню — список &lt;ul&gt; с list-style:none и flex."},
  {q:"Что ставит пункты меню в ряд?",a:["display: flex","list-style: row","text-align: center делает ряд","float"],c:0,e:"display: flex (+ gap) — приём из модуля 2."},

  {q:"Из какого тега строится вся таблица?",a:["&lt;table&gt;","&lt;tr&gt;","&lt;td&gt;","таблицу целиком строит тег grid"],c:0,e:"&lt;table&gt; — контейнер всей таблицы."},
  {q:"Какой тег — одна строка таблицы?",a:["&lt;tr&gt;","&lt;td&gt;","&lt;th&gt;","&lt;row&gt;"],c:0,e:"&lt;tr&gt; — строка; внутри неё ячейки."},
  {q:"Какой тег — обычная ячейка с данными?",a:["&lt;td&gt;","&lt;tr&gt;","&lt;th&gt;","&lt;cell&gt;"],c:0,e:"&lt;td&gt; — ячейка с данными."},
  {q:"Что особенного у &lt;th&gt;?",a:["Жирный заголовок","Обычная ячейка как все","Ячейка только для картинок","Это строка целиком"],c:0,e:"&lt;th&gt; — заголовок: жирный и по центру."},
  {q:"Что делает <code>&lt;caption&gt;</code>?",a:["Подпись таблицы","Отдельную строку данных","Ячейку","Рамку"],c:0,e:"&lt;caption&gt; — подпись таблицы."},
  {q:"Что делает <code>colspan</code>?",a:["Объединяет по горизонтали","Объединяет строго по вертикали","Удаляет ячейку","Добавляет рамку"],c:0,e:"colspan растягивает ячейку на столбцы."},
  {q:"Что делает <code>rowspan</code>?",a:["Объединяет по вертикали","Объединяет по горизонтали в ряд","Удаляет строку","Заливает цветом"],c:0,e:"rowspan растягивает ячейку на строки."},
  {q:"Что делает <code>border-collapse: collapse</code>?",a:["Убирает двойные рамки","Убирает вообще все рамки совсем","Меняет цвет","Прячет текст"],c:0,e:"Схлопывает двойные рамки в одинарные."},
  {q:"Как сделать «зебру» строк?",a:["tbody tr:nth-child(even)","свойство table-stripe включить","tr:hover подсветка","tr:even"],c:0,e:"nth-child(even) красит чётные строки."},

  {q:"🔁 Модуль 2: что ставит блоки в ряд?",a:["display: flex","float: left всегда","display: block","в ряд ставит text-align"],c:0,e:"display: flex — дети контейнера в ряд."},
  {q:"🔁 Модуль 2: чем задают промежутки во флексе?",a:["gap","margin каждому вручную по кругу","padding контейнера","border между ними"],c:0,e:"gap — промежутки между детьми flex."},
  {q:"🔁 Модуль 2: как подключают шрифт Google Fonts?",a:["&lt;link&gt; + font-family","устаревшим тегом &lt;font&gt;","@table","src=шрифт"],c:0,e:"&lt;link&gt; в &lt;head&gt; + font-family в CSS."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🧩 Викторина с оценкой · Модуль 3</h1>
    <div class="sub">Контент: ссылки, списки, таблицы · ответь честно</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Верно: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Узнать оценку →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Верно: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let grade,color,msg,em;
  if(pct>=90){ grade=5; color='#16a34a'; em='🏆'; msg='Отлично! Модуль 3 освоен на пятёрку.'; }
  else if(pct>=70){ grade=4; color='#2563eb'; em='🎉'; msg='Хорошо! Пара тем на повтор — и будет «5».'; }
  else if(pct>=50){ grade=3; color='#d97706'; em='👍'; msg='Удовлетворительно. Загляни в итого.md слабых тем.'; }
  else { grade=2; color='#dc2626'; em='💪'; msg='Нужно повторить модуль. Пройди уроки и попробуй снова.'; }
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <div class="scoreline">Правильно ${score} из ${QUESTIONS.length} · ${pct}%</div>
      <div class="grade" style="color:${color}">${grade}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
