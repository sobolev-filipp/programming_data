<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 4: Картинки, тени и фоны</title>
<style>
  :root{
    --bg1:#14b8a6; --bg2:#0891b2; --card:#ffffff; --ink:#1f2937;
    --accent:#0d9488; --ok:#16a34a; --bad:#dc2626; --soft:#ccfbf1;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// Урок 4 (Модуль 3): картинки в блоках, тени, фоны + 🔁 повторение модуля + смешные + на подумать.
const QUESTIONS = [
  {q:"Что делает <code>object-fit: cover</code>?",
   a:["Растягивает фото (искажает)","Заполняет блок без искажений, лишнее обрезает","Уменьшает фото","Убирает картинку"],c:1,
   e:"cover заполняет блок и аккуратно обрезает лишнее — без растяжения."},
  {q:"Какое значение object-fit ИСКАЖАЕТ картинку?",
   a:["cover","contain","fill","none"],c:2,
   e:"fill (по умолчанию) растягивает под блок — фото искажается."},
  {q:"Что делает <code>aspect-ratio: 16 / 9</code>?",
   a:["Красит фон","Держит пропорцию блока (высота от ширины)","Обрезает текст","Добавляет тень"],c:1,
   e:"aspect-ratio фиксирует пропорцию; высота считается сама от ширины."},
  {q:"Какая «золотая пара» для ровных обложек?",
   a:["width + height","aspect-ratio + object-fit: cover","margin + padding","border + outline"],c:1,
   e:"aspect-ratio держит форму, object-fit: cover красиво заполняет."},
  {q:"Из чего состоит box-shadow (по порядку)?",
   a:["цвет размер","смещение-X смещение-Y размытие [растяжение] цвет","только цвет","ширина высота"],c:1,
   e:"X, Y, blur, [spread], цвет. Цвет обычно rgba (полупрозрачный)."},
  {q:"Каким должен быть ЦВЕТ тени, чтобы выглядела красиво?",
   a:["сплошной чёрный","полупрозрачный rgba","ярко-красный","белый"],c:1,
   e:"rgba(0,0,0,.15) — полупрозрачная тень смотрится естественно."},
  {q:"Что делает <code>inset</code> в box-shadow?",
   a:["убирает тень","делает тень ВНУТРЬ блока","красит рамку","повторяет фон"],c:1,
   e:"inset — тень рисуется внутри блока (вдавленный эффект)."},
  {q:"Чем ставят картинку ФОНОМ блока?",
   a:["&lt;img&gt;","background-image: url(...)","object-fit","content"],c:1,
   e:"background-image: url(\"...\") — картинка как фон блока."},
  {q:"Что делает <code>background-size: cover</code>?",
   a:["повторяет фон","заполняет блок фоном (как object-fit: cover)","уменьшает фон","убирает фон"],c:1,
   e:"cover масштабирует фон, чтобы заполнить блок целиком."},
  {q:"Как запретить повтор фоновой картинки плиткой?",
   a:["background-repeat: no-repeat","background-size: 0","repeat: off","no-tile"],c:0,
   e:"background-repeat: no-repeat — фон не повторяется."},
  {q:"Когда брать &lt;img&gt;, а когда background-image?",
   a:["всегда img","img — содержание (фото), background — украшение/фон","всегда background","без разницы"],c:1,
   e:"Фото-содержание — &lt;img&gt; с alt; фон/украшение — background-image."},
  {q:"Зачем карточке с обложкой <code>overflow: hidden</code>?",
   a:["для тени","чтобы обложка обрезалась по скруглённым углам","для текста","для фона"],c:1,
   e:"overflow: hidden обрезает содержимое по скруглению карточки."},

  {q:"🔁 Урок 3: как сделать «таблетку»?",
   a:["border-radius: 50%","border-radius: 999px","outline","aspect-ratio"],c:1,
   e:"Большой радиус 999px на невысоком блоке."},
  {q:"🔁 Урок 2: что делает box-sizing: border-box?",
   a:["рисует тень","width включает padding и border","убирает рамку","растягивает фон"],c:1,
   e:"Размеры становятся предсказуемыми."},
  {q:"🔁 Модуль 2: что делает url() в CSS?",
   a:["красит","путь к файлу (шрифт, картинка, фон)","ссылку","список"],c:1,
   e:"url() — путь к файлу; теперь используем для background-image."},
  {q:"🔁 Модуль 1: как сделать полупрозрачный цвет?",
   a:["opacity у текста","rgba(...) с alpha","transparent","filter"],c:1,
   e:"rgba/hsla с alpha 0–1 — пригодилось для цвета тени."},

  {q:"😄 Все фото в ряду карточек разной высоты, ряд «скачет». Что добавить обложкам?",
   a:["margin","aspect-ratio + object-fit: cover","border","opacity"],c:1,
   e:"aspect-ratio выровняет высоту, cover впишет фото."},
  {q:"😄 Аватарка сплющилась в овал внутри блока. Что поставить?",
   a:["object-fit: cover","display: none","repeat","inset"],c:0,
   e:"object-fit: cover (или квадратное фото) — не будет искажений."},

  {q:"🤔 Почему тень лучше делать через rgba, а не сплошным цветом?",
   a:["так быстрее","полупрозрачная тень естественно ложится на любой фон","rgba ярче","сплошной запрещён"],c:1,
   e:"Полупрозрачная тень смешивается с фоном и выглядит мягко."},
  {q:"🤔 Зачем сжимать фото перед загрузкой на сайт?",
   a:["для красоты","тяжёлые фото тормозят загрузку сайта","чтобы обрезать","это не нужно"],c:1,
   e:"Большие файлы замедляют сайт; сжимай (squoosh) и бери .webp."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🖼️ Картинки, тени, фоны</h1>
    <div class="sub">Викторина по уроку 4 · Модуль 3 (WEB)</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Обложки и тени — как в настоящем магазине! 🖼️';}
  else if(pct>=70){em='🎉';msg='Отлично! Картинки в блоках освоены уверенно.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: object-fit: cover, aspect-ratio, box-shadow.';}
  else {em='💪';msg='Начало положено! Загляни в самоучитель — там по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
