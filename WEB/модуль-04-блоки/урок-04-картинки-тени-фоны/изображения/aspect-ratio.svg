<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="760" height="300" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="380" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">aspect-ratio: фиксируем пропорции блока</text>
<rect x="60" y="80" width="120" height="120" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
<text x="120" y="146" text-anchor="middle" font-size="18" font-weight="700" font-family="'Consolas','Courier New',monospace" fill="#334155">1 / 1</text>
<text x="120" y="235" text-anchor="middle" font-size="12" fill="#64748b">квадрат (аватар)</text>
<rect x="220" y="84" width="150" height="112" rx="10" fill="#c7f9cc" stroke="#059669" stroke-width="2.5"/>
<text x="295" y="146" text-anchor="middle" font-size="18" font-weight="700" font-family="'Consolas','Courier New',monospace" fill="#334155">4 / 3</text>
<text x="295" y="235" text-anchor="middle" font-size="12" fill="#64748b">фото</text>
<rect x="410" y="84" width="200" height="112" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="2.5"/>
<text x="510" y="146" text-anchor="middle" font-size="18" font-weight="700" font-family="'Consolas','Courier New',monospace" fill="#334155">16 / 9</text>
<text x="510" y="235" text-anchor="middle" font-size="12" fill="#64748b">видео/обложка</text>
<text x="380" y="272" text-anchor="middle" font-size="13" font-family="'Consolas','Courier New',monospace" fill="#7c3aed">.box { aspect-ratio: 16 / 9; }  — высота считается сама от ширины</text>
</svg>