<text x="145" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#dc2626" font-family="'Consolas','Courier New',monospace">fill</text>
<text x="145" y="286" text-anchor="middle" font-size="12" fill="#64748b">растянуто (искажение)</text>
<rect x="305" y="90" width="150" height="150" rx="10" fill="none" stroke="#334155" stroke-width="2.5"/>
