<text x="380" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">object-fit: как картинка ложится в блок</text>
<text x="380" y="58" text-anchor="middle" font-size="13" fill="#64748b">блок квадратный, а фото широкое (16:9)</text>
