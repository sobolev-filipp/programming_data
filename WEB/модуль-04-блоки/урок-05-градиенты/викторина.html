<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 5: Градиенты и карточки</title>
<style>
  :root{
    --bg1:#8b5cf6; --bg2:#ec4899; --card:#ffffff; --ink:#1f2937;
    --accent:#8b5cf6; --ok:#16a34a; --bad:#dc2626; --soft:#f3e8ff;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// Урок 5 (Модуль 3): градиенты, текст, стекло + 🔁 повторение всего модуля 3 + смешные + на подумать.
const QUESTIONS = [
  {q:"Градиент в CSS — это...",
   a:["цвет текста","фон (плавный переход цветов)","рамка","тень"],c:1,
   e:"Градиент — фон, нарисованный кодом; пишется в background."},
  {q:"Какой градиент идёт по прямой?",
   a:["radial-gradient","linear-gradient","conic-gradient","flat-gradient"],c:1,
   e:"linear-gradient — линейный переход по направлению."},
  {q:"Какой градиент расходится ИЗ ЦЕНТРА?",
   a:["linear-gradient","radial-gradient","conic-gradient","side-gradient"],c:1,
   e:"radial-gradient — круговой из центра (блик, свечение)."},
  {q:"Какой градиент крутит цвета ПО КРУГУ?",
   a:["conic-gradient","linear-gradient","radial-gradient","round-gradient"],c:0,
   e:"conic-gradient — конический, по кругу (диски, диаграммы)."},
  {q:"Сколько цветов можно в одном градиенте?",
   a:["Только 2","Сколько угодно (через запятую)","Ровно 3","Один"],c:1,
   e:"Цветов сколько угодно, перечисляются через запятую."},
  {q:"Как покрасить ТЕКСТ градиентом?",
   a:["color: gradient","background + background-clip: text + color: transparent","text-gradient","fill: gradient"],c:1,
   e:"Градиент в background, обрезать по буквам (background-clip: text), color: transparent."},
  {q:"Что будет, если забыть <code>color: transparent</code> у градиентного текста?",
   a:["Ничего","Градиент не будет виден (текст перекроет фон)","Ошибка","Текст исчезнет"],c:1,
   e:"Обычный цвет текста перекроет градиент — эффекта не видно."},
  {q:"Чем делают эффект «матового стекла»?",
   a:["opacity","backdrop-filter: blur() + rgba-фон","filter: gray","box-shadow"],c:1,
   e:"Полупрозрачный фон (rgba) + backdrop-filter: blur() размывает фон под карточкой."},
  {q:"Почему у «стекла» всегда задают фон rgba?",
   a:["для цвета","как фолбэк, если backdrop-filter не поддержится","для тени","просто так"],c:1,
   e:"Если blur не сработает, останется полупрозрачная карточка — тоже нормально."},
  {q:"Стекло видно только...",
   a:["на белом фоне","поверх пёстрого фона (градиент/фото)","на чёрном","без фона"],c:1,
   e:"backdrop-filter размывает то, что ПОД карточкой — нужен пёстрый фон."},
  {q:"Как сделать «неоновое свечение» кнопки?",
   a:["border","box-shadow без смещения с rgba-цветом","outline","opacity"],c:1,
   e:"box-shadow: 0 0 24px rgba(цвет,.7) — свечение вокруг."},
  {q:"Где взять готовый градиент, не подбирая вручную?",
   a:["нигде","cssgradient.io","google.com","в блокноте"],c:1,
   e:"cssgradient.io — собрал мышкой, скопировал CSS."},

  {q:"🔁 Урок 4: что делает object-fit: cover?",
   a:["растягивает","вписывает фото без искажений, лишнее обрезает","убирает фото","повторяет"],c:1,
   e:"cover заполняет блок без искажений."},
  {q:"🔁 Урок 3: чем outline отличается от border?",
   a:["ничем","outline не занимает место","outline толще","outline только красный"],c:1,
   e:"outline рисуется поверх и не двигает соседей."},
  {q:"🔁 Урок 2: что делает box-sizing: border-box?",
   a:["тень","width включает padding и border","градиент","убирает рамку"],c:1,
   e:"Размеры предсказуемы."},
  {q:"🔁 Урок 1: какой тег — шапка страницы?",
   a:["&lt;head&gt;","&lt;header&gt;","&lt;nav&gt;","&lt;main&gt;"],c:1,
   e:"&lt;header&gt; — шапка."},

  {q:"😄 Написал color: linear-gradient(...) — не работает. Почему?",
   a:["нет такого цвета","градиент — это фон (background), не color","мало цветов","нужен №"],c:1,
   e:"Градиенты живут в background, а не в color."},
  {q:"😄 Стеклянная карточка не размывается. Что не так?",
   a:["мало blur","под ней однотонный фон — нечего размывать","нет текста","нет рамки"],c:1,
   e:"Положи её на градиент или фото."},

  {q:"🤔 Почему градиент можно ставить и тексту, и рамке, и кнопке?",
   a:["случайно","градиент — это фон, а фон есть у любого элемента","только тексту","это баг"],c:1,
   e:"Градиент — фоновая картинка, работает везде, где работает background."},
  {q:"🤔 Все свойства урока — Baseline. Что это значит?",
   a:["они устарели","работают во всех свежих браузерах — можно смело использовать","только в Chrome","нужен VPN"],c:1,
   e:"Baseline = поддержка во всех современных браузерах."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🌈 Градиенты и карточки</h1>
    <div class="sub">Викторина по уроку 5 · Модуль 3 (WEB)</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Градиенты и стекло — на уровне дизайнера! 🌈 Модуль 3 покорён!';}
  else if(pct>=70){em='🎉';msg='Отлично! Современный визуал освоен уверенно.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: 3 вида градиентов, текст-градиент, стекло.';}
  else {em='💪';msg='Начало положено! Загляни в самоучитель — там по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
