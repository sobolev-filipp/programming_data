<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 360" font-family="'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="740" height="360" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
<text x="370" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Свойство border: толщина, тип, цвет</text>
<g font-family="'Consolas','Courier New',monospace" font-size="20" font-weight="700">
<text x="150" y="76" fill="#334155">border:</text>
<text x="246" y="76" fill="#0ea5e9">3px</text>
<text x="300" y="76" fill="#7c3aed">solid</text>
<text x="380" y="76" fill="#e11d48">#6366f1</text>
<text x="490" y="76" fill="#334155">;</text>
</g>
<g font-size="12" fill="#64748b" text-anchor="middle">
<text x="266" y="94" fill="#0284c7">толщина</text>
<text x="326" y="94" fill="#7c3aed">тип (стиль)</text>
<text x="424" y="94" fill="#be123c">цвет</text>
</g>
<rect x="59" y="120" width="190" height="78" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="4"/>
<text x="154" y="157" text-anchor="middle" font-size="16" font-weight="700" fill="#334155" font-family="'Consolas','Courier New',monospace">solid</text>
<text x="154" y="175" text-anchor="middle" font-size="12" fill="#64748b">сплошная</text>
<rect x="275" y="120" width="190" height="78" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="4" stroke-dasharray="12 8"/>
<text x="370" y="157" text-anchor="middle" font-size="16" font-weight="700" fill="#334155" font-family="'Consolas','Courier New',monospace">dashed</text>
<text x="370" y="175" text-anchor="middle" font-size="12" fill="#64748b">штрихами</text>
<rect x="491" y="120" width="190" height="78" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="4" stroke-dasharray="1 7" stroke-linecap="round"/>
<text x="586" y="157" text-anchor="middle" font-size="16" font-weight="700" fill="#334155" font-family="'Consolas','Courier New',monospace">dotted</text>
<text x="586" y="175" text-anchor="middle" font-size="12" fill="#64748b">точками</text>
<rect x="59" y="256" width="190" height="78" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
<rect x="65" y="262" width="178" height="66" rx="6" fill="none" stroke="#6366f1" stroke-width="2"/>
<text x="154" y="293" text-anchor="middle" font-size="16" font-weight="700" fill="#334155" font-family="'Consolas','Courier New',monospace">double</text>
<text x="154" y="311" text-anchor="middle" font-size="12" fill="#64748b">двойная</text>
<rect x="275" y="256" width="190" height="78" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="4"/>
<rect x="277" y="258" width="186" height="74" rx="7" fill="none" stroke="#4338ca" stroke-width="1"/>
<text x="370" y="293" text-anchor="middle" font-size="16" font-weight="700" fill="#334155" font-family="'Consolas','Courier New',monospace">groove</text>
<text x="370" y="311" text-anchor="middle" font-size="12" fill="#64748b">с «канавкой»</text>
<rect x="491" y="256" width="190" height="78" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
<text x="586" y="293" text-anchor="middle" font-size="16" font-weight="700" fill="#334155" font-family="'Consolas','Courier New',monospace">none</text>
<text x="586" y="311" text-anchor="middle" font-size="12" fill="#64748b">нет рамки</text>
<text x="370" y="346" text-anchor="middle" font-size="12" fill="#94a3b8">Можно по сторонам: border-top / border-right / border-bottom / border-left</text>
</svg>