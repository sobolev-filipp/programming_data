<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тарелки — тренажёр CSS-селекторов</title>
<style>
  :root{
    --bg1:#f59e0b; --bg2:#ef4444; --card:#fffdf7; --ink:#3a2c1a;
    --accent:#ea580c; --ok:#16a34a; --bad:#dc2626; --soft:#fff1e0;
    --wood:#c88a4a; --wood2:#a86a2c; --sync:#2563eb;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:16px;color:var(--ink)}
  .app{background:var(--card);width:min(980px,100%);border-radius:22px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:22px 22px 18px;position:relative;overflow:hidden}
  h1{margin:0 0 3px;font-size:24px;text-align:center}
  .sub{text-align:center;color:#a1663b;margin-bottom:12px;font-size:13.5px}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:#8a6a45;margin-bottom:10px;gap:10px}
  .bar{height:9px;background:var(--soft);border-radius:99px;overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .goal{background:var(--soft);border:2px solid #fed7aa;border-radius:14px;padding:11px 15px;
    font-size:17px;font-weight:700;margin-bottom:14px;line-height:1.35}
  .goal .tag{color:var(--accent)}

  /* двухколоночная раскладка */
  .wrap{display:grid;grid-template-columns:1.45fr 1fr;gap:16px;align-items:start}
  @media(max-width:780px){ .wrap{grid-template-columns:1fr} }

  /* СТОЛ */
  .table{background:linear-gradient(180deg,var(--wood),var(--wood2));border-radius:16px;
    padding:20px 14px 14px;min-height:130px;display:flex;flex-wrap:wrap;align-items:flex-end;
    gap:12px;justify-content:center;box-shadow:inset 0 6px 18px rgba(0,0,0,.25)}
  plate,apple,pizza,cake,bowl,banana{display:inline-flex;flex-direction:column;align-items:center;
    justify-content:flex-end;position:relative;transition:.12s;cursor:pointer}
  .food{font-size:40px;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
  plate{background:#f4f4f5;border:3px solid #d4d4d8;border-radius:50%;min-width:62px;min-height:62px;padding:8px;gap:6px}
  bowl{background:#fde68a;border:3px solid #f59e0b;border-radius:0 0 26px 26px;padding:8px;gap:6px;min-width:58px}
  plate .food{font-size:30px}
  plate:has(*),bowl:has(*){flex-direction:row;flex-wrap:wrap;min-width:auto}
  /* попадание в цель (верный ответ) */
  .hit{outline:5px solid #22c55e;outline-offset:3px;animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  /* подсветка связи стол ↔ разметка (наведение) */
  #table [data-ref].sync{outline:4px dashed var(--sync);outline-offset:3px}

  /* ВВОД */
  .row{display:flex;gap:10px;margin:14px 0 0;flex-wrap:wrap}
  #inp{flex:1 1 180px;font-family:"Consolas","Courier New",monospace;font-size:19px;padding:11px 14px;
    border:2px solid #fdba74;border-radius:12px;background:#fff;color:#7c2d12;outline:none;min-width:0}
  #inp:focus{border-color:var(--accent);box-shadow:0 0 0 4px #fed7aa}
  .btn{border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer}
  .btn.go{background:var(--accent);color:#fff}
  .btn.go:hover{filter:brightness(1.08)}
  .btn.ghost{background:var(--soft);color:var(--accent);flex:1 1 auto}
  .btn.ghost:hover{background:#ffe4c4}
  .fb{min-height:22px;font-size:14.5px;margin:10px 2px 0;line-height:1.4}
  .fb.good{color:#166534;font-weight:700}
  .fb.no{color:#991b1b}

  /* БОКОВАЯ ПАНЕЛЬ */
  .side{display:flex;flex-direction:column;gap:12px}
  .panel{border-radius:14px;overflow:hidden}
  .teach{background:var(--soft);border:2px solid #fed7aa}
  .teach .h{background:#ffe4c4;color:var(--accent);font-weight:700;padding:9px 14px;font-size:14px}
  .teach .body{padding:12px 14px}
  .teach .name{font-weight:800;font-size:16px;margin-bottom:5px;color:#7c2d12}
  .teach .how{font-size:14px;line-height:1.5}
  .teach .ex{margin-top:9px;font-size:13.5px;color:#7c4a1d;background:#fff;border:1px dashed #fdba74;border-radius:9px;padding:7px 10px}
  .teach code{background:#1f2937;color:#e5e7eb;padding:1px 6px;border-radius:5px;font-size:13.5px}

  .mk .h{background:#111827;color:#e5e7eb;font-weight:600;padding:9px 14px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .mk .h span{color:#9ca3af;font-weight:400;font-size:12px}
  pre{margin:0;padding:12px 14px;background:#1f2937;color:#e5e7eb;font-family:"Consolas","Courier New",monospace;
    font-size:13.5px;line-height:1.7;overflow-x:auto;max-height:260px;overflow-y:auto}
  .node{border-radius:5px;padding:0 2px;cursor:pointer;transition:.1s}
  .node .a-c{color:#fbbf24;font-style:normal}
  .node .a-i{color:#f9a8d4;font-style:normal}
  .node b{color:#7dd3fc;font-weight:400}
  .node.sync{background:#fde047;color:#1f2937}
  .node.sync b,.node.sync .a-c,.node.sync .a-i{color:#1f2937}

  .note{font-size:12px;color:#a1663b;text-align:center;margin-top:12px;line-height:1.5}
  details.ref{margin-top:10px;background:var(--soft);border:2px solid #fed7aa;border-radius:12px}
  details.ref>summary{cursor:pointer;padding:10px 14px;font-weight:700;color:var(--accent);font-size:14px}
  .ref table{width:100%;border-collapse:collapse;font-size:13.5px}
  .ref td{padding:6px 14px;border-top:1px solid #fed7aa;vertical-align:top}
  .ref code{background:#1f2937;color:#e5e7eb;padding:1px 6px;border-radius:5px}

  .win{text-align:center;padding:24px 0}
  .win .emoji{font-size:72px}
  .win h2{font-size:26px;margin:6px 0}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ===== УРОВНИ =====
   board  — настоящая HTML-разметка «стола»; по ней реально работает querySelectorAll.
   target — эталонный селектор (им считаем «правильный набор»); засчитываем ЛЮБОЙ
            селектор, выделяющий тот же набор. teach — пояснение «как работает» + пример. */
const EMOJI={plate:"🍽️",apple:"🍎",pizza:"🍕",cake:"🍰",bowl:"🥣",banana:"🍌"};
const TAGS=["plate","apple","pizza","cake","bowl","banana"];

const LEVELS=[
  { goal:'Выбери <span class="tag">обе тарелки</span> — по названию тега.',
    board:'<plate></plate><plate></plate><apple></apple>', target:'plate',
    teach:{name:'Селектор по тегу', how:'Просто имя элемента — <b>без точки и решётки</b>. Выберет <b>все</b> такие элементы на странице.', ex:'<code>apple</code> — все яблоки'},
    hint:'Имя тега тарелки — <code>plate</code>. Одно слово, без точки.' },

  { goal:'Выбери <span class="tag">оба яблока</span>.',
    board:'<apple></apple><pizza></pizza><apple></apple>', target:'apple',
    teach:{name:'Снова тег', how:'Тег-селектор работает для <b>любого</b> имени элемента: <code>p</code>, <code>img</code>, <code>pizza</code>…', ex:'<code>pizza</code> — все пиццы'},
    hint:'Имя тега яблока — <code>apple</code>.' },

  { goal:'Выбери всё <span class="tag">маленькое</span> — у него класс <code>small</code>.',
    board:'<apple class="small"></apple><apple></apple><pizza class="small"></pizza>', target:'.small',
    teach:{name:'Селектор по классу', how:'Имя класса пишут <b>с точкой</b>. Найдёт все элементы с <code>class="small"</code> — даже разные теги.', ex:'<code>.small</code> · <code>.hot</code>'},
    hint:'Класс в CSS — с точкой: <code>.small</code>.' },

  { goal:'Выбери только <span class="tag">острое ЯБЛОКО</span> (класс <code>spicy</code>). Пиццу не трогай!',
    board:'<apple class="spicy"></apple><apple></apple><pizza class="spicy"></pizza>', target:'apple.spicy',
    teach:{name:'Тег + класс', how:'Соедини тег и класс <b>без пробела</b> — выберет только тот тег, у которого есть этот класс.', ex:'<code>apple.spicy</code> = яблоко с классом spicy'},
    hint:'<code>apple.spicy</code> — без пробела. Просто <code>.spicy</code> заденет и пиццу.' },

  { goal:'Выбери <span class="tag">яблоко и торт</span> одним селектором.',
    board:'<apple></apple><pizza></pizza><cake></cake>', target:'apple, cake',
    teach:{name:'Группировка (запятая)', how:'Через запятую — одно правило для <b>нескольких</b> селекторов сразу.', ex:'<code>apple, cake</code> — и яблоки, и торты'},
    hint:'Перечисли через запятую: <code>apple, cake</code>.' },

  { goal:'Выбери яблоко <span class="tag">внутри тарелки</span> (то, что снаружи, — не трогай).',
    board:'<plate><apple></apple></plate><apple></apple>', target:'plate apple',
    teach:{name:'Вложенность (пробел)', how:'Пробел между именами = <b>«внутри»</b>. Выберет элементы, лежащие внутри другого.', ex:'<code>plate apple</code> = яблоки внутри тарелки'},
    hint:'Пробел = «внутри»: <code>plate apple</code>.' },

  { goal:'Выбери <span class="tag">особую пиццу</span> — у неё <code>id="special"</code>.',
    board:'<pizza></pizza><pizza id="special"></pizza><pizza></pizza>', target:'#special',
    teach:{name:'Селектор по id', how:'id пишут <b>с решёткой</b>. id уникален — такой элемент <b>один</b> на странице.', ex:'<code>#special</code>'},
    hint:'id — с решёткой: <code>#special</code>.' },

  { goal:'Выбери яблоко — <span class="tag">прямого ребёнка тарелки</span>. То, что в миске, — не считается!',
    board:'<plate><apple></apple><bowl><apple></apple></bowl></plate>', target:'plate > apple',
    teach:{name:'Прямой потомок (&gt;)', how:'Знак <code>&gt;</code> = только <b>прямой</b> ребёнок (на один уровень внутрь), а не «внук».', ex:'<code>plate &gt; apple</code>'},
    hint:'<code>plate &gt; apple</code> — возьмёт яблоко прямо в тарелке, но не то, что спрятано в миске.' },

  { goal:'Выбери <span class="tag">всё на столе</span> одним символом.',
    board:'<plate></plate><apple></apple><pizza></pizza><cake></cake>', target:'*',
    teach:{name:'Универсальный (*)', how:'Звёздочка выбирает <b>вообще все</b> элементы.', ex:'<code>*</code>'},
    hint:'Это звёздочка: <code>*</code>.' },

  { goal:'Выбери яблоко <span class="tag">сразу после тарелки</span> (соседнее). Второе яблоко — мимо.',
    board:'<plate></plate><apple></apple><apple></apple>', target:'plate + apple',
    teach:{name:'Соседний (+)', how:'Знак <code>+</code> = элемент <b>сразу после</b> другого (один, ближайший сосед).', ex:'<code>plate + apple</code>'},
    hint:'<code>plate + apple</code> — только ближайшее яблоко за тарелкой.' },

  { goal:'Выбери <span class="tag">все яблоки после пиццы</span> (на том же уровне). Яблоко перед пиццей — не считается!',
    board:'<apple></apple><pizza></pizza><apple></apple><cake></cake><apple></apple>', target:'pizza ~ apple',
    teach:{name:'Все соседи (~)', how:'Знак <code>~</code> = <b>все</b> следующие соседи того же уровня.', ex:'<code>pizza ~ apple</code>'},
    hint:'<code>pizza ~ apple</code> — все яблоки после пиццы, кроме того, что перед ней.' },

  { goal:'Финал! Выбери <span class="tag">горячую пиццу внутри меню</span> (id <code>menu</code>). Пиццу снаружи — не трогай.',
    board:'<plate id="menu"><pizza class="hot"></pizza><pizza></pizza></plate><pizza class="hot"></pizza>', target:'#menu .hot',
    teach:{name:'Комбо!', how:'Приёмы <b>соединяются</b>: пробел — вложенность, точка — класс, решётка — id.', ex:'<code>#menu .hot</code> = hot внутри #menu'},
    hint:'Соедини id и класс через пробел: <code>#menu .hot</code>.' },
];

let cur=0, solved=0;
const app=document.getElementById('app');

function render(){
  const L=LEVELS[cur];
  app.innerHTML=`
    <h1>🍽️ Тарелки — тренажёр селекторов</h1>
    <div class="sub">Пиши CSS-селектор и «лови» нужную еду на столе · WEB (CSS)</div>
    <div class="meta"><span>Уровень ${cur+1} из ${LEVELS.length}</span>
      <div class="bar"><i style="width:${(cur/LEVELS.length)*100}%"></i></div>
      <span>✅ ${solved}</span></div>
    <div class="goal">🎯 ${L.goal}</div>
    <div class="wrap">
      <div class="left">
        <div class="table" id="table">${L.board}</div>
        <div class="row">
          <input id="inp" placeholder="напр. apple.small" autocomplete="off" spellcheck="false" autocapitalize="off">
          <button class="btn go" id="go">Проверить</button>
        </div>
        <div class="row">
          <button class="btn ghost" id="hint">💡 Подсказка</button>
          <button class="btn ghost" id="skip">Пропустить →</button>
        </div>
        <div class="fb" id="fb"></div>
      </div>
      <aside class="side">
        <div class="panel teach">
          <div class="h">📖 Как это работает</div>
          <div class="body">
            <div class="name">${L.teach.name}</div>
            <div class="how">${L.teach.how}</div>
            <div class="ex">Пример: ${L.teach.ex}</div>
          </div>
        </div>
        <div class="panel mk">
          <div class="h">👀 Разметка стола <span>наведи — подсветится</span></div>
          <pre id="markup"></pre>
        </div>
      </aside>
    </div>
    <div class="note">Разрешены: тег · <b>.класс</b> · <b>#id</b> · группировка <b>A, B</b> · вложенность <b>A B</b> · потомок <b>A&gt;B</b> · соседи <b>A+B</b>, <b>A~B</b> · <b>*</b>. Псевдоклассы (<code>:hover</code>) и атрибуты (<code>[]</code>) сюда не входят.</div>
    ${refPanel()}`;

  const table=document.getElementById('table');
  labelize(table);
  let r=0;
  table.querySelectorAll(TAGS.join(',')).forEach(el=>el.dataset.ref=r++);
  document.getElementById('markup').innerHTML=buildMarkup(table);
  wireHover();

  const inp=document.getElementById('inp'); inp.focus();
  document.getElementById('go').onclick=check;
  inp.onkeydown=e=>{ if(e.key==='Enter') check(); };
  document.getElementById('hint').onclick=()=>setFb('💡 '+L.hint,'');
  document.getElementById('skip').onclick=()=>{ cur=(cur+1)%LEVELS.length; render(); };
}

function labelize(root){
  root.querySelectorAll(TAGS.join(',')).forEach(el=>{
    if(el.querySelector(':scope>.food')) return;
    el.insertAdjacentHTML('afterbegin','<span class="food">'+(EMOJI[el.tagName.toLowerCase()]||'❓')+'</span>');
  });
}

/* строим разметку по ЖИВОМУ столу — data-ref у тега и у строки совпадают */
function buildMarkup(root){
  let out='';
  const walk=(node,depth)=>{
    [...node.children].forEach(n=>{
      const tag=n.tagName.toLowerCase();
      if(!TAGS.includes(tag)) return;            // пропускаем .food-спаны
      const pad='  '.repeat(depth), ref=n.dataset.ref;
      let attrs='';
      if(n.id) attrs+=' <i class="a-i">id="'+n.id+'"</i>';
      const cls=n.getAttribute('class');
      if(cls) attrs+=' <i class="a-c">class="'+cls+'"</i>';
      const kids=[...n.children].some(c=>TAGS.includes(c.tagName.toLowerCase()));
      if(kids){
        out+=pad+'<span class="node" data-ref="'+ref+'"><b>&lt;'+tag+'</b>'+attrs+'<b>&gt;</b></span>\n';
        walk(n,depth+1);
        out+=pad+'<span class="node" data-ref="'+ref+'"><b>&lt;/'+tag+'&gt;</b></span>\n';
      } else {
        out+=pad+'<span class="node" data-ref="'+ref+'"><b>&lt;'+tag+'</b>'+attrs+'<b>&gt;&lt;/'+tag+'&gt;</b></span>\n';
      }
    });
  };
  walk(root,0);
  return out;
}

/* двусторонняя подсветка: стол ↔ разметка по совпадающему data-ref */
function wireHover(){
  const setSync=(ref,on)=>document.querySelectorAll('[data-ref="'+ref+'"]').forEach(e=>e.classList.toggle('sync',on));
  document.querySelectorAll('#table [data-ref], #markup .node').forEach(el=>{
    const ref=el.dataset.ref;
    el.addEventListener('mouseenter',()=>setSync(ref,true));
    el.addEventListener('mouseleave',()=>setSync(ref,false));
  });
}

function setFb(msg,cls){ const fb=document.getElementById('fb'); fb.className='fb '+cls; fb.innerHTML=msg; }

function check(){
  const L=LEVELS[cur], table=document.getElementById('table');
  const raw=document.getElementById('inp').value.trim();
  table.querySelectorAll('.hit').forEach(e=>e.classList.remove('hit'));
  if(!raw){ setFb('Сначала напиши селектор в поле 🙂',''); return; }
  if(/[:\[\]]/.test(raw)){ setFb('❌ Тут только базовые селекторы и комбинаторы. Псевдоклассы (<code>:</code>) и атрибуты (<code>[]</code>) в этой игре не нужны.','no'); return; }
  let got;
  try{ got=[...table.querySelectorAll(raw)]; }
  catch(e){ setFb('❌ Не получилось прочитать селектор — проверь запись.','no'); return; }
  const want=[...table.querySelectorAll(L.target)], wantSet=new Set(want);
  if(!got.length){ setFb('🤔 Никого не поймал. Загляни в разметку справа или нажми «Подсказка».','no'); return; }
  const correct = got.length===want.length && got.every(el=>wantSet.has(el));
  got.forEach(el=>el.classList.add('hit'));
  if(correct){
    solved++;
    setFb('✅ Точно в цель! '+(cur<LEVELS.length-1?'Едем дальше…':'Это был последний!'),'good');
    setTimeout(()=>{ cur++; if(cur<LEVELS.length) render(); else win(); },950);
  } else if(got.length>want.length){
    setFb('Почти! Ты выделил <b>лишнее</b> — сузь селектор, чтобы попасть только в цель.','no');
  } else {
    setFb('Почти! Ты поймал <b>не всех</b> нужных. Сверься с целью и разметкой справа.','no');
  }
}

function win(){
  app.innerHTML=`<div class="win">
    <div class="emoji">🏆</div>
    <h2>Все ${LEVELS.length} столов убраны!</h2>
    <div class="sub">Ты освоил селекторы: тег, класс, id, группировку, вложенность, потомка, соседей и <code>*</code>.</div>
    <button class="btn go" id="again" style="margin-top:16px">🔁 Пройти заново</button>
  </div>`;
  document.getElementById('again').onclick=()=>{ cur=0; solved=0; render(); };
}

function refPanel(){
  return `<details class="ref"><summary>📖 Полная шпаргалка по селекторам</summary>
    <table>
      <tr><td><code>apple</code></td><td>по тегу — все такие элементы</td></tr>
      <tr><td><code>.small</code></td><td>по классу — все с <code>class="small"</code></td></tr>
      <tr><td><code>apple.small</code></td><td>тег + класс вместе (без пробела)</td></tr>
      <tr><td><code>#special</code></td><td>по id — уникальный элемент</td></tr>
      <tr><td><code>apple, cake</code></td><td>группировка — и то, и другое</td></tr>
      <tr><td><code>plate apple</code></td><td>вложенность (пробел) — apple внутри plate</td></tr>
      <tr><td><code>plate &gt; apple</code></td><td>прямой потомок — apple сразу в plate</td></tr>
      <tr><td><code>plate + apple</code></td><td>сосед — apple сразу после plate</td></tr>
      <tr><td><code>plate ~ apple</code></td><td>все apple-соседи после plate</td></tr>
      <tr><td><code>*</code></td><td>вообще все элементы</td></tr>
    </table></details>`;
}

render();
</script>
</body>
</html>
