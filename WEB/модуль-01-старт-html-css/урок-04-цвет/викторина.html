<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 4: Цвет</title>
<style>
  :root{
    --bg1:#a855f7; --bg2:#ec4899; --card:#ffffff; --ink:#1f2937;
    --accent:#a855f7; --ok:#16a34a; --bad:#dc2626; --soft:#f3e8ff;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// Урок 4: цвет + 🔁 повторение уроков 1–3 + смешные + на подумать.
const QUESTIONS = [
  {q:"Сколько форматов записи цвета мы разобрали?",
   a:["Один","Два","Четыре (имя, HEX, RGB, HSL)","Десять"],c:2,
   e:"Имя, HEX, RGB, HSL — четыре записи одного и того же цвета."},
  {q:"Как читается HEX-код <code>#RRGGBB</code>?",
   a:["Красный-Розовый-Голубой","Сколько Красного, Зелёного, Синего","Размер-Радиус-Рамка","Случайные буквы"],c:1,
   e:"Три пары: сколько красного, зелёного, синего (00..ff)."},
  {q:"Какой цвет даёт <code>#000000</code>?",
   a:["Белый","Красный","Чёрный","Прозрачный"],c:2,
   e:"Все каналы по нулям — чёрный. #ffffff — белый."},
  {q:"Какой диапазон у каналов в <code>rgb(...)</code>?",
   a:["0–100","0–255","0–360","0–1"],c:1,
   e:"Каждый канал R, G, B — от 0 до 255."},
  {q:"Что означает 4-е число в <code>rgba(255,0,0,0.5)</code>?",
   a:["Яркость","Прозрачность (alpha)","Размер","Насыщенность"],c:1,
   e:"alpha: 0 — невидимо, 1 — непрозрачно. 0.5 — полупрозрачно."},
  {q:"Что задаёт H в <code>hsl(H, S, L)</code>?",
   a:["Тон (какой цвет), 0–360°","Ширину","Высоту","Прозрачность"],c:0,
   e:"H — Hue, тон по кругу 0–360°. S — насыщенность, L — светлота."},
  {q:"Чем удобен HSL?",
   a:["Он короче","Легко подбирать оттенки — крути светлоту L","Работает быстрее","Только для текста"],c:1,
   e:"Меняя только L, получаешь гамму от тёмного к светлому."},
  {q:"Что обязательно у S и L в HSL?",
   a:["Знак #","Проценты %","Кавычки","Ничего"],c:1,
   e:"hsl(0, 100%, 50%) — насыщенность и светлота в процентах."},
  {q:"Что делает <code>color-mix(in srgb, blue, white)</code>?",
   a:["Ошибку","Смешивает синий и белый (получится голубой)","Красит в белый","Удаляет цвет"],c:1,
   e:"color-mix смешивает два цвета, как краски."},
  {q:"Что такое <code>transparent</code>?",
   a:["Ярко-красный","Полностью прозрачный (невидимый)","Серый","Белый"],c:1,
   e:"transparent — прозрачный, цвета как будто нет."},
  {q:"Что делает <code>currentColor</code>?",
   a:["Случайный цвет","Тот же цвет, что у текста (color)","Всегда чёрный","Фон страницы"],c:1,
   e:"currentColor берёт значение из свойства color элемента."},
  {q:"Что такое КОНТРАСТНОЕ (комплементарное) сочетание на цветовом круге?",
   a:["Три соседних цвета","Два противоположных цвета","Оттенки одного тона","Все цвета сразу"],c:1,
   e:"Комплементарные — два цвета напротив друг друга. Дают яркий акцент (кнопки)."},
  {q:"Какое сочетание даст самую СПОКОЙНУЮ, мягкую гамму?",
   a:["Контрастное","Триада","Аналоговые (соседние цвета)","Тетрада"],c:2,
   e:"Аналоговые — 3 соседних цвета круга, переход мягкий и гармоничный."},
  {q:"Что советует правило 60-30-10?",
   a:["60 цветов на странице","60% основной цвет, 30% дополнительный, 10% акцент","Менять цвет каждые 10 секунд","Только 3 цвета навсегда"],c:1,
   e:"60% основного, 30% дополнительного, 10% яркого акцента — аккуратная палитра."},
  {q:"🌈 Что делает <code>linear-gradient(to right, blue, violet)</code>?",
   a:["Красит в один цвет","Плавный переход от синего к фиолетовому","Ошибку","Делает рамку"],c:1,
   e:"Градиент — плавный переход между цветами. Большая тема — в Модуле 3."},

  {q:"🔁 Повторим урок 3: каким свойством делают круглую аватарку?",
   a:["border-radius: 50%","width: 100%","color: round","alt: круг"],c:0,
   e:"border-radius: 50% из квадратной картинки делает круг."},
  {q:"🔁 Повторим урок 2: какой способ подключить CSS лучший?",
   a:["inline style","&lt;style&gt; в head","&lt;link&gt; на внешний .css","никакой"],c:2,
   e:"Внешний файл через &lt;link&gt; — один стиль на весь сайт."},
  {q:"🔁 Повторим урок 1: какой тег — одиночный?",
   a:["&lt;p&gt;","&lt;img&gt;","&lt;h1&gt;","&lt;div&gt;"],c:1,
   e:"img, br, hr — одиночные. p, h1, div — парные."},

  {q:"😄 Написал <code>color: ff0000</code> — не покрасилось. Что забыл?",
   a:["Точку с запятой","Знак # перед HEX","Кавычки","Пробел"],c:1,
   e:"HEX всегда с решёткой: #ff0000."},
  {q:"😄 <code>hsl(0, 100, 50)</code> не работает. Почему?",
   a:["Нет такого цвета","Забыл % у насыщенности и светлоты","Тон должен быть буквой","hsl не существует"],c:1,
   e:"Нужно hsl(0, 100%, 50%) — S и L в процентах."},

  {q:"🤔 Почему один цвет можно записать 4 способами?",
   a:["Чтобы запутать","Это разные «языки» для одного цвета; компьютер хранит его как смесь R/G/B","HEX и RGB — разные цвета","Так исторически сложилось зря"],c:1,
   e:"Форматы — просто разная запись; внутри цвет один и тот же."},
  {q:"🤔 Зачем нужна прозрачность (alpha)?",
   a:["Для скорости","Для «стеклянных» эффектов и плашек поверх картинок","Чтобы цвет был ярче","Она бесполезна"],c:1,
   e:"rgba/hsla позволяют наложить полупрозрачный слой — нижнее просвечивает."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🎨 Цвет</h1>
    <div class="sub">Викторина по уроку 4 · WEB</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! HEX, RGB, HSL и прозрачность — всё в кармане! 🎨';}
  else if(pct>=70){em='🎉';msg='Отлично! Цвет освоен уверенно.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: HEX с #, RGB 0–255, HSL с %, alpha 0–1.';}
  else {em='💪';msg='Начало положено! Загляни в самоучитель — там по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
