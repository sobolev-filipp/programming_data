<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="700" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="350" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Свойство display</text>

  <!-- block -->
  <text x="120" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#2563eb">block</text>
  <text x="120" y="90" text-anchor="middle" font-size="11" fill="#64748b">в столбик, во всю ширину</text>
  <rect x="30" y="100" width="180" height="34" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="30" y="140" width="180" height="34" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="30" y="180" width="180" height="34" rx="6" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="120" y="122" text-anchor="middle" font-size="12" fill="#1e3a8a">div (по умолчанию)</text>
  <text x="120" y="240" text-anchor="middle" font-size="11" fill="#64748b">h1, p, div</text>

  <line x1="245" y1="60" x2="245" y2="260" stroke="#e2e8f0" stroke-width="2"/>

  <!-- inline -->
  <text x="350" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3aed">inline</text>
  <text x="350" y="90" text-anchor="middle" font-size="11" fill="#64748b">в строку; размеры не слушаются</text>
  <rect x="280" y="118" width="55" height="26" rx="6" fill="#ddd6fe" stroke="#7c3aed"/>
  <rect x="340" y="118" width="55" height="26" rx="6" fill="#ddd6fe" stroke="#7c3aed"/>
  <rect x="400" y="118" width="20" height="26" rx="6" fill="#ddd6fe" stroke="#7c3aed"/>
  <text x="350" y="176" text-anchor="middle" font-size="11" fill="#64748b">span, a</text>

  <line x1="440" y1="60" x2="440" y2="260" stroke="#e2e8f0" stroke-width="2"/>

  <!-- inline-block -->
  <text x="570" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#059669">inline-block ✅</text>
  <text x="570" y="90" text-anchor="middle" font-size="11" fill="#64748b">в ряд + свои размеры/отступы</text>
  <rect x="475" y="110" width="60" height="60" rx="8" fill="#a7f3d0" stroke="#059669"/>
  <rect x="545" y="110" width="60" height="60" rx="8" fill="#a7f3d0" stroke="#059669"/>
  <rect x="615" y="110" width="60" height="60" rx="8" fill="#a7f3d0" stroke="#059669"/>
  <text x="570" y="192" text-anchor="middle" font-size="11" fill="#065f46">карточки в ряд!</text>

  <text x="350" y="292" text-anchor="middle" font-size="14" fill="#334155">Карточки-блоки в ряд → задай им display: inline-block</text>
</svg>
