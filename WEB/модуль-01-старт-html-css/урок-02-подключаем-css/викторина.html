<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 2: Подключаем CSS</title>
<style>
  :root{
    --bg1:#2965f1; --bg2:#7c3aed; --card:#ffffff; --ink:#1f2937;
    --accent:#2965f1; --ok:#16a34a; --bad:#dc2626; --soft:#e7eefc;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// Урок 2: вопросы по CSS + 🔁 повторение тегов с урока 1 + смешные + на подумать.
const QUESTIONS = [
  {q:"За что отвечает CSS?",
   a:["За содержание (текст)","За оформление (цвет, фон, размеры)","За подключение к интернету","За сохранение файла"],c:1,
   e:"HTML — содержание, CSS — оформление: цвета, фон, расположение."},
  {q:"Как устроено правило CSS?",
   a:["значение { селектор: свойство }","селектор { свойство: значение; }","тег = стиль","{ } без селектора"],c:1,
   e:"селектор { свойство: значение; } — например h1 { color: red; }."},
  {q:"Что здесь СЕЛЕКТОР: <code>p { color: blue; }</code>?",
   a:["color","blue","p","{ }"],c:2,
   e:"Селектор p — кого красим (все абзацы). color — свойство, blue — значение."},
  {q:"Сколько способов подключить CSS мы разобрали?",
   a:["Один","Два","Три","Пять"],c:2,
   e:"Три: inline style, тег <style>, внешний файл через <link>."},
  {q:"Какой способ подключения CSS — самый правильный для реального сайта?",
   a:["inline style в теге","<style> в head","<link> на внешний .css","никакой"],c:2,
   e:"Внешний файл через <link>: один стиль на весь сайт, чистый HTML."},
  {q:"Как подключить внешний файл style.css?",
   a:["&lt;style src=\"style.css\"&gt;","&lt;link rel=\"stylesheet\" href=\"style.css\"&gt;","&lt;css&gt;style.css&lt;/css&gt;","&lt;script src=\"style.css\"&gt;"],c:1,
   e:"&lt;link rel=\"stylesheet\" href=\"style.css\"&gt; в &lt;head&gt;."},
  {q:"Каким свойством красят ТЕКСТ?",
   a:["background-color","color","text-align","font"],c:1,
   e:"color — цвет текста. background-color — цвет фона."},
  {q:"Каким свойством задают цвет ФОНА страницы?",
   a:["color у body","background-color у body","text-align","fill"],c:1,
   e:"background-color у селектора body красит фон всей страницы."},
  {q:"Что делает <code>text-align: center;</code>?",
   a:["Красит текст","Выравнивает текст по центру","Делает жирным","Меняет шрифт"],c:1,
   e:"text-align управляет выравниванием: left / center / right."},
  {q:"Что сильнее, если стили спорят?",
   a:["Стиль из внешнего файла","inline-стиль в самом теге","Они складываются","Ничего не покрасится"],c:1,
   e:"inline-стиль в теге перебивает правило из файла (каскад)."},
  {q:"Что нужно ставить после каждого значения в CSS?",
   a:["Точку .","Точку с запятой ;","Двоеточие :","Ничего"],c:1,
   e:"; разделяет свойства. После свойства — :, после значения — ;."},
  {q:"Как пишется комментарий в CSS?",
   a:["// текст","&lt;!-- текст --&gt;","/* текст */","# текст"],c:2,
   e:"В CSS комментарий — /* ... */. А &lt;!-- --&gt; — это HTML."},

  {q:"🔁 Повторим урок 1: какой тег — ОДИНОЧНЫЙ (непарный)?",
   a:["&lt;p&gt;","&lt;br&gt;","&lt;h1&gt;","&lt;title&gt;"],c:1,
   e:"br и hr одиночные. И <link> тоже, кстати!"},
  {q:"🔁 Повторим урок 1: чем title отличается от h1?",
   a:["Ничем","title — имя вкладки (head), h1 — заголовок на странице (body)","title крупнее","h1 в head"],c:1,
   e:"title — вкладка, h1 — заголовок страницы. Разные теги в разных местах."},
  {q:"🔁 Повторим урок 1: что развернёт Emmet из <code>!</code>?",
   a:["Пустой файл","Целый каркас HTML5-страницы","Один h1","Ошибку"],c:1,
   e:"! + Tab разворачивает готовый каркас страницы."},

  {q:"😄 Стили в style.css не применяются. Что проверить ПЕРВЫМ?",
   a:["Перезагрузить компьютер","Правильный ли href и рядом ли файл","Сменить браузер","Удалить HTML"],c:1,
   e:"Чаще всего виноват неверный href или файл лежит не рядом."},
  {q:"😄 Ты написал <code>color= red</code> и цвет не поменялся. Почему?",
   a:["Нет такого цвета","В CSS свойство и значение через :, а не =","Мало красного","Нужны кавычки"],c:1,
   e:"В CSS — color: red; двоеточие, не знак равно."},

  {q:"🤔 Почему внешний файл .css лучше, чем inline?",
   a:["Он красивее","Один файл красит весь сайт, HTML остаётся чистым","Он быстрее грузится всегда","Inline не работает"],c:1,
   e:"Один style.css подключают к десяткам страниц — единый стиль, чистый HTML."},
  {q:"🤔 Зачем HTML и CSS вообще разделили?",
   a:["Чтобы было сложнее","Чтобы менять оформление, не трогая содержание","Так исторически","Чтобы файлов было больше"],c:1,
   e:"Разделение: HTML — что написано, CSS — как выглядит. Меняем дизайн без правки текста."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🎨 Подключаем CSS</h1>
    <div class="sub">Викторина по уроку 2 · WEB (CSS)</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Три способа подключения CSS — как орешки! 🎨';}
  else if(pct>=70){em='🎉';msg='Отлично! CSS и подключение освоены уверенно.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: селектор { свойство: значение; } и чем <link> лучше.';}
  else {em='💪';msg='Начало положено! Загляни в самоучитель — там по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
