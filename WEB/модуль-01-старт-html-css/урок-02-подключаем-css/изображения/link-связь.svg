<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="700" height="320" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="350" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Как &lt;link&gt; соединяет два файла</text>

  <!-- HTML file -->
  <rect x="40" y="70" width="270" height="200" rx="10" fill="#ffffff" stroke="#e34f26" stroke-width="2"/>
  <rect x="40" y="70" width="270" height="30" rx="10" fill="#fde3db"/>
  <text x="58" y="91" font-size="14" font-weight="700" fill="#e34f26">index.html</text>
  <g font-family="'Consolas',monospace" font-size="12" fill="#334155">
    <text x="56" y="126">&lt;head&gt;</text>
    <text x="70" y="148" fill="#059669">&lt;link rel="stylesheet"</text>
    <text x="82" y="166" fill="#059669">href="style.css"&gt;</text>
    <text x="56" y="188">&lt;/head&gt;</text>
    <text x="56" y="220">&lt;body&gt;</text>
    <text x="70" y="240">&lt;h1&gt;Привет&lt;/h1&gt;</text>
    <text x="56" y="260">&lt;/body&gt;</text>
  </g>

  <!-- arrow -->
  <line x1="310" y1="157" x2="400" y2="157" stroke="#10b981" stroke-width="4"/>
  <polygon points="400,148 424,157 400,166" fill="#10b981"/>
  <text x="365" y="145" text-anchor="middle" font-size="13" fill="#10b981">связь</text>

  <!-- CSS file -->
  <rect x="430" y="70" width="230" height="200" rx="10" fill="#ffffff" stroke="#2965f1" stroke-width="2"/>
  <rect x="430" y="70" width="230" height="30" rx="10" fill="#e0e7ff"/>
  <text x="448" y="91" font-size="14" font-weight="700" fill="#2965f1">style.css</text>
  <g font-family="'Consolas',monospace" font-size="13" fill="#334155">
    <text x="448" y="130">h1 {</text>
    <text x="466" y="152" fill="#7c3aed">color</text><text x="516" y="152">: </text><text x="532" y="152" fill="#e34f26">navy</text><text x="580" y="152">;</text>
    <text x="466" y="174" fill="#7c3aed">text-align</text><text x="466" y="196">: center;</text>
    <text x="448" y="220">}</text>
  </g>

  <text x="350" y="298" text-anchor="middle" font-size="14" fill="#475569">HTML говорит «мой стиль лежит в style.css» — браузер берёт оттуда все правила.</text>
</svg>
