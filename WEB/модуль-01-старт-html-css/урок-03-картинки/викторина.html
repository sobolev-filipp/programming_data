<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 3: Картинки</title>
<style>
  :root{
    --bg1:#10b981; --bg2:#0ea5e9; --card:#ffffff; --ink:#1f2937;
    --accent:#0d9488; --ok:#16a34a; --bad:#dc2626; --soft:#d9f5ee;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:19px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
// Урок 3: картинки + 🔁 повторение уроков 1–2 + смешные + на подумать.
const QUESTIONS = [
  {q:"Каким тегом вставляют картинку?",
   a:["&lt;picture&gt;","&lt;img&gt;","&lt;image&gt;","&lt;src&gt;"],c:1,
   e:"Картинку показывает тег &lt;img&gt; — одиночный (без пары)."},
  {q:"Что указывает атрибут <code>src</code>?",
   a:["Размер картинки","Путь к файлу картинки","Цвет рамки","Подпись"],c:1,
   e:"src (source) — путь к файлу: где лежит картинка."},
  {q:"Зачем нужен атрибут <code>alt</code>?",
   a:["Для красоты","Текст-замена, если картинка не загрузилась + для незрячих","Задаёт размер","Делает ссылку"],c:1,
   e:"alt — описание: показывается при ошибке и читается вслух программами."},
  {q:"Тег &lt;img&gt; — какой?",
   a:["Парный (нужен &lt;/img&gt;)","Одиночный (закрывать не надо)","Только в &lt;head&gt;","Не существует"],c:1,
   e:"&lt;img&gt; — одиночный тег, как &lt;br&gt; и &lt;hr&gt;."},
  {q:"Как лучше задавать размер картинки, чтобы не исказить?",
   a:["Только высоту","Только ширину (width)","И ширину, и высоту наугад","Никак"],c:1,
   e:"Задаёшь только ширину — высота подстроится, пропорции сохранятся."},
  {q:"Что делает <code>width: 100%</code> у картинки?",
   a:["Растягивает на весь экран монитора","Подстраивает под ширину блока-родителя","Делает круглой","Удаляет картинку"],c:1,
   e:"100% — доля ширины родителя; картинка не вылезает за края."},
  {q:"Как сделать круглую аватарку?",
   a:["border: circle","border-radius: 50%","width: 50%","alt: круг"],c:1,
   e:"border-radius: 50% превращает квадратную картинку в круг."},
  {q:"Как сделать картинку кликабельной (ссылкой)?",
   a:["Добавить href в img","Обернуть img в тег &lt;a&gt;","Написать link=","Никак"],c:1,
   e:"&lt;a href=\"...\"&gt;&lt;img ...&gt;&lt;/a&gt; — картинка внутри ссылки."},
  {q:"Каким свойством добавить рамку картинке?",
   a:["frame","border","outline-color","edge"],c:1,
   e:"border: 4px solid цвет; — толщина, стиль, цвет рамки."},
  {q:"Что развернёт Emmet из <code>div>img*3</code>?",
   a:["Три div подряд","div, внутри три img","img с шириной 3","Ошибку"],c:1,
   e:"> — вложенность: div, а внутри три картинки img."},
  {q:"Куда обычно складывают все картинки проекта?",
   a:["В &lt;head&gt;","В отдельную папку images/","В файл style.css","В title"],c:1,
   e:"В папку images/ и пишут путь src=\"images/имя.jpg\" — так аккуратнее."},

  {q:"🔁 Повторим урок 2: какой способ подключить CSS — лучший?",
   a:["inline style","&lt;style&gt; в head","&lt;link&gt; на внешний .css","никакой"],c:2,
   e:"Внешний файл через &lt;link&gt;: один стиль на весь сайт."},
  {q:"🔁 Повторим урок 1: сколько &lt;h1&gt; должно быть на странице?",
   a:["Сколько угодно","Ровно один (главный)","Минимум пять","Ни одного"],c:1,
   e:"h1 — один, это название страницы. Дальше h2, h3 по порядку."},
  {q:"🔁 Повторим урок 2: чем красят цвет ТЕКСТА?",
   a:["background-color","color","text-align","border"],c:1,
   e:"color — цвет текста; background-color — цвет фона."},

  {q:"😄 Вместо картинки — «сломанный» значок. Что ПЕРВЫМ проверить?",
   a:["Перезагрузить ПК","Совпадает ли имя файла в src с настоящим","Сменить браузер","Удалить alt"],c:1,
   e:"Чаще всего неверный src: опечатка в имени/пути или нет файла рядом."},
  {q:"😄 Кот на картинке стал вытянутым и «сплющенным». Почему?",
   a:["Плохое фото","Задали и width, и height наугад","Мало пикселей","Нет alt"],c:1,
   e:"Задавай только ширину — тогда пропорции сохранятся."},

  {q:"🤔 Почему <code>&lt;img&gt;</code> — одиночный тег?",
   a:["Так короче","У картинки нет текстового содержимого между тегами — только ссылка на файл","Это ошибка стандарта","Чтобы запутать"],c:1,
   e:"Внутри картинки нет текста; всё задаётся атрибутами (src, alt), пара не нужна."},
  {q:"🤔 Почему alt важен, даже если картинка загрузилась?",
   a:["Он не важен","Его читают программы для незрячих и поисковики","Он ускоряет сайт","Он меняет цвет"],c:1,
   e:"alt делает сайт доступным и понятным для программ, даже когда фото видно."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🖼️ Картинки</h1>
    <div class="sub">Викторина по уроку 3 · WEB</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! img, src, alt и аватарки — всё в кармане! 🖼️';}
  else if(pct>=70){em='🎉';msg='Отлично! Картинки освоены уверенно.';}
  else if(pct>=40){em='👍';msg='Неплохо! Повтори: src — путь, alt — подпись, только ширину, 50% = круг.';}
  else {em='💪';msg='Начало положено! Загляни в самоучитель — там по шагам.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
