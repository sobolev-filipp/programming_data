<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="660" height="300" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="330" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Абзац, перенос строки и линия</text>

  <rect x="40" y="60" width="580" height="58" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="54" y="84" font-size="15" fill="#334155">Абзац. У тега p сверху и снизу свой отступ.</text>
  <text x="54" y="106" font-size="13" font-family="'Consolas',monospace" fill="#6366f1">&lt;p&gt; ... &lt;/p&gt;  — парный</text>

  <rect x="40" y="132" width="580" height="76" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="54" y="156" font-size="15" fill="#334155">Строка один</text>
  <text x="54" y="178" font-size="15" fill="#334155">строка два — перенос ВНУТРИ одного абзаца.</text>
  <text x="54" y="199" font-size="13" font-family="'Consolas',monospace" fill="#10b981">&lt;br&gt;  — одиночный, без пары</text>

  <text x="54" y="240" font-size="15" fill="#334155">Тег hr рисует линию-разделитель через всю ширину:</text>
  <text x="54" y="260" font-size="13" font-family="'Consolas',monospace" fill="#f59e0b">&lt;hr&gt;  — одиночный</text>
  <line x1="54" y1="278" x2="606" y2="278" stroke="#f59e0b" stroke-width="3"/>
</svg>
