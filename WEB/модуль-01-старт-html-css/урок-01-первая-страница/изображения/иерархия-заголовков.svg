<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="700" height="380" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="350" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">Заголовки h1–h6 — это уровни важности</text>
  <text x="350" y="62" text-anchor="middle" font-size="14" fill="#64748b">как оглавление книги: h1 — название, дальше вложенные разделы</text>

  <!-- h1 -->
  <rect x="40" y="82" width="620" height="46" rx="8" fill="#dbeafe" stroke="#2965f1" stroke-width="2"/>
  <text x="58" y="112" font-size="26" font-weight="800" fill="#1e3a8a">h1 · Название сайта</text>
  <text x="470" y="110" font-size="13" fill="#2965f1">только ОДИН на странице</text>

  <!-- h2 a -->
  <rect x="80" y="140" width="580" height="40" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="98" y="166" font-size="22" font-weight="700" fill="#3730a3">h2 · Раздел «Обо мне»</text>

  <!-- h3 -->
  <rect x="120" y="190" width="540" height="34" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="138" y="213" font-size="18" font-weight="700" fill="#4338ca">h3 · Подраздел «Хобби»</text>

  <!-- h2 b -->
  <rect x="80" y="234" width="580" height="40" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="98" y="260" font-size="22" font-weight="700" fill="#3730a3">h2 · Раздел «Мои проекты»</text>

  <!-- h3.. -->
  <rect x="120" y="284" width="540" height="30" rx="8" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="138" y="305" font-size="16" font-weight="700" fill="#4338ca">h4 · h5 · h6 — всё мельче и глубже</text>

  <!-- rule -->
  <text x="40" y="344" font-size="14" fill="#dc2626">Правило: уровни идут по порядку и НЕ перепрыгивают (после h2 — h3, а не сразу h5).</text>
  <text x="40" y="366" font-size="13" fill="#64748b">Размер выбирает не «покрупнее», а важность. Внешний вид потом настроим через CSS.</text>
</svg>
