<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="700" height="340" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="350" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">px — фикс, % — доля родителя</text>

  <!-- narrow parent -->
  <text x="175" y="70" text-anchor="middle" font-size="14" fill="#64748b">узкий родитель (300px)</text>
  <rect x="55" y="80" width="240" height="200" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="70" y="100" width="150" height="50" rx="6" fill="#93c5fd"/>
  <text x="145" y="130" text-anchor="middle" font-size="13" fill="#1e3a8a">width: 150px</text>
  <rect x="70" y="170" width="210" height="50" rx="6" fill="#fca5a5"/>
  <text x="175" y="200" text-anchor="middle" font-size="13" fill="#7f1d1d">width: 100%</text>
  <text x="175" y="248" text-anchor="middle" font-size="12" fill="#64748b">синий фикс 150px,</text>
  <text x="175" y="265" text-anchor="middle" font-size="12" fill="#64748b">красный занял всю ширину</text>

  <!-- wide parent -->
  <text x="500" y="70" text-anchor="middle" font-size="14" fill="#64748b">широкий родитель (500px)</text>
  <rect x="330" y="80" width="330" height="200" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="345" y="100" width="150" height="50" rx="6" fill="#93c5fd"/>
  <text x="420" y="130" text-anchor="middle" font-size="13" fill="#1e3a8a">width: 150px</text>
  <rect x="345" y="170" width="300" height="50" rx="6" fill="#fca5a5"/>
  <text x="495" y="200" text-anchor="middle" font-size="13" fill="#7f1d1d">width: 100%</text>
  <text x="495" y="248" text-anchor="middle" font-size="12" fill="#64748b">синий тот же — 150px,</text>
  <text x="495" y="265" text-anchor="middle" font-size="12" fill="#64748b">красный снова во всю ширину</text>

  <text x="350" y="312" text-anchor="middle" font-size="14" fill="#334155">px не меняется никогда · % всегда считается от родителя</text>
</svg>
