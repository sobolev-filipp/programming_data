<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="'Segoe UI', Arial, sans-serif">
  <rect x="0" y="0" width="560" height="460" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="280" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">Макет страницы «Обо мне»</text>

  <!-- page frame -->
  <rect x="60" y="56" width="440" height="384" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <!-- header: avatar + name -->
  <rect x="60" y="56" width="440" height="96" rx="10" fill="#eef2ff"/>
  <circle cx="120" cy="104" r="30" fill="#a5b4fc" stroke="#6366f1" stroke-width="3"/>
  <text x="120" y="150" text-anchor="middle" font-size="11" fill="#6366f1">аватар (круг)</text>
  <rect x="170" y="86" width="240" height="20" rx="4" fill="#c7d2fe"/>
  <rect x="170" y="114" width="160" height="12" rx="4" fill="#ddd6fe"/>
  <text x="420" y="100" font-size="11" fill="#6366f1">h1 имя</text>
  <text x="420" y="124" font-size="11" fill="#8b5cf6">слоган</text>

  <!-- about -->
  <rect x="84" y="172" width="120" height="14" rx="3" fill="#94a3b8"/>
  <text x="215" y="184" font-size="11" fill="#64748b">h2 «Обо мне»</text>
  <rect x="84" y="196" width="392" height="9" rx="3" fill="#e2e8f0"/>
  <rect x="84" y="212" width="392" height="9" rx="3" fill="#e2e8f0"/>
  <rect x="84" y="228" width="300" height="9" rx="3" fill="#e2e8f0"/>

  <!-- skills / gallery -->
  <rect x="84" y="256" width="150" height="14" rx="3" fill="#94a3b8"/>
  <text x="245" y="268" font-size="11" fill="#64748b">h2 «Увлечения»</text>
  <rect x="84" y="280" width="120" height="80" rx="8" fill="#fde68a"/>
  <rect x="220" y="280" width="120" height="80" rx="8" fill="#a7f3d0"/>
  <rect x="356" y="280" width="120" height="80" rx="8" fill="#fbcfe8"/>
  <text x="280" y="374" text-anchor="middle" font-size="11" fill="#64748b">карточки-блоки (цвет, текст)</text>

  <!-- footer / button -->
  <rect x="200" y="392" width="160" height="30" rx="15" fill="#6366f1"/>
  <text x="280" y="412" text-anchor="middle" font-size="12" fill="#ffffff">кнопка :hover</text>
</svg>
