<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="860" height="420" fill="#f7f9fc"/>
  <text x="430" y="38" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">📅 Дата = год · месяц · день</text>
  <text x="430" y="62" font-size="14" fill="#64748b" text-anchor="middle">библиотека datetime хранит дату как три числа; из даты можно вытащить каждую часть по отдельности</text>

  <!-- date object -->
  <g transform="translate(120,100)">
    <rect x="0" y="0" width="620" height="60" rx="12" fill="#0f172a"/>
    <text x="20" y="39" font-size="20" font-family="monospace" fill="#e2e8f0">d = datetime.date(<tspan fill="#60a5fa">2026</tspan>, <tspan fill="#4ade80">8</tspan>, <tspan fill="#fbbf24">9</tspan>)</text>
  </g>

  <!-- three boxes -->
  <g transform="translate(120,200)">
    <!-- year -->
    <rect x="0" y="0" width="190" height="110" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="95" y="34" font-size="14" fill="#334155" text-anchor="middle">год</text>
    <text x="95" y="74" font-size="34" font-weight="800" fill="#1d4ed8" text-anchor="middle" font-family="monospace">2026</text>
    <text x="95" y="98" font-size="13" fill="#64748b" text-anchor="middle" font-family="monospace">d.year</text>
    <!-- month -->
    <rect x="215" y="0" width="190" height="110" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
    <text x="310" y="34" font-size="14" fill="#334155" text-anchor="middle">месяц</text>
    <text x="310" y="74" font-size="34" font-weight="800" fill="#15803d" text-anchor="middle" font-family="monospace">8</text>
    <text x="310" y="98" font-size="13" fill="#64748b" text-anchor="middle" font-family="monospace">d.month</text>
    <!-- day -->
    <rect x="430" y="0" width="190" height="110" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="525" y="34" font-size="14" fill="#334155" text-anchor="middle">день</text>
    <text x="525" y="74" font-size="34" font-weight="800" fill="#b45309" text-anchor="middle" font-family="monospace">9</text>
    <text x="525" y="98" font-size="13" fill="#64748b" text-anchor="middle" font-family="monospace">d.day</text>
  </g>

  <!-- arrows -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M 215 165 L 215 198"/>
    <path d="M 400 165 L 425 198"/>
    <path d="M 470 165 L 645 198"/>
  </g>

  <text x="430" y="392" font-size="13.5" fill="#475569" text-anchor="middle" font-style="italic">💡 <tspan font-family="monospace">datetime.date.today()</tspan> вернёт сегодняшнюю дату сама. А <tspan font-family="monospace">d.weekday()</tspan> — день недели (0 = понедельник).</text>
</svg>
