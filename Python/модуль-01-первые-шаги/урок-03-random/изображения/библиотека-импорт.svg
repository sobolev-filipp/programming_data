<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="860" height="440" fill="#f7f9fc"/>
  <text x="430" y="38" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">📦 Библиотека → импорт → функция</text>
  <text x="430" y="62" font-size="14" fill="#64748b" text-anchor="middle">библиотека — ящик с готовыми инструментами. <tspan font-family="monospace" fill="#334155">import</tspan> подключает ящик, дальше берём инструменты через точку.</text>

  <!-- toolbox: random -->
  <g transform="translate(50,110)">
    <rect x="0" y="0" width="250" height="250" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="0" y="0" width="250" height="52" rx="16" fill="#fed7aa"/>
    <rect x="0" y="30" width="250" height="22" fill="#fed7aa"/>
    <text x="125" y="34" font-size="19" font-weight="800" fill="#9a3412" text-anchor="middle" font-family="monospace">📦 random</text>
    <!-- tools -->
    <g font-family="monospace" font-size="15">
      <rect x="22" y="76" width="206" height="40" rx="9" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <text x="36" y="101" fill="#9a3412" font-weight="700">randint(a, b)</text>
      <rect x="22" y="126" width="206" height="40" rx="9" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <text x="36" y="151" fill="#9a3412" font-weight="700">choice(...)</text>
      <rect x="22" y="176" width="206" height="40" rx="9" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
      <text x="36" y="201" fill="#9a3412" font-weight="700">shuffle(...)</text>
    </g>
    <text x="125" y="238" font-size="12.5" fill="#78350f" text-anchor="middle">инструменты для случайности</text>
  </g>

  <!-- arrow import -->
  <g>
    <line x1="315" y1="235" x2="400" y2="235" stroke="#94a3b8" stroke-width="4"/>
    <polygon points="400,235 386,227 386,243" fill="#94a3b8"/>
    <rect x="300" y="196" width="120" height="30" rx="15" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="360" y="217" font-size="14" font-weight="700" fill="#4338ca" text-anchor="middle" font-family="monospace">import random</text>
  </g>

  <!-- program -->
  <g transform="translate(430,110)">
    <rect x="0" y="0" width="380" height="250" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="380" height="34" rx="14" fill="#1e293b"/>
    <rect x="0" y="22" width="380" height="12" fill="#1e293b"/>
    <text x="190" y="22" font-size="12.5" font-weight="700" fill="#94a3b8" text-anchor="middle">твоя программа</text>
    <g font-family="monospace" font-size="16">
      <text x="20" y="72" fill="#c084fc">import</text><text x="98" y="72" fill="#e2e8f0">random</text>
      <text x="20" y="118" fill="#94a3b8"># бросаем кубик:</text>
      <text x="20" y="150" fill="#60a5fa">dice</text><text x="70" y="150" fill="#94a3b8">=</text>
      <text x="92" y="150" fill="#e2e8f0">random.randint(</text>
      <text x="255" y="150" fill="#fbbf24">1, 6</text><text x="300" y="150" fill="#e2e8f0">)</text>
      <text x="20" y="182" fill="#c084fc">print</text><text x="72" y="182" fill="#e2e8f0">(dice)</text>
      <text x="20" y="220" fill="#4ade80">&gt;&gt;&gt; 4</text>
    </g>
  </g>

  <text x="360" y="180" font-size="12" fill="#6366f1" text-anchor="middle">подключили ящик</text>
  <text x="430" y="418" font-size="13.5" fill="#475569" text-anchor="middle" font-style="italic">💡 Пишем <tspan font-family="monospace">random.randint(1,6)</tspan>: имя библиотеки, точка, имя инструмента. Библиотеки экономят нам код — не пишем случайность с нуля.</text>
</svg>
