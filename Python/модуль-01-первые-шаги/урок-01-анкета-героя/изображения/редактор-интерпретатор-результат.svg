<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="860" height="420" fill="#f7f9fc"/>
  <text x="430" y="38" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">🐍 Как работает программа на Python</text>
  <text x="430" y="62" font-size="14" fill="#64748b" text-anchor="middle">ты пишешь код словами → Python читает и выполняет → появляется результат</text>

  <!-- ==== 1. РЕДАКТОР ==== -->
  <g transform="translate(40,110)">
    <rect x="0" y="0" width="230" height="230" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="40" rx="14" fill="#e0e7ff"/>
    <rect x="0" y="26" width="230" height="14" fill="#e0e7ff"/>
    <circle cx="20" cy="20" r="6" fill="#f87171"/>
    <circle cx="40" cy="20" r="6" fill="#fbbf24"/>
    <circle cx="60" cy="20" r="6" fill="#34d399"/>
    <text x="130" y="25" font-size="13" font-weight="700" fill="#3730a3" text-anchor="middle">Редактор кода</text>
    <!-- code lines -->
    <text x="18" y="78" font-size="15" font-family="'Consolas',monospace" fill="#0f172a">name = "Гера"</text>
    <text x="18" y="106" font-size="15" font-family="'Consolas',monospace" fill="#0f172a">age  = <tspan fill="#2563eb">12</tspan></text>
    <text x="18" y="134" font-size="15" font-family="'Consolas',monospace" fill="#7c3aed">print(</text>
    <text x="78" y="134" font-size="15" font-family="'Consolas',monospace" fill="#16a34a">name</text>
    <text x="128" y="134" font-size="15" font-family="'Consolas',monospace" fill="#0f172a">)</text>
    <text x="115" y="205" font-size="13" fill="#64748b" text-anchor="middle">💻 здесь ты пишешь</text>
    <text x="115" y="223" font-size="13" fill="#64748b" text-anchor="middle">команды-слова</text>
  </g>

  <!-- arrow 1 -->
  <g>
    <line x1="278" y1="225" x2="332" y2="225" stroke="#94a3b8" stroke-width="4"/>
    <polygon points="332,225 320,218 320,232" fill="#94a3b8"/>
    <text x="305" y="210" font-size="12" fill="#64748b" text-anchor="middle">запуск ▶</text>
  </g>

  <!-- ==== 2. ИНТЕРПРЕТАТОР ==== -->
  <g transform="translate(340,110)">
    <rect x="0" y="0" width="180" height="230" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="90" y="34" font-size="40" text-anchor="middle">🐍</text>
    <text x="90" y="72" font-size="15" font-weight="700" fill="#9a3412" text-anchor="middle">Python-</text>
    <text x="90" y="92" font-size="15" font-weight="700" fill="#9a3412" text-anchor="middle">интерпретатор</text>
    <text x="90" y="130" font-size="12.5" fill="#7c2d12" text-anchor="middle">читает код</text>
    <text x="90" y="150" font-size="12.5" fill="#7c2d12" text-anchor="middle">строчка за строчкой</text>
    <text x="90" y="170" font-size="12.5" fill="#7c2d12" text-anchor="middle">сверху вниз</text>
    <text x="90" y="200" font-size="12.5" fill="#7c2d12" text-anchor="middle">и выполняет</text>
    <text x="90" y="218" font-size="12.5" fill="#7c2d12" text-anchor="middle">команды</text>
  </g>

  <!-- arrow 2 -->
  <g>
    <line x1="528" y1="225" x2="582" y2="225" stroke="#94a3b8" stroke-width="4"/>
    <polygon points="582,225 570,218 570,232" fill="#94a3b8"/>
    <text x="555" y="210" font-size="12" fill="#64748b" text-anchor="middle">выводит</text>
  </g>

  <!-- ==== 3. РЕЗУЛЬТАТ ==== -->
  <g transform="translate(590,110)">
    <rect x="0" y="0" width="230" height="230" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="0" y="0" width="230" height="34" rx="14" fill="#1e293b"/>
    <rect x="0" y="22" width="230" height="12" fill="#1e293b"/>
    <text x="115" y="22" font-size="12.5" font-weight="700" fill="#94a3b8" text-anchor="middle">Консоль (результат)</text>
    <text x="20" y="78" font-size="17" font-family="'Consolas',monospace" fill="#4ade80">&gt;&gt;&gt; Гера</text>
    <rect x="20" y="92" width="12" height="20" fill="#4ade80" opacity="0.8"/>
    <text x="115" y="200" font-size="13" fill="#94a3b8" text-anchor="middle">🖥 то, что видит</text>
    <text x="115" y="218" font-size="13" fill="#94a3b8" text-anchor="middle">пользователь</text>
  </g>

  <text x="430" y="388" font-size="13.5" fill="#475569" text-anchor="middle" font-style="italic">💡 Компьютер выполняет команды буквально и по порядку — сверху вниз. В этом вся сила и вся ответственность программиста.</text>
</svg>
