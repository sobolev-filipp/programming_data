<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="800" height="420" fill="#f7f9fc"/>
  <text x="400" y="34" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">🐢 Пылесос по срезам — убери нужные клетки</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Смотри, где мусор, и выбери СРЕЗ списка cells, который убирает ровно их.</text>

  <!-- room row: 12 cells, trash on 2..7 (task cells[2:8]) -->
  <g font-size="13" font-weight="700" font-family="monospace">
    <!-- indices -->
    <g fill="#94a3b8" text-anchor="middle" font-size="11">
      <text x="92" y="108">0</text><text x="140" y="108">1</text><text x="188" y="108">2</text><text x="236" y="108">3</text><text x="284" y="108">4</text><text x="332" y="108">5</text><text x="380" y="108">6</text><text x="428" y="108">7</text><text x="476" y="108">8</text><text x="524" y="108">9</text><text x="572" y="108">10</text><text x="620" y="108">11</text>
    </g>
    <!-- cells -->
    <g>
      <rect x="72" y="116" width="40" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="120" y="116" width="40" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="168" y="116" width="40" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><circle cx="188" cy="136" r="8" fill="#9ca3af"/>
      <rect x="216" y="116" width="40" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><circle cx="236" cy="136" r="8" fill="#9ca3af"/>
      <rect x="264" y="116" width="40" height="40" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><circle cx="284" cy="136" r="6" fill="#2563eb"/>
      <rect x="312" y="116" width="40" height="40" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><circle cx="332" cy="136" r="6" fill="#2563eb"/>
      <rect x="360" y="116" width="40" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><circle cx="380" cy="136" r="8" fill="#9ca3af"/>
      <rect x="408" y="116" width="40" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><circle cx="428" cy="136" r="8" fill="#9ca3af"/>
      <rect x="456" y="116" width="40" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="504" y="116" width="40" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="552" y="116" width="40" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="600" y="116" width="40" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    </g>
    <!-- vacuum -->
    <rect x="316" y="172" width="32" height="32" rx="6" fill="#ea580c"/>
    <text x="332" y="220" font-size="11" fill="#ea580c" text-anchor="middle">пылесос</text>
  </g>
  <text x="284" y="252" font-size="12.5" fill="#2563eb" text-anchor="middle">убрано</text>
  <text x="236" y="252" font-size="12.5" fill="#9ca3af" text-anchor="middle">мусор</text>

  <!-- code panel -->
  <g transform="translate(150,280)">
    <rect x="0" y="0" width="360" height="96" rx="12" fill="#0f172a"/>
    <text x="18" y="30" font-size="14" font-family="monospace" fill="#fdba74">cells = [0, 1, 2, ... , 11]</text>
    <text x="18" y="58" font-size="14" font-family="monospace" fill="#7dd3fc">for i in cells[2:8]:</text>
    <text x="42" y="82" font-size="14" font-family="monospace" fill="#e2e8f0">clean(i)</text>
  </g>
  <text x="560" y="322" font-size="14" fill="#334155" font-weight="700">Мусор в 2..7?</text>
  <text x="560" y="344" font-size="14" font-family="monospace" fill="#ea580c">→ cells[2:8]</text>
  <text x="560" y="366" font-size="12.5" fill="#64748b">(8 не входит!)</text>

  <text x="400" y="404" font-size="13" fill="#64748b" text-anchor="middle">14 заданий: [:5] · [-4:] · [1:-1] · [::2] · [1::2] · [::3] · [::-1] · края (два среза)…</text>
</svg>
