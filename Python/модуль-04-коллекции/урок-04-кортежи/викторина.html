<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 4 «Кортежи» (Python)</title>
<style>
  :root{
    --bg1:#fdba74; --bg2:#ea580c; --card:#ffffff; --ink:#1f2937;
    --accent:#ea580c; --ok:#16a34a; --bad:#dc2626; --soft:#ffedd5;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:18px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"В каких скобках записывают кортеж?",
   a:["квадратные [ ]","круглые ( )","фигурные { }","угловые < >"],c:1,
   e:"Кортеж — круглые скобки: (1, 2, 3). Список — квадратные."},
  {q:"Чем кортеж отличается от списка?",
   a:["ничем","кортеж НЕЛЬЗЯ менять (заморожен)","кортеж быстрее печатается","кортеж только для чисел"],c:1,
   e:"Главное: кортеж неизменяемый, список можно менять."},
  {q:"Что будет от <code>point = (3, 5); point[0] = 9</code>?",
   a:["point станет (9, 5)","TypeError — менять нельзя","point станет [9, 5]","ничего"],c:1,
   e:"Кортеж неизменяемый: item assignment запрещён."},
  {q:"Что делает <code>x, y = (3, 5)</code>?",
   a:["ошибку","x=3, y=5 (распаковка)","x=(3,5)","x=3 y=3"],c:1,
   e:"Распаковка раскладывает кортеж по переменным."},
  {q:"Как поменять местами a и b?",
   a:["<code>a = b</code>","<code>a, b = b, a</code>","<code>swap(a, b)</code>","никак"],c:1,
   e:"Справа собирается кортеж (b, a) и распаковывается."},
  {q:"Что вернёт <code>len((10, 20, 30))</code>?",
   a:["1","3","30","6"],c:1,
   e:"len работает с кортежем: 3 элемента."},
  {q:"Как перебрать список точек с распаковкой?",
   a:["<code>for p in points</code>","<code>for x, y in points</code>","<code>for x in y</code>","никак"],c:1,
   e:"for x, y in points сразу раскладывает каждый кортеж."},
  {q:"Что возвращает <code>return min(n), max(n)</code>?",
   a:["одно число","кортеж (min, max)","список","ошибку"],c:1,
   e:"Несколько значений через запятую — это кортеж."},
  {q:"Как создать кортеж из ОДНОГО элемента (число 7)?",
   a:["<code>(7)</code>","<code>(7,)</code>","<code>[7]</code>","<code>7,7</code>"],c:1,
   e:"(7) — просто число; кортеж из одного — (7,) с запятой."},
  {q:"Можно ли прочитать <code>point[0]</code> у кортежа?",
   a:["нет, кортеж закрыт","да, читать можно (нельзя только менять)","только через len","только у списка"],c:1,
   e:"Читать (индекс, срез, in, перебор) можно; менять — нет."},
  {q:"Зачем хранить координату как кортеж (x, y)?",
   a:["так короче","чтобы точка случайно не изменилась","кортеж ярче","для сортировки"],c:1,
   e:"Неизменяемость защищает постоянные данные (координаты, цвет)."},
  {q:"🐢 Как сдвинуть вершину-кортеж (x, y) вправо на 4?",
   a:["<code>point[0] += 4</code>","распаковать и собрать новый: <code>(x + 4, y)</code>","<code>point.move(4)</code>","никак"],c:1,
   e:"Кортеж не меняют — создают новый: line_to((x+4, y))."},

  {q:"😄 Написал <code>t = (5)</code> и удивился, что это не кортеж. Почему?",
   a:["Python сломался","без запятой (5) — это просто число 5","мало скобок","нужен list"],c:1,
   e:"Кортеж из одного элемента требует запятую: (5,)."},
  {q:"😄 <code>point[1] = 99</code> дал TypeError. Что не так?",
   a:["нет такого индекса","point — кортеж, его менять нельзя","мало памяти","нужен print"],c:1,
   e:"Кортеж неизменяемый. Нужно менять — бери список."},
  {q:"😄 <code>x, y, z = (1, 2)</code> — ошибка. Почему?",
   a:["скобки лишние","переменных 3, а элементов 2","нужен list","z запрещено"],c:1,
   e:"Слева должно быть столько имён, сколько элементов в кортеже."},

  {q:"🤔 Что выведет <code>a, b = 1, 2; a, b = b, a; print(a, b)</code>?",
   a:["1 2","2 1","1 1","2 2"],c:1,
   e:"Обмен местами: a=2, b=1."},
  {q:"🤔 Почему кортеж можно сделать ключом словаря, а список — нет?",
   a:["кортеж короче","ключ должен быть неизменяемым, а список меняется","список слишком большой","это случайно"],c:1,
   e:"Ключи словаря обязаны быть неизменяемыми — кортеж подходит."},
  {q:"🤔 Работает ли срез с кортежем: <code>(0,1,2,3)[:2]</code>?",
   a:["нет, только у списков","да → (0, 1)","будет ошибка","вернёт 2"],c:1,
   e:"Читать кортеж (в т.ч. срез) можно; срез вернёт новый кортеж."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🔒 Викторина: кортежи</h1>
    <div class="sub">Урок 4 · Модуль 4 «Коллекции» · Python</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Кортежи и распаковка освоены — вперёд к словарям! 🔥';}
  else if(pct>=70){em='🎉';msg='Отлично! Кортеж и x, y = point в кармане, вперёд в Урок 5.';}
  else if(pct>=40){em='👍';msg='Неплохо! Пробегись по итого.md — про неизменяемость и распаковку.';}
  else {em='💪';msg='Ещё разок! Открой итого.md и повтори кортеж vs список.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
