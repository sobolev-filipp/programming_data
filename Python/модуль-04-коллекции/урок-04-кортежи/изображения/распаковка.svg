<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="up_ar" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#ea580c"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#f7f9fc"/>
  <text x="400" y="36" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">📦 Распаковка: кортеж → переменные</text>
  <text x="400" y="60" font-size="14" fill="#64748b" text-anchor="middle">Одной строкой разложить кортеж по переменным: x, y = point</text>

  <!-- unpacking -->
  <text x="120" y="110" font-size="16" font-family="monospace" fill="#9a3412" font-weight="700">point = (3, 5)</text>
  <g font-size="18" font-weight="700" font-family="monospace">
    <rect x="120" y="122" width="80" height="52" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><text x="160" y="156" text-anchor="middle" fill="#9a3412">3</text>
    <rect x="210" y="122" width="80" height="52" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><text x="250" y="156" text-anchor="middle" fill="#9a3412">5</text>
  </g>
  <text x="120" y="210" font-size="16" font-family="monospace" fill="#334155" font-weight="700">x, y = point</text>

  <path d="M160,176 L160,232" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#up_ar)"/>
  <path d="M250,176 L250,232" stroke="#ea580c" stroke-width="2.5" fill="none" marker-end="url(#up_ar)"/>
  <g font-size="16" font-weight="700" font-family="monospace">
    <rect x="120" y="238" width="80" height="46" rx="10" fill="#0f172a"/><text x="160" y="267" text-anchor="middle" fill="#fdba74">x = 3</text>
    <rect x="210" y="238" width="80" height="46" rx="10" fill="#0f172a"/><text x="250" y="267" text-anchor="middle" fill="#fdba74">y = 5</text>
  </g>
  <text x="205" y="312" font-size="13" fill="#64748b" text-anchor="middle">теперь x и y — отдельные числа</text>

  <line x1="410" y1="90" x2="410" y2="330" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- swap -->
  <text x="600" y="110" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">🔁 Обмен без временной переменной</text>
  <g font-family="monospace" font-size="15">
    <rect x="450" y="128" width="300" height="44" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="466" y="156" fill="#3730a3">a, b = 10, 20</text>
    <rect x="450" y="180" width="300" height="44" rx="9" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="466" y="208" fill="#3730a3">a, b = b, a</text>
    <rect x="450" y="232" width="300" height="44" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="466" y="260" fill="#166534">теперь a = 20, b = 10</text>
  </g>
  <text x="600" y="304" font-size="13" fill="#64748b" text-anchor="middle">кортеж (b, a) собирается справа и распаковывается</text>

  <text x="400" y="366" font-size="13.5" fill="#334155" text-anchor="middle">Распаковка работает в цикле:  <tspan font-family="monospace" fill="#ea580c" font-weight="700">for x, y in points:</tspan>  — сразу два имени на точку.</text>
</svg>
