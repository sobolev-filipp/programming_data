<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="so_ar" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#ea580c"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="420" fill="#f7f9fc"/>
  <text x="400" y="34" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">🔀 sort() меняет список, sorted() даёт новый</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Главное различие: трогает ли оригинал.</text>

  <text x="120" y="98" font-size="15.5" font-family="monospace" fill="#334155" font-weight="700">nums = [5, 1, 9, 3]</text>

  <!-- sorted() branch -->
  <g transform="translate(0,120)">
    <rect x="40" y="0" width="330" height="150" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="205" y="28" font-size="16" font-family="monospace" fill="#0e7490" font-weight="700" text-anchor="middle">new = sorted(nums)</text>
    <text x="205" y="50" font-size="13" fill="#64748b" text-anchor="middle">создаёт НОВЫЙ список</text>
    <g font-size="14" font-weight="700" font-family="monospace">
      <text x="70" y="86" fill="#64748b">nums:</text>
      <rect x="130" y="72" width="200" height="26" rx="6" fill="#fff" stroke="#94a3b8"/><text x="230" y="90" text-anchor="middle" fill="#334155">[5, 1, 9, 3]  цел</text>
      <text x="70" y="126" fill="#0e7490">new :</text>
      <rect x="130" y="112" width="200" height="26" rx="6" fill="#cffafe" stroke="#0891b2"/><text x="230" y="130" text-anchor="middle" fill="#0e7490">[1, 3, 5, 9]</text>
    </g>
  </g>

  <!-- sort() branch -->
  <g transform="translate(430,120)">
    <rect x="0" y="0" width="330" height="150" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="165" y="28" font-size="16" font-family="monospace" fill="#9a3412" font-weight="700" text-anchor="middle">nums.sort()</text>
    <text x="165" y="50" font-size="13" fill="#64748b" text-anchor="middle">меняет САМ список (вернёт None)</text>
    <g font-size="14" font-weight="700" font-family="monospace">
      <text x="30" y="86" fill="#64748b">было:</text>
      <rect x="90" y="72" width="200" height="26" rx="6" fill="#fff" stroke="#94a3b8"/><text x="190" y="90" text-anchor="middle" fill="#94a3b8">[5, 1, 9, 3]</text>
      <text x="30" y="126" fill="#9a3412">стало:</text>
      <rect x="90" y="112" width="200" height="26" rx="6" fill="#ffedd5" stroke="#ea580c"/><text x="190" y="130" text-anchor="middle" fill="#9a3412">[1, 3, 5, 9]</text>
    </g>
  </g>

  <!-- key -->
  <text x="400" y="312" font-size="16" font-weight="700" fill="#1f2937" text-anchor="middle">🔑 Сортировка по КЛЮЧУ — key=</text>
  <g font-family="monospace" font-size="14.5">
    <rect x="90" y="326" width="300" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="106" y="352" fill="#854d0e">sorted(words, key=len)</text>
    <text x="106" y="378" fill="#854d0e" font-size="13">["я", "дом", "кот", "школа"]  — по длине</text>
    <rect x="410" y="326" width="300" height="70" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="426" y="352" fill="#854d0e">sorted(names, key=str.lower)</text>
    <text x="426" y="378" fill="#854d0e" font-size="13">без учёта заглавных/строчных</text>
  </g>
</svg>
