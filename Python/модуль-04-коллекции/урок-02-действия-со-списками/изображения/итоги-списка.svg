<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="it_ar" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#0891b2"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="400" fill="#f7f9fc"/>
  <text x="400" y="36" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">📊 Готовые функции считают итоги списка</text>
  <text x="400" y="60" font-size="14" fill="#64748b" text-anchor="middle">Одна команда — и весь список превращается в число.</text>

  <!-- list of scores -->
  <text x="70" y="104" font-size="15.5" font-family="monospace" fill="#ea580c" font-weight="700">scores = [82, 95, 70, 95, 60]</text>
  <g font-size="17" font-weight="700" font-family="monospace">
    <rect x="70" y="116" width="86" height="50" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="113" y="148" text-anchor="middle" fill="#9a3412">82</text>
    <rect x="166" y="116" width="86" height="50" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="209" y="148" text-anchor="middle" fill="#9a3412">95</text>
    <rect x="262" y="116" width="86" height="50" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="305" y="148" text-anchor="middle" fill="#9a3412">70</text>
    <rect x="358" y="116" width="86" height="50" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="401" y="148" text-anchor="middle" fill="#9a3412">95</text>
    <rect x="454" y="116" width="86" height="50" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="497" y="148" text-anchor="middle" fill="#9a3412">60</text>
  </g>

  <!-- arrows down to results -->
  <path d="M305,168 L305,196" stroke="#0891b2" stroke-width="2.5" fill="none" marker-end="url(#it_ar)"/>

  <!-- result cards -->
  <g font-family="monospace" font-size="15.5">
    <rect x="70" y="210" width="220" height="44" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="86" y="238" fill="#0e7490">len(scores)  →  5</text>
    <rect x="70" y="262" width="220" height="44" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="86" y="290" fill="#0e7490">sum(scores)  →  402</text>
    <rect x="310" y="210" width="220" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="326" y="238" fill="#166534">max(scores)  →  95</text>
    <rect x="310" y="262" width="220" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="326" y="290" fill="#991b1b">min(scores)  →  60</text>
    <rect x="550" y="210" width="200" height="96" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="566" y="238" fill="#9a3412" font-size="14">Среднее:</text>
    <text x="566" y="264" fill="#9a3412" font-size="13.5">sum / len</text>
    <text x="566" y="290" fill="#9a3412" font-size="13.5">402 / 5 = 80.4</text>
  </g>

  <text x="400" y="344" font-size="14.5" fill="#334155" text-anchor="middle">Победитель = имя по позиции лучшего счёта:</text>
  <text x="400" y="368" font-size="14.5" font-family="monospace" fill="#ea580c" text-anchor="middle" font-weight="700">players[ scores.index(max(scores)) ]</text>
</svg>
