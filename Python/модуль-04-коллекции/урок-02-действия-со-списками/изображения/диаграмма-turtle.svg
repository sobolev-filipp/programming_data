<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="800" height="440" fill="#f7f9fc"/>
  <text x="400" y="34" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">🐢 Диаграмма «Топ игроков» — цикл по списку</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Команда bar() рисует один столбец; ты проходишь список циклом.</text>

  <!-- chart area -->
  <g transform="translate(60,90)">
    <!-- grid -->
    <g stroke="#e2e8f0" stroke-width="1">
      <line x1="40" y1="0" x2="360" y2="0"/><line x1="40" y1="40" x2="360" y2="40"/>
      <line x1="40" y1="80" x2="360" y2="80"/><line x1="40" y1="120" x2="360" y2="120"/>
      <line x1="40" y1="160" x2="360" y2="160"/>
    </g>
    <!-- Y labels -->
    <g font-size="11" font-family="monospace" fill="#94a3b8" text-anchor="end">
      <text x="32" y="204">0</text><text x="32" y="164">3</text><text x="32" y="124">5</text><text x="32" y="84">7</text><text x="32" y="44">9</text><text x="32" y="12">10</text>
    </g>
    <!-- baseline -->
    <line x1="40" y1="200" x2="360" y2="200" stroke="#334155" stroke-width="2"/>
    <!-- bars: 8,5,10,3,7 -->
    <g>
      <rect x="55" y="72" width="40" height="128" fill="#ea580c"/><text x="75" y="66" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">8</text>
      <rect x="110" y="120" width="40" height="80" fill="#ea580c"/><text x="130" y="114" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">5</text>
      <rect x="165" y="40" width="40" height="160" fill="#16a34a"/><text x="185" y="34" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">10</text>
      <rect x="220" y="152" width="40" height="48" fill="#ea580c"/><text x="240" y="146" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">3</text>
      <rect x="275" y="88" width="40" height="112" fill="#ea580c"/><text x="295" y="82" font-size="11" font-weight="700" fill="#1f2937" text-anchor="middle">7</text>
    </g>
  </g>

  <!-- code panel -->
  <g transform="translate(470,110)">
    <rect x="0" y="0" width="290" height="150" rx="12" fill="#0f172a"/>
    <text x="18" y="30" font-size="13.5" font-family="monospace" fill="#fdba74">scores = [8, 5, 10, 3, 7]</text>
    <text x="18" y="62" font-size="13.5" font-family="monospace" fill="#7dd3fc">for score in scores:</text>
    <text x="42" y="88" font-size="13.5" font-family="monospace" fill="#e2e8f0">bar(score)</text>
    <text x="18" y="122" font-size="12" font-family="monospace" fill="#94a3b8"># каждый bar() —</text>
    <text x="18" y="140" font-size="12" font-family="monospace" fill="#94a3b8"># следующий столбец</text>
  </g>

  <text x="400" y="330" font-size="14.5" fill="#334155" text-anchor="middle" font-weight="700">Команды каркаса:</text>
  <g font-family="monospace" font-size="14">
    <rect x="120" y="346" width="250" height="40" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="136" y="371" fill="#9a3412">bar(value)</text>
    <text x="250" y="371" fill="#9a3412" font-size="12">— оранжевый столбец</text>
    <rect x="430" y="346" width="250" height="40" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="446" y="371" fill="#166534">bar(v, "#16a34a")</text>
    <text x="600" y="371" fill="#166534" font-size="12">— свой цвет</text>
  </g>
  <text x="400" y="410" font-size="13" fill="#64748b" text-anchor="middle">TASK меняет задание: 1 — как есть · 2 — отсортированный · 3 — макс зелёным.</text>
</svg>
