<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="ad_ar" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ad_arR" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="440" fill="#f7f9fc"/>
  <text x="400" y="34" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">➕➖ Добавляем и удаляем элементы</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Список меняется на месте: соседи сдвигаются, длина растёт или падает.</text>

  <!-- ADD band -->
  <g transform="translate(0,80)">
    <text x="40" y="18" font-size="16" font-family="monospace" fill="#16a34a" font-weight="700">Добавить</text>
    <g font-size="14.5" font-weight="700" font-family="monospace">
      <rect x="40" y="30" width="120" height="46" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="100" y="59" text-anchor="middle" fill="#166534">меч</text>
      <rect x="170" y="30" width="120" height="46" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="230" y="59" text-anchor="middle" fill="#166534">щит</text>
      <rect x="300" y="30" width="130" height="46" rx="9" fill="#fff" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/><text x="365" y="59" text-anchor="middle" fill="#16a34a">зелье</text>
    </g>
    <path d="M300,53 L246,53" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#ad_ar)"/>
    <text x="470" y="46" font-size="15" font-family="monospace" fill="#166534" font-weight="700">box.append("зелье")</text>
    <text x="470" y="68" font-size="13" fill="#64748b">кладёт В КОНЕЦ списка</text>

    <text x="40" y="118" font-size="15" font-family="monospace" fill="#16a34a" font-weight="700">box.insert(1, "лук")</text>
    <text x="270" y="118" font-size="13" fill="#64748b">вставит на позицию 1, остальные сдвинутся вправо →</text>
    <g font-size="14" font-weight="700" font-family="monospace">
      <rect x="40" y="128" width="105" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="92" y="153" text-anchor="middle" fill="#166534">меч</text>
      <rect x="155" y="128" width="105" height="40" rx="8" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/><text x="207" y="153" text-anchor="middle" fill="#854d0e">лук</text>
      <rect x="270" y="128" width="105" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="322" y="153" text-anchor="middle" fill="#166534">щит</text>
      <rect x="385" y="128" width="105" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="437" y="153" text-anchor="middle" fill="#166534">зелье</text>
    </g>
  </g>

  <line x1="40" y1="268" x2="760" y2="268" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- REMOVE band -->
  <g transform="translate(0,286)">
    <text x="40" y="18" font-size="16" font-family="monospace" fill="#dc2626" font-weight="700">Удалить</text>
    <g font-size="14" font-weight="700" font-family="monospace">
      <rect x="40" y="30" width="105" height="44" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="92" y="58" text-anchor="middle" fill="#991b1b">меч</text>
      <rect x="155" y="30" width="105" height="44" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><text x="207" y="58" text-anchor="middle" fill="#94a3b8">лук</text>
      <rect x="270" y="30" width="105" height="44" rx="9" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="322" y="58" text-anchor="middle" fill="#991b1b">щит</text>
    </g>
    <path d="M207,78 L207,100" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#ad_arR)"/>
    <text x="470" y="40" font-size="14.5" font-family="monospace" fill="#991b1b" font-weight="700">box.remove("лук")</text>
    <text x="470" y="60" font-size="12.5" fill="#64748b">по ЗНАЧЕНИЮ — убирает "лук"</text>
    <text x="470" y="86" font-size="14.5" font-family="monospace" fill="#991b1b" font-weight="700">box.pop()</text>
    <text x="600" y="86" font-size="12.5" fill="#64748b">снимает ПОСЛЕДНИЙ и отдаёт его</text>
    <text x="470" y="110" font-size="14.5" font-family="monospace" fill="#991b1b" font-weight="700">box.pop(0)</text>
    <text x="600" y="110" font-size="12.5" fill="#64748b">снимает по индексу 0</text>
    <text x="207" y="120" font-size="12.5" fill="#dc2626" text-anchor="middle" font-weight="700">сосед справа сдвинется влево</text>
  </g>
</svg>
