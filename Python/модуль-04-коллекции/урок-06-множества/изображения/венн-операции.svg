<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="430" fill="#f7f9fc"/>
  <text x="410" y="36" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">🔗 Операции над множествами (круги Венна)</text>
  <text x="410" y="60" font-size="14" fill="#64748b" text-anchor="middle">Теги двух постов: A = {питон, код, игра}, B = {код, игра, музыка}</text>

  <!-- Union -->
  <g transform="translate(30,90)">
    <text x="120" y="16" font-size="15" font-weight="700" fill="#9a3412" text-anchor="middle">A | B — объединение</text>
    <text x="120" y="34" font-size="12" fill="#64748b" text-anchor="middle">всё вместе</text>
    <circle cx="90" cy="120" r="62" fill="#ea580c" fill-opacity="0.28" stroke="#ea580c" stroke-width="2"/>
    <circle cx="150" cy="120" r="62" fill="#ea580c" fill-opacity="0.28" stroke="#ea580c" stroke-width="2"/>
    <text x="66" y="108" font-size="12" fill="#9a3412" text-anchor="middle">питон</text>
    <text x="120" y="118" font-size="12" fill="#9a3412" text-anchor="middle" font-weight="700">код</text>
    <text x="120" y="134" font-size="12" fill="#9a3412" text-anchor="middle" font-weight="700">игра</text>
    <text x="176" y="108" font-size="11" fill="#9a3412" text-anchor="middle">музыка</text>
    <text x="120" y="205" font-size="12" font-family="monospace" fill="#334155" text-anchor="middle">{питон,код,игра,музыка}</text>
  </g>

  <!-- Intersection -->
  <g transform="translate(290,90)">
    <text x="120" y="16" font-size="15" font-weight="700" fill="#0e7490" text-anchor="middle">A &amp; B — пересечение</text>
    <text x="120" y="34" font-size="12" fill="#64748b" text-anchor="middle">только общее</text>
    <circle cx="90" cy="120" r="62" fill="none" stroke="#0891b2" stroke-width="2"/>
    <circle cx="150" cy="120" r="62" fill="none" stroke="#0891b2" stroke-width="2"/>
    <path d="M120 66 A62 62 0 0 1 120 174 A62 62 0 0 1 120 66 Z" fill="#0891b2" fill-opacity="0.35"/>
    <text x="120" y="118" font-size="12" fill="#0e7490" text-anchor="middle" font-weight="700">код</text>
    <text x="120" y="134" font-size="12" fill="#0e7490" text-anchor="middle" font-weight="700">игра</text>
    <text x="120" y="205" font-size="12" font-family="monospace" fill="#334155" text-anchor="middle">{код, игра}</text>
  </g>

  <!-- Difference -->
  <g transform="translate(550,90)">
    <text x="120" y="16" font-size="15" font-weight="700" fill="#6d28d9" text-anchor="middle">A - B — разность</text>
    <text x="120" y="34" font-size="12" fill="#64748b" text-anchor="middle">только у A</text>
    <clipPath id="clipA"><circle cx="90" cy="120" r="62"/></clipPath>
    <circle cx="90" cy="120" r="62" fill="#7c3aed" fill-opacity="0.30" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="150" cy="120" r="62" fill="#f7f9fc" clip-path="url(#clipA)"/>
    <circle cx="90" cy="120" r="62" fill="none" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="150" cy="120" r="62" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="66" y="122" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="700">питон</text>
    <text x="120" y="205" font-size="12" font-family="monospace" fill="#334155" text-anchor="middle">{питон}</text>
  </g>

  <rect x="200" y="330" width="420" height="72" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="410" y="356" font-size="14" font-family="monospace" fill="#9a3412" text-anchor="middle">A | B  ·  A &amp; B  ·  A - B</text>
  <text x="410" y="382" font-size="13" fill="#334155" text-anchor="middle">объединение · пересечение · разность (можно и словами: union / intersection / difference)</text>
</svg>
