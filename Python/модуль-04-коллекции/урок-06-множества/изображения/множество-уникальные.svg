<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="400" fill="#f7f9fc"/>
  <text x="410" y="38" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">🎯 Множество: только уникальные, без порядка</text>
  <text x="410" y="62" font-size="14" fill="#64748b" text-anchor="middle">set(...) выкидывает все повторы. Порядок не хранится — это набор, а не ряд.</text>

  <!-- LIST with duplicates -->
  <g transform="translate(50,95)">
    <rect x="0" y="0" width="330" height="240" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="165" y="32" font-size="17" font-weight="700" fill="#0e7490" text-anchor="middle">Список — с повторами</text>
    <text x="165" y="56" font-size="13" font-family="monospace" fill="#0e7490" text-anchor="middle">["кот","пёс","кот","кот","пёс"]</text>
    <g font-size="15" font-family="monospace">
      <rect x="25" y="80" width="80" height="42" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="65" y="107" text-anchor="middle" fill="#0e7490">кот</text>
      <rect x="125" y="80" width="80" height="42" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="165" y="107" text-anchor="middle" fill="#0e7490">пёс</text>
      <rect x="225" y="80" width="80" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="265" y="107" text-anchor="middle" fill="#991b1b">кот</text>
      <rect x="75" y="132" width="80" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="115" y="159" text-anchor="middle" fill="#991b1b">кот</text>
      <rect x="175" y="132" width="80" height="42" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="215" y="159" text-anchor="middle" fill="#991b1b">пёс</text>
    </g>
    <text x="165" y="206" font-size="13.5" fill="#64748b" text-anchor="middle">5 элементов (3 из них — повторы)</text>
  </g>

  <!-- arrow -->
  <g transform="translate(392,205)">
    <text x="14" y="0" font-size="14" font-family="monospace" fill="#9a3412" text-anchor="middle">set(...)</text>
    <line x1="-10" y1="10" x2="38" y2="10" stroke="#ea580c" stroke-width="3"/>
    <polygon points="46,10 34,4 34,16" fill="#ea580c"/>
  </g>

  <!-- SET -->
  <g transform="translate(450,95)">
    <rect x="0" y="0" width="320" height="240" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="160" y="32" font-size="17" font-weight="700" fill="#9a3412" text-anchor="middle">Множество — уникальные</text>
    <text x="160" y="56" font-size="13" font-family="monospace" fill="#9a3412" text-anchor="middle">{"кот", "пёс"}</text>
    <g font-size="16" font-family="monospace" font-weight="700">
      <rect x="45" y="95" width="100" height="52" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><text x="95" y="128" text-anchor="middle" fill="#9a3412">кот</text>
      <rect x="175" y="95" width="100" height="52" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><text x="225" y="128" text-anchor="middle" fill="#9a3412">пёс</text>
    </g>
    <text x="160" y="185" font-size="13.5" fill="#9a3412" text-anchor="middle">2 элемента — каждый один раз</text>
    <text x="160" y="210" font-size="12.5" fill="#64748b" text-anchor="middle">порядка нет: индекса [0] у set НЕТ</text>
  </g>

  <text x="410" y="382" font-size="13.5" fill="#334155" text-anchor="middle">💡 Нужны только разные значения (теги, гости, уникальные слова) — бери множество. Скобки фигурные { }.</text>
</svg>
