<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 7 «Мини-база данных» (Python)</title>
<style>
  :root{
    --bg1:#fdba74; --bg2:#ea580c; --card:#ffffff; --ink:#1f2937;
    --accent:#ea580c; --ok:#16a34a; --bad:#dc2626; --soft:#ffedd5;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:18px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Как удобнее всего хранить таблицу данных (много героев с полями)?",
   a:["тремя отдельными списками","списком словарей","одним числом","строкой"],c:1,
   e:"Таблица данных — это список словарей: каждая запись — словарь."},
  {q:"Дан <code>heroes = [{\"имя\":\"Маг\",\"hp\":70}]</code>. Как достать hp Мага?",
   a:["<code>heroes[\"hp\"]</code>","<code>heroes[0][\"hp\"]</code>","<code>heroes.hp</code>","<code>heroes[0]</code>"],c:1,
   e:"Сначала строка heroes[0] (список), потом поле [\"hp\"] (словарь)."},
  {q:"Что вернёт <code>heroes[1]</code> в списке словарей?",
   a:["имя второго героя","весь словарь второго героя","число 1","ошибку"],c:1,
   e:"heroes[1] — это вся вторая запись (словарь целиком)."},
  {q:"Что будет от <code>heroes[\"имя\"]</code> (обращение к списку по ключу)?",
   a:["имя первого","TypeError","None","весь список"],c:1,
   e:"Список берут по номеру, а не по ключу. Нужно heroes[0][\"имя\"]."},
  {q:"Как перебрать все записи таблицы?",
   a:["<code>for hero in heroes</code>","<code>for hero in heroes.keys()</code>","<code>while heroes</code>","никак"],c:0,
   e:"for hero in heroes — на каждом шаге hero это словарь-запись."},
  {q:"Как добавить нового героя в таблицу?",
   a:["<code>heroes.add(...)</code>","<code>heroes.append({...})</code>","<code>heroes[\"new\"]=...</code>","никак"],c:1,
   e:"Новая запись — это словарь, добавляем его через append."},
  {q:"Как найти запись по имени?",
   a:["перебрать и сравнить <code>hero[\"имя\"]==name</code>","<code>heroes[name]</code>","<code>heroes.find(name)</code>","никак"],c:0,
   e:"Идём по списку и сравниваем поле; найденную запись запоминаем."},
  {q:"Как собрать всех героев класса «воин»?",
   a:["<code>heroes[\"воин\"]</code>","пустой список + перебор + if по полю + append","<code>heroes.filter()</code>","<code>set(heroes)</code>"],c:1,
   e:"Фильтр записей: пустой список → перебор → условие по полю → append."},
  {q:"Как посчитать средний hp отряда?",
   a:["<code>avg(heroes)</code>","сумма всех hero[\"hp\"] делить на len","<code>heroes / 2</code>","никак"],c:1,
   e:"Копим сумму поля в цикле и делим на количество записей."},
  {q:"Как найти героя с наибольшим hp?",
   a:["<code>max(heroes)</code>","перебор с запоминанием рекордсмена","<code>heroes[-1]</code>","<code>sorted(heroes)</code>"],c:1,
   e:"Заводим чемпион=heroes[0] и обновляем, если hero[\"hp\"] больше."},
  {q:"Как отсортировать записи по полю hp (без своих функций)?",
   a:["<code>heroes.sort()</code>","собрать пары (hp, имя) и отсортировать их","никак","<code>heroes.order()</code>"],c:1,
   e:"Кортежи сравниваются по первому элементу — ставим hp первым."},
  {q:"Как посчитать, сколько героев каждого класса?",
   a:["словарём-счётчиком по полю \"класс\"","<code>len(heroes)</code>","множеством","никак"],c:0,
   e:"c[hero[\"класс\"]] = c.get(hero[\"класс\"], 0) + 1 — счётчик по полю."},

  {q:"😄 <code>heroes[\"hp\"]</code> дал TypeError. Что не так?",
   a:["нет героев","список берут по номеру, не по ключу","мало памяти","нужен print"],c:1,
   e:"Сначала строка по номеру heroes[0], потом поле по ключу [\"hp\"]."},
  {q:"😄 Искал героя, получил ошибку на <code>найден[\"hp\"]</code>. Почему?",
   a:["герой не найден, найден=None","hp отрицательный","мало скобок","нужен list"],c:0,
   e:"Не нашли — найден остался None. Проверяй if найден is not None."},
  {q:"😄 Данные о героях «съехали»: у Мага показался чужой hp. В чём была ошибка?",
   a:["вирус","хранил параллельные списки, индексы разошлись","мало оперативки","Python устал"],c:1,
   e:"Держи всё об одном герое в одном словаре, а не в разных списках."},

  {q:"🤔 <code>h={\"имя\":\"Маг\",\"вещи\":[\"меч\"]}; h[\"вещи\"].append(\"щит\")</code> — что в вещах?",
   a:["[\"меч\"]","[\"меч\",\"щит\"]","[\"щит\"]","ошибка"],c:1,
   e:"Поле-список можно менять: добавили щит к мечу."},
  {q:"🤔 <code>пары=[(70,\"Маг\"),(100,\"Рыцарь\")]; пары.sort()</code> — что первым?",
   a:["(100,\"Рыцарь\")","(70,\"Маг\")","ошибка","непонятно"],c:1,
   e:"Сортировка по первому элементу кортежа: 70 < 100, поэтому Маг первым."},
  {q:"🤔 <code>len([{\"a\":1},{\"a\":2},{\"a\":3}])</code> — сколько?",
   a:["1","3","6","9"],c:1,
   e:"len списка — это число записей: 3 словаря."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🗃️ Викторина: мини-база данных</h1>
    <div class="sub">Урок 7 · Модуль 4 «Коллекции» (финал) · Python</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Таблицы-словари освоены — Модуль «Коллекции» пройден на отлично! 🔥';}
  else if(pct>=70){em='🎉';msg='Отлично! Список словарей, поиск и фильтр в кармане. Модуль 4 завершён!';}
  else if(pct>=40){em='👍';msg='Неплохо! Пробегись по итого.md — про доступ [i]["поле"] и сортировку по полю.';}
  else {em='💪';msg='Ещё разок! Открой итого.md и повтори таблицу = список словарей.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
