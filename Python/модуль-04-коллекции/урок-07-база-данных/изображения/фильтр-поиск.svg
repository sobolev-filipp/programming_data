<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="410" fill="#f7f9fc"/>
  <text x="410" y="36" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">🔎 Фильтр: отобрать записи по условию</text>
  <text x="410" y="60" font-size="14" fill="#64748b" text-anchor="middle">Проходим таблицу и складываем в новый список только подходящие записи (класс == "воин").</text>

  <!-- source list -->
  <g transform="translate(40,90)" font-family="monospace" font-size="14">
    <text x="150" y="0" font-size="14" font-weight="700" fill="#334155" text-anchor="middle" font-family="'Segoe UI'">heroes — все записи</text>
    <rect x="0" y="14" width="300" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="12" y="40" fill="#166534">Рыцарь · воин · hp 100 ✓</text>
    <rect x="0" y="60" width="300" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="12" y="86" fill="#991b1b">Маг · маг · hp 70 ✗</text>
    <rect x="0" y="106" width="300" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="12" y="132" fill="#166534">Лучник · воин · hp 80 ✓</text>
    <rect x="0" y="152" width="300" height="40" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="12" y="178" fill="#991b1b">Вор · плут · hp 60 ✗</text>
  </g>

  <!-- arrow + condition -->
  <g transform="translate(360,190)">
    <rect x="-6" y="-24" width="112" height="48" rx="10" fill="#0f172a"/>
    <text x="50" y="-6" font-size="12" font-family="monospace" fill="#93c5fd" text-anchor="middle">if hero</text>
    <text x="50" y="12" font-size="12" font-family="monospace" fill="#93c5fd" text-anchor="middle">["класс"]=="воин"</text>
    <line x1="106" y1="0" x2="150" y2="0" stroke="#ea580c" stroke-width="3"/>
    <polygon points="158,0 146,-6 146,6" fill="#ea580c"/>
  </g>

  <!-- result list -->
  <g transform="translate(530,120)" font-family="monospace" font-size="14">
    <text x="125" y="-14" font-size="14" font-weight="700" fill="#9a3412" text-anchor="middle" font-family="'Segoe UI'">воины — новый список</text>
    <rect x="0" y="0" width="250" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="12" y="26" fill="#9a3412">Рыцарь · воин · hp 100</text>
    <rect x="0" y="48" width="250" height="40" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="12" y="74" fill="#9a3412">Лучник · воин · hp 80</text>
  </g>

  <rect x="120" y="330" width="580" height="56" rx="12" fill="#0f172a"/>
  <text x="145" y="354" font-size="14" font-family="monospace" fill="#e2e8f0">воины = []</text>
  <text x="145" y="374" font-size="14" font-family="monospace" fill="#93c5fd">for hero in heroes:  if hero["класс"]=="воин": воины.append(hero)</text>
</svg>
