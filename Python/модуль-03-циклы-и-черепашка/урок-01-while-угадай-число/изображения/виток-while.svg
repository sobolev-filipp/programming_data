<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arG" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arR" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="430" fill="#f7f9fc"/>
  <text x="390" y="34" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">🔁 Один виток цикла while</text>
  <text x="390" y="58" font-size="14" fill="#64748b" text-anchor="middle">Пока условие True — тело повторяется. Стало False — выходим.</text>

  <!-- init -->
  <rect x="290" y="78" width="200" height="44" rx="10" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
  <text x="390" y="106" font-size="17" font-family="monospace" fill="#0f766e" text-anchor="middle" font-weight="700">count = 1</text>
  <path d="M390,122 L390,148" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#ar)"/>

  <!-- diamond condition -->
  <polygon points="390,150 508,205 390,260 272,205" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/>
  <text x="390" y="200" font-size="16" font-family="monospace" fill="#0f766e" text-anchor="middle" font-weight="700">count &lt;= 5 ?</text>
  <text x="390" y="222" font-size="12.5" fill="#64748b" text-anchor="middle">проверка условия</text>

  <!-- False branch to exit -->
  <path d="M508,205 L578,205" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arR)"/>
  <text x="543" y="196" font-size="14" fill="#dc2626" text-anchor="middle" font-weight="700">False</text>
  <rect x="582" y="183" width="168" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="666" y="211" font-size="15" fill="#991b1b" text-anchor="middle" font-weight="700">выход из цикла</text>

  <!-- True branch to body -->
  <path d="M390,260 L390,298" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#arG)"/>
  <text x="418" y="284" font-size="14" fill="#16a34a" text-anchor="middle" font-weight="700">True</text>

  <!-- body -->
  <rect x="268" y="300" width="244" height="66" rx="10" fill="#0f172a"/>
  <text x="390" y="326" font-size="15" font-family="monospace" fill="#e2e8f0" text-anchor="middle">print(count)</text>
  <text x="390" y="350" font-size="15" font-family="monospace" fill="#5eead4" text-anchor="middle">count += 1</text>
  <text x="390" y="383" font-size="12.5" fill="#64748b" text-anchor="middle">тело цикла (с отступом)</text>

  <!-- loop back -->
  <path d="M268,333 L175,333 L175,205 L270,205" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#ar)" stroke-dasharray="7 5"/>
  <text x="120" y="270" font-size="13" fill="#0d9488" font-weight="700" transform="rotate(-90 120 270)" text-anchor="middle">назад к проверке</text>
</svg>
