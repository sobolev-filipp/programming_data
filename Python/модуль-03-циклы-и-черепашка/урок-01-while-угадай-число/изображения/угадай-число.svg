<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="g_ar" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="g_arT" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0d9488"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="500" fill="#f7f9fc"/>
  <text x="400" y="32" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">🎯 Как работает «Угадай число»</text>
  <text x="400" y="56" font-size="14" fill="#64748b" text-anchor="middle">while True повторяет вопрос, а break выходит, когда угадали.</text>

  <!-- setup -->
  <rect x="250" y="72" width="300" height="54" rx="10" fill="#fff" stroke="#0d9488" stroke-width="2.5"/>
  <text x="400" y="94" font-size="13.5" font-family="monospace" fill="#0f766e" text-anchor="middle">secret = random.randint(1, 100)</text>
  <text x="400" y="114" font-size="13.5" font-family="monospace" fill="#0f766e" text-anchor="middle">attempts = 0</text>
  <path d="M400,126 L400,152" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#g_ar)"/>

  <!-- loop container -->
  <rect x="90" y="140" width="620" height="292" rx="14" fill="none" stroke="#0d9488" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="104" y="160" font-size="14" font-family="monospace" fill="#0d9488" font-weight="700">while True:</text>

  <!-- input -->
  <rect x="300" y="166" width="200" height="52" rx="10" fill="#0f172a"/>
  <text x="400" y="188" font-size="12.5" font-family="monospace" fill="#e2e8f0" text-anchor="middle">guess = int(input(...))</text>
  <text x="400" y="208" font-size="12.5" font-family="monospace" fill="#5eead4" text-anchor="middle">attempts += 1</text>
  <path d="M400,218 L400,236" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#g_ar)"/>

  <!-- diamond A: guess < secret -->
  <polygon points="400,238 476,272 400,306 324,272" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/>
  <text x="400" y="277" font-size="13" font-family="monospace" fill="#0f766e" text-anchor="middle" font-weight="700">guess &lt; secret ?</text>
  <!-- Больше box -->
  <path d="M476,272 L520,272" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#g_arT)"/>
  <text x="498" y="264" font-size="12" fill="#0d9488" text-anchor="middle" font-weight="700">да</text>
  <rect x="522" y="253" width="96" height="38" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
  <text x="570" y="277" font-size="15" fill="#075985" text-anchor="middle" font-weight="700">Больше!</text>
  <!-- down to diamond B -->
  <path d="M400,306 L400,326" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#g_ar)"/>
  <text x="418" y="320" font-size="12" fill="#64748b">нет</text>

  <!-- diamond B: guess > secret -->
  <polygon points="400,328 476,362 400,396 324,362" fill="#ccfbf1" stroke="#0d9488" stroke-width="2.5"/>
  <text x="400" y="367" font-size="13" font-family="monospace" fill="#0f766e" text-anchor="middle" font-weight="700">guess &gt; secret ?</text>
  <!-- Меньше box -->
  <path d="M476,362 L520,362" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#g_arT)"/>
  <text x="498" y="354" font-size="12" fill="#0d9488" text-anchor="middle" font-weight="700">да</text>
  <rect x="522" y="343" width="96" height="38" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
  <text x="570" y="367" font-size="15" fill="#075985" text-anchor="middle" font-weight="700">Меньше!</text>

  <!-- loop-back channel -->
  <path d="M618,272 L672,272 M618,362 L672,362 M672,362 L672,192 L502,192" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#g_ar)"/>
  <text x="690" y="330" font-size="12.5" fill="#0d9488" font-weight="700" transform="rotate(-90 690 330)" text-anchor="middle">снова спросить</text>

  <!-- else: Верно -->
  <path d="M400,396 L400,414" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#g_ar)"/>
  <text x="424" y="410" font-size="12" fill="#16a34a" font-weight="700">иначе — равно!</text>
  <rect x="270" y="414" width="260" height="34" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="436" font-size="13.5" fill="#15803d" text-anchor="middle" font-weight="700">Верно! Угадал за attempts попыток</text>

  <!-- break out -->
  <path d="M400,448 L400,470" stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#g_ar)"/>
  <text x="440" y="464" font-size="13" font-family="monospace" fill="#dc2626" font-weight="700">break</text>
  <rect x="290" y="470" width="220" height="24" rx="8" fill="#fff" stroke="#334155" stroke-width="1.6"/>
  <text x="400" y="487" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="700">выход из цикла — конец игры</text>
</svg>
