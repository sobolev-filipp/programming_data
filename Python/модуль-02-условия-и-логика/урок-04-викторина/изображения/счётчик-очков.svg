<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="470" fill="#f7f9fc"/>
  <text x="410" y="36" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">🔢 Счётчик очков: <tspan font-family="monospace" fill="#7c3aed">score = score + 1</tspan></text>
  <text x="410" y="60" font-size="14" fill="#64748b" text-anchor="middle">заводим переменную-копилку в 0 и добавляем по 1 за каждый верный ответ</text>

  <!-- start box -->
  <g transform="translate(60,92)">
    <rect x="0" y="0" width="200" height="60" rx="10" fill="#0f172a"/>
    <text x="18" y="37" font-size="17" font-family="monospace"><tspan fill="#60a5fa">score</tspan> <tspan fill="#94a3b8">=</tspan> <tspan fill="#fbbf24">0</tspan></text>
    <text x="18" y="-6" font-size="12.5" fill="#64748b">до викторины — копилка пуста</text>
  </g>

  <!-- counter jar visual -->
  <g transform="translate(300,92)">
    <text x="120" y="-6" font-size="12.5" fill="#64748b" text-anchor="middle">после каждого верного ответа копилка растёт</text>
  </g>

  <!-- steps -->
  <!-- Q1 correct -->
  <g transform="translate(60,180)">
    <rect x="0" y="0" width="300" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="14" y="28" font-size="14.5" fill="#166534">Вопрос 1 — верно ✅</text>
    <text x="180" y="28" font-size="14" font-family="monospace" fill="#15803d">score = 0 + 1</text>
  </g>
  <text x="390" y="209" font-size="20" font-weight="800" fill="#16a34a" font-family="monospace">→ 1</text>

  <!-- Q2 wrong -->
  <g transform="translate(60,234)">
    <rect x="0" y="0" width="300" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="14" y="28" font-size="14.5" fill="#991b1b">Вопрос 2 — неверно ❌</text>
    <text x="180" y="28" font-size="14" font-family="monospace" fill="#991b1b">score не меняется</text>
  </g>
  <text x="390" y="263" font-size="20" font-weight="800" fill="#94a3b8" font-family="monospace">→ 1</text>

  <!-- Q3 correct -->
  <g transform="translate(60,288)">
    <rect x="0" y="0" width="300" height="46" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="14" y="28" font-size="14.5" fill="#166534">Вопрос 3 — верно ✅</text>
    <text x="180" y="28" font-size="14" font-family="monospace" fill="#15803d">score = 1 + 1</text>
  </g>
  <text x="390" y="317" font-size="20" font-weight="800" fill="#16a34a" font-family="monospace">→ 2</text>

  <!-- big total -->
  <g transform="translate(470,180)">
    <rect x="0" y="0" width="290" height="154" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="145" y="34" font-size="15" font-weight="700" fill="#5b21b6" text-anchor="middle">Итог викторины</text>
    <text x="145" y="92" font-size="48" font-weight="800" fill="#7c3aed" text-anchor="middle" font-family="monospace">score = 2</text>
    <text x="145" y="124" font-size="14" fill="#4c1d95" text-anchor="middle">из 3 вопросов</text>
    <text x="145" y="144" font-size="13" fill="#6d28d9" text-anchor="middle" font-family="monospace">процент = 2 / 3 * 100 ≈ 67%</text>
  </g>

  <!-- shortcut note -->
  <g transform="translate(60,362)">
    <rect x="0" y="0" width="700" height="86" rx="12" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/>
    <text x="20" y="30" font-size="15" font-weight="800" fill="#0e7490">Короткая запись — то же самое:</text>
    <text x="20" y="58" font-size="16" font-family="monospace" fill="#0f172a"><tspan fill="#0891b2" font-weight="700">score += 1</tspan>   ⟺   score = score + 1   («прибавь 1 к копилке»)</text>
    <text x="20" y="78" font-size="13" fill="#0e7490">Так же есть <tspan font-family="monospace">-=</tspan>, <tspan font-family="monospace">*=</tspan>: например <tspan font-family="monospace">lives -= 1</tspan> — «отними жизнь».</text>
  </g>
</svg>
