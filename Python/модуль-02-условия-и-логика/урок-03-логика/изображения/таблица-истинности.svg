<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="470" fill="#f7f9fc"/>
  <text x="410" y="36" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">📋 Таблица истинности</text>
  <text x="410" y="60" font-size="14" fill="#64748b" text-anchor="middle">A и B — два условия. В таблице — что получится при всех сочетаниях True/False.</text>

  <!-- AND table -->
  <g transform="translate(40,88)">
    <text x="130" y="16" font-size="18" font-weight="800" fill="#7c3aed" text-anchor="middle" font-family="monospace">A and B</text>
    <!-- header -->
    <g font-size="15" font-family="monospace" font-weight="700">
      <rect x="0" y="28" width="80" height="34" fill="#ede9fe" stroke="#c4b5fd"/>
      <rect x="80" y="28" width="80" height="34" fill="#ede9fe" stroke="#c4b5fd"/>
      <rect x="160" y="28" width="100" height="34" fill="#ddd6fe" stroke="#c4b5fd"/>
      <text x="40" y="51" fill="#5b21b6" text-anchor="middle">A</text>
      <text x="120" y="51" fill="#5b21b6" text-anchor="middle">B</text>
      <text x="210" y="51" fill="#5b21b6" text-anchor="middle">рез.</text>
    </g>
    <!-- rows -->
    <g font-size="14" font-family="monospace">
      <!-- r1 -->
      <rect x="0" y="62" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="80" y="62" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="160" y="62" width="100" height="32" fill="#dcfce7" stroke="#e2e8f0"/>
      <text x="40" y="83" fill="#16a34a" text-anchor="middle">True</text><text x="120" y="83" fill="#16a34a" text-anchor="middle">True</text><text x="210" y="83" fill="#15803d" font-weight="700" text-anchor="middle">True</text>
      <!-- r2 -->
      <rect x="0" y="94" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="80" y="94" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="160" y="94" width="100" height="32" fill="#fee2e2" stroke="#e2e8f0"/>
      <text x="40" y="115" fill="#16a34a" text-anchor="middle">True</text><text x="120" y="115" fill="#dc2626" text-anchor="middle">False</text><text x="210" y="115" fill="#991b1b" font-weight="700" text-anchor="middle">False</text>
      <!-- r3 -->
      <rect x="0" y="126" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="80" y="126" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="160" y="126" width="100" height="32" fill="#fee2e2" stroke="#e2e8f0"/>
      <text x="40" y="147" fill="#dc2626" text-anchor="middle">False</text><text x="120" y="147" fill="#16a34a" text-anchor="middle">True</text><text x="210" y="147" fill="#991b1b" font-weight="700" text-anchor="middle">False</text>
      <!-- r4 -->
      <rect x="0" y="158" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="80" y="158" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="160" y="158" width="100" height="32" fill="#fee2e2" stroke="#e2e8f0"/>
      <text x="40" y="179" fill="#dc2626" text-anchor="middle">False</text><text x="120" y="179" fill="#dc2626" text-anchor="middle">False</text><text x="210" y="179" fill="#991b1b" font-weight="700" text-anchor="middle">False</text>
    </g>
    <text x="130" y="214" font-size="12.5" fill="#7c3aed" text-anchor="middle">True лишь в 1 строке — нужны ОБА</text>
  </g>

  <!-- OR table -->
  <g transform="translate(320,88)">
    <text x="130" y="16" font-size="18" font-weight="800" fill="#0891b2" text-anchor="middle" font-family="monospace">A or B</text>
    <g font-size="15" font-family="monospace" font-weight="700">
      <rect x="0" y="28" width="80" height="34" fill="#cffafe" stroke="#a5f3fc"/>
      <rect x="80" y="28" width="80" height="34" fill="#cffafe" stroke="#a5f3fc"/>
      <rect x="160" y="28" width="100" height="34" fill="#a5f3fc" stroke="#a5f3fc"/>
      <text x="40" y="51" fill="#0e7490" text-anchor="middle">A</text>
      <text x="120" y="51" fill="#0e7490" text-anchor="middle">B</text>
      <text x="210" y="51" fill="#0e7490" text-anchor="middle">рез.</text>
    </g>
    <g font-size="14" font-family="monospace">
      <rect x="0" y="62" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="80" y="62" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="160" y="62" width="100" height="32" fill="#dcfce7" stroke="#e2e8f0"/>
      <text x="40" y="83" fill="#16a34a" text-anchor="middle">True</text><text x="120" y="83" fill="#16a34a" text-anchor="middle">True</text><text x="210" y="83" fill="#15803d" font-weight="700" text-anchor="middle">True</text>
      <rect x="0" y="94" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="80" y="94" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="160" y="94" width="100" height="32" fill="#dcfce7" stroke="#e2e8f0"/>
      <text x="40" y="115" fill="#16a34a" text-anchor="middle">True</text><text x="120" y="115" fill="#dc2626" text-anchor="middle">False</text><text x="210" y="115" fill="#15803d" font-weight="700" text-anchor="middle">True</text>
      <rect x="0" y="126" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="80" y="126" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="160" y="126" width="100" height="32" fill="#dcfce7" stroke="#e2e8f0"/>
      <text x="40" y="147" fill="#dc2626" text-anchor="middle">False</text><text x="120" y="147" fill="#16a34a" text-anchor="middle">True</text><text x="210" y="147" fill="#15803d" font-weight="700" text-anchor="middle">True</text>
      <rect x="0" y="158" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="80" y="158" width="80" height="32" fill="#fff" stroke="#e2e8f0"/><rect x="160" y="158" width="100" height="32" fill="#fee2e2" stroke="#e2e8f0"/>
      <text x="40" y="179" fill="#dc2626" text-anchor="middle">False</text><text x="120" y="179" fill="#dc2626" text-anchor="middle">False</text><text x="210" y="179" fill="#991b1b" font-weight="700" text-anchor="middle">False</text>
    </g>
    <text x="130" y="214" font-size="12.5" fill="#0891b2" text-anchor="middle">False лишь в 1 строке — хватит одного</text>
  </g>

  <!-- NOT table -->
  <g transform="translate(600,88)">
    <text x="110" y="16" font-size="18" font-weight="800" fill="#db2777" text-anchor="middle" font-family="monospace">not A</text>
    <g font-size="15" font-family="monospace" font-weight="700">
      <rect x="0" y="28" width="100" height="34" fill="#fce7f3" stroke="#fbcfe8"/>
      <rect x="100" y="28" width="120" height="34" fill="#fbcfe8" stroke="#fbcfe8"/>
      <text x="50" y="51" fill="#9d174d" text-anchor="middle">A</text>
      <text x="160" y="51" fill="#9d174d" text-anchor="middle">not A</text>
    </g>
    <g font-size="14" font-family="monospace">
      <rect x="0" y="62" width="100" height="47" fill="#fff" stroke="#e2e8f0"/><rect x="100" y="62" width="120" height="47" fill="#fee2e2" stroke="#e2e8f0"/>
      <text x="50" y="90" fill="#16a34a" text-anchor="middle">True</text><text x="160" y="90" fill="#991b1b" font-weight="700" text-anchor="middle">False</text>
      <rect x="0" y="109" width="100" height="47" fill="#fff" stroke="#e2e8f0"/><rect x="100" y="109" width="120" height="47" fill="#dcfce7" stroke="#e2e8f0"/>
      <text x="50" y="137" fill="#dc2626" text-anchor="middle">False</text><text x="160" y="137" fill="#15803d" font-weight="700" text-anchor="middle">True</text>
    </g>
    <text x="110" y="180" font-size="12.5" fill="#db2777" text-anchor="middle">просто переворот</text>
    <text x="110" y="200" font-size="12.5" fill="#db2777" text-anchor="middle">True ↔ False</text>
  </g>

  <!-- bottom helper -->
  <g transform="translate(40,318)">
    <rect x="0" y="0" width="740" height="106" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="20" y="30" font-size="16" font-weight="800" fill="#5b21b6">Как быстро запомнить:</text>
    <text x="20" y="58" font-size="15" fill="#4c1d95"><tspan font-family="monospace" font-weight="700">and</tspan> — «всё или ничего»: одно False рушит весь ответ.</text>
    <text x="20" y="82" font-size="15" fill="#4c1d95"><tspan font-family="monospace" font-weight="700">or</tspan> — «спасатель»: одно True спасает весь ответ.</text>
    <text x="400" y="58" font-size="15" fill="#4c1d95"><tspan font-family="monospace" font-weight="700">not</tspan> — «наоборот»: было да — стало нет.</text>
    <text x="400" y="82" font-size="14" fill="#6d28d9">Ответ логики — тоже <tspan font-family="monospace" font-weight="700">bool</tspan> (True/False).</text>
  </g>

  <text x="410" y="452" font-size="13.5" fill="#475569" text-anchor="middle" font-style="italic">💡 Не зубри — пойми: and требует всех, or доволен одним, not переворачивает.</text>
</svg>
