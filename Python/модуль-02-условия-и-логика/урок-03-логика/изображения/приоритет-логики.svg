<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="480" fill="#f7f9fc"/>
  <text x="410" y="36" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">🎓 Порядок логики: <tspan font-family="monospace" fill="#db2777">not</tspan> → <tspan font-family="monospace" fill="#7c3aed">and</tspan> → <tspan font-family="monospace" fill="#0891b2">or</tspan></text>
  <text x="410" y="60" font-size="14" fill="#64748b" text-anchor="middle">как и в математике, есть приоритет. Не уверен — ставь скобки, они всегда главнее.</text>

  <!-- priority ladder -->
  <g transform="translate(60,86)">
    <rect x="0" y="0" width="300" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="150" y="30" font-size="16" font-weight="800" fill="#334155" text-anchor="middle">Кто раньше</text>
    <!-- 1 -->
    <rect x="20" y="44" width="260" height="30" rx="8" fill="#fce7f3"/>
    <text x="34" y="65" font-size="15" font-family="monospace" font-weight="700" fill="#9d174d">1) not</text>
    <text x="150" y="65" font-size="13" fill="#9d174d">— сначала переворот</text>
    <!-- 2 -->
    <rect x="20" y="80" width="260" height="30" rx="8" fill="#ede9fe"/>
    <text x="34" y="101" font-size="15" font-family="monospace" font-weight="700" fill="#5b21b6">2) and</text>
    <text x="150" y="101" font-size="13" fill="#5b21b6">— потом «И»</text>
    <!-- 3 -->
    <rect x="20" y="116" width="260" height="30" rx="8" fill="#cffafe"/>
    <text x="34" y="137" font-size="15" font-family="monospace" font-weight="700" fill="#0e7490">3) or</text>
    <text x="150" y="137" font-size="13" fill="#0e7490">— в конце «ИЛИ»</text>
  </g>

  <!-- analogy -->
  <g transform="translate(400,86)">
    <rect x="0" y="0" width="360" height="150" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="180" y="30" font-size="15" font-weight="800" fill="#b45309" text-anchor="middle">Подсказка-аналогия</text>
    <text x="20" y="60" font-size="14" fill="#92400e"><tspan font-family="monospace" font-weight="700">and</tspan> — как умножение <tspan font-family="monospace">×</tspan> (сильнее)</text>
    <text x="20" y="86" font-size="14" fill="#92400e"><tspan font-family="monospace" font-weight="700">or</tspan> — как сложение <tspan font-family="monospace">+</tspan> (слабее)</text>
    <text x="20" y="118" font-size="14" fill="#92400e">Значит <tspan font-family="monospace" font-weight="700">and</tspan> «склеивает» плотнее,</text>
    <text x="20" y="138" font-size="14" fill="#92400e">чем <tspan font-family="monospace" font-weight="700">or</tspan> — как <tspan font-family="monospace">×</tspan> перед <tspan font-family="monospace">+</tspan>.</text>
  </g>

  <!-- example without parens -->
  <g transform="translate(60,256)">
    <text x="0" y="0" font-size="15" font-weight="700" fill="#334155">Один пример — два смысла:</text>
    <rect x="0" y="16" width="700" height="44" rx="10" fill="#0f172a"/>
    <text x="18" y="44" font-size="16" font-family="'Consolas',monospace"><tspan fill="#c084fc">True</tspan> <tspan fill="#7c3aed">or</tspan> <tspan fill="#c084fc">False</tspan> <tspan fill="#7c3aed">and</tspan> <tspan fill="#c084fc">False</tspan></text>
    <text x="360" y="44" font-size="14" font-family="monospace" fill="#94a3b8">← как Python это видит?</text>
  </g>

  <!-- interpretation -->
  <g transform="translate(60,332)">
    <rect x="0" y="0" width="340" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="16" y="28" font-size="14" font-weight="800" fill="#15803d">Python (and раньше or):</text>
    <text x="16" y="54" font-size="15" font-family="monospace" fill="#166534">True or (False and False)</text>
    <text x="16" y="78" font-size="15" font-family="monospace" fill="#166534">= True or False</text>
    <text x="16" y="98" font-size="15" font-family="monospace" font-weight="700" fill="#15803d">= True ✅</text>
  </g>
  <g transform="translate(420,332)">
    <rect x="0" y="0" width="340" height="110" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="16" y="28" font-size="14" font-weight="800" fill="#991b1b">Если бы читали слева направо:</text>
    <text x="16" y="54" font-size="15" font-family="monospace" fill="#7f1d1d">(True or False) and False</text>
    <text x="16" y="78" font-size="15" font-family="monospace" fill="#7f1d1d">= True and False</text>
    <text x="16" y="98" font-size="15" font-family="monospace" font-weight="700" fill="#991b1b">= False ❌ (другой ответ!)</text>
  </g>

  <text x="410" y="470" font-size="13.5" fill="#475569" text-anchor="middle" font-style="italic">💡 Скобки главнее всего: пиши (a and b) or c — так понятно и тебе, и Python.</text>
</svg>
