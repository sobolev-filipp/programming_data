<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Викторина — Урок 2 «else / elif» (Python)</title>
<style>
  :root{
    --bg1:#a78bfa; --bg2:#7c3aed; --card:#ffffff; --ink:#1f2937;
    --accent:#7c3aed; --ok:#16a34a; --bad:#dc2626; --soft:#ede9fe;
  }
  *{box-sizing:border-box;font-family:"Segoe UI",system-ui,sans-serif}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));padding:20px;color:var(--ink)}
  .app{background:var(--card);width:min(760px,100%);border-radius:24px;
    box-shadow:0 25px 60px rgba(0,0,0,.35);padding:34px 34px 28px;position:relative;overflow:hidden}
  h1{margin:0 0 6px;font-size:26px;text-align:center}
  .sub{text-align:center;color:#64748b;margin-bottom:22px;font-size:15px}
  .bar{height:10px;background:var(--soft);border-radius:99px;overflow:hidden;margin-bottom:18px}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);transition:.4s}
  .meta{display:flex;justify-content:space-between;font-size:14px;color:#64748b;margin-bottom:14px}
  .q{font-size:22px;font-weight:700;margin:6px 0 20px;line-height:1.3}
  .q code{background:#0f172a;color:#e2e8f0;padding:2px 8px;border-radius:6px;font-size:18px}
  .opts{display:grid;gap:12px}
  .opt{border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:15px 18px;font-size:18px;
    text-align:left;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:12px}
  .opt:hover{border-color:var(--accent);background:var(--soft);transform:translateY(-2px)}
  .opt b{background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .opt span code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px;font-size:16px}
  .opt.ok{border-color:var(--ok);background:#dcfce7}
  .opt.ok b{background:var(--ok);color:#fff}
  .opt.bad{border-color:var(--bad);background:#fee2e2}
  .opt.bad b{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default;transform:none}
  .fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:16px;display:none;line-height:1.4}
  .fb.show{display:block}
  .fb.good{background:#dcfce7;color:#166534}
  .fb.no{background:#fee2e2;color:#991b1b}
  .fb code{background:#0f172a;color:#e2e8f0;padding:1px 6px;border-radius:5px}
  .btn{margin-top:18px;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);
    color:#fff;font-size:18px;font-weight:700;cursor:pointer;display:none}
  .btn.show{display:block}
  .btn:hover{filter:brightness(1.08)}
  .center{text-align:center}
  .score{font-size:64px;font-weight:800;margin:10px 0}
  .emoji{font-size:70px}
  .hint{color:#94a3b8;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const QUESTIONS = [
  {q:"Что делает <code>else</code>?",
   a:["Повторяет if","Выполняется, когда условие if оказалось False","Проверяет второе условие","Заканчивает программу"],c:1,
   e:"else — «а иначе»: срабатывает, когда условие if ложно."},
  {q:"Как правильно написать «а иначе если» в Python?",
   a:["<code>else if</code>","<code>elseif</code>","<code>elif</code>","<code>ifelse</code>"],c:2,
   e:"В Python — слитно: elif."},
  {q:"Сколько веток лестницы <code>if/elif/else</code> сработает?",
   a:["Все подходящие","Ровно одна — первая с True","Минимум две","Ни одной"],c:1,
   e:"Лестница берёт первое верное условие и останавливается."},
  {q:"Есть ли у <code>else</code> своё условие?",
   a:["Да, обязательно","Нет — это «все остальные случаи»","Только со строками","Только с числами"],c:1,
   e:"У else условия нет. Нужно условие — это elif."},
  {q:"При <code>ball = 82</code>: <code>if ball&gt;=90</code> / <code>elif ball&gt;=75</code> / <code>else</code>. Какая ветка?",
   a:["первая (90)","вторая (75)","else","никакая"],c:1,
   e:"82 не >= 90, но >= 75 — True. Срабатывает вторая ветка."},
  {q:"Чем <code>elif</code> отличается от отдельного второго <code>if</code>?",
   a:["Ничем","elif проверяется, только если прошлые ветки были False","elif быстрее","elif не нужен двоеточие"],c:1,
   e:"elif — часть лестницы: одна ветка. Отдельный if проверяется всегда."},
  {q:"Где ставят проверку неправильного ввода (балл &gt; 100)?",
   a:["в самом конце","в первых ветках лестницы","в else","вообще не ставят"],c:1,
   e:"Защиту ввода — наверх, чтобы отсечь «мусор» до расчётов."},
  {q:"Для оценок с <code>&gt;=</code> в каком порядке идут ветки?",
   a:["от меньшего к большему","от большего к меньшему","в любом","по алфавиту"],c:1,
   e:"Для >= — от большего порога к меньшему, иначе широкое условие поймает всех."},
  {q:"Что ловит <code>else</code> в конце лестницы со строками?",
   a:["ничего","все варианты, что не подошли выше (опечатки, лишнее)","только числа","первую ветку"],c:1,
   e:"else — страховка: ловит всё непредусмотренное."},
  {q:"На каком уровне пишутся <code>if</code>, <code>elif</code>, <code>else</code>?",
   a:["с разным отступом","на одном уровне (без отступа), а их тела — с отступом","все с отступом","неважно"],c:1,
   e:"if/elif/else — на одном уровне; тела — с отступом."},

  {q:"😄 Ученик написал <code>else ball &lt; 60:</code> и получил ошибку. Что не так?",
   a:["Балл неверный","У else не бывает условия — нужен elif","Забыл print","Всё верно"],c:1,
   e:"else без условия. Условие — только у if/elif."},
  {q:"😄 Отличник с баллом 95 получил «тройку». Где баг?",
   a:["в Python","ветка >=60 стоит выше >=90 — поймала первой","в вводе","в мониторе"],c:1,
   e:"Неверный порядок: широкое >=60 сработало раньше строгого >=90."},
  {q:"😄 Программа не падает, но ставит не ту оценку. Что проверить в первую очередь?",
   a:["цвет темы","порядок веток и границы (89/90)","скорость интернета","имя файла"],c:1,
   e:"Тихий неверный ответ — почти всегда порядок веток. Прогони границы."},

  {q:"🤔 Почему лестница <code>elif</code> надёжнее нескольких <code>if</code> для оценки?",
   a:["Короче на экране","Гарантирует ровно одну ветку — нельзя случайно получить две оценки","Работает быстрее в 10 раз","Не требует двоеточий"],c:1,
   e:"elif — альтернативы: сработает одна. Отдельные if могли бы дать несколько ответов."},
  {q:"🤔 Зачем всегда добавлять <code>else</code> последним, даже если «всё учтено»?",
   a:["Так требует Python","Чтобы поймать неожиданный ввод (опечатку, пустую строку)","Для скорости","Чтобы код был длиннее"],c:1,
   e:"else — страховка от того, о чём не подумал."},
  {q:"🤔 Для размеров через <code>рост &lt; 160 / &lt; 175 / &lt; 190</code> порядок какой?",
   a:["от большего к меньшему","от меньшего к большему","любой","только через elif нельзя"],c:1,
   e:"С «меньше» пороги идут по возрастанию — тогда первый подходящий верен."},
];

let i=0, score=0, locked=false;
const app=document.getElementById('app');

function shuffle(){for(let k=QUESTIONS.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[QUESTIONS[k],QUESTIONS[j]]=[QUESTIONS[j],QUESTIONS[k]];}for(const Q of QUESTIONS){const cc=Q.a[Q.c];for(let k=Q.a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[Q.a[k],Q.a[j]]=[Q.a[j],Q.a[k]];}Q.c=Q.a.indexOf(cc);}}
shuffle();

function render(){
  const Q=QUESTIONS[i];
  app.innerHTML=`
    <h1>🪜 Лестница: else и elif</h1>
    <div class="sub">Викторина по уроку 2 · Модуль 2 · Python</div>
    <div class="bar"><i style="width:${(i/QUESTIONS.length)*100}%"></i></div>
    <div class="meta"><span>Вопрос ${i+1} из ${QUESTIONS.length}</span><span>⭐ Очки: ${score}</span></div>
    <div class="q">${Q.q}</div>
    <div class="opts" id="opts">
      ${Q.a.map((t,n)=>`<button class="opt" data-n="${n}"><b>${n+1}</b><span>${t}</span></button>`).join('')}
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="next">${i===QUESTIONS.length-1?'Показать результат →':'Следующий вопрос →'}</button>
    <div class="hint">Можно отвечать клавишами 1–4</div>`;
  locked=false;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.n));
  document.getElementById('next').onclick=next;
}

function choose(n){
  if(locked) return; locked=true;
  const Q=QUESTIONS[i];
  const opts=[...document.querySelectorAll('.opt')];
  opts.forEach(b=>b.disabled=true);
  opts[Q.c].classList.add('ok');
  const fb=document.getElementById('fb');
  if(n===Q.c){ score++; fb.className='fb show good'; fb.innerHTML='✅ Верно! '+Q.e; }
  else { opts[n].classList.add('bad'); fb.className='fb show no'; fb.innerHTML='❌ Не совсем. '+Q.e; }
  document.querySelector('.meta').children[1].textContent='⭐ Очки: '+score;
  document.getElementById('next').classList.add('show');
}

function next(){ i++; if(i<QUESTIONS.length) render(); else result(); }

function result(){
  const pct=Math.round(score/QUESTIONS.length*100);
  let em,msg;
  if(pct===100){em='🏆';msg='Идеально! Лестница веток покорена — вперёд к логике and/or/not! 🧠';}
  else if(pct>=70){em='🎉';msg='Отлично! else/elif в кармане, можно в Урок 3.';}
  else if(pct>=40){em='👍';msg='Неплохо! Пробегись по итого.md — особенно про порядок веток.';}
  else {em='💪';msg='Ещё разок! Открой итого.md и повтори про лестницу и порядок.';}
  app.innerHTML=`
    <div class="center">
      <div class="emoji">${em}</div>
      <h1>Готово!</h1>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div class="sub">${msg}</div>
      <button class="btn show" id="again">🔁 Пройти заново</button>
    </div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;shuffle();render();};
}

document.addEventListener('keydown',e=>{
  if(['1','2','3','4'].includes(e.key)){ const b=document.querySelector(`.opt[data-n="${+e.key-1}"]`); if(b&&!b.disabled) choose(+e.key-1); }
  if(e.key==='Enter'){ const nb=document.getElementById('next'); if(nb&&nb.classList.contains('show')) next(); }
});

render();
</script>
</body>
</html>
