<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="500" fill="#f7f9fc"/>
  <text x="410" y="36" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">⚠️ Порядок веток решает всё (диапазоны)</text>
  <text x="410" y="60" font-size="14" fill="#64748b" text-anchor="middle">оценка для балла 95: слева порядок верный, справа — ошибка. Значение одно, ответ разный!</text>

  <!-- LEFT: correct -->
  <text x="205" y="94" font-size="16" font-weight="800" fill="#16a34a" text-anchor="middle">✅ ПРАВИЛЬНО: от большего к меньшему</text>
  <g transform="translate(40,108)">
    <rect x="0" y="0" width="330" height="176" rx="12" fill="#0f172a"/>
    <text x="16" y="32" font-size="15" font-family="'Consolas',monospace"><tspan fill="#4ade80">if</tspan> <tspan fill="#e2e8f0">ball &gt;= 90:</tspan></text>
    <text x="34" y="56" font-size="15" font-family="'Consolas',monospace" fill="#86efac">print("5")   ← 95 сюда ✓</text>
    <text x="16" y="84" font-size="15" font-family="'Consolas',monospace"><tspan fill="#a78bfa">elif</tspan> <tspan fill="#e2e8f0">ball &gt;= 75:</tspan></text>
    <text x="34" y="108" font-size="15" font-family="'Consolas',monospace" fill="#94a3b8">print("4")</text>
    <text x="16" y="136" font-size="15" font-family="'Consolas',monospace"><tspan fill="#a78bfa">elif</tspan> <tspan fill="#e2e8f0">ball &gt;= 60:</tspan></text>
    <text x="34" y="160" font-size="15" font-family="'Consolas',monospace" fill="#94a3b8">print("3")</text>
  </g>
  <g transform="translate(40,296)">
    <rect x="0" y="0" width="330" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="165" y="26" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">Ответ для 95: «5» — верно 🎉</text>
  </g>

  <!-- RIGHT: wrong -->
  <text x="615" y="94" font-size="16" font-weight="800" fill="#dc2626" text-anchor="middle">❌ ОШИБКА: от меньшего к большему</text>
  <g transform="translate(450,108)">
    <rect x="0" y="0" width="330" height="176" rx="12" fill="#0f172a"/>
    <text x="16" y="32" font-size="15" font-family="'Consolas',monospace"><tspan fill="#4ade80">if</tspan> <tspan fill="#e2e8f0">ball &gt;= 60:</tspan></text>
    <text x="34" y="56" font-size="15" font-family="'Consolas',monospace" fill="#fca5a5">print("3")   ← 95 попал СЮДА ✗</text>
    <text x="16" y="84" font-size="15" font-family="'Consolas',monospace"><tspan fill="#a78bfa">elif</tspan> <tspan fill="#e2e8f0">ball &gt;= 75:</tspan></text>
    <text x="34" y="108" font-size="15" font-family="'Consolas',monospace" fill="#64748b">print("4")  никогда не сработает</text>
    <text x="16" y="136" font-size="15" font-family="'Consolas',monospace"><tspan fill="#a78bfa">elif</tspan> <tspan fill="#e2e8f0">ball &gt;= 90:</tspan></text>
    <text x="34" y="160" font-size="15" font-family="'Consolas',monospace" fill="#64748b">print("5")  никогда не сработает</text>
  </g>
  <g transform="translate(450,296)">
    <rect x="0" y="0" width="330" height="40" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="165" y="26" font-size="15" font-weight="700" fill="#991b1b" text-anchor="middle">Ответ для 95: «3» — отличник в тройках! 😱</text>
  </g>

  <!-- why -->
  <g transform="translate(40,360)">
    <rect x="0" y="0" width="740" height="96" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="24" y="30" font-size="16" font-weight="800" fill="#b45309">Почему так?</text>
    <text x="24" y="56" font-size="14.5" fill="#92400e">Лестница берёт ПЕРВОЕ верное условие. Балл 95 подходит и под <tspan font-family="monospace">&gt;=60</tspan>, и под <tspan font-family="monospace">&gt;=75</tspan>, и под <tspan font-family="monospace">&gt;=90</tspan>.</text>
    <text x="24" y="80" font-size="14.5" fill="#92400e">Стоит <tspan font-family="monospace">&gt;=60</tspan> первым — он «поймает» всех 60+, и до <tspan font-family="monospace">&gt;=90</tspan> дело не дойдёт. Узкие условия — ВЫШЕ.</text>
  </g>

  <text x="410" y="484" font-size="13.5" fill="#475569" text-anchor="middle" font-style="italic">💡 Правило: для «больше-равно» иди от большего к меньшему. Первый подходящий выигрывает.</text>
</svg>
