<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="470" fill="#f7f9fc"/>
  <text x="410" y="36" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">✊✋✌️ Что кого побеждает — круг из трёх правил</text>
  <text x="410" y="60" font-size="14" fill="#64748b" text-anchor="middle">камень тупит ножницы · ножницы режут бумагу · бумага заворачивает камень</text>

  <!-- three nodes of a triangle -->
  <!-- камень (top) -->
  <g transform="translate(410,120)">
    <circle cx="0" cy="0" r="52" fill="#e0e7ff" stroke="#6366f1" stroke-width="3"/>
    <text x="0" y="-6" font-size="34" text-anchor="middle">✊</text>
    <text x="0" y="26" font-size="15" font-weight="700" fill="#4338ca" text-anchor="middle">камень</text>
  </g>
  <!-- ножницы (bottom-right) -->
  <g transform="translate(620,330)">
    <circle cx="0" cy="0" r="52" fill="#fef9c3" stroke="#eab308" stroke-width="3"/>
    <text x="0" y="-6" font-size="34" text-anchor="middle">✌️</text>
    <text x="0" y="26" font-size="15" font-weight="700" fill="#a16207" text-anchor="middle">ножницы</text>
  </g>
  <!-- бумага (bottom-left) -->
  <g transform="translate(200,330)">
    <circle cx="0" cy="0" r="52" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="0" y="-6" font-size="34" text-anchor="middle">✋</text>
    <text x="0" y="26" font-size="15" font-weight="700" fill="#15803d" text-anchor="middle">бумага</text>
  </g>

  <!-- arrows: камень -> ножницы -->
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <!-- камень(410,120) -> ножницы(620,330) -->
  <line x1="452" y1="152" x2="582" y2="292" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="545" y="205" font-size="13.5" font-weight="700" fill="#334155" transform="rotate(47 545 205)">бьёт →</text>
  <!-- ножницы(620,330) -> бумага(200,330) -->
  <line x1="566" y1="345" x2="256" y2="345" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="410" y="368" font-size="13.5" font-weight="700" fill="#334155" text-anchor="middle">← бьёт</text>
  <!-- бумага(200,330) -> камень(410,120) -->
  <line x1="238" y1="292" x2="368" y2="152" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="255" y="205" font-size="13.5" font-weight="700" fill="#334155" transform="rotate(-47 255 205)">бьёт →</text>

  <!-- rules list -->
  <g transform="translate(300,392)">
    <rect x="0" y="0" width="220" height="66" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="110" y="24" font-size="13.5" font-weight="800" fill="#5b21b6" text-anchor="middle">Три победы игрока:</text>
    <text x="110" y="44" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-family="monospace">камень+ножницы · ножницы+бумага</text>
    <text x="110" y="60" font-size="12.5" fill="#4c1d95" text-anchor="middle" font-family="monospace">бумага+камень</text>
  </g>

  <text x="70" y="430" font-size="13" fill="#475569" font-style="italic">💡 одинаковые</text>
  <text x="70" y="448" font-size="13" fill="#475569" font-style="italic">фигуры — ничья</text>
</svg>
