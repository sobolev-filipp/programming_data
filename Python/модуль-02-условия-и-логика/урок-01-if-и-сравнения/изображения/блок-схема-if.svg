<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="500" fill="#f7f9fc"/>
  <text x="410" y="38" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">🔀 Как работает <tspan font-family="monospace" fill="#7c3aed">if</tspan> — развилка на дороге</text>
  <text x="410" y="62" font-size="14" fill="#64748b" text-anchor="middle">программа проверяет условие и решает: выполнять блок или пропустить</text>

  <!-- code on the left -->
  <g transform="translate(40,120)">
    <rect x="0" y="0" width="300" height="120" rx="12" fill="#0f172a"/>
    <text x="18" y="38" font-size="17" font-family="'Consolas',monospace"><tspan fill="#60a5fa">age</tspan> <tspan fill="#94a3b8">=</tspan> <tspan fill="#fbbf24">int</tspan><tspan fill="#e2e8f0">(input(...))</tspan></text>
    <text x="18" y="70" font-size="17" font-family="'Consolas',monospace"><tspan fill="#c084fc">if</tspan> <tspan fill="#e2e8f0">age </tspan><tspan fill="#f472b6">&gt;=</tspan><tspan fill="#e2e8f0"> 18:</tspan></text>
    <text x="46" y="98" font-size="17" font-family="'Consolas',monospace"><tspan fill="#fbbf24">print</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#86efac">"Проходи"</tspan><tspan fill="#e2e8f0">)</tspan></text>
  </g>
  <text x="190" y="262" font-size="12.5" fill="#64748b" text-anchor="middle">отступ 4 пробела = «это тело if»</text>

  <!-- diamond condition -->
  <g transform="translate(560,150)">
    <polygon points="0,-52 132,0 0,52 -132,0" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="0" y="-4" font-size="16" font-weight="700" fill="#5b21b6" text-anchor="middle" font-family="monospace">age &gt;= 18 ?</text>
    <text x="0" y="20" font-size="12.5" fill="#6d28d9" text-anchor="middle">условие верно?</text>
  </g>

  <!-- YES branch (left vertex 428,150 down) -->
  <line x1="428" y1="150" x2="428" y2="268" stroke="#16a34a" stroke-width="2.5"/>
  <polygon points="428,268 422,256 434,256" fill="#16a34a"/>
  <text x="405" y="205" font-size="15" font-weight="800" fill="#16a34a" text-anchor="end">Да ✅</text>
  <rect x="352" y="270" width="152" height="62" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="428" y="298" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle" font-family="monospace">print("Проходи")</text>
  <text x="428" y="320" font-size="12" fill="#15803d" text-anchor="middle">тело выполняется</text>

  <!-- NO branch (right vertex 692,150 down) -->
  <line x1="692" y1="150" x2="692" y2="268" stroke="#dc2626" stroke-width="2.5"/>
  <polygon points="692,268 686,256 698,256" fill="#dc2626"/>
  <text x="715" y="205" font-size="15" font-weight="800" fill="#dc2626" text-anchor="start">Нет ❌</text>
  <rect x="612" y="270" width="168" height="62" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="696" y="298" font-size="14" font-weight="700" fill="#991b1b" text-anchor="middle">тело пропускается</text>
  <text x="696" y="320" font-size="12" fill="#991b1b" text-anchor="middle">ничего не печатает</text>

  <!-- merge -->
  <path d="M 428 332 L 428 386 L 560 386" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M 696 332 L 696 386 L 560 386" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <line x1="560" y1="386" x2="560" y2="404" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="560,404 554,392 566,392" fill="#94a3b8"/>
  <rect x="468" y="406" width="184" height="44" rx="10" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <text x="560" y="433" font-size="14" fill="#334155" text-anchor="middle">программа идёт дальше</text>

  <text x="410" y="480" font-size="13.5" fill="#475569" text-anchor="middle" font-style="italic">💡 if — это вопрос «да или нет». «Да» → выполнить тело с отступом. «Нет» → перепрыгнуть его.</text>
</svg>
