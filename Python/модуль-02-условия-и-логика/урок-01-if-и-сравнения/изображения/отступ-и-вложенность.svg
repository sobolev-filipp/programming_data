<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="820" height="500" fill="#f7f9fc"/>
  <text x="410" y="38" font-size="24" font-weight="700" fill="#1f2937" text-anchor="middle">↹ Отступ решает, что «внутри» <tspan font-family="monospace" fill="#7c3aed">if</tspan></text>
  <text x="410" y="62" font-size="14" fill="#64748b" text-anchor="middle">строки с отступом — тело if (выполняются, только если условие True); без отступа — всегда</text>

  <!-- LEFT: simple if -->
  <text x="60" y="100" font-size="16" font-weight="700" fill="#334155">Обычный if</text>
  <g transform="translate(40,116)">
    <rect x="0" y="0" width="360" height="150" rx="12" fill="#0f172a"/>
    <text x="20" y="36" font-size="16" font-family="'Consolas',monospace"><tspan fill="#c084fc">if</tspan> <tspan fill="#e2e8f0">age </tspan><tspan fill="#f472b6">&gt;=</tspan><tspan fill="#e2e8f0"> 18:</tspan></text>
    <!-- indent guide -->
    <rect x="34" y="46" width="312" height="58" rx="6" fill="#14532d" opacity="0.55"/>
    <text x="54" y="70" font-size="16" font-family="'Consolas',monospace"><tspan fill="#fbbf24">print</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#86efac">"Проходи"</tspan><tspan fill="#e2e8f0">)</tspan></text>
    <text x="54" y="94" font-size="16" font-family="'Consolas',monospace"><tspan fill="#fbbf24">print</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#86efac">"Добро пожаловать"</tspan><tspan fill="#e2e8f0">)</tspan></text>
    <text x="20" y="132" font-size="16" font-family="'Consolas',monospace"><tspan fill="#fbbf24">print</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#86efac">"Программа закончена"</tspan><tspan fill="#e2e8f0">)</tspan></text>
  </g>
  <text x="220" y="286" font-size="12" fill="#64748b" text-anchor="middle">зелёное = тело if (только если 18+) · белое без отступа = всегда</text>

  <!-- RIGHT: nested if 🎓 -->
  <text x="440" y="100" font-size="16" font-weight="700" fill="#334155">🎓 Вложенный if (if внутри if)</text>
  <g transform="translate(440,116)">
    <rect x="0" y="0" width="345" height="150" rx="12" fill="#0f172a"/>
    <text x="18" y="36" font-size="15" font-family="'Consolas',monospace"><tspan fill="#c084fc">if</tspan> <tspan fill="#e2e8f0">age </tspan><tspan fill="#f472b6">&gt;=</tspan><tspan fill="#e2e8f0"> 18:</tspan></text>
    <rect x="30" y="46" width="305" height="94" rx="6" fill="#312e81" opacity="0.5"/>
    <text x="46" y="70" font-size="15" font-family="'Consolas',monospace"><tspan fill="#fbbf24">print</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#86efac">"Совершеннолетний"</tspan><tspan fill="#e2e8f0">)</tspan></text>
    <text x="46" y="96" font-size="15" font-family="'Consolas',monospace"><tspan fill="#c084fc">if</tspan> <tspan fill="#e2e8f0">age </tspan><tspan fill="#f472b6">&gt;=</tspan><tspan fill="#e2e8f0"> 65:</tspan></text>
    <rect x="60" y="106" width="275" height="28" rx="5" fill="#4c1d95" opacity="0.6"/>
    <text x="74" y="126" font-size="15" font-family="'Consolas',monospace"><tspan fill="#fbbf24">print</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#86efac">"Скидка пенсионеру"</tspan><tspan fill="#e2e8f0">)</tspan></text>
  </g>
  <text x="612" y="286" font-size="12" fill="#64748b" text-anchor="middle">двойной отступ = «внутри внутреннего if»</text>

  <!-- error box -->
  <g transform="translate(40,314)">
    <rect x="0" y="0" width="740" height="110" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="24" y="30" font-size="16" font-weight="800" fill="#991b1b">⚠️ Две ошибки отступа, которые встретишь чаще всего:</text>
    <text x="24" y="56" font-size="14.5" fill="#7f1d1d">1. Забыл <tspan font-family="monospace" font-weight="700">:</tspan> в конце строки <tspan font-family="monospace" font-weight="700">if ...</tspan>  →  <tspan font-family="monospace" font-weight="700">SyntaxError</tspan></text>
    <text x="24" y="80" font-size="14.5" fill="#7f1d1d">2. Нет отступа у тела  →  <tspan font-family="monospace" font-weight="700">IndentationError: expected an indented block</tspan></text>
    <text x="24" y="102" font-size="13" fill="#92400e">Отступ = <tspan font-weight="700">4 пробела</tspan> — редактор сам ставит их по Tab; главное, чтобы во всём блоке он был <tspan font-weight="700">одинаковый</tspan>.</text>
  </g>

  <text x="410" y="466" font-size="13.5" fill="#475569" text-anchor="middle" font-style="italic">💡 Двоеточие <tspan font-family="monospace" font-weight="700">:</tspan> открывает блок, отступ показывает его границы. Кончился отступ — кончился if.</text>
</svg>
