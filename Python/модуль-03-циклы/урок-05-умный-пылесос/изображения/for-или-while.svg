<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="800" height="400" fill="#f7f9fc"/>
  <text x="400" y="34" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">🤔 for или while? Смотри, знаешь ли ты длину</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">Знаешь, сколько шагов → for. Не знаешь (едешь «до стены») → while + сенсор.</text>

  <!-- FOR panel -->
  <g transform="translate(40,84)">
    <rect x="0" y="0" width="350" height="280" rx="14" fill="#fff" stroke="#0d9488" stroke-width="2"/>
    <text x="175" y="30" font-size="17" font-weight="800" fill="#0d9488" text-anchor="middle">for — длина ИЗВЕСТНА</text>
    <text x="24" y="62" font-size="14" fill="#334155">«Ровно 9 клеток вправо»</text>
    <rect x="20" y="76" width="310" height="80" rx="10" fill="#0f172a"/>
    <text x="38" y="104" font-size="15" font-family="monospace" fill="#5eead4">for i in range(9):</text>
    <text x="70" y="128" font-size="15" font-family="monospace" fill="#e2e8f0">right()</text>
    <text x="70" y="148" font-size="15" font-family="monospace" fill="#e2e8f0">clean()</text>
    <text x="24" y="186" font-size="13.5" fill="#64748b">Считаешь шаги заранее.</text>
    <text x="24" y="212" font-size="13.5" fill="#64748b">Диагональ, столбец, блок фиксированного</text>
    <text x="24" y="230" font-size="13.5" fill="#64748b">размера — тоже for.</text>
    <text x="24" y="262" font-size="13" fill="#94a3b8">⚠️ Ошибёшься в числе — выедешь за стену.</text>
  </g>

  <!-- WHILE panel -->
  <g transform="translate(410,84)">
    <rect x="0" y="0" width="350" height="280" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <text x="175" y="30" font-size="17" font-weight="800" fill="#7c3aed" text-anchor="middle">while — длина НЕизвестна</text>
    <text x="24" y="62" font-size="14" fill="#334155">«Вправо, ПОКА не упрёшься в стену»</text>
    <rect x="20" y="76" width="310" height="80" rx="10" fill="#0f172a"/>
    <text x="38" y="104" font-size="15" font-family="monospace" fill="#c4b5fd">while not wall_right:</text>
    <text x="70" y="128" font-size="15" font-family="monospace" fill="#e2e8f0">right()</text>
    <text x="70" y="148" font-size="15" font-family="monospace" fill="#e2e8f0">clean()</text>
    <text x="24" y="186" font-size="13.5" fill="#64748b">Едешь, пока сенсор не скажет «стена».</text>
    <text x="24" y="212" font-size="13.5" fill="#64748b">Не нужно считать клетки — сам</text>
    <text x="24" y="230" font-size="13.5" fill="#64748b">остановишься у стены.</text>
    <text x="24" y="262" font-size="13" fill="#94a3b8">✅ Работает в комнате любой ширины.</text>
  </g>
</svg>
