<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="'Segoe UI',system-ui,sans-serif">
  <rect x="0" y="0" width="840" height="470" fill="#f7f9fc"/>
  <text x="420" y="34" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">🔢 Как меняется счётчик по виткам</text>
  <text x="420" y="58" font-size="14" fill="#64748b" text-anchor="middle">count = 1 · while count &lt;= 5: · print(count) · count += 1</text>

  <!-- trace table -->
  <g transform="translate(40,84)">
    <text x="215" y="4" font-size="15" fill="#0f766e" font-weight="700" text-anchor="middle">Трассировка: что происходит на каждом витке</text>
    <!-- header -->
    <g font-size="13.5" font-weight="700" font-family="monospace">
      <rect x="0" y="16" width="90" height="34" fill="#ccfbf1" stroke="#5eead4"/>
      <rect x="90" y="16" width="150" height="34" fill="#ccfbf1" stroke="#5eead4"/>
      <rect x="240" y="16" width="110" height="34" fill="#ccfbf1" stroke="#5eead4"/>
      <rect x="350" y="16" width="80" height="34" fill="#ccfbf1" stroke="#5eead4"/>
      <text x="45" y="38" fill="#0f766e" text-anchor="middle">count</text>
      <text x="165" y="38" fill="#0f766e" text-anchor="middle">count &lt;= 5 ?</text>
      <text x="295" y="38" fill="#0f766e" text-anchor="middle">печать</text>
      <text x="390" y="38" fill="#0f766e" text-anchor="middle">+= 1</text>
    </g>
    <!-- rows -->
    <g font-size="13.5" font-family="monospace">
      <!-- helper rows: y positions 50,84,118,152,186,220 -->
      <g>
        <rect x="0" y="50" width="90" height="34" fill="#fff" stroke="#e2e8f0"/><rect x="90" y="50" width="150" height="34" fill="#dcfce7" stroke="#e2e8f0"/><rect x="240" y="50" width="110" height="34" fill="#fff" stroke="#e2e8f0"/><rect x="350" y="50" width="80" height="34" fill="#fff" stroke="#e2e8f0"/>
        <text x="45" y="72" fill="#1f2937" text-anchor="middle">1</text><text x="165" y="72" fill="#16a34a" text-anchor="middle">True</text><text x="295" y="72" fill="#0d9488" text-anchor="middle">1</text><text x="390" y="72" fill="#64748b" text-anchor="middle">2</text>
      </g>
      <g>
        <rect x="0" y="84" width="90" height="34" fill="#fff" stroke="#e2e8f0"/><rect x="90" y="84" width="150" height="34" fill="#dcfce7" stroke="#e2e8f0"/><rect x="240" y="84" width="110" height="34" fill="#fff" stroke="#e2e8f0"/><rect x="350" y="84" width="80" height="34" fill="#fff" stroke="#e2e8f0"/>
        <text x="45" y="106" fill="#1f2937" text-anchor="middle">2</text><text x="165" y="106" fill="#16a34a" text-anchor="middle">True</text><text x="295" y="106" fill="#0d9488" text-anchor="middle">2</text><text x="390" y="106" fill="#64748b" text-anchor="middle">3</text>
      </g>
      <g>
        <rect x="0" y="118" width="90" height="34" fill="#fff" stroke="#e2e8f0"/><rect x="90" y="118" width="150" height="34" fill="#dcfce7" stroke="#e2e8f0"/><rect x="240" y="118" width="110" height="34" fill="#fff" stroke="#e2e8f0"/><rect x="350" y="118" width="80" height="34" fill="#fff" stroke="#e2e8f0"/>
        <text x="45" y="140" fill="#1f2937" text-anchor="middle">3</text><text x="165" y="140" fill="#16a34a" text-anchor="middle">True</text><text x="295" y="140" fill="#0d9488" text-anchor="middle">3</text><text x="390" y="140" fill="#64748b" text-anchor="middle">4</text>
      </g>
      <g>
        <rect x="0" y="152" width="90" height="34" fill="#fff" stroke="#e2e8f0"/><rect x="90" y="152" width="150" height="34" fill="#dcfce7" stroke="#e2e8f0"/><rect x="240" y="152" width="110" height="34" fill="#fff" stroke="#e2e8f0"/><rect x="350" y="152" width="80" height="34" fill="#fff" stroke="#e2e8f0"/>
        <text x="45" y="174" fill="#1f2937" text-anchor="middle">4</text><text x="165" y="174" fill="#16a34a" text-anchor="middle">True</text><text x="295" y="174" fill="#0d9488" text-anchor="middle">4</text><text x="390" y="174" fill="#64748b" text-anchor="middle">5</text>
      </g>
      <g>
        <rect x="0" y="186" width="90" height="34" fill="#fff" stroke="#e2e8f0"/><rect x="90" y="186" width="150" height="34" fill="#dcfce7" stroke="#e2e8f0"/><rect x="240" y="186" width="110" height="34" fill="#fff" stroke="#e2e8f0"/><rect x="350" y="186" width="80" height="34" fill="#fff" stroke="#e2e8f0"/>
        <text x="45" y="208" fill="#1f2937" text-anchor="middle">5</text><text x="165" y="208" fill="#16a34a" text-anchor="middle">True</text><text x="295" y="208" fill="#0d9488" text-anchor="middle">5</text><text x="390" y="208" fill="#64748b" text-anchor="middle">6</text>
      </g>
      <g>
        <rect x="0" y="220" width="90" height="34" fill="#fff" stroke="#e2e8f0"/><rect x="90" y="220" width="150" height="34" fill="#fee2e2" stroke="#e2e8f0"/><rect x="240" y="220" width="190" height="34" fill="#fef3c7" stroke="#e2e8f0"/>
        <text x="45" y="242" fill="#1f2937" text-anchor="middle">6</text><text x="165" y="242" fill="#dc2626" text-anchor="middle">False</text><text x="335" y="242" fill="#b45309" text-anchor="middle">выход из цикла</text>
      </g>
    </g>
    <text x="215" y="286" font-size="12.5" fill="#64748b" text-anchor="middle">Печатается 1 2 3 4 5. На count = 6 условие ложно — стоп.</text>
  </g>

  <!-- warning: infinite loop -->
  <g transform="translate(500,90)">
    <rect x="0" y="0" width="300" height="300" rx="14" fill="#fff" stroke="#dc2626" stroke-width="2"/>
    <text x="150" y="30" font-size="16" font-weight="800" fill="#dc2626" text-anchor="middle">⚠️ Забыл count += 1 ?</text>
    <rect x="18" y="46" width="264" height="96" rx="8" fill="#0f172a"/>
    <text x="30" y="70" font-size="13" font-family="monospace" fill="#e2e8f0">count = 1</text>
    <text x="30" y="90" font-size="13" font-family="monospace" fill="#e2e8f0">while count &lt;= 5:</text>
    <text x="46" y="110" font-size="13" font-family="monospace" fill="#5eead4">print(count)</text>
    <text x="46" y="130" font-size="12.5" font-family="monospace" fill="#f87171"># нет count += 1</text>
    <text x="150" y="170" font-size="13.5" fill="#991b1b" text-anchor="middle">count всегда = 1</text>
    <text x="150" y="192" font-size="13.5" fill="#991b1b" text-anchor="middle">условие всегда True</text>
    <text x="150" y="222" font-size="17" font-weight="800" fill="#dc2626" text-anchor="middle">БЕСКОНЕЧНЫЙ ЦИКЛ</text>
    <text x="150" y="244" font-size="13" fill="#64748b" text-anchor="middle">программа печатает 1 без конца</text>
    <rect x="40" y="262" width="220" height="28" rx="8" fill="#fee2e2"/>
    <text x="150" y="281" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="700">Остановить: Ctrl + C</text>
  </g>
</svg>
