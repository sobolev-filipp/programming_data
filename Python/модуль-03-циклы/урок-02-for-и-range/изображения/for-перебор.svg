<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="'Segoe UI',system-ui,sans-serif">
  <defs>
    <marker id="fp_ar" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#0d9488"/></marker>
    <marker id="fp_arP" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0" y="0" width="800" height="440" fill="#f7f9fc"/>
  <text x="400" y="34" font-size="23" font-weight="700" fill="#1f2937" text-anchor="middle">🔁 for берёт из коллекции по ОДНОМУ элементу</text>
  <text x="400" y="58" font-size="14" fill="#64748b" text-anchor="middle">На каждом витке следующий элемент попадает в переменную — и выполняется тело.</text>

  <!-- LIST band -->
  <g transform="translate(0,76)">
    <text x="40" y="18" font-size="16" font-family="monospace" fill="#0d9488" font-weight="700">for game in games:</text>
    <g font-size="14.5">
      <rect x="40" y="28" width="150" height="42" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="115" y="54" text-anchor="middle" fill="#0f766e" font-weight="700">Minecraft</text>
      <rect x="200" y="28" width="150" height="42" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="275" y="54" text-anchor="middle" fill="#0f766e" font-weight="700">Roblox</text>
      <rect x="360" y="28" width="150" height="42" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="435" y="54" text-anchor="middle" fill="#0f766e" font-weight="700">Sims</text>
    </g>
    <text x="620" y="46" font-size="12.5" fill="#94a3b8" text-anchor="middle">список из 3 элементов</text>
    <text x="620" y="63" font-size="12.5" fill="#94a3b8" text-anchor="middle">→ 3 витка цикла</text>
    <!-- one clean arrow down to variable -->
    <path d="M275,70 L275,92" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#fp_ar)"/>
    <text x="360" y="88" font-size="12" fill="#0d9488" font-weight="700">на каждом витке — один</text>
    <rect x="200" y="94" width="150" height="38" rx="19" fill="#0f172a"/>
    <text x="275" y="119" font-size="15" font-family="monospace" fill="#5eead4" text-anchor="middle">game</text>
    <path d="M350,113 L408,113" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#fp_ar)"/>
    <text x="470" y="118" font-size="14.5" font-family="monospace" fill="#334155">print(game)</text>
    <text x="275" y="152" font-size="12.5" fill="#64748b" text-anchor="middle">по очереди: Minecraft → Roblox → Sims</text>
  </g>

  <line x1="40" y1="252" x2="760" y2="252" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- STRING band -->
  <g transform="translate(0,272)">
    <text x="40" y="18" font-size="16" font-family="monospace" fill="#7c3aed" font-weight="700">for ch in "кот":</text>
    <text x="250" y="18" font-size="13" fill="#94a3b8">← строка тоже перебирается: по буквам</text>
    <g font-size="18" font-weight="700" font-family="monospace">
      <rect x="40" y="30" width="58" height="50" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="69" y="63" text-anchor="middle" fill="#5b21b6">к</text>
      <rect x="108" y="30" width="58" height="50" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="137" y="63" text-anchor="middle" fill="#5b21b6">о</text>
      <rect x="176" y="30" width="58" height="50" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="205" y="63" text-anchor="middle" fill="#5b21b6">т</text>
    </g>
    <path d="M234,55 L300,55" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#fp_arP)"/>
    <rect x="306" y="36" width="110" height="38" rx="19" fill="#0f172a"/>
    <text x="361" y="61" font-size="15" font-family="monospace" fill="#c4b5fd" text-anchor="middle">ch</text>
    <text x="470" y="50" font-size="14" fill="#334155" font-family="monospace">print(ch)</text>
    <text x="470" y="72" font-size="13" fill="#64748b">выведет: к / о / т (в столбик)</text>
  </g>
</svg>
